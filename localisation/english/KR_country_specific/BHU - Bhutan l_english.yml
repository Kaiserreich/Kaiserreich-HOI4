### Bookmark ###
 BHU_KR_gathering_storm_desc: "It has been just under thirty years since the petty lords of Bhutan were brought to heel under the benevolent rule of the first Bhutanese king, Ugyen Wangchuck. Since his death in 1926, the kingdom has nearly been torn apart by rival claimants and the loss of its British patrons, dashing away any opportunity for real reform and leaving Bhutan as a remote and backwards remnant of the feudal past. In recent years, however, the young King Jigme and his reform-minded allies in the royal court have begun the process of dragging the nation into the 20th century. Will these reformists be successful, or will a new force take form in the Himalayas?"

### Intro Screen ###
 BHU_country_intro_background: "GFX_BHU_intro"
 BHU_country_intro_header: "A Forgotten Corner of the World"
 BHU_country_intro_content: "For centuries, the southern reaches of the Himalayas were host to a collection of tiny warring fiefdoms, fighting each other over petty squabbles and verdant valleys. When the Tibetan lama Zhabdrung Ngawang Namgyal fled to these lands, backwater of the backwater, he found it a perfect home for the Drukpa Lineage of Buddhism, uniting the region under his rule. Founding a dual system of monastic and secular governance, the Zhabdrung fought bravely for decades against Tibetan and Nepalese invaders before his death. In the centuries following, the regional governors, or penlops, usurped control from the Zhabdrung reincarnations, leaving them as little more than relic of a begone golden age.\n\nNew clashes with the outside world would force the nobles of Bhutan to accept the passing of the ages. Following a defeat at the hands of Britain in the Duars region of India, the nobles of Bhutan agreed to cede territories in the south in exchange for British protection and wealth. Seizing on support from the British, negotiated by his allies in the Dorji clan, powerful noble Ugyen Wangchuck would defeat his rivals and centralise control of the region under his rule as a hereditary king, establishing the Wangchuck dynasty in 1907. Following Ugyen’s death in 1926, the Gongzim (Prime Minister) Sonam Topgye Dorji would outmaneuver powerful claimant Tshering Penjor, placing Ugyen’s young son Jigme Wangchuck unto the throne. In the midst of this excitement, the revolution in Great Britain would throw Bhutan’s diplomatic position into question.\n\nBhutan was always on the periphery of Great Britain's sphere, and when the empire began to collapse, it remained firmly on the periphery. As British authority on the Indian subcontinent was clawed away by the Republicans in Bengal, Sonam Topgye Dorji would attempt to renegotiate a healthy coexistence with the new power on the Indian subcontinent, transferring the nominal fealty Bhutan once pledged to the now dying British empire to the new Indian republic. As the conflict in India once again heats up, and with tensions erupting among the nobility of neighbouring Tibet following the death of the 13th Dalai Lama, Bhutan stands as an island of peace and stability amidst this vast sea of chaos."
 BHU_guide: "§MKing Jigme Survives§! ($paternal_autocrat_coloured$ / $authoritarian_democrat_coloured$)\n£white_dot Maintain a Central Authority above Weak (Precarious, Moderate, Strong, or Absolute) during the siege of Cheri Monastery.\n£white_dot §YNote: Central Authority will be lower during the Confrontation at Cheri if the focuses “Secure our Dzongs” “Reorganise the Royal Guard”, and “Secure our Borders” are not taken or their respective initiatives are not funded.§!\n\n§MTshering Penjor Crowned King§! ($paternal_autocrat_coloured$)\n£white_dot For Tshering Penjor to succeed, TWO of the following three must be true: Tshering Penjor must lead the vanguard, Namgyal Bahadur must be head of the Royal Guard, or the mysterious caravan must be caught.\n£white_dot To make Tshering Penjor lead the vanguard, complete the focus §YRaising the Royal Host§! and allow him to lead the royal forces.\n£white_dot To make Namgyal Bahadur head of the guard, complete the focus §YReorganise the Royal Guard§! and select Namgyal Bahadur as the new head.\n£white_dot To catch the mysterious caravan, complete the focus §YSecure our Borders§! and build new outposts on the southern border. Do not abandon these outposts if there is a shortage of laborers. When reports of a mysterious caravan in the south surface, send Sonam Topgye to investigate.\n£white_dot Maintain a Central Authority below Precarious (Weak, Feeble, or Abysmal) during the siege of Cheri Monastery.\n£white_dot If Namgyal Bahadur was not made head of the Royal Guard, then charge Sonam Topgye’s forces at the confrontation between outside Phuentscholing.\n\n§MSonam Topgye Dorji Crowns Jigme Dorji Wangchuck King§! ($paternal_autocrat_coloured$ / $authoritarian_democrat_coloured$)\n£white_dot If you complete the focus §YReorganise the Royal Guard§!, do NOT bring Namgyal Bahadur in as the new head of the Royal Guard.\n£white_dot Complete the focus §YSecure our Borders§! and build new outposts on the southern border. Do not abandon these outposts if there is a shortage of laborers.\n£white_dot When reports of a mysterious caravan in the south surface, send Sonam Topgye to investigate.\n£white_dot Maintain a Central Authority below Precarious (Weak, Feeble, or Abysmal) during the siege of Cheri Monastery.\n£white_dot If Tshering Penjor leads the vanguard, then do not charge Sonam Topgye’s forces at the confrontation between outside Phuentscholing. If he does not lead the vanguard then either option will work.\n\n§MZhabdrung Rinpoche Jigme Dorji Seizes Power§! ($paternal_autocrat_coloured$)\n£white_dot If the focus §YSecure our Borders§! has been completed and new outposts on the southern border have been built, then do NOT have Sonam Topgye investigate the mysterious caravan.\n£white_dot Do not let both Tshering Penjor lead the vanguard and Nampgyal Bahadur lead the Royal Guard.\n£white_dot Maintain a Central Authority below Precarious (Weak, Feeble, or Abysmal) during the siege of Cheri Monastery.\n£white_dot §YNote: Central Authority will be lowest during the Confrontation at Cheri if the focuses “Secure our Dzongs” “Reorganise the Royal Guard”, and “Secure our Borders” are taken, but their respective initiatives are NOT funded.§!"

### Events ###
 bhutan_events.600.t: "A New Chapter for the Hermit Kingdom"
 bhutan_events.600.shared: "Our nation has come a very long way in a very short time, thrust forward into the twentieth century by the tide of fate. As the technologies and theories of the outside world pour in through our mountain valleys, new workshops spring forth and wild metal machines steam over newly laid cobblestones. Our armies march in lockstep, their rifles gleaming in the harsh sun reflecting off the mountainsides, their hearts teeming with passion for their nation. New revenue flows into our coffers and our vassals prostrate themselves low in front of their liege.\n\n"
 bhutan_events.600.d.st: "$bhutan_events.600.shared$It was only the first step - that is what the advisors all said. Already, they frittered about with paper and rulers, designs of new roads, new enterprises, and new weaponry filling their pages and heads in equal measure. The King knew better, though. A tree does not grow in a day - and there were only so many reforms an ancient and venerable Kingdom can take before it bursts. Great strides had been made, and great strides will surely come with time, but for a moment, the King rested, content in their progress."
 bhutan_events.600.d.jw: "$bhutan_events.600.shared$As King Jigme looks out towards a bustling capital, he suddenly feels a surge of pride in his achievements. By his hand, the Kingdom has finally found its potential. The verdant valleys and streaming brooks will flow yet, but new villages and growing emporiums now dot the landscape. Only time will tell what the future holds, but for now, the King has earned a moment of reprieve."
 bhutan_events.600.d.tp: "$bhutan_events.600.shared$From his seat at the head of a limitless feast, the King cannot help but smile. His long denied birthright had been taken by force of will, and so too had Bhutan been crafted into a new nation through the willpower of its people. Through his determination, Tshering Penjor carried the nation further in the last decade than it had progressed in the last century, forging a new nation of steel and feather in equal numbers. Only time will tell what the future holds, but for now, the King can rest, contented in his legacy."
 bhutan_events.600.d.z: "$bhutan_events.600.shared$He came from nothing, anointed by the most holy, and rose to heights none could have imagined. When Ngawang Namgyal, the first Zhabdrung Rinpoche, fled into Bhutan, he found it a paradise waiting to be brought forth into glory and enlightenment. Through his reincarnation, the young Jigme Dorji, Ngawang Namgyal continues to work for this goal, and our recent progress has been inspiring. Bhutan has risen into the new century without forgetting her past, a beautiful combination of ancient wisdom and new technology."
 bhutan_events.600.a: "To a glorious future!"
 bhutan_events.600.b: "Let us now make these reforms permanent!"

 bhutan_events.601.t.st: "A Bright Future for the Himalayas"
 bhutan_events.601.t.jw: "The Thunder Dragon Ascendant"
 bhutan_events.601.t.tp: "The Gift of Magnanimity and Stability"
 bhutan_events.601.t.z: "Cultivating an Enlightened Realm"
 bhutan_events.601.shared1: "They have come to the capital to pledge themselves to a new realm, one which stretches from the balmy foothills of the Duars to the highland steppes of Yushu, and the desertous gateways into Kashmir and Kashgar. There is not a soul who could have foreseen the glorious rise of our nation from our humble origins to these new, outrageous heights. Yet here we stand, the preeminent power of the mountains, the lords of the rooftop of the world, harbingers of a new empire in Asia.\n\n"
 bhutan_events.601.shared2: "\n\nOf course, we must forever remain vigilant. Enemies eye our realm covetously, viewing us as a weak borderland ready to be carved up. Yet we are no victim - our armies are hardened by hard fought campaigns, ready now to defend their glorious victories."
 bhutan_events.601.d.st: "Thousands kneel before the glorious visage of the Druk Gyalpo, the young and lithe King Jigme of the glorious Wangchuck clan. Behind him, the dutiful Gongzim feverishly counts the various banners and marks, tallying the assembled in his head. $bhutan_events.601.shared1$It is under the inquisitive eye of the young dragon, Jigme Dorji Wangchuck, and the steady hand of his loyal mentor, Sonam Topgye Dorji, that the new empire of the Himalayas will rise. They are two visionaries, and the vision that they share is of a glorious new empire of the mountains, a synthesis of the ancient wisdom of their forefathers and the brilliant imagination of the next generation. Of course, much is left to be done, and there is no time to rest on our laurels. While the breadth of our empire is a prize worthy of celebration, we must uplift these new territories, just as we have dragged our homeland out of the darkness of ignorance and stagnation. Some may resist our march for the future, but we cannot let them run us astray.$bhutan_events.601.shared2$"
 bhutan_events.601.d.jw: "Thousands kneel before the glorious visage of the Druk Gyalpo, the stout and fit King Jigme of the glorious Wangchuck clan. $bhutan_events.601.shared1$Jigme Wangchuck’s father united the squabbling Penlops of Bhutan into a Kingdom, and now his son has brought all of the Himalayas under the rightful hand of the Wangchuck clan. Truly, this clan is meant to rule the world! Yet our victory was no easy feat, and our future is far from certain. Thank the heavens, then, that we are lucky enough to enjoy the wisdom of the benevolent rule of the Thunder Dragon King. The people look to their ruler with awe, a figure divinely guided to victory after victory. He will not betray the trust they now put in him. He will lead them onward to a grand future, a synthesis of the ancient traditions and the starry-eyed prognostications of idealistic couriers.$bhutan_events.601.shared2$"
 bhutan_events.601.d.tp: "Thousands kneel before the striking visage of the Druk Gyalpo, the hale and substantial King Tshering Penjor of the glorious Wangchuck clan. They bask in the depth of his smile, and cheer at the call of his jovial laughter. $bhutan_events.601.shared1$The many victories are cause for celebration, and in the heart of our new empire exotic foods from distant neighbours cover the tabletops and the din of raucous celebration fills the halls of the glorious Tshering Penjor. From his formidable fortress he looks out over all of the Himalayas - the guardian of our divine homeland. Tshering Penjor is not a cruel man, and he has precious little interest in bleeding his new vassals dry. In fact, the people of our new empire will surely rejoice when they realize that their new lord is a generous and kind master. So long as they continue to ply Penjor with gifts and riches, he will leave them to their peace and prosperity.$bhutan_events.601.shared2$"
 bhutan_events.601.d.z: "Thousands kneel before the glorious visage of the Zhabdrung Rinpiche, the young and beautiful lama Jigme Dorji. A sea of red hats undulates as the monks and lamas of the great plateau pay their respects to their new overlord. $bhutan_events.601.shared1$From his cloister, the Zhabdrung Rinpoche Jigme Dorji presides over a new cultural rebirth. The schools and monasteries are teeming with a new generation of the enlightened. The Drukpa Kagyu (Dragon Lineage) Buddhist tradition has seen new life, as the various red-hat sects have bent to their newfound power. The Zhabdrung has turned the maintenance of the realm over to his resourceful brother and the learned masters of the monasteries - the Je Khenpo and the Five Lopons. Freed from the petty demands of his temporal subjects, he is free to turn his attention to the mysteries of divine enlightenment (and, of course, to his many wives).$bhutan_events.601.shared2$"
 bhutan_events.601.a: "They will not tear us down from these new heights!"

 bhutan_events.602.t: "Dealing with Nepal"
 bhutan_events.602.d: "Nepal is a land of rugged hills and proud peoples, long perched between mighty neighbors and caught in the eddies of their ambitions. Once a patchwork of warrior kingdoms and merchant enclaves, it is now a humbled frontier of our new empire of the Himalayas, its temples laid low by our armies. Even still, the cancer of resistance remains in the heart of the many aristocrats and elites unseated by our invasion. The Bahun and Chhetri castes cling to whatever power remains in their hands, while village headsmen and powerful landlords either take to the hills or throw their lot with their new rulers. What armed resistance continues to plague our attempts to wrest control stems mainly from former Gurkha soldiers, who are protected by many due to their longstanding status among the people as famed protectors of Nepal. Try as we might, we cannot break their hold over the countryside, leaving much of the region under the de-facto control of these bandits. Furthermore, the reformist intellectuals and fading autocrats who had long fought over control of Kathmandu continue to oppose us, and we will need to deal with their rebelliousness if we wish to hold Nepal.\n\nThe easiest path forward would be to grant autonomy to the local rulers, breaking their alliance with those too radical to swallow the reality of our dominion. While such autonomy would bar us from taking full advantage of our lush and bountiful new lands, it would placate the Nepalese and give us an opportunity to crush the rebels. Alternatively, we could attempt to assert complete control over the region, a costly endeavour, but one which could eventually provide us with the vast natural and human resources of Nepal."
 bhutan_events.602.a: "Create inroads towards true integration"
 bhutan_events.602.b: "Divide and conquer with limited autonomy"
 bhutan_events.602.c: "Grant them sweeping autonomy"

 bhutan_events.603.t: "Dealing with Tibet"
 bhutan_events.603.d.normal: "Tibet is a high and haunted land - windswept, monastic, and stubborn in its isolation. Its people are bound more by prayer and pilgrimage than by any modern sense of state, yet this very faith has made them difficult to bend. The old order lingers still: robed monks and reincarnated lamas wield quiet power in the shadows of their monasteries, while nomadic khampas and valley chieftains refuse all but their own laws. The monastic bureaucracy remains entrenched in the old ways, and even now they whisper resistance in their prayers. In the eastern hills, armed Khampa fighters wage a guerrilla war in the name of spiritual sovereignty, harrying our supply lines and vanishing into the passes. To rule Tibet, we must do more than seize its temples—we must silence its oracles, deal with its monks, and offer the people a new path forward. Until then, the land remains pacified only in appearance, waiting for the wind to change.\n\nAs with Nepal, we must determine our approach towards our newfound conquest. There is no reason why the Tibetan lamas cannot be convinced of the magnanimity of our new empire, and we cannot become dear friends to our northern neighbours. We can offer the minor monks and petty tribal leaders autonomy, bringing them under our thumb while undercutting rebellious movements. Alternatively, we can build a new bureaucracy of loyal administrators to slowly take over our new Tibetan domains, strangling rogue lamas under a tide of tax collectors, toll guards, police, and recruiters."
 bhutan_events.603.d.z: "Tibet is a high and haunted land - windswept, monastic, and stubborn in its isolation. Its people are bound more by prayer and pilgrimage than by any modern sense of state, yet this very faith has made them difficult to bend. The old order lingers still: robed monks and reincarnated lamas wield quiet power in the shadows of their monasteries, while nomadic khampas and valley chieftains refuse all but their own laws. The monastic bureaucracy remains entrenched in the old ways, and even now they whisper resistance in their prayers. In the eastern hills, armed Khampa fighters wage a guerrilla war in the name of spiritual sovereignty, harrying our supply lines and vanishing into the passes. To rule Tibet, we must do more than seize its temples—we must silence its oracles, deal with its monks, and offer the people a new path forward. Until then, the land remains pacified only in appearance, waiting for the wind to change.\n\nNever before has the army of advisors to his most holy highness the Zhabdrung Rinpoche been so divided in their recommendations and demands. Most of the monastic council has expressed their support for a program of reeducation, aiming to snuff out the heterodoxy of the Tibetan sects of Buddhism, so that the people may learn the truths we hold dear. Alternatively, we can simply leave our Tibetan friends alone, granting them autonomy. There is no reason why the Tibetan lamas cannot be convinced of the magnanimity of our new empire, and we cannot become dear friends to our northern neighbours."
 bhutan_events.603.a: "Send more administrators!"
 bhutan_events.603.b: "They will learn appreciate the enlightenment we offer"
 bhutan_events.603.c: "Favour some minor nobles with autonomy"
 bhutan_events.603.e: "Grant the monks all of their traditional privileges"

 bhutan_events.604.t.king: "The Future of the Thunder Dragon Court"
 bhutan_events.604.t.z: "The Future of the Zhung Dratshang"
 bhutan_events.604.sharedfor: "\n\nOne option would be to make our best attempt to forge a new metropolitan capital, home to experts and adventurers from across the globe. These leaders would serve as valued advisors, helping us to bring our nation staggering into the future. Though there would certainly be some opposition to such outside influence on our governance, our people will soon learn the value of open doors."
 bhutan_events.604.sharedtrad: "\n\nOf course, we can always rely on the support and advice of the nobility, ensuring that the voices of the long-standing clans are closely listened to. While the ideas of these great leaders of our kingdom are not exactly...new, sometimes the old traditions are exactly what we need to survive into this dangerous new age, and the support of the Penlops and petty lords will be vital to our continued stability."
 bhutan_events.604.sharedmonk: "\n\nWe can always rely on the wisdom of the monks to provide us with dutiful counsel. This veritable army of learned men, diligently dedicated to prayer and contemplation, could be a valuable conduit for divine guidance. Additionally, their support would do much to quell the growing murmurs of dissent."
 bhutan_events.604.sharedbal: "\n\nThere is, of course, the temptation to play the various factions which have clamoured for a seat at the table against one another, balancing the strength of any individual group with the competition of their rivals. A court filled with nobles, foreigners, monks, and peasants maintains its own balance, as the envious claw away at the power of any ascendant force. This purposeful weakness in the advisory bodies and nodes of informal power gives the ruler newfound freedom to pursue their goals without the meddling of the middle men. Such executive power is not easily won, and the success of such an effort could mark the beginning of a new era of absolutism in the mountains."
 bhutan_events.604.d.st: "The reign of the young king Jigme Dorji has been marked by the power and prominence of courtly advisors, and his success has been the result of the keen insights of some of the smartest and most capable figures in Bhutan. Now that they have achieved staggering and glorious feats, the inner circle of Jigme Dorji’s court have increasingly looked outwards, seeking foreign experts to bolster the knowledge of the realm. However, Sonam Topgye Dorji, long the greatest champion of western reform, has cautioned against the calcification of a foreign advisory body, fearing that it will generate a dangerous vector for anti-government dissent. Instead, he has proposed that we play the various factions against one another to create a stable balance of power in the capital. $bhutan_events.604.sharedfor$ $bhutan_events.604.sharedbal$"
 bhutan_events.604.d.jw: "Jigme has always been a man at the crossroads, ever dragged by his advisors in a hundred directions. It is only through his great personal conviction that he has maintained a steady grip on the raucous court, though this firm moderation has given him unique opportunities to determine his favored path forward. Jigme may place his favor behind the traditional aristocracy, bolstered by newly loyal lordlings from the borderlands of our realm. Alternatively, he could cast his eyes outward, towards the bright minds of foreign lands. Most tempting of all, perhaps, is the opportunity presented by the divisions within our court, divisions ripe for exploitation. $bhutan_events.604.sharedtrad$ $bhutan_events.604.sharedfor$ $bhutan_events.604.sharedbal$"
 bhutan_events.604.d.tp: "Tshering Penjor has always been a joyous host of his loyal subjects, treating them to frequent feasts and gaudy displays, such as his habit of displaying his soldiers’ fierceness in traditional mask dances, while he supports them with the clanging of his cymbals. Tshering Penjor is the traditional champion of the aristocracy, whose personal powers he has oft increased. He is not shackled to his aristocratic allies, however, with friends among the monks and a great interest in foreign visitors, who he has long hosted in his home. It is through these visits that the King has seen the wonders of modern technology, especially captivated by movie pictures (Charlie Chaplin is his favorite). $bhutan_events.604.sharedtrad$ $bhutan_events.604.sharedfor$"
 bhutan_events.604.d.z: "The Zhabdrung Rinpoche Jigme Dorji must reform our burgeoning court, determining how best we shall integrate the voices of our newfound subjects across the Himalayas. While he and his allies in the Zhung Dratshang are most keen on empowering the Buddhist monks from across the monastic mountains of Bhutan and Tibet, the Zhabdrung’s brother has pushed him to instead contemplate balancing the various conflicting factions against one another. $bhutan_events.604.sharedmonk$ $bhutan_events.604.sharedbal$"
 bhutan_events.604.a: "Bring in the foreigners!"
 bhutan_events.604.b: "Trust our noble allies!"
 bhutan_events.604.c: "The monks have never failed us!"
 bhutan_events.604.e: "Play the factions against one another!"

 bhutan_events.605.t: "Shifting Military Priorities"
 bhutan_events.605.shared: "With a new realm comes new responsibilities, the most pressing being the defence of our new borders. We rose to our position of strength on the backs of the loyalty, discipline, and ferocity of our native men, warriors without equal. Armed with limited supplies but driven by their patriotic duty, these men led a charge which shocked the world. Yet now, our army stands at a crossroads. It was the pure dragon spirit of these fearless thousands that brought us to these dazzling heights, but can a few thousand men truly protect us?"
 bhutan_events.605.d.st: "$bhutan_events.605.shared$The young dragon Jigme Dorji has spent much of his youth learning military strategy from the Kingdom’s finest military commanders and foreign experts. Even at his youthful age, he has excelled in his command of military principles, and seeks now to apply this newfound expertise to reform the army’s of the new Himalayan empire. He has been personally drawn to the promise of a broad modernisation campaign, a costly but idealistic approach towards creating a force which can hold its own on the world stage. While this tactic could lead to as of yet unheard of breakthroughs, it would leave the Kingdom vulnerable to immediate threats. Some in the court have instead promoted a nationwide recruitment campaign to alleviate short term concerns. After all, we can always modernise later, but we must defend the borders now. Whichever path Jigme Dorji chooses, these reforms may be the difference between our ascendency and our subjugation."
 bhutan_events.605.d.jw: "$bhutan_events.605.shared$King Jigme is no stranger to military strategy, and in many ways it was under his command that the army of Bhutan rose to the position of power it now enjoys. Yet he has never been one to rest on his laurels. There are many opportunities for reform, however. The strength of the army can be increased through a modernisation campaign, a costly but idealistic approach towards creating a force which can hold its own on the world stage. Alternatively, Jigme could look to the territories, recruiting across the new empire to fill the ranks of his new army. Of course, he can always simply turn to the strengths which lent them victory in the first place - the loyalty and fervor of his code forces. Whatever he chooses, these reforms may be the difference between our ascendency and our subjugation."
 bhutan_events.605.d.tp: "$bhutan_events.605.shared$Tshering Penjor has long staked his legitimacy on his exceptional military prowess and long-standing ties to the Royal Guard. While he has a reputation for stubborn adherence to tradition, Tshering Penjor has eagerly thrown his support behind the expansion and reform of the army, considering it to be a personal pet project. However, the army is largely split on the best path forward to revitalise our armed forces in the light of present geopolitical conditions. Many of our best commanders on the ground have argued that our greatest weakness is discipline, and that our focus should instead be on investing into training for our existing forces. Others have pressed for expansion of the army, seeing a broad force of reservist militias as the best means of dissuading foreign intervention into our realm. After all, if we cannot defend ever mountain pass and border fort, how can we hope to survive against enemy invasion? Whichever path Tshering Penjor chooses, these reforms may be the difference between our ascendency and our subjugation."
 bhutan_events.605.d.z: "$bhutan_events.605.shared$The Zhabdrung Rinpoche is not a military man. He is wary of soldiers, seeing them as the last remnants of the old Wangchuck monarchy. Even among his own loyal warriors, monastic militias who shed their blood for his freedom, the preeminent lama of Bhutan is far from comfortable. These men are crude and rough, with the dangerous glint of rebellion ever present in their eyes. Yet personal enmity is no excuse to ignore the growing stresses on our military. The Zhabdrung, along with most of his militia advisors, favors the expansion of the armed cadres to man the Dzongs and meet the oncoming threat of foreign invasion head on. However, there are others who have called for a vastly different approach - that the common soldiers of our nation be better instilled with patriotic fervor in their leader, through a concerted program of religious and political education. After all, there is nothing more dangerous than a motivated militiaman, and there is no force which could possibly motivate more than the glory of the Zhabdrung Rinpoche reborn. Whichever path Jigme Dorji chooses, these reforms may be the difference between our ascendency and our subjugation."
 bhutan_events.605.a: "Focus on Expansion and Recruitment"
 bhutan_events.605.b: "Focus on Training and Discipline"
 bhutan_events.605.c: "Focus on Integrating Foreign Arms"

 bhutan_events.606.t: "The Thunder Dragon Rises!"
 bhutan_events.606.d: "By the wisdom of our sovereign and the valor of our armies, the scattered highlands have been drawn together into one unbroken realm—the Empire of the Himalayas, sovereign from the snows of Ladakh to the green hills of the Terai. Let her glory be shouted across the roof of the world and out beyond its misted valleys, and let our enemies quake in the face of our resolve.\n\nWhat once was fractured under the rule of squabbling clans, sclerotic courts, and fading empires, is today united beneath the banner of the Thunder Dragon. The idle lamas of Lhasa, the rentier princes of Kathmandu, and the absentee landlords of the valleys have been cast aside. No longer shall the mountain peoples be tools of foreign ambitions or prisoners of ancient stagnation. They are now citizens of a greater destiny - let the old maps be redrawn!"
 bhutan_events.606.a: "Ngawang Namgyal’s wildest dreams, realized..."

 bhutan_events.700.t: "The Plight of Sikkim"
 bhutan_events.700.d.rajaligned: "The tiny mountain kingdom of Sikkim long existed in a state similar to that of our own realm, protected by isolation and cunning diplomatic pacts with the British hegemon in India. At the crossroads between the Buddhists of the Himalayas and the Gorkha Kingdoms, the region passed back and forth through various invasions, occupations, and migrations. The native Buddhist Lepcha peoples have long been supplanted in numbers by Hindu Nepalese migrants, though their number have been supplemented by the introduction of several Tibetan Bhutia clans. Though the Nepalese invasions were numerous, until recent days the faithful Lepcha and Bhutia families had maintained devout Buddhist rule over the region. During the panicked British withdrawal at the height of the Indian Emergency, however, Nepalese forces moved into the region and evicted the Chogyal King Tashi Namgyal. He was forced to flee with his most loyal retainers into western Bhutan, where he was warmly received by our devout subjects. The continued occupation of Sikkim by Nepal is an intolerable injustice, one which only grows more difficult to swallow as more and more stories of discrimination against the Lepcha and Bhutia at the hands of the Nepalese occupiers are brought to our attention.\n\nMost recently, our guest the Chogyal attempted to find some support for military intervention at the height of recent conflict between the Rana family and republican revolutionaries. With the victory of the Ranas, however, Nepal has come firmly under the protection of the British Dominion as yet another piece in the battle for India. Any attempts to liberate the Buddhists of Sikkim would now bring about the ire of the former overlords, who had long ago battered our realm into submission, and who could once again. While we remain firmly committed to freeing Sikkim from the chains of Nepalese oppression, the truth is that there is little, if any, chance remaining that Tashi Namgyal will once again return to his seat in Tsuklakhang Palace."
 bhutan_events.700.d.hndaligned: "The tiny mountain kingdom of Sikkim long existed in a state similar to that of our own realm, protected by isolation and cunning diplomatic pacts with the British hegemon in India. At the crossroads between the Buddhists of the Himalayas and the Gorkha Kingdoms, the region passed back and forth through various invasions, occupations, and migrations. The native Buddhist Lepcha peoples have long been supplanted in numbers by Hindu Nepalese migrants, though their number have been supplemented by the introduction of several Tibetan Bhutia clans. Though the Nepalese invasions were numerous, until recent days the faithful Lepcha and Bhutia families had maintained devout Buddhist rule over the region. During the panicked British withdrawal at the height of the Indian Emergency, however, Nepalese forces moved into the region and evicted the Chogyal King Tashi Namgyal. He was forced to flee with his most loyal retainers into western Bhutan, where he was warmly received by our devout subjects. The continued occupation of Sikkim by Nepal is an intolerable injustice, one which only grows more difficult to swallow as more and more stories of discrimination against the Lepcha and Bhutia at the hands of the Nepalese occupiers are brought to our attention.\n\nMost recently, our guest the Chogyal attempted to find some support for military intervention at the height of recent conflict between the Rana family and republican revolutionaries. With the victory of the revolutionaries, however, Nepal has come firmly under the protection of the Indian Republic as yet another piece in the battle for India. Any attempts to liberate the Buddhists of Sikkim would now bring about the ire of our mighty neighbour to the south, a move which would verge on suicidal. While we remain firmly committed to freeing Sikkim from the chains of Nepalese oppression, the truth is that there is little, if any, chance remaining that Tashi Namgyal will once again return to his seat in Tsuklakhang Palace."
 bhutan_events.700.a: "The exiled king’s pleas go unanswered."

 bhutan_events.701.t: "An Opportunity in Sikkim?"
 bhutan_events.701.d.zhab: "The tiny mountain kingdom of Sikkim long existed in a state similar to that of our own realm, protected by isolation and cunning diplomatic pacts with the British hegemon in India. At the crossroads between the Buddhists of the Himalayas and the Gorkha Kingdoms, the region passed back and forth through various invasions, occupations, and migrations. The native Buddhist Lepcha peoples have long been supplanted in numbers by Hindu Nepalese migrants, though their number have been supplemented by the introduction of several Tibetan Bhutia clans. Though the Nepalese invasions were numerous, until recent days the faithful Lepcha and Bhutia families had maintained devout Buddhist rule over the region. During the panicked British withdrawal at the height of the Indian Emergency, however, Nepalese forces moved into the region and evicted the Chogyal King Tashi Namgyal. He was forced to flee with his most loyal retainers into western Bhutan, where he was warmly received by our devout subjects. The continued occupation of Sikkim by Nepal is an intolerable injustice, one which only grows more difficult to swallow as more and more stories of discrimination against the Lepcha and Bhutia at the hands of the Nepalese occupiers are brought to our attention.\n\nRecent events in Kathmandu may have finally given us a window to act. Having defeated both the Rana family and radical revolutionaries, King Tribhuvan of Nepal has charted a new course of neutrality and independence for Nepal. Without the threat of British or Indian intervention, military intervention into Sikkim may finally be viable. Chogyal Tashi Namgyal is bound to the Dorji family by marriage and has pledged himself as a vassal to the Bhutanese crown if we are able to return him to his seat in Tsuklakhang Palace. He has promised that he can raise several loyal noble Bhutia and Lepcha clans against the occupation, should we lend him support. By agitating for native resistance against the Nepalese, we may be able to convince the newly empowered Nepalese king to abandon his occupation of Sikkim. If he instead moves to crush the Chogyal’s supporters, we would have firm justification for a military intervention to free our oppressed brothers. Poking the Nepalese tiger may not be the best course of action, however, as they may respond to our prodding with the outright invasion of our homeland."
 bhutan_events.701.d.notzhab: "The tiny mountain kingdom of Sikkim long existed in a state similar to that of our own realm, protected by isolation and cunning diplomatic pacts with the British hegemon in India. At the crossroads between the Buddhists of the Himalayas and the Gorkha Kingdoms, the region passed back and forth through various invasions, occupations, and migrations. The native Buddhist Lepcha peoples have long been supplanted in numbers by Hindu Nepalese migrants, though their number have been supplemented by the introduction of several Tibetan Bhutia clans. Though the Nepalese invasions were numerous, until recent days the faithful Lepcha and Bhutia families had maintained devout Buddhist rule over the region. During the panicked British withdrawal at the height of the Indian Emergency, however, Nepalese forces moved into the region and evicted the Chogyal King Tashi Namgyal. He was forced to flee with his most loyal retainers into western Bhutan, where he was warmly received by our devout subjects. The continued occupation of Sikkim by Nepal is an intolerable injustice, one which only grows more difficult to swallow as more and more stories of discrimination against the Lepcha and Bhutia at the hands of the Nepalese occupiers are brought to our attention.\n\nRecent events in Kathmandu may have finally given us a window to act. Having defeated both the Rana family and radical revolutionaries, King Tribhuvan of Nepal has charted a new course of neutrality and independence for Nepal. Without the threat of British or Indian intervention, military intervention into Sikkim may finally be viable. Several of monastic and aristocratic exiles from the tiny Himalayan kingdom have approached us to support a revolt of the Bhutia and Lepcha tribes against their oppressors in Kathmandu, offering to join our realm as vassals if we should manage to expel the Nepalese invaders. By agitating for native resistance against the Nepalese, we may be able to convince the newly empowered Nepalese king to abandon his occupation of Sikkim. If he instead moves to crush the Chogyal’s supporters, we would have firm justification for a military intervention to free our oppressed brothers. Poking the Nepalese tiger may not be the best course of action, however, as they may respond to our prodding with the outright invasion of our homeland."
 bhutan_events.701.a: "Promise them our support!"
 bhutan_events.701.b: "We cannot afford to take such risks."

 bhutan_events.702.t: "Bloodbath in Sikkim"
 bhutan_events.702.d: "The situation in Sikkim has escalated rapidly, leading to open warfare in the capital of Gangtok between Bhutia and Lepcha irregulars and Nepalese police. Our Buddhist brothers have managed to seize control of the city, wresting it from the hands of the Nepalese oppressors. The exiled Chogyal Tashi Namgyal has mustered his small band of royalist forces to join this nascent revolution, and has called on us to follow through with our promises to him by committing our own soldiers to this fight. While Nepal is a strong power, this may be our best chance to clip their wings before they cast their eyes on our homeland. We may end up hanging with the Sikkimese today, but if we leave them to their fate we will surely one day hang alongside them. Then again, we can always back out and leave the people and Chogyal of Sikkim to their fate."
 bhutan_events.702.a: "We owe Sikkim nothing. Back out."
 bhutan_events.702.b: "The time to fight is now!"

 bhutan_events.703.t: "Victory in Sikkim"
 bhutan_events.703.d: "After hard fighting, our forces and our allies have secured Sikkim. Coming to us with their tails between their legs, the government in Kathmandu has offered to withdraw from their possessions in Sikkim and the surrounding countryside. We must seize on this incredible victory and move quickly to accept the Nepalese concessions. Victory in Sikkim will give us a new position of power and authority in the Himalayas, showing us as defenders of Buddhism against foreign incursion, and as a militant force to be reckoned with in the region.\n\nWith our victory over the Nepalese, we must now move to integrate Sikkim, leveraging our connections with local Bhutia elites to secure the countryside. While Sikkim will have significant independence in their domestic affairs, we must unite under a common defense against further foreign intrusion, bringing the Lotus Throne under the protection of the great Thunder Dragon."
 bhutan_events.703.a: "The Thunder Dragon Roars!"

 bhutan_events.704.t: "Nepal Abandons Sikkim"
 bhutan_events.704.d: "Following their expulsion from Gangtok and Sikkim at the hands of patriotic Buddhist revolutionaries, it appears that the Nepalese have quickly realized the futility of attempting to once again bring these spirited people under their yoke. Already, they have reached out to our government, seeking a negotiated withdrawal from the region. This shocking victory has reversed a foreign injustice and has given us newfound authority in the Himalayas.\n\nWith our victory over the Nepalese, we must now move to integrate Sikkim, leveraging our connections with local Bhutia elites to secure the countryside. While Sikkim will have significant independence in their domestic affairs, we must unite under a common defense against further foreign intrusion, bringing the Lotus Throne under the protection of the great Thunder Dragon."
 bhutan_events.704.a: "They were wise to leave while they could!"

 bhutan_events.705.t: "Victory in Sikkim"
 bhutan_events.705.d: "Long having suffered under the boot heel of the Nepalese, the people of Sikkim have been liberated by our valiant forces. Truly, it is surprising that we managed to triumph over the overwhelming might of our enemies, but regardless the Bhutia and Lepcha people are overjoyed with our victory. What we will do in the future is yet to be determined, but we can rest assured that we have already acquitted ourselves as the defenders of the faithful in Sikkim."
 bhutan_events.705.a: "Three cheers for Sikkim!"

 bhutan_events.710.t: "Grumbling in Sikkim"
 bhutan_events.710.d: "The mountain region of Sikkim is a backwards and sleepy place on the far outskirts of our domain, a dumping ground for administrators and officers who have not particularly distinguished themselves. Because of this practice, very little information regarding local happenings there make their way back to Kathmandu. Recently, however, a protest campaign, led by the former Head Lama of the notable Rumtek monastery Lhendup Dorji, has made a splash. Dorji and his brother, Phag Tshering, lead the Young Men Buddhist Association, a political and education group agitating for increased rights for the tiny province’s Buddhist minority. This minority, made up of the Bhutia and Lepcha natives, had long ruled over the region’s Nepalese majority, and the recent reversal of fortunes has led to some anger among their number.\n\nThis movement is insignificant, and can be easily taken care of by local forces. However, it may be in our best interest to take a more active role in policing Sikkim in the face of this new protest movement, demanding that the local administrators forward all pertinent information directly to the King as the situation develops."
 bhutan_events.710.a: "Sikkim requires more direct rule from Kathmandu."
 bhutan_events.710.b: "The local administrators are more than capable."

 bhutan_events.711.t: "Bloodbath in Gangtok"
 bhutan_events.711.d: "Recent protests against our control over the far flung province of Sikkim have escalated significantly following a recent and particularly bloody clash between Bhutia monks and students and our police forces. The Bhutia dissidents, led by the Young Men Buddhist Association and the monks of Rumtek and Bhutia Busty Monasteries, provoked our loyal police while occupying the central square of Gangtok, leading to the death of six riotous protestors. While the officers present have uniformly maintained that the unfortunate violence against the Bhutia protestors was the result of revolutionary rioting, Bhutia leadership have already called the event the “Bloodbath in Gangtok”, calling it an unprovoked massacre.\n\nWe will need to respond to this calamitous event swiftly to regain the discourse initiative, before the dead in Gangtok are held up as martyrs and used to fuel even more dissent. We could formally discipline the police officers involved in the handling of this situation, replacing them with more diplomatic figures from elsewhere in the Kingdom. Of course, taking action against the defenders of our authority (even if they are guilty) will be unpopular domestically, and public support for them may rally our people patriotically."
 bhutan_events.711.a: "Publicly support the officers for their bravery!"
 bhutan_events.711.b: "Publicly punish the officers for their stupidity!"

 bhutan_events.712.t: "Lepcha People Join Sikkim Protests"
 bhutan_events.712.d: "Sikkim is split into three main ethnic groups, of which the Nepalese make up around 60% of the citizenry. Of the remainder, roughly half are members of the Lepcha native tribes, and the other half belong to the Tibetan Bhutia migrants who had formerly ruled the region. While many Bhutia elites have chafed against our administration of Sikkim from the day it began, the Lepcha have remained mostly quiet and docile, avoiding any outward expressions of dissent against us. Following the recent deaths in Gangtok, however, the winds have shifted, and a number of Lepcha clan leaders have begun to meet with various prominent Bhutia business and aristocratic leaders. Thousands of young Lepcha men have since taken to the streets of Gangtok, joining the burgeoning Bhutia protest marches.\n\nThis union between the two Buddhist groups is worrying, to say the least. While the Bhutia and Lepcha are separately manageable minority groups, their numbers together almost eclipse that of the Nepalese in the province. Some of our leaders on the ground in Sikkim are optimistic, however, proposing that we make a concerted effort to promote inter-tribal infighting between the Bhutia and Lepcha peoples. Drawing on years of feuds and conflicts, they believe that investments into a few key informants and false flag operations would poison the waters between certain Bhutia and Lepcha tribes, considerably weakening further attempts to unify these groups."
 bhutan_events.712.a: "Fund a campaign to divide them!"
 bhutan_events.712.b: "Simply mitigate what we can cheaply."

 bhutan_events.713.t: "Sikkim Riots Spiral"
 bhutan_events.713.d: "Protests in the small city Gangtok, the capital of Sikkim, by the Bhutia and Lepcha minorities have been consistently growing both in scale and violence in the last weeks, a brewing pot of sectarian anger threatening to spill over. In the last few days, it appears that it truly has. A massive march of protesters through the streets of Gangtok has been met with an opposing army made up of their Nepalese neighbours, who have grown more and more frustrated with Bhutia and Lepcha complaints. These masses of young men clashed, engulfing the city into a maelstrom of sectarian violence which has rapidly spilt out into the countryside, overwhelming our limited police presence and wreaking havoc on the community.\n\nOur police commanders on the ground have regrouped and are looking to us for direction. They can either attempt to quell the violence and quench the growing fires of outright revolt among the natives, or instead march alongside the vigilantes to cleanse the province of this revolutionary threat. Either way, this violence cannot be ignored, and we expect diplomatic complaints regarding the situation, particularly from Tibet and Bhutan, where the former royal family remains in exile."
 bhutan_events.713.a: "Rein in the vigilantes and promote peace!"
 bhutan_events.713.b: "Fan the flames and burn out these rebels!"

 bhutan_events.714.t: "The Battle for Sikkim Begins"
 bhutan_events.714.d: "Shockingly enough, when our police began to restore order to Gangtok, they were not met merely with an unruly mob of rioters. They were instead ambushed by columns of irregular soldiers, dressed in the traditional garb of monks and tribesmen, who fired on our forces from vantage points on tiled rooftops and hidey holes in twisting alleyways. While our police initially pressed on into the city center, their morale rapidly declined in the face of concerted resistance, forcing them to retreat from the city.\n\nWhile our forces were initially optimistic regarding their ability to regroup and retake Gangtok, news of an invasion into the province through the dense Pangolakha Forest by Bhutanese soldiers and Sikkimese exiles has shattered the cohesion of our forces in the region. Without reinforcements from the borderlands, our police forces were outflanked by the Bhutia and Lepcha irregulars in the capital, while our checkpoints in the Darjeeling foothills have been outflanked by the audacious attack from Bhutan. With our grip on Sikkim broken, we will need to move quickly to restore order and punish these Bhutanese interlopers. If we do not crush this revolt quickly, we will be forced to rethink whether fighting over the mountain backwater of Sikkim is really worth it. Of course, we can always withdraw and be done with this painful backwater permanently. After all, Sikkim has already caused more trouble for us than it is worth."
 bhutan_events.714.a: "Marshal our forces!"
 bhutan_events.714.b: "Screw Sikkim, we are done!"

 bhutan_events.715.t: "Crushing the Sikkim Revolt"
 bhutan_events.715.d: "Shockingly enough, when our police began to restore order to Gangtok, they were not met merely with an unruly mob of rioters. They were instead ambushed by columns of irregular soldiers, dressed in the traditional garb of monks and tribesmen, who fired on our forces from vantage points on tiled rooftops and hidey holes in twisting alleyways. While our police initially pressed on into the city center, their morale rapidly declined in the face of concerted resistance, forcing them to retreat from the city.\n\nHowever, our forces were able to regroup in the countryside outside Gangtok. When rumours of invasion by Sikkimese exiles from neighbouring Bhutan fizzled out, our police forces were able to surround the city with the aid of local border units who drew back from the border. With Gangtok surrounded and external aid cut off, the rebel morale quickly plummeted, leaving the irregular Bhutia and Lepcha militias to scatter. With the nucleus of rebel forces routed, the broader protest movement was left to the whims of emboldened locals, who took to the streets to crush the protesters decisively. Protester and police corpses line the street in even numbers, but stability has been restored."
 bhutan_events.715.a: "Finally, this dark chapter is over."

 bhutan_events.716.t: "Failure in Sikkim"
 bhutan_events.716.d: "The campaign to regain Sikkim has been nothing short of an unmitigated disaster. Facing off against backwards bands of hill tribesmen and feudal warriors, our modern army has struggled to pin down the enemy and retake lost ground. Setback after setback has left us firmly on the backfoot, and the initiative cannot be so easily regained. In Kathmandu, government insiders and citizens alike have begun clamouring for withdrawal, claiming that a collection of mountain hovels in the distant reaches of our kingdom are not worth the bodies returning back in bags and boxes. Rumour indicates that the Sikkim rebels and their Bhutanese allies are highly interested in reaching a negotiated peace, and would certainly accept the borders as they currently stand. With pressure rising for a withdrawal, a recommitment of our forces into Sikkim and Bhutan will be highly unpopular and politically costly. Then again, the pride of our nation is worth everything and anything!"
 bhutan_events.716.a: "Let us be done with this costly farce."
 bhutan_events.716.b: "We will not give up, no matter the cost!"

 bhutan_events.720.t: "Indo-Bhutanese Relations Break Down"
 bhutan_events.720.d: "Responding to the rise of [HND.GetLeader] as leader of the Indian Republic, we have sent a small group of advisors and emissaries south to meet with this new firebrand government, hoping to smooth over any diplomatic disagreements before they come to a head. Unfortunately, our diplomats have been turned away at the Indian border, which has significantly tightened following the rise of this new government. It seems that [HND.GetLeader]’s promise to cease all negotiations with “foreign leeches” is more than just bark. It is becoming clearer by the day that our once relatively close relationship will not survive this new government, and with a new enemy on our borders, domestic traditionalist isolationism has been irrevocably stoked."
 bhutan_events.720.a: "Tragic."

 bhutan_events.721.t: "Warming Relations with India"
 bhutan_events.721.d: "With the solidification of [HND.GetLeader]’s government in the Indian Republic, our neighboring behemoth has invited Sonam Topgye Dorji to visit Calcutta. After a few days of pleasantries, our counterparts in India proposed limited expansions to their economic partnership with our realm, granting us guaranteed investments into key industries, in return for limited natural resource concessions in our southern lowlands, particularly in the lumber industry. India has even outlined a potential joint hydroelectric project, which would provide electricity for Bhutan and Assam using Bhutanese river power, though these proposals are unlikely to pan out in the near future. Sonam Topgye Dorji has taken the initiative to accept these bilateral agreements on behalf of the king, promising a new and exciting chapter for the two nations’ partnership."
 bhutan_events.721.a: "A fair trade!"

 bhutan_events.722.t: "Abandoning the Treaty of Phuentscholing"
 bhutan_events.722.d.tp: "In many ways, the Treaty of Phuentscholing was the personal achievement of the slippery Sonam Topgye Dorji, who leveraged his position in court to fill his own pockets with Indian money. With the recent rise of Tshering Penjor, however, the old Gongzim lacks the influence to continue selling our realm to the southerners, and little reason to maintain diplomatic trappings with the Indians. On the one hand, this withdrawal has been difficult for our attempts to bring any sort of money or investment into our nation, but on the other hand the stability of the realm can only be improved by preventing the flow of Indian money into the pockets of Sonam Topgye Dorji, money he would likely use to bankroll a coup against our government. As far as the Indians are concerned, Tshering Penjor is a safe man to lead Bhutan. He has precious little loyalty to their enemies on the subcontinent, and little care for how much aid flows into his fiefdom, so long as he continues to receive generous personal gifts. The relationship between Bhutan and India may not be dead, but Sonam Topgye’s treaty certainly is."
 bhutan_events.722.d.z: "With the destruction of the Wangchuck kingdom and the rise of the new monastic government in Bhutan, the relationship between our realm and the Indians to the south has been thrown into flux. While the Zhabdrung’s cousin Choekyi Gyeltshen has extensive personal contacts in Calcutta, the disappearance of Sonam Topgye and Jigme Dorji Wangchuck into India has led to rising paranoia over potential Indian intervention against our enlightened regime. With this sword of damocles hanging over us, there is little impetus to seek any sort of resumption of the Wangchuck’s treaties with the Republic. For their part, the Indians have done nothing to assuage our fears, and have treated our new government with aloof indifference. While there is little chance that they will turn their guns on us while their attention is caught by their opponents on the subcontinent, there is no doubt that the kinship cultivated by Sonam Topgye Dorji is dead."
 bhutan_events.722.a: "The treaty made us weak!"

 bhutan_events.723.t: "Dealing with the Hermit Kingdom"
 bhutan_events.723.d.hndnopht: "For years, Bhutan existed on the periphery between the Chinese and Indian spheres of control, serving as both a gateway and a battleground between these forces. In the backdrop of the foolish reactionary pissing match between the monstrous British Imperialists and their Russian enemies, Bhutan was brought into the fold of the old Raj as a means of crushing dissent in Tibet. When our revolution pushed the British and their Princely lapdogs out of the east, the Bhutanese came to us, offering to help stabilise our northern border and prevent the Nepalese and Tibetans from taking advantage of our weakness. While we were busy with our enemies to the south and west, it was preferable to be at peace with our northern neighbours, as perfidious as they may be. With the colonialist forces in India defeated, however, we should decide what to do with Bhutan. We could offer the Bhutanese protection as an “associated nation” in return for surrendering some small elements of sovereignty to us, though the recent dissolution of the Treaty of Phuentscholing raises new question. Bearing that in mind, now may be the perfect time to move against the tiny kingdom, allowing us to dictate our new relationship at the point of our bayonets. Maintaining the status quo may be best, as the small nation provides a nice buffer between us and China."
 bhutan_events.723.d.hndpnt: "For years, Bhutan existed on the periphery between the Chinese and Indian spheres of control, serving as both a gateway and a battleground between these forces. In the backdrop of the foolish reactionary pissing match between the monstrous British Imperialists and their Russian enemies, Bhutan was brought into the fold of the old Raj as a means of crushing dissent in Tibet. When our revolution pushed the British and their Princely lapdogs out of the east, the Bhutanese came to us, offering to help stabilise our northern border and prevent the Nepalese and Tibetans from taking advantage of our weakness. While we were busy with our enemies to the south and west, it was preferable to be at peace with our northern neighbours, as perfidious as they may be. With the colonialist forces in India defeated, however, we should decide what to do with Bhutan. We could expand the relationship we have built with the Bhutanese in the last decade, offering them protection as an “associated nation” in return for surrendering some small elements of sovereignty to us. Then again, now may be the perfect time to move against the tiny kingdom, allowing us to dictate our new relationship at the point of our bayonets. Maintaining the status quo may be best, as the small nation provides a nice buffer between us and China."
 bhutan_events.723.d.raj: "For years, Bhutan existed on the periphery between the Chinese and Indian spheres of control, serving as both a gateway and a battleground between these forces. In the backdrop of the Great Game between our Raj and the treacherous Russians, Bhutan was brought into the fold as a gateway into our interests in Tibet. When we were forced to retreat from our positions in Bengal and Assam, the Bhutanese betrayed us by recognising the violent rebellion as the true successor to our rule. With our control over India reasserted, various Bhutanese agents have come to us with hats in hands, claiming that they had resisted against the revolutionary menace as long as they were able, only giving in to their demands in the face of invasion. We could forgive the tiny Bhutan, reforging the old protectorateship we held over them, or instead repay them for their betrayal by marching on Punakha and dictating our new relationship at the point of our bayonets. Of course, we can always simply leave them be as a neutral and independent buffer state, as they are unlikely to stir up trouble against us or our neighbours if left alone."
 bhutan_events.723.d.prf: "For years, Bhutan existed on the periphery between the Chinese and Indian spheres of control, serving as both a gateway and a battleground between these forces. In the backdrop of the Great Game between British Imperialists and their Russian enemies, Bhutan was brought into the fold of the old Raj as a means of influencing Tibet. When British forces withdrew from their positions in northeastern India, the Bhutanese turned their backs on their former benefactors, instead seeking the support and protection of the revolutionaries in Calcutta. With these two would-be overlords defeated at our hands, the question of how exactly we should approach Bhutan has come to the forefront. Should we offer to make them a protectorate of our new federation, they would likely jump at the opportunity to swear fealty to us in return for their (limited) independence. Alternatively, we could simply march on their weak feudal armies, crushing their resistance and determining their future at the tip of our bayonets. Of course, we can always simply leave them be as a neutral and independent buffer state, as they are unlikely to stir up trouble against us or our neighbours if left alone."
 bhutan_events.723.a: "Leave them alone."
 bhutan_events.723.b: "Offer them 'protection.'"
 bhutan_events.723.c: "Let’s crush this tinpot kingdom!"

 bhutan_events.724.t: "The Indians Offer Protection"
 bhutan_events.724.d: "With India divided, our independence has been largely secured by our relative insignificance. With all eyes turned to the fronts between the forces battling for control of the subcontinent, few cared to look north to the gateway of the Himalayas. Now that India has been unified, however, our ability to remain out of sight and out of mind has disappeared. Luckily for us, however, it is not tanks which are streaming up the mountain passes, but instead diplomats, bearing a prospective new arrangement between our nations. They have offered to provide us with funds and protect our border against the rising Chinese powers, in return for control over our foreign relations and the right to station Indian soldiers in our nation. Along with this promise comes the threat that if we decline their protection, they may become the very threat we need to protect against.\n\nMany warn that by accepting this offer, we will become nothing more than an Indian puppet. However, is it not better to rule firmly as the vassal to a powerful lord, when the alternative is bloody conflict?"
 bhutan_events.724.a: "Accept their offer!"
 bhutan_events.724.b: "We will never accept foreign domination!"

 bhutan_events.725.t: "Bhutan Rejects our Offer!"
 bhutan_events.725.d: "The foolish Bhutanese have rejected our incredibly generous offer for protection, dooming themselves to continue their existence as a worthless mountain backwater. In their shortsightedness, they could not understand the clear and immeasurable benefits they could have reaped had they joined us peacefully. Now, the only question which remains is whether to crush them, or to leave them to their irrelevance. While their armies are insignificant and barely armed, the terrain of their territories is treacherous, meaning it will be likely that we will suffer some losses in their god-forsaken mountains should we move forward with an attack. Then again, we simply cannot leave them on the maps as a symbol of defiance against our generous rule!"
 bhutan_events.725.a: "We will teach them a lesson in manners!"
 bhutan_events.725.b: "They are not worth the trouble."

 bhutan_events.726.t: "Bhutan Accepts our Offer!"
 bhutan_events.726.d: "The wise Bhutanese have accepted our incredibly generous offer for protection, throwing off the shackles of their isolation and joining us in a new and bountiful partnership. We have quickly moved to formalize new arrangements between our nations, setting up our own watchposts along their borders and drafting a new joint training programme for their woeful regiments. Furthermore, our new commitments to the tiny kingdom have spurred an exciting new wave of merchants to travel north, all seeking to be the first to take advantage of the new trade and investment opportunities!"
 bhutan_events.726.a: "A foothold in the Himalayas!"

 bhutan_events.727.t: "Trade with India Normalises"
 bhutan_events.727.d.hnd: "When the republicans triumphed over their enemies in India, there was considerable fear in our court that they would soon turn north to pillage our realm, high on their victories against “reactionaries” and “colonialists” in the south. However, their victory did not usher in a new age of war between our small nation and our southern neighbours. Instead, the newfound peace in the Indian subcontinent has led to a flourishing of trade, as merchants seek out new sources of investment and raw materials. While the line of caravans trekking from Calcutta and Assam to our borders is little more than a drop in the bucket of the great sea of newfound Indian mercantile resources, these new streams of hard currency and modern products have had a great effect on our domestic economic situation. So long as this new peace holds, we will surely reap the benefits of this new trading relationship."
 bhutan_events.727.d.raj: "When our former masters crushed the upstart republican forces in Calcutta, we were worried that they may see our pivot towards the revolutionaries in 1928 as a betrayal against them. We braced ourselves for a devastating attack at their hands, but were pleasantly surprised when their victory did not, in fact, lead to a new “Duar War” between us. Instead, the newfound peace in the Indian subcontinent has led to a flourishing of trade, as merchants seek out new sources of investment and raw materials. While the line of caravans trekking from Calcutta and Assam to our borders is little more than a drop in the bucket of the great sea of newfound Indian mercantile resources, these new streams of hard currency and modern products have had a great effect on our domestic economic situation. So long as this new peace holds, we will surely reap the benefits of this new trading relationship."
 bhutan_events.727.d.prf: "When the Indian Federation crushed both the republican and British-backed forces to secure their domination over India, many within our court fear that they, drunk on their shocking victories, would continue north into our realm to plunder and conquer us. Lucky for us, their victory did not usher in a new age of war between our small nation and our southern neighbours. Instead, the newfound peace in the Indian subcontinent has led to a flourishing of trade, as merchants seek out new sources of investment and raw materials. While the line of caravans trekking from Calcutta and Assam to our borders is little more than a drop in the bucket of the great sea of newfound Indian mercantile resources, these new streams of hard currency and modern products have had a great effect on our domestic economic situation. So long as this new peace holds, we will surely reap the benefits of this new trading relationship."
 bhutan_events.727.a: "Fantastic!"

 bhutan_events.728.t: "The End of Phuentscholing"
 bhutan_events.728.d: "The destruction and dissolution of the Indian Republic in Calcutta has led to the wholehearted breakdown of our treaty relationship with them. The new hegemon of the Indian subcontinent may seek to reassert the special relationship we cultivated with the republic, but in the meantime, few wish to brave the southern passes without the guarantees outlined in the Treaty of Phuentscholing. With trade faltering, we will certainly feel the effects of this defeat on our purse strings. We can only pray that new accommodations will soon be made with our southern neighbours!"
 bhutan_events.728.a: "Hopefully a new accord can be forged."

 bhutan_events.730.t: "A Chance to Show our Teeth"
 bhutan_events.730.d: "While most of our closest and most trusted advisors are fairly isolationist, there are a handful of leading figures who are more bellicose and belligerent in their outlook. These figures see our current relationship with our neighbours as being unacceptably conciliatory, claiming that regional leaders in the Indian and Tibetan borderlands view Bhutan as a joke, notions they propose we correct with force. There are two recent opportunities this small group of aggressive councilors have highlighted, which we could seize upon to bear our teeth and show the world that we are not to be trifled with.\n\nA conflict over water rights has broken out between two villages in the Duar foothills over a shared water source, and while both of these communities are beyond the scope of our official borders, they both also exist outside of the practical control of the Indians due to their remote geography. We could march a small contingent of soldiers south to force mediation between the villages under force of arms, asserting our control over the region and humiliating their negligent Indian suzerains.\n\nIn Tibet, a common pilgrimage will soon commence, which sees villagers from our enclaves in Tibetan Ladakh travel across the highlands to our monasteries. This time around, our advisors propose that we send a large band of warriors to escort them under the claim of increased banditry. Such a posse of valiant and proud Bhutanese soldiers will cow the Tibetans they pass on their way across the nation, and show the might of our military.\n\nOf course, both manoeuvres will be provocative, and may warrant a response from our neighbour. If they are otherwise occupied, however, they will likely be forced to acquiesce to our newfound strength."
 bhutan_events.730.a: "We have little to gain from antagonizing our neighbours."
 bhutan_events.730.b: "Move forward with these bold plans!"

 bhutan_events.731.t: "Bhutanese Incursions into the Duars"
 bhutan_events.731.d: "A bizarre report has reached our desk from the far-flung borderlands of the Assam Duars, where a dispute between tiny villages has become the playground of meddling Bhutanese soldiers. In this remote region, issues on the village level are typically solved by local leaders without intervention from our administration. However, it appears that Bhutan has intervened in the latest squabble as a mediator, acting as though these villages still belong to them, seemingly asserting a claim over a tiny slice of land in the furthest reaches of our nation. Of course, it would be embarrassing to surrender de-facto control over any part of our nation, but on the other hand there are far more pressing issues at hand than Bhutan’s informal influence over two tiny hovels. While sending a small contingent of soldiers into the highlands would certainly scare off the Bhutanese, simply ignoring this situation for the time being may save us resources and potential headaches to come."
 bhutan_events.731.a: "Send a platoon of soldiers to reel in these villages."
 bhutan_events.731.b: "This is beneath us."

 bhutan_events.732.t: "Victory in the Duars!"
 bhutan_events.732.d: "More than seventy years ago, the noble leaders of Bhutan were tragically pushed out of our rightful claims in the Duars by the murderous British and their servile Indian toadies. In the decades since, we have never again had the chance to reassert our pride in these rich foothills, whipped into submission by the might of our neighbours. No longer!\n\nA band of our finest warriors have reasserted a degree of control over the northern Duars, if only symbolically, finally righting the wrongs committed against our ancestors. They do not return empty handed, but instead bring chests of loot, gifted to them by those thankful to be liberated by our noble cause. We have proven ourselves to our neighbours, our warriors demanding the respect that they would not give freely.\n\nThe only question now remaining is whether we should sit on the fruits of our victory, or instead move forward with our plans to assert our power in Tibet as well."
 bhutan_events.732.a: "Fantastic!"
 bhutan_events.732.b: "We should stop while we are ahead."

 bhutan_events.733.t: "A Reversal in the Duars"
 bhutan_events.733.d: "Initially, our attempts to assert ourselves in the Duar borderlands showed great promise. Our warriors imposed a fair and reasonable settlement between the disputed villages, and began the process of instilling the most rudimentary forms of order on these forgotten backwater hamlets. Their efforts were suddenly stifled, however, by the arrival of an Indian military force, sent to impose their cruel will at the end of a bayonet. Selflessly seeking to prevent an international incident in the face of such Indian aggression, our soldiers actioned a hasty withdrawal back north.\n\nThis reversal has caused some embarrassment among the more militant members of the inner circle, but it has not fully taken the wind out of their sails. They have instead doubled down on their reasoning, claiming that the Indian response in the Duars was only more evidence of the necessity of taking bold and decisive action. They have proposed that we immediately move forward with a show of force in Tibet, to prove that we have not been cowed by a minor setback in the south."
 bhutan_events.733.a: "An embarrassing setback..."
 bhutan_events.733.b: "...but no reason to give up now!"

 bhutan_events.734.t: "Bhutanese Incursion Harasses Villages"
 bhutan_events.734.d: "Bhutan is little more than a vestigial and parasitic offshoot of our realm. In hundreds of years of intermittent war and comingling, they have secured dominion over a handful of villages in Ladakh, tiny islands of Bhutanese control in a vast sea of our lands. These enclaves are largely tolerated due to the wealth that the villagers bring on their long pilgrimage routes stretching through much of the Himalayan plateau to the great Drukpa monasteries in Bhutan. Local leaders have considered these pilgrims a boon, but the most recent auspicious times of travel have brought only trouble. A large and rowdy band of Bhutanese warriors have plagued the region under the guise of guarding pilgrims from phantom bandits, harassing locals and generally making mischief. We could demand that our local commanders arrest the ringleaders of these upjumped Bhutanese bandits while they are still deep in our lands, but it will be somewhat difficult to mobilise a response in the hinterlands. It may be easier to simply decry these barbarians and move on, just as they will soon be moving on back home to Bhutan."
 bhutan_events.734.a: "Arrest these troublemakers!"
 bhutan_events.734.b: "Curse these hooligans, but leave them be."

 bhutan_events.735.t: "Our Pride Restored in Tibet!"
 bhutan_events.735.d: "More than three centuries ago, the great Zhabdrung Rinpoche Ngawang Namgyal fled Tibet into the valleys of our nation, founding the Drukpa Lineage and, with it, Bhutan. The connections between his lost homeland and our own nation continue to run deep, and the villages of Khangri, Tarchen, Tsekhor, Diraphu, Dzung Tuphu, Jangehe, Chakip and Kocha in the western highlands of Tibet all continue to pledge their loyalty to our leaders, rather than Lhasa. In more recent years the Tibetans have allowed bandits to run wild in a vain attempt to alienate our loyal subjects in Ladakh from their liege, but our recent show of continued commitment has cowed them back into submission. Once again pilgrims from the plateau can visit our great monasteries in peace, and perhaps more importantly once again our tax collectors can traverse the long paths west without fear of harassment!"
 bhutan_events.735.a: "Fantastic!"

 bhutan_events.736.t: "Our Party Arrested in Ladakh"
 bhutan_events.736.d: "Disastrous news has trickled south from Tibet at the lips of the arriving Ladakh pilgrims, claiming that the leading members of the band we sent north to escort them have been arrested in Tibet on up-jumped charges of banditry. The remainder of the force stayed back in the region to petition local Tibetan leaders for their captain’s release, though it appears their pleadings have fallen on deaf ears. Though it is likely that we will secure the release of our brave warriors with the application of gentle diplomatic pressure (and a handful of bribes), there is no doubt that our image of strength has been soundly tarnished. After all, much of the point of sending these men into the Tibetan hinterlands was to show that the local despots would not dare to invoke our ire by interfering with their mission. It seems that we misjudged them."
 bhutan_events.736.a: "We must secure their release!"

 bhutan_events.740.t: "The 14th Dalai Lama Proclaimed"
 bhutan_events.740.d: "After the death of the 13th Dalai Lama in 1933, the Buddhist faithful across the Himalayas have felt unease. While Bhutan follows a parallel spiritual path to Tibet, there is no doubt that our interests, and our fates, are intrinsically tied. The final years of Thubten Gyatso’s reign saw the Ganden Phodrang assaulted by the forces of Chinese autocracy, Russian mysticism, and Indian radicalism. Without his steady hand and cunning eye, Tibet has balanced on the knife’s edge of disaster.\n\nWith the proclamation of the ascent of the fourteenth Dalai Lama, and the announcement of his peaceful ascent in Lhasa, the most worrisome of millenarian Kalchakra readers have been proven wrong. Though the population of Yellow Hat monks in Bhutan is slim, made up mostly of refugees who have found a home in Bhutan after fleeing from the recent turmoil, those who remain faithful have clamoured to find a way back to their homes to meet the Dalai Lama. After years of confusion and sectarian strife, many believe that his arrival will harken a new age of peace!"
 bhutan_events.740.a: "Have a safe trip!"

 bhutan_events.741.t: "The Presumed Dalai Lama Exiled to Bhutan"
 bhutan_events.741.d: "Tibet has long been a strange battleground between Russia, China, and India, each power attempting to strangle away the independence of the Ganden Phodrang. While many felt that the discovery of the fourteenth reincarnation of the Dalai Lama could mark a reversal of the recent decades of humiliation, it appears to have reflected nothing more than a temporary reprieve from the geopolitical and political vultures circling Tibet. Following the overthrow of the traditional framework of theocratic governance in Tibet at the hands of foreign supported bandits, the government protecting and raising the young Dalai Lama has rushed to flee Lhasa.\n\nA group of Gelugpa monks have arrived in Bhutan with the child Tenzin Gyatso, who they are claiming as the 14th Dalai Lama found in Amdo. They have indicated that they will likely move to seek a more permanent venue for their exile, probably in India, following the resolution of conflict on the subcontinent. In the meantime, their presence has brought us considerable prestige (and a paltry portion of the former Tibetan treasury)."
 bhutan_events.741.a: "He'll be safe with us!"

 bhutan_events.742.t: "Buddhism Restored to Mongolia"
 bhutan_events.742.d: "For years, the children of Bhutan have often been frightened by tall tales of the brutal raiders of the northern steppes, linked to our nation through ancient Mongolian and Tibetan trade routes. Of the most famous bandits, like Ja Lama, Vladimir Lenin, and Grigory Semyonov, none are more feared than that of the Mad Baron of Mongolia, Roman von Ungern-Sternberg. He fought the Chinese into retreat, enslaved and murdered thousands, destroyed the traditional monks of Mongolia, and justified all of these acts of brutality as being \"Buddhism\".\n\nThankfully, a new generation of enlightened monks and nobles, truly loyal to the Bogd Khan, have risen against the regime of this Russian madman, overthrowing Ungern and his villainous stooges. Finally, the tale of this wild Russian, filthy in his sacrilege, can end with a positive message. Pious and brave Buddhist men can beat even the most monstrous of foes, so long as they believe in the righteousness of their cause!"
 bhutan_events.742.a: "Now go to sleep, or a Russian will get you!"

 bhutan_events.743.t: "The Chinese Invade Tibet"
 bhutan_events.743.d: "Bhutan and Tibet have had a long historical relationship, starting when a brave Tibetan lama broke with the rot and stagnation which had corrupted his compatriots, defeating his opponents and founding a new realm in the southern valleys of the Himalayas. Since then, Bhutan and Tibet have traded, allied, and fought in equal measure. When Tibet was still nominally a vassal of the Great Qing, it was King Ugyen who went with the British to Lhasa to act as an intermediary. Even after the Xinhai Revolution years, Tibet has been threatened by the warlords of the new Great Qing. Today word has arrived in court that the Ma families, the Muslim lapdogs of the Chinese oppressors, have descended upon the Tibetan foothills in an attempt to subjugate the Himalayas once and for all. While we have offered our northern neighbours support, we cannot afford to send any of our warriors north while we are facing enemies both within our own realm and among the warring Indians to the south."
 bhutan_events.743.a: "We will pray for their victory!"

 bhutan_events.744.t: "Reformists Take Power in Tibet"
 bhutan_events.744.d: "News has just reached our capital of the dramatic developments in Lhasa, where the long-reigning regent and prime minister Trimön has fallen into a bought of insanity, leaving the levers of power available to be seized by Tibetan commander and statesman Tsarong Dzasa. Leveraging his connections with the British and his modern model army units, Tsarong has declared his intentions to bring Tibet kicking and screaming into the 20th century!\n\nDrawing inspiration from the west, Tsarong and his Young Tibet Party seek to modernise the nation through an ambitious plan of economic and political liberalisation. To the reformist faction in the Bhutanese court, the success of Young Tibet is a rallying cry, bringing new faces into the movement and strengthening the resolve of their leaders."
 bhutan_events.744.a: "Sonam Topgye and his allies rejoice!"

 bhutan_events.745.t: "Tibetan Traditionalists Maintain Control"
 bhutan_events.745.d: "In the past year, various forces have threatened to unseat Tibet's conservative regent and prime minister Trimön. With the agents of Britain and the Chinese KMT defeated by Tibetan militias and soldiers, the traditionalists in Lhasa have solidified themselves as the undisputed masters of the country, free to finally fully consolidate their grip on the organs of power in the wake of years of instability.\n\nAs news of modernist and revolutionary defeats trickle back to Bhutan via the mouths of exiles and traders alike, their message is clear, Tibet will remain a symbol of tranquility (and stagnation) for the foreseeable future. Within our court, those monastic and noble leaders who have long made a name for themselves as the stalwart defenders of the status quo are openly celebrating, calling for Bhutan to chart a similarly steady path into her own future."
 bhutan_events.745.a: "Nothing ever happens in the Himalayas."

 bhutan_events.746.t: "Radicals Seize Power in Tibet"
 bhutan_events.746.d: "News has just reached our capital of the dramatic developments in Lhasa, where the long-reigning regent and prime minister Trimön has been killed by an invading force of radical militias, led by Thubten Choekyi Nyima, the ninth Panchen Lama. Leading a new revolutionary coalition of modernist, marxists, and dangerous radicals, the old lama has outlined an outrageous programme of political and societal upheaval, including dubious national elections and a reorganisation of the feudal theocratic state apparatus.\n\nFor our own nation, the victory of these more radical forces has been slightly destabilising, to say the least. The nascent radical movement in our own realm have looked to the victory of these militias for inspiration, and on the other end the more radical elements of our monastic elite have been galvanized by Trimön’s fall."
 bhutan_events.746.a: "The shadows appear to be grumbling..."

 bhutan_events.800.t.heir: "Education of the Heir"
 bhutan_events.800.t.king: "Education of the Young King"
 bhutan_events.800.d.jw: "The young Jigme Dorji has grown much in the last years, sprouting up from a young boy into a young man, increasingly poised to step up into the responsibilities of a prince. With Jigme Dorji poised to one day assume the throne, the nature of his education could have wide-reaching effects on the future, and is of paramount importance to the kingdom. In the last decade, Jigme Dorji has been schooled by an army of tutors and mentors in the capital and, briefly, in bordering India. Leading courtiers have provided him with lessons in administration and rule, trained educators from India have given him a crash course in mathematics and science, military leaders have promoted physical activity and martial training, and one of the great Lopon teachers has provided him with the fundamentals of the Drukpa Buddhist lineage.\n\nThe young prince has approached all of his studies with enthusiasm, showing great promise as a prospective leader and statesman. Yet as the young man grows older, the balance of his studies must be refined to best suit his future duties as king. There are many subjects vital to his development, all with teachers and tutors vying for his full attention. The monks demand that his grip on the traditional Red Hat canon be strengthened, while the generals instead claim that he is destined to be a great warrior king, if only we let them drill and educate him. The small contingent of Indian tutors, for their part, are a personal favorite of the young heir, who has grown to love the subjects of diplomacy, architecture, and western engineering. We will have to favor one of these groups eventually."
 bhutan_events.800.d.tp: "The young Jigme Dorji has grown much in the last years, sprouting up from a young boy into a young man, increasingly poised to step up into the responsibilities of a prince. With Jigme Dorji poised to one day assume the throne, the nature of his education could have wide-reaching effects on the future, and is of paramount importance to the kingdom. In the last decade, Jigme Dorji has been schooled by an army of tutors and mentors in the capital and, briefly, in bordering India. Leading courtiers have provided him with lessons in administration and rule, trained educators from India have given him a crash course in mathematics and science, military leaders have promoted physical activity and martial training, and one of the great Lopon teachers has provided him with the fundamentals of the Drukpa Buddhist lineage.\n\nThe young prince has approached all of his studies with enthusiasm, showing great promise as a prospective leader and statesman. Yet as the young man grows older, the balance of his studies must be refined to best suit his future duties as king. As the future commander of Bhutan’s army, the king will need to be a warrior, though he cannot wholly neglect his role as a civic and religious leader in favor of the battlefield. Monastic leaders have proposed that the young man redouble his efforts to learn the Red Hat canon, while some generals have proposed that an intense course of physical training and tactical study will sharpen him into a dangerous commander. Of course, we could take this a step further, assigning the young heir authority of a border fort to teach him the first hand requirements of military command, under the supervision of an army of tutors and advisors, of course."
 bhutan_events.800.d.st: "The young Jigme Dorji has grown much in the last years, sprouting up from a young boy into a young man, increasingly poised to step up into the responsibilities of a king. With Jigme Dorji poised to one day assume the full responsibilities of the throne, the nature of his education could have wide-reaching effects on the future, and is of paramount importance to the kingdom. In the last decade, Jigme Dorji has been schooled by an army of tutors and mentors in the capital and, briefly, in bordering India. Leading courtiers have provided him with lessons in administration and rule, trained educators from India have given him a crash course in mathematics and science, military leaders have promoted physical activity and martial training, and one of the great Lopon teachers has provided him with the fundamentals of the Drukpa Buddhist lineage.\n\nThe young king has approached all of his studies with enthusiasm, showing great promise as a leader and statesman. Yet as the young man grows older, the balance of his studies must be refined to best suit the duties he will assume in his majority. There are many subjects vital to his development, and the crash course in religious and western education has borne surprising fruit! The monks believe that a concerted study of the Red Hat canon could make the young king a unifying figure between the religious and aristocratic elite. On the other hand, the Indian tutors hired by Sonam Topgye have lauded their student for his interest and engagement in the secular fields of diplomacy, architecture, and western engineering. One expert, hired to design the first hospital building in Bhutan, has proposed a more radical project to test the limits of the young king’s skill. He has proposed that Jigme Dorji should take an active role in the design and construction of the hospital, under the guidance of a small team of experts. Such a project, if successful, would be a propaganda boon...but perhaps the young king is not yet ready for such a serious task."
 bhutan_events.800.a: "Further his training in the Drukpa canon!"
 bhutan_events.800.b: "Have the generals toughen him up!"
 bhutan_events.800.c: "Let him take command of a border fort!"
 bhutan_events.800.e: "Hire more foreign experts as tutors!"
 bhutan_events.800.f: "Let him have a hand in the first hospital!"

 bhutan_events.801.t: "French Explorer Passes Through"
 bhutan_events.801.d.wangchuck: "Recently, our capital was visited by a small party of European explorers and merchants, who brought with them a smattering of luxury goods and news from the outside world. They had been guided north under an escort at the insistence of Sonam Topgye, who viewed their arrival as a fantastic opportunity to show members of the outside world the rapid progress being made in Punakha on various western style projects. After all, it has been years since the kingdom has been visited by Europeans.\n\nAmong their party was a French opera singer, explorer, and orientalist, Alexandra David-Néel. Famed for her audience with the thirteenth Dalai Lama during his exile in Kalimpong, as well as for her cordial meeting with the ninth Panchen Lama, she spent much of the last twenty years travelling through Tibet, China, and Mongolia. In a Sikkim monastery she made the acquaintance of a young monk named Aphur Yongden, who she would go on to adopt as her son and travelling companion. Writing extensively of her travels, she is well known in orientalist circles, especially for her attempts to visit the forbidden holy monasteries of Lhasa in disguise. While she has not disclosed her next destination to us, it appears she is once again attempting to visit Lhasa incognito. While we commend her interest in Buddhism, we have warned her firmly that Tibet is rife with instability, and that she could face death if she acts recklessly in her pursuits."
 bhutan_events.801.d.tp: "Recently, our capital was visited by a small party of European explorers and merchants, who brought with them a smattering of luxury goods and news from the outside world. They were greeted at the capital by the immense hospitality of Tshering Penjor, who quickly gathered an impromptu festival to celebrate their arrival. At his insistence, the guests watched the famed Black Hat dance, and were invited to join in the Ngacham drum playing, while Tshering Penjor himself partook in the ritual dance.\n\nAmong their party was a French opera singer, explorer, and orientalist, Alexandra David-Néel. Famed for her audience with the thirteenth Dalai Lama during his exile in Kalimpong, as well as for her cordial meeting with the ninth Panchen Lama, she spent much of the last twenty years travelling through Tibet, China, and Mongolia. In a Sikkim monastery she made the acquaintance of a young monk named Aphur Yongden, who she would go on to adopt as her son and travelling companion. Writing extensively of her travels, she is well known in orientalist circles, especially for her attempts to visit the forbidden holy monasteries of Lhasa in disguise. While she has not disclosed her next destination to us, it appears she is once again attempting to visit Lhasa incognito. While we commend her interest in Buddhism, we have warned her firmly that Tibet is rife with instability, and that she could face death if she acts recklessly in her pursuits."
 bhutan_events.801.d.z: "The Monlam Prayer Festival was established more than five centuries ago, and is today considered one of the most important gatherings in the Geluk Buddhist tradition. While the monks of Bhutan following the Kagyu school, there are still many within our realm who travel north to Lhasa to celebrate at Jokhang Temple, sponsored informally by many of our monasteries. One of our contacts among the growing bands of pilgrims has sent word with dire news, that a pair of European interlopers had hidden themselves among the faithful pilgrims, masquerading as a Buddhist monk and nun.\n\nOne of these villains appears to be the infamous French explorer Alexandra David-Néel, who made a name for herself in a previous attempt to smuggle herself into the holy walls of Lhasa more than a decade ago under a similar disguise. While we will certainly need to send word north warning the Tibetan authorities of these dangerous vagrant outsiders attempting to break into the most holy of compounds, there is little chance that our word will make it to their ears in time to catch them. After all, this David-Néel could be anywhere in Tibet by now! At the very least, we can rest easy knowing that she is no longer lurking in the shadows of our realm."
 bhutan_events.801.a: "Safe travels, Mrs. David-Néel!"
 bhutan_events.801.b: "Good Riddance!"

 bhutan_events.802.t: "King Jigme Falls Ill"
 bhutan_events.802.d: "From a young age, King Jigme has suffered from terrible bouts of weakness, which leave him largely unable to personally handle the rigors of governance. The commonly held belief is that this ailment is the result of a curse, cast by a forest spirit which inhabits the forests surrounding the Wangchuck summer palace of Wangdueschoeling. Supposedly, as a young prince Jigme pridefully hunted in these woods without leaving this spirit proper sacrifices, invoking its ire. Ever since this incident, Jigme has suffered under this curse, which periodically sends him into fits of exhaustion.\n\nThis legend has recently been called into question by a visiting physician from India. This Hindu doctor has privately presented the claim that the king may be suffering from a heart condition. While the king himself appears privately relieved that he is not being held under the yoke of a black curse, those close to him have clamoured for the expulsion of the doctor. They argue that the young physician’s assertion belittles the power of spirits, and may provoke the Wangdueschoeling spirit to strike down the prideful king. Additionally, they have warned that such a diagnosis portrays the king as physically weak, and unable to defend the nation from those who would do it harm."
 bhutan_events.802.a: "Send this Hindu quack back!"
 bhutan_events.802.b: "Perhaps we should heed these warnings."

 bhutan_events.803.t: "King Jigme Seeks Treatment"
 bhutan_events.803.d: "In response to the worrying diagnosis of heart illness from a Hindu doctor, Jigme has created the position of royal physician, recruiting the young doctor into his household as a personal medical advisor. His first course of action in this new role was to prescribe a process of treatment for the king’s condition, demanding that he withhold from eating any meat and recommending that he perform a handful of rigorous exercises.\n\nSome of those closest to King Jigme have privately derided him for ‘kowtowing to prideful foreigners,’ but the king himself appears stalwartly committed to the proposals of his new doctor. In fact, he has already shed a few pounds at the hands of this diet and exercise regime! Unfortunately, the new royal physician has requested that he be given leave to return to his homeland, as we have given little to him for his services aside from prestige. He has requested a modest salary and an office to work from, much to the derision of court elders, who have taken to labelling him as a sycophantic parasite and a ‘foreign ruffian.’"
 bhutan_events.803.a: "A healthy king means a healthy kingdom!"
 bhutan_events.803.b: "His price is too steep, let him go home."

 bhutan_events.804.t: "The King's New Horse"
 bhutan_events.804.d: "Horsemanship is one of the central pillars of any martial education, and the education of the king was no different. Jigme’s love of riding has not diminished in the many years since his childhood riding lessons, and he has kept a number of beautiful and spirited royal horses in his years as king. Thus, it has become well known that the gift of a proper horse, if one could afford it, could deliver a great degree of royal support. Dzongpon Sey Dopola, chief of Tashigang Dzong, has arrived in the capital, bringing with him a pair of Sharta horses, which can be found only in his lands in the far east. These hardy mountain ponies are kind and eager in their temperament, and well regarded throughout Bhutan.\n\nDopola has also been kind enough to present his liege with a Lungta prayer flag, depicting the great wind horse. Such a flag is sure to bring luck to the crown should it be properly flown! Sey Dopola is a popular and well liked minor noble, and he has certainly lived up to his reputation for generosity and insight today. Regarded positively by most of the king’s inner circle, he would be welcomed as a permanent fixture in court by traditionalists and reformers alike. Perhaps we should extend an invitation to him to join us in the capital as an advisor to the king, or as a tutor to the heir?"
 bhutan_events.804.a: "A gift fit for a king!"
 bhutan_events.804.b: "Reward this generosity with a position!"

 bhutan_events.805.t: "A Grand Archery Contest"
 bhutan_events.805.d.jw: "King Jigme has long been an avid archer, hosting a number of hunts and contests throughout his reign. His most recent endeavour has been the most ambitious by a length, tempting archers from across the kingdom to Punakha to show their talent, and to battle for the chance for a staggering purse. The king has thrown himself into the running, which has quickly become a source of potential embarrassment for the court more broadly. While Jigme is a legitimately capable archer, his presence at events has led all of his potential competitors to go far out of their way to ensure that their liege win, to the detriment of their own results.\n\nWhile the king’s intention was certainly not to corrupt the event in any way, by continuing to participate he has likely preordained the competition’s victor. The king, of course, has promised that if he were to win the prize, the winnings would be distributed to the top contestants. Additionally, he has promised that the man who shows the most skill will be offered a position in his personal guard. Even still, it may be for the best for Jigme to politely withdraw from the competition, to allow the others to honestly fight for the title."
 bhutan_events.805.d.tp: "King Tshering Penjor has long been an active supporter of culture and merriment, and his events have long been the talk of Penlop and peasant alike. His most recent endeavour has been a grandiose archery competition, tempting archers from across the kingdom to Punakha to show their talent, and to battle for the chance for a staggering purse. The king has placed a number of wise (and clandestine) wagers on the victory of his favored warrior, the tenacious Namgyal Bahadur.\n\nWhile the king would never ever think of stooping to meddling in the tournament to push the competition one way or another, he could always have a private word with the steward of the event to ensure that Namgyal Bahadur faces only proper and correct opponents - the kind of face offs which would be properly stimulating for the crowds. Then again, should Namgyal Bahadur succeed under circumstances which are less than sound, the patriotic pride of the competition will surely be undercut."
 bhutan_events.805.d.st: "The last couple of decades have proved themselves as a golden period for Bhutanese archers, who were oft patronised by King Jigme. His personal love for this traditional and popular sport translated into a number of grand tournaments held during his reign, each with significant fanfare to accompany their significant prize purse. Many of Jigme Dorji’s advisors have pushed for a new archery tournament in Punakha, to raise the morale of our people and to help build young Jigme Dorji’s legitimacy as his father’s successor.\n\nThese plans have been met with gentle skepticism by the Gongzim Sonam Topgye, who has agreed that such an event would bolster the morale of our subjects, but who outlined this tournament as an excessive frivolity. With the crown’s coffers limited, and many pressing issues demanding our resources, he instead argues that the prospective purse could be better spent on the weapons of the future, rather than the weapons of the past."
 bhutan_events.805.a: "May the best archer win!"
 bhutan_events.805.b: "May the best king win!"
 bhutan_events.805.c: "May the best Bahadur win!"
 bhutan_events.805.e: "This is an unconscionable expense."

 bhutan_events.806.t: "The Grand Feast"
 bhutan_events.806.d: "During his time as Penlop of Paro, Tshering Penjor was often the first Bhutanese leader to meet foreign visitors, who would pass through the active trading roads in the Paro Valley to continue on to the capital. It was in this capacity that Tshering Penjor became known for his large feasts, entertaining guests with Black-Hat Mask Dances and tours of his estate. It was during this period that he became well known by British envoys, who lavished him with gifts and prestige, but referred to him by the derogatory name Sir Cumference (in reference to the broad radius of his waistline). In the years following the collapse of British rule in India, however, the number of foreign travellers passing through Paro diminished greatly, though Tshering Penjor's thirst for revelry did not diminish with it. With the Paro Tshechu festival months away, our king has called for a new hedonistic event in the capital, with food, games, and events.\n\nHe has justified this festival as a celebration of King Ugyen’s victory at Changlimithang in 1886. It was there that Ugyen crushed his two adopted brothers, the then Dzongpons of Thimphu and Punakha, placing the nation’s greatest fortresses under direct Wangchuck control and finally unifying the nation. Considering that Ugyen Wangchuck is both the late king Jigme’s father and Tshering Penjor’s grandfather, such a celebration could serve as a valuable bridge of legitimacy between the different branches of the Wangchuck Clan, bringing the kingdom together after the recent chaos and instability."
 bhutan_events.806.a: "There is much to celebrate!"

 bhutan_events.807.t: "The Hunting Accident"
 bhutan_events.807.d: "As he grows older, the young Jigme Dorji has shown great promise as a hunter, with admirable skill as an archer and horseman. His mentors, quite pleased with his skill and enthusiasm, commissioned a tiger hunt in the southern lowlands to test the mettle of Jigme Dorji. While the hunt began in high spirits, tragedy soon struck when Jigme Dorji was thrown from his horse unexpectedly, causing him minor injuries and ending the prospects of the hunt. The unsuccessful huntsman is now bedridden and will be for some time to heal fully. Hopefully, he will not die of boredom in the meantime."
 bhutan_events.807.a: "Sorrow overtakes Jigme Dorji."
 bhutan_events.807.b: "Oh well..."

 bhutan_events.808.t: "Affairs of State and the Heart"
 bhutan_events.808.d: "Though he has several concubines, Tshering Penjor has long been regarded as a defender of the sanctity of marriage oaths. In his role as the Penlop of Paro, his subjects commonly come to him to mediate conflicts between newly intertwined families, or to mitigate the fallout from unsuccessful matches. Most recently, one of the richest leading men of the Paro valley has come to court to plead for Tshering Penjor’s personal intervention into an embarrassing affair that came about in the last months. The man’s daughter, betrothed to another prominent village family, has instead been cajoled into a most improper relationship with a local rogue, the young Chang Nagdho. The father has beseeched that Tshering Penjor bring this young menace to justice for corrupting his daughter, so that he could at least stem the bleeding wound of embarrassment to his family.\n\nThough this man is little more than a provincial bigwig, he long served as a friend and ally to the king in his time as lord of Paro, and Tshering Penjor does not forget his friends. As luck would have it, Tshering Penjor has brought an attendant named Ngagoe with him from Paro to court, and this courtier is close friends with Chang Nagdho. If Tshering Penjor wanted, he could send his loyal servant to carry out the king’s justice against his old friend, though the results could end up becoming quite messy if things go awry. Of course, the king could simply inform the right people that he intends to deal with Chang Nagdho, so that word gets back to the young vagabond. If the young man is smart, he will flee into a self imposed exile, solving the problem without any need for bloodshed."
 bhutan_events.808.a: "Offer Ngagoe whatever price he asks to bring this rogue to justice."
 bhutan_events.808.b: "Tip off the scoundrel and be done with it."

 bhutan_events.809.t: "Ngagoe Succeeds!"
 bhutan_events.809.d: "It would be a lie to say that Tshering Penjor was not at all wary that his young attendant Ngagoe would not attempt to shelter or save his old friend the rogue Chang Nagdho. However, these concerns were proven to be unfounded, as Ngagoe exceeded the king’s expectations in dealing with the dangerous casanova of Paro. Returning to court triumphant against his former friend, Ngagoe has been given a significant sum in return for his loyal service, along with the less tangible (but potentially more valuable) reward of the King’s notice. Having repaid years of friendship with one of his old contacts in Paro, Tshering Penjor has once again solidified his reputation as a just lord. Of course, Chang Nagdho’s would-be wife was less happy with the outcome of Ngagoe’s mission. When the king summoned her and her father to court, gifting her father with Chang Nagdho’s severed head, the young woman fainted, and supposedly hasn’t recovered since.  "
 bhutan_events.809.a: "All in all, a victory."

 bhutan_events.810.t: "Jigme Dorji takes the Reins of Government"
 bhutan_events.810.d: "The young king Jigme Dorji has sprouted up in recent years, quickly proving himself to be wise and capable beyond his years. An avid hunter and gardener, the king has balanced his newfound personal pursuits with the growing responsibilities of his office. With the young dragon rising to the occasion, Sonam Topgye Dorji and the other members of the regency council have begun to step back, allowing King Jigme Dorji to take a personal hand in more and more matters of state. The king has already indicated a handful of projects he intends to personally oversee, and he has thrown himself into his work with youthful vigor.\n\nOf course, that does not mean that the king has no time for or interest in the opinions of his advisors! He has surrounded himself with many of Sonam Topgye Dorji’s closest allies, and has taken their insights in stride with incredible humility, cherishing the wisdom of his attendants, but not allowing them to impose their partisan whims onto the kingdom."
 bhutan_events.810.a: "May his reign be long and prosperous!"

 bhutan_events.811.t: "Poor Harvest"
 bhutan_events.811.d.tpz: "Farming in Bhutan is intrinsically and inseparably tied to Buddhist canon. The name for agriculture is sonam, the word for blessing, and any land is considered blessed if it is able to support any of the nine crops known as the dru-na-gu: rice, wheat, barley, peas, two kinds of buckwheat, millet, mustard, and soybeans. Good harvests are a gift from the higher powers, rewarding those who have lived harmoniously, while bad crops are clearly markers of discontent among local spirits, or more broadly a reflection of a society which has lost its way.\n\nUnfortunately, it appears that the spirits are, at best, unhappy with the communities in Paro and Thimpu valleys, where significant crops have failed. Early frosts and poor conditions have led to a meagre yield, leaving many families without food needed to survive. To handle this issue, we can intervene by demanding a hold on commodity taxes in the affected regions for the rest of the year. This would allow merchants to more easily supply crops from the more lucky regions to the families struggling to put food on the table, but would cut into a valuable source of tax revenue for the central government. Alternatively, we could simply push the onus to handle the situation onto local lords and administrators, foreign them to shoulder the burden of helping their peasants."
 bhutan_events.811.d.wangchuck: "Farming in Bhutan is intrinsically and inseparably tied to Buddhist canon. The name for agriculture is sonam, the word for blessing, and any land is considered blessed if it is able to support any of the nine crops known as the dru-na-gu: rice, wheat, barley, peas, two kinds of buckwheat, millet, mustard, and soybeans. Good harvests are a gift from the higher powers, rewarding those who have lived harmoniously, while bad crops are clearly markers of discontent among local spirits, or more broadly a reflection of a society which has lost its way.\n\nUnfortunately, it appears that the spirits are, at best, unhappy with the communities in Paro and Thimpu valleys, where significant crops have failed. Early frosts and poor conditions have led to a meagre yield, leaving many families without food needed to survive. To handle this issue, we can intervene by demanding a hold on commodity taxes in the affected regions for the rest of the year. This would allow merchants to more easily supply crops from the more lucky regions to the families struggling to put food on the table, but would cut into a valuable source of tax revenue for the central government. Sonam Topgye Dorji has pushed for even further action, calling for us to both cut the commodity tax, and to introduce rice crops into the south, allowing for more cereal reserves to draw on in potential future crises. Of course, it would be his own lands which would most benefit from such a project, but more plentiful rice crops would certainly help manage future food shortages. Alternatively, we could simply push the onus to handle the situation onto local lords and administrators, foreign them to shoulder the burden of helping their peasants."
 bhutan_events.811.a: "Let the local lords and Gewogs deal with this."
 bhutan_events.811.b: "Halve the commodity tax until things improve."
 bhutan_events.811.c: "Cut the tax and introduce rice crops to southern regions."

 bhutan_events.812.t: "Disorganised Response"
 bhutan_events.812.d: "Turning to local authorities to deal with poor harvests in Paro and Thimphu has proven to be a blunder. Unwilling to draw on personal fortunes to help float local villages, local lords have instead begun buying up the excess food from neighbouring regions, looking to take advantage of their own subjects' desperation to make a fortune.\n\nThe presence of tax collectors in the homes of starving villagers has tried the patience of even the most loyal of subjects, and there is no doubt that this mismanagement has played directly into the hands of underground radical movements, small as they may be. When one sees the brutality of the feudal compact firsthand, it does not take too long before one must question its morality and righteousness. While the public opinion of the peasants plummets, the coffers of local strongmen continue to rise."
 bhutan_events.812.a: "Don’t those fools know they’re making us look bad!"

 bhutan_events.813.t: "New Rice Crops Harvested"
 bhutan_events.813.d: "While rice has been one of the central crops in Bhutan since before the time of the first Zhabdrung, it could only be planted in certain regions of the country, namely the banks of the rivers which carve the great valleys of Thimphu, Punakha, Trongsa, and Paro. In the lowlands of the south, tubers like yams and taros make up the bulk of the crop, with the climate considered unsuitable for rice paddies. However, our recent agricultural crisis in Paro and Thimphu served as the impetus for new attempts at bringing rice to the south. Under the guidance of Gongzim Sonam Topgye Dorji, new irrigation canals have been dug and new breeds of rice have been imported, leading to some successes in the south. While the traditional rice varieties of Yangkum, Jama, Janaap, and Jakaap continue to be unsuited for the lowlands climate, white rice purchased from Indian merchants have grown well in the newly irrigated areas. With a larger crop available, we have further guarded ourselves from future shortages."
 bhutan_events.813.a: "Fantastic!"

 bhutan_events.814.t: "Agitator in the South"
 bhutan_events.814.d: "It has come to our attention that a village leader has been openly criticising our government, growing a small collection of loyal followers from his home in Sarpang. A member of the Lhotshampa minority, Pashupati Adhikari has been careful not to directly insult any of his betters, but he has openly decried government discrimination against his compatriots. The Lhotshampa, meaning “southern borderlanders,” are a distinct group of Nepalese migrants, who were invited into the uninhabited southern regions of Bhutan from Nepal and Assam, at the behest of the Dorji family. While the Lhotshampa are tolerated as pioneers in the disease ridden lowlands, most of them practice strange foreign religions, speak foreign tongues, and are seen as little more than a tool to be used by our leadership.\n\nPerhaps sensing this derision, some of the braver Lhotshampa have banded together to challenge the supremacy of their lords and rulers, especially protesting the special land taxes levied against Lhotshampas specifically. Fueled by foreign born successionist movements, such as the Gorkha League and Bhutan State Congress, these activists are becoming a danger to the stability of the southern regions. Local administrators in Sarpang have indicated their interest in exiling Adhikari to India or Nepal, where he would no longer cause issues for us. While confronting him could upset the members of his community, if left alone he will likely convert more of his neighbours to his radical cause. Of course, we could simply assassinate him. There are many bandits in the south, and it would be a shame if such a pillar of the community were to disappear one evening."
 bhutan_events.814.a: "Leave him alone, best not to shake the beehive."
 bhutan_events.814.b: "Eliminate him silently, and leave no trace."
 bhutan_events.814.c: "Expel Adhikari and seize his property!"

 bhutan_events.815.t: "Trouble with the Lhotshampa"
 bhutan_events.815.d.trust: "Reports from the southern regions of Samtse, Tsirang, and Sarpang continue to warn of growing dissent among several Lhotshampa village elders, who constantly petition local leaders to address the economic burdens imposed on the Lhotshampa, especially protesting the land taxes that all Lhotshampa families must pay. More concerning are the indications that these leaders are receiving support from the Gorkha League, and that many may in fact be members of this radical secessionist movement.\n\nNow is clearly not the time to deal with the growing issue of the Lhotshampa settlements in the southern regions, but perhaps we can move to mitigate these recent developments before things get out of hand. We can simply lower the land taxes, which would take away the central rallying cry of the angry elders at the cost of diminishing valuable government revenue. Instead, we could simply threaten, exile, and beat the dissenting elders into submission, showing their allies that we will not bend in the face of such protests. Then again, there may be room for a more comprehensive new agreement with the Lhotshampa, which would give certain guarantees of cultural rights, in exchange for the maintenance of the tax and promises that elders will no longer associate with the Gorkha League radicals. While such an agreement would be flimsy, it could mark the first step towards a genuine path of coexistence and peace in the borderlands."
 bhutan_events.815.d.notrust: "Reports from the southern regions of Samtse, Tsirang, and Sarpang continue to warn of growing dissent among several Lhotshampa village elders, who constantly petition local leaders to address the economic burdens imposed on the Lhotshampa, especially protesting the land taxes that all Lhotshampa families must pay. More concerning are the indications that these leaders are receiving support from the Gorkha League, and that many may in fact be members of this radical secessionist movement.\n\nNow is clearly not the time to deal with the growing issue of the Lhotshampa settlements in the southern regions, but perhaps we can move to mitigate these recent developments before things get out of hand. Any attempts to negotiate with the most moderate of the leaders have led nowhere, as they have pointed to our “underhanded” treatment of Pashupati Adhikari as proof of our untrustworthiness. We are thus left with two options, either we simply lower the land taxes, which would take away the central rallying cry of the angry elders at the cost of diminishing valuable government revenue, or we instead simply threaten, exile, and beat the dissenting elders into submission, showing their allies that we will not bend in the face of such protests."
 bhutan_events.815.a: "Let us form a more equal agreement."
 bhutan_events.815.b: "Perhaps the taxes could be eased slightly."
 bhutan_events.815.c: "Clamp down on these dissidents."

 bhutan_events.816.t: "The Wedding"
 bhutan_events.816.d: "Weddings in Bhutan are a long and highly ritualized affair, starting with consultations with an astrologer to find an auspicious date based on the couple's birth years. The wedding itself opens with a Lhabsang ritual to appease local deities, followed by the lighting of butter lamps as an offering of merit, and then a purification rite called Thrisor, meant to cleanse the couple's body, speech, and mind, followed by the Tsepamey Choku longevity blessing, which invokes the Buddha of long life over them. The couple then drinks home brewed Ara, a strong spirit, from the same wooden bowl, symbolizing their shared life together, before guests present them with the five colored ceremonial scarves and white khatas of a newlywedded couple.\n\nGuests have gathered today in the garden of Ugyen Pelri Palace, graciously lent out to the happy couple by Tshering Penjor, to celebrate the marriage between Jigme Dorji Wangchuck and his betrothed, the young Kesang Choden Dorji. This marriage, planned out by the late king Jigme and his Gongzim Sonam Topgye more than a decade ago at a New Year's gathering in Calcutta, marks the final progression of the alliance between the Wangchuck and Dorji families.\n\n Kesang Choden was carried into event on a richly decorated horse, flanked by a brightly dressed procession which stretched on for nearly a mile behind her, an almost fairytale meeting of beloved betrothed. Having been educated at a convent school in Kalimpong, Calcutta, and then in Switzerland, the young princess is sharp and well versed in geopolitical and diplomatic matters, making her a formidable ally to the newly risen monarch. Already, she has begun planning a diplomatic tour of the world, to be actioned once global conflict has subsided. There is little doubt that she will help to bring Bhutan into a new modern world!"
 bhutan_events.816.a: "Three cheers for the newlyweds! "

 bhutan_events.817.t: "Marital Strife is a National Concern"
 bhutan_events.817.d: "Even the most fruitful and devoted relationships have peaks and valleys, and the marriage between Jigme Dorji and Kesang Choden is no exception. Eschewing the Bhutanese tradition of taking several wives, practiced by his father and grandfather, Jigme Dorji has instead taken on a mistress, the young, beautiful, and (according to some) dangerous Yangki. Having been introduced into the court from her native land of Tibet by the King’s step mother, the late Jigme’s second wife Pema Dechen, there is some question as to whether her elevation and introduction to the King was a deliberate attempt to drive a wedge between the young ruler and his Dorji benefactors, including his wife. Though Yangki has more or less known her place as an unacknowledged mistress, many claim that she whispers accusations against the Dorjis and their aggressive reform projects. Though these rumours are unsubstantiated, if they were true Yangki may serve as the nucleus for a new traditionalist movement, untouchable by the Dorji clan and their reformer allies."
 bhutan_events.817.a: "What is Pema Dechen up to?"

 bhutan_events.818.t: "The Wedding"
 bhutan_events.818.d: "Weddings in Bhutan are a long and highly ritualized affair, starting with consultations with an astrologer to find an auspicious date based on the couple's birth years. The wedding itself opens with a Lhabsang ritual to appease local deities, followed by the lighting of butter lamps as an offering of merit, and then a purification rite called Thrisor, meant to cleanse the couple's body, speech, and mind, followed by the Tsepamey Choku longevity blessing, which invokes the Buddha of long life over them. The couple then drinks home brewed Ara, a strong spirit, from the same wooden bowl, symbolizing their shared life together, before guests present them with the five colored ceremonial scarves and white khatas of a newlywedded couple.\n\nGuests have gathered today in the garden of Tshering Penjor’s Ugyen Pelri Palace, in Paro, to celebrate the coupling of Tshering Penjor’s daughter Rinzinmo, borne to his favorite mistress. Her partner is none other than General Namgyal Bahadur, finally bringing the seasoned warrior into the household of the king officially. After years of fruitful partnership, it is clear that Tshering Penjor views the commander as his own son, and through the layers of courtly and ritual etiquette all in attendance could see the King’s elation for this auspicious coupling.\n\nNot all in attendance were quite as happy, however, with many seeing this marriage as an affront to the careful arrangement of the late king’s son, Jigme Dorji, as Tshering Penjor’s heir. Whether this new wedding will signal future intrigues aimed at placing Namgyal Bahadur, or his issue, onto the throne instead of the young heir is yet to be seen, but there is no doubt that this is a day for celebration and consternation in equal measure."
 bhutan_events.818.a: "Don’t be so dour, it’s a celebration!"

 bhutan_events.819.t: "Tales from a Madman"
 bhutan_events.819.d.z: "There is no doubt that the Zhabdrung Rinpoche has inspired the loyalty and devotion of a heterogeneous (and often odd) collection of followers. Some of his devotees are outcasts, unwelcome in other corners of Bhutanese society, while others are opportunists who saw the Zhabdrung as a pathway to greater power and influence. Some among them have managed to carve out their own following, leveraging charisma or action to woo masses and inspire loyalists, such as the storyteller Marpa Boen. This strange man, thought to be named after the famed Kagyu lama Marpa Choekyi Lodroe, has enthralled growing crowds with his tales chronicling the rise of great and fictional empires in distant realms. Many have attempted to interpret his works as being vessels for moral messages and dharmic lessons, though few have been able to discern any comprehensive message or meaning.\n\nThis has not prevented him from gathering large throngs of listeners to his outrageous claims, such as his doomsday prediction that a great Nepalese empire may one day stretch over all of India. Regardless, he has been largely ignored as a harmless crackpot until his most recent tirade, which detailed a grandiose empire of Druk Yul extending over the whole of the Himalayas. Such a story, while awfully flattering towards the power of our nation and government, is certainly incendiary, and may serve to damage our already tense international relations. Many have begun to see Marpa Boen as a liability, and have argued that the time has come to denounce him formally as a dangerous subversive. However, it is highly unlikely that any of his followers will abandon their respect for this audacious lama on the back of our disapproval. Additionally, responding to such optimistic prognostications with a harsh rebuke may lead some to feel that we are not confident in our martial abilities."
 bhutan_events.819.d.wangchuck: "There is no doubt that the Zhabdrung Rinpoche inspired the loyalty and devotion of an eclectic mix of dangerous subversives, scheming bandits, and insane monks. Following his defeat, most of the dangerous subversives and scheming bandits were dealt with, but unfortunately for us the insane monks largely remained unshaken in their positions in society, protected by tradition and ancient prerogatives. Some of these wayward teachers have even managed to carve out their own following in the wake of their master’s untimely demise, leveraging charisma or action to woo masses and inspire loyalists. One such leader, the storyteller Marpa Boen, has enthralled growing crowds with his tall tales chronicling the rise of great and fictional empires in distant realms. Thought to be named after the famed Kagyu lama Marpa Choekyi Lodroe, he rose from the faltering ruins of the Zhabdrung’s conspiracy to a place of provincial renown in the last year. Many have attempted to interpret his works as being vessels for moral messages and dharmic lessons, though few have been able to discern any comprehensive message or meaning.\n\nThis has not prevented him from gathering large throngs of listeners to his outrageous claims, such as his doomsday prediction that a great Nepalese empire may one day stretch over all of India. Regardless, he has been long derided as little more than a minor troublemaker until his most recent tirade, which detailed a grandiose empire of Druk Yul extending over the whole of the Himalayas. Such a story may serve to damage our already tense international relations, and some think it is an attempt to form a new expansionist movement from the ashes of the Zhabdrung’s following. It would not be a terribly unpopular act to bring the raving lama in chains to the capital on the grounds of treason, and Marpa Boen’s former ties to the Zhabdrung would be evidence enough to ensure his elimination is accepted. Then again, such a harsh rebuke to his optimistic prognostications of conquest may lead some to feel that we are not confident in our martial abilities."
 bhutan_events.819.a: "He’s harmless!"
 bhutan_events.819.b: "Distance ourselves from this kook."
 bhutan_events.819.c: "Nobody will miss him."

 bhutan_events.820.t: "Bhutanese Passports"
 bhutan_events.820.d: "Prior to the unification of Bhutan, various petty kingdoms of this region of the Himalayas squabbled and jostled for dominance. These chiefdoms would issue their emissaries elaborate passbooks, called dzengs, to grant them rudimentary diplomatic protections in the dangerous mountain arena. Following the arrival of the Zhabdrung and the unification of the realm under his rule, these dzengs fell out of favor, as power concentrated in the hands of the Druk Desi, and then later the Wangchuck Druk Gyalpo.\n\nWhile the internal situation in Bhutan has certainly stabilized, our newfound interest in foreign engagement has led to revived interest in developing national passports for Bhutan. Such a passport would facilitate travel by Bhutanese citizens, integrating them into the regimented diplomatic landscape of the modern world. Already, court artists have drafted two examples to be examined by the king for his approval. One dyed in blue, and another in red, both are emblazoned with spectacular dragons, a grand example of the skill of our finest artists. Should he approve of either design, a (likely more rudimentary) print will be crafted so that a series of these exciting new documents can be made and distributed. Only one question remains - which version will the king like best?"
 bhutan_events.820.a: "A beautiful, blue passport!"
 bhutan_events.820.b: "An exciting crimson design!"

 bhutan_events.821.t: "Dealing with Dorji Lands"
 bhutan_events.821.d: "The southern lowlands are awash with Lhotshampa outsiders, invited into our nation by the Dorji clan and their allies in the hopes of strengthening their numbers and wealth. They have carved out a web of villages and settlements in the jungles of the southlands, and have prospered in the last decade or two under the absentee rule of the Dorji dogs. The Dorji have been too interested in interfering in affairs of state and growing rich on the Indian teat to notice the vast untapped wealth of their growing vassals. With Sonam Topgye in exile, presumed to be dead, the matter of handling his vast Lhotshampa fiefdom has been brought to the Zhabdrung. These lands are rich and vast, and taxing them directly as lands of the lama would bring much needed wealth to our coffers. But these villages have grown used to their longstanding autonomy. Perhaps we should instead retain the Dorji system of delegation to local village headmen, who then pay a paltry sum to the central government for their position. Such a system is weak and shortsighted, but our alternative plans would certainly inflame the locals, likely to the point of violence."
 bhutan_events.821.a: "No need to poke the tiger."
 bhutan_events.821.b: "Squeeze them..."

 bhutan_events.822.t: "Drawing the Noose Tight"
 bhutan_events.822.d: "Since the first men stepped foot in this mountain realm, its hidden nooks and valleys have been the home of bandits, opportunists preying on the isolated villages and hamlets that crisscross the land. In the decades since Bhutan unified, considerable effort has been expended to try to reel in these dangerous outlaws, though progress has been faltering and slow. Every time a hideout is discovered and a band of bandits is dispatched at the hands of the king’s men, a new hideout springs up in a distant reach, looking to take advantage of the lull in patrols and militiamen. Our recent fortifications have put an end to this game of cat and mouse, however. With new stone reinforced outposts, even limited manpower delegated to key regions can command a formidable presence, forcing bandits into smaller and smaller pockets of wild land. Today, we have determined the location of three of these remaining bastions of banditry, and have marshalled our forces to destroy them. Conclusively cleansing these regions will give the affected villages an opportunity to properly prepare their defenses, strengthening our grip on wayward territories and hopefully delaying the reassertion of rebel outlaw presence until the far future."
 bhutan_events.822.a: "Leave no survivors."

 bhutan_events.823.t: "Guests from the North"
 bhutan_events.823.d: "As autumn settles over the Phobjikha Valley, villager households prepare for an informal pilgrimage. Word had come from up the valley that the black-necked cranes, those graceful godlike beings of the Tibetan plateau, will return this evening. Every year they descend with pomp, wheeling around the great Gangtey Monastery three times in a silent salute. Families pause from gathering the last of the harvest, traveling to Gangtey in the hopes of catching a glimpse of these auspicious visitors silhouetted against the autumn sky. An informal festival of villagers surrounds the monastery: food and drink is shared, stories exchanged, and all the while children dart around in crude costumes mimicking the cranes overhead.\n\nThey will spend the winter here in the marshes of Phobjikha before returning to their homes in the Tibetan highlands, where they meet back with their life-partner to mate. Until then, they will roost in our lands, blessing our people with their divine watch. Those passing through the valley often go far out of their way to see the beautiful creatures, and to enjoy the hospitality of Gangtey and its environs, viewing this turn of the season as a local tradition worth celebrating."
 bhutan_events.823.a: "Even in uncertain times, they never forget the way home!"

 bhutan_events.824.t: "Butter Lamps in the Dark"
 bhutan_events.824.d: "A farmer and his wife arrive at the local monastery, carrying between them two small wooden bowls of freshly churned butter. This gift of yak butter will be put to good use among the butter lamps of the monastery, ritual lights lit to dispel the darkness of ignorance. Though the household can ill afford to spare the offering, they give over a portion to the smiling monk at the doorway. Such a valuable offering is an act of generosity which will surely create merit for the family, and they return to their home content with the knowledge that their offering will be put to good use.\n\nAs dusk falls over Bhutan, families recite quiet, personal prayers, before lighting a lamp. Some pray for the souls of departed parents, others for a healthy harvest or the safe return of loved ones. All across the realm, thousands and thousands of cotton wicks are lit, casting away the shadows which have crept in with the evening. In great halls and tiny hovels alike, flames flicker in the growing dark, creating a great sea of warmth and enlightenment which unites the faithful in reverence."
 bhutan_events.824.a: "Light a lamp and pray for the nation."

 bhutan_events.900.t: "Issues of Taxation"
 bhutan_events.900.d: "While technically ruling over all of Bhutan, the Druk Gyalpo has little ability to leverage tax upon the vast majority of his subjects. He is limited to certain ancient taxes, along with emergency corvee labor, to obtain wealth from the peasantry under the dominion of his Penlop lords, though even these forms of control are typically siphoned down by lords and lamas alike. Because of this, much of the king's revenue comes from the lands he owns directly, where he is able to squeeze out the wealth of his subjects without disruption from his petty underlings. Of course, the borders between the areas of central dominion and feudal control are blurry at best, and there are often conflicts over whether specific hamlets and villages may be taxed by the king, conflicts which are solved with might as often as with mediation.\n\nMost recently, a few hamlets which have traditionally paid their dues to the king directly have instead begun paying tithes to Talo Monastery, the home of the Zhabdrung Rinpoche. The monastery has asserted ancient prerogatives, citing promises made by the late Ugyen Wangchuck that his taxation of these regions would be temporary. We must decide how to respond to this impetuousness."
 bhutan_events.900.a: "Why fight over a couple of measly peasants?"
 bhutan_events.900.b: "Forget these baseless claims and tax them!"

 bhutan_events.901.t: "A Cabal Revealed!"
 bhutan_events.901.d: "There has always been significant integration between the noble families of lords and monks in Bhutan, a reflection of centuries of monastic rule and the calcification of ancient monastic and aristocratic clans. To this end, there is fertile ground among the monasteries to recruit the loyal cousins and brothers of our most trusted courtiers as informants and allies among the far-flung outposts of Buddhist thought (and cloistered unrest). As a result of our efforts, we have uncovered rumours that two senior monks in Tango and Gangtey Monasteries have been poisoning their fellow monks with treasonous slander against the king, advocating in the shadows for the restoration of the Zhabdrung Rinpoche. Our contacts in these two monasteries are shaky in their assessments, however, as neither are trusted by the rebellious monks. Instead, they have been forced to interpret rumour and gossip to determine the leaders of these dissenting groups, and have only a tenuous understanding of the situation. Regardless, we could move decisively to handle this issue, by sending some of the royal guards to arrest those identified as insurrectionists, or even to send detachments of royal warriors to secure the monasteries, though such an action will likely incense the religious authorities in our realm, as it would be a direct affront to their ancient privileges. No matter what we do, we will be able to send any royal forces before the mountain passes thaw, and many advisors have suggested we wait even longer, holding off from moving royal soldiers until our allies in Tango and Gangtey send us fresh intelligence regarding the situation."
 bhutan_events.901.a: "We must collect more evidence against them."
 bhutan_events.901.b: "Arrest these two troublemakers."
 bhutan_events.901.c: "Send a sizable force and crush these hotbeds of rebellion!"

 bhutan_events.902.t: "Word from Phuentscholing"
 bhutan_events.902.d: "Ever since his family built their vast estate on the Indian border at Phuentscholing, Sonam Topgye Dorji has been the conduit through which arms and goods from the outside world trickle into Bhutan. Most recently, our Gongzim has made contact with a few arms dealers in Calcutta, who make their money smuggling “lost” surplus arms from German and British colonies to nefarious groups throughout Asia, particularly the socialist revolutionaries lurking in China and Indochina. While these men are driven by their repugnant ideology and greed in equal parts, they are regarded throughout Indochina as honest dealers. These rifles could seriously bolster the position of the king, as modern weaponry is a rarity in the mountain kingdom, and likely not used in any great number by the rebels. However, calling on the assistance of Sonam Topgye will only further indebt the king to his Gongzim advisor, a man who has gained considerable power in the decade following the death of the late King Ugyen."
 bhutan_events.902.a: "Tell him to call in his contacts."
 bhutan_events.902.b: "We do not need smuggled arms!"

 bhutan_events.903.t: "Smuggled Arms Arrive"
 bhutan_events.903.d: "The shipment of weaponry we commissioned through the Dorji family has arrived in our camp, bolstering our armories with turn of the century bolt-action rifles, a massive step up from the old flintlocks we have long relied on. Already, the king has set about organising the division of these arms among himself and his vassals, attempting to head off conflicts over perceived favoritism among his more disruptive allies. Many of the Penlop and Dzongpon lords equip their men with little more than swords and bows, but supplying them with advanced weaponry may serve to embolden their more independent-minded dreams. On the other hand, hoarding the new rifles for the king’s Royal Guard would certainly anger the men who have committed their levies to the defense of the king. The king’s generosity would certainly be called into question, and thus his legitimacy as preeminent ruler of Bhutan."
 bhutan_events.903.a: "Spread them widely among our allies!"
 bhutan_events.903.b: "Give away the minimum required to save face."

 bhutan_events.904.t: "Hindu Mercenaries Arrive"
 bhutan_events.904.d: "While the vast majority of our army is made up of the loyal sons of our subjects, during times of crisis we have often reached out to the expertise of foreign mercenaries. Most recently, Tshering Penjor has called upon the service of foreign Hindu warriors from Sikkim and Assam, gathering a sizable band of experienced warriors to expand our host. While these men have cut their teeth in local conflicts in Nepal and India, making them formidable fighters, their impending arrival has been a source of discontent among many of our own underlings. They have argued that our employment of Hindu mercenaries would provide ample fodder for the Zhabdrung’s arguments that he alone fights for Buddhist piety. There is no doubt that the optics are unfavourable, but can we really turn away soldiers at a time like this? Tshering Penjor has remained stalwart in his support of the mercenaries, but it is ultimately up to the king whether they should be accepted and paid."
 bhutan_events.904.a: "Cast these wretched mercenaries out."
 bhutan_events.904.b: "We will take anyone we can get!"

 bhutan_events.905.t: "Hindus Clash with our Militias"
 bhutan_events.905.d.tpvanguard: "The Hindu mercenaries from Sikkim and Assam have been a major thorn in our side in recent weeks. While initially they managed to keep out of the hair of our more unruly warriors, tensions have recently increased to a point where wholesale slaughter is a distinct possibility. Following an accusation that the Hindu mercenaries had disrespected a local shrine, the militias made up of the local men of Punakha clashed in a brief scuffle with the mercenaries, leaving one man from each party dead. Though the fight was broken up by the Royal Guard, both groups have threatened revenge, and appear to be preparing to once again attempt to destroy one another. This situation must be resolved immediately, or else it may lead to the complete breakdown of order among the gathering host. Though Tshering Penjor was the figure who first brought these wretched mercenaries into the capital, he has somehow managed to get ahead of the most recent embarrassment, serving as an advocate and informal spokesman for the militias and their supporters, meaning that he may yet be able to wind down the impending bloodshed. While this is likely a scheme to increase his own power at the cost of the king’s authority, the king still has the opportunity to play this situation off as the work of Tshering Penjor in his role as the king’s appointed subordinate."
 bhutan_events.905.d.jwvanguard: "The Hindu mercenaries from Sikkim and Assam have been a major thorn in our side in recent weeks. While initially they managed to keep out of the hair of our more unruly warriors, tensions have recently increased to a point where wholesale slaughter is a distinct possibility. Following an accusation that the Hindu mercenaries had disrespected a local shrine, the militias made up of the local men of Punakha clashed in a brief scuffle with the mercenaries, leaving one man from each party dead. Though the fight was broken up by the Royal Guard, both groups have threatened revenge, and appear to be preparing to once again attempt to destroy one another. This situation must be resolved immediately, or else it may lead to the complete breakdown of order among the gathering host. Though Tshering Penjor was the figure who first brought these wretched mercenaries into the capital, he has somehow managed to get ahead of the most recent embarrassment, serving as an advocate and informal spokesman for the militias and their supporters. With this breakdown, the king’s role as the ultimate leader of the assembling host has been irreversibly damaged."
 bhutan_events.905.a: "Send Tshering Penjor to calm the masses down."
 bhutan_events.905.b: "The Hindus must leave on their feet, unless they wish to leave on their shields."
 bhutan_events.905.c: "The Hindus must leave on their feet, unless they wish to leave on their shields."

 bhutan_events.906.t: "Leading the Vanguard"
 bhutan_events.906.d: "A handful of Penlops and Dzongpons have pledged their house armies to our noble cause against the anarchy and banditry of the corrupted Zhabdrung reincarnation, sending loyal soldiers and distant relatives to our capital in Punakha to assemble in the growing royal host. For his part, Tshering Penjor has not sent a second son or distant nephew, but has instead arrived himself at the head of his host of men. They are nearly as plentiful as the warriors King Jigme himself has pledged to the expedition against the Zhabdrung, though their armaments are significantly more rudimentary.\n\nTshering Penjor’s allies within court, mainly traditionalists and members of the Royal Guard, have requested that he be named commander of the growing royal host, pointing to his martial prowess and devoted loyalty to the king. After all, while Jigme was a mere swaddled babe, Tshering Penjor battled against the opponents of Wangchuck rule in the civil war which elevated Ugyen Wangchuck as the first king of Bhutan. Though Tshering Penjor did contest the throne during the rise of Ugyen’s son, in the decade since he has been loyal and committed, if detached, to the cause of the Wangchuck family. Jigme, for his part, worries that the infamy of attacking a monastery will blacken his name forever, regardless of the assurances of the loyalist monks. Placing Tshering Penjor in the fore would give him some cover against such accusations, and may save him from whatever curse the Zhabdrung may lay against his opponent. However, some of King Jigme’s inner circle, especially those more loyal to Gongzim Sonam Topgye, have cautioned against formally granting Tshering Penjor command of the host. They argue that any title granted to Tshering Penjor will merely inflate his ego and embolden his allies in court, and may even lead them to forget their duty to their king."
 bhutan_events.906.a: "King Jigme will lead the royal forces."
 bhutan_events.906.b: "Tshering Penjor may lead the royal forces."

 bhutan_events.907.t: "Changing the Guard"
 bhutan_events.907.d: "The position of head of the Royal Guard has remained in the hands of an elder member of the Wangchuck family since long before the coronation of Jigme. With rumours of plots against Jigme, Tshering Penjor has pushed relentlessly for the installation of King Jigme's cousin, the noble warrior Chabda Namgyal Bahadur, into this post. While the king is wary of introducing a loyal agent of Tshering Penjor in such a powerful position, Namgyal Bahadur is a proven commander and skilled fighter. Famous for breaking two rifles with his bare hands during training with the British, Namgyal Bahadur is renowned for his strength and courage. His help would be invaluable were armed conflict to break out between us and the rebels. After all, who wouldn’t want the skills of a proven battle commander, known among the British as the ‘man with two spines.’"
 bhutan_events.907.a: "The king must be protected! Call on Penjor's man!"
 bhutan_events.907.b: "Changing things now will look weak. Stay the course!"

 bhutan_events.908.t: "Dealing with the Uncharted Passes"
 bhutan_events.908.d: "In a recent meeting with a number of his closest advisors, the King has been made aware of staggering gaps in our control of the southern passes between our kingdom and the Duar lowlands claimed by the Indians. Several passes are entirely unmanned, meaning that anyone and anything can pass in and out of our realm unmolested. A fact which came to a head recently when the Zhabdrung disappeared from Talo Monastery. While fears of Indian encroachment are low, bandits and smugglers may be using these passes to ferry support to the malcontented monks coalescing around the Zhabdrung Rinpoche.\n\nThe traditionalists have loudly called for additional outposts and patrols to guard these passes, remote as they may be. The Reformists and Gongzim Sonam Topgye Dorji have pushed against their demands, claiming that the cost is too steep and the benefits are limited. What they are less interested in saying, of course, is that some of the smugglers making use of these passes are under Dorji employ. The revenue from these ill-gotten transactions typically trickles down into the treasury of the king, meaning that constricting these routes may hurt the coffers more than the initial investments required."
 bhutan_events.908.a: "Create new outposts along the southern border!"
 bhutan_events.908.b: "Just remain vigilant at the posts we control."

 bhutan_events.909.t: "Restoring Taa Dzong"
 bhutan_events.909.d: "First built by the first Penlop of Trongsa in 1652, Taa Dzong has watched over Trongsa Dzong for centuries, the stalwart defender under which the Wangchuck family could sleep peacefully, even during the trouble times of civil war which gripped Bhutan in the near past. This watchtower sits on a spur which provides unmatchable visibility over the valley before, and is defined by four surveillance points, resembling the Dragon, Garuda, Tiger, and Lion. While the lower chambers and the attached temples remain functional, the central tower has fallen into disrepair following the ascension of the Wangchuck family to national prominence and their shift of focus towards Punakha.\n\nWith civil strife once again boiling over into internal conflict, the castellan of Trongsa has requested emergency funds to renovate Taa Dzong to bolster the defenses of Trongsa. While Trongsa is not the capital, it is a critical center of Wangchuck control and support, and remains the traditional home of the family. Ignoring it would look weak, though the funds needed to support renovations would stretch our coffers at a time where we will need every silver piece we can find. After all, armies and guns are not free, and we will certainly need both in the coming days."
 bhutan_events.909.a: "We cannot afford to look weak, give him the money!"
 bhutan_events.909.b: "We cannot afford such excesses."

 bhutan_events.910.t: "Running Low on Labourers"
 bhutan_events.910.d.prior_southern_outposts: "The feudal system which holds Bhutan together rests atop a vast army of hereditary serfs, debt bondservants, and slaves (primarily captives from raids), who are all tied by law to estates and forced to perform agricultural and forced labor for the nobles and monasteries of the kingdom. We have long relied on corvee labor, demanded in lieu of taxes, from the hands of these destitute masses to build any sort of genuine infrastructure in the realm, from fortresses to mountain paths. We have called upon nearly all of the labor normally available to us when we moved to build new outposts in the southern passes, leveraging the traditional corvee obligations of our subjects to haul materials to the border and set to work quickly building watchtowers and camps.\n\nThis burden on our resources has left us in a bit of a bind regarding our newfound attempts to rebuild the central tower of Taa Dzong. With most of our manpower devoted to the border, we cannot rely on traditional sources of labor to finish the job. In these unprecedented times, however, we could press even aggressively to squeeze our vassals for results, by invoking a few of the more odious corvee rights afforded to the king. Pushing too hard now will prevent us from leveraging these sources in the future, unfortunately, but desperate times call for desperate measures. Without this sacrifice, our attempt to safeguard Trongsa will certainly fail."
 bhutan_events.910.d.prior_taa_dzong: "The feudal system which holds Bhutan together rests atop a vast army of hereditary serfs, debt bondservants, and slaves (primarily captives from raids), who are all tied by law to estates and forced to perform agricultural and forced labor for the nobles and monasteries of the kingdom. We have long relied on corvee labor, demanded in lieu of taxes, from the hands of these destitute masses to build any sort of genuine infrastructure in the realm, from fortresses to mountain paths. We have called upon nearly all of the labor normally available to us when we moved to rebuild the central tower of Taa Dzong, leveraging the traditional corvee obligations of our subjects to haul materials to Trongsa and set to work rebuilding the once formidable fort.\n\nThis burden on our resources has left us in a bit of a bind regarding our newfound attempts to build outposts in the southern passes. With most of our manpower devoted to Trongsa, we cannot rely on traditional sources of labor to finish the job. In these unprecedented times, however, we could press even aggressively to squeeze our vassals for results, by invoking a few of the more odious corvee rights afforded to the king. Pushing too hard now will prevent us from leveraging these sources in the future, unfortunately, but desperate times call for desperate measures. Without this sacrifice, our attempt to guard the passes will certainly fail."
 bhutan_events.910.a: "Gather every able body we can muster!"
 bhutan_events.910.b: "We should not push our luck, abandon the watchtower."
 bhutan_events.910.c: "We should not push our luck, abandon the outposts."

 bhutan_events.911.t: "Coming out of Isolation"
 bhutan_events.911.d: "Strangers are not typically regarded with any degree of trust in Bhutan. Of course, in a country so divided by geography, a stranger could be little more than a man who lives in the next valley or over the nearest hill. For the most part, the people of Bhutan know the families of their hamlet, and some of their neighbours, but rarely have those outside of the minor settlements met countrymen from other regions. In fact, most peasants could not recognise their local liege, holding their local Gewog elders as the most powerful people in their life. While neighbours are mistrusted, those from abroad are generally considered dangerous and outright shunned.\n\nThis state of affairs cannot simply be ignored, as these divisions both physical and societal have left our nation fractured, isolated, and undeveloped. After all, how is a local community going to be able to band together to build a sawmill or a canal when they cannot trust each other? How is our nation going to accept barter, knowledge, and aid from the outside world when foreigners are hated? We must open the marketplaces and village squares to all sorts of new and modern economic efforts, embracing exciting new practices and ideas."
 bhutan_events.911.a: "We will shed the shackles of our isolation!"

 bhutan_events.912.t: "Completing the Lateral Road"
 bhutan_events.912.d: "For generations, our valleys have faced one another across mountains as strangers. Travel was slow, trade uncertain, and authority local. Today, the shackles of that isolation are loosened, if only by a small amount. Lateral Road is not a proper road in the sense understood by westerners, but rather the reorganization and connection of the various foot and mule paths across much of Bhutan into a single continuous route. Certain trail sections have been expanded, passes once impassable have been carved into, ravines have been bridged over, and ancient footpaths have been cut into lanes which can handle carts. Perhaps, one day, modern motorcars will drive these winding mountain roads, but in the meantime the old reliable hooves of horse and mule walk these trails.\n\nThe Lateral Road now binds Bhutan from east to west, pulling together a chain of distant districts into a single country. Officials move faster, goods flow more freely, and the center can at last be felt at the periphery. This road is much more than the culmination of its stone and gravel, but rather the quiet promise of a new chapter of unity."
 bhutan_events.912.a: "Three cheers for the Lateral Road!"

 bhutan_events.913.t.zhab: "Opening the Nganglam Cement Plant"
 bhutan_events.913.t.nonzhab: "Opening Gomtu Cement Plant"
 bhutan_events.913.d.zhab: "The opening of the Nganglam Cement Plant is the culmination of years of work, the prized jewel of our new attempts to rebuild the nation. Cement is the backbone of all modern industry, and our new manufactory, while archaic by modern standards, represents the pinnacle of our new push for economic development. Nganglam, built nearby rich limestone deposits and the massive religious center of Pemagatshel, sits far outside the reach of the most powerful remnant Penlops. Additionally, nearby merchant and pilgrim trails leading north into Tibet and south into Assam have allowed for the import of foreign machinery and the potential export of the fruits of our labour.\n\nToday, the sounds of numerous hand drills, the open crusher, and the woodfired kiln crack out in the Samtse valley. Our workers, paid in grain directly from the lamas at Pemagatshel, toil away at a new kind of industry. They will achieve enlightenment through the diligence of their work!"
 bhutan_events.913.d.nonzhab: "The opening of the Gomtu Cement Plant is the culmination of years of work, the prized jewel of our new attempts to develop the nation. Cement is the backbone of all modern industry, and our new manufactory, while archaic by modern standards, represents the pinnacle of our new push for economic development. Gomtu, situated between Phuentscholing and Paro, holds significant limestone deposits, while angering no major factions in court. Additionally, a nearby river and its proximity to the Indian border allows for the easy import of foreign machinery, as well as the potential export of our domestically made cement.\n\nToday, the sounds of numerous hand drills, the open crusher, and the woodfired kiln crack out in the Samtse valley. Our workers, paid in grain directly by the King, toil away at a new kind of industry. Their blood and sweat will fuel the next chapter of our kingdom’s growth, and their sacrifices will not be forgotten, even if their names are."
 bhutan_events.913.a: "Three cheers for Nganglam!"
 bhutan_events.913.b: "Three cheers for Gomtu!"

 bhutan_events.914.t.zhab: "Opening the Gangtey Workshops"
 bhutan_events.914.t.tp: "Opening the Paro Workshops"
 bhutan_events.914.t.wangchuck: "Opening the Thimphu Workshops"
 bhutan_events.914.d.zhab: "Gangtey Monastery, nestled deep in the Wangdue Phodrang valley, has long served as the unofficial center of the Nyingma lineage of Buddhism. Standing outside the central control of the Zhabdrung’s Drukpa administrative apparatus, Gangtey has defended their autonomy for hundreds of years. However, the Zhabdrung has finally reeled in this fiercely independent center of religious thought, not through the force of arms but rather through the funding of a new complex of workshops, which sit nearby the glorious monastery, alongside the Nakay Chhu river. These three workshop buildings, each named after the Gangtey Tulku lineage holders, hum with the sounds of newfound industry. Within their walls, small charcoal bloomeries churn out pig iron, while waterdriven saws and mills process timber and foodstuffs. Master craftsmen, recruited from across the kingdom, direct small armies of apprentices and underlings, barking orders from tall perches. While these industries are limited, and the products of their labour are rather rudimentary, these workshops represent the next generation of Bhutanese industry."
 bhutan_events.914.d.tp: "Paro, the old seat of Tshering Penjor, has long been one of the major centers of trade in Bhutan. While its star has fallen somewhat since the days of Tshewnag Norbu, Paro remains the penultimate city of the nation. Our efforts to develop modern workshops in the city have lent it new purpose, as hundreds flock from the countryside to take up roles in this new hub of nascent manufacturing. At the very center of the rapidly growing town, alongside the Paro Chhu river, sit the three main workshop buildings, each named after one of Tshering Penjor’s favourite wives, humming with the sounds of industry. Within their walls, small charcoal bloomeries churn out pig iron, while waterdriven saws and mills process timber and foodstuffs. Master craftsmen, recruited from across the kingdom, direct small armies of apprentices and underlings, barking orders from tall perches. While these industries are limited, and the products of their labour are rather rudimentary, these workshops represent the next generation of Bhutanese industry."
 bhutan_events.914.d.wangchuck: "Thimphu, located between Phuentscholing and Punakha, has rapidly become a major center of Wangchuck control. Serving as the unofficial summer residence of the King and his court, Thimphu has risen from a small village to a growing town through the years of Wangchuck dominance, and many see it as a true second capital of Bhutan regardless of the importance of Punakha Dzong. At the very center of the rapidly growing town, alongside the Thimphu Chhu river, sit the three main workshop buildings, each named after a famed Wangchuck ancestor, humming with the sounds of industry. Within their walls, small charcoal bloomeries churn out pig iron, while waterdriven saws and mills process timber and foodstuffs. Master craftsmen, recruited from across the kingdom, direct small armies of apprentices and underlings, barking orders from tall perches. While these industries are limited, and the products of their labour are rather rudimentary, these workshops represent the next generation of Bhutanese industry."
 bhutan_events.914.a: "Three cheers for the Gangtey Workshops!"
 bhutan_events.914.b: "Three cheers for the Paro Workshops!"
 bhutan_events.914.c: "Three cheers for the Thimphu Workshops!"

 bhutan_events.915.t: "Herding Cats"
 bhutan_events.915.d: "While initial attempts to organise regional muster rolls have borne some fruit, our efforts to expand this project have all but stalled out. Attempts to register fighters, standardize obligations, and draw village militias under any sort of central direction have met quiet resistance and disconcerting inaction. Gewogs grumble at outsiders counting their able-bodied men, elders insist on ancient exemptions, and local leaders remind our agents and officials that loyalty has long flowed through local bonds, not distant offices. Some argue that friction between the locals and the state is merely the price of progress, that the benefits of an organised levy far outweigh the concerns and complaints of these petty power brokers. Others warn that pressing the villages too hard will shatter the already brittle bonds between our regime and our peasants. The choice before us is clear, if unpleasant. Either we push ahead to impose our will, whipping the villages into shape and achieving our goals at the cost of public opinion, or we accept that Bhutan’s strength lies in its peasantry, who answer the call to service on their own terms."
 bhutan_events.915.a: "Push forward, damn the grumblers!"
 bhutan_events.915.b: "Ease off the demands and maintain the moderate levy."

 bhutan_events.916.t: "Chinese Smugglers Arrive with Arms"
 bhutan_events.916.d: "With significant experience smuggling arms throughout the warlord era, the gun smuggling rings of China are elite professionals, with armies of suppliers and porters, as well as complex networks of local patronage and bribed officials. With this expertise comes excellence, and they have not fallen short of their reputation today, with a wagon train of modern military equipment coming from all corners of the earth, as well as matching caches of ammunition. Unfortunately, this excellence comes at a cost, and our contacts have laid out their traditional bill of sale with our agents at the northern border. While these weapons are incredibly expensive, without any equivalent local production their value is monumental. We will pay the cost of a castle for the boons of an armory, but what use is a castle in the modern day without riflemen to defend it?"
 bhutan_events.916.a: "Pay them quickly and thank them profusely!"
 bhutan_events.916.b: "The price is too high, turn them away."

 bhutan_events.917.t: "Chinese Smugglers Arrive with Demands"
 bhutan_events.917.d: "With significant experience smuggling arms throughout the warlord era, the gun smuggling rings of China are elite professionals, with armies of suppliers and porters, as well as complex networks of local patronage and bribed officials. With this expertise comes excellence, and they have not fallen short of their reputation today, with a wagon train of modern military equipment coming from all corners of the earth, as well as matching caches of ammunition. Unfortunately, this excellence comes at a cost, and while the traditional costs of these weapons are high, today our contacts are demanding an oppressive amount for their services. Claiming that recent developments in China have raised their prices, their current demands are far above what is reasonable. However, they understand well that without any equivalent local production the value of their goods is monumental, leaving us without much of a say in negotiations over the price of a rifle."
 bhutan_events.917.a: "Pay them quickly, if begrudgingly."
 bhutan_events.917.b: "The price is too high, turn them away."

 bhutan_events.918.t: "Chinese Smugglers Arrive with Excuses"
 bhutan_events.918.d: "With significant experience smuggling arms throughout the warlord era, the gun smuggling rings of China are elite professionals, with armies of suppliers and porters, as well as complex networks of local patronage and bribed officials. However, even the most renowned experts can run into situations beyond the scope of their abilities. Our contacts in China have arrived without much of their typical stocks and with little of their traditional fanfare, claiming that a series of disasters on the road have thinned their caravan and left them with little remaining weaponry to sell. Even still, they have demanded the full price for their services, claiming that their deliveries to our distant realm makes them uniquely vulnerable to the whims and dangers of warlords and bandits on the road. Whether or not we agree with this claim, we have little choice but to engage with their demands."
 bhutan_events.918.a: "Pay them quickly and pray for better luck next time!"
 bhutan_events.918.b: "The price is too high, turn them away."

 bhutan_events.919.t: "Indian Smugglers Arrive with Arms"
 bhutan_events.919.d: "Smuggling rings have rapidly grown in India as central order broke down and conflict arose, but they are still rather young and limited in scope. Unlike the lawless arms trade of China, where gunrunning is borderline state-sanctioned, the smugglers of India work against the watchful eye of government intervention, who seek out these merchants as a source of corruption and the fuel for the fires of fifth columnists. Even still, our contacts have managed to assemble an array of weaponry which has been “lost” by military and administrative officials, or scrounged from the remains of battles and the hidden caches of revolutionaries. Their prices reflect the personal risk they take from their role as illegal merchants of death, but considering the difficulty of making or procuring modern weaponry, it is not like we can really haggle for a more favourable rate. We will simply have to swallow our pride and pay handsomely for their ill-gotten goods."
 bhutan_events.919.a: "Pay them quickly and thank them profusely!"
 bhutan_events.919.b: "The price is too high, turn them away."

 bhutan_events.920.t: "Indian Smugglers Arrive with Demands"
 bhutan_events.920.d: "Smuggling rings have rapidly grown in India as central order broke down and conflict arose, but they are still rather young and limited in scope. Unlike the lawless arms trade of China, where gunrunning is borderline state-sanctioned, the smugglers of India work against the watchful eye of government intervention, who seek out these merchants as a source of corruption and the fuel for the fires of fifth columnists. Even still, our contacts have managed to assemble an array of weaponry which has been “lost” by military and administrative officials, or scrounged from the remains of battles and the hidden caches of revolutionaries. Their prices reflect the personal risk they take from their role as illegal merchants of death, and with claims of recent government crackdowns and troublesome customs and police patrolling, they have pushed for prices which are outrageous, even in the context of their sacrifices. Even still, considering the difficulty of making or procuring modern weaponry, we have little choice but to either swallow our pride and pay handsomely for their ill-gotten goods, or turn them away in hopes of more favorable rates in the future."
 bhutan_events.920.a: "Pay them quickly, if begrudgingly."
 bhutan_events.920.b: "The price is too high, turn them away."

 bhutan_events.921.t: "Indian Smugglers Arrive with Excuses"
 bhutan_events.921.d: "Smuggling rings have rapidly grown in India as central order broke down and conflict arose, but they are still rather young and limited in scope. Unlike the lawless arms trade of China, where gunrunning is borderline state-sanctioned, the smugglers of India work against the watchful eye of government intervention, who seek out these merchants as a source of corruption and the fuel for the fires of fifth columnists. Bearing this in mind, it is not exactly shocking that our contacts have come today with excuses of governmental crackdowns on their operations, leaving them with significantly reduced stocks of arms. Even still, they have demanded high prices for what stocks they have, claiming that without higher profits on each weapon they cannot weather these more recent attacks on their livelihoods. Whether or not we agree with this claim, we have little choice but to engage with their demands."
 bhutan_events.921.a: "Pay them quickly and pray for better luck next time!"
 bhutan_events.921.b: "The price is too high, turn them away."

 bhutan_events.922.t: "Renovating our Dzongs"
 bhutan_events.922.d: "Dzongs are fortified monasteries which serve as the religious, military, administrative, and social centres. While many of the Dzongs of Bhutan were initially built in the late medieval period, they remain the focal points of government power in the nation. Dzongs are typically divided into two parts, with half of the fortress devoted to the secular functions of the penlops governors, namely the governance of their feudal territory and defence against bandits and foreign invaders. The other half of these monasteries serve a more religious function, primarily as the temple and housing for monks. This division between administrative and religious functions reflects the idealised duality of power in Bhutan, where the lords and monks work hand in hand for the benefit of the state as a whole.\n\nAs we expand these centres of defense and administration, we will need to navigate their dual nature. With our resources limited, we can either focus on expanding the role of certain key Dzongs as vital administrative, religious, and economic centres, or as the focal points of local defensive measures. Unfortunately, we cannot afford to shore up our walls and construct military improvements while also building new monastic offices and courtyard markets, meaning that we will have to narrow our focus to the currently pressing needs of our people and nation. Regardless of our choice, these newly renovated Dzongs will serve as  sources of central authority in our more far flung provinces."
 bhutan_events.922.a: "Focus on administrative and religious improvements."
 bhutan_events.922.b: "Our Dzongs are the backbone of our defensive plans!"

 bhutan_events.923.t: "The Unfinished Reforms of Sonam Topgye"
 bhutan_events.923.d: "Even with the recent rise of Sonam Topgye as regent of Bhutan, the traditional reins of power remain in the hands of the intransigent conservative lords. Any attempts for genuine reform will require us to navigate the entrenched interests of the traditionalist faction, and radical reform will be necessary to supplant their de-facto rule. Though Sonam Topgye’s position as regent is confirmed, he will be forced to rule through traditionalist apparati until he can build an alternate foundation for the nation. To this end, the regent has long championed a council of advisors to the king which he could then stack with allies and invest with power. During the reign of King Jigme, this proposal was almost immediately torpedoed by elder statesmen allied to Tshering Penjor, but with their power waning Sonam Topgye could institute genuine reform.\n\nUntil Sonam Topgye can enact his proposed reforms, he will be forced to officially rule through the traditionalists in court, but once he develops a new base of royal power he will be able to orchestrate the assumption of direct control over the nation at the hands of the reformists!"
 bhutan_events.923.a: "Patience is a virtue..."

 bhutan_events.924.t: "Reconciling the Monks"
 bhutan_events.924.d: "It would not be an exaggeration to say that the relationship between the Bhutanese nobility and her monks has been irreversibly altered by the Zhabdrung’s uprising. Even still, only a small portion of the leading monastic council joined the rebel lama, while the vast majority of religious figures simply sat on the sidelines, neither joining their liege nor their brothers in the conflict which consumed our kingdom. Their neutrality has not exactly inspired confidence in monastic loyalty among the members of the court, but the fact remains that they are an incredibly powerful force which must be handled, one way or another.\n\nUnfortunately, many of the younger religious figures, ambitious firebrands who have felt abandoned by their conservative elders, remain intransigent in their opposition to the status-quo partnership between the monastic council and the monarchy. Despite the defeat of the Zhabdrung, these discontented monks have continued to protest the subordinate role of the Drukpa school to the royal house. Our allies in the monastic council have warned that a concerted effort to bring them back into the fold would be required if we wish to truly bury the hatchet. On the other hand, perhaps we do not need the full support of the monks. The royal house retains allies in the highest positions of religious power, and the position of the monarchy over the monks has only been strengthened by the destruction of the Zhabdrung’s movement."
 bhutan_events.924.a: "Grant sweeping gifts and privileges to sway them."
 bhutan_events.924.b: "Ignore these sore losers."

 bhutan_events.925.t: "Outmaneuvering the Dissenter Monks"
 bhutan_events.925.d: "In the world of military and political conflict, there are few tactics more effective than dividing and conquering. The petulant dissenters among the monks, still smarting at the defeat of the Zhabdrung, have since taken to complaining of the crown’s continued insults against the monastic council. However, since our effort to ply the correct hands and monasteries with generous gifts and privileges, their shouting has largely fallen on deaf ears. After all, it is hard to take seriously a claim of royal neglect when you are furnishing your shrine with newly gifted artifacts and filling your pockets with a healthy stipend. As their claims have grown more and more outrageous, the dissenters have slowly become figures of mockery and jest, even at the hands of some of their former allies within the greater monastic body. With the last lingering influence of the Zhabdrung eliminated, the monks can be once again brought back into the fold, as loyal servants of the kingdom."
 bhutan_events.925.a: "Great!"

 bhutan_events.926.t: "Monastic Dissenters Outmaneuver Us!"
 bhutan_events.926.d: "Though the Zhabdrung currently only keeps the company of worms, his former compatriots among the monastic council continue to terrorize us. These petulant and ungrateful little mongrels have decried our recent “injustices” against the monastic council, claiming that we have deliberately ignored our commitments to the informal partnership between the Drukpa school and the crown. Though their claims are outrageous, they have found fertile ground among many of the monks, even moderates, who have felt abandoned in the wake of the Zhabdrung’s revolt. Of course, the most powerful lies all carry a shred of truth, and the relationship between the monks and the crown has grown more frosty in the days following the Zhabdrung’s revolt. Gifts and privileges once given freely have been closely scrutinized, lest gold given today is spent to fund the revolt of tomorrow. However, the dissenters have managed to twist reasonable concerns into a supposed campaign of royal neglect, trumpeting our supposed misdeeds to any and all who would listen. With these poisoned words coursing through the veins of the monastic community, any hope of a lasting resolution between the King and his monks has been dashed."
 bhutan_events.926.a: "Damn it!"

 bhutan_events.927.t.jw: "A Return to Peaceful Cooperation"
 bhutan_events.927.t.tp: "Bringing the Reformists Back"
 bhutan_events.927.t.st: "Finding Friends Among the Traditionalists"
 bhutan_events.927.d.jw: "As the issue of the Zhabdrung became more and more pressing, the court in Punakha simply could not handle the stress, fracturing along factional lines. With the Zhabdrung dealt with, the king has been able to devote some time towards mending the wounds in his court. For more than a decade, Jigme has straddled the ideological line between the reformists and traditionalists, charting a course of moderate and tempered reform which has pleased few, but angered fewer still. Though his actions have grown more bold following the death of the proverbial sword of damocles hanging over him, Jigme continues to appreciate the advice and aid of both of these factions, juggling a handful of trusted figures from either side as his favored courtiers.\n\nWith tempers settled, it took only a few quiet words to bring moderates from both camps to the table to once again work productively and cooperatively with each other. While tensions remain, especially among certain leading men on both sides, progress has been considerable. Of course, some in the king’s inner circle have warned that without true reform in the culture of the court, some divisions will remain indefinitely, a form of rot which continues to pull our kingdom down until these factions are dealt with."
 bhutan_events.927.d.tp: "While he is certainly a figure from a bygone era, Tshering Penjor is no enemy of progress. He was thrust into de-facto leadership of the traditionalist faction in court due to his military prowess and prominence as a leading Penlop, not because of any sort of ideological zeal for the conservative cause. During his visits to court, Tshering Penjor made few personal enemies among the reformists, even as he cultivated political enemies in droves. Even those who oppose him most fervently begrudgingly respect his gregarious demeanor and generosity as a host, and he is known to have acquaintances and friends among all of the various informal noble cliques.\n\nIt is precisely for this reason that he has been so effective in breaking down the old political barriers which have long divided the court. By fostering a close personal and political partnership with a small group of reformist allies, Tshering Penjor battered down the doors of Sonam Topgye’s cabal. Today, a number of leading reformists stand as close advisors and aides to the monarch, lending newfound legitimacy and political capital to him as the leader of all Bhutan. Unfortunately, this arrangement has not been received particularly well by his old traditionalist champions, who complain loudly and often that they vaulted the old Penlop into the throne, only for him to begin ignoring them."
 bhutan_events.927.d.st: "The gulf between the reformist and traditionalist factions in court had widened in the years prior to the Zhabdrung’s revolt, threatening the integrity of the royal house and shifting the attention of the late king away from the growing power of the insidious rebel lama. If we ever hope to truly reform Bhutan, we will need to deal with this festering division among the nobles and courtiers of the kingdom. Luckily for us, the traditionalists are a broad collection of figures with various goals and focuses, strange bed-fellows bonded together primarily by their distaste for, and fear of, the reforms proposed by Sonam Topgye. Their greatest weakness is their division, and at the end of the day it was not too difficult to find some in their ranks who were willing to see the light.\n\nThough the most ardent traditionalists continue to see Sonam Topgye as a dangerous radical who must be opposed, many among the military elite were swayed by the regent’s arguments regarding army reform. After all, those equipped with bows cannot hope to oppose those with rifles, and rifles must be bought or built. So long as Sonam Topgye does not ignore the interests of these newfound friends, they will join him as allies, and bring the moderate members of their faction (begrudgingly) with them."
 bhutan_events.927.a: "For the time being, peace is enough!"
 bhutan_events.927.b: "Don’t they recognize I am beholden only to the kingdom?"
 bhutan_events.927.c: "Let us welcome these new friends!"

 bhutan_events.928.t: "Composing the National Assembly"
 bhutan_events.928.d: "The central pillar of Gongzim Sonam Topgye’s reform plan is his newly planned advisory body, the National Assembly, which he hopes to serve as the new central organ of royal governance. He has outlined a council of twenty-two representatives and a speaker, who will meet regularly to deliberate matters of national importance, proposing recommendations to the reigning king and providing advice regarding matters of administration. Sonam Topgye has faced little resistance while cementing his own role in this new body, by making the reigning Gongzim the default speaker. Though Gongzims are hypothetically appointed by the king, granting the monarch a role in the assembly, in practice it is a hereditary position passed down the paternal line of the Dorji family, centering this newfound role in their hands.\n\nOn the other hand, the composition of the body of representatives has been the matter of fierce debate among the king’s advisors, with many traditionalist courtiers choosing this point as the hill to die on. Sonam Topgye has called for each of the eight traditional Penlops to appoint a representative, three representatives appointed from the ranks of the Drukpa school, but most importantly eight representatives elected from the ranks of the hundred or so headsmen of the gewog village collectives. The traditionalists have championed an alternative model, wherein each of the eleven Dzongpons appoint a representative alongside the eight appointed by the Penlops, effectively making the Assembly merely another organ of the nobility. They have expressed their shock and dismay at the notion of gewog headsmen having a seat at the side of the king, and have marshalled considerable resources in their attempted to defeat Sonam Topgye’s proposal at the eleventh hour.\n\nIt will take much of Sonam Topgye’s political capital to push through his original plans, capital which he has already largely spent in his attempts to reform the kingdom’s legal and administrative practices. Perhaps Bhutan is not ready for democratic reform, measured as it may be. After all, there are few who actually appear excited by the prospect of political participation at the hands of the village elders, least of all the peasants themselves, who are much more concerned with practical issues, such as their survival through the next winter."
 bhutan_events.928.a: "The Gongzim pushes through his original plan!"
 bhutan_events.928.b: "A watered down plan is adopted."

 bhutan_events.929.t: "First Meeting of the National Assembly"
 bhutan_events.929.d: "After much fanfare, the new National Assembly has come together for one of their two annual meetings in Punakha. Most of its appointed members came from the ranks of longstanding courtiers within the royal court, meaning that there were precious few fresh faces among their number. More importantly, the village representatives were selected at the hands of an excited, if disorganised, election, where collections of gewog headsmen met at regional festivals to select individual regional representatives from among their number to travel to Punakha.\n\nThe aristocratic representatives wasted no time in seizing control of the meeting, drafting up plans and proposals and immediately descending into the same bickering which defined the royal court. After some prodding from Sonam Topgye, however, the village representatives found their voice, imparting their own ideas and proposals. In a rather surprising turn, these headsmen have found common cause with the monastic representatives, and together they have drafted a list of proposals and issues for the speaker to present to the king. While the spirit of cooperation has led to the introduction of some items requested by the present nobles, it appears that the National Assembly experiment has borne some fruit."
 bhutan_events.929.a: "Truly an esteemed collection of advisors!" #ST
 bhutan_events.929.b: "Truly an esteemed collection of advisors!" #JW

 bhutan_events.930.t: "Dealing with the Zhabdrung Sungtrul"
 bhutan_events.930.d: "When the first Zhabdrung Rinpoche Ngawang Namgyal passed away almost three hundred years ago, the Je Khenpo, Druk Desi, and Penlops conspired to cripple the power of the Zhabdrung reincarnations to seize control of Bhutan for themselves. They recognized three different incarnations of the great lama, claiming that his lineage had divided into a mind incarnation, a speech incarnation, and a body incarnation. The body lineage, the Zhabdrung Kugtrul, died out hundreds of years ago amidst the violent factionalism that nearly tore the realm apart, leaving the mind incarnation, the Zhabdrung Thuktrul, and the speech incarnation, the Zhabdrung Sungtrul, to duke it out for the legitimacy of their title. Over time, it became clear that the Zhabdrung Thuktrul was the true successor to Ngawang Namgyal, leaving the Zhabdrung Sungtrul as little more than a relic of a bygone era of strife.\n\nThe rise of Zhabdrung Thuktrul Jigme Dorji to preeminence within the realm has cast new light on this old insult, however. The current speech incarnation, Chogley Jigme Tenzin, has remained silent from his home at Jampa Lhakhang in Bumthang, neither decrying nor celebrating the rise of his brother reincarnation. He has a reputation as a young and energetic teacher, with little interest in matters of politics. However, his mere existence could serve as a rallying point for those against his holiness Jigme Dorji, who are nonetheless committed to the restoration of Zhabdrung governance. A quiet word to some allies in Bumthang, and Chogley Jigme Tenzin could find his way to a fateful accident, nipping this source of dissent in the bud, though such an action will likely lead to colourful and distasteful rumours. On the other hand, why not keep one’s enemies closer? Bringing Chogley Jigme Tenzin into the newly forming inner circle as an advisor would take him outside of the view of those opposed to our new regime, and perhaps his advice may prove useful!"
 bhutan_events.930.a: "Give him a position in the inner circle."
 bhutan_events.930.b: "Two Zhabdrung incarnations are one too many."

 bhutan_events.931.t: "Burn out the Rot"
 bhutan_events.931.d: "Centuries of rot and stagnation have left the black mark of corruption across our realm. Nowhere is this felt more clearly than in the humble villages of our subjects, who labour under the yoke of cruel and unaccountable masters. Their lords entrust the business of taxation to monstrous tax farmers, who compete with one another over who can squeeze the innocents most brutally. Such a system is representative of a realm which has lost its way, and which will soon lose the support of the people. Many of the Zhabdrung’s first and most ardent supporters were humble farmers, who took up arms and risked their lives to bring about a more hopeful future for their children. In the days following our victory, these more ignoble supporters have been largely sidelined, and in the months after many have been branded as bandits and eliminated by our new regime.\n\nThat is not to say that we have forgotten them entirely. The Zhabdrung has demanded that the system of tax farming must be brought to an end, replaced with a council of tax agents selected and vetted by local nobles and monasteries alike. His proposal has faced significant opposition from many of his most trusted advisors, however, who have warned him that such reforms would strike at the very heart of the nobles’ power and privilege. They claim that the new tax commission will be resisted throughout the realm, and may serve as a rallying cry for rebellion. The Zhabdrung must decide whether this is a hill he wishes to die on or if he will be forced to continue to ignore this injustice."
 bhutan_events.931.a: "Get rid of these parasites."
 bhutan_events.931.b: "We cannot risk fueling our opposition."

 bhutan_events.932.t: "Sonam Topgye Dorji Falls from Grace"
 bhutan_events.932.d: "When the late king Ugyen passed away, it was only with the fervent and rapid support of Sonam Topgye Dorji that his young son, Jigme, could rise to power. This partnership, in many ways a continuation of the bond between Ugyen Wangchuck and Ugyen Dorji, deeply colored the governance of Bhutan in the last decade.\n\nWhile Sonam Topgye continues to hold significant formal power, with an iron grip on the kingdom’s diplomatic efforts and control the main hub of southern trade, he has had considerable trouble finding the king’s ear. Instead, King Jigme has increasingly turned to the advice of Tshering Penjor and his most senior lieutenant Namgyal Bahadur, who have proposed a more conservative path forward for the kingdom. More and more, the circle of insiders surrounding his highness is dominated by aristocratic military officers, men with practical solutions to complicated problems. Their loyalty to the king is unquestioned, unlike the coin-counters and unscrupulous schemers who surrounded Sonam Topgye. Hopefully, their new tenure will reduce corruption and simplify the byzantine court."
 bhutan_events.932.a: "A new, more cautious, chapter dawns."

 bhutan_events.933.t: "Tshering Penjor offers the Crown"
 bhutan_events.933.d: "At the turn of the century, Tshering Penjor was granted the vaulted role as Penlop of Paro by former king Ugyen Wangchuck. This posting made him the second most powerful noble in Bhutan, and unofficially crowned him as Ugyen’s prospective heir. As though to confirm this metaphorical crowning, Ugyen further gifted the young Tshering Penjor with the famed Raven Crown, the traditional symbol of royal authority. The Raven Crown, modelled after the battle helmet of the forefather of the Wangchuck monarchy, the “Black Ruler” Jigme Namgyal Wangchuck. The raven motif, central to the crown, represents a form of Mahakala, the guardian deity of Bhutan.\n\nTshering Penjor has recently sent messengers to court, presenting an interesting offer regarding the crown in veiled language. His proposal requests that the crown honors him with the title, “Protector of the East,” conferring specific privileges over settling legal disputes among his neighbouring Penlops and Dzongpons, as well as a small monetary stipend. In return, despite his continuing rightful ownership of the Raven Crown, he would be so moved by this kind gesture by the king that he would be compelled to immediately give the Raven Crown to the monarch as a belated birthday present. While his demands are slightly outlandish, there is no doubt that the Raven Crown is a potent symbol of Wangchuck legitimacy, linking the reigning king to the magnanimity of Ugyen and the ferociousness of the Black Ruler himself. Perhaps we should seize on this opportunity to right generational wrongs, regardless of its price."
 bhutan_events.933.a: "Looks like we have a new Protector of the East!"
 bhutan_events.933.b: "Return with a polite, but firm, rejection."

 bhutan_events.934.t: "A New Quartermaster"
 bhutan_events.934.d: "Until recent days, the notion of a national quartermaster was a silly concept. The armaments scattered across Bhutan are fervently squirreled away by petty lords into hidden and guarded stashes. When each gun is a priceless resource, the idea of trusting hundreds and hundreds into the hands of a single man is considered anathema - after all, a tiny but well equipped army could best the collective efforts of the ruler and nobles, should the man holding the guns get any ideas.\n\nIt is for this reason that Zamadar Chencho is one of the few men both capable and trustworthy enough for such a post. Having proven himself as a loyal but unassuming military leader, Zamadar Chencho has taken up his new post with gusto, immediately setting out on the near impossible task of finding, categorising, and organising the rifles available to the newly growing central forces."
 bhutan_events.934.a: "Now where did all those Patags go?"

 bhutan_events.935.t: "Expanding Punakha"
 bhutan_events.935.d: "Punakha Dzong, known as the Pungthang Dewachen Phodrang, or the Palace of Great Happiness, was first constructed during the reign of the first Zhabdrung, Ngawang Namgyal. It holds Bhutan's greatest relics and is the winter residence of both the King and the Zhung Dratshang, making it a focal point for both temporal and spiritual power. For many, the imposing walls of the Punakha Dzong represent the power of the monarchy itself, and it is for this reason that the palace’s recent descent into disrepair is so important. While many of the more fiscally responsible members of the court have balked at the potential costs of repairs and renovations to the great palace, most have been placated by promises of practical improvements to the palace, with proposed plans including expanded meeting halls and offices for certain key officials.\n\nThe question which then remains is how we should go about building the expansions and renovations. Some of the more reform minded courtiers have proposed that we employ foreign expertise, using more modern techniques to achieve lasting improvements. Others have pushed for us to employ the local builders, using this project to hone their expertise (at a fraction of the price). However, it has been decades since our master builders have undertaken such an extensive project, and they may not be prepared for the potential complications."
 bhutan_events.935.a: "Rely on our old master builders."
 bhutan_events.935.b: "Pay extra for foreign insights!"

 bhutan_events.936.t: "Construction Falters in Punakha"
 bhutan_events.936.d: "Despite our best efforts, construction on the great Punakha Dzong has run into trouble, with delays and issues with materials causing significant setbacks. Unfortunately, certain structural rot led to a small collapse during construction, and according to our finest builders the one man who could have easily buttressed the collapse to allow for reinforcement has passed away a few years ago, taking his expertise with him. With delays creating yet more delays, it will be impossible for the construction to complete on time. Even still, it would be quite difficult for the king to back down from the snowballing issue of the structurally unsound Dzong. Then again, he could always fall back on the superstitious explanation that the construction had upset local spirits, allowing for our builders to merely patch up the new problems and leave it be. While many in the court have advised that we quietly cut our losses, a reinvestment into the project would allow for the repairs and renovations to be properly completed without any more embarrassing setbacks, though we will certainly not finish in time for our current proposed plans."
 bhutan_events.936.a: "Double our efforts!"
 bhutan_events.936.b: "Cut our losses."

 bhutan_events.937.t: "The New Palace of Happiness"
 bhutan_events.937.d: "After a great deal of effort, the Pungthang Dewachen Phodrang has reopened its doors, its structure more sturdy and trappings as beautiful as ever. The great wealth of priceless relics and artifacts have been moved from musty and dusty storerooms to fine public displays. Walls damaged by decades-old fires have been replaced by fresh wood panelling, and the bridge over the Mo Chhu River, which nearly washed away in recent flooding, has been reinforced with new pilings. The royal armories have been expanded and organized, with modern arms finding proper storage, while old swords and bows from the civil war era have been brought up for proud display in the main hall. The monastic quarters have been expanded to accommodate the growing Zhung Dratshang, while many vital courtiers have been granted private office.\n\nAt the heart of the palace, the great hall has been expanded, cleaned, and touched up. However, there is some question regarding the decorations adorning this vital heart of our palace, and the artists have turned to us for some direction regarding the finished touches. One option would be to celebrate the life and lineage of the kings of Bhutan, depicting the rise of the Black Ruler Jigme Namgyal and his son Ugyen Wangchuck, and the legacy of martial and diplomatic prowess that they represent. Alternatively, we could use this space to celebrate the harmony of the modern monarchy, with reference to the union of monks and nobility which serves as the foundation of our realm. Regardless, this new hall will be our greatest glory, showing the wealth and luxury of our royal house!"
 bhutan_events.937.a: "This new hall should celebrate the glory of our lineage!"
 bhutan_events.937.b: "This new hall should reflect the unity of our court!"

 bhutan_events.938.t: "A Deal with the Newar Merchant Families?"
 bhutan_events.938.d: "Originally hailing from Kathmandu Valley, the ethnic Newar trading families have maintained a century-spanning presence in Tibet and Bhutan. Operating primarily out of their homes in Lhasa, these Nepalese exiles have long acted as intermediaries between Tibet, India, and Nepal. These traders primarily deal in textiles, metalware, coins, and luxury imports, competing with local monastic and Penlop sponsored traders, as well as the powerful Tibetan Pangdatsang family.\n\nWith our newfound plans for economic development, our government will have to decide how best to leverage our control over these families, who are clamouring to curry the favor of our court. We could always use their expertise in the development of homegrown Bhutanese capital and industry, but some in our government have turned our attention to an alternative opportunity afforded by these men. They are willing to leverage their control over the trade networks of the scattered Penlops, Dzongpons, and Monasteries of our realm to tighten the central government’s grip, should we maintain the trading privileges they have long been afforded."
 bhutan_events.938.a: "Use their experience and expertise!"
 bhutan_events.938.b: "Use their influence and authority!"

 bhutan_events.939.t: "Handling the Old Favourites"
 bhutan_events.939.d.jw: "After a reign of any sort of duration, favourites are sure to develop in court. Outside of the official trappings of office or official honors lie the subtle distinctions between the court and the its inner circle. At the end of the day, it is the men who ride and hunt and hawk with the king who are most likely to find his ear, and King Jigme certainly has men he enjoys riding, hunting, and hawking with. These are, for the most part, a handful of well liked older nobles, many with links to the royal family stretching back to the reign of Jigme’s father, Ugyen.\n\nIn the wake of the recent disturbances in the countryside and our moves to reshuffle our court, questions have been raised as to whether all of these men have been carrying their weight. Some of the advice the king has received from this cadre of close supporters has been called into question, and a few on the fringes of this group have advocated for the king to spend more time with a younger generation of leaders, who have a better finger on the pulse of the kingdom."
 bhutan_events.939.d.notjw: "After a reign of any sort of duration, favourites are sure to develop in court. Outside of the official trappings of office or official honors lie the subtle distinctions between the court and the its inner circle. At the end of the day, it is the men who ride and hunt and hawk with the king who are most likely to find his ear, and King Jigme certainly had men that he enjoyed riding, hunting, and hawking with. These are, for the most part, a handful of well liked older nobles, many with links to the royal family stretching back to the reign of Jigme’s father, Ugyen.\n\nFollowing the death of their patron, the status of these men has been rather uncertain. While they are not particularly friendly with their new liege, many have made it abundantly clear that they are more than willing to leverage their influence in favor of the new government, in return for the retention of the privileges they have enjoyed under the watch of their prior benefactor. While keeping these old remnants of Jigme’s regime around may be a less than exciting proposition, they are well liked by most of the nobility, and their support would do much to unruffle the feathers of the neutral lords."
 bhutan_events.939.a: "These old men were well liked for a reason!"
 bhutan_events.939.b: "We should probably clean house."
 bhutan_events.939.c: "Of course they should stay on!"
 bhutan_events.939.e: "Perhaps some fresh blood would serve us well."

 bhutan_events.940.t: "Phasing out Serfdom"
 bhutan_events.940.d: "Bhutanese society is structured as a traditional feudal hierarchy, with thousands of powerless serfs ruled over by a collection of aristocrats and lamas, along with their armies of bureaucrats. While these serfs are represented by Gewog village leaders, they have next to no rights and are often abused by their suzerains. While most within our court are more than content to retain this cruel and outdated system of governance, unsurprising considering their position at the top of the pyramid, men like Sonam Topgye Dorji have begun experimenting with a more liberal approach. He has freed his personal peasants from the most odious precepts of their traditional bondage, implementing a new system of control and taxation to give them increased agency of movement and production. His efforts appear to have improved the quality of life in his petty fiefdom, and he claims that his new taxes will bring in an equal amount of revenue once his personal bureaucracy manages to properly implement them. Perhaps we should widen the scope of this experiment across other areas of the kingdom. Certain Penlops have expressed tepid interest in attempting similar reforms, and the king’s own lands hold thousands of serfs ready to be uplifted."
 bhutan_events.940.a: "Mandate these practices more broadly!"
 bhutan_events.940.b: "Sounds risky..."

 bhutan_events.941.t: "Liberalisation Stagnates"
 bhutan_events.941.d: "Though our campaign to eradicate serfdom was well-intentioned, it has faced incredible pushback from both uncooperative officials and, perhaps more importantly, a largely apathetic populace. With the nobility unwilling to relinquish their traditional prerogatives, and villages given little incentive to fight for their newly-promised rights, next to nothing has actually changed in the regions where Sonam Topgye’s serfdom reform experiment has been attempted.\n\nIf we wish to rectify this situation, we will have to invest genuine political capital into bringing each of these regions into line. While this setback is uncomfortable, to say the least, it also provides us with an opportunity to remind the lords of Bhutan that their king’s word actually means something."
 bhutan_events.941.a: "A disappointing setback."
 bhutan_events.941.b: "Force through the reforms, damn the stalling tactics!"

 bhutan_events.942.t: "Commanders Demand Funding Priority"
 bhutan_events.942.d: "Tshering Penjor has long been the de-facto figurehead of the aristocratic military elites of Bhutan, to the extent that many consider him to be little more than a puppet of the noble commanders. While this interpretation is overly cynical, there is no doubt that Tshering Penjor only rose to the highest seat of power with the support of a collection of noble warriors, who has since become the backbone of his ruling council. However, Tshering Penjor is more than happy to break with these men when he feels that the stability and safety of the kingdom is at stake.\n\nMost recently, the king’s attempts to modernise and develop the realm economically has led him into conflict with his supporters, who claim that the military forces must have priority in matters of funding and reform. They have come to the king privately, airing their grievances and asking if he has forgotten the vision that united this coalition, that of a militarily sovereign Bhutan, capable of defending herself from foreign intervention. They have demanded that the king commit to taking the first steps towards military reform before pursuing any additional economic projects."
 bhutan_events.942.a: "Commit to a military focus for the near future."
 bhutan_events.942.b: "They will get their funding when I say they will!"

 bhutan_events.943.t: "Rise of the Radicals"
 bhutan_events.943.d: "Every good revolution needs true believers. The Zhabdrung’s revolt was no exception, relying heavily on an army of monks who had long simmered in anger at the perceived weakness of their elders. Scores of these men died at the hands of the king and his army, and it was their ferocity that drove the Wangchuck host back from their assault. When their erstwhile leader then extended a hand of friendship to the late king’s lackeys, his noble stooges, and pet his Je Khenpo, they protested loudly and angrily, but were ignored. In the months following this insult, these men have gathered their strength. They slowly infiltrated the organs of the newly forming government, placing their allies and supporters in background positions of power and eliminating many of their most competent enemies through scandal or silent violence.\n\nNow, these men cannot be ignored. The Zhabdrung’s orders are quietly modified by his loyal secretaries, his will is quietly interpreted by his loyal guardsmen, and his demands are quietly disregarded by his councilors. These men all agree that the divine reincarnation of Ngawang Namgyal is the undisputed ruler of Bhutan. But why then should they allow the corrupt and impious mongrels who ruined this realm corrupt his vision and disregard his wisdom? Would it not be more loyal of them to help their new ruler see the danger of trusting these dangerous false-friends? Would Bhutan not be better off in the humble hands of the true believers?"
 bhutan_events.943.a: "Loyalty above all!"

 bhutan_events.944.t: "Return of the Diarchy"
 bhutan_events.944.d: "Ngawang Namgyal first founded the Bhutanese realm as a sanctuary for his followers, and as a bastion for harmonious thought in the Himalayas. Under his guiding hand, he divided the spiritual and temporal affairs of his new state between the monastic Je Khenpo and the noble Druk Desi, appointed lieutenants to serve as his foremost supporters. When the Ngawang Namgyal died in 1651, however, his Druk Desi and Je Khenpo betrayed him, concealing his death for decades as they sought to unmake his vision of a realm of tranquility. Instead of naming a reincarnation of the great lama, they discovered three candidates, each holding a sliver of their old master’s power and wisdom. By splitting the power and authority of the Zhabdrung into a mind, body, and speech incarnation, they avoided facing any one man which could have held them accountable for their corruption. Unimpeded by the wise and firm hand of the Zhabdrung, generations of vain and shortsighted Druk Desis and Je Khenpos led for their own personal and sectarian ends, bringing disaster and disunity to the realm.\n\nNo longer! The mind incarnation Jigme Dorji has risen above the foolish incarnation language of the old deceivers. He is merely the Zhabdrung, Ngawang Namgyal reborn! Once again, the Druk Desi and Je Khenpo are beholden to a single ruler, one who can see beyond the petty desires of mortal men, seeing only the vision of the great lama himself. Bhutan is once again guided by the Zhabdrung’s hand, and Jigme Dorji does not intend to see himself cast down by sycophantic snakes once more. The highest offices of the realm will slowly be staffed with men that he can trust, men who will carry on his mission long after he himself has passed. Piece by piece, a new realm will be built, one in his image."
 bhutan_events.944.a: "The legacy of Ngawang Namgyal lives on!"

 bhutan_events.1000.t: "The Himalayan Powderkeg"
 bhutan_events.1000.d: "Since the reign of the great Zhabdrung Ngawang Namgyal, Bhutan has been ruled by the Zhabdrung reincarnations, who delegated temporal power to the Druk Desi, elected by the nobles, or penlops, and the Je Khenpo, elected by the monks. However, over time these two leaders have come to conspire to eliminate the power of the Zhabdrung, and by the nineteenth century, the country was firmly in the hands of the Druk Desi and Je Khenpo. This Diarchy was further streamlined when the Penlop of Trongsa, Ugyen Wangchuck, crushed his rivals and crowned himself a hereditary monarch in 1907. The kingdom saw a brief period of crisis at the death of King Ugyen in 1925, where, amongst the chaos of the Indian Revolution, two claimants, Ugyen's son Jigme and the Penlop of Paro Tshering Penjor, raced to crown themselves as his successor. With the help of Ugyen's close political allies, the Dorji Family, Jigme managed to secure the throne and consolidate his power. However, with the power of the Dorji family waning, other political forces have risen to challenge Jigme's rule. The newest reincarnation of the Zhabdrung has spent the last ten years building a base with which he challenges the king's authority, and there are many within Bhutan who aim to profit from the king's weakness."
 bhutan_events.1000.a: "So much for an island of stability, huh?"

 bhutan_events.1001.t: "The Economy of Bhutan"
 bhutan_events.1001.d: "Oftentimes the mountain kingdom of Bhutan is regarded as the best example in the world of a nation untouched by the industrial revolution. The majority of labour in the country is devoted to subsistence farming, and there is little opportunity to develop advanced trades. Construction is handled through a system of brutal corvee labour, with impressed villagers labouring to implement building plans which have remained static for the last four hundred years. Most production occurs in small cottage workshops, where rare skilled artisans ply crafts passed down through the generations. Some of these artisans have been employed by the king personally in the art of weapon crafting, a task which few of them are keen and fewer still competent. With the situation in the kingdom tenuous there is little room for change, but were any one man to solidify their position at the head of the nation, they would certainly want to reform the system."
 bhutan_events.1001.a: "Each rifle is handcrafted!"

 bhutan_events.1002.t: "The Pretender in Paro"
 bhutan_events.1002.d: "To the west of our capital lies Paro, a formidable fortress whose lord once challenged the Wangchuck family for control of Bhutan. When they were crushed, along with all other challengers, by Ugyen Wangchuck, he was granted the fiefdom by his father, as the new seat of the heirs of Bhutan’s preeminent family. In 1918, Ugyen granted Paro to his young grandchild, Tshering Penjor, along with the Raven Crown. These actions symbolized to many his intentions to elevate Tshering Penjor as his successor, though upon the late king’s death Sonam Topgye Dorji was able to hastily coronate Ugyen’s son Jigme as king, undercutting the support of Tshering Penjor. With his monarchical ambitions thwarted, Tshering Penjor has fumed in the west, a stalwart though stubborn vassal of the young King Jigme.\n\nTshering Penjor has served the king faithfully ever since Jigme beat him to the title, supplying arms, aid, and advice to his young liege. Yet some continue to wonder where his true loyalties lie. He has many allies among the more traditionalist penlops and key members of Bhutan's limited armed forces and serves as a rallying point for those in opposition of the king's policies. However, with no wives or sons to speak of, it is generally thought that Tshering Penjor will die by the time Jigme's son, Jigme Dorji, is of age to inherit the traditional seat of heirs to the kingdom at Paro."
 bhutan_events.1002.a: "Continue to keep a close eye on him."

 bhutan_events.1003.t: "Grumbling Among the Monks"
 bhutan_events.1003.d: "Bhutan traces its history and founding to the exile of Tibetan lama Ngawang Namgyal, his holiness the Zhabdrung Rinpoche, who united the warring fiefdoms in the southern Himalayas into a single nation through conquests and cultural constructions. Following his victory in 1620, Ngawang Namgyal founded the Zhung Dratshang, or the Central Monastic Body, to manage the nation under a dual system of governance, where the highest monk, the Je Khenpo, regulated religious affairs, and the chief regent, the Druk Desi, managed administrative affairs, all under the watchful eye of the Zhabdrung. In the years following, the Druk Desi was overthrown by the Penlop governors, who banded together alongside the Je Khenpo, to empower the Wangchuck clan as hereditary monarchs of Bhutan. Yet reincarnations of the Zhabdrung Rinpoche remain, challenging this new reorientation of power under the temporal ruler. The current primary reincarnation of the Zhabdrung, Jigme Dorji, has grown a following of disgruntled monks at his monastery in Talo, near the capital, where he decries the recent subversion of the ancient dual monastic governance of Bhutan.\n\nIn recent years, his following has grown exponentially, in part due to support from the conservative government of Tibet, and a growing feeling that King Jigme has become a puppet: to his radical Gongzim, to the bickering Penlops, and to the heathen Indian invaders. To the younger monks, Zhabdrung Jigme Dorji promises a new era of cultural pride, Bhutanese independence, and religious revival. It is only the tenuous loyalty of the Zhung Dratshang and its leaders, the Je Khenpo and Five Learned Lopon masters, that keeps these young firebrands from creating real trouble."
 bhutan_events.1003.a: "Keep a close eye on these hooligans."

 bhutan_events.1004.t: "The Great Pilgrimage"
 bhutan_events.1004.d: "In the past decades, the Zhabdrung Rinpoche has developed a name for himself as a worthy spiritual leader, an undeserved reputation which has spread throughout the kingdom, especially among the peasants. Most recently, a few communities in the north have banded together to make a pilgrimage to Talo Monastery to view the Zhabdrung and learn from his wisdom firsthand. With the increasing insubordination and unruliness of the Zhabdrung, the timing of this grandiose and provocative march on Talo is suspect, to say the least. Rumours point to the actions of the Zhabdrung’s cousin, Choekyi Gyeltshen, who has recently returned from the north, where he likely roused the spirits of the typically docile peasantry. Even still, there is little that the king can do directly to dissuade these pilgrims directly without angering every pious buddhist in our nation.\n\nThere are some potential angles we can use to our advantage, however. A loyal member of the Nyoe Clan, from which the Wangchucks descended, rules from Jakar Dzong, and has written to the king warning that the pilgrims appear to be armed with farming implements, looking more like a ragtag army than a crowd of the devout. This Penlop could be brought south to testify to the court and the monastic council, shielding us from a degree of criticism should we take action. Alternatively, the king can call for Tshering Penjor to intercept them, attempting to push some of the blame off onto a subordinate. Tshering Penjor will likely accept, as his faction has long demanded the king curtail the power of the Zhabdrung, and strong action against this ‘army’ would only serve to raise his status among the more hawkish lords. Of course, we can simply ignore this rabble, though such inaction will only embolden the upstart lama in Talo."
 bhutan_events.1004.a: "Send a patrol north, and call on the lord of Jakar."
 bhutan_events.1004.b: "Let Tshering Penjor take the glory and the blame."
 bhutan_events.1004.c: "Just leave these peasants be!"

 bhutan_events.1005.t: "The Gongzim and His Treaty"
 bhutan_events.1005.d: "The Gongzim (Prime Minister) to the king, esteemed statesman Sonam Topgye Dorji, has returned from a mission to the Bharatiya People's Republic, bringing with him a shipment of bolt-action rifles and foreign luxury goods. The Dorji family is the foremost ally of the Wangchucks, and it was Sonam Topgye’s quick action during the last succession crisis which secured the throne for Jigme Wangchuck. Sonam Topgye’s loyalty has been rewarded with the betrothal of his daughter to the young prince Jigme Dorji Wangchuck, and the Dorji family continues to work diligently to the benefit of the Wangchuck clan. Sonam Topgye has risen to significant prominence and power through his central role as leader of the reformist factions within the court, and through his connections to the south, aided by the Treaty of Phuentscholing that Sonam Topgye championed nearly a decade ago.\n\nWhen revolution in India reached a grinding stalemate, many in the Royal Court in Bhutan remained stalwartly committed to the cause of their longstanding Windsor allies. Sensing an end to British dominion over India and the danger that an Indian enemy may pose, however, in 1928 Sonam Topgye reached out diplomatically to the young republican government in Calcutta. Playing off of Republican setbacks in the south, Sonam Topgye managed to negotiate highly favorable terms to Bhutan, retaining the old British allowance to the royal house in exchange for non-interference, neutrality, and a repudiation of Bhutanese claims in the Duars. The economic aid from India continues to fuel the kingdom’s coffers, allowing the Wangchuck clan to survive increasing internal tensions. The fact that Sonam Topgye has also managed to make himself extraordinarily wealthy through this allowance and southern trade is merely a boon, of course."
 bhutan_events.1005.a: "What good is a Druk Gyalpo without a good Gongzim?"

 bhutan_events.1006.t: "Education of the Heir"
 bhutan_events.1006.d: "Since his birth in 1929, the young son of the king, Jigme Dorji, has lived in the Royal Court and has been taught the basics of governance, religion, and warfare by Jigme's closest councillors. While this education is imperative to the development of the heir, Gongzim Sonam Topgye Dorji has long championed a more extraordinary education for the young man, one immersed in the new ideas and theories of the outside world. He has pushed heavily for the young Jigme Dorji to join him in Phuentscholing, where he can be tutored by Indian teachers, or even for the young heir to be enrolled in an Indian or British boarding school. King Jigme has traditionally pushed against such ideas, fearing the Jigme Dorji is too young to leave his native land, and that he may lose the respect of the nobles, abbots, and peasants of the Kingdom if he were to return with a silly accent, or without the essential abilities required of him as a Bhutanese monarch. After all, who would follow a king who could not lead a tiger hunt, or score in an archery contest, or who could not recite Drukpa canon?\n\nHowever, with dark clouds gathering over the capital, fears of assassination or kidnapping have dominated the king’s thoughts. The parallel divisions in the Zhung Dratshang and royal court both threaten to upturn the tranquility of the mountain kingdom, and a new era of civil unrest may soon be upon us. When Jigme’s father was but a boy, the age of Jigme Dorji today, he was kidnapped by a rival to the Wangchuck clan in the hopes of seizing an advantage in the Bhutanese Civil War which forged the modern kingdom. Ugyen Wangchuck was not released until his father had killed twelve hostages and threatened the death of a hundred more, a choice that Jigme would rather not have to make. It is much better to send the boy south to Phuentscholing for a year or two, just in case, to avoid such prospective bloodshed."
 bhutan_events.1006.a: "Better to be safe than sorry!"

 bhutan_events.1007.t: "The Zhung Dratshang Splits"
 bhutan_events.1007.d: "Because the Drukpa Vajrayana Buddhist tradition is so central to Bhutanese society, the Central Monastic Body, the Zhung Dratshang, is one of the most powerful institutions in the nation. At its head is the Chief Abbot, titled the Je Khenpo, and the Five Learned Masters, the Lopons. Since the rise of King Jigme’s father, Ugyen Wangchuck, from Penlop of Trongsa to King of all Bhutan, the Je Khenpo and Lopons have been aligned closely with the Wangchuck clan, supporting them in administrating and ruling over the kingdom. In recent days, however, the relationship has become significantly more strained, as reformists within the court, led by the Gongzim Sonam Topgye Dorji, have pushed for more central control over monastic matters. Anger has been additionally galvanised by the rise of the Zhabdrung Mind Reincarnation Jigme Dorji, who has spent much of the last decade heavily criticising the government with impunity from his home in Talo Monastery.\n\nIn a dramatic development, a recent and particularly acrimonious debate in the royal court has led to a dramatic walkout of junior members of the Zhung Dratshang, who angrily departed for the symbolic Monastery of Cheri, where the first Zhabdrung Rinpoche founded the Zhung Dratshang more than three centuries ago. Shockingly, these disgruntled monks have been joined by three of the Lopon masters, leading members of the monastic council, led by the Zhabdrung's relative through marriage, the Dangla Trulku Sangay Tenzin. This is shocking betrayal of the king by some of the highest figures among the clergy has left the King and his court reeling. While Je Khenpo Choekyi Wangchuck has been quick to promise that these men remain loyal to the crown, and will return to their senses shortly, their actions speak otherwise."
 bhutan_events.1007.a: "Worrying, to say the least."

 bhutan_events.1008.t: "The Night of Muffled Steps"
 bhutan_events.1008.d: "Disaster and tragedy has struck in the Tango and Gangtey Monasteries, two major centers of religious and temporal power in our kingdom. In a single night, a number of our contacts and allies within the monasteries have gone silent, and none are now allowed to enter their grounds. In fact, all agents of the crown have been barred by the force of arms and were turned away rudely by once junior members of the monastery when they demanded to see the head abbots. While officially these monks claim that an illness has beset their members, it is obvious that this is a poorly wrought front, and more nefarious actions are afoot. Rumours swirl that these holy grounds were seized violently in one night by agents loyal to the Zhabdrung Rinpoche, and that they now are building support for his cause as the de-facto leaders of some of the largest monasteries in the country. Such an act of open disdain for the king cannot go unpunished! The Zhabdrung must be brought to court to answer for these crimes, and already we have assembled a small host of forces to arrest him at Talo Monastery, only a few days’ ride from the capital."
 bhutan_events.1008.a: "You fools! Secure the Zhabdrung!"

 bhutan_events.1009.t: "The Struggle for the Monasteries"
 bhutan_events.1009.d.arrest: "When we sent our guards to Tango and Gangtey Monasteries to arrest the dissenters, we expected that they would be welcomed into their grounds with the begrudging trepidation royal forces have often faced when overstepping the traditional privileges held by the monks. However, when they arrived, the grounds were whipped into a violent conflagration, as a shocking number of monks took up arms, turning against our soldiers and their loyal brothers. Of the six men we sent to Gangtey, only two have returned to the capital alive, while we have heard nothing of the men sent to Tango. It is obvious to us now that the poison of rebellion had steeped far deeper in these regions than we had initially believed, leading the rebellious monks to seize these two great monasteries before their leaders could be brought to justice. The Zhabdrung must be brought to court to answer for these crimes, and already we have assembled a large host of forces to arrest him at Talo Monastery, only a few days' ride from the capital. Chances are, however, that he has also heard of the violence his subordinates have wrought, and it is likely that he has fled the country."
 bhutan_events.1009.d.purge: "When we sent our armies to Tango and Gangtey Monasteries to stamp out the dissenters, we expected that they would be welcomed into their grounds with the begrudging trepidation royal forces have often faced when overstepping the traditional privileges held by the monks. However, when they arrived, the grounds were whipped into a violent conflagration, as a shocking number of monks took up arms, turning against our soldiers and their loyal brothers. In Gangtey, the chief abbot was severely wounded, but was saved by our forces, while in Tango the chief abbot and a few men loyal to him were able to bar themselves in a small storeroom, surviving the battle which engulfed their home. It is clear that we had significantly underestimated the number of rebellious monks in these monasteries, and though we eventually held the day and retook control of the grounds, hundreds now lie dead, casualties of what now looks to be an open rebellion in favor of the Zhabdrung Rinpoche. The Zhabdrung must be brought to court to answer for these crimes, and already we have assembled a large host of forces to arrest him at Talo Monastery, only a few days' ride from the capital. Chances are, however, that he has also heard of the violence his subordinates have wrought, and it is likely that he has fled the country."
 bhutan_events.1009.a: "You fools! Secure the Zhabdrung!"
 bhutan_events.1009.b: "Quick, secure the Zhabdrung!"

 bhutan_events.1010.t: "Accusations Abound"
 bhutan_events.1010.d: "As reports of monastic rebellion brew, King Jigme has increasingly pushed the factions within his court to set aside their differences for the good of the realm. However, there is precious little common ground between the reformist faction of court, led by the powerful Gongzim Sonam Topgye Dorji, and the traditionalists, who have gathered around the king’s cousin and Penlop of Paro Tshering Penjor, as well as his ally in court General Namgyal Bahadur. At this moment of crisis where unity is most needed, predictably the two camps have devolved into utter chaos.\n\nNamgyal Bahadur has accused three leading Reformist courtiers of collaborating with and spying for the Zhabdrung’s cabal, and has gone on to voice his anger towards “traitorous infiltration” openly in court. The result has been nothing short of a complete breakdown in order and decorum, and has led to most reformist leaders to refuse entirely cooperation with the traditionalists until Namgyal Bahadur apologized for his comments. Regardless of what happens next, the damage is done, and the king must scramble to retain some semblance of unity."
 bhutan_events.1010.a: "Force Namgyal Bahadur to apologize immediately!"
 bhutan_events.1010.b: "Screw an apology, interrogate these potential spies!"
 bhutan_events.1010.c: "The king must remain a unifying figure, regardless of the damage!"

 bhutan_events.1011.t: "The Zhabdrung Leaves Talo Monastery"
 bhutan_events.1011.d: "When our guards arrived at Talo Monastery, flanked by the Je Khenpo for some much-needed legitimacy, they were greeted by a very quiet complex. Less than half of the normal complement of monks remained in the monastery, though they greeted our forces politely and allowed us to enter and search the grounds for the rogue Zhabdrung Rinpoche. According to the most talkative of the remaining monks, the Zhabdrung Rinpoche departed days before our arrival, with his cousin Choekyi Gyeltshen and a retinue of loyal monks. Where they were headed, these monks claim to be ignorant of, stating that any who knew either joined the Zhabdrung willingly or were otherwise coerced into joining his procession. The presence of Choekyi Gyeltshen, who has extensive connections in republican India, indicates that they may be headed south, aiming to make a rival government under the protection of the Indians. Such a maneuver would create an enormously painful thorn in our side, as there is precious little we could do against the Zhabdrung once he is in Indian custody without threatening our fragile peace with the southern behemoth. We have already sent scouts to the south, hoping to muster a defense at the border passes to pen the Zhabdrung and his rebel lackeys in. In our closest held prayers, we hope that he meets an ignoble end at the hands of the road, either at the hands of a rockfall, tiger, or bandit."
 bhutan_events.1011.a: "If he is truly gone, good riddance."

 bhutan_events.1012.t: "The Snake Revealed"
 bhutan_events.1012.d: "To the shock of all, the Zhabdrung Rinpoche has reappeared, not south under the protection of the Indians, but right under our noses at Cheri Monastery. The symbolism of the site is not lost on us - the first Zhabdrung Ngawang Namgyal first established the Zhung Dratshang monastic council at Cheri, where it stayed for seventeen years before moving to the current capital of Punakha. Under the rule of the ancient Zhabdrung and his first reincarnations, the Zhung Dratshang ruled over Bhutan as the temporal regents and advisors of the vaulted lama. Today, the Zhabdrung reincarnation Jigme Dorji has proclaimed the establishment of a new Zhung Dratshang, one which would return to the wisdom and piety of the first Zhabdrung’s reign, challenging the authority and legitimacy of the Wangchuck clan and their allies. He seems to believe that he can face us down in battle, taunting the impotence of our government by openly opposing the king. He may be right, unfortunately, as Cheri Monastery appears to be well equipped with both men and weaponry, as numerous monks and dissidents have flocked to join him. The monastery is in a well defensible position, meaning that we will need a true army if we wish to end this farcical rebellion, rather than the meager guards we have long relied on."
 bhutan_events.1012.a: "We cannot let this stand. Call the banners!"

 bhutan_events.1013.t: "The King’s Contemplation"
 bhutan_events.1013.d: "With the royal host slowly assembling in the capital, the impromptu war council King Jigme has called has increasingly discussed when our forces should leave the safety of the capital to march on Cheri Monastery and the sorcerous Zhabdrung pretender. The decision is not an easy one to make, and has weighed heavily upon the King’s conscience. The longer he waits in Punakha and prepares, the stronger his forces will become, and the better equipped they will be to face his opponent on the field. On the other side, waiting will only lessen the cohesion of his host, as old conflicts have the chance to flair up and his less loyal underlings lose their respect for their hesitant leader. Many of his more bloodthirsty lieutenants have already loudly pushed for an immediate strike on the traitorous Zhabdrung at Cheri, while an army of timid courtiers have begged the King to hold his ground and shore up his position."
 bhutan_events.1013.a: "King Jigme won’t take the advice of cowards! MARCH!"
 bhutan_events.1013.b: "On second thought, let’s prepare some more."

 bhutan_events.1014.t: "Villages Flock to the Zhabdrung"
 bhutan_events.1014.d: "The Zhabdrung has cast his grubby fingers of control over our subject long before he came out of the shadows and opposed us openly. One of his earliest insults against our rule came in the reassertion of ancient taxation rights over a number of small hamlets and villages in the near vicinity of his old home in Talo Monastery. Using ancient promises and old privileges against us, the Zhabdrung managed to convince a number of villages that our dominion over them was fraudulent, turning our once loyal subjects against us. Now that he has openly asserted his desire to rule over Bhutan, the village elders of these muddled regions have been forced to take a side, sending their young and able warriors either to the perfidious Zhabdrung in Cheri or to their rightful liege in Punakha. While many have heeded the call of their king, some have taken our seeming complacency as an invitation to abandon the ship of state and join with the rebels."
 bhutan_events.1014.a: "Do they not remember our lenience earlier?"
 bhutan_events.1014.b: "They are simply angry we taxed them."
 bhutan_events.1014.c: "Some well placed gifts will ease their concerns."

 bhutan_events.1015.t: "The King’s Situation"
 bhutan_events.1015.d: "Jigme has called in every favour he has gathered over his uneventful reign, and has called upon every ally he still has to the capital with their loyal levies, leaving Punakha awash with a motley sea of warriors and lords from across Bhutan. As this army swells, the practical concerns of their presence have begun to strain our administration, as foodstocks are beset upon by hundreds of mouths and refuse begins to pile up. Bearing in mind these challenges, the pressure on the king to move is growing by the day. Even if he is not fully sure that his forces are enough to secure his rule finally in a final confrontation at Cheri, he cannot sit on his hands forever. However, there are still preparations to be made, and some distant Penlops and Dzongpons are yet to join us. Luckily for the king, his councilors remain split, granting him autonomy to decide his next course of action. Though the disposition of the court at large is that our army is more than prepared for a strike against the Zhabdrung Rinpoche, there is still a significant faction of advisors which have cautioned us against rash action. Who the king shall heed is yet to be seen."
 bhutan_events.1015.a: "Now is as good as ever! MARCH!"
 bhutan_events.1015.b: "On second thought, let’s prepare some more."

 bhutan_events.1016.t: "Tibetan Adventurers Grow Impatient"
 bhutan_events.1016.d: "Our inaction in the face of continued rebellious movement has led to significant grumbling within the gathered royal host. Most upset have been the small bands of warriors from our holdings in Tibet, who were tempted to make the considerable journey to Punakha by promises of loot and payment. While these men have been lavished with gifts by the king, many of them are most concerned with the prospects of material wealth gained by looting the villages pledged to the rebel cause. Such boons are not available while sitting still in the capital, and with new conflicts erupting in their home of Tibet and China beyond, these men think that they may be able to find more lucrative employment elsewhere. A few bands have already deserted, departing silently in the night, and some more seem to be on the verge of joining them. While these men are not exactly the backbone of our growing army, they are well armed and have no real loyalties or kinship with the monks we will be forced to face off against. Barring all else, losing their support would be a blow to the morale of our forces, and to the prestige of the king. After all, who would follow a leader who cannot keep his own men in line?"
 bhutan_events.1016.a: "Good riddance."
 bhutan_events.1016.b: "Bribe them with more extravagant gifts!"

 bhutan_events.1017.t: "The King’s Confrontation"
 bhutan_events.1017.d: "Months of inaction have made their mark on the mood and cleanliness of our capital, as our organized host has devolved into a messy menagerie of men. Even still, more men arrive, and those who are present are drilled in a vain hope to transform scores of personal household guards and local militias into a simulacrum of a unified army. There is still work to be done to ready the host for battle, but should the king wait too much longer it will certainly damage the reputation of the king among his lords, who are clamouring for action (and the promised return to their homes). Those who once spent their time boasting of their excitement at the prospect of driving the rebels back now spend most of their days grumbling about the inaction of the royal host. In fact, the discussions regarding the royal host’s departure have gone from polite to considerably more hostile. In fact, Tshering Penjor has begun to push aggressively for action, challenging the legitimacy of the king in his own home."
 bhutan_events.1017.a: "Ok, ok, we hear you! MARCH!"

 bhutan_events.1018.t: "Dzongpons Accuse Us of Cowardice"
 bhutan_events.1018.d: "Dzongpons, the minor nobility which serves alongside the major Penlop lords, are typically cowed by the major players of the Bhutanese nobility. Even still, these minor nobles have an active voice within the government, serving as some of the closest councilors to the king. Some of these old advisors served in the court of Ugyen Wangchuck, and helped to raise and teach King Jigme in his youth, affording them unparalleled license to speak their minds to their liege. Many of these lords toe the line, but some have been known to quietly debate the decisions of the king openly in court, a dangerous game where an insult can result in expulsion from the capital or worse. In recent days, however, these old hands have grown far more bold. A small group of advisors have openly insinuated that the king has delayed his attack on Cheri Monastery due to fear for his own life. While they are lucky that the king has not seen it fit to take their own lives, their hints of disloyalty are representative of the court at large. Whispered rumours poison the minds of once loyal subordinates, and the royal host has gone from the bustle of an army forming to stagnant mess of men growing more restless, aimless, and dangerous by the day. Even as we begin our march on Cheri, the mood has clearly soured, and there are few left in the host with genuine admiration and affection for the king they all serve."
 bhutan_events.1018.a: "We are marching now, don’t they see that?!"

 bhutan_events.1019.t: "March on Cheri Monastery"
 bhutan_events.1019.d: "While the quickest route from the capital to Cheri Monastery runs north up the Punakha Valley and then west through the treacherous northern passes, we have instead opted to travel south before coming up through the carved out pathways of the Wang Chhu River Valley. While this route has allowed us to march at proper pace and supplement our supplies with local provisions, it was also betrayed just how much of the Kingdom has fallen sway under the poisoned words of the Zhabdrung pretender. The hamlets of Changangkha and Taba both fled in anticipation of the arrival of our host, and we have been beset with nightly harassment and raids from bandits and irregulars from the highlands. Any hope of catching the Zhabdrung off guard has been dashed as hundreds of discontented villagers stream ahead of us, while our confidence in our numerical and martial superiority is called into question daily, as each night becomes a fight to the death with fanatical raiders."
 bhutan_events.1019.a: "We march on, into the belly of the beast."

 bhutan_events.1020.t: "Strange Reports from the South"
 bhutan_events.1020.d.nooutposts: "Sonam Topgye and the Dorji family are the King’s primary eyes and ears in the south, keeping him abreast of developments in the southern lowlands and the Indian Republic beyond. We have intercepted messengers from the Dorjis bound for the capital, bearing ill tidings from our Gongzim. According to some of his agents in Calcutta, the cousin of the Zhabdrung, Choekyi Gyeltshen, has been incredibly busy in the last few weeks, meeting with prominent figures in the Bharatiya People's Republic, extolling the virtues of his cousin and requesting assistance to his rebel cause. To add a degree of urgency to these claims, rumours have consumed the southern outposts regarding a phantom caravan, laden heavy with arms and mercenaries, last seen driving towards our border through the Duars under the cover of night. While the claims of Yak herders should be taken with a grain of salt, this phantom caravan may be bound for Cheri, aiming to reinforce the Zhabdrung with modern Indian arms.\n\nThe unfortunate truth is that our borders are as porous as pumice. While there are only a few passes which connect our realm to the Duars and the Ganges Delta beyond, we simply do not have the soldiers or funds necessary to patrol every riverbed and valley, leaving innumerable potential unguarded routes that this caravan could have taken north into our kingdom. We could order Sonam Topgye Dorji to divide his mercenary forces, as well as our southern patrols, into small bands to scout the southern passes for this caravan, but these scouting parties would be vulnerable to ambush. Additionally, stripping the southern outposts of their defenders would lay our border bare to Indian provocation, a grave danger made all the more troubling by the source of this rumored caravan."
 bhutan_events.1020.d.newoutposts: "Sonam Topgye and the Dorji family are the King’s primary eyes and ears in the south, keeping him abreast of developments in the southern lowlands and the Indian Republic beyond. We have intercepted messengers from the Dorjis bound for the capital, bearing ill tidings from our Gongzim. According to some of his agents in Calcutta, the cousin of the Zhabdrung, Choekyi Gyeltshen, has been incredibly busy in the last few weeks, meeting with prominent figures in the Bharatiya People's Republic, extolling the virtues of his cousin and requesting assistance to his rebel cause. To add a degree of urgency to these claims, rumours have consumed the southern outposts regarding a phantom caravan, laden heavy with arms and mercenaries, last seen driving towards our border through the Duars under the cover of night. While the claims of Yak herders should be taken with a grain of salt, this phantom caravan may be bound for Cheri, aiming to reinforce the Zhabdrung with modern Indian arms.\n\nLuckily for us, our newly built outposts in the south have limited potential points of subversive entry into our kingdom to a mere handful of small mountain passes. We could order Sonam Topgye Dorji to divide his mercenary forces, as well as some of our southern patrols, into a couple of units to ride up the uncharted southern passes searching for this caravan. While these bands would be more than capable of handling whatever bandits are guarding this phantom caravan, stripping the southern outposts of any of their defenders could lay our border bare to Indian provocation, a grave danger made all the more troubling by the source of this rumored caravan."
 bhutan_events.1020.a: "Order Sonam Topgye to send forces up the passes!"
 bhutan_events.1020.b: "We cannot afford to chase rumours."

 bhutan_events.1021.t: "Confronting the Mysterious Caravan"
 bhutan_events.1021.d.nooutposts: "Our attempts to run down the mysterious caravan has led to disaster. While one of the small patrols Sonam Topgye had mustered managed to make contact with the encamped caravan, they were wholly unprepared to face off against its complement of guards. They approached the encampment before being torn apart by a hail of machinegun fire. In the face of this weaponry, our patrol scattered, with most of its number cut down before they could find cover back up the valley. More troubling still was that some of the survivors were picked off in the following nights by rebel gangs patrolling further up the valley, meaning that the insidious tendrils of the Zhabdrung’s control extend much further south than we first envisioned. With his forces split and bloodied, Sonam Topgye has given up the chase, pulling his warriors back to the border from the increasingly hostile valleys they have trekked across in the last weeks. Whatever soldiers and weaponry was once in that caravan, we can now suspect it is well within the hands of the Zhabdrung and his cronies in Cheri Monastery. Even still, we cannot falter!"
 bhutan_events.1021.d.newoutposts: "Following a particularly well placed bribe with a recalcitrant Gepo village elder near Dobji Dzong, Sonam Topgye was able to narrow the rumoured caravan’s path to a single pass, gathering his forces and catching up to them in the Dagana Valley. While the caravan’s guards put up stiff resistance to Sonam Topgye’s attack, they were overwhelmed and surrendered when their encampment was flanked and their retreat into the mountains cut off. While the majority of the men we captured were rebellious monks, a few spoke only Bengali and Assamese, marking them as Indian mercenaries.\n\nMore importantly, Sonam Topgye and his men recovered significant caches of modern British made machine guns and small arms, along with a significant quantity of foodstuffs and other goods, all which have been brought north to intercept our army on the march. The capture of this caravan is a major victory, supplying our own forces and denying these supplies to the Zhabdrung. Of course, much of the armaments and goods appear to have been “lost” on the road, as only a lightly laden caravan has arrived in our camp, the remainder almost certainly having been bled to fill Sonam Topgye's personal armouries."
 bhutan_events.1021.a: "Finally, some good news!"
 bhutan_events.1021.b: "Those dogs will not be so lucky next time."

 bhutan_events.1022.t: "Clashes Around Punakha"
 bhutan_events.1022.d.oldguard: "The lands surrounding Punakha have traditionally belonged to the reigning Zhabdrung and it is from these lands that the most recent incarnation has begun to supply his supporters. As our host marches on Cheri Monastery, we have been forced to march through these lands, leaving our flanks and rear vulnerable to actions of sabotage at the hands of these rebellious villages. To secure our host, the king has moved to expel any hostile warriors from these local hamlets, sending the Royal Guard to root out any opposition. While most of the settlements were quiet and cooperative, one was harbouring a gang of the Zhabdrung's bandits, who managed to rout our patrol in a surprise attack. When we returned to the area with greater numbers, these marauders had disappeared, leaving tens of our best men dead with next to nothing to show for it, a lasting reminder of our continued impotence."
 bhutan_events.1022.d.bahadurguard: "The lands surrounding Punakha have traditionally belonged to the reigning Zhabdrung and it is from these lands that the most recent incarnation has begun to supply his supporters. As our host marches on Cheri Monastery, we have been forced to march through these lands, leaving our flanks and rear vulnerable to actions of sabotage at the hands of these rebellious villages. To secure our host, the king has moved to expel any hostile warriors from these local hamlets, sending the Royal Guard to root out any opposition. While most of the settlements were quiet and cooperative, one was harbouring a gang of the Zhabdrung's bandits, who nearly managed to rout our patrol in a surprise attack. Just as the morale of our forces was pushed to its limit, however, the ferocious warrior Namgyal Bahadur, leader of the Guard, clubbed three bandits to death in close succession, regaining control of the fight and rousing the spirit of our warriors. While our soldiers have been left shaken by rebel’s zealousness, at least these bandits will not continue to use this hamlet as a base to harass those still loyal to the crown."
 bhutan_events.1022.a: "If only each of our soldiers fought like Namgyal Bahadur!"
 bhutan_events.1022.b: "How embarrassing!"

 bhutan_events.1023.t: "Arson in Trongsa"
 bhutan_events.1023.d.nodzong: "Trongsa Dzong has been the ancestral seat of the Wangchuck dynasty for centuries, dating back to their rise as lowly penlops of the central highlands. The Dzong is located at a highly strategic position over the Mangde Chhu valley. While this fort is no longer the day-to-day home of the Wangchuck rulers, it remains an important symbol of Wangchuck power and legitimacy, as well as a vital strategic position which commands the caravans bringing goods from remote eastern Bhutan to the settled seats of power in the west. It was likely for these reasons that agents loyal to the Zhabdrung set fire to much of the complex in a bold incendiary raid. They sought to create the simulacrum of divine fury, calling our legitimacy as rulers into question through a false natural disaster. Undetected until after they had generated an inferno, the flames were quenched by the valiant efforts of our loyal courtiers, but not before they had destroyed the Temple of Chortens. The damage to our legitimacy and honor are irreparable, and we will be forced to send some of our most capable warriors back to secure Trongsa, if only to repair our damaged image among the great clans. Such a sacrifice will be costly should we come to blows with the Zhabdrung and his forces."
 bhutan_events.1023.d.tadzong: "Trongsa Dzong has been the ancestral seat of the Wangchuck dynasty for centuries, dating back to their rise as lowly penlops of the central highlands. The Dzong is located at a highly strategic position over the Mangde Chhu valley. While this fort is no longer the day-to-day home of the Wangchuck rulers, it remains an important symbol of Wangchuck power and legitimacy, as well as a vital strategic position which commands the caravans bringing goods from remote eastern Bhutan to the settled seats of power in the west. It was likely for these reasons that agents loyal to the Zhabdrung attempted to set fire to much of the complex in a bold incendiary raid. Luckily for us, their approach was spotted from considerable distance, and these vagabonds were intercepted by our guardsmen as they attempted to set their flames. Thanks to their determination, uncountable priceless texts and artifacts have been saved from what would surely be an inferno. While this is a worrying development, we must simply carry on towards Cheri, to bring those responsible to justice."
 bhutan_events.1023.a: "A close save!"
 bhutan_events.1023.b: "A crushing blow to our legitimacy!"

 bhutan_events.1024.t: "Sieging Cheri"
 bhutan_events.1024.d: "When the royal host first arrived at Cheri, many of our leading vassals demanded that we march immediately on the fortress monastery, to drag out and silence the rebellious Zhabdrung forever. However, there are two significant issues which have tempered the king’s thirst for bloodshed.\n\nFirstly, the violent expulsion and death of a Zhabdrung Reincarnation would forever tarnish King Jigme with the black mark of sacrilegious murder. Not only would the king never be able to face the monks of the Zhung Dratshang without shame, but he would also surely be haunted by the ill spirit of the Zhabdrung, a curse which would likely cast him into an early grave. Additionally, the peasants and monks across the kingdom would only martyr the Zhabdrung as a pious hero brought low by a tyrannical king, a story which would surely breed discontent so long as Jigme reigns.\n\nThe second issue is far more practical. While our scouts assure us that our host outnumber those loyal to the Zhabdrung by the hundreds, Cheri Monastery is a highly defensible position with sure walls and a clear line of fire into the valley approach. Any open attempt to crack the Zhabdrung’s position would end in the death of hundreds, a tragic and violent confrontation which would leave our kingdom vulnerable to the meddling of foreign powers and less-than-loyal vassals.\n\nBearing these conditions in mind, the king has ordered that a siege be raised against Cheri. The royal host has begun fortifying a position at the base of the valley, and outriders have been sent into the highlands to secure the valley at large. The hope is that a prolonged siege against the rebels will tear their weak bonds of disloyalty apart, and give us an angle to break open the monastery from the inside out."
 bhutan_events.1024.a: "We pray for a bloodless solution."

 bhutan_events.1025.t: "The Siege of Cheri Drags On"
 bhutan_events.1025.d.lowauth: "In the last weeks, the royal host assembled in the foothills preceding Cheri Monastery has transformed into a proper siege camp, with a loosely organised collection of defensive posts cutting the valley off from the rest of the world. From the first day of our arrival, our forces have been subjected to ceaseless harassment at the hands of the Zhabdrung’s bandits and zealots, who repeatedly struck our patrols and laborers at dusk before melting back into the darkness. Over time however, our familiarity with the region has grown and the raiders’ hiding spots and routes have been uncovered and eliminated, leaving them impotent in the face of our defenses.\n\nEven still, our position is beyond precarious. Conflicts between the various vassal armies have slowly heated to a boiling point, as petty squabbles stew into furious feuds. Old rivalries are easy to find among noble houses which had fought for control over the Kingdom only a generation ago, as blood debts and broken promises among fathers fuel arguments and anger among sons.\n\nThe king has attempted to intervene to squash these petty squabbles, but has found little success in whipping his mob of underlings into a loyal army. King Jigme’s failures, both perceived and real, to combat the Zhabdrung’s influence has not only weakened his grip on the kingdom, but also on even his most loyal subjects. With the king’s influence diminished, petty sergeants have risen to positions of undeserved prominence, cultivating bands of followers who are swayed by old bonds of kinship or their insights into the best course forward. Most powerful of these disgruntled vassals is Tshering Penjor, the king’s cousin, who has pushed for an immediate assault on the monastery, the opinion of the monastic council be damned. On the other hand, the Je Khenpo Choekyi Wangchuck has begged for monastic led negotiation, while the Lopon Master of Tantric Ritual, Samten Jamtsho, has championed the king as the arbiter of the Zhabdrung’s fate. Regardless, the king must act, lest his host unravels. Most concerning is Tshering Penjor’s faction, who may at any point lead their own assault on the monastery, a suicidal act which would force the king to commit his forces behind a joint attack, or otherwise risk his forces to be destroyed by the Zhabdrung piecemeal. With his hands tied, the King’s best option is to turn to Samten Jamtsho to act, if only to have something to mollify his most bloodthirsty allies with."
 bhutan_events.1025.d.highauth: "In the last weeks, the royal host assembled in the foothills preceding Cheri Monastery has transformed into a proper siege camp, with a loosely organised collection of defensive posts cutting the valley off from the rest of the world. From the first day of our arrival, our forces have been subjected to ceaseless harassment at the hands of the Zhabdrung’s bandits and zealots, who repeatedly struck our patrols and laborers at dusk before melting back into the darkness. Over time however, our familiarity with the region has grown and the raiders’ hiding spots and routes have been uncovered and eliminated, leaving them impotent in the face of our defenses.\n\nEven still, our position is beyond precarious. Conflicts between the various vassal armies have slowly heated to a boiling point, as petty squabbles stew into furious feuds. Old rivalries are easy to find among noble houses which had fought for control over the Kingdom only a generation ago, as blood debts and broken promises among fathers fuel arguments and anger among sons.\n\nWhile these arguments are worrying, the leading figures of Bhutan have all remained stalwart in their support for the king. While he privately derides Jigme’s caution, the king’s cousin Tshering Penjor has remained aloof from those rabble rousers who push for an immediate assault on the monastery. Similarly, the Je Khenpo Choekyi Wangchuck has quietly pushed for a negotiation led by the Zhung Dratshang, a traditional solution for similar conflicts in the past. Unlike in the past, however, the Monastic Council is decisively split, leaving them ineffectual and unable to neutrally arbitrate. At the end of the day, the King’s position remains favorable, and with his camp secure and his vassals loyal, he can stick to his initial plan of starving out the rebel cause. While such caution will certainly anger the most bloodthirsty of his allies, he can rely on Tshering Penjor and the Je Khenpo to maintain order within the host."
 bhutan_events.1025.a: "We must act! Send Samten Jamtsho into Cheri under the flag of peace."
 bhutan_events.1025.b: "Hold steady, they will break before we do."

 bhutan_events.1026.t: "Cheri Breaks"
 bhutan_events.1026.d: "As we expected, the continued siege of Cheri Monastery has clearly begun to take its toll on its inhabitants. Those seen guarding its walls and towers are clearly gaunt, looking to our plentiful foodstocks with envy. Most recently, a small group of monks, each showing their own signs of starvation, have snuck into our camp to meet with the Je Khenpo. At the King’s insistence, however, they were instead directed to negotiate with Jigme’s ally, the Lopon Master Samten Jamtsho. While the monks were seemingly incensed to be commanded by the king, they were in little position to argue.\n\nAfter hours of discussion, Samten Jamtsho convinced these mutineering monks that lasting stability within the country will only be found in a world without the young Zhabdrung ensorceller. While the monks appeared to be repulsed by such a suggestion, they appeared to swallow their pride before returning to the monastery under the cover of darkness. After all, with a knife to your throat and an empty stomach, it is easy to do the unthinkable."
 bhutan_events.1026.a: "A necessary evil."

 bhutan_events.1027.t: "Zhabdrung Jigme Dorji Chokes to Death"
 bhutan_events.1027.d: "A delegation from Cheri Monastery has hailed the royal camp, seeking to parley. They have informed us that the Zhabdrung Rinpoche Jigme Dorji has tragically perished, dying in the night through a choking complication from an untreated illness. According to these monks, the young Zhabdrung passed away so quietly and suddenly that even those studying in the room adjacent to his quarters heard nothing, finding the dead lama only in the morning. The mood is sombre among all present - the Lopons and monks who joined the Zhabdrung will return to their respective monasteries in shame, those who engaged in notable acts of banditry or murder will be imprisoned and fined for their actions, and those looking for gold and glory among the King’s camp will have to return home empty handed. For the King, however, there is a great deal of relief at the outcome. By the skin of his teeth, King Jigme will not have to live forever with the stigma of striking the reincarnation of Bhutan’s father, the Zhabdrung Rinpoche. Whatever muttered phrases of impiety and brutality will be only that - whispers of desperate monks and a silk scarf stuffed in the throat."
 bhutan_events.1027.a: "Let us all return to our homes."

 bhutan_events.1028.t: "The Withdrawal to Punakha"
 bhutan_events.1028.d: "As King Jigme and much of his host march back to the capital, a silence hangs heavy on the countryside. In villages and lamaseries across the nation, furtive whispers level accusations of conspiracies and magic against the King and his allies. At the same time, agents of the crown rush across the realm to educate the people of the tragic death of the Zhabdrung, struck down in his youth by illness while negotiating with the King. Along with their explanations, the messengers hint that the Zhabdrung was struck low by divine forces, the result of his hubris and ambition, and his impiety. They tell of the young lama’s many wives, with lustful weaknesses the subject of mockery.\n\nThe King has officially declared that the young Zhabdrung should be mourned, as befits the reincarnation of the great Ngawang Namgyal. In reality, however, any official celebrations of the young Zhabdrung will be muted and cut short, with genuine mourning looked upon suspiciously by agents of the King. As for the spirit of Ngawang Namgyal, few doubt that when a young reincarnation is found, he will likely be captured and held in the care of the crown."
 bhutan_events.1028.a: "It matters not if the story is believable, so long as they must believe it."

 bhutan_events.1029.t: "Samten Jamtsho Presents a Solution"
 bhutan_events.1029.d: "King Jigme’s closest ally within the Zhung Dratshang, the Lopon Master of Tantric Ritual Samten Jamtsho, has returned from a meeting of parley with the monks of Cheri Monastery. While he did not actually meet with the Zhabdrung Rinpoche, he spoke extensively with the three Lopon Masters who cast their lot with the rebel lama. They have proposed that the King meets directly with the Zhabdrung to diplomatically determine the fate of the young upstart. Samten Jamtsho has claimed that the monks appeared favorable to a deal in which the Zhabdrung would accept exile into Tibet or India and a rejection of any claims of temporal power in Bhutan, so long as the king could guarantee him safe passage out of the kingdom. However, the Zhabdrung, fearing a trap, has demanded that the King meet him at the gates of Cheri, so that they may discuss the details of the deal and make oaths of safety to one another.\n\nWhile this deal is far from ideal, it appears to be the only way that this conflict could be settled with monumental bloodshed. Regardless, many within the royal camp have expressed their concerns with the proposal, especially Tshering Penjor and his allies, who have pushed aggressively for an all out assault on Cheri. However, if the King were to reject a genuine offer to mediate and resolve this conflict, a black cloud of impiety will hang over him for all eternity. Tshering Penjor has also raised concerns regarding the safety of the king in his meeting, though he will be afforded the protection of his loyal monks, as well as his royal guard. Such a meeting is far from ideal, and will thrust Jigme into the lion’s den, but with the situation in his council deteriorating rapidly, he has little choice but to accept."
 bhutan_events.1029.a: "We have no choice but to take this risk!"

 bhutan_events.1030.t: "King Jigme is Ambushed"
 bhutan_events.1030.d: "While the meeting between Jigme Wangchuck and his rival began cordially, it did not take long to devolve. The Zhabdrung quickly made it apparent that he had no intention to surrender and plead forgiveness, instead berating the King for trampling upon the grounds of Cheri with an army. It was not long before the Zhabdrung began a tirade of insults and threats against the King and his host, claiming that they had broken the ancient compact between the Zhabdrung line and his temporal regents.\n\nAs the Zhabdrung reached the crescendo of his accusations, one of the king’s personal guards drew their blade and moved to step in between the Zhabdrung and King Jigme. As if on cue, the young lama’s supporters fell into a frenzied response, driving towards the King and his entourage with knives and swords. Several of the king’s guards fell to their blades, and the Jigme was gravely wounded by a young monk’s knife, before being bundled away from the killing field by those loyal to him. Gunners on the walls began to open fire on the retreating party, though their shots did not find the wounded king.\n\nJigme has been taken to his personal tent, with healers working desperately to bring him back from the brink of death. The king is incoherent and incapacitated, and all eyes have turned to Tshering Penjor to avenge him in an all out assault against the monastic fortress."
 bhutan_events.1030.a: "That bandit whelp will soon taste Tshering’s blade!"

 bhutan_events.1031.t: "Massacre at Cheri"
 bhutan_events.1031.d: "Following the treachery of the Zhabdrung and the incapacitation of the king, Tshering Penjor called an emergency council of Penlops and leaders. There, he claimed conclusively that an evil spirit had possessed the body of the Zhabdrung Rinpoche to bring ruin upon Bhutan, and that it was the duty of every faithful and loyal man to smite this demon. Rousing the men, he led a brutal assault on the fortress monastery. After a bloody skirmish for entry to the lower courtyard of Cheri, Tshering Penjor and his men were ambushed by a pair of machine guns hidden in the upper galleries of the keep. In seconds, hundreds of brave warriors were cut down by these new modern implements of death, with their corpses piling in the central courtyard of the monastery. Tshering Penjor himself attempted to regroup his surviving forces, but in the cacophony of destruction he too was cut down by a hail of bullets.\n\nWith the brunt of the assault broken the tide rapidly shifted, as undisciplined levies shattered entirely in their attempts to escape the deadly courtyard. Following their rout, the Zhabdrung’s forces descended onto the royalist camp, seizing the dying King Jigme and many of his more elderly noble attendants, alongside considerable stashes of rifles and supplies. According to the official position of the Zhabdrung, the king was dead by the time his tent was raided, while others quietly whisper of a violent coup de grace at the hands of a particularly zealous monk.\n\nWith the road to Punakha open and none left powerful enough to oppose the Zhabdrung’s growing army, the reincarnation of Ngawang Namgyal seems poised to seize the capital and once again proclaim his dominion over Bhutan!"
 bhutan_events.1031.a: "Where is the heir? Where is Jigme Dorji Wangchuck?"

 bhutan_events.1032.t: "The End of the Royal Coalition"
 bhutan_events.1032.d: "While some of the lords of Bhutan perished in the fighting at Cheri, most survived to be held as “honored guests” of the Zhabdrung. The Zhabdrung has moved to mollify these figures by naming one of their number, Tashigang Dzongpon Thinley Topgye, known more commonly by the name Sey Dopola, as the new Druk Desi, or temporal regent, of Bhutan. Sey Dopola is relatively weak, though well liked, and has extensive connections in Tibet through his friendship with the late Dalai Lama Thubten Gyatso. Without his own significant base of support, Dopola has little opportunity to gather up some sort of revolt against the new preeminience of the Zhabdrung, and has seemingly resigned himself to his role as a ceremonial puppet of the monastic government. Having rebuilt the foundations of the dual-government of the ancient Zhabdrung, Jigme Dorji was content to release all nobles willing to pledge their undying loyalty to him and to Dopola as his administrator. Those who refused to pledge to the new government were retained in the learning chambers of Cheri, so that they could be properly educated of the wrongness of their stubborn resistance. Everyone else has joined the procession carrying the Zhabdrung Rinpoche to Punakha, so that his elevation may be properly celebrated."
 bhutan_events.1032.a: "The survivors settle into a new Bhutan."

 bhutan_events.1033.t: "The Monasteries Recognise the Zhabdrung"
 bhutan_events.1033.d: "The monasteries of Bhutan have long made up the base of support for Zhabdrung Rinpoche Jigme Dorji and his recent bid for power. The Zhung Dratshang monastic council, split between those who joined the Zhabdrung in Cheri and those who stood by the Wangchuck clan, has forcibly been reunited. Samten Jamtsho and the Je Khenpo Choekyi Wangchuck, left with little option but submission or death, have pledged themselves and their services as a force of mediation between the newly preeminent Zhabdrung and those who would hold out hope for a royal restoration. They are joined by the legions of lower ranked monks which make up the backbone of the extensive theological apparatus, who have long supported the rise of Ngawang Namgyal’s reincarnation. With support coming from every element of the monastic establishment in Bhutan, the Zhabdrung’s procession has been greeted warmly by every monastery they have passed, as religious leaders shower the Zhabdrung and his closest allies in gifts and honours. They may be pledging their love and support for the Zhabdrung because of their genuine commitment to him, or they may simply be terrified by his growing army. The source of their fealty matters little, so long as they know well who rules in Bhutan."
 bhutan_events.1033.a: "Return their gifts with kindness and compliments!"
 bhutan_events.1033.b: "Be sure that they know who holds the reins of power."

 bhutan_events.1034.t: "The Dorji Family Flees"
 bhutan_events.1034.d: "Former Gongzim Sonam Topgye Dorji is one of the most powerful men in Bhutan, orchestrating much of the Wangchuck’s royal government from his home on the southern border with India. In the most recent days of conflict between the king and the Zhabdrung, the royal heir, Jigme Dorji Wangchuck, was sent south to the custody of Sonam Topgye, and there were considerable fears within the Zhabdrung’s camp that the Gongzim would mount an expedition of foreign mercenaries to displace the monastic revolution which has unseated the Wangchucks. Without support from the Indians, however, and with the death of Tshering Penjor and the most loyal vassals of the Wangchucks, Sonam Topgye has been entirely declawed. In fact, spies sent to his home on the border have found it abandoned, with the Gongzim and his royal ward rumoured to have fled to Calcutta or further abroad, fearing capture and retribution. With no symbol of Wangchuck resistance to circle around, even the most discontented Penlops and courtiers have swallowed their pride to accept the rise of Zhabdrung Rinpoche Jigme Dorji."
 bhutan_events.1034.a: "Let them run to Timbuktu for all we care!"

 bhutan_events.1035.t: "The Zhabdrung Ascendant"
 bhutan_events.1035.d: "With the military forces loyal to the late king completely eliminated, the monastic body rapidly expressing a change of loyalty, and the remaining noble leaders withdrawing to their Dzong Fortresses, the Zhabdrung Rinpoche Jigme Dorji stands as the undisputed ruler of Bhutan. Entering into Punakha to crowds of courtiers and peasants quiet with anxiety and fear, the Zhabdrung has called for a new Lhengye Zhungtshog, the ancient councils which governed the nation during the reign of the first Zhabdrung, to assemble in his nearby home at Talo Monastery. Pardoning all those who served the old and misguided monarchy of the Wangchuck clan, Zhabdrung Jigme Dorji has proclaimed his vision of a new theocratic realm, a return to the perfect government of Ngawang Namgyal which has been corrupted by generations of self-serving and short-sighted administrators. With none standing to oppose him, Jigme Dorji has succeeded in reviving the Chosidnyi Diarchy of yore. Not since the days of the great father of Bhutan, Ngawang Namgyal, has the Zhabdrung wielded such extensive temporal power!"
 bhutan_events.1035.a: "The legacy of Ngawang Namgyal is finally realised!"

 bhutan_events.1036.t: "The Conflagration at Cheri"
 bhutan_events.1036.d.nocaravan: "Following the treachery of the Zhabdrung and the incapacitation of the king, Tshering Penjor called an emergency council of Penlops and leaders. There, he claimed conclusively that an evil spirit had possessed the body of the Zhabdrung Rinpoche to bring ruin upon Bhutan, and that it was the duty of every faithful and loyal man to smite this demon. Rousing the men, he led a brutal assault on the fortress monastery. After a bloody skirmish for entry to the lower courtyard of Cheri, Tshering Penjor was able to assemble his finest warriors under the cover of the outlying buildings, even while those loyal to the Zhabdrung rained arrow and musket fire from the cliff-side murderholes above. The assault on the central fortress was methodical, and Tshering Penjor led his forces room by room, killing all within who raised the bare minimum of resistance.\n\nAt the height of the fighting, the Zhabdrung was found hiding in his chamber and unceremoniously executed by some of Tshering Penjor's soldiers. The triumphant western Penlop then brought his severed head to the parapits, shouting down at his soldiers and the bandit monks that they had all been freed of the spells cast by the evil demon. With the death of their leader confirmed, the monks have surrendered to the Royal host."
 bhutan_events.1036.d.caravan: "Following the treachery of the Zhabdrung and the incapacitation of the king, Tshering Penjor called an emergency council of Penlops and leaders. There, he claimed conclusively that an evil spirit had possessed the body of the Zhabdrung Rinpoche to bring ruin upon Bhutan, and that it was the duty of every faithful and loyal man to smite this demon. Rousing the men, he led a brutal assault on the fortress monastery. After a bloody skirmish for entry to the lower courtyard of Cheri, Tshering Penjor and his men were ambushed by a pair of machine guns hidden in the upper galleries of the keep. In seconds, hundreds of brave warriors were cut down by these new modern implements of death, with their corpses piling in the central courtyard of the monastery. When all hope seemed lost, and the King’s forces appeared to break under the onslaught, they were brought back from the brink by Tshering Penjor and his closest ally Namgyal Bahadur, who rallied their men to take up defensive positions under the cover of the outlying buildings. Avoiding the central courtyard, Tshering Penjor led a suicide drive through the mazelike hallways of the monastery, fighting room by room against the Zhabdrung’s zealous defenders.\n\nJust as his suicide push appeared to loose steam, the Zhabdrung was found hiding in a side chamber and unceremoniously executed by some of Tshering Penjor's soldiers. The triumphant western Penlop then brought his severed head to the courtyard, casting it out into the sight of the bandit monks and their deadly trap. He proclaimed that they had all been freed of the spells cast by the evil demon and should cast down their arms. With the death of their leader confirmed, the monks have surrendered to the Royal host."
 bhutan_events.1036.a: "Victory over the bandit betrayer, but at what cost?"

 bhutan_events.1037.t: "Departing Cheri Monastery"
 bhutan_events.1037.d: "In the absence of King Jigme, who remains bedridden and weak, Tshering Penjor has taken up the mantle of leadership within the royal host. Those who surrendered at Cheri have been divided up and handled by the harsh hand of the king's justice. Respectable monks have been exiled and are destined to be scattered throughout the kingdom, while lowly peasants and bandits have been jailed or executed with little pomp and circumstance. The convenient fiction of dark spells has driven much of the decision making, as those pardoned by the western Penlop are granted a justification for their treasonous actions.\n\nFor their part, the Je Khenpo and Samten Jamtsho have provided tepid support for Tshering Penjor’s actions at Cheri, as they have little interest in resisting the man with a sword and a recently confirmed contempt for the sanctity of monks. With his justice dealt out and his actions legitimised, Tshering Penjor has moved to bring the king and his host back to Punakha, so that Jigme can better recover in the comforts of the capital. However, he has already sent a number of his personal enemies within the coalition home to their respective Dzongs, securing his personal preeminence and power. The king’s situation is dire, and few believe that he will survive the trip back to the capital, leading many to believe that Tshering Penjor is more concerned with securing his personal position following the death of Jigme, rather than taking every action to marshal his resources towards the recovery of his liege. Even as his rivals depart, tens of messengers ride south to Phuentscholing, carrying plans for their own gambit for power."
 bhutan_events.1037.a: "A kingdom on the brink, hanging on one man’s life."

 bhutan_events.1038.t: "King Jigme Passes Away"
 bhutan_events.1038.d: "The capital is in a state of mourning. His majesty the wise and honourable Jigme Wangchuck has passed away peacefully, finally succumbing to the wounds he received at the hands of the treacherous snake of Talo Monastery. While those closest to the king, his relatives and his two consorts, the sisters Phuntsho Choden and Pema Dechen, fall into mourning and begin preparations for his funeral, the Penlops of the realm bustle with activity, aiming to use the death of their lord and master to improve their station. Most have coalesced around Tshering Penjor, the hero of Cheri and the late king’s cousin, who appears well prepared to seize the throne for himself. After all, Tshering Penjor holds many significant vestiges of royal legitimacy, such as the Raven Crown, a relic from a time when the late king Ugyen thought that he would die without an heir.\n\nOthers, like the former Queen Phuntsho Choden, have instead looked south to Phuentscholing, where the Gongzim Sonam Topgye guards Jigme’s young son, Jigme Dorji. Jigme Dorji cannot rule in his own right at age eight, but there are many Penlops who would honour the late king’s wishes by throwing their support behind a regency for the young heir. Sonam Topgye Dorji, who was instrumental in securing the throne for a young Jigme Wangchuck a decade ago, is seen by most to be the young heir’s greatest supporter, especially considering the betrothal between the Jigme Dorji Wangchuck and his daughter, Kesang Choden.\n\nAs tensions boil over, a number of figures from the various court factions have departed the capital to raise support, or more dangerously, to raise armies."
 bhutan_events.1038.a: "Vultures loom over a rotting corpse."

 bhutan_events.1039.t: "Tshering Penjor Crowned in Punakha"
 bhutan_events.1039.d: "In a ceremony attended by a number of powerful figures in the capital, such as the military leader Namgyal Bahadur and the loyalist abbots Choekyi Wangchuck and Samten Jamtsho, Tshering Penjor has finally been crowned as the Druk Gyalpo. The former Penlop of Paro, a jovial but severe warrior, outlined his own ascension as the will of the late King Jigme, proclaiming that Jigme personally instructed him to take power in his last moments. Tshering Penjor has pledged to defeat the remaining rebel forces in the country and to defend Bhutan from foreign aggressors. Whether he intends this message to refer to the bandits supporting the dead Zhabdung and the Indian socialists, or instead to Sonam Topgye (who appears to be amassing an army at the southern border near Phuentscholing) is yet to be seen. His ascension will likely be contested by the Gongzim and his ward, King Jigme’s son, in the coming months, and Tshering Penjor has wasted no time in assembling his own forces in the capital to meet this threat to his rule. Regardless, today the Raven Crown has finally been returned to its rightful place, atop the head of the Druk Gyalpo."
 bhutan_events.1039.a: "The king is dead, long live the king!"

 bhutan_events.1040.t: "Dorji Coup Aborted"
 bhutan_events.1040.d: "Sonam Topgye Dorji is clearly the second most powerful man in Bhutan, and with the son of the late king in his clutches, there was little doubt that he would make some sort of play for the throne. Yet good fortune and competent work has surely thwarted these schemes and secured the crown atop Tshering Penjor’s head for the foreseeable future. In the days immediately following the coronation of Tshering Penjor, head of the Royal Guard Namgyal Bahadur was able to move rapidly to lock down the capital, capturing any Penlop or Dzongpon attending who may wish to escape southwards to join the growing army of Sonam Topgye at Phuentscholing. Among these men was Sonam Topgye’s nineteen year-old son, Jigme Palden Dorji, who was caught attempting to escape in a small raft headed southwards on the Puna Thsang Chhu River. Jigme Palden, the young Dzongpon of Haa, has been delivered under guard to Tshering Penjor’s court.\n\nWith Sonam Topgye’s son in our custody, it appears that the growing rebel movement in the south has lost all momentum, and Sonam Topgye has ceased all attempts to call banners or form a rival government. We will simply hold on to his son and personally oversee his education in a secure part of the castle until we can be assured that his father will see reason. As it stands, it appears our victory has been secured."
 bhutan_events.1040.a: "It is good that he was able to see reason."

 bhutan_events.1041.t: "Civil War Averted" #TP Victory
 bhutan_events.1041.d: "In a meeting coordinated by the Je Khenpo, Tshering Penjor and Sonam Topgye Dorji have managed to reach an agreement to resolve the brewing civil war before any more blood can be shed. Tshering Penjor is a man with many consorts and more than enough children, but with no wife and no legitimate heir. With no legitimate successor, and with the young Jigme Dorji in Phuentscholing, it was not long before Tshering Penjor’s more conniving advisors convinced him to adopt Jigme Dorji Wangchuck as his son and heir, securing both his line and the legitimacy of the Wangchuck Clan. In exchange for the delivery of Jigme Dorji to the capital, Sonam Topgye will be awarded a number of rights and privileges, mainly a continuation of the special powers afforded to the Dorji family under the Wangchuck regime. Tshering Penjor has pledged to respect the betrothal contract between his young new heir Jigme Dorji and Sonam Topgye’s daughter, Kesang Choden, and the Dorji family will retain control over a number of Dzongpons, such as Haa Dzong. Additionally, Sonam Topgye will retain his role as the premier foreign agent in the nation, though Tshering Penjor has demanded that the Gongzim procure a few specific items for his personal enjoyment, such as “Modern Times,” the newest film by Tshering Penjor’s favorite actor, Charlie Chaplin."
 bhutan_events.1041.a: "It is good that they were both able to see reason!"

 bhutan_events.1042.t: "Sonam Topgye Crowns Jigme Dorji"
 bhutan_events.1042.d: "As the second most powerful man in Bhutan, and with the son of the late king in his clutches, it was only a matter of time before Sonam Topgye Dorji made a play for the kingdom’s throne. It came as little surprise, then, that Jigme Dorji, the young son of the late King Jigme Wangchuck, has been crowned as Druk Gyalpo in the border town of Phuentscholing, an infuriating and destabilising development which threatens to cast our realm into civil war. The truth is, the boy king has a viable claim, though he is far too young to rule in his own right, meaning that any acquiescence to his ascension would surely lead to a Dorji dominated regency. Already, several Dzongpons and gewogs have brought forces south to support Sonam Topgye’s attempt to seize the throne, and he has assembled a considerable host just north of Phuentscholing. If Sonam Topgye does not back down, then the only available course of action would be civil war."
 bhutan_events.1042.a: "Tshering Penjor calls his banners and marches south!"

 bhutan_events.1043.t: "Meeting in the South"
 bhutan_events.1043.d: "Meeting in a river valley just north of Phuentscholing, Tshering Penjor and Sonam Topgye are two men at an impasse. Having rapidly cobbled together two misshapen armies composed mainly of mercenaries and militias, neither is particularly confident in their forces’ ability to win the field in an outright engagement. With neither side willing to risk being the aggressor in an open battle, both men sit and wait, goading each other to make an error. As the largest armies of the realm poke and prod each other with skirmishers and raids, the lawlessness of the last season devolves further into wanton banditry and insurrection and Bhutan burns. The Je Khenpo Choekyi Wangchuck has joined Tshering Penjor’s host from the capital, and has pushed aggressively for the two sides to negotiate a settlement guaranteed by him and the monks. Whether or not Tshering Penjor ignores him, however, is up to the tenacity of commander Namgyal Bahadur, who has pushed fervently for an immediate attack to scatter Dorji’s forces and force Sonam Topgye’s retreat. Tshering Penjor will have to choose - put aside his differences with Sonam Topgye to end the fighting, or decide the fate of Bhutan in a pitched battle."
 bhutan_events.1043.a: "Request that Je Khenpo lead negotiations."
 bhutan_events.1043.b: "Screw that, charge them!"

 bhutan_events.1044.t: "Civil War Averted" #STD Victory
 bhutan_events.1044.d: "In a meeting coordinated by the Je Khenpo, Tshering Penjor and Sonam Topgye Dorji have managed to reach an agreement to resolve the brewing civil war before any more blood can be shed. Explaining the outsized legitimacy of the young Jigme Dorji to Tshering Penjor, the Je Khenpo was able to convince the short-reigned king that he must abdicate in favor of the young heir, granting him the Raven Crown and the traditional seat of the Druk Gyalpo. In return for this sacrifice, Tshering Penjor has been granted control of a regency council as preeminent regent, and has been granted the right to appoint three of its remaining members, with Sonam Topgye occupying the fifth chair.\n\nTshering Penjor was slow to accept this compromise, but managed to retain his pride by claiming that he had believed Jigme Dorji to have been dead, assuming the throne only because he believed Sonam Topgye was championing an imposter. With the boy king confirmed to be alive, and with Tshering Penjor granted the opportunity to inspect the young Jigme Dorji to confirm that he is truly his nephew, the Penlop of Paro has agreed to step down as king so that he may step up as regent. While the peace forged here by the Je Khenpo is fragile, almost all assembled have let out a sign of relief, as it appears no more blood will be shed for the Raven Crown."
 bhutan_events.1044.a: "It is good that they were both able to see reason!"

 bhutan_events.1045.t: "Sonam Topgye Infiltrates the Regency"
 bhutan_events.1045.d: "While the first month of the reign of the regency council led by the traditionalist troika of Tshering Penjor, Zamadar Chencho, and Wangdzongpon Kuezang went by without much fanfare or conflict, it was only a matter of time before Sonam Topgye began to corrupt the institution to his own ends. The cousin of Tshering Penjor through his mother Dechen Pelden, Wangdzongpon Kuezang, known also as Domchu, was the Paro Penlop’s closest ally on the council, a key source of aged wisdom and authority. Unfortunately, mere weeks after the formation of the regency he fell ill and withdrew to his home, his seniority a curse as well as a blessing. When Tshering Penjor moved to replace Kuezang with another ally, he found himself blocked by a new alliance between Zamadar Chencho, the Master of Arms, and the perfidious Gongzim Sonam Topgye.\n\nZamadar Chencho shockingly crossed over to Sonam Topgye following a series of poorly hidden personal gifts made to the young Master of Arms, who has suddenly become one of the richest men in Bhutan. His betrayal has shattered Tshering Penjor’s dominance over the regency, especially considering the close relationship Zamadar Chencho has with Tshering Penjor’s closest ally Namgyal Bahadur and the military. With his authority diminished, Tshering Penjor has little choice but to try to claw back some semblance of control over the court."
 bhutan_events.1045.a: "Publicly denounce Zamadar Chencho’s greed!"
 bhutan_events.1045.b: "No use crying over spilt milk."

 bhutan_events.1046.t: "Tshering Penjor Withdraws to Paro"
 bhutan_events.1046.d.denounced: "In his attempt to push fellow regent Zamadar Chencho into submission by calling attention to his recent corruption, Tshering Penjor unraveled the base of his support. The noble officers who long backed Tshering Penjor as their patron and leader have made the majority of their wealth through “back channels” since before the time of the monarchy. By throwing a tantrum over the gifts made to Zamadar Chencho, Tshering Penjor directly threatened to undercut the corruption at the heart of the realm’s noble patronage networks. Almost immediately, most of the military figures and minor traditionalist Penlops which backed Tshering Penjor began to throw their support behind Sonam Topgye, hoping that they would find a safe harbour among the reformist Gongzim’s supporters.\n\nWith his last vestiges of support abandoning him, Tshering Penjor saw the writing on the wall, retiring his position as regent in favor of returning to his domain in Paro. Impotent, frustrated, and altogether fed up with the royal court, the lord-turned-king-turned-regent has found himself exactly where he was a decade ago, abandoning his monarchical ambitions in favor of the simple pleasures of his personal fiefdom. Let those crazy enough to seek power deal with tax disputes, foreign encroachment, and monastic spats, while the wise Tshering Penjor will return home to the simple joys of playing the cymbals in the Mask Dance, or watching the latest film from the hilarious Charlie Chaplin."
 bhutan_events.1046.d.milked: "The second he pulled his forces back from bashing in the head of Sonam Topgye Dorji in that godforsaken valley north of Phuentscholing, Tshering Penjor knew that one day the perfidious old schemer would have the last laugh. He did not expect it so soon, however. Through luck, bribery, and potentially blackmail the Gongzim Sonam Topgye has demolished the traditionalist stranglehold over the regency council. Those closest to Tshering Penjor, like his friend Namgyal Bahadur, have been isolated and weakened in court, allowing reformist nobles and bureaucrats to rise into positions of prominence, while the continued betrayal of Zamadar Chencho allows Sonam Topgye to shout over Tshering Penjor’s objections.\n\nWith his last vestiges of support abandoning him, Tshering Penjor saw the writing on the wall, retiring his position as regent in favor of returning to his domain in Paro. Impotent, frustrated, and altogether fed up with the royal court, the lord-turned-king-turned-regent has found himself exactly where he was a decade ago, abandoning his monarchical ambitions in favor of the simple pleasures of his personal fiefdom. Let those crazy enough to seek power deal with tax disputes, foreign encroachment, and monastic spats, while the wise Tshering Penjor will return home to the simple joys of playing the cymbals in the Mask Dance, or watching the latest film from the hilarious Charlie Chaplin."
 bhutan_events.1046.a: "The more things change, the more things stay the same."

 bhutan_events.1047.t: "Tshering Penjor Stands Triumphant!"
 bhutan_events.1047.d: "The battle for Bhutan began ignobly, as a small skirmish between two parties of archers. As both claimants committed more and more skirmishers, arquebusiers, and soldiers into the fray, it soon became apparent that this would be the deciding confrontation. With little ammunition on either side, the battle quickly closed into a melee, and mercenaries, caravan guards, farm boys, and shield wielding swordsmen clashed relentlessly in a malformed mass of violence and death.\n\nInitially, Sonam Topgye’s superior firepower appeared to hold the day, but as time wore on, the hardened warriors of the last campaign outmatched his hired swords. Inspired by Tshering Penjor’s leadership in the assault against the Zhabdrung, and confident in the late king’s trust in his foremost commander, the veterans surged forward, routing the center of Sonam Topgye’s forces. The flanks of the Gongzim’s host collapsed immediately, leaving his camp exposed. Tshering Penjor’s luck would not hold, however, as his largely undisciplined forces set about looting the dead, allowing Sonam Topgye time to withdraw across the border to Phuentscholing. Regardless, Sonam Topgye’s forces have been soundly defeated, and there is no way he could continue to oppose Tshering Penjor’s command of Bhutan."
 bhutan_events.1047.a: "Regroup and determine how best to finish this."

 bhutan_events.1048.t: "The Dorji Clan Bends the Knee"
 bhutan_events.1048.d: "Hiding in the dubious borderlands between India and Bhutan, Sonam Topgye Dorji presented us with a dangerous situation. We dared not march an army into foreign lands to secure the defenseless old Gongzim and his royal hostage, but we could not leave them there to hang over our heads like the Sword of Damocles. Luckily, before we took any drastic actions, the Dorji supplied us with a suitable solution.\n\nThe old Gongzim has offered to surrender to us, so long as Tshering Penjor confirms the Dorji Family’s role as Haa and Chukha Dzongpons and the chief foreign agent of the realm. In return, Sonam Topgye will release Jigme Dorji Wangchuck to the care of Tshering Penjor, so that he may adopt him as his son and heir. Unable to bear a son of his own, despite his many wives and consorts, Tshering Penjor would solve several potential problems by taking on Jigme Dorji as his heir, bringing him critically needed legitimacy as well as the support of the remnants of the Wangchuck Clan. While sparing the old schemer in Phuentscholing is an odious prospect, the alternative would be to leave the strongest claimant to the throne of Bhutan under the care and control of the Indians, a move certain to doom our kingdom should they turn their eyes northward. With the kingdom finally unified under our rule, we could finally turn to wrangling the Zhabdrung remnants and ruling Bhutan!"
 bhutan_events.1048.a: "Let Sonam Topgye bow to me and my new son!"

 bhutan_events.1049.t: "Sonam Topgye Stands Triumphant!"
 bhutan_events.1049.d: "The battle for Bhutan began ignobly, as a small skirmish between two parties of archers. As both claimants committed more and more skirmishers, arquebusiers, and soldiers into the fray, it soon became apparent that this would be the deciding confrontation. With little ammunition on either side, the battle quickly closed into a melee, and mercenaries, caravan guards, farm boys, and shield wielding swordsmen clashed relentlessly in a malformed mass of violence and death.\n\nInitially, Sonam Topgye’s superior firepower appeared to hold the day, but as time wore on, the hardened warriors of the last campaign outmatched his hired swords. The tide would once again turn, however, when the veteran warriors of the late king’s host refused to advance on Dorji’s retreating forces, unable to bring themselves to run down the son of the man they swore to protect. With his center exposed, Tshering Penjor desperately tried to push the veterans forward or pull his wings together, but the lull in the fighting allowed Sonam Topgye to regroup and decimate the exposed flanks of Tshering Penjor’s host. Fleeing the field with his personal household guard, the Penlop of Paro has returned to his home, leaving Sonam Topgye and his king, the young Jigme Dorji, with an open march to the capital."
 bhutan_events.1049.a: "Onwards to Punakha, to seat a new king!"

 bhutan_events.1050.t: "Tshering Penjor Bends the Knee"
 bhutan_events.1050.d: "In the days following his failed attempt to seize the crown, Tshering Penjor has sent messengers to all corners of the kingdom, claiming that his rebellious actions were the result of false rumours which poisoned his ears. Tshering Penjor claims that he was led to believe that the young King had died immediately following the battle at Cheri Monastery, leaving him the only rightful heir to the throne.\n\nThis story of mistaken duty has fooled no one, and Sonam Topgye is tempted to strike out against the rebellious lord at Paro. However, in truth the remnants of the royal forces are in no shape to besiege Paro Dzong, especially while there is a realm to stabilise and bandits to root out. Tshering Penjor has requested his new liege’s forgiveness for his transgressions, and has offered to come to Punakha to pledge oaths of loyalty to Jigme Dorji, and to return the Raven Crown he had cruelly denied his father. Such public displays of subservience would do much to quiet the nerves of the traditionalists in court, who are wary of the new reformist dominated regency. Let the corpulent chief Tshering Penjor rule the palace of Paro, so long as he suitably kowtows to his new lord and master. With the kingdom finally unified under our rule, we could finally turn to wrangling the Zhabdrung remnants and ruling Bhutan!"
 bhutan_events.1050.a: "A new chapter for Bhutan, written in blood."

 bhutan_events.1051.t: "The Stink of Wangchuck Resistance"
 bhutan_events.1051.d: "While the rise of the Zhabdrung Rinpoche Jigme Dorji to a position of preeminence has been swift, and none have openly taken up arms to oppose his rule over Bhutan following the destruction of the Wangchuck host at Cheri, there is little doubt that many dislike the new status quo. Those who were pulled up to positions of power at the hands of the late king or his father have little love lost for the man who killed him, and many more fear that their petty little fiefdoms will fall victim to the Zhabdrung’s reforms. Frankly, many have every right to be afraid, as hundreds of Gewogs, Penlops, and Dzongpons have long grown fat off of the ignorance, indolence, and apathy of the Wangchuck regime.\n\nWithout a leader to rally around, these murmurings of insurrection have amounted to precious little. The death of Tshering Penjor and the disappearance of Sonam Topgye Dorji has led the monarchist camp to wallow in collective despair, accomplishing little aside from minuscule and meaningless acts of insubordination. Yet if there is one thing the Zhabdrung is well aware of, it is that a rebellion can quickly gain steam if ignored. After all, how did he come to sit on the throne?"
 bhutan_events.1051.a: "We will defeat them in time."

 bhutan_events.1052.t: "Rise of the Radicals"
 bhutan_events.1052.d: "Every good revolution needs true believers. The Zhabdrung’s revolt was no exception, relying heavily on an army of monks who had long simmered in anger at the perceived weakness of their elders. Scores of these men died at the hands of the king and his army, and it was their ferocity that drove the Wangchuck host back from their assault. When their erstwhile leader then extended a hand of friendship to the late king’s lackeys, his noble stooges, and pet his Je Khenpo, they protested loudly and angrily, but were ignored. In the months following this insult, these men have gathered their strength. They slowly infiltrated the organs of the newly forming government, placing their allies and supporters in background positions of power and eliminating many of their most competent enemies through scandal or silent violence.\n\nNow, these men cannot be ignored. The Zhabdrung’s orders are quietly modified by his loyal secretaries, his will is quietly interpreted by his loyal guardsmen, and his demands are quietly disregarded by his councilors. These men all agree that the divine reincarnation of Ngawang Namgyal is the undisputed ruler of Bhutan. But why then should they allow the corrupt and impious mongrels who ruined this realm corrupt his vision and disregard his wisdom? Would it not be more loyal of them to help their new ruler see the danger of trusting these dangerous false-friends? Would Bhutan not be better off in the humble hands of the true believers?"
 bhutan_events.1052.a: "Loyalty above all!"

### Characters ###
 BHU_jigme_wangchuck: "Jigme"
 BHU_jigme_wangchuck_leader_desc: "§YBorn:§! §L1905, in Phodrang, Wangdue Phodrang Province, Realm of Bhutan§!\n§YBackground:§! §LAs the eldest son of the Bhutan’s charismatic founder, Ugyen Wangchuck, the young Jigme inherited a country which had just barely been stitched together into a unified state. Stoic, reserved, and cautious, Jigme has risen to the occasion, having spent the last decade gently consolidating his kingdom. He has made a name for himself as a just ruler, whose greatest administrative project has been law reform, a long and often infuriating mission. He has sought to reduce judicial fees, diminish the scope of capital punishment, and to give each subject the right of direct petition to the crown. However, his personal virtue has rarely overwhelmed the stubborn inertia of his allies and subordinates, and may complain that Jigme has accomplished little in his reign thus far.\n\nRegardless of their opinion on his ability to rule, few doubt his skill with a bow. As a sporting archer, Jigme has proven himself both as a capable and gregarious competitor. In an attempt to spur competitive spirit among his compatriots, Jigme has jokingly proclaimed that any man who places last in an archery competition must drink from a barrel of Chaang liquor.\n\nJigme is a cautious and calm ruler, traits which have served him well as he navigated the stupor of the last decade. But when the world demands decisive leadership from their Druk Gyalpo, can Jigme rise to the occasion?§!"

 BHU_jigme_dorji_wangchuck: "Jigme Dorji"
 BHU_jigme_dorji_wangchuck_leader_desc: "§YBorn:§! §LMay 2nd, 1928, in Trongsa, Trongsa District, Kingdom of Bhutan§!\n§YBackground:§! §LHeadstrong and precocious, the young king Jigme Dorji holds little in the way of actual power, despite his title and lineage. The only child of the late king Jigme and his first wife Phuntsho Choden, the king was in the midst of planning his young heir’s education in Switzerland when he met his untimely end, thrusting poor Jigme Dorji onto the throne long before he was ready to rule. Having seen the vastness and modernity of the great cities of Dacca and Calcutta at a young age, the Jigme Dorji is possessed with a limitless curiosity for the wonders of the outside world. Sequestered in the court at Punakha, Jigme Dorji takes any opportunity to escape from his stuffy lessons in statecraft and etiquette to explore the surrounding villages and forests incognito, a habit which has sent a few of his handlers into stress-induced illness.\n\nWith a burgeoning love of his kingdom’s natural beauty and a growing respect for the duties of his station, it appears that Jigme Dorji will grow into a capable and responsible monarch. In the meantime, it is the duty of his regent, Sonam Topgye Dorji, to administer the state, all while keeping the young king from meeting an untimely end at the hands of a vagabond or the jaws of a tiger. To say it is an unenviable job is quite the understatement.§!"
 BHU_jigme_dorji_wangchuck_adult_leader_desc: "§YBorn:§! §LMay 2nd, 1928, in Trongsa, Trongsa District, Kingdom of Bhutan§!\n§YBackground:§! §LHaving fully ascended to the responsibilities and duties of kingship, Jigme Dorji has inaugurated his reign with boisterous celebration for the bright future ahead. The only child of the late king Jigme and his first wife Phuntsho Choden, the king was in the midst of planning his young heir’s education in Switzerland when he met his untimely end, thrusting poor Jigme Dorji onto the throne long before he was ready to rule. Having seen the vastness and modernity of the great cities of Dacca and Calcutta at a young age, the Jigme Dorji is possessed with a limitless curiosity for the wonders of the outside world. With his power as King, he has leveraged this curiosity to pursue a new program of reform, seeking to bring the nation forward into the twentieth century.\n\nThat is not to say that the young man has let his duty consume his youthful zeal for sport and leisure. He is a prolific hunter and outdoorsman, who takes great joy in scaling the many difficult peaks near his palace. More interesting, perhaps, is his continued habit of disguising himself to travel among the commoners near Punakha, bypassing his army of courtiers and advisors to gather insights into the problems and rumours of his kingdom from the people themselves. While only the future will tell whether his planned reforms will succeed or fail, none can question Jigme Dorji's conviction to the betterment of his kingdom and people.§!"

 BHU_zhabdrung_rinpoche: "Zhabdrung Rinpoche"
 BHU_zhabdrung_rinpoche_leader_desc: "§YBorn:§! §L1905, in Shar Dirang, North-East Frontier Tract, British India§!\n§YBackground:§! §LThe seventh mind reincarnation of the Zhabdrung Rinpoche, the young Jigme Dorji is a figure clouded in mystery. At the age of six, he and his family were brought to Punakha to be enthroned at the personal request of the late King Ugyen Wangchuck. Initially welcomed to court, his family would forge a powerful alliance with the powerful abbot Tsham Go Seb and his son, the Lopen Master Sangay Tenzin, through a marriage with the Zhabdrung’s cousin Dorji Wangmo. With their backing, the Zhabdrung would go on to acknowledge his nephew by this marriage as the new Sungtrul incarnation of his lineage, an act which further endeared himself to Sangay Tenzin while invoking the wroth of the Wangchuck clan, who had expressly forbidden the acknowledgement of any new Sungtrul incarnation.\n\nThis simmering anger between the Zhabdrung and the Wangchuck kings would not abate in the following years, eventually leading to the rebellion that brough the young Jigme Dorji into power as the de-facto, as well as de-jure, ruler of Bhutan. Having long chafed under the impotence of the ceremonial office he once held, the Zhabdrung has since exploded into leadership, proving himself as a vigorous, if tempestuous, ruler. He is in many ways a man of contradictions. He demands an active role in nearly all of the work that passes through the newfound administration, while also engaging in long retreats away from the capital to avoid said work. His devotion to Buddhism and the scriptures is matched only by his love for his many courtesans and the vices they accompany. His belief in the sanctity of peace and family is tempered by his willingness to crush his enemies, regardless of who they are.\n\nThere is only one thing is entirely clear about the young religious leader - he truly views himself as the reincarnation of the great Zhabdrung, and wishes more than anything to reclaim the ancient power and glory that has been stolen from Bhutan since Ngawang Namgyal reigned!§!"
 BHU_zhabdrung_rinpoche_army_chief_desc: "§YBorn:§! §L1905, in Shar Dirang, North-East Frontier Tract, British India§!"

 BHU_tshering_penjor: "Tshering Penjor"
 BHU_tshering_penjor_leader_desc: "§YBorn:§! §L1902, in Wangducholing Palace, Trongsa Penlop, in the Realm of Bhutan§!\n§YBackground:§! §LThe only son of the late King Ugyen’s daughter Sonam Pelden and the Dzongpon of Byagar, Chimi Dorji Rabden, Tshering Penjor would be groomed for the throne of Bhutan by his grandfather during a tumultuous period of sickness in 1918. Though Ugyen would recover and soon cast his eyes instead on his young son Jigme, Tshering Penjor would retain the sacred Raven Crown and rule over the powerful seat of Paro - a position of strength he would eventually leverage to take his rightful position as king of Bhutan, only two decades too late.\n\nFat, bald, and amiable, Tshering Penjor is simultaneously talented and unambitious, much more interested in his own personal projects than the administration of the state. As the Penlop of Paro, he personally oversaw the construction of the Ugyen Pelri Palace, modeling it on Zangtho Pelri, Guru Rinpoche's celestial paradise. He meticulously supervised every architectural detail in person, reportedly because he saw himself as an embodiment of the great treasure-revealer Pema Lingpa. He is both a strict and rigid adherent to the formal code Bhutanese etiquette Driglam Namzha, but also takes great pleasure as the host of great and bountiful feasts, grand parties where he lets his hair down (if he had any hair), forcing his soldiers to perform mask dances for guests while he artfully bashes the ritual cymbals.\n\nOne should not mistake his almost childlike mirth and conviviality for weakness, however, as Tshering Penjor is both quick to laugh and quick to behead. He is as harsh and cruel as he is generous and gregarious, and few doubt his ability to maintain control of the kingdom with an iron fist.§!"
 BHU_tshering_penjor_advisor_desc: "§YBorn:§! §L1902, in Wangducholing Palace, Trongsa Penlop, in the Realm of Bhutan§!"

 BHU_pasang_sherpa: "Pasang Sherpa"
 BHU_pasang_sherpa_leader_desc: "§YBorn:§! §Lin Tibet§!\n§YBackground:§! §LPasang Sherpa was a member of the Mukti Sena "Liberation Army" in Nepal. A Buddhist Nepali of Tibetan origin, he was deployed as part of a scheme tentatively backed by various Nepalese and Indian Nepali leaders (including the Koiralas) to organise Lhotshampa activists in Southern Bhutan - likely chosen because he could speak the language of the King and his advisors. Ultimately, he was the one to deliver socialist demands to the surrendering court and was retained by occupational authorities to oversee the new regime - a cobbled-together mess of exiles, defectors, foreign “advisors”.§!"
 BHU_db_gurung: "D.B. Gurung"
 BHU_db_gurung_leader_desc: "§YBorn:§! §Lin the Kingdom of Bhutan§!\n§YBackground:§! §LD.B. Gurung is the grandson of Garjaman Gurung, one of the first Nepali settlers in southern Bhutan, who became powerful as an intermediary between these new villages and their Bhutanese overlords. When Garjaman was granted a title of nobility by King Ugyen in the early 1920s, the Penlop of Paro, Tshering Penjor, assassinated him for fear of his growing wealth and power. The younger Gurung, disenchanted with Bhutan's leadership and the growing mistreatment of the Bhutanese Nepalis, would join forces with Ganesh Prasad Sharma to organise the Bhutan State Congress - a gathering of dissident intellectuals modelled after the Indian National Congress, whom they also sought funding from. These utopian but impotent statesmen sought a myriad of political reforms and redresses, but largely failed to make much headway (even among the Lhotshampa in the south) until foreign forces installed them into power.§!"
 BHU_mahasur_chhetri: "Mahasur Chhetri"
 BHU_mahasur_chhetri_leader_desc: "§YBorn:§! §Lin the Realm of Bhutan§!\n§YBackground:§! §LLittle is known of Mahasur Chhetri, and his reputation is shrouded by mystery. He came from a relatively prominent peasant family in Tsirang, who worked under the reformist Dorji family. Though he was “mit”, or ritual kinship friend, of Gongzim Sonam Topgye Dorji’s son, he would dramatically fall out with the Dorji family when they discovered his ties to dissident movements. His “Jai Gorkha” movement has ties to factions in Nepal and India (and possibly even Tibet), and ostensibly stands for democracy and rights for the downtrodden Lhotshampa minority of Bhutan. Whether or not his rule will be much better than what came before him, or will last long once foreign troops leave, is another question.§!"
 BHU_yanglop_sonam_chhozing: "Sonam Chhozing"
 BHU_yanglop_sonam_chhozing_leader_desc: "§YBorn:§! §Lin the Realm of Bhutan§!\n§YBackground:§! §LHaving served for a number of years as the Yanglop, or finance minister, under Sonam Topgye Dorji, Sonam Chhozing is just about the closest thing that Bhutan has to an economist. As one of the seniormost fiscal officials in the realm, he has worked closely to try to scrape together the wen, srangs, and rupees the kingdom so desperately needs. Having clashed with Sonam Topgye in the past over his stubborn adherence to the stagnation caused by the Wangchuck-Dorji alliance, now that Sonam Chhozing’s hands are untied he can pursue a new government, aimed at bringing Bhutan into the twentieth century (or, at the very least, the nineteenth).§!"
 BHU_choekyi_wangchuck: "Choekyi Wangchuck"
 BHU_choekyi_wangchuck_leader_desc: "§YBorn:§! §L1860, in the Realm of Bhutan§!\n§YBackground:§! §LNgawang Choekyi Wangchuck is an ancient and wisened lama, having risen to a position of prominence as the Dorji Lopon in 1922 at the age of 62, before rising to lead the Monastic Council as Je Khenpo in 1931. He goes nowhere without the aid of his nephew and protege Ngawang Tenzin Gyatso, a promising young lama who often serves as the eyes and ears (and some claim, the brains) of the old monk. With the fall of the former Bhutanese regime, the imposition of the Je Khenpo as a figurehead ruler is far from surprising. He is well respected by much of the nobility and clergy, and far too old to have much fight left in him.§!"
 BHU_sonam_topgye_dorji: "Sonam Topgye Dorji"
 BHU_sonam_topgye_dorji_leader_desc: "§YBorn:§! §L1896, in Kalimpong, Presidency of Fort William in Bengal, British India§!\n§YBackground:§! §LHailing from the powerful Dorji family, the longstanding Dzongpons of Haa, renowned for their shrewd political and mercantile expertise, Sonam Topgye is the son of Ugyen Dorji, one of the principal leaders in the unification of Bhutan. Long serving as the hereditary Chief Minister officeholders under the late King Ugyen Wangchuck, the rise of his son Jigme on the back of Dorji intervention only strengthened their familial bonds between the two clans. As the Gongzim, Sonam Topgye is technically the second most powerful man in the Bhutanese court, but his true role in the royal apparatus keeps him far from the capital, in the Indian border town of Kalimpong.\n\nUncharacteristically cosmopolitan for a Bhutanese subject, Sonam Topgye is the primary intermediary between the tiny kingdom and the outside world, through his role as principal trade agent and de-facto ambassador to India (and through it, the world). In this position, Sonam Topgye has been spectacularly successful in navigating the tempestuous years of active warfare on the Indian subcontinent, allowing Bhutan to emerge unscathed and (relatively) secure diplomatically. With near limitless autonomy in his southern fiefdom, Sonam Topgye is the subject of envy, admiration, and animosity in equal measure, drawing whispers both awed and angry calling him, “the real puppet master behind the Wangchuck throne.”§!"
 BHU_interregnum: "Interregnum"
 BHU_interregnum_leader_desc: "§YBackground:§! §LBhutan is now a kingdom without a king, and its throne lies vacant, for the time being at least.§!"
 BHU_namgyal_bahadur: "Namgyal Bahadur"
 BHU_namgyal_bahadur_sic_desc: "§YBorn:§! §L1899, in Lhuentse, Kurtoe Penlop, Realm of Bhutan§!\n§YBackground:§! §LThe scion of one of the more powerful families in the Wangchuck clan, Chabda Namgyal Bahadur has become a leading voice of the proud marital aristocracy of Bhutan. Despite his young age, he has rapidly become a respected commander, and his reputation as a firm supporter of the conservative establishment has made him a powerful leader within the Traditionalist faction of the Wangchuck court. Opposed to the growing power of the Dorji family and concerned over the dangers posed by the republican Indians to the south, Namgyal Bahadur has stridently advocated for Bhutan to withdraw from all diplomatic entanglements, so that she may prepare for war.\n\nAs a soldier he is resolute and cunning, earning recognition in his decisive handling of the Nobgang bandits in 1933, as well as his growing role on the periphery of the Royal Guard. His political conservatism is firmly divorced from his military prowess, considering he is one of the few Bhutanese commanders to have trained with western style soldiers. Chabda Namgyal earned his epithet “Bahadur”, meaning hero in Hindi, as a member of a small diplomatic party sent to the British in the early days of the Indian crisis, where he impressed some members of the Assam Rifles by breaking two rifles with his own hands. Physically impressive and politically savvy, Namgyal Bahadur is certainly a rising star in Bhutan.§!"
 BHU_zamadar_chencho: "Zamadar Chencho"
 BHU_zamadar_chencho_high_command_desc: "§YBorn:§! §L1878, in Haa, Paro Penlop, Realm of Bhutan§!"
 BHU_chhoki_gyeltshen: "Choekyi Gyeltshen"
 BHU_chhoki_gyeltshen_sic_desc: "§YBorn:§! §Lin the Realm of Bhutan§!\n§YBackground:§! §LComing from the same family of Sersang Lama religious nobility as the Zhabdrung, Choekyi Gyeltshen came into his political adolescence among the growing bustle of the court at Talo, where the nucleus of the Zhabdrung’s restoration was born. Bold, independent, and ambitious, Choekyi Gyeltshen rapidly rose to become the primary political driver within the Zhabdrung’s inner circle, managing the increasingly dangerous temporal affairs of the young lama. Choekyi Gyeltshen carries himself with a princely air of gentle certitude, a fitting trait, given that the Sersang Lama lineage traces itself back to Lhase Tsangma, a famed Tibetan prince. Despite his haughty demeanor, Choekyi Gyeltshen is just as likely to rub shoulders with the rough men of the mountains as he is to scheming nobles, and he approaches both tasks with near ceaseless energy.\n\nWholeheartedly dedicated to the cause of the young Zhabdrung, and unabashedly devoted to his young cousin, Choekyi Gyeltshen would surely give his life to see his family rise to the position that their name demands. To this end, he has thrown himself into the work of creating a functional administration, pragmatically engaging with anyone he believes could serve the interests of the realm.§!"
