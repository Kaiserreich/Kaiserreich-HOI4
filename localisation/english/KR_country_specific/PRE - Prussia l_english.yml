### Characters ###
 PRE_werner_scholem: "Werner Scholem"
 PRE_werner_scholem_leader_desc: "§YBorn:§! §LDecember 29th, 1895, in Berlin, Province of Brandenburg, Kingdom of Prussia, German Empire§!\n§YBackground:§! §LHe joined the Socialist Party (SP) in 1921, becoming an increasingly hardline organiser and an editor of Die Rote Fahne (The Red Flag). Scholem faced significant government harassment, not only for his politics but also due to anti-semetism - making him a target for various far right groups. Nevertheless, the determination of Scholem and other SP Actionists made them a popular choice for socialist occupation authorities to install as the helm of a new government in Prussia.§!"

 PRE_albert_grzesinski: "Albert Grzesinski"
 PRE_albert_grzesinski_leader_desc: "§YBorn:§! §LJuly 28th, 1879, in Treptow an der Tollense, Grand Duchy of Mecklenburg-Schwerin, German Empire§!\n§YBackground:§! §LThe illegitimate son of a maid and butcher's apprentice and raised by a wheelright, Grzesinski worked as a metal spinner in Berlin. He became a member of the German Metalworkers' Union (DMV) in 1897, a union within the General German Trade Union Federation (ADGB). A year later he joined the Social democratic Party (SPD) and became a senior trade union official and chairman of the local SPD within a few years.\n\nA respected member of the right wing of the SPD, Grzesinski continued to grow in political influence in various elected roles. He has shown a particular interest in law enforcement and interior portfolios, serving as a trainee lawyer from 1921-1922 and taking on various policing roles. He also was a passenger on the Graf Zeppelin in 1928. Occupation authorities selected him to helm the new government, believing him to have the requisite connections in politics, labor, and security to enforce order.§!"

 PRE_otto_hoetzsch: "Otto Hoetzsch"
 PRE_otto_hoetzsch_leader_desc: "§YBorn:§! §LFebruary 14th, 1876, in Leipzig, Leipzig District, Kingdom of Saxony, German Empire§!\n§YBackground:§! §LThe son of a plumber and grandson of a court director, Hoetzsch attended the University of Leipzig and Ludwig Maximilian University of Munich studying history, art history, and economics, earning a doctorate in 1900 under Karl Lamprecht. Afterwards he became an editor of the \"Academic Papers\" of the Association of German Students' Clubs and also worked as a librarian at the HIstorical Institute in Leipzig. He was particularly fascinated in Eastern European history and Russian history. As a student he was also a member of the antisemitic Association of German Students in Leipzig.\n\nStarting from 1906 he took on teaching roles including at the Prussian War Academy and University of Berlin. A one-year volunteer for the Saxon Army shortly before the Great War, he spent the conflict in the foreign press department of the deputy general staff. After the war he continued to rise through the ranks of academia and also entered politics - joining the German Fatherland Party (DVLP) and serving in the Reichstag. A polyglot (passing a military interpreter's exam in Polish and Russian in addition to studying other languages) previously selected by the German government during negotiations with Russia and the founder of the German Society for the Study of Eastern Europe, despite being a German nationalist he called for rapprochement with Eastern states much to the derision of other members of the far right. This likely helped him secure the most senior role in the new order.§!"

 PRE_eitel_friedrich: "Eitel Friedrich von Preußen"
 PRE_eitel_friedrich_leader_desc: "§YBorn:§! §LJuly 7th, 1883, in the Marmorpalais of Potsdam, Province of Brandenburg, Kingdom of Prussia, German Empire§!\n§YBackground:§! §LThe second son of Wilhelm II, Eitel Friedrich was educated at the Prince's House in Plön. He served as a commander of the 1st Food Guards Regiment during the Great War with distinction and  later the 1st Guards Division on both the Western and Eastern Fronts. In addition the prince was the Grand Master of the (Protestant) Order of St. John.\n\nHis post-war life was far less happy. He was said to have been affiliated in various far right groups but a major corruption scandal broke out causing him to be sidelined from all official roles. His marriage with Sophie Charlotte of Oldenburg proved testy, with tabloids reporting on his wife's extra-marital affairs and several lawsuits against them resulting in love letters being read aloud in court - something picked up by foreign press and forcing him to resign from his Grand Mastership in favor of his younger brother. Turned into a laughing stock and the black sheep of his family, he retreated into the background.\n\nThe collapse of Germany lead to the more senior members of his family being deposed. Unable or unwilling to convince them to accept a (lesser) role in the new government in Eastern Germany, occupation authorities have convinced the shunned and childless prince out take on the role - likely as a placeholder. This decision has been decried as a betrayal by many of his family members, but he has justified his decision as a necessary evil to keep the Prussian throne with his family.§!"

