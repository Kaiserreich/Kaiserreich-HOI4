 AFG_balance_of_power_category: "$AFG_power_balance$"
 AFG_change_decision_currency: "Change Decision Currency"
 AFG_change_decision_currency_desc: "Although regular political capital is always a good way to get things done, the more literal capital used for our reform efforts could always instead be requisitioned as \"encouragement\" to achieve our political ambitions."
 AFG_bribe_tribal_leaders: "Bribe Tribal Leaders"
 AFG_bribe_tribal_leaders_desc: "While finding support in the nation's urban centres, the strongest enemies to the King's many reforms lie amongst the nation's rural tribes. While we are unlikely to ever truly get them on board with reform efforts, a few funds slipping from the treasury and ending up in the coffers of tribal leaders is certain to quell their anger."
 AFG_rein_in_the_reformers: "Rein in the Reformers"
 AFG_rein_in_the_reformers_desc: "Although they may have the backing of the King, the nation's eager reformers often overstep their boundaries, turning many against both themselves and the King by association. It would be best for now to rein them in, so that they at least don't bring the King down with them."
 AFG_fund_westernisation_efforts: "Fund Westernisation Efforts"
 AFG_fund_westernisation_efforts_desc: "Westernisation is vital for Afghanistan to rise to be an equal of the other great nations of the world, despite the fearmongering of naysayers. We should assign more officials towards furthering these efforts, and import experts from our more advanced allies to aid in them."

 AFG_state_building_decisions: "State Building"
 AFG_state_building_decisions_desc: "Modernising the [ROOT.GetAdjective] state enough to survive in the modern world is no easy task, especially without a stable foreign patron. Through gathering §CReform Points§! decisions unlocked by economic focuses can be completed, slowly increasing our level of §YNational Integration§! and lowering its associated penalties.\n\n§CNational Integration Level§!: [AFG_GetDecentralisationCurrent][AFG_GetAnger]\n£GFX_production_texticon §CReform Points:§! [?AFG_reform_points|Y0]"
 AFG_state_building_anger_level: "\n§CAnger:§! [?AFG_anger_level|Y0%]"

 AFG_monthly_reform_progress_mission: "Monthly Progress Report"
 AFG_monthly_reform_progress_mission_desc: "Afghanistan shall be great again!"

 AFG_improving_the_darulaman_tramway: "Improving the [267.Controller.GetVictoryPointName_12769] Tramway"
 AFG_improving_the_darulaman_tramway_desc: "The tram that runs from [267.Controller.GetVictoryPointName_10737] to [267.Controller.GetVictoryPointName_12769] was introduced in 1923. Since then, both cities have gotten larger, with more demand for transport between the two. We shall obtain new engines that move faster, and can pull more passenger carriages to improve commuting."
 AFG_home_building_in_farah: "Home Building in [1117.Controller.GetVictoryPointName_2017]"
 AFG_home_building_in_farah_desc: "With the urbanisation of the Afghan people in progress, cities such as [1117.Controller.GetVictoryPointName_2017] will need more housing units. Meanwhile, preexisting homes are nowhere near the safety or comfort of today's construction standards. We will build more homes for newcomers, and improve already standing houses to fit modern living."
 AFG_supporting_kunduz_cotton: "Supporting [1118.Controller.GetVictoryPointName_12314] Cotton"
 AFG_supporting_kunduz_cotton_desc: "[1118.Controller.GetVictoryPointName_12314] is one of our richest provinces, thanks to its lucrative cotton industry. We should invest in and expand cotton harvesting and processing to create jobs and bring in more wealth."
 AFG_distributing_paper_afghanis: "Distributing Paper Afghanis"
 AFG_distributing_paper_afghanis_desc: "Afghans rely often on the bartering of wares for wealth and goods. This means that for many, their wealth is tied to livestock, land, and other valuables with little ease in transactions. Introducing our paper currency through banks and the exchange of goods for currency will simplify and speed up transactions, increasing our economic power."
 AFG_founding_the_baghlan_sugar_factory: "Founding the Baghlan Sugar Factory"
 AFG_founding_the_baghlan_sugar_factory_desc: "Baghlan is Afghanistan's largest source of sugar beets, but has no industralised processing. We will build a factory in Baghlan to finally process our harvests, bringing new jobs and increasing the efficiency of local sugar production."
 AFG_mining_efforts_in_qaramqol: "Mining Efforts in Qaramqol"
 AFG_mining_efforts_in_qaramqol_desc: "Recent surveys indicate the presence of iron deposits in the province of Qaramqol. We should develop and exploit these deposits, so that Afghanistan has the steel necessary to fuel her modernisation."
 AFG_develop_nangarhar_sugar_plantations: "Develop Nangarhar Sugar Plantations"
 AFG_develop_nangarhar_sugar_plantations_desc: "Of the many crops grown in Nangarhar, sugarcane has the most potential. Let us cordon more fields in the area to dedicate to sugarcane farming, and feed our growing sugar industry."
 AFG_replacing_camels_with_automotives: "Replacing Camels with Automotives"
 AFG_replacing_camels_with_automotives_desc: "Many of our people still use livestock for transportation, especially camels. Why? We can begin selling affordable automobiles to our subjects, facilitating expansion of our infant automobile industry, and modernising transport."
 AFG_growth_of_karakul_herding: "Growth of Karakul Herding"
 AFG_growth_of_karakul_herding_desc: "Refugees from Central Asia have brought with them Karakul sheep, which are in high demand for the use of their pelts in Muslim fashion, especially here in Asia. We should encourage the shepherding of Karakuls amongst our people, to meet the demands for more pelts."
 AFG_encourage_mining_along_the_logar: "Encourage Mining Along the Logar"
 AFG_encourage_mining_along_the_logar_desc: "Along the Logar River sits deposits of copper, ready to be mined. Mining efforts in the province should be set up, as the river makes for a fantastic transporter of goods down to [267.Controller.GetVictoryPointName_10737]."
 AFG_improve_connections_to_iran: "Improve Connections to [PER.GetName]"
 AFG_improve_connections_to_iran_desc: "[PER.GetName] is one of the largest countries in our region, and they have been making progress in modernisation, same as us. We should improve infrastructure connecting our two countries, so that cities on our borders can grow."
 AFG_develop_border_towns: "Develop Border Towns"
 AFG_develop_border_towns_desc: "Since we are landlocked, our neighbours are the only connection to the rest of the world, especially in trade. We should expand the towns and villages on our borders to encourage business reliant on trade, and supply garrisons with more recruits."
 AFG_tapping_the_sabzak_pass: "Tapping the Sabzak Pass"
 AFG_tapping_the_sabzak_pass_desc: "The Sabzak Pass winds through the Selseleh-ye Safid Kuh, the local name for the Paropamisus Mountains. We can begin mining operations along the pass, and process the ore in [415.Controller.GetVictoryPointName_4893]."
 AFG_bridging_the_kunduz: "Bridging the [1118.Controller.GetVictoryPointName_12314]"
 AFG_bridging_the_kunduz_desc: "The [1118.Controller.GetVictoryPointName_12314] is a relatively large river, and the city of [1118.Controller.GetVictoryPointName_12314] has not been getting smaller. If we were to bridge across the [1118.Controller.GetVictoryPointName_12314] river, we could expand the city onto the other side, and build hydroelectric facilities in between."
 AFG_expand_pashtun_colonisation_efforts: "Expand Pashtun Colonisation Efforts"
 AFG_expand_pashtun_colonisation_efforts_desc: "The northern parts of Afghanistan have historically been a subject of Pashtun settlers. Expanding these settlements would give our people the opportunity to obtain arable land, while suppressing any unrest form Turkic subjects."
 AFG_welcoming_american_refugees: "Welcoming American Refugees"
 AFG_welcoming_american_refugees_desc: "The civil war in America has resulted in thousands of people fleeing to escape the violence, especially those with money and skills. Why not recruit some of these professionals and business owners, especially as they are without a home? Afghanistan shall gladly open her doors to such educated refugees, in return for their help in modernisation."
 AFG_the_kandahar_development_plan: "The [1117.Controller.GetVictoryPointName_5064] Development Plan"
 AFG_the_kandahar_development_plan_desc: "[1117.Controller.GetVictoryPointName_5064] currently sits as an ancient city with plenty of modernisation potential. Transforming [1117.Controller.GetVictoryPointName_5064] into a model industrial city should be a top priority, especially to attract western workforces."
 AFG_the_grand_mazar_i_sharif_bazaar: "The Grand [1118.Controller.GetVictoryPointName_7584] Bazaar"
 AFG_the_grand_mazar_i_sharif_bazaar_desc: "In the city of [1118.Controller.GetVictoryPointName_7584] sits the Blue Mosque, the resting place for the Caliph Ali, and a pilgrimage site for Shi'ite Muslims. The traffic coming through the city means thousands of potential consumers for goods in the local economy. We should construct a Grand Bazaar within the city, so that the pilgrims may purchase wares from our people and bring their wealth to the city."
 AFG_carrying_out_a_geological_survey: "Carrying Out a Geological Survey"
 AFG_carrying_out_a_geological_survey_desc: "Much of Afghanistan has land with uncertain properties. Perhaps it is fertile for crops? Maybe it has valuable minerals or oil buried underneath? We shall commission surveys of our domain for potential development."
 AFG_irrigation_renovation_in_wardak: "Irrigation Renovation in Wardak"
 AFG_irrigation_renovation_in_wardak_desc: "The people of Wardak rely on agriculture for their local economy, yet their farming methods are backwards. We need to modernise their irrigation infrastructure, to bring more water to the area for larger crop yields."
 AFG_bringing_drinking_water_to_nimruz: "Bringing Drinking Water to Nimruz"
 AFG_bringing_drinking_water_to_nimruz_desc: "The province of Numruz has always been incredibly isolated from the rest of the country, especially in regards to water access. Modern well drilling should improve the access the people have to water, making them happier and healthier."
 AFG_electrification_campaign_in_state: "Electrification Campaign in [FROM.GetName]"
 AFG_electrification_campaign_in_state_desc: "So much of Afghanistan is still lit by lamps, in an age where electricity is plentiful. We need to electrify our communities, so that the mountains of Afghanistan may glow with lightbulbs!"
 AFG_building_shirkat_monopolies: "Building Shirkat Monopolies"
 AFG_building_shirkat_monopolies_desc: "The Shirkat is a joint stock company that has a monopoly on an industry within Afghanistan. To ensure our industries are both profitable and efficient, we need to help establish more monopolies via new Shirkats."
 AFG_branching_out_the_bank: "Branching Out the Bank"
 AFG_branching_out_the_bank_desc: "The Da Afghanistan Bank has been a success in facilitating new businesses and distributing currency. It is time that the bank has branches across the country, so that all can reap the rewards of new capital."
 AFG_generalised_investment_schemes: "Generalised Investment Schemes"
 AFG_generalised_investment_schemes_desc: "Many of our people do not have sufficient wealth beyond what their households own. By engineering chances for our people to become stock owners, we can bring wealth to the households of many, and raise funds for further economic expansion."

 AFG_crossroads_of_civilisation_decisions: "Crossroads of Civilisation"
 AFG_crossroads_of_civilisation_decisions_desc: "Even with the precarious economic situation Black Monday has left the world in, it should still be possible to squeeze a few more funds out of our allies across the globe. Whether they be German, Russia, Japanese, or Turk; their money is welcome in [AFG.Capital.GetCapitalVictoryPointName], and so are any other kind of deals they may happen to offer us.\n[GER.AFG_GetForeignInfluenceCountries][RUS.AFG_GetForeignInfluenceCountries][TUR.AFG_GetForeignInfluenceCountries][JAP.AFG_GetForeignInfluenceCountries]"
 AFG_crossroads_of_civilisation_country_influence_desc: "\n[THIS.GetFlag] [THIS.GetName]:\nForeign Influence Points: [?AFG.AFG_foreign_influence_@THIS|Y0] |  Foreign Influence Share: [?AFG.AFG_foreign_influence_share_@THIS|Y0%]"

 AFG_entice_companies: "Entice [FROM.GetAdjective] Companies"
 AFG_entice_companies_desc: "Despite our military advances, Afghanistan finds itself significantly lacking in those with the capability to produce more for the army than cheap copies of Martini-Henrys. With enough sway we may be able to convince [FROM.GetAdjective] companies to set up shop in [267.Controller.GetVictoryPointName_10737], [415.Controller.GetVictoryPointName_4893], and other major cities, hopefully allowing us to fulfill the needs of a modern military."

 AFG_the_hajigak_mine_concession: "The Hajigak Mine Concession"
 AFG_the_hajigak_mine_concession_desc: "A joint Afghan-German geological survey has located a particularly large iron oxide deposit near the Hajigak pass. We have been approached by multiple German companies, including both Krupp and Thyssen, regarding granting a concession, including the construction and establishment of steel mills near the deposit. This concession would flood our economy with much-needed steel, and create an enormous amount of jobs for the region."
 AFG_combat_exercises_with_the_russians: "Combat Exercises with the Russians"
 AFG_combat_exercises_with_the_russians_desc: "Russia does not have the same military as they used to. Thanks to reforms, it is much more modernised and prepared in innovative forms of warfare. Their proximity to us and their advanced military would make them perfect partners for combat exercises, helping the both of us prepare for any future conflicts."
 AFG_inviting_turkish_military_experts: "Inviting Turkish Military Experts"
 AFG_inviting_turkish_military_experts_desc: "While our military is in the progress of reforming its upper command, we still have a ways to go. Luckily, our improving relationship with the Ottoman Empire has bourne fruit: they have offered to send us officers with experience in military reforms. We should take advantage of this opportunity to help make the structure of our armed forces more efficient."
 AFG_commit_to_the_eurasian_rail_scheme: "Commit to the Eurasian Rail Scheme"
 AFG_commit_to_the_eurasian_rail_scheme_desc: "Japan has approached us regarding an opportunity that benefits the both of us: Japan wishes to physically connect their continental Asian territories with Europe, to improve trade and logistical opportunities. Due to tensions between Russia and Japan, they have chosen to bypass Siberia entirely, which is where we would come in. Helping build a railway between Europe and Asia would significantly improve trade opportunities between both continents for us, not to mention be a source of pride and jobs for our people."

 AFG_attract_foreign_investment: "Attract [FROM.GetAdjective] Investment"
 AFG_attract_foreign_investment_desc: "One of the easiest ways we can introduce modern infrastructure, jobs and factories to our country is by giving other countries the opportunity to do it for us. For example, by approaching [FROM.GetAdjective] investors, our government is paid to let them construct factories, sell goods, and train our troops. The downside is that Afghanistan will slowly grow more reliant on [FROM.GetAdjective] support, but if we introduce measures to limit their influence without scaring them off, we should be fine." #Does not work with desc =
 AFG_attract_foreign_investment_GER_desc: "$AFG_attract_foreign_investment_desc$"
 AFG_attract_foreign_investment_RUS_desc: "$AFG_attract_foreign_investment_desc$"
 AFG_attract_foreign_investment_TUR_desc: "$AFG_attract_foreign_investment_desc$"
 AFG_attract_foreign_investment_JAP_desc: "$AFG_attract_foreign_investment_desc$"

 AFG_pashtunistan_crisis_decisions: "A Crisis in Pashtunistan"
 AFG_pashtunistan_crisis_decisions_desc: "If there is anything the situation in Timergara has made clear, it is that the unofficial toleration of the Pashtunistan government can no longer continue. One way or another, they must be integrated into the Afghan state; and if Wardak wants to keep his head it must be done quickly, before the King decides to do something rash...\n\nCurrent number of demands met: [?AFG_pashtunistan_points|Y0]"

 AFG_pashtunistan_crisis_reformist_mission: "Compromising with the Khans"
 AFG_pashtunistan_crisis_reformist_mission_desc: "While the government in [442.Controller.GetVictoryPointName_12717] has been willing to hear Wardak out, they have made clear that they will not simply surrender to Amanullah's demands without significant concessions and guarantees. With enough support given to the region however, they may be willing to budge, if their initial demands are too much to stomach."
 AFG_pashtunistan_crisis_traditional_mission: "Negotiate with the Powerbrokers"
 AFG_pashtunistan_crisis_traditional_mission_desc: "The local government in [442.Controller.GetVictoryPointName_12717] is popular and strong, but they are not the only players in this crisis. Throughout the frontier, local tribes and aristocrats still hold plenty of power. By focusing our efforts on these men, we can directly undermine the organised government's standing, and resolve this conflict quickly."
 AFG_retake_the_frontier_mission: "Retake the Frontier"
 AFG_retake_the_frontier_mission_desc: "The time for negotiations has long since passed: the only thing that these upstarts will truly understand is the end of a bayonet. King Amanullah has given the order to take control of [442.Controller.GetVictoryPointName_12717] by force, and end this charade of autonomy."

 AFG_transfer_control_of_local_transportation_responsibilities: "Transfer Control of Local Transportation Responsibilities"
 AFG_transfer_control_of_local_transportation_responsibilities_desc: "Currently, the railways and roads connecting [442.Controller.GetVictoryPointName_12717] to the rest of Afghanistan are operated and managed by the central government, including tolls. By allowing [442.Controller.GetVictoryPointName_12717] to collect their own tolls and regulate transport in and out of the state, we will be giving them a considerable amount of autonomy in exchange for loyalty."
 AFG_devolved_taxation: "Devolved Taxation"
 AFG_devolved_taxation_desc: "Since our acquisition of the frontier, our central government has taxed [442.Controller.GetVictoryPointName_12717] disproportionately compared to the rest of the country, the more urbanised makeup of the state being a focus of taxation compared to tribes and villages. Granting the government in [442.Controller.GetVictoryPointName_12717] the ability to collect taxes would cut into our budgets, but would satisfy much of [442.Controller.GetVictoryPointName_12717]'s discontent."
 AFG_let_peshawar_handle_local_conscription: "Let [442.Controller.GetVictoryPointName_12717] Handle Local Conscription"
 AFG_let_peshawar_handle_local_conscription_desc: "Although many in the Frontier willingly sign up for the Royal Army, the area is subject to conscription just like the rest of the country. This has been a source of significant contention, as Frontier locals believe that those in the heartlands are passing by their own brethren in favour of conscripting frontiersmen; a perception that will hopefully go away if handled locally instead."
 AFG_tolerate_a_devolved_legal_system: "Tolerate a Devolved Legal System"
 AFG_tolerate_a_devolved_legal_system_desc: "[442.Controller.GetVictoryPointName_12717]'s history as a part of British India means that their legal system has enough British and Indian influence to chafe at the imposition of our judiciary. Giving them the autonomy to manage their own legal system would muddle the integration of the province into Afghanistan, but it may be enough to prevent a full-on civil war."
 AFG_limit_royal_powers_over_appointments: "Limit Royal Powers Over Appointments"
 AFG_limit_royal_powers_over_appointments_desc: "[442.Controller.GetVictoryPointName_12717] has historically been led by officials brought about through local elections, and as such the King's imposition of his own men into their government has provoked many an outcry. Perhaps if the King is restricted in who he can appoint in [442.Controller.GetVictoryPointName_12717], it will stave off opposition to our rule."

 AFG_tolerate_expansion_of_the_chitral_bodyguard: "Tolerate Expansion of the Chitral Bodyguard"
 AFG_tolerate_expansion_of_the_chitral_bodyguard_desc: "The current Mehtar of the province of Chitar is dead set on expanding the size of his bodyguards: normally this would be considered an attempt at undermining our soldiers. Luckily for the Mehtar, he and his bodyguards are a perfect counter to the power and strength of [442.Controller.GetVictoryPointName_12717]i forces. Allowing this expansion will establish a force counter to any insurgency, though we will need to watch the Mehtar in case he has other ideas for his domain."
 AFG_guarantee_protection_of_hazarewal_land_rights: "Guarantee Protection of Hazarewal Land Rights"
 AFG_guarantee_protection_of_hazarewal_land_rights_desc: "The Hazarewal region is home for a score of tribes and communities made up of various ethnic groups, including several Pashtun tribes. Their leadership could be swayed to support us in our bid against the cosmopolitanism of [442.Controller.GetVictoryPointName_12717], in exchange for the recognition of the right to own the lands they reside in."
 AFG_grant_conscription_exemptions_for_dir: "Grant Conscription Exemptions for Dir"
 AFG_grant_conscription_exemptions_for_dir_desc: "The Khan of Dir has approached us regarding a quandry of his: the population of his kingdom is small, and as such conscription would disproportionately affect his people more than other tribes and leaders. Granting him exemption from our conscription system would firmly place him in our camp and undermine [442.Controller.GetVictoryPointName_12717]."
 AFG_fund_swat_architectural_projects: "Fund Swat Architectural Projects"
 AFG_fund_swat_architectural_projects_desc: "Bacha Sahib is the particularly capable ruler of Swat, and has always held ambitions of expanding his influence. As it stands, Swat is largely ignored by [442.Controller.GetVictoryPointName_12717], being seen as backwards and insignificant. Helping Sahib build new infrastructure and settlements for his subjects would grant us an ally that would have the capacity to rally other tribal leaders against [442.Controller.GetVictoryPointName_12717]'s central power."
 AFG_strengthen_the_nawab_of_ambs_legitimacy: "Strengthen the Nawab of Amb's Legitimacy"
 AFG_strengthen_the_nawab_of_ambs_legitimacy_desc: "Muhammad Farid Khan Tanoli, the Nawab of Amb, has faced significant unrest in the face of his recent ascension to the throne. Helping him strengthen his rule would give us an advantage over the [442.Controller.GetVictoryPointName_12717], without needing to concede any local power."
 AFG_funnel_bribes_to_tribal_leaders: "Funnel Bribes to Tribal Leaders"
 AFG_funnel_bribes_to_tribal_leaders_desc: "Many tribal leaders throughout the frontier have been neutral in our conflict with [442.Controller.GetVictoryPointName_12717], either due to their lack of interest or worries of undermining their own power. Fortunately for us, many of them are also led by opportunists, who would support us in a heartbeat if they had something to gain. We should ensure that these tribes were properly rewarded if they were to support us in this standoff."

 AFG_afghan_civil_war_decisions: "Afghan Civil War"
 AFG_afghan_civil_war_decisions_desc: "The Sack of [267.Controller.GetVictoryPointName_12769] and death of the Crown Prince during the King's European tour has left the nation in chaos. Order may have been briefly restored by §zNadir Khan§!, whom many now recognise as king, but the worst of the troubles are still to come. §fAmanullah§! has returned, ready to fight for the throne, commanding his loyalists from a temporary capital in [1117.Controller.GetVictoryPointName_2017].\n\n§CAmanullah's Strength:§! [?AFG_strength_level|Y0%]\n$AFG_amanullah_victory_conditions$\n$AFG_nadir_victory_conditions$\n\nThe royal treasury currently stands at£GFX_production_texticon §CReform Points:§! [?AFG_reform_points|Y0] for acquiring further support."

 AFG_civil_war_duration_mission: "The War Rages"
 AFG_civil_war_duration_mission_desc: "Pretenders rampage and lay waste to our countryside, and our forces chase after them, eager to end the war. Yet, the war still rages on, an exhausting balance between devoting everything to victory and everything to governance. We must act quickly to end this war, before our entire nation collapses."

 AFG_amanullah_makes_his_move: "Amanullah Makes His Move"
 AFG_amanullah_makes_his_move_desc: "Reports are concerning: meetings in the dead of night, troop movements we never expected; Amanullah is plotting something. If we do not act now, we may see yet another part of our domain fall to his forces."

 AFG_nadir_makes_his_move: "Nadir Makes His Move"
 AFG_nadir_makes_his_move_desc: "Nadir, ever the subject of popular adoration, flaunts his power: tribal fealty oaths, parades down the streets of backwater villages, and the ever present criticism from our own Ulema. Nadir is making his move, and if we do not stop him, we are unacceptably closer to defeat."

 AFG_launch_an_assault_against_herat: "Launch an Assault Against [415.Controller.GetVictoryPointName_4893]"
 AFG_launch_an_assault_against_herat_desc: "[415.Controller.GetVictoryPointName_4893]'s wealth and proximity to our border means enemy forces have both the resources and supply network to continue their insurgency. Taking back [415.Controller.GetVictoryPointName_4893] will immediately begin weakening the rebels."
 AFG_move_towards_mazar-i-sharif: "Move Towards [1118.Controller.GetVictoryPointName_7584]"
 AFG_move_towards_mazar-i-sharif_desc: "Approaching [1118.Controller.GetVictoryPointName_7584] is important, thanks to the size and historical significance of the city. If anyone but us holds [1118.Controller.GetVictoryPointName_7584], it will undermine our legitimacy amongst the Ulema."
 AFG_take_kunduz: "Take [1118.Controller.GetVictoryPointName_12314]"
 AFG_take_kunduz_desc: "[1118.Controller.GetVictoryPointName_12314] has been left with a token defence force. If we move quickly, we can easily retake the city with little resistance."
 AFG_storm_kabul: "Storm [267.Controller.GetVictoryPointName_10737]"
 AFG_storm_kabul_desc: "Our country's most prominent city, [267.Controller.GetVictoryPointName_10737], is finally within our sights. if we move now, we can deal a serious blow to the rebels."
 AFG_securing_the_path_to_kabul: "Securing the Path to [267.Controller.GetVictoryPointName_10737]"
 AFG_securing_the_path_to_kabul_desc: "[267.Controller.GetVictoryPointName_10737] is the nexus of our country, and as such much of our infrastructure finds its way there. Unfortunately the rebels understand this, meaning we need to secure the roads to [267.Controller.GetVictoryPointName_10737], to prevent them from making a beeline to the city."
 AFG_rally_the_amanites: "Rally the Amanites"
 AFG_rally_the_amanites_desc: "Throughout Afghanistan our allies sit in wait: army officers, forward thinking intellectuals, and businessmen, all of whom recognise the benefits of Amanullah's reign. Reaching out for support could net us additional funds, weapons, and even soldiers to end the upstart Nadir."
 AFG_promise_payments_to_the_fighters: "Promise Payments to the Fighters"
 AFG_promise_payments_to_the_fighters_desc: "While many support our cause out of ideology, many of our forces are in it for payment. Life in Afghanistan is harsh, and a little money can go a long way. We shall promise additional payment to entice more soldiers and bolster our morale."

 AFG_drive_loyalists_from_jalalabad: "Drive Loyalists From [267.Controller.GetVictoryPointName_12831]"
 AFG_drive_loyalists_from_jalalabad_desc: "[267.Controller.GetVictoryPointName_12831] is a unique target, because it is the location of Amanullah's residency. Capturing [267.Controller.GetVictoryPointName_12831] would put Amanullah on the run, preventing him from having a consistent base of operations."
 AFG_prevent_amanite_attacks_in_the_north: "Prevent Amanite Attacks in the North."
 AFG_prevent_amanite_attacks_in_the_north_desc: "Amanites have been reported on the move towards the northern parts of our country. Thankfully, we have remaining garrisons stationed there after the fiasco with the Saqqawists. We should make short work of any attackers there."
 AFG_retaking_herat: "Retaking [415.Controller.GetVictoryPointName_4893]"
 AFG_retaking_herat_desc: "[415.Controller.GetVictoryPointName_4893]'s fall has left us vulnerable and gave Amanullah a nexus for importing weapons. Retaking the city should be our top priority."
 AFG_assault_farah: "Assault [1117.Controller.GetVictoryPointName_2017]"
 AFG_assault_farah_desc: "At the moment, [1117.Controller.GetVictoryPointName_2017] lays relatively undefended. If we move fast, we can quickly get ourselves an easy victory against the Amanites."
 AFG_crush_scattered_loyalists: "Crush Scattered Loyalists"
 AFG_crush_scattered_loyalists_desc: "We are closer than ever to claiming victory against the Amanites; their leadership has been left rudderless and they now scatter like rats. It is time for us to wipe up the pockets of resistance left and extinguish this foolishness."
 AFG_reassert_state_control: "Reassert State Control"
 AFG_reassert_state_control_desc: "Now that we have upended Amanullah, there is much work to be done. Restarting tax collection, refilling the bureaucracy and more needs to be complete before we can ever proclaim victory."
 AFG_keeping_the_army_loyal: "Keeping the Army Loyal"
 AFG_keeping_the_army_loyal_desc: "Part of our success has been attributed to the army's loyalty to Nadir. While we appreciate it, reality dictates that eventually they will turn on us if they feel unappreciated. Let us treat our benefactors well, lest we deal with our own deposition."

 AFG_reach_out_to_backer: "Reach Out to [FROM.GetNameDef]"
 AFG_reach_out_to_backer_desc: "Our path to victory unfortunately cannot be paved by us alone. We must reach out to [FROM.GetNameDef] to request further resources, Or we risk facing the Amanites, who may have a benefactor of their own."

 AFG_seek_imperial_recognition: "Seek Imperial Recognition from [FROM.GetName]"
 AFG_seek_imperial_recognition_desc: "While in our hearts we know that Afghanistan has transformed into a state that can match modern imperial states such as the Ottomans and the Japanese, few outside of our borders have recognised our proclamation that the monarch should be regarded as an emperor rather than simply a lowly king. If we however secure recognition of our claim by the major nations of the world, everyone else will soon fall in line behind them and acknowledge our rightful status."
 AFG_declare_the_second_afghan_empire: "Declare the Second Afghan Empire"
 AFG_declare_the_second_afghan_empire_desc: "Having secured support from the major nations of the world, no one can seriously deny our status as a modern empire any longer. We shall now take our rightful place as one of the great constitutional empires that have defined the 20th century, washing away the outdated perception of Afghanistan being simply a minor backwards kingdom."

 AFG_acquire_allied_rifles: "Acquire [FROM.GetAdjective] Rifles"
 AFG_acquire_allied_rifles_desc: "Our [FROM.GetAdjective] friends have been incredibly supportive, offering to sell us weaponry to continue our cause. A few words and an exchange of cash should yield a sizeable number of rifles."
 AFG_acquire_allied_support_equipment: "Acquire [FROM.GetAdjective] Support Equipment"
 AFG_acquire_allied_support_equipment_desc: "Our army needs medical equipment, binoculars, fortification supplies, and much more. Reaching out to our [FROM.GetAdjective] benefactors should net us enough supplies for our forces."
 AFG_acquire_allied_aircraft: "Acquire [FROM.GetAdjective] Aircraft"
 AFG_acquire_allied_aircraft_desc: "The application of aircraft in the modern day is boundless. Reconnaissance, transportation, bombing enemy targets - It would give us a great advantage. Let's purchase some planes from [FROM.GetAdjective] companies."
 AFG_acquire_allied_armour: "Acquire [FROM.GetAdjective] Armour"
 AFG_acquire_allied_armour_desc: "A motorised artillery piece with enough armour to stop bullets is exactly what we need. No more wasting soldiers to machine gun fire and mass infantry charges. We need to reach out to [FROM.GetAdjective] armour companies as soon as possible."

 AFG_consolidation_of_the_realm_decisions: "Consolidation of the Realm"
 AFG_consolidation_of_the_realm_decisions_desc: "Much must be rebuilt and reasserted. Many of our bureaucrats, officers, and administrators may have sympathies with the enemy. We must thoroughly comb through the state apparatus, while building our own legitimacy amongst our people."

 AFG_reasserting_amanullahs_authority_mission: "Reasserting Amanullah's Authority"
 AFG_reasserting_amanullahs_authority_mission_desc: "Since Nadir's attempt at usurpation, we need to remind people that Amanullah is in fact the rightful King of Afghanistan. We should start ensuring that the state apparatus is completely loyal, and that no one can question our authority."
 AFG_drive_saqqawists_from_the_north: "Drive Saqqawists from the North"
 AFG_drive_saqqawists_from_the_north_desc: "Even after the Saqqawists were shattered, many of the movement fled north, where sympathies for the bandits remains high. We must comb through the north and put down these rabid dogs before they can rebuild their strength."
 AFG_destroy_saqqawist_holdouts_in_the_south: "Destroy Saqqawist Holdouts in the South"
 AFG_destroy_saqqawist_holdouts_in_the_south_desc: "THere are still villages and areas of our country garrisoned by Saqqawist remnants. Wiping out these occupiers will deliver a message to our people that we are in control, and will suffer no rebellion."
 AFG_purge_the_palace: "Purge the Palace"
 AFG_purge_the_palace_desc: "Amanullah's ambitions of westernisation were not his own, but the result of perfidious westernisers residing in his own palace. To set the country on the right path, we must first show the people that the sacrilegious western syncophants have been dealt with."
 AFG_repeal_the_tazkera: "Repeal the Tazkera"
 AFG_repeal_the_tazkera_desc: "\"Register for Tazkera and accept death.\": a common saying about our westernised identification system. Now that our victory has been secured, we need a way to show the people that we are returning to a more traditional government: Repealing Tazkera is a good start."

 AFG_stabilise_the_realm_mission: "Stabilise the Realm"
 AFG_stabilise_the_realm_mission_desc: "Our ascension to the throne was impromptu, and thanks to the civil war, much of the country lies in disrepair and without authority. We must immediately begin building legitimacy and reasserting our rule."
 AFG_hunt_down_dissident_amanites: "Hunt Down Dissident Amanites"
 AFG_hunt_down_dissident_amanites_desc: "We may have vanquished Amanullah, but many a sympathetic citizen wish to continue his westernisation programmes. To prevent further sabotage of our reign, we need to purge any remaining Amanites who hide amongst our loyal subjects."
 AFG_establish_the_society_of_the_ulema: "Establish the Society of the Ulema"
 AFG_establish_the_society_of_the_ulema_desc: "During the civil war, much of the Ulema of Afghanistan supported our struggle. Now that we have emerged victorious, it is time to return the favour, and establish a body of the most scholarly Ulema to advise our rule."

 AFG_restore_the_nations_unity: "Restore the Nation's Unity"
 AFG_restore_the_nations_unity_desc: "[442.Controller.GetVictoryPointName_12717]'s loss in their war for independence has left them resentful of our country. If we are ever to recognise our dreams for a Loy Afghanistan, we must do whatever it takes to integrate our wanton frontier back into the nation, and move forward as one."
 AFG_bring_state_into_the_fold: "Bring [FROM.GetName] Into the Fold"
 AFG_bring_state_into_the_fold_desc: "Our recent acquisition of [FROM.GetName] is being complicated by the uncertainty of its people in their place in Afghanistan. We must prioritise efforts in integrating their administration and cultures, lest we deal with attempts at independence in the future."

 PTH_negotiate_with_india_decision: "Negotiate with India"

### Ideas & Modifiers ###

 AFG_lands_of_villages_tribes_and_faiths: "Land of Villages, Tribes, and Faiths"
 AFG_lands_of_villages_tribes_and_faiths_desc: "Afghanistan is a land defined by its large tribal population, with many of its people effectively ruling themselves with little input from the capital. Afghanistan is however a land also defined by significant ethnic division and religious traditionalism, with intertribal conflicts and Pashtun chauvinism being common place. These divides have long frustrated Amanullah's attempts at modernisation, although this tribal autonomy has had the silver lining of many simply not caring about what happens in [267.Controller.GetVictoryPointName_12769], much to the King's benefit."
 AFG_spectre_of_rebellion: "Spectre of Rebellion"
 AFG_spectre_of_rebellion_desc: "In the early months of 1929, troops loyal to King Amanullah saw off the largest rebellion to his rule so far, led by the bandit king Habibullāh Kalakāni and his band of Saqqawists. Supported by much of the traditionalist Ulema and Kalakāni's fellow Tajiks, they had aimed to overthrow Amanullah and reverse his years of modernisation. While Kalakāni may have perished, the escape of many of his loyalists to Bukhara, led by his uncle Purdil Khan, has long been one of the sharpest thorns in the regime's side. Even with their defeat, fears about the exiled movement's growing strength across the border has many convinced that a second rebellion is inevitable."
 AFG_national_integration_modifier: "National Integration"
 AFG_national_integration_modifier_desc: "Even after years of reforms and modernisation efforts, Afghanistan finds itself a heavily decentralised backwater. While attempts to further centralise and develop the nation will inevitably lead to conflict, it is believed by the country's reformers that these growing pains must be tolerated for Afghanistan to rise again as the great power it deserves to be."
 AFG_loy_afghanistan: "Loy Afghanistan"
 AFG_loy_afghanistan_desc: "The Fourth Anglo-Afghan War of 1926, or to those in India the \"Afghan Occupation of the Frontier\", has long been a source of pride for the Afghan nation. While Afghanistan's freedom was won in the third war just a few years prior, the failure to secure the region now commonly referred to as Pashtunistan weighted heavily on its people. Its capture following rebellions during the Raj's collapse wiped away this shame, and even when people begin to question the government they remember what has been won for them.\n\nFor those in Pashtunistan however, their integration into Afghanistan has been a bittersweet one, with the frontier operating more as an independent nation in its own right rather than part of a single whole. Many who once cheered as they saw Afghan troops ride across the border now see their ties to [267.Controller.GetVictoryPointName_12769] as little more than a weight holding them down, believing they would be better off fully independent or integrated into [HND.GetNameDef]."
 AFG_loy_afghanistan_2: "Loy Afghanistan"
 AFG_loy_afghanistan_2_desc: "The Fourth Anglo-Afghan War of 1926, or to those in India the \"Afghan Occupation of the Frontier\", has long been a source of pride for the [AFG.GetAdjective] nation. While [AFG.GetName]'s freedom was won in the third war just a few years prior, the failure to secure the region now commonly referred to as Pashtunistan weighted heavily on its people. Its capture following rebellions during the Raj's collapse wiped away this shame, and even when people begin to question the government they remember what has been won for them."
 AFG_stagnant_army: "Stagnant Army"
 AFG_stagnant_army_desc: "Despite significant developments towards the end of the last decade, especially in response to the Fourth Anglo-Afghan War and major rebellions against the crown that defined those years, the Royal Afghan Army has slowly begun to stagnate. Funding meant for the armed forces has in recent years found its way instead into Amanullah's own pet projects, a bigger focus now for the King, something that has drawn significant ire from its leadership. The silver lining for them however is that over recent months the king has slowly seemed more and more receptive of their demands for army reform, and expect it to begin full scale going into the new year."

 AFG_afghan_army_republican: "Afghan Republican Army"
 AFG_afghan_army_royal: "Royal Afghan Army"
 AFG_afghan_army: "[AFG_GetArmyTitle]"
 AFG_afghan_army_desc: "The [AFG_GetArmyTitle] traces its origin to the Third Anglo-Afghan War, in response to King Amanullah's call for a Jihad against the British. As it stands, the Army is relatively behind in its capacity for warfare, with much of its responsibilities delegated to the various tribal militias and irregulars. The Army's direction and focus is split, with Iranian and Kemalist-inspired modernists on one end, and traditionalists with tribal connections on the other. Until the internal conflicts that plague Afghanistan are resolved, the Army will fail to do more than play second fiddle to militias."
 AFG_modern_logistics_networks: "Modern Logistics Networks"
 AFG_modern_logistics_networks_desc: "The subpar infrastructure of Afghanistan has meant that the military has always had issues with supplies: many garrisons are underequipped and move slowly, while tribal forces rely on scavenging and ransacking to equip themselves. This has all changed with new investments in infrastructure and reforms to logistic networks: now supplies are effeciently managed, and take modern roads and railways to reach their destination."
 AFG_above_the_land_of_mountains: "Above the Land of Mountains"
 AFG_above_the_land_of_mountains_desc: "Formed in the shadow of British aerial warfare during the Third Anglo-Afghan War, the Air Force is the most advanced branch of the national military. Its primary responsibility is to defend the skies of Afghanistan, though it is most effective at the reconnaissance and suppression of any would-be bandits or rebels. Still, the Air Force lags behind in comparison to global developments in aerial warfare. As a result, many officers within the Air Force wish to turn the collection of Russian and British Planes into a proper fleet of aircraft; even more so, the western-oriented Air Force has been a bastion of reformism for the country and will likely continue to push for modernisation."

 AFG_renovated_defence_ministry: "Renovated Defence Ministry"
 AFG_renovated_defence_ministry_desc: "What was once a dumping ground for opportunists and unwanted tribal conscripts has become a bastion of warfare. Increases to the budget and military reforms have resulted in higher paid soldiers and more capable officers to lead them. Soon, Afghanistan will no longer need to rely on petty tribal forces to defend itself, and can look forward to responding to any threat with ease."
 AFG_directorate_of_intelligence_records_idea: "Directorate of Intelligence Records"
 AFG_directorate_of_intelligence_records_idea_desc: "The Directorate of Intelligence Records serves as [ROOT.GetNameDef]'s intelligence agency, ensuring that dissidents and undesirables do not threaten the regime...assuming they do their jobs correctly."

 AFG_replacing_camels_with_automotives_idea: "Replacing Camels with Automotives"
 AFG_replacing_camels_with_automotives_idea_desc: "Many of the people in [ROOT.GetNameDef] still rely upon livestock for transportation, especially camels. As part of largescale modernisation efforts, the [ROOT.GetAdjective] state has begun to sell affordable automobiles to its subjects, facilitating expansion of its infant automobile industry, and modernising transport."
 AFG_electrification_campaign_modifier: "Electrification Campaign"
 AFG_electrification_campaign_modifier_desc: "The [AFG.GetAdjective] state has begun a significant effort in this region to provide its citizens, and more importantly its infrastructure, proper access to electricity. In time, it is hoped that this will facilitate greater industrial growth locally."
 AFG_industrial_revolution: "Into an Era of Prosperity" # This Economic Boom is Dedicated to the Brave Mujahideen Fighters of Afghanistan.
 AFG_industrial_revolution_desc: "Afghanistan was once a war-stricken, impoverished country the Great Powers and neighbouring countries could exploit. However, the recent rapid economic developments have helped Afghanistan catch up with its Western counterparts. While there is still much to be done, the country is experiencing an economic boom like none other before. Major socioeconomic changes are expected to occur in the years to come. What remains to be seen is whether [ROOT.GetLeader] and the government can sustain this growth."

 AFG_growth_of_the_economic_ministry: "Growth of the Economic Ministry"
 AFG_growth_of_the_economic_ministry_desc: "What started out as an experiment in economic interventionism has grown into a series of successful investments in our own people. Already our infusions of wealth into our economy have bourne fruit: thriving new businesses, increased attraction of foreign capital, and the blooming of a generation of entrepreneurs, industrialists and middle class citizens. In response, our Economic Ministry is flush with investment returns and job applications, with many in Afghanistan wishing to grow our economy and build their own wealth."

 AFG_direction_of_the_education_ministry_idea: "Direction of the Education Ministry"
 AFG_direction_of_the_education_ministry_traditional_desc: "Following royal decree, the Education Ministry of Afghanistan has been instructed to pursue a national curriculum that elevates true understanding of Islam above all else, with the government the arbitrator on such a meaning. This has been welcomed by the nation's religious establishment, who view this as the correct purpose of education, despite opposition from reformers who fear it will leave the nation behind its peers."
 AFG_direction_of_the_education_ministry_reformist_desc: "Following royal decree, the Education Ministry of Afghanistan has been instructed to pursue a national curriculum that teaches secular concepts alongside religious ones, rather than in deference to the latter. While welcomed by the nations reformists, who see this as simply adopting the standard set by the rest of the modern Islamic world, the religious establishment has labelled it as another step towards the atheistic socialist destruction of Islam."

 AFG_army_desertions: "Army Desertions"
 AFG_army_desertions_desc: "Attempts to crackdown on looting by Afghan troops has seemingly backfired, with morally dubious soldiers choosing to desert over this restriction. Some are said to have even go as far as defecting to the other side, with hopes it'll be more financially lucrative."

 AFG_pashtunistan_autonomous_province_modifier: "Pashtunistan Autonomous Province"
 AFG_pashtunistan_autonomous_province_modifier_desc: "Since its acquisition in 1926, the province of Pashtunistan has functioned more as a country within a country, resulting in growing conflicts between [442.Controller.GetVictoryPointName_12717] and [267.Controller.GetVictoryPointName_12769]. A a series of tense negotiations has resulted in the Pashtunistan Autonomous Province. Much of the responsibilities of the national government have been delegated directly to Pashtunistan, in return for the recognition of Afghanistan's sovereignty over the province. For now, only time will tell if this new union can hold."
 AFG_pashtunistan_autonomous_province_india_modifier: "$AFG_pashtunistan_autonomous_province_modifier$"
 AFG_pashtunistan_autonomous_province_india_modifier_desc: "Following the revolt that led to its independence from [AFG.GetNameDef], and the victory of [442.owner.GetNameDef] in the Indian Civil War, the region of Pathanistan has chosen to reunite with India over continued independence. As part of this agreement, it continues to enjoy a significant degree of autonomy, with the local government functioning much as it did in prior years."
 AFG_chitral_treaties_modifier: "Chitral Treaties"
 AFG_chitral_treaties_modifier_desc: "Due to the refusal of [442.Controller.GetVictoryPointName_12717] to reasonably acquiesce, the national government has chosen to instead negotiate with the local tribes of Pashtunistan. The resulting Chitral Treaties are a series of agreements and privileges between local tribe leaders and [267.Controller.GetVictoryPointName_12769], in exchange for their professing loyalty and fealty to Afghanistan. Hopefully this arrangement will counter any independence movements on our frontier."

 AFG_king_of_the_army: "King of the Army"
 AFG_king_of_the_army_desc: "King Amanullah may have been King of Afghanistan, but the Army follows another leader. He championed the Army and its needs to the foolish Amanullah, broke bread with his fellow soldiers, and led them to glory in battle. The Army only recognises the authority of Mohammad Nadir Shah, the true King of Afghanistan, and will gladly fight to make sure he keeps the throne."
 AFG_backed_by_the_tribes: "Backed by the Tribes"
 AFG_backed_by_the_tribes_desc: "The tribes have been largely ignored throughout the civil war, and as such have remained neutral. We have convinced them to support our cause, and can now count their numbers as our own, and finally end this conflict."

 AFG_modernising_the_monarchy: "Modernising the Monarchy"
 AFG_modernising_the_monarchy_desc: "Amanullah's hesitancy in sweeping away tradition and outdated notions on how to reign as a monarch proved to be devastating for the country. It is time we course correct, and set out in forging a monarchy built upon modern governance, philosophy, and efficiency, instead of wallowing in traditionalist fear."
 AFG_the_entrepot_of_the_east: "The Entrepot of the East"
 AFG_the_entrepot_of_the_east_desc: "Afghan cities have always been hubs for travelers going across the continent. However, despite our pristine location, we see very little trade compared to other countries. We must transform our nation into a prosperous stopping point for international trade, and bask in the wealth a country sitting between Persia and India should have."
 AFG_backroom_funding: "Backroom Funding"
 AFG_backroom_funding_desc: "Recently the [AFG.GetRulingParty] has begun to receive significant donations from bank president Abdul Majid Zabuli, an apparent supporter of the government's policies. Although not directly confirmed by anyone, many have noted the government has begun to pursue many policies that just so happen to be in Zabuli's favour since this began."

 AFG_the_realm_of_amanullah: "The Realm of Amanullah"
 AFG_the_realm_of_amanullah_desc: "Amanullah's enemies are scattered to the wind or have been cowed into submission. With no one standing in his way, Afghanistan is Amanullah's to remake as he sees fit, to be transformed into a westernised country."
 AFG_healing_the_scars_idea: "Healing the Scars"
 AFG_healing_the_scars_idea_desc: "King Amanullah works to bridge the divide between his people, and to forgive those who trespassed against him. In time, Afghanistan may be able to look back upon such conflict, knowing that peace and unity are at hand."
 AFG_the_economic_independence_plan_idea: "The Economic Independence Plan"
 AFG_the_economic_independence_plan_idea_desc: "Overreliance on foreign wealth and power has put Afghanistan dangerously close to subjugation. Our trade policies, investments and taxes will be redone to stave off the economic power of our lenders and investors, and push Afghanistan towards being in full control of its own economy."
 AFG_returning_to_tradition: "Returning to Tradition"
 AFG_returning_to_tradition_desc: "The folly of westernisation almost broke the nation. The King recognises that, and has begun to shift the nation back to its cultural and religious roots. There is no need to needlessly modernise: tradition is persistent for good reason."

 AFG_the_end_of_westernism: "The End of Westernism"
 AFG_the_end_of_westernism_desc: "Down with the sacriledge and the infidelity! Cast aside the secular and the progressive! Afghanistan is a nation of the Ummah, where Sharia is the law of the land, the same as it was when our forefathers moved to these mountains. We will expunge this Western stain with righteous prejudice."
 AFG_an_economy_for_the_people: "An Economy For the People"
 AFG_an_economy_for_the_people_desc: "Who makes up the Afghan nation? It is not foreign business or greedy apostates: it is the common man, the faithful amongst us, those who traverse the mountains and work with dilligence in our villages. Our economy should be built around them, not these decadent merchants of degeneracy."

 AFG_the_peoples_revolution: "The People's Revolution"
 AFG_the_peoples_revolution_desc: "Our nation is no longer in the hands of an aristocrat or a monarch. This revolution has finally put the people of Afghanistan in power. Our nation will be rebuilt around the people, for they are the nation in whole."
 AFG_the_economic_revitalisation_plan: "The Economic Revitalisation Plan"
 AFG_the_economic_revitalisation_plan_desc: "Our economy is backwards and stagnant, with its only beneficiaries corrupt plutocrats. A new course of state reforms, regulations and investments must be made to bring wealth to all of our people, not just those who already have it."
 AFG_army_purges: "Army Purges"
 AFG_army_purges_desc: "Following the implication of army officers in the assassination of Nadir Khan, a purge is being carried out under the Prime Minister's orders, replacing many of those implicated with his loyalists."

 AFG_national_agricultural_plan: "National Agricultural Plan"
 AFG_national_agricultural_plan_desc: "The [ROOT.GetAdjective] government has begun efforts on a largescale agriculture plan in the Helmand region, hoping to improve food self sufficiency in the long term. Despite the significant resources dedicated to it, it is expected to eventually be worth the effort."

 AFG_a_gradual_approach: "A Gradual Approach"
 AFG_a_gradual_approach_desc: "While Amanullah modernised without a care for national stability, Nadir recognises the worth of some of his programmes. A series of reforms will be introduced, but not without nuance: these reforms will make sure not to disrupt our society or nation."
 AFG_sensible_economic_reforms: "Sensible Economic Reforms"
 AFG_sensible_economic_reforms_desc: "It is true, Afghanistan needs to be industrialised. However, it cannot be done without taking the people into account. Nadir shall introduce reforms and investments into the economy that keep in mind the citizens of his Kingdom, instead of merely building wealth."
 AFG_a_steady_hand: "A Steady Hand"
 AFG_a_steady_hand_desc: "The purpose of a King is to guide his kingdom in the right direction. This means no wanton reforms, progressive agendas, or westernisation programmes without an end. Nadir will rule correctly, advised by the correct people, and help correct Afghan society of any decadent ills brought on by the West."
 AFG_the_brotherly_camarilla: "The Brotherly Camarilla"
 AFG_the_brotherly_camarilla_desc: "In the wake of Nadir's demise, our country is in need of wisdom and efficient regency. Luckily, the new King's uncles have established a camarilla to govern while the King is still young. They shall be the ones to guide the nation through these dark times, and introduce the necessary changes for the country."

 AFG_reformation_of_the_afghans: "Reformation of the Afghans"
 AFG_reformation_of_the_afghans_desc: "The Anjuman-e-Islah-e Afghania, inspired by [442.Controller.GetVictoryPointName_12717]-style governance and politics, now oversees the country. Unlike [442.Controller.GetVictoryPointName_12717], much of Afghanistan is conditioned to function under absolutist monarchism. If we are to be free, we must transform our nation into one of democracy and liberty."
 AFG_reformation_of_the_afghans_6_soccon_desc: "The [AFG.GetRulingParty], inspired by [442.Controller.GetVictoryPointName_12717]-style governance and politics, now oversees the country. Unlike [442.Controller.GetVictoryPointName_12717], much of Afghanistan is conditioned to function under absolutist monarchism. If we are to be free, we must transform our nation into one of democracy and liberty."
 AFG_reformation_of_the_afghans_6_marlib_desc: "$AFG_reformation_of_the_afghans_6_soccon_desc$"
 AFG_afghan_swadeshi: "Afghan Swadeshi"
 AFG_afghan_swadeshi_desc: "During British rule, our neighbours from India founded the Swadeshi movement, focused on economic self-sufficiency centred around rural communities. Applying the pillars of this movement to our own nation shall help build the wealth of our people without relying on foreign money."

 AFG_the_unity_of_red_and_green: "The Unity of Red and Green"
 AFG_the_unity_of_red_and_green_desc: "Our government is guided by socialism, but our people are devout followers of Islam. While some may see this as a crisis, we see it as proof of our rightful revolution: what is more divine than letting the working people govern themselves in freedom?"
 AFG_sweepers_led_by_muftis: "Sweepers Led by Muftis"
 AFG_sweepers_led_by_muftis_desc: "Much of Afghanistan is peasantry and nonindustrial labour, meaning that there is not enough of an educated working class to lead the movement. We shall instead turn to our pious brothers in the Mufti, who are wise and know of the plight of the working man, in leading this movement."
 AFG_traditionalist_resistance: "Traditionalist Resistance"
 AFG_traditionalist_resistance_desc: "The institution of a socialist government has not gone well with many of Afghanistan's religious and tribal leaders, who have spent years condemning previous governments for perceived socialist policies. Non-cooperation with the government is now widespread throughout rural areas and certain cities, although with little enthusiasm for further violence yet."

 AFG_the_arg_scheme: "The Arg Scheme"
 AFG_the_arg_scheme_desc: "Afghanistan is in dire need of defence against her enemies. While the mountains are a travesty to invade, we must turn our economy towards making our borders impregnable beyond comprehension by building fortifications and defensive structures."

 AFG_pacifying_the_frontier_idea: "Pacifying the Frontier"
 AFG_pacifying_the_frontier_idea_desc: "Following the civil war the Afghan government has moved to take full control of the Frontier region, using its military to accomplish this goal."

 AFG_integrating_the_frontier_idea: "Integrating the Frontier"
 AFG_integrating_the_frontier_idea_desc: "Following the civil war the Afghan government has moved to take full control of the Frontier region, through fully integrating it politically with the heartlands."

 AFG_fallout_of_the_mangal_rebellion_idea: "Fallout of the Mangal Rebellion"
 AFG_fallout_of_the_mangal_rebellion_idea_desc: "In an attempt at a full-scale Second Khost Rebellion, the Mangal Tribe has taken advantage of the situation in Pashtunistan to fight against our troops from behind! While most of them were dispersed, the entire territory must be put on military lockdown to prevent another uprising, overstretching our forces in the Loya Paktia region."

 AFG_conscription_exemptions_granted: "Conscription Exemptions Granted"
 AFG_conscription_exemptions_granted_desc: "[AFG.GetNameDefCap]'s seizure of the region of [443.Getname] was primarily motivated by desire for coastal access, with little regard for those living there. In response to protests by the local inhabitants, the [AFG.GetAdjective] state has chosen to exempt the region from conscription, reflecting the government's priorities for the area."

 AFG_remove_pashtunistan_reformist_modifier_decision: "[AFG_remove_pashtunistan_reformist_decision_text]"
 AFG_remove_pashtunistan_traditionalist_modifier_decision: "[AFG_remove_pashtunistan_traditionalist_decision_text]"
 AFG_remove_pashtunistan_reformist_modifier_decision_desc: "[AFG_remove_pashtunistan_reformist_decision_desc_text]"
 AFG_remove_pashtunistan_traditionalist_modifier_decision_desc: "[AFG_remove_pashtunistan_traditionalist_decision_desc_text]"

 AFG_remove_pashtunistan_reformist_decision_military: "Reassert Authority Over the Frontier"
 AFG_remove_pashtunistan_reformist_decision_democratic: "Integrate the Frontier's Administration"
 AFG_remove_pashtunistan_traditionalist_decision_telai: "Oust Amanite Loyalists in the Frontier"
 AFG_remove_pashtunistan_traditionalist_decision_seraj: "Begin Rolling Back Frontier Privileges"

 AFG_remove_pashtunistan_reformist_decision_military_desc: "The Frontier's government has for too long taken advantage of the central government's weakness, and with no enemies left standing, it is time to send in the troops and bring it back under heel."
 AFG_remove_pashtunistan_reformist_decision_democratic_desc: "While Pashtunistan's autonomy has been acceptable for the time being, now that the central government has reasserted itself and begun a process of gradual democratising it would be prudent to slowly begin integrating the Frontier into that process, eliminating the need for continued autonomy."
 AFG_remove_pashtunistan_traditionalist_decision_telai_desc: "The agreements Amanullah struck up with the tribes of the Frontier has been nothing but a pain, with local leaders still plotting against us at every opportunity. Troops should be deployed as soon as possible to oust those still loyal to the kafir king."
 AFG_remove_pashtunistan_traditionalist_decision_seraj_desc: "With the nation secure and ready to move beyond the stagnation of yesteryear, it would be prudent to begin reasserting direct authority over the Frontier, and roll back the privileges their leaders have been granted; for they have fully served their purpose."

