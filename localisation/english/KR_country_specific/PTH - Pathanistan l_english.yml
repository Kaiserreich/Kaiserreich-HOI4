### Characters ###

 PTH_abdur_rahim_popalzai: "Abdur Rahim Popalzai"
 PTH_abdur_rahim_popalzai_desc_body: "Perhaps one of the most quixotic figures across the international Socialist community, Popalzai may be the best man suited to bring Socialism to the mountain ranges of the Pashtun people. Born to an imam, Popalzai became a fervent anti-imperialist during the British Raj over the North-West Frontier Province, issuing several fatwas in support of peasant agitation against British colonialism.\n\nHe would later give fatwas in support of his fellow Indian socialists in Calcutta during the Indian Civil War, advocacy that nearly got him arrested until Afghanistan's intervention and occupation of the NWFP, which would soon be known as the region of \"Pashtunistan\". Despite his Marxist beliefs, Popalzai was a strong supporter of Amanullah's reformist agenda, and would become one of the biggest organisers of support in Pashtunistan for the King in the 20s.\n\nCome the 30s he would refocus his agenda, agitating against the Princely States of Pashtunistan. During this time he issued many fatwas in support of miners in Swat and called for them to organise against the miserable conditions they faced under the mine bosses. Upon the death of his father, he would inherit his position as Imam of the Qasim Ali Khan Mosque in Peshawar, even amid strong conservative opposition. Despite ruffling feathers over his continued dual association with leftist politics and his duty as an Imam, Popalzai founded the Frontier Socialist Party, published a newspaper called Naujawan Sarfarosh, and became perhaps the most powerful socialist not only in Pashtunistan, but the entirety of Afghanistan, too. \n\nA man firm in his belief that Islam's teachings were predisposed to the political activities of socialist emancipation, his take on socialism is firmly rooted in Islam. Condemning the imperialist weaponisation of Islam, Popalzai serves no King, but only the teachings of Allah and his mission to end the colonisation of the Muslim people."
 PTH_abdur_rahim_popalzai_leader_desc: "§YBorn:§! §L1890, in Peshawar, Province of the Punjab, British India§!\n§YBackground:§! §L$PTH_abdur_rahim_popalzai_desc_body$§!"
 PTH_abdur_rahim_popalzai_army_chief_desc: "§YBorn:§! §L1890, in Peshawar, Province of the Punjab, British India§!\n§YAllegiance:§! §SPashtunistan§!\n§YBackground:§! §L$PTH_abdur_rahim_popalzai_desc_body$§!"
 PTH_abdul_ghaffar_khan: "Abdul Ghaffar Khan"
 PTH_abdul_ghaffar_khan_leader_desc: "§YBorn:§! §LFebruary 6th, 1890, in Ultmazai, Province of the Punjab, British India§!\n§YBackground:§! §LAlso known as \"Bacha Khan\", the King of Khans, Ghaffar Khan's renown is felt not only in the surrounding area of Peshawar, but also in Afghanistan and even the Indian subcontinent too. Born to a family of Muslim aristocrats, he was educated by British missionaries and offered a well-to-do military position in his final year of high school, but refused it out of principle as he did not want anything to do with serving the British Raj. Like Mohandas Gandhi, a later close ally of Bacha Khan, he soon came to hold the belief that only through non-violence would freedom be achieved. During this period, he put his all toward the opening of schools for impoverished and illiterate Pashtun children, founding the Anjuman-e-Islah-e Afghania to further coordinate this activism.\n\nLike many others, his life would soon be dramatically reshaped by the Indian Civil War. Condemning the violence and fraternal bloodshed, and still holding to his non-violent path to freedom, Ghaffar Khan nonetheless witnessed the Afghan Army march into Peshawar and subsequently annex the entire Frontier from the British. As it became clear that Afghanistan would struggle to rule what would become \"Pashtunistan\" on its own, Ghaffar Khan sprung into action as one of the region's most influential politicians, building up an effective local government alongside his brother Abdul Jabbar Khan. His leadership of Peshawar and de facto most of Pashtunistan as a result made him the region's most important powerbroker.\n\nRather than the rosy times many hoped freedom from Britain would bring, the past few years have been nothing but chaos, and Ghaffar Khan is now the leader of a nation in desperate need of peace and harmony. Committed to the principles of democracy and the upliftment of the Pashtun peasantry, his ardent pacifism signals a future most serene for those within the borders he commands.§!"
 PTH_aurangzeb_khan_gandapur: "Aurangzeb Khan Gandapur"
 PTH_aurangzeb_khan_gandapur_leader_desc: "§YBorn:§! §L1899, in Kulachi, Province of the Punjab, British India§!\n§YBackground:§! §LDeeply influenced by the education advocate and politician Sir Abdul Qayyam Khan Lodi, Aurangzeb pulled himself through his schooling and into the Aligarh Muslim University, where he would graduate with a law degree and return to Peshawar. His practice in the courts would be interrupted very shortly after it began, following the takeover of the Afghan Army during the Indian Civil War. Estranged from politics for some time, he would later join Lodi's United Muslims Nationalist Party as an alternative to Ghaffar Khan's Society for the Reformation of the Afghans. After Lodi's retirement and passing, Aurangzeb was regarded as his natural successor, and has led the party ever since.\n\nNow the leader of an independent Pathanistan, Aurangzeb must overcome the entrenched progressive forces that dominated the democratic systems in Peshawar and carve out a path forward for himself, his party, and his country. Already, the merchant class has begun to warm up to him and his inroads with the tribes and Princely States have borne promising fruit for the upstart politician.§!"
 PTH_aurangzeb_khan_gandapur_sic_desc: "§YBorn:§! §L1899, in Kulachi, Province of the Punjab, British India§!\n§YBackground:§! §LDeeply influenced by the education advocate and politician Sir Abdul Qayyam Khan Lodi, Aurangzeb pulled himself through his schooling and into the Aligarh Muslim University, where he would graduate with a law degree and return to Peshawar. His practice in the courts would be interrupted very shortly after it began, following the takeover of the Afghan Army during the Indian Civil War. Estranged from politics for some time, he would later join Lodi's United Muslims Nationalist Party as an alternative to Ghaffar Khan's Society for the Reformation of the Afghans. After Lodi's retirement, Aurangzeb was regarded as his natural successor, and has led the party ever since.§!"
 PTH_mirzali_khan_wazir: "Mirzali Khan Wazir"
 PTH_mirzali_khan_wazir_desc_body: "Known most commonly as the \"Faqir of Ipi\", Mirzali Khan Wazir's life has been defined by his devotion not only to the Prophet, but also to his home of Waziristan. Belonging to a subtribe of the Utmanzai Wazir known as the Madikhel Torikhel, he was raised by a deeply pious family and subsequently spent his childhood researching the Quran, later becoming an Imam in his hometown.\n\nDuring the invasion by the Afghan Army during the Indian Civil War, Mirzali led a band of warriors against the local British Indian garrisons and was instrumental in ensuring the seamlessness of Amanullah's eviction of the British. His efforts and subsequent stalwart support earned him the praise of the Afghan King, becoming Amanullah's aloof and independent (but still loyal) chief military representative in Pashtunistan."
 PTH_mirzali_khan_wazir_leader_desc: "§YBorn:§! §L1897, in Kirta Khajuri, Province of the Punjab, British India§!\n§YBackground:§! §L$PTH_mirzali_khan_wazir_desc_body$\n\nBut fate is a funny thing. Mirzali's ambitious and effective scramble for power greatly influenced his benefactor's decision to plant him as the leader of an independent Pathanistan. Pious, rebellious, conservative and crafty, Pathanistan's future under the Faqir of Ipi is going to be highly reactionary and very militaristic.§!"
 PTH_mirzali_khan_wazir_high_command_desc: "§YBorn:§! §L1897, in Kirta Khajuri, Province of the Punjab, British India§!\n§YAllegiance:§! §fAmanite§!\n§YBackground:§! §L$PTH_mirzali_khan_wazir_desc_body$§!"

