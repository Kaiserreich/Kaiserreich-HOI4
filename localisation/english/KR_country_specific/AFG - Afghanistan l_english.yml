l_english:

 afghanistan_focus: "Afghanistan Focus Tree"

### Parties ###
 AFG_totalist_party: "TIP"
 AFG_totalist_party_long: "Turkestan Ishchilar Partiyasi (Turkestan Workers' Party)\n§LRepresenting little more than the remnants left by the Bolshevik years north of the border, the Workers' Party (known both by appellations of Bukharan or Turkestan depending on audience) has no actual presence within Afghanistan. What little influence they have can mostly be traced to those who remain sympathetic to the defeated Bolshevik cause in the north, and those impressed by the odd tale of Pashtun communist Nisar Muhammad Yousafzai who has continued to fight for socialism years after the defeat of the Reds.§!"

 AFG_syndicalist_party: "FSP"
 AFG_syndicalist_party_long: "Frontier Socialist Party\n§LStarting as an offshoot of Bhagat Singh's Punjabi revolutionaries, the Frontier Socialist Party has continued to operate years on from both the Indian revolution and the Frontier's separation from India. Under the leadership of Abdur Rahim Popalzai, the so-called \"Marxist Maulana\", the FSP have managed to experience major growth in the intervening years. Popalzai's personal brand of Islamic socialism has especially proven very popular amongst Peshawar's poor, especially amongst lowly men like street sweepers.\n\nDespite the revolutionary nature of the party, there is little active push by it towards revolution in Afghanistan, with the FSP preferring to support the moderate Anjuman-e-Islah-e Afghania, owing to the overlap in party membership between the two and advice from Indian allies. It still however maintains a large paramilitary group, comprised of both local Pashtuns and Indian exiles. This militia is claimed to be for the Frontier's defence against all outside threats, even perhaps the Afghan government itself if it comes to it.§!"

 AFG_radical_socialist_party: "$AFG_syndicalist_party$"
 AFG_radical_socialist_party_long: "$AFG_syndicalist_party_long$"

 AFG_social_democrat_party: "AIA"
 AFG_social_democrat_party_long: "Anjuman-e-Islah-e Afghania (Society for the Reformation of the Afghans)$AFG_social_democrat_party_aia_description$"
 AFG_social_democrat_party_aia_description: "§L\nThe Anjuman-e-Islah-e Afghania, or Society for the Reformation of the Afghans, are the largest political organisation in the Afghan Frontier. Founded by Abdul Ghaffar Khan in 1921, when the region was still Indian, the party rose to prominence following the Fourth Anglo-Afghan War. The inability of the central government to properly manage the Frontier saw Ghaffar Khan step in to fill the void, and eventually a regional government was formed by Khan and his brother Abdul Jabbar Khan.\n\nSince this government's formation, the AIA has been transformed into a proper political party, attracting support from all elements of society. As suggested by the name, the AIA's focus has long been on reforming Afghan society. They believe that the Pashtun people must develop a true national identity, and do so through the abandonment of backwards practices of cultural violence, mass extravagance, and forms of gender discrimination.§!"

 AFG_social_liberal_party: "Bārakzai-Seraj (Reform)"
 AFG_social_liberal_party_long: "Bārakzai-Seraj (Reform)\n§LEver since the rise of Dost Mohammad Khan Barakzai in 1826, his eponymous dynasty have ruled Afghanistan, with the Seraj branch being his direct descendants. Supporters of the monarch and his dynasty find themselves split into many different factions, with the Reform faction representing those who push for modernisation, westernisation, and democratisation.\n\nIn contrast to the Amanite faction, these reformers are not unwavering loyalists of the King, and are primarily focused on attempting to implement genuine reforms, even if opposed by the monarch. Prominent members of this faction include Abdul Hai Habibi and Abdul Hadi Dawi; and prominent royals such as Princess Sahira Begum.§!"
 AFG_telai_social_liberal_party: "Bārakzai-Telai (Radicals)"
 AFG_telai_social_liberal_party_long: "Bārakzai-Telai (Radicals)\n§LUnlike their Seraj relatives who consider Dost Mohammad Khan Barakzai, the Telai cadet branch of the Barakzai dynasty primarily trace their roots to his brother Sultan Mohammad Telai Barakzai. Commonly known also as the Musahiban, Nadir's seizure of the throne has at last presented the Telai the opportunity to rule in their own right.\n\nThe so-called radical faction of the dynasty find themselves much more marginalised compared to the dominance reformers held during Amanullah's rule, yet they are still not completely absent from politics. Quite a few reformers in this faction still hold loyalty to the former King, but many have continued to push for liberalisation agnostic on the monarchy dispute, hoping to see reforms regardless of who sits on the throne.§!"
 AFG_amanullah_social_liberal_party: "FET (Democratic)"
 AFG_amanullah_social_liberal_party_tt: "Ferqa-i-Esteqlal wa Tajaddod (Party of Independence and Reform - Democratic)"
 AFG_amanullah_social_liberal_party_long: "$AFG_amanullah_social_liberal_party_tt$\n§LThe Party of Independence and Reform, sometimes also known as the Party of Modernity, is the primary political party in the Afghan state, led by the King himself. The party's politics are decided top-down by Amanullah, representing the culmination of his modernisation and reform efforts, although now legitimised through a Western-inspired parliament rather than traditional Jirgas.\n\nIn contrast to the Amanite faction, these reformers are not unwavering loyalists of the King, and are primarily focused on attempting to implement genuine reforms, even if opposed by the monarch. Prominent members of this faction include Abdul Hai Habibi and Abdul Hadi Dawi; and prominent royals such as Princess Sahira Begum.§!"
 AFG_inayatullah_social_liberal_party: "Hezb-e Demokratik"
 AFG_inayatullah_social_liberal_party_tt: "Hezb-e Demokratik Poshton (Pashtun Democratic Party)"
 AFG_inayatullah_social_liberal_party_long: "$AFG_inayatullah_social_liberal_party_tt$\n§LThe Pashtun Democratic Party is one of the two major political parties that emerged in the wake of the civil war and the introduction of constitutionalism. The party draws significantly on the tradition of reforms during the golden decade, and primarily represents liberal intellectuals and the urban middle classes. Due to the party's formation tracing itself to the tail end of Amanullah's reign, where many of the late King's former allies were purged, the party's leadership is mainly those who were either too young or too irrelevant to suffer the same fate; an issue many of the older reformers take umbrage with as they reintegrate into Afghan politics.§!"

 AFG_market_liberal_party: "Sodāgaro Ittihadie"
 AFG_market_liberal_party_long: "Sodāgaro Ittihadie (Merchant's Union)\n§LRather than an exact political organisation, the merchant's union represents Afghanistan's many business interests, both nationally and internationally. In Afghanistan itself this includes men such as Sher Khan Nashir, head of the Northern Company, and Abdul Majid Zabuli, head of the National Bank. Many international companies also find themselves doing business in Afghanistan, notably Siemens-Halske and Krupp, and the vital role both of these groups play in the Afghan economy has given them significant political sway over national governance.§!"

 AFG_social_conservative_party: "Ulema"
 AFG_social_conservative_party_long: "Ulema\n§LIn most Muslim nations the ulema hold significant sway on both a cultural and political level, even in the countries where they are not directly involved in the administration. In Afghanistan itself, even after years of secularisation under Amanullah Khan, few can deny the sway and power that members of the religious establishment hold.\n\nThe Afghan ulema as a whole are in general opposed to the wave of reformism that has swept the country since the 20s, seeing it as both an attack on their power and an affront to Islam, and so it finds allies in traditionally minded men willing to act upon their behalf. Although lacking an official leader, many regard Fazl Omar Mojadidi as the de facto head of religion in Afghanistan, with his family having a stranglehold on religious politics in most of the country.§!"
 AFG_inayatullah_social_conservative_party: "$AFG_republic_social_conservative_party$"
 AFG_inayatullah_social_conservative_party_tt: "$AFG_republic_social_conservative_party_tt$"
 AFG_inayatullah_social_conservative_party_long: "$AFG_republic_social_conservative_party_long$\n§LThe Islamic Party is one of the two major political parties that emerged in the wake of the civil war and the introduction of constitutionalism. Although reformist in nature, the party is defined by its position of restraint, believing that the reformist movement's excesses were the fundamental cause of the civil war, and that Afghan society is simply not ready for radical positions such as the unveiling of women or enforcement of western clothing. Although most of their support remains urban, finding solidarity with other disillusioned reformists, their opposition to these ideas have gained them significant support amongst rural traditionalists as well.§!"

 AFG_authoritarian_democrat_party: "Bārakzai-Seraj (Amanite)"
 AFG_authoritarian_democrat_party_long: "Bārakzai-Seraj (Amanite)\n§LEver since the rise of Dost Mohammad Khan Barakzai in 1826, his eponymous dynasty have ruled Afghanistan, with the Seraj branch being his direct descendants. Supporters of the monarch and his dynasty find themselves split into many different factions, with the Amanite faction representing Amanullah Khan's loyalist reformers.\n\nAlthough both it and the Reform faction strive to see the modernisation of Afghanistan, the Amanites are those who strive to see so as it is the King's will. Among the most prominent members of this faction are the Charkhi brothers, multiple members of the Tarzi family, and minister Abdul Ahad Wardak.§!"
 AFG_telai_authoritarian_democrat_party: "Bārakzai-Telai (Reform)"
 AFG_telai_authoritarian_democrat_party_long: "Bārakzai-Telai (Reform)\n§LUnlike their Seraj relatives who consider Dost Mohammad Khan Barakzai, the Telai cadet branch of the Barakzai dynasty primarily trace their roots to his brother Sultan Mohammad Telai Barakzai. Commonly known also as the Musahiban, Nadir's seizure of the throne has at last presented the Telai the opportunity to rule in their own right.\n\nIn contrast to other reformers in the radical faction, the reform faction of the dynasty is primarily linked with the Azadist clique and other pro-Telai loyalists who put the dynasty first, reform second. Although many genuinely want to see Afghanistan continue down a path of reform, most are willing to put their desires on hold if needed for the sake of national stability.§!"
 AFG_inayatullah_authoritarian_democrat_party: "Bārakzai-Seraj (Constitutionalist)"
 AFG_inayatullah_authoritarian_democrat_party_long: "Bārakzai-Seraj (Constitutionalist)\n§LEver since the rise of Dost Mohammad Khan Barakzai in 1826, his eponymous dynasty have ruled Afghanistan, with the Seraj branch being his direct descendants. Supporters of the monarch and his dynasty find themselves split into many different factions, with the Amanite faction representing Amanullah Khan's loyalist reformers.\n\nThe constitutionalist faction represents those around Inayatullah Khan who believe that the time of enlightened despots is at an end, and that power should be fully transferred from the monarch to a civilian government.§!"
 AFG_amanullah_authoritarian_democrat_party: "FET (Amanite)"
 AFG_amanullah_authoritarian_democrat_party_tt: "Ferqa-i-Esteqlal wa Tajaddod (Party of Independence and Reform - Amanite)"
 AFG_amanullah_authoritarian_democrat_party_long: "$AFG_amanullah_authoritarian_democrat_party_tt$\n§LThe Party of Independence and Reform, sometimes also known as the Party of Modernity, is the primary political party in the Afghan state, led by the King himself. The party's politics are decided top-down by Amanullah, representing the culmination of his modernisation and reform efforts, although now legitimised through a Western-inspired parliament rather than traditional Jirgas.\n\nAlthough both it and the Reform faction strive to see the modernisation of Afghanistan, the Amanites are those who strive to see so as it is the King's will. Among the most prominent members of this faction are the Charkhi brothers, multiple members of the Tarzi family, and the now retired minister Abdul Ahad Wardak.§!"

 AFG_paternal_autocrat_party: "Bārakzai-Seraj (Palace)"
 AFG_paternal_autocrat_party_long: "Bārakzai-Seraj (Palace)\n§LEver since the rise of Dost Mohammad Khan Barakzai in 1826, his eponymous dynasty have ruled Afghanistan, with the Seraj branch being Barakzai's direct descendants. Supporters of the monarch and his dynasty find themselves split into many different factions, with the palace faction primarily representing the monarch's direct power base. This includes members of the royal family, his closest ministers, and the armed forces used to ensure his will is carried out.§!"
 AFG_telai_paternal_autocrat_party: "Bārakzai-Telai (Palace)"
 AFG_telai_paternal_autocrat_party_long: "Bārakzai-Telai (Palace)\n§LUnlike their Seraj relatives who consider Dost Mohammad Khan Barakzai, the Telai cadet branch of the Barakzai dynasty primarily trace their roots to his brother Sultan Mohammad Telai Barakzai. Commonly known also as the Musahiban, Nadir's seizure of the throne has at last presented the Telai the opportunity to rule in their own right.\n\nThe palace faction of the Telai represent the dynasty's primary power base, preferring to rule from above with the consent of the elites as many rulers have done before them. Although the king is the ultimate authority, the other members of the royal family hold significant weight in ensuring order continues to hold.§!"

 AFG_national_populist_party: "Saqqawists"
 AFG_national_populist_party_long: "Saqqawists\n§LIn 1929 Afghanistan was rocked by largescale revolt against Amanullah Khan's reforms, with a primarily Tajik army descended upon the capital under Habibullah Kalakani's leadership. His Saqqawists, taking their name from his Bacha-yi Saqaw epithet, came incredibly close to ousting the King, yet fell apart after a counterattack brought about his death. Those still loyal to the cause fled across the border into Central Asia, now following Kalakani's uncle Purdil Khan.\n\nDespite their failure, the Saqqawists have still lingered, owing to continued unrest towards Amanullah's reforms and Central Asian instability following the Russian withdrawal. Styling himself as Emir of Afghanistan, Purdil Khan clearly still maintains desires for the Afghan throne, and perhaps one day he will get the opportunity to succeed where Kalakani failed.§!"
 AFG_telai_national_populist_party: "Bārakzai-Telai (Reactionary)"
 AFG_telai_national_populist_party_long: "Bārakzai-Telai (Reactionary)\n§LUnlike their Seraj relatives who consider Dost Mohammad Khan Barakzai, the Telai cadet branch of the Barakzai dynasty primarily trace their roots to his brother Sultan Mohammad Telai Barakzai. Commonly known also as the Musahiban, Nadir's seizure of the throne has at last presented the Telai the opportunity to rule in their own right.\n\nThe reactionary faction of the dynasty represents the support from below, especially amongst the anti-modernisation reactionaries who have seen Amanullah's downfall in favour of the Musahiban as a triumph for their cause. The Telai themselves however hold little regard for these men, seeing them as rabble to be ruled over, rather than letting them control policy.§!"
 AFG_seraj_national_populist_party: "Bārakzai-Seraj (Reactionary)"
 AFG_seraj_national_populist_party_long: "Bārakzai-Seraj (Reactionary)"

 AFG_inayatullah_national_populist_party: "Mellat Gund"
 AFG_inayatullah_national_populist_party_tt: "Afghan-e Tevalnupal-e Valsuakaiz-e Gund (Afghan Social Democratic Party)"
 AFG_inayatullah_national_populist_party_long: "$AFG_inayatullah_national_populist_party_tt$\n§LThe Afghan Social Democratic Party, commonly known as simply the Nation Party, is a fringe group made up of former civilian supporters of the so-called Azadist Clique. Like their predecessor, the Nation Party's core beliefs are modernisation and Pashtun nationalism, although with a strong undercurrent of leftist rhetoric injected into their policies. Although a niche group, they are said to be courting support from Abdul Majid Zabuli, albeit so far unsuccessfully.§!"

 AFG_republic_AIA_totalist_party: "AIA (Revolutionary)"
 AFG_republic_AIA_totalist_party_tt: "Anjuman-e-Islah-e Afghania (Society for the Reformation of the Afghans - Revolutionary)"
 AFG_republic_AIA_totalist_party_long: "$AFG_republic_AIA_totalist_party_tt$\n§LThe Anjuman-e-Islah-e Afghania, or Society for the Reformation of the Afghans, are the largest political organisation in the Afghan Frontier. Founded by Abdul Ghaffar Khan in 1921, when the region was still Indian, the party rose to prominence following the Fourth Anglo-Afghan War. The inability of the central government to properly manage the Frontier saw Ghaffar Khan step in to fill the void, and eventually a regional government was formed by Khan and his brother Abdul Jabbar Khan.\n\nThe establishment of a socialist government in Afghanistan has however seen dramatic change within the party, with the Khan brothers forced out of leadership in favour of Mian Akbar Shah. In contrast to his predecessors, Shah sees little merit in non-violence, having actively involved himself in violent revolutionary activity even when working under Ghaffar Khan. Likewise he has shifted the party away from many of its older democratic focused beliefs towards authoritarian forms of socialism, taking inspiration from India's Subhas Chandra Bose, a man he is closely linked to.§!"

 AFG_republic_syndicalist_party: "Hezb-e Watan"
 AFG_republic_syndicalist_party_tt: "Hezb-e Watan (Party of the Fatherland)"
 AFG_republic_syndicalist_party_long: "Hezb-e Watan (Party of the Fatherland)\n§LFollowing the Frontier Socialist Party's seizure of power, the party was reorganised into a new all-Afghan entity, in an attempt to further legitimise itself in the eyes of the people. The patriotic name of Party of the Fatherland was chosen to appeal to the nationalist-minded, and moderate reformer Ghulam Mohammad Ghobar was invited to be a figurehead president, although with real power remaining in the hands of Chairman Popalzai.\n\nLittle of the party's ideology has changed compared to its prior incarnation, with its primary guiding belief being that of Popalzai's brand of Islamic Socialism. Although willing to achieve its goals at a slow pace, recognising their precarious position, it is not willing to entirely abandon them, putting it at odds with traditionalist elements who have spent over a decade fearmongering about syndicalism.§!"

 AFG_republic_radical_socialist_party: "$AFG_republic_syndicalist_party$"
 AFG_republic_radical_socialist_party_long: "$AFG_republic_syndicalist_party_long$"

 AFG_republic_social_democrat_party: "AIA (L)"
 AFG_republic_social_democrat_party_long: "Anjuman-e-Islah-e Afghania (Society for the Reformation of the Afghans - Left)$AFG_social_democrat_party_aia_description$"

 AFG_republic_social_liberal_party: "AIA (R)"
 AFG_republic_social_liberal_party_long: "Anjuman-e-Islah-e Afghania (Society for the Reformation of the Afghans - Right)$AFG_social_democrat_party_aia_description$"

 AFG_republic_market_liberal_party: "Naujawanan Baidar"
 AFG_republic_market_liberal_party_tt: "Tehrik-i-Naujawanan Baidar (Movement of Enlightened Youth)"
 AFG_republic_market_liberal_party_long: "$AFG_republic_market_liberal_party_tt$\n§LThe Movement of Enlightened Youth is one of the major political parties that emerged following the formation of the republic. In contrast to reformers of yesteryear, many of whom found themselves marginalised during the brief reign of Nadir, the Enlightened Youth as their name suggests is primarily a newer generation of politicians. Many graduates of Edwardes, Islamia, and institutions abroad have banded together under the party's umbrella, with a wide diversity of political opinions held across its membership.\n\nThe party's main ideology comes however from its leader, Abdul Hai Habibi, who supports a liberal agenda but heavily intermixed with Pashtun nationalism, rather than more pluralistic forms of liberalism found elsewhere in the republic's politics.§!"

 AFG_republic_social_conservative_party: "Hezb-e Islami"
 AFG_republic_social_conservative_party_tt: "Hezb-e Islami Afghanistan (Islamic Party of Afghanistan)"
 AFG_republic_social_conservative_party_long: "$AFG_republic_social_conservative_party_tt$\n§LThe Islamic Party is one of the major political parties that emerged following the formation of the republic. Although reformist in nature, the party is defined by its position of restraint, believing that the reformist movement's excesses were the fundamental cause of the civil war, and that Afghan society is simply not ready for radical positions such as the unveiling of women or enforcement of western clothing. Although most of their support remains urban, finding solidarity with other disillusioned reformists, their opposition to these ideas have gained them significant support amongst rural traditionalists as well.§!"

 AFG_republic_authoritarian_democrat_party: "Hezb-e Khalq (Reformist)"
 AFG_republic_authoritarian_democrat_party_tt: "Hezb-e Khalq-e Afghanistan (People's Party of Afghanistan - Reformist)"
 AFG_republic_authoritarian_democrat_party_body: "\nFollowing Mohammad Gul Khan Momand's coup, the informal Azadist clique was reorganised into a more legitimate entity, that being the People's Party of Afghanistan. Although the party's core vision remains those ideals promoted by the Azadist clique, that being extreme Pashtun nationalism, modernisation, and opposition to liberal democracy; factionalism has already emerged with the party."
 AFG_republic_authoritarian_democrat_party_long: "$AFG_republic_authoritarian_democrat_party_tt$§L$AFG_republic_authoritarian_democrat_party_body$\n\nThe Reformist wing of the party is primarily composed of the more moderate members of the party, acting as a counterbalance to loyalists of both Momand and Daoud. Those ranging from liberal nationalists like Sayed Qassem Reshita all the way to former Amanites like Abdul Tawab Khan Tarzi find themselves associated with this group in one way or another, hoping to see progress for the nation rather than a slide into backwards despotism.§!"
 AFG_republic_army_authoritarian_democrat_party: "Afghan Army"
 AFG_republic_army_authoritarian_democrat_party_long: "Afghan Republican Army" #Don't see much point in giving this a description, they're either temporary or ousted.

 AFG_republic_paternal_autocrat_party: "Hezb-e Khalq (Loyalist)"
 AFG_republic_paternal_autocrat_party_tt: "Hezb-e Khalq-e Afghanistan (People's Party of Afghanistan - Loyalist)"
 AFG_republic_paternal_autocrat_party_long: "$AFG_republic_paternal_autocrat_party_tt$§L$AFG_republic_authoritarian_democrat_party_body$\n\nThe party's Loyalist faction are those in Daoud Khan's circle, at times referred to as the National Club. Throughout the years Daoud has built up a base of supporters from across the nation, including prominent men like Abdul Majid Zabuli and Faiz Mohammad Khan Zikeria, and those within the Loyalists hope to see themselves leading the nation in some form or another.§!"
 AFG_republic_army_paternal_autocrat_party: "Afghan Army"
 AFG_republic_army_paternal_autocrat_party_long: "Afghan Republican Army"

 AFG_republic_national_populist_party: "Hezb-e Khalq (Azadist)"
 AFG_republic_national_populist_party_tt: "Hezb-e Khalq-e Afghanistan (People's Party of Afghanistan - Azadist)"
 AFG_republic_national_populist_party_long: "$AFG_republic_national_populist_party_tt$§L$AFG_republic_authoritarian_democrat_party_body$\n\nThose within the People's Party who are most firmly committed to the party's ideology find themselves still commonly referred to as the Azadists. Much of Momand's direct support base comes from these men, who see Momand as the only leader who can finally realise their nationalist ambitions.§!"
 AFG_republic_army_national_populist_party: "Afghan Army"
 AFG_republic_army_national_populist_party_long: "Afghan Republican Army"

