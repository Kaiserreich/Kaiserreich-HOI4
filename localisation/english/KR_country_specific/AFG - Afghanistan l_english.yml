### Focuses ###

 AFG_quest_for_a_national_economy: "Quest for a National Economy"
 AFG_quest_for_a_national_economy_desc: "To say that our economy is underdeveloped would be an understatement. Many of our people are still little more than subsistence farmers and herders. If Afghanistan is to share in the prosperity of the twentieth century, we must develop ourselves from the roots up. We must begin nationwide projects that modernise Afghan living standards, and better prepare us for relations beyond our borders."
 AFG_complete_the_kabul_peshawar_railroad: "Complete the [267.Controller.GetVictoryPointName_10737]-[442.Controller.GetVictoryPointName_12717] Railroad"
 AFG_complete_the_kabul_peshawar_railroad_desc: "Since our acquisition of Pashtunistan, connecting the city of [267.Controller.GetVictoryPointName_10737] to the wayward frontier has been a top priority for the government. Completing the railroad between [267.Controller.GetVictoryPointName_10737] and [442.Controller.GetVictoryPointName_12717] would help modernise infrastructure, improve the economy and strengthen our hold on Pashtunistan via a direct connection for trade and mobilisation."
 AFG_towards_a_trans_afghan_railway: "Towards a Trans-Afghan Railway"
 AFG_towards_a_trans_afghan_railway_desc: "The many tribes and villages that make up Afghanistan are isolated and far too self sufficient for a centralised nation. Building a centrally-planned network of railroads across the country would erode the autonomy of these areas, fostering new, denser communities to grow and intermingle, while being easier to govern."
 AFG_diversify_transport_infrastructure: "Diversify Transport Infrastructure"
 AFG_diversify_transport_infrastructure_desc: "The people of Afghanistan have long been interconnected without the necessity of artificial logistics. Through expanding our utilisation of the nation's rivers, alongside an improvement to the roads that span between them, we could easily connect much of the nation together without costly and timely investments into further rail expansion."
 AFG_taming_the_winter_capital: "Taming the Winter Capital"
 AFG_taming_the_winter_capital_desc: "The city of [267.Controller.GetVictoryPointName_10737] is perched high atop our mountainous expanse, meaning the winters there are cold and unsuitable for our government. Luckily, the acquisition of [442.Controller.GetVictoryPointName_12717] means we can use the city as an alternative capital, thanks to its more temperate climate. This would also give us even more control over the province, putting any insurgents directly beneath our gaze."
 AFG_crowning_the_kings_city: "Crowning the King's City"
 AFG_crowning_the_kings_city_desc: "After years of effort, and many setbacks, the capital stands proud as the nation's greatest city. What started as simply an attachment of [267.Controller.GetVictoryPointName_10737] is now one final push away from being a self sufficient masterpiece, guided by the great vision of King Amanullah. It is time now to give it that push."
 AFG_rejection_of_rural_neglect: "Rejection of Rural Neglect"
 AFG_rejection_of_rural_neglect_desc: "Out of fear of the backlash from local tribes, the Kingdom of Afghanistan has left much of the country to govern itself. As a result, many communities are stricken with poverty, backwardness, and lack basic resources. We must reverse this policy of neglecting our countryside, and begin implementing programmes to centrally modernise our rural regions, and bring much-needed prosperity to our people."
 AFG_develop_the_herat_crossing: "Develop the [415.Controller.GetVictoryPointName_4893] Crossing"
 AFG_develop_the_herat_crossing_desc: "The city of [415.Controller.GetVictoryPointName_4893] sits on the western end of Afghanistan, acting as a gateway between Persia and Central Asia to India. Capitalising on Herat's location through expanding its size and infrastructure would undoubtely mean prosperity for the rest of Afghanistan, and open the door for both diplomatic and economic opportunies with Persia."
 AFG_turkestan_infrastructure_projects: "Turkestan Infrastructure Projects"
 AFG_turkestan_infrastructure_projects_desc: "The North of Afghanistan is home to many of the peoples our Turkic neighbours call brothers. Unfortunately for us, their isolation and cultural differences have resulted in many joining efforts to overthrow our government. Building roads and pathways that connect these communities to the rest of the country will help improve their lives, and help us mobilise against those who remain ungrateful."
 AFG_inviting_additional_architects: "Inviting Additional Architects"
 AFG_inviting_additional_architects_desc: "[267.Controller.GetVictoryPointName_12769]'s construction has taken many years, but it has put us in contact with some of the best architects we could find. While we continue work on our capital city, we should invite more engineers and architects to help us modernise the rest of the nation. These projects will help endow our people with a sense of national pride and declare to the world that Afghanistan is a major power."
 AFG_harness_the_chak: "Harness the Chak"
 AFG_harness_the_chak_desc: "In the mountainous province of Wardak lies the village of Chak, which sits at the convergence of the [267.Controller.GetVictoryPointName_10737] and Lorgar Rivers. The Lorgar River can at times be unpredictable and out of control, making Chak the perfect place for a regulatory hydroelectric dam, thanks to its proximity to [267.Controller.GetVictoryPointName_10737]. Building this dam would provide our largest city with a significant source of electricity."
 AFG_swat_hydroelectric_developments: "Swat Hydroelectric Developments"
 AFG_swat_hydroelectric_developments_desc: "The Swat River in Pashtunistan has immense potential for the construction of hydroelectric projects. The constructions of dams and levees will support greater development of the area and create jobs, in which more loyal citizens can settle and increase our level of control over the frontier province."
 AFG_modernise_the_kariz: "Modernise the Kariz"
 AFG_modernise_the_kariz_desc: "Many of our people rely on the kariz, ancient undergound aqueduct systems, for their water supply. While the kariz have been historically reliable to delivering water to smaller communities, population growth demands that improvements must be made. We will construct tube wells in places with more land to be irrigated, and extend the karizes to parts of the country where water is sparse."
 AFG_national_electrification_campaign: "National Electrification Campaign"
 AFG_national_electrification_campaign_desc: "Electricity is almost nonexistent outside of our larger cities, meaning many still use outdated methods to light up buildings. We need to begin the construction of electric grids to reach more rural areas, and begin the process of electrification. That way, our people need not rely on oil lamps, but rather our central government."
 AFG_the_dawn_of_afghan_capital: "The Dawn of Afghan Capital"
 AFG_the_dawn_of_afghan_capital_desc: "Thanks to the ingenious efforts of Abdul Majid Zabuli, Afghanistan now has a reliable and prosperous bank, the Bank-i-Milli. Zabuli has also established a number of financially successful companies, opening the door for further opportunity. We must encourage this success via expansion of the bank, the granting of monopolies to successful companies, and providing our merchants with options to invest in further ventures."

 AFG_nationhood_in_the_20th_century: "Nationhood in the 20th Century"
 AFG_nationhood_in_the_20th_century_desc: "How do we define Afghanistan? Is it a domain of the Kings and Emirs of history? A collection of scattered tribes at odds with one another? To provide any of these statements as the answer risks division and obscurity. It is our responsibility to define Afghanistan in a way that transcends these trivial identities, and forges a path ahead that recognises the national unity of our people, whoever they may be."
 AFG_renovation_of_the_defence_ministry: "Renovation of the Defence Ministry"
 AFG_renovation_of_the_defence_ministry_desc: "As it stands, the Defence Ministry, like the Afghan Army, is in dire need of renovation. Luckily, younger officers within the Army have proposed a plan to centralise and reform the Defence Ministry, helping strengthen the bond between the government and the Army at the cost of tribal militia autonomy. This should give our government some much-needed breathing room for civilian and military reforms."
 AFG_further_administrative_reach: "Further Administrative Reach"
 AFG_further_administrative_reach_desc: "Reliance on local tribal authority to govern is no longer a viable option. Afghanistan needs to dramatically expand its bureaucratic apparati if we want to unify this country and fight corruption. This means hiring even more census takers, tax collectors, auditors, and providing them with the authority to collect information and resources necessary to get an accurate understanding of the entire nation."
 AFG_budding_security_state: "Budding Security State"
 AFG_budding_security_state_desc: "With the reformation of our Army underway and our establishment of a proper civilian Defence Ministry, Afghanistan now has the groundworks necessary for establishing an internal security force. We may soon begin to keep tabs on our enemies, infiltrate foreign adversaries, and, if necessary, utilise our power to eliminate potential threats as we see fit."
 AFG_emulating_foreign_policing: "Emulating Foreign Policing"
 AFG_emulating_foreign_policing_desc: "Currently, law enforcement in Afghanistan is overreliant on local tribes keeping their people in line with whatever means they deem fit. If we are to govern effectively, our law enforcement needs to be standardised and professional. Luckily, there are many countries out there with effective and respectable police forces we can take inspiration from."
 AFG_founding_an_information_ministry: "Founding an Information Ministry"
 AFG_founding_an_information_ministry_desc: "All decisions and governance relies on information, and if this information is inaccurate, then so is our governing ability. With our expanding state apparatus, we can establish a Ministry of Information, where our government can collect and publish data, announcements, and any information necessary for effective administration. The Ministry will also double as a counter to false narratives peddled by internal enemies, ensuring the totality of truth."
 AFG_expand_military_governance: "Expand Military Governance"
 AFG_expand_military_governance_desc: "Our centralisation efforts have left us with numerous offices and positions that need to be manned by loyal civil servants. At the same time, the lack of respect and opportunity for our military leaves us with a glut in recruitment. We will address both issues by placing officers in civil servant positions, helping ensure our control over local government while presenting the armed forces as an opportunity for stablity and pride."
 AFG_seeking_alternate_foreign_investment: "Seeking Alternative Foreign Investment"
 AFG_seeking_alternate_foreign_investment_desc: "While Afghanistan may have ample opportunities for development and investment, it sadly does not have the capital to see these ventures through. To remedy this, we shall provide foreign investors with opportunities to invest in Afghanistan's burgeoning economy, and undermining our reliance on tribal economics."
 AFG_reverse_the_economic_ministrys_decay: "Reverse the Economic Ministry's Decay"
 AFG_reverse_the_economic_ministrys_decay_desc: "The stagnant and backwards economy of Afghanistan has left our economic ministry in a sorry state. If we are to continue enacting policies to foster economic growth and modernisation, our government cannot do so without a functioning economic ministry. Giving this ministry the authority to regulate industries and investments will bode well for future economic endeavors."
 AFG_establish_the_bank_of_afghanistan: "Establish the Bank of Afghanistan"
 AFG_establish_the_bank_of_afghanistan_desc: "The financial and monetary situation of Afghanistan is a convoluted mess of tribal tributes. The economy of Afghanistan needs a proper distributor of capital and currency in order to function. Luckily, entrepreneur Abdul Majid Zabuli has already established the largest bank in Afghanistan, the Bank-i-Milli. If we grant the Bank-i-Milli the authority to regulate and distribute currency, we can begin the process of modernising our monetary system."
 AFG_prioritise_economic_liberalisation: "Prioritise Economic Liberalisation"
 AFG_prioritise_economic_liberalisation_desc: "While our government-sponsored economic initiatives are successful and forward-thinking, we cannot rely on authority alone to grow the economy. We must begin deregulating various industries and fostering private investments in our economy, so that our citizens may build their own wealth, and in turn build the wealth of our entire nation."
 AFG_building_civilian_institutions: "Building Civilian Institutions"
 AFG_building_civilian_institutions_desc: "The power of our military and our state has grown to impressive levels, but the overreliance on force to govern can result in catastrophic backlash if mishandled. Therefore, to ensure peaceful governance and compliance, we will begin to have different positions and administrative institutions be locally decided, to prevent the fostering of antigovernment activities."
 AFG_forming_the_transport_ministry: "Forming the Transport Ministry"
 AFG_forming_the_transport_ministry_desc: "With the continuing modernisation of our infrastructure underay, we are in need of an insitution that can govern and regulate our infrastructure. We shall establish a transport ministry with authority over the roads, railways and logistics of transport within Afghanistan, ensuring that we have control over our own forms of travel and can expand if necessary."
 AFG_decentralised_state_revenue: "Decentralised State Revenue"
 AFG_decentralised_state_revenue_desc: "Our military administration has full authority over local governments, and is loyal to the national government. As a sign of faith and goodwill to our citizens, we shall grant them autonomy in the collecting and spending of taxes, provided that they are with the consent of our military administrators."
 AFG_centralised_taxation_systems: "Centralised Taxation Systems"
 AFG_centralised_taxation_systems_desc: "Although significant efforts have been made to fully establish a central modern system for tax collection, we still rely heavily on outdated methods that often see vital revenue falling through the cracks, a threat posed both by those not wishing to pay but also those sent to collect their taxes. Further efforts towards a centralised system with modern methods of bookkeeping and revenue extraction must be prioritised to fund the rest of the government."
 AFG_priorities_of_the_education_ministry: "Priorities of the Education Ministry"
 AFG_priorities_of_the_education_ministry_desc: "The primary functions of administrative and governing institutions would fall apart if the education of our citizens was insufficient. Therefore, it is of the upmost priority of our Education Ministry to ensure we have institutions that are able to provide our leadership with the education and knkowledge necessary to run the country. We must determine the course of action in providing this education."
 AFG_found_the_university_of_kabul: "Found the University of [267.Controller.GetVictoryPointName_10737]"
 AFG_found_the_university_of_kabul_desc: "[267.Controller.GetVictoryPointName_10737]'s status as the largest city in Afghanistan and our former capital make it the perfect location for a modern University. Here in [267.Controller.GetVictoryPointName_10737], partnered with universities around the world, the future leaders of our nation will receive the best education they can, and in turn bring to Afghanistan the fruits of their knowledge."
 AFG_rely_on_edwardes_and_islamia: "Rely on Edwardes and Islamia"
 AFG_rely_on_edwardes_and_islamia_desc: "The College of Edwardes and Islamia in [442.Controller.GetVictoryPointName_12717] are already the perfect university for Afghans to receive a modern education. There is little need to replace these already great institutions with something new, when we can instead prioritise their expansion to benefit all those in need of higher education."

 AFG_royal_army_reform_of_1936: "Royal Army Reform of 1936"
 AFG_royal_army_reform_of_1936_desc: "If the past decade has shown us anything, it is that a strong modern army will be needed to enforce the King's will in spite of the nation's many detractors. Taking the needed steps towards building such an army is however bound to be rather controversial..."
 AFG_armies_of_personality: "Armies of Personality"
 AFG_armies_of_personality_desc: "An effective officer class is a necessity for a modern army, after all we can hardly expect every order to come directly from [AFG.Capital.GetCapitalVictoryPointName] in the heat of battle. We must therefore shift our focus towards building such a class of dedicated officers, especially putting much greater stock into promoting officers based on merit, rather than personal status."
 AFG_contributions_of_tribal_militias: "Contributions of Tribal Militias"
 AFG_contributions_of_tribal_militias_desc: "It is impossible to win a war without soldiers to fight it, and historically the Afghan state has always relied upon its relationships with tribal leaders, to whom the issue of recruitment had been devolved. Even with the introduction of conscription by King Amanullah, these leaders still play a vital role in recruitment, but nothing lasts forever, and it is time to consider whether this role is one that should be phased out."
 AFG_attracting_western_army_aid: "Attracting Western Army Aid"
 AFG_attracting_western_army_aid_desc: "It would be absurd for us to attempt to catch up with the great armies of the world entirely on our own, and it would be equally foolish to not take advantage of the great powers who are amicable towards us, who have large amounts of military surplus almost begging to find a new home."
 AFG_modern_training_methods: "Modern Training Methods"
 AFG_modern_training_methods_desc: "Many of the fundamentals of warfare have found themselves cast in doubt ever since the world first found itself plunged into a global war a few decades ago, yet much of our army is still trained as though it were the 19th century. Taking cues from the Russians and the Germans, we should reevaluate our training methods and ensure that our troops are based on modern concepts rather than outdated ideals."
 AFG_combined_arms_experiments: "Combined Arms Experiments"
 AFG_combined_arms_experiments_desc: "Gone are the days where a few cannons and men on horseback with lever action rifles was all you needed to win a war. Wars these days are being fought more and more with air power, something we experienced first hand with the rebellion in 1929. We need to ensure that if the time comes where we face a similar threat in future our men are trained to properly fight underneath the wings of our bombers."
 AFG_utilise_the_kohat_arms_industry: "Utilise the Kohat Arms Industry"
 AFG_utilise_the_kohat_arms_industry_desc: "If one thing is true of untamed frontiers, there is always a need for firearms, and the people of Kohat have for many years now produced local copies of foreign arms to meet the armament demands of the locals. Far from a few men in sheds, these operations have become almost professional in nature, especially as things deteriorated in India. With official backing, these small factories could easily develop into a national arms industry for the nation."
 AFG_upholding_professional_standards: "Upholding Professional Standards"
 AFG_upholding_professional_standards_desc: "It is one thing to have standards for your army, and it is another to actually apply them in practice. Without proper discipline measures and rule enforcement, the men of our army will easily run wild, a rather dangerous affair when it comes to sustained warfare, and something we must ensure does not happen."
 AFG_arsenals_of_kandahar_and_herat: "Arsenals of Kandahar and Herat"
 AFG_arsenals_of_kandahar_and_herat_desc: "Afghanistan is not just [AFG.Capital.GetCapitalVictoryPointName] and its surrounding settlements, yet much of the existing army infrastructure seems to act like it is. It is important that we spread our armouries and stockpiles out to the western cities, so that our army can continue to operate even if the capital were to fall."
 AFG_afghan_supply_corps: "Afghan Supply Corps"
 AFG_afghan_supply_corps_desc: "With how much equipment and supplies are needed to sustain a modern military campaign, one cannot expect to supply an armed force with just whatever can be requisitioned locally. Centralised networks, running back to the capital, must be established and maintained, especially if we ever wish to capitalise on opportunities to expand the Afghan state."
 AFG_advanced_communication_systems: "Advanced Communication Systems"
 AFG_advanced_communication_systems_desc: "While bad for the continued employment of couriers riding on the back of ponies, the invention of radio has been a marvellous breakthrough for communications across the globe. More than just a novelty for the elite of [AFG.Capital.GetCapitalVictoryPointName], radios are affordable enough nowadays to be rolled out to much of our army, greatly improving our communication abilities."
 AFG_strongholds_of_the_hindu_kush: "Strongholds of the Hindu Kush"
 AFG_strongholds_of_the_hindu_kush_desc: "The mountains of the Kush range have long protected Afghanistan, funnelling our enemies through the narrow Khyber Pass. Any invasion from the west must pass through it to get to [267.Controller.GetVictoryPointName_10737], and such a natural chokepoint can easily be made nigh impregnable by building fortifications throughout it."
 AFG_building_conscription_infrastructure: "Building Conscription Infrastructure"
 AFG_building_conscription_infrastructure_desc: "While a rather controversial measure, conscription is necessary for a modern army to function. Even with its implementation in past years, its effectiveness has been limited by constant draft dodging and corrupt officials allowing it to happen. We must focus on mitigating the ability for this corruption to even happen in the first place, through a wide range of improvements such as better record keeping and better policing methods."
 AFG_favour_foreign_instructors: "Favour Foreign Instructors"
 AFG_favour_foreign_instructors_desc: "While home grown officers are important, nothing can truly beat the expertise foreign experts can impart upon an army, especially those who have significant training and real world experience with combat. The wisdom of these advisors should be paramount for our military doctrines, as they ultimately know best."
 AFG_prioritise_afghan_officers: "Prioritise Afghan Officers"
 AFG_prioritise_afghan_officers_desc: "Nobody knows how to fight a war in Afghanistan better than the Afghans, and no level of experience or fancy education can trump that. The priority of our officer corp should be to further the education and training of our best men, who will lead our troops today and impart their wisdom on the soldiers of tomorrow."
 AFG_expanding_the_royal_airforce: "Expanding the [GetRoyalOrRepublicanCap] Airforce"
 AFG_expanding_the_royal_airforce_desc: "Built from planes acquired from the Russians and the British, Afghanistan's airforce is still rather small and humble, but certainly a good starting point. While it is unlikely to reach the heights of the forces of those whose planes kickstarted it, with enough support it could evolve into the largest and most effective airforce in our region of the world."
 AFG_ahmad_shah_airfield: "Ahmad Shah Airfield"
 AFG_ahmad_shah_airfield_desc: "Much like it is pointless to maintain a navy without suitable ports, it is equally pointless to maintain an airforce without suitable bases for them to be stationed. There are multiple spots just outside [267.Controller.GetVictoryPointName_10737] that would be perfect for the construction of such a base, one that shall hopefully be a great improvement over the current tiny airstrips on which we rely."
 AFG_pilot_training_schemes: "Pilot Training Schemes"
 AFG_pilot_training_schemes_desc: "Historically our airforce has been staffed almost entirely by Russian pilots, enticed into our service with generous payment and endorsement from their state. We cannot however rely on this arrangement forever, especially as more and more Russian pilots find themselves needed to defend the homeland. We must therefore turn our attention to training our own pilots, even if it may take an accident or two to get the hang of it."

 AFG_anarchy_in_afghanistan: "Anarchy in Afghanistan"
 AFG_anarchy_in_afghanistan_desc: "Just as the dreaded Saqqawists were finally beaten back for good, a new conflict has erupted. King Amanullah Khan has returned from Berlin to contest Nadir's attempted usurpation. Not content with merely burying the dead, the two Kings have begun yet another bloody civil war that will decide the fate of Afghanistan."
 AFG_the_conquering_hero: "The Conquering Hero"
 AFG_the_conquering_hero_desc: "In Afghanistan's hour of need, it was Mohammad Nadir Shah who defended her, not the craven Amanullah. While Amanullah flouted his way through Europe, and his son failed in his duties, Nadir saved the nation from the pillaging bandits. Now, he must once again defend his kingdom from those who would ruin it with decadence and cowardice."
 AFG_the_true_king: "The True King"
 AFG_the_true_king_desc: "In the midst of his education on the modern world, Amanullah Khan has found himself betrayed by his own family, as his ancestors once warned would happen. Now, a usurper sits upon his throne, threatening to undo all of Amanullah's work by turning Afghanistan into a backwards domain. If Afghanistan is to endure, Amanullah must be returned to his rightful place as her King!"
 AFG_put_faith_in_the_army: "Put Faith in the Army"
 AFG_put_faith_in_the_army_desc: "Before Nadir was King of Afghanistan, he was the leader of her Royal Army. Who better to turn to for support than the men who fought and bled alongside the King in our country's hour of need? We must call upon our military allies to help expel the decadent Amanites."
 AFG_secure_ambivalent_generals: "Secure Ambivalent Generals"
 AFG_secure_ambivalent_generals_desc: "While the Royal Army knows where its loyalties lie, there are some within who have their doubts. We must reassure them of Nadir Shah's legitimacy and the righteousness of our cause, either through persuasion, the calling of favours, or the use of force. If that proves insufficient, we have many friends who are overdue for promotions."
 AFG_sever_the_branches: "Sever the Branches"
 AFG_sever_the_branches_desc: "With our superior military intelligence and resources, we can begin to intercept and isolate Amanite forces more effectively. We will soon be turning entire fronts into pockets, and wiping those pockets of traitors off the face of the Earth."
 AFG_turn_to_the_tribes: "Turn to the Tribes"
 AFG_turn_to_the_tribes_desc: "The neutrality of the numerous tribes that make up Afghanistan means untapped sources for allies in this civil war. Through a series of bribes, threats, and promises, we can secure ourselves with a number of competent and loyal warriors that will turn the tides of this civil war."
 AFG_patronage_intelligence_networks: "Patronage Intelligence Networks"
 AFG_patronage_intelligence_networks_desc: "People talk, they always have. Not even a singular armed soldier can walk through a village without at least one person being willing to gossip about it, especially to those they defer to. By utilising connections throughout the realm, we can easily turn the talk of our towns into practical information gathering networks, letting us know exactly what the Amanites are up to at all times."
 AFG_absorbing_the_anti_amanites: "Absorbing the Anti-Amanites"
 AFG_absorbing_the_anti_amanites_desc: "Although the Saqqawists were little better than desire driven savages, it would be foolish to simply chalk up everyone involved as simply wishing to loot and pillage. Many rode under the Saqqawist banner to rid the realm of Amanullah's blasphemy, a cause we now ironically represent, and as such it should not be hard to convince them to fight for a new banner instead."
 AFG_win_over_the_ghilji: "Win over the Ghiljī"
 AFG_win_over_the_ghilji_desc: "The Ghilji are one of the largest tribes of Afghanistan, with many finding themselves neutral in the ongoing conflict. Whoever secures their support should have a significant advantage of both men and resources in this struggle for the throne. The promise of patronage and the protection of their traditions and customs should be sufficient in winning them over, and can pave the way for further reforms in the future."
 AFG_the_khost_stronghold: "The Khost Stronghold"
 AFG_the_khost_stronghold_desc: "We have received credible information that Nadir plans to move on the city of Khost in a major offensive. Now that we have been blessed with this foresight, we can properly prepare the city for the traitor's attack, and shatter his army against our defences."
 AFG_call_upon_amanite_allies: "Call Upon Amanite Allies"
 AFG_call_upon_amanite_allies_desc: "Nadir's overconfidence in his ties to the Royal Army shall be his undoing. Contrary to his beliefs, there are many within the military and government who sympathise with us, for our modernisation efforts or through personal loyalty. Calling upon these loyalists will give us an edge against the unsuspecting usurper, and will catch his forces off guard."
 AFG_loyalty_of_the_hazara: "Loyalty of the Hazara"
 AFG_loyalty_of_the_hazara_desc: "While Amanullah might be the rightful King of Afghanistan, there is another king in the realm almost as legitimate. That man is Amin Jan, Amanullah's half brother, and the so called \"King of the Hazara\". Half Hazara on his mother side and a frequent defender of them, Amin Jan commands the respect of most Hazara leaders, and if given the order will lead them into battle under his brother's banner."
 AFG_gathering_foreign_support: "Gathering Foreign Support"
 AFG_gathering_foreign_support_desc: "Amanullah's time abroad has exposed him to the modern, civilised world. Luckily for him, there are many nations and peoples who would love to see Afghanistan join them in civilisation. In exchange for preferences and priorities from the Afghan government, we can secure international support for our cause."
 AFG_secure_the_khyber: "Secure the Khyber"
 AFG_secure_the_khyber_desc: "The Khyber is one of the most famous and easily defended parts of Afghanistan. By occupying the Khyber pass, we can directly prevent any support for Nadir that may originate from outside the country, and starve him like the rat he is."

 AFG_return_of_the_king: "Return of the King"
 AFG_return_of_the_king_desc: "Amanullah once again sits atop his throne, this time perched on a mountain of traitors. The rightful ruler of Afghanistan has returned, and has vanquished the enemies of the nation. Now, Amanullah can truly begin to bring Afghanistan into the twentieth century!"
 AFG_crushing_saqqawist_remnants: "Crushing Saqqawist Remnants"
 AFG_crushing_saqqawist_remnants_desc: "The Saqqawists have been a consistent thorn in the side of the King for years. Several attempted uprisings, insurgent movements, and even the support for a backwards pretender. We will not suffer their presence amongst our Turkic subjects any longer: they must be wiped out."
 AFG_dealing_with_the_traitors: "Dealing with the Traitors"
 AFG_dealing_with_the_traitors_desc: "Far too many within our military and our royal government sided with Nadir Khan in our hour of need. Amanullah has no use for these traitors and sycophants of regression, and has put measures into place to deal with them. They will stand trial for their betrayal of the King and his people, where they will subsequently be dealt with in a permanent manner."
 AFG_destroying_the_mojadidis: "Destroying the Mojadidis"
 AFG_destroying_the_mojadidis_desc: "Of the Ulema who stand in the way of our modernisation efforts, the Mojadidi family is the most dangerous. Rallying support amongst fanatics to weaponise Islam against King Amanullah, himself a faithful servant of Allah, the Mojadidis committed the ultimate betrayal with their support for the pretender Nadir. We now have a chance to silence these troublesome scholars once and for all."
 AFG_protection_against_radicalism: "Protection Against Radicalism"
 AFG_protection_against_radicalism_desc: "In our efforts to modernise Afghanistan, we admittedly partook in the involvement of rather... destabilising figures within our government. Republicans, atheists, revolutionary sympathisers, these men are a step too far. A modern Afghanistan does not need to throw away her defining qualities, and as such, these radicals must go."
 AFG_rebuild_ties_with_the_ulema: "Rebuild Ties with the Ulema"
 AFG_rebuild_ties_with_the_ulema_desc: "When Amanullah began his modernisation efforts, it was to save Afghanistan from obscurity and backwardsness. In our efforts, the Ulema called for reason and piety to guide us, and we foolishly chose to ignore them. We must reach out to these holy men, and admit to them that we need their guidance more than ever, to ensure Afghanistan never strays from His will again."
 AFG_good_king_bad_boyars: "Good King, Bad Boyars"
 AFG_good_king_bad_boyars_desc: "King Amanullah always had the best interests of Afghanistan in his heart. Alas, early in his reign, those he trusted to modernise the country have turned out to be degenerates and apostates. Luckily, the people of Afghanistan recognise Amanullah was misrepresented in his rule by these men. We must show them that the King deserves their trust, and get rid of the rot."
 AFG_restoring_darulaman: "Restoring [267.Controller.GetVictoryPointName_12769]"
 AFG_restoring_darulaman_desc: "Years of progress on Afghanistan's finest capital, and a civil war nearly jeopardised all of it. Yet, [267.Controller.GetVictoryPointName_12769] remains standing, a testament to its strength and resilience, as well as Amanullah's. Like Afghanistan, [267.Controller.GetVictoryPointName_12769] will be repaired, and stand stronger than ever, a shining example of our modern nation!"

 AFG_an_end_to_the_chaos: "An End to the Chaos"
 AFG_an_end_to_the_chaos_desc: "Finally, Amanullah's reign is secure. No more shall the enemies of Afghanistan stab us in the back, for they have all been defeated. The fate of Afghanistan fully rests in the hands of the King, destined for a greatness no other nation in the world can achieve."
 AFG_the_pearl_of_the_east: "The Pearl of the East"
 AFG_the_pearl_of_the_east_desc: "Afghanistan will no longer be known as a backwards mountain kingdom. The once isolated and feudal nation now sits comfortably as a modern nation, guided by reason. King Amanullah will not stop there, for he sees Afghanistan's destiny is as a beacon of progress, a lighthouse for her neighbours to follow, established by the King himself. Let the work begin!"
 AFG_formation_of_the_national_assembly: "Formation of the National Assembly"
 AFG_formation_of_the_national_assembly_desc: "The many peoples of Afghanistan have historically sat as subjects of a king or an emir. No longer will this be the norm. The people are not subjects, but citizens of a modern nation. As such, they deserve the representation indicative of modern governance. It is time to establish a proper legislative body, the National Assembly."
 AFG_the_monarcho_party_state: "The Monarcho-Party State"
 AFG_the_monarcho_party_state_desc: "With the King's blessing, the country has moved away from rule by royal decree. However, the guidance of the King is still a necessity: after all, it was King Amanullah who modernised Afghanistan, not the people. As such, we shall establish a party to represent the interests of the King, that will guide Afghanistan through this new era."
 AFG_lead_the_fight_against_authoritarianism: "Lead the Fight Against Authoritarianism"
 AFG_lead_the_fight_against_authoritarianism_desc: "Too many of Afghanistan's enemies have utilised brutal force in their rule: the Nadirists, the Saqqawists, and many more. King Amanullah understands the dangers of authoritarian brutality more than any other ruler, and will guide the nation away from potential demagogues and autocrats. After all, it is the King's responsibility to ensure fairness and representation across the realm."
 AFG_healing_the_scars_of_the_realm: "Healing the Scars of the Realm"
 AFG_healing_the_scars_of_the_realm_desc: "In the midst of war and reform, the King has found himself with many scorned parties across the country. This was never his intention, merely a byproduct of desperate measures for desperate times. A period of reconcilliaton and healing must now commence, where any who may have been neglected by their King will have the hand of friendship offered to them."
 AFG_the_economic_independence_plan: "The Economic Independence Plan"
 AFG_the_economic_independence_plan_desc: "Our reliance on foreign investment in our modernisation of Afghanistan was genius, as it brought new industries and wealth to the country. However, we are not blind: we have seen how the consequences of foreign control have ruined our neighbours. Therefore, we have outlined a plan to counteract any foreign encroachment on our economy, to ensure we continue to be independent."
 AFG_patronise_the_royal_academy: "Patronise the Royal Academy"
 AFG_patronise_the_royal_academy_desc: "Education efforts have always been a key aspect of modernisation programmes. Afghanistan already has several fantastic universities, but none that are directly connected to the King himself. Amanullah has decided to establish a Royal Academy, an institution of higher learning for Afghanistan, to show the world his goodwill and charitable character."
 AFG_enforcement_of_ideological_unity: "Enforcement of Ideological Unity"
 AFG_enforcement_of_ideological_unity_desc: "The pluralisation of Afghan politics has just been established and already politicians are obstructing good governance with petty disputes and disagreements. As Afghanistan's herald and King, Amanullah has a responsibility to curb ideological disagreements and ensure that politics do not obstruct responsible leadership."
 AFG_dissolve_the_power_of_tribal_leaders: "Dissolve the Power of Tribal Leaders"
 AFG_dissolve_the_power_of_tribal_leaders_desc: "For far too long, King Amanullah has needed to consult the backwards tribes that manage his Kingdom. With the establishment of a modern nation-state, these tribal structures are obsolete, and promote disunity amongst the Afghan people. We will no longer suffer their petty fiefs, or any resistance they may give us. "
 AFG_mass_expansion_of_shirkats: "Mass Expansion of Shirkats"
 AFG_mass_expansion_of_shirkats_desc: "Now that our economy has been established via government monopolies and a national bank, we can begin introducing new opportunities to enrich our people. We will begin the mass establishment of shirkats, joint stock companies, and give people the chance to become proper business owners and stockholders. This will surely bring even more prosperity to our nation, without relying upon foreign capital."
 AFG_renewal_of_the_realm: "Renewal of the Realm"
 AFG_renewal_of_the_realm_desc: "When Amanullah first came to the throne, Afghanistan was a feudal despotate, clinging to tribal authority and shepherding as the rest of the world moved forward. Now, it is a modern nation, where its subjects vote, hold rights, and own businesses. No more is the King's realm a backwards domain: it is a proper nation state, guided by an enlightened monarch, with a modern economy."

 AFG_for_the_sake_of_order: "For the Sake of Order"
 AFG_for_the_sake_of_order_desc: "Afghanistan is modern, yes, but at what cost? Uprisings, fanaticism and destruction of Amanullah's domain. In our quest to save Afghanistan, we neglected the very pillars she stood upon. Afghanistan needs stability more than ever, and tradition provides it. We must course correct, and return Afghanistan to tradition in the ways that truly matter."
 AFG_legitimacy_through_the_jirga: "Legitimacy Through the Jirga"
 AFG_legitimacy_through_the_jirga_desc: "Amanullah looked beyond Afghanistan for legislatures to govern the country, when all he needed was within: the Jirga. The assembly of Pashto tribal leaders has helped the Kings and Emirs of Afghanistan write laws, construct legal codes, and even draft constitutions. What better way is there to establish a legislative institution than by officialising this ancient body of leaders?"
 AFG_dismiss_the_ahn: "Dismiss the AHN"
 AFG_dismiss_the_ahn_desc: "The Anjuman-i Himayat-i-Niswan (Association for the Protection of Women) was the brainchild of Amanullah's wife and sisters. An experiment of feminine emancipation, the AHN sought to make women equal under the laws of Afghanistan. While King Amanullah loves and respects the works of his family, the truth is that the AHN is far too radical for Afghan society, and must be detached from the royal government entirely."
 AFG_shatter_qanun_primacy: "Shatter Qanun Primacy"
 AFG_shatter_qanun_primacy_desc: "The King of Afghanistan has a right as a King to decree laws and legal codes. However, what right does a King have to proclaim himself the better of any man, when all pious men are brothers in the eyes of Allah? Therefore, only those scriptures revealed to the Prophet (Peace Be Upon Him) must form the basis for justice and law, as studied and proclaimed by the Ulema."
 AFG_work_with_ulema_loyalists: "Work with Ulema Loyalists"
 AFG_work_with_ulema_loyalists_desc: "Amanullah is a man who knows to seek guidance when his own judgement is in question. In Afghanistan, the pious Ulema are a pillar of knowledge and spiritual strength, and fine shoulders to lean upon. King Amanullah will begin to rely on these wise scholars to fill his ministries, to remind Afghanistan of the centuries of tradition it sits upon, and to assist him in matters of Kingship."
 AFG_purge_of_corrupt_officials: "Purge of Corrupt Officials"
 AFG_purge_of_corrupt_officials_desc: "The modernisation efforts have allowed all kinds of opportunists to fester within the Kingdom. As a pious man, the King must do everything within his power to ensure that virtue governs Afghanistan, not the demands of petty bureaucrats and secular leeches. The King will struggle, as is his responsibility as a Muslim, against injustice and corruption within his government."
 AFG_return_to_pashtun_traditions: "Return to Pashtun Traditions"
 AFG_return_to_pashtun_traditions_desc: "The traditions of the Pashtun tribes have defined Afghanistan for centuries, only for the actions of foreigners and infidels to attempt to destroy them. To be a Pashtun is to be a subject of the King, an honour older than the concept of modernity. We must strive to restore these traditions within our legal codes, customs, and communities, as a bulwark against cultural collapse."
 AFG_overturn_tribal_conscription: "Overturn Tribal Conscription"
 AFG_overturn_tribal_conscription_desc: "The tribes of Afghanistan have been loyal to the King for far too long just to be rewarded with the shipping away of their sons for war. We must restore the Hasht Nafari conscription laws, as a sign of good faith towards our tribal subjects. While this may harm our recruitment efforts for the army, the preservation of tribal relations is more important for Afghanistan's stability."
 AFG_cooperating_with_village_elders: "Cooperating with Village Elders"
 AFG_cooperating_with_village_elders_desc: "In many villages across the country, the eldest are the wisest and most experienced in leadership. We must directly incorporate the advice of these men into our administrative efforts, both in justice and in the needs of their communities."
 AFG_turn_the_economy_inwards: "Turn the Economy Inwards"
 AFG_turn_the_economy_inwards_desc: "It was a mistake to invite foreign business into Afghanistan, as they quickly began preying upon our people. No more shall the economy work for the interests of bankers and alien businesses: our economy must focus on the self sufficiency of Afghan society and shield itself from pervasion."
 AFG_the_iron_padishah: "The Iron Padishah"
 AFG_the_iron_padishah_desc: "When Amanullah's grandfather Abdur Rahman Khan took the throne, the capital had fallen, rebellious marauders pillaged the land, and false claimants attempted to take the throne for themselves. The great Iron Emir crushed all of his foes, vanished the enemies of Islam, and united the nation; although submitting himself to Britain. Amanullah, the Iron Padishah, has not only matched these achievements, but did so on his own after expelling the British, carving out a legacy for the ages."

 AFG_the_final_fall_of_amanullah: "The Final Fall of Amanullah"
 AFG_the_final_fall_of_amanullah_desc: "Amanullah's reckless ambition towards a Westernised Afghanistan proved to be too much. He spat in the face of Afghanistan, its people, and perhaps in the face of God. His foolishness has become his downfall, as will it be the downfall of Western influence in Afghanistan: the alliance of Hazrat Nur al-Mashayikh and Hashim Shah will make it so."
 AFG_abolish_the_amanite_constitution: "Abolish the Amanite Constitution"
 AFG_abolish_the_amanite_constitution_desc: "What is the need of a constitution, other than to corrupt the minds of pious Afghans with Western drivel? The rights granted to our people come not from secular intellects, but from the will of Allah. We must cast down this useless document, and remind the people that only Allah may judge us to be equal."
 AFG_destroy_the_westernisation_of_women: "Destroy the Destructive Rights of Women"
 AFG_destroy_the_westernisation_of_women_desc: "Perhaps the greatest sin of the Amanites was their campaign to dishonour and destroy the nation's women. Under their reign of tyranny women have been subjected to the temptations of men through the abolishment of Ikhtilat, been deluded into taking part in male education, and have even been manipulated into casting aside their veils by those who stand against Islam. We must liberate women from this oppression and allow them to return to their natural place."
 AFG_favour_the_village: "Favour the Villages"
 AFG_favour_the_village_desc: "When Mohammad Hashim Shah was bestowed the throne of Afghanistan, it was the village people that put him there. In Afghan history, it has always been our villages that remain our backbone of society. We must grant these villages the right to govern themselves, and give them the resources and subjects necessary to thrive in a traditional manner."
 AFG_increase_the_ulemas_control_of_education: "Increase the Ulema's Control of Education"
 AFG_increase_the_ulemas_control_of_education_desc: "The Ulema are some of Afghanistan's most learned and wise scholars. It was a tragic mistake for Amanullah to keep such scholarly men away from the education of our people. Now, the education systems established by Amanullah shall be retooled, with the Ulema guiding the curriculum of our nation, as it always should have been."
 AFG_total_ulema_independence: "Total Ulema Independence"
 AFG_total_ulema_independence_desc: "Islam is built upon foundational pillars, a quality Afghanistan must adopt. The King Amanullah refused to recognise this necessity, relying solely on royal power. We know that Afghanistan is to be held up not just by the Royal Palace, but also by its madrasas. We shall recognise the full independence of the Ulema from royal authority, granting them vast jurispudence within society."
 AFG_restoring_parochial_autonomy: "Restoring Parochial Autonomy"
 AFG_restoring_parochial_autonomy_desc: "Afghanistan is not [267.Controller.GetVictoryPointName_10737], nor is it lavish [267.Controller.GetVictoryPointName_12769]. Afghanistan is the mountains, the villages and tribes that have no need for a centralised oppressive central government. Amanullah was a power-hungry autocrat, attempting to bend these communities to his will, a foolish choice. We must learn from his mistake."
 AFG_lord_of_the_mob: "Lord of the Mob"
 AFG_lord_of_the_mob_desc: "Mohammad Hashim Shah rose to power through the actions of the Afghan people, accepting the crown they took from the incompetent Amanullah. His allies, seeking to transform Afghanistan in their own image, forgot this fact, treating the King as though he was their puppet. It is time they were reminded that he was King, and they are to be his loyal subjects."
 AFG_mouthpiece_of_the_mullahs: "Mouthpiece of the Mullahs"
 AFG_mouthpiece_of_the_mullahs_desc: "Mohammad Hashim Shah is above all, a pious man. How could he not be? His reign has crushed the enemies of the people, the apostates, infidels and foreigners. More than anything, he has heeded the wisdom of the Ulema above any other, to the point where their words have become his own. Truly, Mohammad Hashim Shah is a pious King."

 AFG_the_durrani_conspiracy: "The Durrani Conspiracy"
 AFG_the_durrani_conspiracy_desc: "Betraying his own allies to try to claw back support from the religious establishment was Amanullah's greatest, and final mistake. He now lays dead, murdered by forces unknown, except to the perpetrators who now rule in his stead. King Inayatullah, the late king's brother, plans now alongside them to bring functional democracy to Afghanistan, and continuing to modernise the nation."
 AFG_rewrite_the_amanite_constitution: "Rewrite the Amanite Constitution"
 AFG_rewrite_the_amanite_constitution_desc: "When we forged a constitution in the name of Afghanistan, Amanullah warped it into a mockery of its original form, giving himself powers no man should have, and giving concessions to his backwards allies. Luckily, many of his changes can easily be undone, and we can use what's left to craft a truly forward thinking constitution befitting the Afghan people."
 AFG_liberalisation_of_the_judiciary: "Liberalisation of the Judiciary"
 AFG_liberalisation_of_the_judiciary_desc: "A hallmark for any modern nation is that of a judiciary that fully recognises the rights laid out by a citizen's constitution. When Amanullah established a modern judiciary, he staffed it with cronies and entered exceptions to the concept of civil rights. We must comb the entirety of our judicial system, and ensure that it truly follows the rights set forth by the Enlightenment and our Constitution."
 AFG_furthering_international_trade: "Furthering International Trade"
 AFG_furthering_international_trade_desc: "Liberalism is a defining aspect of modern society, and nothing defines liberalism more than free trade. A nation that does little to impede its integration into the international markets allows its citizens to enjoy the full breath of prosperty the world can offer. We must take measures to encourage more trade with foreign nations as part of our plans."
 AFG_the_national_urbanisation_scheme: "The National Urbanisation Scheme"
 AFG_the_national_urbanisation_scheme_desc: "A nation of peasants and rural farmers is one ill-suited for a well functioning democratic society. When people are too focused on scraping by in fields, they pay no heed to the rest of society, nor do they participate in government affairs. Policies that will increase our urbanisation will bring our people closer to modernity than ever."
 AFG_promote_an_academic_influx: "Promote an Academic Influx"
 AFG_promote_an_academic_influx_desc: "Afghanistan has much to be desired in terms of education. While we are making strides in educating our people, our universities are in desperate need of intellectuals and scholars that are renowned and secular. Let us provide huge incentives for foreign intelligencia to make their livelihoods in our capitals of knowledge."
 AFG_democracy_beyond_the_cities: "Democracy Beyond the Cities"
 AFG_democracy_beyond_the_cities_desc: "Too many tribes, villages and communities run themselves like small fiefs, with elders and dynasties running towns for generations. If we are to modernise, we need to ensure that, like any functioning municipalities, those in charge are elected to office, not inheriting titles."
 AFG_seeking_imperial_recognition: "Seeking Imperial Recognition"
 AFG_seeking_imperial_recognition_desc: "Germany, Russia, Japan, the Ottomans, and even the Austrians; what two things do they all have in common? They have for decades now been recognised as the world's greatest powers, and they have existed for at least the majority of that time under the guidance of an emperor. If we wish to place ourselves as their equals, we cannot simply be seen as a lowly kingdom, it harkens back to British submission; we must instead be seen as a modern imperial nation guided by an emperor."
 AFG_enjoining_good_and_forbidding_wrong: "Enjoining Good and Forbidding Wrong"
 AFG_enjoining_good_and_forbidding_wrong_desc: "The morals of faith and religion form the basis of even the most secular of societies. As such, for our laws and ethics, we can turn to tradition for inspiration. Enshrining our laws and basing them upon the tenets of Islam both promotes a morally responsible society without needing to rely on reactionary Ulemas."
 AFG_rollback_feminist_concessions: "Rollback Feminist Concessions"
 AFG_rollback_feminist_concessions_desc: "Although Amanullah's reign will always be remembered for great strives towards progress, it will unfortunately always be overshadowed by the chaos it inflicted, with the extremist feminist agenda being the wedge that tore apart society. With Prime Minister Dawi having always opposed the most anti-Islamic policies towards women, it is only natural he will be the one to finally protect the nation from their further evils."
 AFG_officialise_the_ahn: "Officialise the AHN"
 AFG_officialise_the_ahn_desc: "As part of modernising Afghanistan, we must modernise her people and their thoughts on the place of women within society. Luckily, there exists an organisation that serves this end: the AHN, a brainchild of the wife and sisters of King Amanullah. Making it an official government organisation will give it the authority and resources needed to make Afghanistan equal, for men and women."
 AFG_combating_the_corruption_of_islam: "Combating the Corruption of Islam"
 AFG_combating_the_corruption_of_islam_desc: "Islam has always been a religion based upon reason, tolerance and self improvement. Unfortunately, like many faiths, it has been exploited, used to promote violence and to control others, giving rise to groups like the dreaded Saqqawists. We must begin combatting the violent rhetoric plaguing the Ummah, and usher in a new Islam, free of corrupting extremism."
 AFG_the_dream_of_the_mashruta_khwahan: "The Dream of the Mashruta Khwahan"
 AFG_the_dream_of_the_mashruta_khwahan_desc: "Our progress in the name of the nation is not new. Once before, the Mashruta Khwahan tried to breathe life into a new Afghanistan through a constitutionalist agenda, but King Habibullah struck them down. Now we stand before the nation, carrying their torch: we have made Afghanistan a nation of liberty, goodwill and reason, a monument to the work of those before us!"

 AFG_to_the_victor: "To the Victor..."
 AFG_to_the_victor_desc: "At long last, Mohammad Nadir Shah has been crowned King. His family, once exiles, has vanquished the foolish Amanullah, and shall begin course correcting Afghanistan. To do that, Nadir must surround himself with loyal servants: who better than his own family? After all, they waited patiently in exile for this very moment."
 AFG_extinguish_the_charkhi_line: "Extinguish the Charkhi Line"
 AFG_extinguish_the_charkhi_line_desc: "Since his rise to power, Amanullah surrounded himself with the Charkhi family, a group of brothers scheming to take control of Afghanistan through Amanullah. Now that Nadir has dealt with the errant King, it is time we silence these influential snakes for good, to reinforce Nadir against the Amanites."
 AFG_bring_the_ulema_into_government: "Bring the Ulema Into Government"
 AFG_bring_the_ulema_into_government_desc: "The Ulema have been steadfast supporters of our reign, as we understand, unlike Amanullah, the importance of their wisdom. Who but the Ulema spoke up when the fool decided to cast Afghan tradition to the wind? We must invite these men into our government, to help us undo the damage Amanullah has wreaked."
 AFG_buying_tribal_loyalty: "Buying Tribal Loyalty"
 AFG_buying_tribal_loyalty_desc: "Many of our tribal allies in the civil war were promised power in exchange for their support. We shall grant them this power, as a sign of thanks for their assistance. We will also use this as a chance to demonstrate to any who doubt their loyalty the benefits of working with Mohammad Nadir Shah."
 AFG_reshape_amanullahs_legacy: "Reshape Amanullah's Legacy"
 AFG_reshape_amanullahs_legacy_desc: "Amanullah was a fool, but he was moving Afghanistan in the right direction. However, any admittance of this is tantamount to confessing to illegitimacy. We merely need to co-opt the more reasonable plans for modernisation he drafted, and keep him in Afghanistan's memory as a hasty unstable ruler, trying to destroy what we wish to protect."
 AFG_uphold_saqqawist_proclamations: "Uphold Saqqawist Proclamations"
 AFG_uphold_saqqawist_proclamations_desc: "Part of the reason we had to deal with the Saqqawists in the first place was thanks to Amanullah's hasty and ridiculous modernisation attempts. As such, we do not want to repeat his mistakes: we must adopt for our reign the most agreeable of the demands of the Saqqawists, and begin working the most compliant of the bunch into our government."

 AFG_the_gradual_approach: "The Gradual Approach"
 AFG_the_gradual_approach_desc: "Amanullah saw the truth: Afghanistan is a backwards place. Where he failed was that in his haste to cure the country, his remedy was too strong and too fast, leading to his downfall. We, however, know not to make this mistake: only gradual, reasonable reforms will relieve Afghanistan of her ailments, without destroying her from within."
 AFG_secularise_the_judicial_system: "Secularise the Judicial System"
 AFG_secularise_the_judicial_system_desc: "The control of our judicial system belongs to the Ulema, both as the justices of the realm and through the usage of Sharia law for our legal codes. This religious control over our courts and laws puts the Kingdom at a disadvantage, especially in the context of betrayal by the Ulema: the courts must be secular."
 AFG_modernise_the_treatment_of_prisoners: "Modernise the Treatment of Prisoners"
 AFG_modernise_the_treatment_of_prisoners_desc: "During the civil war, Mohammad Nadir Shah was exposed to the treatment of prisoners by all participants; brutality and cruelty were commonplace across the entire country. As such, we must modernise our prison system, and treat those who have done wrong with the respect reserved for our fellow men: we are not barbarians after all."
 AFG_tolerate_liberal_dissent: "Tolerate Liberal Dissent"
 AFG_tolerate_liberal_dissent_desc: "When you silence those who speak against you, you can no longer hear the ones who make plans. Allowing dissent and criticism of the government is both a common-sense standard for a modern nation, and a way to keep an eye on any potential enemies of the state."
 AFG_abolish_anti_dhimmi_discrimination: "Abolish Anti-Dhimmi Discrimination"
 AFG_abolish_anti_dhimmi_discrimination_desc: "As it stands, the Dhimmi in Afghanistan are required to pay the Jizya tax as non-believers, and must wear clothing marking them as such. What have we become when we allow our fellow Muslims to treat those who are not part of the Ummah as second-class citizens? It goes against our very teachings! The state must make an effort to undo these medieval customs: all are Afghan, regardless of faith."
 AFG_the_kindling_of_constitutionalism: "The Kindling of Constitutionalism"
 AFG_the_kindling_of_constitutionalism_desc: "While Mohammad Nadir Shah rules with an iron will, this will not be necessary for the rest of Afghanistan's history. The decisions we make are the seeds planted for a society that needs not potentially rely on the will of an unworthy King, but upon the rights a proper King grants to his subjects. One day, Afghanistan will truly be modern: this is why we move steadily."

 AFG_the_steady_hand: "The Steady Hand"
 AFG_the_steady_hand_desc: "Afghanistan is fresh out of a civil war, the latest of far too many. To begin drastic changes now, after deposing Amanullah for his radical reforms, would be suicide. We must instead improve Afghanistan with as few changes as possible, while securing the loyalty of the state."
 AFG_facilitate_the_growth_of_native_industry: "Facilitate the Growth of Native Industry"
 AFG_facilitate_the_growth_of_native_industry_desc: "Compared to the rest of the world, our economy lags far behind. We need to ensure, before any changes can be made, that we have industries necessary for a modern nation. We shall enact protectionist policies for domestic businesses, and invest directly into the economy."
 AFG_develop_a_loyalist_legislature: "Develop a Loyalist Legislature"
 AFG_develop_a_loyalist_legislature_desc: "The reign of Amanullah was simply one long series of mistakes, unneeded errors that he blindly fell into despite those around him spotting them prior. His desire to rule from above, without seeking the legitimacy of those who lift him up to those heights, was perhaps chief amongst those mistakes. Through having a national legislature, stacked to the brim with loyalists, we can much more easily justify our actions, and have a scapegoat for our most controversial policies."
 AFG_adopt_the_vilayet_system: "Adopt the Vilayet System"
 AFG_adopt_the_vilayet_system_desc: "The administration of Afghanistan is built upon agreements and loyalty pledges between the King and various tribes and villages. The result is a hodgpodge of relationships that limit our authority. We must borrow the Vilayet from our Turkish brothers to the West, and establish a system of administrative municipalities to simplify governance and streamline development. "
 AFG_conciliation_and_progress_committees: "Conciliation and Progress Committees"
 AFG_conciliation_and_progress_committees_desc: "Much of the country has been scarred and scorned from endless fighting and bloodshed. The results are deep fissures within society that may turn to even more conflict. We need to establish bodies dedicated to resolving conflicts and reconcilling our deeply divided country, so that we continue together in peace."
 AFG_reform_the_dar_ul_muallemin: "Reform the Dar-ul-Muallemin"
 AFG_reform_the_dar_ul_muallemin_desc: "A lifeline to modernity is a proper education for all, a task that has remained unfinished for years. If we are to get serious about bringing education and literacy to our people, we need to expand our capabilities. The Dar-ul-Muallemin is woefully unprepared for such a responsibility, an error we must correct."
 AFG_reorient_tribal_army_contributions: "Reorient Tribal Army Contributions"
 AFG_reorient_tribal_army_contributions_desc: "The tribes of Afghanistan historically have sent men to the Army as part of our conscription system. King Amanullah made many changes to the system, angering the tribes enough for them to lend us their support. Now, it is time for us to give back: let us change how our allies deliver their quota of soldiers."
 AFG_refilling_the_treasury: "Refilling the Treasury"
 AFG_refilling_the_treasury_desc: "All war is expensive, especially civil wars, when control of the country is at its weakest. As a result, we have enormous deficits to cover, both for our debts and our projects. We must begin increasing our taxation efforts in order to refill our coffers."
 AFG_reintroduce_purdah: "Reintroduce Purdah"
 AFG_reintroduce_purdah_desc: "Our allies amongst the more conservative parts of society have lent us plenty of support and stability for our reign, and we must return the favour by reforming society in their vision. One such topic is that of the exposure of women, an indecent development propogated by western powers. Purdah shall be reinstated, forbidding the exposure of women to those outside of family."
 AFG_crack_down_on_anti_islamic_westernism: "Crack Down on Anti-Islamic Westernism"
 AFG_crack_down_on_anti_islamic_westernism_desc: "Thanks to Amanullah, vices from across the world have made their bed in Afghanistan: drinking, gambling and other activities too indecent to mention. As the Guardian of Islam in Afghanistan, it is the responsibility of the King to fight against this immoral behaviour, and ensure his subjects live pious lives."
 AFG_grant_key_positions_to_the_mojadidis: "Grant Key Positions to the Mojadidis"
 AFG_grant_key_positions_to_the_mojadidis_desc: "None of the Ulema have the power and influence to match that of the Mojadidis. Scholars of a high calibre, the Mojadidis are needed in our government, to ensure the will of the King is both pious and wise. We shall invite them into key positions within the Kingdom, so that their judgement may advise the King."
 AFG_the_ulema_tribunal: "The Ulema Tribunal"
 AFG_the_ulema_tribunal_desc: "The Ulema have historically been the formost scholars of the Quran, and as such act as judges of Sharia law. Who better to bring justice to the wrongdoers and enemies of Afghanistan? We shall put together a tribunal of the wisest Ulema to head our efforts in dealing with legal matters, especially those involving our enemies."
 AFG_brotherly_cooperation: "Brotherly Cooperation"
 AFG_brotherly_cooperation_desc: "One of the most important bodies of people in Afghanistan is that of the family, and there is no family more important to the running of the country than the Royal Family, especially the brothers of Mohammad Nadir Shah. It is in the best interest of all that Nadir's brothers work to support the King: he cannot govern without them."

 AFG_the_cabal_of_kabul: "The Cabal of [267.Controller.GetVictoryPointName_10737]"
 AFG_the_cabal_of_kabul_desc: "Nadir lays dead, no doubt at the hands of the Amanites, yet the nation stands firm against their insurrection. The late king's brothers, led by Hashim, have restored order with the help of Marshal Momand, and Zahir succeeded his father to the throne. The King's uncles will continue to ensure stability, destroying the nation's enemies and bringing it back to its roots."
 AFG_developing_a_pashtun_state: "Developing a Pashtun State"
 AFG_developing_a_pashtun_state_desc: "Germany is a German nation, France is a French nation, and Russia is a Russian nation, even with many minorities within their borders. Therefore why should Afghanistan, the homeland of the Pashtuns, not accept itself as a Pashtun nation? Our nation's language must be that of the Pashtuns, its culture must also be Pashtun, and so must its leadership."
 AFG_aid_the_refinement_of_pashtun_society: "Aid the Refinement of Pashtun Society"
 AFG_aid_the_refinement_of_pashtun_society_desc: "While Pashtun culture shall be Afghan culture, we must not neglect to improve upon Pashtun society as well. Many traditions nowadays can be construed as backwards, perhaps even barbaric. We must show the world that the Pashtun people are a modern people, whose culture demands respect given to any other people of the world."
 AFG_the_family_circle: "The Family Circle"
 AFG_the_family_circle_desc: "When Mohammad Nadir Shah passed, it was his brothers who pulled the nation together, and it shall be the brothers who continue to guide Afghanistan out of her darkest hour. To do this, only those trusted by the King's family and their circle shall be granted power in the realm, lest we tempt fate to take another King."

 AFG_the_state_of_the_people: "The State of the People"
 AFG_the_state_of_the_people_desc: "For the first time in history, Afghanistan is no longer a royal fief, but a state led by the people, for the people. This is a joyous occasion: Afghanistan moves where she has never gone before!"
 AFG_consolidation_of_the_republic: "Consolidation of the Republic"
 AFG_consolidation_of_the_republic_desc: "With the royal family ousted from power, Afghanistan sits upon the precupice of change. Already the systems of old have been wiped away, and replaced with new institutions, designed specifically for the people. A new constitution, a new legislative body; everything must be touched by revolutionary vigour."

 AFG_foundations_of_the_peoples_party: "Foundations of the People's Party"
 AFG_foundations_of_the_peoples_party_desc: "Mohammad Gul Khan Momand has set out on a visionary path, to forge a political party worthy of guiding our fledgling republic. This party shall be loyal to the nation of Afghanistan and her people above all, for what party can guide Afghanistan better than one dedicated to the people?"
 AFG_rewarding_army_loyalists: "Rewarding Army Loyalists"
 AFG_rewarding_army_loyalists_desc: "Our friends in the army were the key to our victory in proclaiming a republic, and for that we must reward them. Promotions, political influence and much more shall be expended for our allies, further intertwining our party with the Armed Forces, to keep our nation secure."
 AFG_intensify_army_westernisation_efforts: "Intensify Army Westernisation Efforts"
 AFG_intensify_army_westernisation_efforts_desc: "With Afghanistan no longer needing to heed reactionary or monarchist critics, it is time we fully renovate our Armed Forces. Progress has been made, yes, but so much more could be done to bring our soldiers to the forfront of modern warfare, efforts we will waste."
 AFG_legitimisation_of_rule: "Legitimisation of Rule"
 AFG_legitimisation_of_rule_desc: "The republic and her people's party are in their infancy, leaving many with opportunities to undermine and outmaneuver us. We cannot afford any of our opponents the luxury of defining this new Afghanistan: we must consolidate power and enact policies that legitimise our rule."
 AFG_reformation_of_the_tax_system: "Reformation of the Tax System"
 AFG_reformation_of_the_tax_system_desc: "Finally, we can free ourselves from the burdensome and backwater taxation system we have. No longer will tribes pay tribute in goats and flocks: a modern Afghanistan needs money to fuel its new economy and fund our government."
 AFG_building_an_afghan_intellectual_class: "Building an Afghan Intellectual Class"
 AFG_building_an_afghan_intellectual_class_desc: "The lynchpin of any republic is an intellectual leadership with the resources and education necessary for governance and politics. We must build a new class of Afghans, as humble as our villagers, prosperous as our landowners, and as learned as our Ulema. They will be the future of Afghanistan."
 AFG_answer_the_plight_of_women: "Answer the Plight of Women"
 AFG_answer_the_plight_of_women_desc: "We have let backwards traditions define the role of women for too long. Now that our state is both secular and progressive by design, we can enshrine full equality into our nation, and bring equality to our Afghan sisters."
 AFG_concede_to_the_conservatives: "Concede to the Conservatives"
 AFG_concede_to_the_conservatives_desc: "The stability lent by socially conservative members of society is important for the future of our republic. We must take care not to overburden our satisfied critics with reforms that may defy their traditions. We will do what we can, but Afghanistan stays traditional for now."
 AFG_initiate_land_reform_efforts: "Initiate Land Reform Efforts"
 AFG_initiate_land_reform_efforts_desc: "Land can no longer be what determines the society an Afghan citizen is born in. We must ensure that land is plentiful and legal to obtain for our people. A series of reforms shall be enacted to creat a new class of loyal homesteaders without the scourge of aristocracy."
 AFG_harness_pashtun_nationalism: "Harness Pashtun Nationalism"
 AFG_harness_pashtun_nationalism_desc: "The Pashtun people can hardly be described as a nation, many still have little except cultural practices binding them to each other. If you ask a man in Bati Kot who his people are, he will tell you that the Shinwari are, not the Pashtuns. Men without a nation are always at threat of becoming slaves of those who are, a fate too many Pashtuns have been forced to endure. Building this national identity and uniting our people under it must therefore be a top priority."
 AFG_stacking_the_deck: "Stacking the Deck"
 AFG_stacking_the_deck_desc: "The new Afghan citizen is educated, nationalist, and loyal to his party above all. Such a man deserves a taste of governance: we shall begin promoting our new middle class citizens to positions of power in the administration and the party, to ensure their loyalty while crafting the apparati necessary for a modern nation-state."
 AFG_father_of_afghan_azadism: "Father of Afghan Azadism"
 AFG_father_of_afghan_azadism_desc: "What once was a passion project for those who sought to purify Afghanistan in the army has blossomed into a fully fledged national movement. Azadism has begun to enlighten the people of Afghanistan and the truth of Pasthun heritage. It is all thanks to one man, our supreme leader, Mohammad Gul Khan Momand!"
 AFG_the_padishah_president: "The Padishah President"
 AFG_the_padishah_president_desc: "To steer Afghanistan towards being a proper nation, we need a leader with the iron will of the Padishahs before him. The power now in the President's hands is perhaps even greater than his predecessors, and yet it will not corrupt him. He shall serve his people, and uplift the nation for the benefit of all of the Pashtun people."
 AFG_the_aryana_ideal: "The Aryana Ideal"
 AFG_the_aryana_ideal_desc: "The Pashtun nation has long been plagued by rumours and legends of a Semitic origin, with fools claiming we come from such weak and perfidious shepherds. They have been blinded by the obvious truth: we are the descendants of the Aryan peoples, the warriors of ancient times, who conquered a vast empire from Persia to India. These are our true ancestors, and we must reforge our identity to reflect this!"
 AFG_prince_of_the_republic: "Prince of the Republic"
 AFG_prince_of_the_republic_desc: "Mohammad Daoud Khan is a man who stands in two worlds: he is the founding father of our republic, yet he comes from the royal family. How can such a man be our leader? Only a man who knows the ways of a ruler may shepherd our nation towards its destiny. Mohammad Daoud Khan shall be given the full reigns of the republic, and guide us to glory."
 AFG_cementation_of_the_party_state: "Cementation of the Party State"
 AFG_cementation_of_the_party_state_desc: "Our victory in establishing a proper republic is not based upon luck, nor is it based upon a divine mandate to rule. It is based upon the will of the people, the only force that truly matters. As our party represents the people, we must ensure that it is present at every facet of government."
 AFG_the_balanced_veneer: "The Balanced Veneer"
 AFG_the_balanced_veneer_desc: "While both men clearly have ambition to be the most powerful man in the country, the President and Prime Minister have been forced to recognise that they both stand to gain through ruling together as equals. It would be a fantasy to expect politicking to take a back seat forever, but at least for now this balance will be maintained."
 AFG_the_man_behind_the_eagle: "The Man Behind the Eagle"
 AFG_the_man_behind_the_eagle_desc: "As the nation's president, Momand has saved the nation from chaos and destruction, but he does not rule alone. Behind the great Eagle is the Prince, Daoud Khan, who allows Momand to be the face of the nation, while Daoud ensure that the government's will is enforced with many unaware of how great the power he holds truly is."
 AFG_uphold_the_democratic_facade: "Uphold the Democratic Facade"
 AFG_uphold_the_democratic_facade_desc: "The truth of choice for the people of Afghanistan is too large a burden for them to truly bear. Too many enemies can take advantage of them: demagogues, reactionaries, monarchists and more can sweep in when aimless discontent builds, and ruin what we sacrificed so much to create. Therefore, we must ensure that all choices made by the people are under our tutelage, without breaking the image of a free democracy."

 AFG_from_the_frontier_to_the_heartlands: "From the Frontier, to the Heartlands"
 AFG_from_the_frontier_to_the_heartlands_desc: "When the Kingdom first acquired the Frontier, it quickly became apparent that the heartlands had no capacity to rule it. Pashtunistan was forced to rule itself, creating its own parties, local elections, and legislature, becoming arguably more of a nation than the one that had annexed it. With the heartlands now not even able to rule itself, it seems Pashtunistan must step in once more."
 AFG_assurances_to_afghan_minorities: "Assurances to Afghan Minorities"
 AFG_assurances_to_afghan_minorities_desc: "For too long Afghanistan has relied upon the suppression of local cultures and peoples, as a consequence of royal authority and then Pashtun nationalism. In building of a new Afghanistan, we must do what we can to ensure that Afghanistan is welcome to all, regardless of tribe, language or culture."
 AFG_establish_a_universal_schooling_system: "Establish a Universal Schooling System"
 AFG_establish_a_universal_schooling_system_desc: "For many in Afghanistan, an education is a privilege, rather than a fundamental right available to all. Those deprived of education can hardly be expected to rise above their lowly stations, and will simply accept the mediocracies and injustices of their lives. A national education system, available to every Afghan no matter their station, must therefore be one of the government's upmost priorities."
 AFG_adaption_of_the_frontiers_systems: "Adaption of the Frontier's Systems"
 AFG_adaption_of_the_frontiers_systems_desc: "The frontier's democratic experiment created a political ecosystem inside the kingdom, where suffrage was without question, plurality was the norm, and freedom ruled the streets. Truly, it was a shining example of what Afghanistan could be. We must do what we can to adapt the laws, practices and electoral systems the frontier nurtured to the rest of the nation."
 AFG_nurture_afghan_democracy: "Nurture Afghan Democracy"
 AFG_nurture_afghan_democracy_desc: "Centuries of autocratic rule have been undone in a fraction of the time; Afghanistan needs to heal, lest the nation falls to authoritarianism once more. However, it is possible to ensure Afghanistan remains democratic without harming our democracy: let us pluralise the political system, and give our people a chance to govern themselves, and strengthen against those who say they cannot."
 AFG_the_fight_against_feuds: "The Fight Against Feuds"
 AFG_the_fight_against_feuds_desc: "Vendettas and longstanding grudges dominated tribal and familial relations throughout Afghan history. For many, the civil wars that plagued us were opportunities to settle scores and obtain vengeance. Now that we are building a modern democracy, we need to establish ways to mediate such conflict, while promoting education and practices that encourage forgiveness and peaceful settlements."
 AFG_islamic_progressivism: "Islamic Progressivism"
 AFG_islamic_progressivism_desc: "Islam has been a tool of progress for centuries, expanding the rights of women, the downtrodden, and promoting science and reason. Yet, we have allowed power-hungry and backwards zealots to abuse Islam for their own gain, at the cost of others. We must do whatever we can to promote Islam as what it was meant to be: a force for Allah to move the world forward, not back."
 AFG_uplifting_the_rural_poor: "Uplifting the Rural Poor"
 AFG_uplifting_the_rural_poor_desc: "Poverty in Afghanistan is endemic, hitting those in the villages and tribes harder than anywhere else. For the backbone of our nation to live in squalor is an injustice that needs to be corrected. We shall introduce measures to ensure that the destitute of our people may not suffer, including ways to be self sufficient while having very little money."
 AFG_establishing_a_fair_judiciary: "Establishing a Fair Judiciary"
 AFG_establishing_a_fair_judiciary_desc: "The justice system of Afghanistan has long been a tool for the ruling government to suppress its enemies with legal justification, to promote a veneer of fairness. Now that Afghanistan moves towards a free and fair society, it is time that we ensure our judciiaries reflect this. No more shall judges be pawns of the powers that be: now, they shall be servants of justice!"
 AFG_erosion_of_feudal_power: "Erosion of Feudal Power"
 AFG_erosion_of_feudal_power_desc: "The social stratas of Afghanistan are woefully out of date, with social classes based upon land ownership even becoming the basis for laws and codes of justice. This legal and political inequality prevents the nation from moving forward: we must ensure all in Afghanistan have equal rights, regardless of birth, and defeudalise the ownership of land."
 AFG_combating_extravagance: "Combating Extravagance"
 AFG_combating_extravagance_desc: "The excess of the royal family was both expensive and unfair, and we are grateful it is gone. Unfortunately, many wealthy people in Afghanistan still try to live like royalty. How can the wealthy and powerful of the nation live on foreign luxuries as their people struggle to feed themselves? We must promote modesty amongst our people, to limit inequality and reliance on foreign goods."
 AFG_the_reformation_of_afghan_society: "The Reformation of Afghan Society"
 AFG_the_reformation_of_afghan_society_desc: "Afghanistan was once a nation based upon feudal laws, repressive traditions, and the emulation of the worst excesses of mankind. Now, not only is the nation modernised, it is also more fair, more tolerant, and more united than ever. May this new Afghanistan rise as a beacon of liberty and progress for all to see!"

 AFG_swept_by_the_red_tide: "Swept by the Red Tide"
 AFG_swept_by_the_red_tide_desc: "In the history of the worker's revolution, nobody ever expected Afghanistan to be home to a socialist movement. And yet, we have defied the expectations placed upon us by the reactionaries: Afghanistan shall soon wave a red banner atop the mountains, for all in Asia to see!"
 AFG_harmony_with_the_aia: "Harmony with the AIA"
 AFG_harmony_with_the_aia_desc: "Under guidance from Calcutta, the Frontier's socialists have spent many years cooperating with Ghaffar Khan and his people, and we see no reason to stop now. While we cannot ignore the significant disagreements between us, especially when it comes to issues of non-violence, those who stand for the poorest Afghan must not let petty problems divide them from their fundamental goals."
 AFG_the_national_united_front: "The National United Front"
 AFG_the_national_united_front_desc: "Afghanistan is in dire need of progressive forces that will create a society necessary to establish socialism. Therefore, we must form a coalition with the many progressive parties, organisations and movements in Afghanistan, to make sure our nation is strong against reactionary forces, and is one day ready for a democracy unblemished by inequality."
 AFG_reinforcement_of_ideological_purity: "Reinforcement of Ideological Purity"
 AFG_reinforcement_of_ideological_purity_desc: "We may see eye to eye with the Khans on our ultimate goals, but our inherent disagreements with how to achieve them will do nothing but hold us back if we continue to work with them. The new government must solely be comprised of those who believe truly in the socialist cause, and are willing to take up arms against the agents of capital who will not get tired of striking them no matter how many times they are presented the other cheek."
 AFG_crackdown_on_liberal_reformists: "Crackdown on Liberal Reformists"
 AFG_crackdown_on_liberal_reformists_desc: "Liberalism is a particularly subversive ideology, making surface level promises and changes to society to ensure capital can keep its hold on the working class. The only force able to truly liberate the people is that of our socialist party: reactionary reformists cannot be allowed to continue peddling their bread and circuses."
 AFG_develop_a_socialist_constitution: "Develop a Socialist Constitution"
 AFG_develop_a_socialist_constitution_desc: "The constitutions of the monarchists and reactionaries were always token papers meant to give the people the bare minimum, so that the ruling class could continue their oppression. No longer will we tolerate such useless rhetoric: We shall write a constitution built upon socialist ideals, ensuring legal and economic equality, while banning private property."
 AFG_the_islamic_socialist_ideal: "The Islamic Socialist Ideal"
 AFG_the_islamic_socialist_ideal_desc: "When Islam was introduced to the world, it was as a reaction to the merchants of Mecca, peddling their religions like fruit in a marketplace. Islam stood against such exploitation of faith, and dared the rich to give to the poor. These are notions the socialist movement sympathises with: we must make a conscious effort to intertwine Islam and socialism, for the two do not conflict."
 AFG_destroy_the_enemies_of_the_state: "Destroy the Enemies of the State"
 AFG_destroy_the_enemies_of_the_state_desc: "No more shall royal autocrats and zealous fanatics plague our people. No more will the opportunistic merchant or the praddling reformist seek to take advantage of reactionary tokenism. This is a revolution by the people, for the people: all who stand against us must be vanquished!"
 AFG_request_allied_military_aid: "Request Allied Military Aid"
 AFG_request_allied_military_aid_desc: "The enemies of the revolution are boundless in wealth and weaponry, a luxury we cannot afford. We must turn to those who assisted us in overthrowing our oppressors, the socialist movements of the East, and request their help once again."
 AFG_empowering_the_rural_labourer: "Empowering the Rural Labourer"
 AFG_empowering_the_rural_labourer_desc: "Perhaps Afghanistan is not an urban industrialised society, but the proletariat was not relegated solely to the city. As recognised by Bhagat Singh and our other Indian affiliates, the hardworking farmhands and labourers, forced to toil by hapless landowners and aristocrats, are as much proletariat as those in urban factories. These Kirti, those who lack the means of production, must be the backbone of our party and of our society."
 AFG_a_forceful_end_to_feudalism: "A Forceful End to Feudalism"
 AFG_a_forceful_end_to_feudalism_desc: "Feudalism has broken the back of the Afghan worker for too long, in exchange for a form of slavery even supporters of capital reject. We cannot suffer these hapless legal aristocrats much longer: we will break down and collectivise feudal land, and ensure that all who work the land are equal under the law and in ownership. Those who resist? Justice awaits them."
 AFG_equal_liberation: "Equal Liberation"
 AFG_equal_liberation_desc: "As exploitation does not discriminate, neither shall the liberation of the people. Historically, women have worked just as hard as any man, but thanks to the repressive forces of reaction, they are treated as second class. We shall ensure every man, woman and child is equal, and undo the centuries of female exploitation plaguing us."
 AFG_followers_of_the_prophet_and_of_marx: "Followers of the Prophet, and of Marx"
 AFG_followers_of_the_prophet_and_of_marx_desc: "Was it not the Quran and the Hadiths that demanded the rich distribute their wealth to the poor? Socialism is the lifeblood of the people, but Islam has championed the people long before industrial society existed. There is no contradiction between the two: the equality once granted to all by Allah has been made physical by the revolution."

 AFG_restore_the_foreign_ministry: "Restore the Foreign Ministry"
 AFG_restore_the_foreign_ministry_desc: "Now that we have secured our rule over the nation, it is time we turn our attention outwards. We have stayed isolated from the rest of the world for far too long. It is time we reestablish our foreign ministry, so that we may begin reintegrating into international relations."
 AFG_prioritise_the_defence_of_loy_afghanistan: "Prioritise the Defence of Loy Afghanistan"
 AFG_prioritise_the_defence_of_loy_afghanistan_desc: "The Third and Fourth war against the British secured not only Afghan independence, but Pashtun unity, yet the wheels of destruction continue to turn. If we do not continue to vigilantly defend the nation, it may be once again subjugated and threatened with partition. We therefore must begin preparations for the fortification of our outer provinces, to ensure that we are ready for an attack from any direction."
 AFG_defending_the_borders: "Defending the Borders"
 AFG_defending_the_borders_desc: "Our efforts to protect our borders have been put in motion. Our soldiers patrol the roads into our heartlands. We have drawn up plans to massively increase our fortification abilities wherever they are necessary. The skulls of our enemies will line the base of our mountains if they step one foot on our land."
 AFG_the_afghan_war_effort: "The Afghan War Effort"
 AFG_the_afghan_war_effort_desc: "Just as during the Great War, the Afghans once again find themselves embroiled in conflict between the world's great powers. While in retrospect our performance in the Great War was a poor showing, masked heavily by Indian weakness, we now have the chance to prove how far we have come by being the David to strike down the enemy Goliath."
 AFG_rally_the_tribesmen: "Rally the Tribesmen"
 AFG_rally_the_tribesmen_desc: "The borders have fallen, and our towns and villages find themselves being actively pillaged by foreign invaders. There is no one in Afghanistan who is not driven to anger and rage by this barbaric destruction, and even those who consider themselves enemies to the government will gladly take up arms in its defence to drive a common foe back across the Khyber!"
 AFG_detente_with_india: "Détente with India"
 AFG_detente_with_india_desc: "Violence has never been the answer, a principle both the AIA and many of the Indian people hold firm in, despite the sins of our predecessors defining our relationship through it. It is time now to reach across to the Indians and peacefully resolve our lingering disputes with them, seeking harmony and the recognition of continued Pashtun unity and dispelling any lingering ideas of irredentist reconquest of the Frontier."
 AFG_liberating_the_colonised_pashtuns: "Liberating the Colonised Pashtuns"
 AFG_liberating_the_colonised_pashtuns_desc: "Our efforts in returning our Pashtun brothers and sisters into the fold of our nation is not yet finished: to the east and south many of our fellow Pashtuns, the Balochs especially, lay under Indian oppression. To the north, former Afghan lands remain apart from us, having been stolen from us as part the Russo-British Great Game, and even to the west more Pashtuns languish under [PER.GetAdjective] rule. It is our duty to see to their liberation!"
 AFG_the_conquest_of_karachi: "The Conquest of Karachi"
 AFG_the_conquest_of_karachi_desc: "For the first time in history, Afghanistan is no longer a landlocked nation. Our acquisition of Karachi has given us a port city, and with it innumerous benefits. We must do what we can to integrate these territories into our nation, and ensure a connection to the ocean that will last centuries!"
 AFG_lay_the_first_brick: "Lay the First Brick"
 AFG_lay_the_first_brick_desc: "Now that we have access to the open waters, we can finally build ourselves a navy. The construction of a naval force shall be our upmost priority, and grant us protection necessary for any international shipping. No longer will we rely on others to protect our trade: we can protect our own."
 AFG_establishing_a_shipping_industry: "Establishing a Shipping Industry"
 AFG_establishing_a_shipping_industry_desc: "With access to a port comes access to the international shipping lanes that web across the entire globe. Tapping into market access demands a proper industry to send and receive trade goods. We must invest heavily in shipping, and integrate the industry so deep into the economy it can never be let go."
 AFG_avenging_the_great_game: "Avenging the Great Game"
 AFG_avenging_the_great_game_desc: "In the nineteenth century, Afghanistan found itself at the mercy of Russia and Britain, a pawn in what was called the Great Game between the two powers. Now that we have found ourselves stronger, modernised, and unified, we can reassert ourselves against those who helped undermine our sovereignty, starting with the Russian pawns in Central Asia."
 AFG_extend_our_authority_to_darwaz: "Extend Our Authority to Darwaz"
 AFG_extend_our_authority_to_darwaz_desc: "Authority over the Emirate of Darwaz shifted rapidly between rulers towards the end of the last century, and despite the best attempts of multiple Afghan rulers its conquest was never completed. Now that it is finally under our control, it would be a shame to simply abandon it, rather we should assert our authority fully over it and the surrounding regions."
 AFG_unify_pashtunistan: "Unify Pashtunistan"
 AFG_unify_pashtunistan_desc: "Our acquisition of [442.Controller.GetVictoryPointName_12717] was not the end of our Pashtunistan offensive. Now that we are stronger, and our military has been fully modernised, we can finally complete our unification with our Pashtun brothers and sisters in India."
 AFG_free_the_western_balochs: "Free the Western Balochs"
 AFG_free_the_western_balochs_desc: "Despite some differences between us, the Baloch people are more akin to us than any of those around them, being seen by some within our nation as a subcategory of Pashtun and to others as more akin to cousins. Few dispute however the need for them to have a free homeland, and we shall liberate those under [PER.GetAdjective] rule to unite them with their brothers and sisters in Afghanistan. "
 AFG_champion_of_islam: "Champion of Islam"
 AFG_champion_of_islam_desc: "At long last, every Muslim from the Indus to the Ural find themselves freed from their imperialist oppressors, liberated by the brave mujahideen fighters of Afghanistan! No more shall they be subject to apostate rule or imperial oppression. Islam can flourish, unburdened by foreign control, and the Ummah can rest easy, knowing we are their guardian!"

### Bookmark ###
 AFG_KR_gathering_storm_desc: "The reign of King Amanullah Khan has been one of many extremes. Regicide and a coup, entry into the world war, a decade of westernisation, and multiple violent rebellions that almost brought his reign to an end; the King has seen it all.\n\nThe Afghan state, stretching from Herat to Peshawar, enters 1936 hoping to put past troubles behind it, and cement its place amongst the modern nations of the world. Many of the King's enemies still lurk in the shadows however, threatening to quash those hopes if given the opportunity."

### Intro Screen ###
 AFG_country_intro_background: "GFX_AFG_intro"
 AFG_country_intro_header: "Recent History of Afghanistan: The Weltkrieg"
 AFG_country_intro_content: "When the Weltkrieg began, Afghanistan, then just an Emirate under British protection, chose neutrality over being drawn into the conflict. This neutrality was not destined to last however, with the Caliph's call for Jihad against the Entente and irredentist desires to retake former territories in India quickly fomenting pro-war sentiments. The first domino began to fall when in August 1915 a joint Ottoman-German expedition, led by Oskar von Niedermayer and Werner Otto von Hentig, arrived in Afghanistan with the goal of encouraging a revolt against Britain by both the Afghans and the Indians.\n\nDespite their best efforts, the Afghan Emir Habibullah Khan would refuse to take part in any war against Britain, believing the risk too great on Afghanistan's part to justify it, with both Russia and British India able to easily crush Afghanistan if war were to break out. Believing their mission to have failed, the expedition departed the following year, unaware of how influential their visit had been. The Emir's brother Nasrullah, and his second son Amanullah, were significantly influenced by the expedition, believing that Afghanistan had much to gain from war against Britain and national reform. An alleged secret conspiracy between the two would result in the assassination of Habibullah in February 1919, with the Emir shot in the head by an unknown assassin during a hunting trip.\n\nThe following weeks saw the ascension of Nasrullah to the throne, supported by the late Emir's eldest son Inayatullah, but also saw him ousted by Amanullah in a sudden betrayal. Nasrullah would initially surrender to Amanullah in an attempt to avoid bloodshed, with the new Emir promising his safety, but allegedly following a warning from an Ottoman diplomat Nasrullah chose to flee the nation, ultimately ending up in Constantinople. Amanullah would be fully recognised as Emir by the end of February, and an investigation in April found Nasrullah complicit in the assassination, with him being sentenced in absentia to life in prison. With his rule now secure, the Russians out of the war, and the British garrisons in India depleted by redeployments to Europe in preparation for the May Offensive, Amanullah would at last take up the German offer and launch an attack against India in May 1919.\n\nAlthough they were unable to secure military help from the Central Powers due to their isolated position, the almost undefended Indian border was quickly overrun by Afghan troops. Soon after, once news of their intervention had arrived, they were able to at least receive official recognition from the German and Ottoman governments. Fighting would last just over a month, as an armistice would be signed between the Central Powers and the Entente by August. Elated in their victory, an Afghan delegation was sent to the later peace talks, led by Foreign Minister Mohammad Wali Khan Darwazi, resulting in a peace treaty between the British and the Afghans by November. Despite great desires of annexation of the North-West Frontier Province, the Durand Line would continue to be recognised as the border, but explicit recognition of Afghan independence would be received in its stead."

 AFG_country_intro_header_1: "Recent History of Afghanistan: The Road to Loy Afghanistan"
 AFG_country_intro_content_1: "Now fully free from British control, the new Emir turned his focus towards meeting the demands to begin reforming the Afghan state. Taking significant influence from his father-in-law, the reformer Mahmud Tarzi, Ottoman and European inspired reforms would take place across all aspects of Afghan society. New schools staffed with Turkish teachers were established, German and Russian businesses opened in Kabul, and with Russian support the armed forces oversaw significant modernisation efforts. Although well received by sections of society, especially the urban elites, growing unrest against this westernisation quickly spread across the nation's tribes. The most controversial reforms, such as the growing rights of women, the abolishment of child marriage, and the implementation of conscription, were enough to drive rebellion against the central government.\n\nIn March 1924 the first major rebellion against Amanullah's reforms broke out, with tribesmen led by members of the ulema rising up against Amanullah in Khost, just south of Kabul. Fighting between government troops and rebellious tribesmen lasted almost an entire year, with the government initially not taking the rebellion seriously. The persistence of the rebels and their growing strength however saw significant escalation in the crackdown against them, with a proper airforce being established using Russian aid to more effectively deal with the rebels. Although eventually crushed, the rebellion marked the first major pushback against Amanullah's reforms, and saw a reevaluation of government priorities. The violent end to the religious leaders of the rebellion also did not go unnoticed, and bred a permanent disdain for Amanullah amongst the ulema.\n\nRebellion during this period was not just limited to Afghanistan however, with the Afghan leadership quickly shifting their attention towards the ongoing collapse of the British Empire, and growing unrest in neighbouring India. By March 1925 civil war had effectively begun in the subcontinent, although the Khost rebellion limited Afghanistan's ability to react to it. Instead of outright military invasion, efforts were shifted towards aiding rebellions in the North-West Frontier Province, or NWFP, particularly in the Waziristan region. By January 1926 the Afghan army was perceived by its leadership as having recovered enough, and on the orders of Amanullah an invasion was launched in support of the tribal rebellions.\n\nLed by Minister of War Mohammad Nadir Khan, the Afghan forces once again overwhelmed the Frontier just as they had done during the Weltkrieg, with British troops withdrawing from the region. Despite great hopes of conquering more, major defeats when attempting to assault Quetta and to cross the Indus led to the halting of further offensives in favour of consolidating their grip on the NWFP. Although no official peace treaty would ever be signed, what would become known as the Fourth Anglo-Afghan War was quickly recognised as over by both sides after only a few weeks of fighting."

 AFG_country_intro_header_2: "Recent History of Afghanistan: The Realities of Rule"
 AFG_country_intro_content_2: "What should have been a great victory for Afghanistan slowly instead became seen as a white elephant over the next decade, with control of the Frontier being much more difficult than Amanullah or his ministers ever expected. Although faced with little direct opposition to rule from Kabul, with the annexation being widely supported, running a region more prosperous and almost as populous as Afghanistan itself while Afghanistan remained so backwards quickly proved almost impossible. The Frontier, commonly becoming known as \"Pashtunistan\", would have to run itself, especially as Amanullah's attention began to return back to the heartlands.\n\nIn the quagmire the two brothers Abdul Ghaffar Khan and Abdul Jabbar Khan, leaders of the Anjuman-e-Islah-e Afghania, began to slowly pick up the pieces, quickly becoming the de facto leaders of Pashtunistan. Over the next two years the Khans oversaw the establishment of a local government in Peshawar, modelled after the Indian institutions they were used to, creating an almost second nation within Afghanistan, although with no desire from either side to see the two actually separate. While receiving no direct official recognition from Kabul, much like the Frontier's original takeover the new status quo has ever since simply been tacitly acknowledged by both sides, with Pashtunistan content to continue to run itself as part of Afghanistan, and Amanullah content as long as they continue to pay their taxes and recognise his rule.\n\nBack in the heartlands the wheels of reform continued to spin, especially following the back to back realities of Afghanistan being both unable to rule itself administratively and militarily. The next few years resulted in a great intensification of Westernisation efforts, beginning with Afghanistan rebranding itself away from being an Emirate to being a Kingdom, bringing it more in line with the more modern nations of the world, with this being accompanied by a series of flag changes until a black, white, and green tricolour was eventually settled upon years later. Plans for a great new capital next to Kabul, to be known as Darulaman, were put into motion, with a team of German engineers recruited to build the city to European standards. Further funding was given to the armed forces, with many officers being sent to Russia for training, although consequentially imparting many ideas of the growing nationalist movement in Russia upon them.\n\nTowards the end of 1927 and the beginning of 1928, King Amanullah departed on a grand European tour, achieving great diplomatic renown for the kingdom by touring alongside the leadership of Europe's great nations, and presenting himself as an equal to Kaiser and Caliph. Emboldened by these successes, the following year upon his return from Europe saw an even greater advancement in national reform, much to the opposition of the nation's tribal and religious leadership. The Loya Jirga in August 1928, in which the Queen publicly removed her veil alongside other noblewomen, was seen as the final straw to many, even Amanullah's former allies. Within months a rebellion, much greater than Khost, erupted in the north of the nation, led by the bandit leader Habibullah Kalakani."

 AFG_country_intro_header_3: "Recent History of Afghanistan: The Saqqawists and Stagnation"
 AFG_country_intro_content_3: "Beginning initially with a revolt by Shinwari tribesmen against the crown, the ongoing discontent in Afghanistan alongside the collapse of Russian authority in Central Asia following General Boldyrev's coup attempt allowed a Tajik dominated army known as the Saqqawists to seize control of much of northern Afghanistan in the chaos. By September 1929 most major cities in the north had surrendered to the rebels, who began plans to assault the capital. By October thousands of rebels marched against Kabul, with more and more flocking to their banner with every passing day. The siege however ended in failure for the rebellion, with their leader Kalakani killed in the fighting. Notably forces sent from Pashtunistan, commanded by local leaders, proved to be vital in seeing off the attack. Latent rebellions by the Saqqawists continued for the next year, with Kalakani's uncle Purdil Khan fighting until a crushing defeat near Herat led to his retreat across the border into Khiva.\n\nThis potential complete collapse of the Amanite regime, combined soon after with the almost complete withdrawal of Russian influence as part of their 1931 budget, resulted in multiple years of almost complete stagnation for Afghanistan when compared to the past decade. Finally adhering to the advice of those branded as naysayers, many of Amanullah's planned reforms were curtailed for the sake of national stability. Although Darulaman was declared to be finished by 1933, the reduction in German aid the same year similarly hindered any further developments. The ascension of Boris Savinkov as Russian president in the following year however provided at last some relief to the stagnating Afghan state, as the new government quickly moved to restore Russian influence in the region, especially towards Afghanistan and neighbouring Persia.\n\nComing now to the start of 1936, the reformist ambitions of King Amanullah appear to have at last gained the opportunity to reemerge. Foreign support for the government returning to the expected levels of the previous decade, and a grand plan for reforming the army has been tasked to the nation's Interior Minister Abdul Ahad Wardak. Whether or not these plans will go as well as the King and his ministers expect however, is something only time can tell."

 AFG_guide: "Page 1: Afghan Civil War & Amanullah Khan Derived Paths.\n\n§MThe Afghan Civil War§!\n£white_dot At the end of February 1939 a civil war will begin in Afghanistan, handled through decisions and events, between §fAmanullah Khan§! and §zNadir Khan§!.\n£white_dot When the war starts, the §YAnger§! against §fAmanullah§! is inversely converted into his §CStrength§!, limited to a minimum of 25% and a maximum of 75%\n£white_dot For §fAmanullah§! to win the war, his §CStrength§! must reach 100%. Completing the decision chain that begins with §Y$AFG_launch_an_assault_against_herat$§! will automatically grant 100% §CStrength§!.\n£white_dot For §zNadir§! to win the war, Amanullah's §CStrength§! must reach 0%, or 180 days have passed. Completing the decision chain that begins with §Y$AFG_drive_loyalists_from_jalalabad$§! will automatically reduce §CStrength§! to 0%.\n\n§MReturn of the King§! (§PPaternal Autocrat§! / §gAuthoritarian Democrat§!)\n£white_dot Win the Civil War as §fAmanullah Khan§!.\n£white_dot After winning the war, a subsequent event will allow the choice between a Reformist path if the Course of State is less than 25% towards the Traditionalist direction, or a Traditionalist path if it is less than 25% towards the Reformist direction\n£white_dot In the aftermath of the civil war, successfully complete the §Y$AFG_reasserting_amanullahs_authority_mission$§! mission.\n£white_dot If the Reformist option was taken, Afghanistan will become Authoritarian Democrat under the §gFerqa-i-Esteqlal wa Tajaddod§!, otherwise it will remain §PPaternal Autocrat§!.\n\n§MThe Durrani Conspiracy§! (§lSocial Liberal§! / §cSocial Conservative§!)\n£white_dot Win the Civil War as §fAmanullah Khan§!.\n£white_dot After winning the war, choose the Traditionalist option in the subsequent event.\n£white_dot Do not complete the §Y$AFG_reasserting_amanullahs_authority_mission$§! mission.\n£white_dot Amanullah will be assassinated, and Inayatullah Khan will become King.\n£white_dot In subsequent elections there will be the choice between either the §lHezb-e Demokratik Poshton§! under Ghulam Mohiuddin Arti or the §cHezb-e Islami§! under Abdul Hadi Dawi.\n\n§MThe Final Fall of Amanullah§! (§PPaternal Autocrat§! / §nNational Populist§!)\n£white_dot Win the Civil War as §fAmanullah Khan§!.\n£white_dot After winning the war, choose the Reformist option in the subsequent event.\n£white_dot Do not complete the §Y$AFG_reasserting_amanullahs_authority_mission$§! mission.\n£white_dot Amanullah will be killed by peasants storming the palace, and Mohammad Hashim Khan will become King under the §nBārakzai-Telai (Reactionary)§!.\n£white_dot Choosing to complete the focus §Y$AFG_lord_of_the_mob$§! will result in Afghanistan turning Paternal Autocrat under the §PBārakzai-Telai (Palace)§!."
 AFG_guide_1: "Page 2: Nadir Khan Derived Paths.\n\n§MTo the Victor...§! (§PPaternal Autocrat§!)\n£white_dot Win the Civil War as §zNadir Khan§!, taking power as the §PBārakzai-Telai (Palace)§!.\n£white_dot In the aftermath of the civil war, successfully complete the §Y$AFG_stabilise_the_realm_mission$§! mission.\n\n§MThe Cabal of Kabul§! (§PPaternal Autocrat§!)\n£white_dot Win the Civil War as §zNadir Khan§!.\n£white_dot Do not complete the §Y$AFG_stabilise_the_realm_mission$§! mission.\n£white_dot Nadir will be assassinated, with Mohammad Gul Khan Momand temporarily becoming regent.\n£white_dot If the §YCourse of State§! is towards the Traditionalist side, Momand will hand power over to Hashim Khan, installing Nadir's son Zahir as the new King under the §PBārakzai-Telai (Palace)§!.\n\n§MFoundations of the People's Party§! (§gAuthoritarian Democrat§! / §PPaternal Autocrat§! / §nNational Populist§!)\n£white_dot Win the Civil War as §zNadir Khan§!.\n£white_dot Do not complete the §Y$AFG_stabilise_the_realm_mission$§! mission.\n£white_dot Nadir will be assassinated, with Mohammad Gul Khan Momand temporarily becoming regent.\n£white_dot If the §YCourse of State§! is towards the Reformist side, Momand will declare a republic, becoming president under the §gHezb-e Khalq (Reformist)§!.\n£white_dot If the Pashtunistan Autonomous Province was established, negotiate with Ghaffar Khan to stabilise the republic. \n£white_dot In subsequent events investigating Nadir's assassination, committing to investigate the Royal Guard and Daoud Khan will result in him being purged and Momand taking full power as the §nHezb-e Khalq (Azadist)§!.\n£white_dot Choosing instead to investigate the army and those around Momand will Afghanistan Paternal Autocrat under §PHezb-e Khalq (Loyalist)§!\n£white_dot Alternatively investigating the Amanites will keep Afghanistan Authoritarian Democrat.\n\n§MFrom the Frontier, to the Heartlands§! (§SSocial Democrat§! / §mMarket Liberal§! / §cSocial Conservative§!)\n£white_dot During the Pashtunistan Crisis, choose to negotiate with the Khans and establish the Pashtunistan Autonomous Province.\n£white_dot Follow the Foundations of the People's Party section until an event is reached regarding Pashtunistan.\n£white_dot Choose to send troops to take control of the Frontier.\n£white_dot This will fail, and troops loyal to the autonomous government will take control of the capital in the aftermath.\n£white_dot Once they have taken control, choose to invite Ghaffar Khan to organise the new government under the §SAnjuman-e-Islah-e Afghania§!.\n£white_dot During repeating election events, it will be possible to elect the §cHezb-e Islami§! under Abdul Hadi Dawi or the §mTehrik-i-Naujawanan Baidar§! under Abdul Hai Habibi.\n\n§MSwept by the Red Tide§! (§RRadical Socialist§!)\n£white_dot Follow the above From the Frontier, to the Heartlands section until Frontier troops have taken the capital.\n£white_dot If Afghanistan borders any socialist nation, the option to become their puppet and remain socialist will become available.\n£white_dot A new government will be established with Ghulam Mohammad Ghobar as a figurehead president, under the §RHezb-e Watan§!.\n£white_dot Completing the focus §Y$AFG_followers_of_the_prophet_and_of_marx$§! will turn Afghanistan independent again."

### Events ###

 afghanistan_events.1.t: "The Wardak Report"
 afghanistan_events.1.d: "As the Afghan nation begins its journey into the new year, one man has been tasked with ensuring that its army actually enters it alongside them. Following discussions between the King, Afghan officers, and members of a Russian military attaché, Interior Minister Abdul Ahad Wardak has spent the past few months tirelessly drafting up plans for sweeping reforms of the Royal Afghan Army in hopes of bringing it up to par with the modern armed forces of the world. With the plan now completed, Wardak has met with the King this afternoon, having presented his report to him in full.\n\nAside from the most obvious elements of such a reform plan, like the adoption of newer equipment from the nation's allies, the plan proposes the establishment of a military academy based on the one in Ekaterinodar, the further promotion of non-royal officers to high level positions, and a stronger training regiment for all recruits. Most controversially however are plans to further crack down upon draft dodging, by targeting the corruption that facilitates it, as well as further integration of the tribal qaumi militias into the primary chain of command. While Wardak made clear to the King that these specific elements are likely to cause unrest, with conscription already being one of Amanullah's most unpopular policies, he has informed the king of his strong belief in their necessity.\n\nEven with these potential problems, the King has been reportedly extremely enthusiastic about Wardak's list of proposals, wishing to press on with implementing them as soon as possible. To that end a second meeting between the two has been arranged to occur in the next few days, where they will be joined by Nadir Khan, head of the Royal Army, in hopes of beginning these reforms as soon as possible."
 afghanistan_events.1.a: "Afghanistan shall soon be the Prussia of\nthe East!"

 afghanistan_events.2.t: "A Meeting with Nadir"
 afghanistan_events.2.d: "In contrast to the enthusiasm shown to the Wardak Report by the King, Nadir Khan's response to the report has been a rather negative one. While Nadir has expressed his agreement with large parts of the plan, he has drawn significant umbrage at the parts Wardak expected to be the most controversial. For Nadir, while the amount of draft dodging going on is far from ideal, he believes that it is a necessary evil to keep the tribes placated when it comes to conscription. For those who object to it, it allows them to oppose it in non-violent ways rather than attempting to tear the system down by force like they have attempted in the past. Furthermore he believes that any attempt to further integrate the qaumi will be seen as weakening the power of tribal leaders, who are unlikely to take such restrictions on their influence laying down.\n\nUltimately however, after enough time discussing with the King, he declared that he was willing to see the reforms through if that was what was truly desired, although he has requested that at a minimum they be approved by a loya jirga to further legitimise the reforms in the eyes of tribal leaders. While the man is always a cynic, after enough correct predictions Amanullah has come to recognise that Nadir is oftentimes a Cassandra as well, and has agreed to assemble a jirga composed of the most important men in Afghanistan to give the plan the legitimacy it needs."
 afghanistan_events.2.a: "It is always painful when Nadir is right."

 afghanistan_events.3.t: "Amanullah Assembles a Loya Jirga"
 afghanistan_events.3.d: "True to his promise to Nadir, King Amanullah has called for all the nation's leaders and most powerful men to assemble in [267.Controller.GetVictoryPointName_12769] in just over a week's time to fully debate the details of the Wardak Report, and decide how the nation's army reform efforts should proceed. Those from all walks of life are set to comprise the jirga; the leaders of many of the nations tribes, key religious figureheads such as Fazl Omar Mojadidi, key industrialists like Sher Khan Nashir, and of course most of the leadership of the armed forces.\n\nWhile the King expects this to be little more than a rubber stamp for the proposal, his closest advisors have at least attempted to warn him and prepare for things not going exactly in his favour."
 afghanistan_events.3.a: "Why would they possibly say anything but yes?"

 afghanistan_events.4.t: "The Traditionalist Stonewall"
 afghanistan_events.4.d: "Far from the \"rubber stamp\" that Amanullah expected it to be, the Loya Jirga has been engaged in a vigorous debate over the details of the army reform plan. While many of the reformist-minded members of the jirga have backed the king's plans almost universally, the tribal and religious leaders have expectedly pushed back hard against the proposed attempts to crack down on conscription avoidance and the weakening of their positions that the qaumi related reforms would bring. The military has generally remained on the fence, clearly wishing to see some reform take place, but also wishing to avoid enraging traditionalist elements, something that could easily prompt a major revolt if things were to go especially poorly.\n\nWith it seemingly unlikely that a consensus is to be met, Wardak has privately proposed to the King that a compromise be reached with the traditionalist leadership to water down the most controversial parts of the plan, such as a less rigorous pursuit of draft dodgers. Preparing also for the event that even this idea fails, Wardak has additionally suggested levering enough favours and influence where possible to convince the most outspoken opponents, hoping the rest fall in line. As far as it seems, if Amanullah attempts to press on without going with either of these ideas, the plan to pass his reforms through a jirga is dead in the water."
 afghanistan_events.4.a: "After enough private discussions, the plans are fully approved."
 afghanistan_events.4.b: "A consensus is reached on a watered down plan."
 afghanistan_events.4.c: "The Jirga refuses to back the reforms."

 afghanistan_events.5.t: "Reforms Forced Through by Amanullah"
 afghanistan_events.5.d: "Clearly unperturbed by the jirga's clear rejection of the Wardak Report, Amanullah has simply ordered the reforms to be implemented regardless. As king, such action is certainly his right, although there are many who will be upset by such expression of his prerogatives.\n\nThe army has already been deployed to areas expected to be particularly troublesome to quell any potential unrest, and although its unlikely any major rebellion will result from Amanullah's actions here, his flagrant disregard for the jirga's will is unlikely to be forgotten any time soon."
 afghanistan_events.5.a: "The king is always right, no matter what they may think."

 afghanistan_events.6.t: "The German Well Runs Dry"
 afghanistan_events.6.d: "The near total collapse of the German economy a few days ago certainly caused a shock in [267.Controller.GetVictoryPointName_12769] when news of it arrived, but no one was truly ready for the most disastrous piece of news: the German Empire has completely cut off any further economic assistance to our nation as they recover from this chaos. Amanullah's modernisation plans have become deeply intertwined with German aid for many years now, having been forcefully weaned off Russian aid as it began to evaporate following the New Year's Putsch in 1929.\n\nNow it seems the same fate has befallen the German aid, with no viable alternative in sight. The amount of ongoing projects that this will scupper is hard to stomach, and the nation must act as quick as it can to find alternative sources of income, whether it be from bleeding our own people dry, or attempting to find a new power to act as a patron for the King's grand ambitions. However we proceed, we must do so with haste but also with caution, lest we wish for the King's head to be on the chopping block along with his plans."
 afghanistan_events.6.a: "Why can't the Germans just run an economy properly!?"

 afghanistan_events.7.t: "German Companies Withdraw from Afghanistan"
 afghanistan_events.7.d: "Another disaster has hit the nation, although one we have been expected for days following the last. Struggling to survive even back home, most German companies in Afghanistan have shuttered operations, including most notably Krupp and Siemens-Halske.\n\nWhile the [267.Controller.GetVictoryPointName_12769] trainline is expected to still continue operations without the latter, this comes as another major blow to reformist ambitions, and one that can easily set Afghanistan back decades if we're not careful. We must hope that if the situation begins to improve in Germany, we may be able to attract these companies back to Afghanistan and restore a sense of normalcy."
 afghanistan_events.7.a: "Black Monday has truly hit Afghanistan the hardest."

 afghanistan_events.8.t: "Smugglers of the Amu Darya"
 afghanistan_events.8.d: "The Amu Darya is a river originating from the Pamir Mountains in the far north of Afghanistan along the border of the Bukharan Emirate, flowing through Khiva until it eventually reaches the Aral Sea. This massive watershed is a major artery for Central Asian smuggling. The villagers in the mountains are extremely unhelpful in our efforts to arrest those responsible, which likely is due to their family members or tribal brethrens' involvement, or even simply a distrust of the government and a code of honour-bound silence.\n\nRumour has it, supported by the evidence we've been able to arrest and repossess, that gun-running has become the dominant trade over the last few years. While one might conclude that Khiva, Tashkent, and perhaps even Bukhara are seeking to bolster their armouries through extra-legal and clandestine means, one must consider that Amanullah has made very many enemies over the years. Many, especially those with the privy of having his ear, suggest that the Saqqawists may be planning a second revolt in revenge for the death of their former leader, Habibullah Kalakani. Whether Amanullah's enemies are arming themselves, or just simply the Central Asian nations, or even just bandits in Transcaspia and Transoxiana, border patrol regiments are (supposedly) diligently making inroads to arresting those responsible."
 afghanistan_events.8.a: "Smuggling is always an issue, regardless of who may be doing it."

 afghanistan_events.9.t: "Reaffirming the Helmand Agreement"
 afghanistan_events.9.d.AFG: "With the advent of the Narodist regime in Russia, Savinkov's foreign policy in [PER.GetName] and Afghanistan has been one of emphatic support and friendship. Consequentially, the time has come for our two nations to get along. For over a glorious century the Durrani Empire controlled the Sistan region at the delta of the Helmand, while [PER.GetName] contested the territory until the First Sistan Boundary Mission, in which the British designated most of the region to be rightfully [PER.GetAdjective] but failed to produce a suitable outcome for either side. The Second Sistan Boundary Mission was chartered by Henry MacMahon, a British diplomat who was able to accomplish a mildly more satisfactory delineation. Nonetheless, as British influence wanes in the region, old feuds and disputes refuse to die out just yet.\n\nBut still, it is in our best interest to continue and maintain the healthiest relationships possible with our neighbours. Through renewed Russian mediation, the Helmand Agreement has reaffirmed the conclusions of MacMahon, guaranteeing [PER.GetName] access to some of the water from the Helmand River. This is a great victory for Russian diplomacy and a promising sign that Moscow's influence in the region is one of great promise."
 afghanistan_events.9.d.PER: "With the advent of the Narodist regime in Russia, Savinkov's foreign policy in [PER.GetName] and Afghanistan has been one of emphatic support and friendship. Consequentially, the time has come for our two nations to get along. For over a century the Durrani Empire surreptitiously controlled the Sistan region at the delta of the Helmand, while we contested the territory until the First Sistan Boundary Mission, in which the British designated most of the region to be rightfully [PER.GetAdjective] but failed to produce a suitable outcome for either side. The Second Sistan Boundary Mission was chartered by Henry MacMahon, a British diplomat who was able to accomplish a mildly more satisfactory delineation. Nonetheless, as British influence wanes in the region, old feuds and disputes refuse to die out just yet.\n\nBut still, it is in our best interest to continue and maintain the healthiest relationships possible with our neighbours. Through renewed Russian mediation, the Helmand Agreement has reaffirmed the conclusions of MacMahon, which has legally provided our nation with rightful access to some of the water from the Helmand River. This is a great victory for Russian diplomacy and a promising sign that Moscow's influence in the region is one of great promise."
 afghanistan_events.9.a: "The Vozhd has restored Russia's fair nature."

 afghanistan_events.10.t: "Unrest in Kohistan"
 afghanistan_events.10.d: "One of the King's first responses to the recent economic fallout has naturally been to increase taxes, with the royal collectors expected to gather almost extortionate levels of taxes in whatever way they are able. There has never been a time in history where tax collectors have been popular, and especially not when they are sent to collect more than they did previously. It is therefore of little surprise to hear that one collector in the Kohistan region, having set out to gather as much as he could from the locals, has been shot dead by members of the Shinwari tribe.\n\nWhile according to official sources the tax collector clearly was demanding much more than the King had ordered, the locals have not exactly bought this explanation, and have attempted an uprising in the region against this \"unjust\" taxation. This insurrection has amounted so far to little more than skirmishing with local units, but the history of insurrections against the Crown in recent years has shown how quickly such unrest can spiral if not dealt with quickly. Whether the issue be resolved with the carrot or with the stick is up to the King."
 afghanistan_events.10.a: "Exempt them from further taxes, we can't afford the unrest."
 afghanistan_events.10.b: "Send in Nadir to crack a few skulls, there's still more blood to get from this stone."

 afghanistan_events.11.t: "Tribal Tax Dispute in [AFG_random_location_name]"
 afghanistan_events.11.d: "To fund Amanullah's Westernisation efforts, the army's modernisation and wages, and the upkeep expenses of the government; taxes are levied on all Afghans, regardless of tribe, creed, occupation or background. However, our unfortunately disparate and fractious makeup and often indignant subjects makes tax collection a highly complex and often arduous matter. Many will resort to evasive tactics like under-reporting livestock, \"forgetting\" to document and report births, and painting a false picture of the size and productivity of their land. In many tribes, there still exists a sense of loyalty to one's tribal heritage and identity over a proper and united \"Afghan\" identity, spoiling their appetite for kicking up to a king they do not feel especially bound to.\n\nSeveral tribes in [AFG_random_location_name] have become flagrant in their tax evasion, and an advanced audit has seen them all but admit to it while accusing the regional governor of financial misappropriation as their tacit justification. Stalwart in their refusal to pay off what they owe in back taxes, we must carefully decide our approach to the matter."
 afghanistan_events.11.a: "Turn a blind eye for now."
 afghanistan_events.11.b: "Render onto Amanullah what is Amanullah's...or else."

 afghanistan_events.12.t: "Tribal Leaders in [AFG_random_location_name] Protect Draft Dodgers"
 afghanistan_events.12.d: "Though Amanullah's \"Pishk\" conscription system is by and large superior to the old, selecting conscripts from tribes via lottery instead of leaving it to the tribal elders to select their own (which usually was the weakest runt of the tribe), the tribes did and still do disapprove of this system. With some selected being flat-out unwilling to serve under the Afghan banner and instead identifying solely to their own tribe, or simply fearful of the military life, conscription boards more often than not do not produce a 100% attendance rate.\n\nWhether it was that they failed to bribe their local conscription officers, or that the members of the board are among a rare few not susceptible to corruption, a list of draft-dodgers was provided recently to the local regiment in [AFG_random_location_name] and an attempt at arresting them in their village was made. However, the leaders of the tribe have outright refused to hand over the truants, declaring them to be formally under their protection and requesting that the army simply pass this occasion over. It is up to us whether or not we take punitive action against their defiance, or simply leave this one be and keep the peace."
 afghanistan_events.12.a: "Arrange punishments for both the men and their protectors."
 afghanistan_events.12.b: "We don't really need every soldier now do we?"

 afghanistan_events.13.t: "The Clash with Modernity in [AFG_random_location_name]"
 afghanistan_events.13.d: "Though the march of Westernisation remains forthright and strong, it is most certainly not devoid of roadblocks. The culture shock of introducing European values into Afghan society is very high and very alarming to the tribes and Ulema, who are yet to see and understand the glory of Amanullah's vision for Afghanistan. The import of foreign goods, campaigns to de-veil women, and even the introduction of motorised vehicles and the infrastructure to support them all come with either great apprehension or uncompromising rejection from local conservatives, who wish to preserve their traditions and avoid the corruption of what they deem to be un-Islamic degeneracies.\n\nAttempts at implementing the government's long-standing programmeme have been stymied to no end by figures of influence and importance in [AFG_random_location_name]. We could try to impress our will with more insistence or force, but it may be prudent to let progress take its time without shoving it down their throats."
 afghanistan_events.13.a: "The future is now, old men."
 afghanistan_events.13.b: "Progress takes time, we can't rush things."

 afghanistan_events.14.t: "Growth of the Azadist Clique"
 afghanistan_events.14.d: "Emboldened by the ever growing strength of the extreme nationalists in [PER.GetName] and the Svobodnik regime in Russia, the so called \"Azadist Clique\" of Royal Army officers has seen major growth of their own in terms of size and influence over recent months. These Azadists, taking their name from their ideological allies in Iran, first began to develop in the late 20s following the birth of [PER.GetName]'s Iran-e Now party and the spread of influence from Russia, as military cooperation between them and Afghanistan flourished. The clique's de facto leader, Mohammad Gul Khan Momand, first began to develop the ideas that now define the faction after being sent on a military mission to Russia, where he quickly became influenced by the dyed in the wool Russian officers most loyal to Savinkov's cause.\n\nWhile lacking any kind of set in stone ideology, the clique's members generally all adhere to some form of Pashtun nationalism, with the idea of a shared Aryan identity between the Afghans and their neighbours being commonplace, replacing previous beliefs of descendance from the Tribe of Benjamin. Along similar lines to the late Mahmud Tarzi they also all strongly believe in rapid modernisation of the Afghan state, a fact that has aligned them greatly with King Amanullah.\n\nAt odds with the King however is the significant republican leaning of the clique's members, rejecting the monarchy as an archaic institution that must be replaced. While not the mainstream belief, the significant number of republican members has earned the clique support from left wing republicans like Gholam Mohiuddin Arti and Abdul Rahman Loudin, despite holding significant ideological differences.\n\nEven with these republican leanings, as long as the clique is led by Momand, it seems unlikely that it will pose any threat to the King, and has so far been a useful ally with their fervent support for modernisation. Momand himself has so far seemed rather ambivalent on republicanism, with any opinions on it outweighed entirely by his loyalty to the Afghan state and modernisation. Above all else however, the man is loyal to a fault to Nadir Khan, described lovingly as the family's sixth brother, despite the lack of direct family relation. Nadir's nephew, Mohammad Daoud Khan, has likewise been under Momand's wing in the army for many years now, being seen as his protégé and natural successor. No matter what, where Nadir goes, Momand will follow, and his clique will follow beside him."
 afghanistan_events.14.a: "The Azadists are certainly useful, but we should keep an eye on them."

 afghanistan_events.15.t: "The Red Archway"
 afghanistan_events.15.d: "Bad news from [760.Controller.GetVictoryPointName_6666]: the International Committee of the Red Cross has rejected our petition for recognising our National Society. King Amanullah has been in contact with the ICRC for years, after they reached out and suggested that we start our own branch in Afghanistan. Obliging [760.Controller.GetVictoryPointName_6666], King Amanullah created the Mehrab-e-Ahmar, or Red Archway Society, and submitted the petition.\n\nUnfortunately, the reception from the ICRC was lukewarm at best. Despite many others being granted their reasonable requests for their own symbols, the ICRC has decided to reject our proposal on the grounds that too many symbols would water down the meaning of them. Clearly they must see our nation as an irrelevant minor power, while ignoring the clear prominence of the Mehrab as a national symbol for the Afghan people.\n\nKing Amanullah has been particularly irate about the entire ordeal, and was found in his private chambers loudly threatening to withdraw the Red Archway Society fron the ICRC altogether. His particular protest was the usage of the Red Lion, objecting that the ICRC had allowed it as a national symbol yet vetoed an Afghan symbol. Nevertheless, it is likely that Amanullah will calm down and acquiesce to the suggestions made by the ICRC, though not without protest."
 afghanistan_events.15.a: "This is outrageous and unfair!"

 afghanistan_events.16.t: "Renewed Parliamentary Debate"
 afghanistan_events.16.d: "As has slowly become the norm, the regional government in [442.Controller.GetVictoryPointName_12717] has this week dissolved its legislature in advance of their next election, the fourth since the government's establishment by local powerbrokers in the aftermath of the Fourth Anglo-Afghan War. Although the Frontier's government has never technically received official backing from [267.Controller.GetVictoryPointName_12769], this was not always meant to be the case. Shortly after its establishment plans were put in place to establish an all-Afghan national legislature, including the [442.Controller.GetVictoryPointName_12717] in some form, but these plans initially fell through due to the Saqqawist rebellion, and disagreements over matters like the exact role of Pashtunistan in the process have consistently scuppered further attempts.\n\nUnsurprisingly the electoral season in the Frontier has prompted renewed discussions back in the heartlands over reviving the parliamentary plans. With things somewhat more stable now, economic woes notwithstanding, it may finally be time to put our full attention towards finally solving all the fine details and at last bringing in a national assembly. Alternatively it may be best to continue the status quo, as quite a few ministers believe that any parliamentary plans will simply hit the same pitfalls as before, and that time is best spent on other more immediate matters."
 afghanistan_events.16.a: "Other matters require our more immediate attention."
 afghanistan_events.16.b: "We should be considering a revival of these plans."

 afghanistan_events.17.t: "The Warrior Prince"
 afghanistan_events.17.d: "Today, Amanullah is not only a proud father of Afghan modernity, but a proud father of his own son. Crown Prince Rahmatullah has just formally enlisted in the army and begun military training. This event was carefully but excitedly publicised, as Amanullah has seized the moment to reinforce his family's image as religious warriors who can and will fight for the preservation of Islam.\n\nRahmatullah is expected to excel in training (even though it's very likely the sergeants won't drill the Crown Prince as much as his fellow cadets for fear of offending his family) and bolster his personal image in anticipation of his accession to the throne, ideally later than sooner."
 afghanistan_events.17.a: "He shall be a mighty mujahid like his father!"

 afghanistan_events.18.t: "Elections in Pashtunistan"
 afghanistan_events.18.d: "Almost sheltered from events in the rest of the country, the region of Pashtunistan has spent the past few weeks holding elections for its local assembly, the de facto government of the region. Unsurprisingly to many, the Anjuman-e-Islah-e Afghania has maintained their dominant position, with Abdul Jabbar Khan (Dr Khan Sahib) remaining Chief Minister. In a notable turn however the United Muslims Nationalist Party, the main opposition, have increased their winnings to 10 of the 51 seats in the assembly, suggesting a potential pushback against the AIA's more radical policies.\n\nHaving held elections every three years since 1927, the democracy present in Pashtunistan is a rather stark contrast against the supposed absolute rule of the King in [267.Controller.GetVictoryPointName_12769]. In the chaos and uncertainty that followed the invasion, the subsequent lack of authority asserted from the heartlands led to Dr Khan Sahib and his brother Abdul Ghaffar Khan (Bacha Khan) stepping up to fill the void. A government for the former North-West Frontier Province was established under them, modelled heavily upon the former British institutions many in the region were used to. Owing in large part to their personal connections and charisma their government has surprisingly found itself backed by those from all walks of life, including not just the agrarian poor and the urban elites but even tribal leaders like Mirza Ali Khan Wazir of Ipi.\n\nDespite the Pashtunistan government having no official authority on paper or direct backing from the King, there has never been any official opposition to their existence either. In the years since its establishment, there has been an almost unspoken agreement on the matter between the Crown and the Assembly that they can do whatever they like as long as they stay loyal to the realm and pay their taxes. There has been little objection to this in Pashtunistan so far, as although some in recent years have considered whether they would be better off alone, the high opinion of King Amanullah and a strong level of Pashtun nationalism have many proud to remain part of the Afghan nation, even if they may be in practice so different from it."
 afghanistan_events.18.a: "No need to fix what isn't broken."

 afghanistan_events.19.t: "Independence Day"
 afghanistan_events.19.d: "Today marks the anniversary of the official recognition of Afghan independence with the Treaty of Hanover, signed by our allies after our victory in the Third Anglo-Afghan War. The war began with the ascension of King Amanullah, then just an Emir, where he declared a Jihad against our oppressors, the British. With British forces occupied in Europe, our forces were able to quickly advance into India, a declaration of our assertion on the world stage. Our assertion was met with formal recognition of our independence by Germany and the Ottoman Empire, which was then ratified in the Hanover Conference.\n\nThe day that treaty was signed is now Afghanistan's national independence day, and the celebrations today befit such an occasion. A massive military parade marches down the streets of [AFG.Capital.GetCapitalVictoryPointName], commemorated with speeches on the bravery of the fighters of Afghanistan in service to their nation. The speeches have been received warmly by all within the nation, marking today a day of unity in pride of our Armed Forces."
 afghanistan_events.19.a: "It is the sword that protects Islam."

 afghanistan_events.20.t: "Unity Day"
 afghanistan_events.20.d.regular: "A more recent national holiday has emerged in the form of Unity Day, which commemorates the capture of [442.Controller.GetVictoryPointName_12717] in the Fourth Anglo-Afghan War and the unification of the Pashtun people. While the Third Anglo-Afghan War was our war for independence, the Fourth was our war for unification. After the defeat of Britain and her allies in the Weltkrieg, longtime agitators in the region of Waziristan began organising, in the face of British collapse. A series of withdrawals by British forces allowed our army to easily cross the Afghan-Indian border, securing Pashtun majority areas and supporting freedom fighters in the region. Our greatest victory was the capturing of [442.Controller.GetVictoryPointName_12717], the largest city in Pashtunistan.\n\nParticularly beloved amongst nationalists in the country, Unity Day this year is commemorated with the usual military parades, but also commemorated via new poetry and music produced by nationalist intellectuals in the nation, reminding us that we, the Afghan people, will soon be reunited with our brothers beyond our borders."
 afghanistan_events.20.d.crisis: "On any other year, Unity Day would be one with nation wide celebrations, yet the ongoing quagmire in the Frontier has left a grey cloud over this year's proceedings. To avoid provoking further instability in Pashtunistan, the yearly military parade has been cancelled, as troops in the region right now would be a poor idea. If things continue like this, it will be hard to imagine another Unity Day actually being celebrated..."
 afghanistan_events.20.a: "I forget the throne of Delhi, when I recall the beauty of Pashtunistan."
 afghanistan_events.20.b: "This crisis will pass!"

 afghanistan_events.21.t: "The Soldiers Left Behind"
 afghanistan_events.21.d: "An army's ability to recruit without the need of conscription largely relies on how appealing it can be as a career. For several years, whether you were a soldier or an officer, you usually did not make enough money to afford both remittances to your family and the clothing on your back. The steady growth of the Afghan economy has provided [267.Controller.GetVictoryPointName_12769] with a budget capable of allocating more to the wages of our footsoldiers, but the financial demands of modernisation, the construction of infrastructure, and other expenditures restricts the breathing room of the military budget.\n\nPoverty is still endemic to many in the army. There are several concurrent instances of soldiers begging on the streets for generosity so that they may get by and feed their families. This embarrassment paints a bleary tapestry of how well Amanullah treats those who take up arms to defend him and the government and most certainly makes enlistment seem unappealing at best. The upper brass of the military have, time and time again, requested Amanullah to spare enough money so that the soldiers may no longer need to beg for scraps. It is increasingly grumbled by many that if the King were to divert some of the \"excessively\" generous funding allocated to his reformist and Westernising projects to the army, this problem would simply disappear."
 afghanistan_events.21.a: "Maybe they should budget their remittances better."
 afghanistan_events.21.b: "To reduce our soldiers to beggars is simply humiliating."

 afghanistan_events.22.t: "Phone Line to [442.Controller.GetVictoryPointName_12717]"
 afghanistan_events.22.d: "Cooperative cohesion and proper communication between us and the loosely incorporated Pashtunistan region is, to put it mildly, highly inconvenient and obtuse. As part of our efforts to bring the Frontier closer into the administrative fold, a direct telegraph and phone line between [267.Controller.GetVictoryPointName_12769] and [442.Controller.GetVictoryPointName_12717] has been officially inaugurated. Commemorating the occasion, Amanullah Khan and Ghaffar Khan held a meeting today, for the first time simply from the comfort of their respective homes. Ensuring that the transcript was openly publicised in every newspaper willing to do so, calls for cooperation, unity, and mutual support for the reformist agendas of each leader were affirmed.\n\nPointedly included in Amanullite newspapers was Ghaffar Khan's apparent reaffirming of fealty to [267.Controller.GetVictoryPointName_12769], a statement conspicuously missing in [442.Controller.GetVictoryPointName_12717]'s publications. While it remains unclear which version of the transcript was edited, the phone line is a great step forward for Pashtunistan's integration."
 afghanistan_events.22.a: "The second capital is now closer to us than ever."

 afghanistan_events.23.t: "The Inland Exploration Company Concession"
 afghanistan_events.23.d: "Amid the uncertainty of oil production, usually as a result of labour unrest in the aftermath of Black Monday, many oil prospectors and businessmen see opportunity in economic instability. A venture led by former U.S. diplomat Charles Calmer Hart and geologist Frederick Gardner Clapp through their \"Inland Exploration Company\" has been given a major lease on life through the granting of a concession covering the entirety of Afghanistan sans the autonomous Pashtunistan region. The terms of the agreement stipulate that Inland must pay the Afghan government almost 14,000 U.S. dollars a year, with the sum to be almost doubled after 5 years for the 60 year term of guaranteed exclusivity to spelunk.\n\nThis agreement is the result of years of Amanullah Khan courting U.S. investors as a counterweight to Russian, German, and (formerly) British influence. It is now expected that dozens, if not hundreds of American oil prospectors are to set up shop in Afghanistan in the search for liquid gold, spreading western influence and promoting industrialisation!"
 afghanistan_events.23.a: "Afghanistan will no doubt soon be the oil capital of the world!"

 afghanistan_events.24.t: "The Women's Queen"
 afghanistan_events.24.d: "Amanullah's wife and the Queen of Afghanistan, Soraya Tarzi, is the backbone of his emancipatory reforms and perhaps the biggest and most active proponent of women's rights and advancement in the entire Asian continent. Indeed, it was Afghanistan who granted women the right to vote before such \"bastions of democratic values\" like the United States of America promulgated such measures. Women's rights are not unanimously popular, however, and the religious conservative establishment are arch-enemies of Amanullah's feminist policies.\n\nHaving already opened multiple primary schools for girls, including, the Masturat School, Tarzi has recently inaugurated Afghanistan's first all female secondary school, eponymously named the \"Soraya Tarzi Secondary School\" in [267.Controller.GetVictoryPointName_12769]. Based on the standards set by similar centres of education in the Ottoman Empire, the school is set to receive up to 200 pupils for its first semester. Tarzi has no intention to stop or even slow down here; she openly proclaimed her full intention to build industrial schools and fully standardise women's access to education, hoping to even establish higher education colleges in [442.Controller.GetVictoryPointName_12717] one day.\n\nTo the conservatives, Amanullah's support, tacit or otherwise, is perhaps the greatest evil on earth. A major protest led by a local mullah has already led to the school's opening being delayed, and conservative publications nationwide are furiously polemicising the institution and Amanullah's heretical betrayal of Islamic values. Immense backlash or not, the new school is certain to remain open at least for the remainder of his rule; but to assuage their outrage, it may be prudent to rein in Tarzi's ambitions, lest the conservatives get pushed beyond the brink."
 afghanistan_events.24.a: "Women contribute to the development of Afghanistan just as much as men..."
 afghanistan_events.24.b: "...but perhaps we should convince her to hold her horses."

 afghanistan_events.25.t: "The Chains of Command"
 afghanistan_events.25.d: "Troubling news from the garrison at [415.Controller.GetVictoryPointName_4893], as the murder of a Farsiwan commanding officer by a Pashtun son of a Khan has generated serious controversy not just in our westernmost city, but all the way in [267.Controller.GetVictoryPointName_12769] as well. After a prompt investigation of the incident, it was found that the officer had been excessively delegating menial labour to the recruit, forcing him to clean latrines, dig trenches, and fetch his afternoon lunch. Such discrimination is not uncommon, officers who worked their way up from the bottom often have extremely low opinions of the sons of important people and delight in putting them through hard labour to instil a sense of humility.\n\nThe murderer in question committed the act at midnight, ostensibly in an effort to get away clean, but the interethnic implications of the crime ensured he had no friends in the predominantly Farsiwan platoon. The death sentence is just over the hill for him, but now his family is directly petitioning the king to grant him amnesty and return him to their village. They claim he has suffered from anger issues his whole life and can not be made wholly responsible for his actions, but can still be rehabilitated via the village mullah of whom he sees as a close mentor.\n\nEven if Amanullah were inclined to pardon the homicide, dubiously \"provoked\" as it was, doing so would absolutely infuriate the Farsiwan community and only accentuate the regime's bias toward Pashtuns. Although, major conservative publications have posted apologetic editorials in favour of the killer, and sending him back to his family might score us a few points with them."
 afghanistan_events.25.a: "He will be court martialed and tried for murder, like any other man."
 afghanistan_events.25.b: "He's only a boy, let his elders handle it."

 afghanistan_events.26.t: "A New Mehtar in Chitral"
 afghanistan_events.26.d: "Unfortunate news from northern Pashtunistan today as the ruling Mehtar of the Chitral Princely State, Shuja ul-Mulk, has suddenly perished of heart failure. Succeeding him is Nasir ul-Mulk, who will formally inherit the throne in a grand ceremony hastily planned to take place six days after his father's death.\n\nThe influence of these small princedoms inherited with the rest of Pashtunistan is rather small, and even in spite of Shuja ul-Mulk's pro-British leanings he had seen the wisdom of declaring fealty to Amanullah in the wake of British India's rapid insolvency. Nasir ul-Mulk is an enlightened figure with great interest in academic development, hoping to develop an ambitious education system in his realm. Chitral's treasury can not accommodate all of his designs, so it may do us some good to offer him some funds with the tacit understanding that he unequivocally supports [267.Controller.GetVictoryPointName_12769]'s programmemes in return."
 afghanistan_events.26.a: "Amanullah is happy to support a modern-minded ruler."
 afghanistan_events.26.b: "Send our congratulations, but nothing more."

 afghanistan_events.27.t: "Our Dir Brothers"
 afghanistan_events.27.d: "Shocking, but thankfully unimpactful news has been received from Pashtunistan, with the State of Dir experiencing an attempt at overthrowing the reigning Alamzeb Khan, carried out by his brother and former ruler Mohammad Shah Jahan Khan. During the Afghan takeover of Pashtunistan, Jahan Khan's attempts to remain loyal to his British benefactors resulted in his overthrow and subsequent exile by Alamzeb, who has so far remained a loyal toadie of Amanullah and perhaps his greatest bulwark of support in the frontier. Jahan's latest incursion was dispersed immediately by Alamzeb's own forces, but his plotting brother has yet again managed to evade capture back to [RAJ.GetNameDef]\n\nThe revolt does underscore Alamzeb's waning hegemony, however. Jahan's forces were purportedly staffed in part by Indian revolutionary mercenaries looking to make a buck who recruited a number of dissidents in Dir itself. Alamzeb is requesting an infusion of funds to improve his forces and expand Dir's police state, and while this would help entrench a loyal ally it would also reinforce the most backward of the Pashtunistan princedoms."
 afghanistan_events.27.a: "A strong Eliteheer for a strong Dir."
 afghanistan_events.27.b: "No coins for the Khan, we're afraid."

 afghanistan_events.28.t: "Treasures of Bagram"
 afghanistan_events.28.d: "Wonderful news! We have recently discovered a vast collection of artifacts in the city of Bagram, which is located near the ancient city of Kapisa. The discovery and excavation was conducted in a joint effort between Afghanistan's National Museum and the Ethnological Museum of Berlin.\n\nAfghanistan is home to centuries of rich history, spanning from the ancient empires of Persia, to the conquests of Alexander the Great and his successors, all the way to the arrival of the Prophet Muhammad. Particularly, Bagram is located near the city of Kapisa, the ancient capital of the Kushan Empire that ruled over the area in the last few centuries prior to the birth of Muhammad.\n\nThe effort was spearheaded by a one Theodor Bartus, a known archaeologist and museum curator famous for being the technical head of the German archaeological expeditions in Turfan. Bartus's expertise in excavation proved to be incredibly useful to both German and Afghan site workers, as extensive work was needed to uncover a storeroom. Once uncovered, Bartus and the team discovered a wide range of artifacts, including glass, bronze and plaster sculpture works from the Hellenistic period and even the far-flung Roman Empire. Most notably, the team came upon a collection of ivory carvings, plaques and figures, dating back to the Kushan Empire of the first and second century CE. Already talks between Afghanistan and Germany have begun, determining what artifacts are to remain in Afghanistan and which are to be sent to Berlin. For now, the archaeology world rejoices at such an exquisite find."
 afghanistan_events.28.a: "A fantastic find for the National Museum."

 afghanistan_events.29.t: "The Crisis in Turkestan"
 afghanistan_events.29.d: "A crisis has arisen in Turkestan, as several Turkic states have banded together in a coalition against the state of Bukhara. This situation is surely to be exacerbated by eventual intervention from Russia. While we are unsure of the exact details of the conflict, we know that we must take a side. The question is, who should we side with?\n\nOn one hand, our relationship with several of the states in the area is preidcated on our shared Muslim faith, and a dedication to anti imperialism, no matter who it comes from. On the other hand, Russia's intervention on behalf of Bukhara is not without merit, as they have historically considered the area to be within their sphere of protection. Regardless, it is likely that this conflict will result in severe economic and political ramifications for the entire area."
 afghanistan_events.29.a: "Send aid to our fellow mujahideen."
 afghanistan_events.29.b: "We must help the Russians maintain order."
 afghanistan_events.29.c: "We have enough of our own people to use those guns on."

 afghanistan_events.30.t: "Aid from Afghanistan"
 afghanistan_events.30.d: "Great news: we have recently received a shipment of arms from the Afghan government. Our relationship with Afghanistan has always been fair, with our shared faith being an anchor of common ground, but has become strained in recent years following accusations by them of our alleged harbouring of dissidents and smugglers.\n\nHowever, this shipment is a welcome reassurance that despite these setbacks, our Muslim brothers across the mountains value our friendship."
 afghanistan_events.30.a: "Make sure to inform Amanullah of our gratitude."

 afghanistan_events.31.t: "Refugees from Central Asia"
 afghanistan_events.31.d: "As predicted, the war in Central Asia has resulted in a humanitarian crisis, and we are no better from it. The struggle amongst the Turkic and Russian forces has created a caravan of refugees, many of whom have fled to our country in search of safety. Naturally, we have opened our borders to shelter our weary neighbours. Unfortunately, this has created several problems we have to deal with. The most striking being that their settling in our lands exacerbates ethnic tensions amongst Turkic and Pashtun populations, with northern provinces seeing a rise in violence and unrest.\n\nWhat is even more concerning is the ideology of some of the refugees: Central Asia has always been a scholarly centre for much of Islam, but many a Mullah today turns towards a radical form of Pan-Islamism, the very kind that the Saqqawists and othe reactionaries have aligned themselves with. As a result, many refugees have joined amongst the ranks of Saqqawist bandits, motivated by radical beliefs and desperation in the face of destitution. Our national government has done what we can to alleviate such a crisis, but many have begun to sympathise with the day the war is over so that we may begin returning these people back to their country."
 afghanistan_events.31.a: "Let's hope their stay here is short."

 afghanistan_events.32.t: "The King in Your Home"
 afghanistan_events.32.d: "Although regarded at first as little more than one of Amanullah's pet fancies, radio has surprisingly had significant staying power in Afghanistan, with the nation's first radio station continuing to run out of [267.Controller.GetVictoryPointName_10737] palace since its establishment in 1925. For fans of the radio, and perhaps soon to be fans, today's announcement should bring great joy, as the installation of a new transmitter has finally finished. This new 20 kilowatt transmitter is said to allow the station to operate at 600 kHz, a figure the King is said to be greatly impressed with, even if he is a bit fuzzy on what that exactly means.\n\nMore importantly than the technical details however is that the new transmitter is said to also allow the station to broadcast to the farthest reaches of the nation, even as far as the Zaranj border post. The King, excited by the prospect, was quick to issue a prepared speech on the radio, going out for the first time to all of his subjects (or at least the few with radio access). It seems that no more shall the monarch simply be the man on your coins, every man and woman will soon get to know him and his voice personally, in the way only a generic and indirect radio broadcast can truly provide."
 afghanistan_events.32.a: "The wonders of modern technology."

 afghanistan_events.33.t: "The Benefits of Japanese Agriculture"
 afghanistan_events.33.d: "It has been yet another year of diplomatic exchanges between Afghanistan and Japan, and relations could not be better. To the untrained eye, there does not seem to be much held in common between the mountainous Afghanistan and Japan, an island country on the edge of Asia. However, looking closer, the two are like brothers: both are monarchies that have pushed hard for modernisation, both countries had to assert themselves against encroaching European powers, and both countries understand the profitability of investing in Afghanistan.\n\nOne paricular cooperation between the two countries is on the subject of agriculture. Several years ago, Japan sent envoy Mitsuo Ozaki to [267.Controller.GetVictoryPointName_12769], along with a team of engineers and agricultural technicians. Ozaki, an expert in agriculture and forestry, has been working hard surveying locations such as [1117.Controller.GetVictoryPointName_5064] and [267.Controller.GetVictoryPointName_12831], and presented the Afghan government with a collection of materials on ways to improve our agricultural efficiency, announcing his desire to stay and oversee these efforts. Joining him will be representatives from the Japanese company Mitsui, looking to invest in our economy. It is clear from Ozaki's efforts that an ongoing relationship between Japan and Afghanistan will be incredibly lucrative for all."
 afghanistan_events.33.a: "Perhaps he can show the King about those \"bonsais\" next."

 afghanistan_events.34.t: "A New Generation of Mullahs"
 afghanistan_events.34.d: "In light of the instability in Transcaspia and Transoxiana to the north, students studying Islam at the Madrasahs in Bukhara have returned to their homes early. Prior to state efforts at expanding domestic theological education, Afghan prospects traveled to institutions in India and Bukhara to learn and qualify themselves to become religious scholars and Mullahs, however with the construction of a few new institutions Afghanistan now possesses the capacity for their education to continue at home. It is of additional help that some of their educators fled here and have resumed their duties at our Madrasahs instead.\n\nNew generation notwithstanding, they share much of the same apprehension toward Amanullah's westernisation programmes as the Ulema do. Many believe that, as a self-proclaimed \"Defender of Islam\", Amanullah should have taken more proactive action in defending Central Asian Muslims from Russian imperialism. As far as Amanullah is concerned, it feels like even if he were to declare a Jihad against the Russians and somehow liberate every Muslim across all of Earth, the conservative establishment would still proclaim that he doesn't do enough for Islam."
 afghanistan_events.34.a: "When has anyone ever listened to students?"
 afghanistan_events.34.b: "The Ulema must know that nobody loves Allah more than Amanullah Khan."

 afghanistan_events.35.t: "The Veil of the Unveiling"
 afghanistan_events.35.d: "In October of 1928, Amanullah Khan gave a speech proclaiming that Islam does not dictate that women must cover their faces. As he uttered these words, Queen Soraya stood and removed her veil from her face in front of a massive crowd, with several other women attending the speech following suit. A tremendous message was delivered that day; Amanullah's Islamic modernism and Westernisation efforts would under no circumstance leave women in the dust. The royal women thenceforth served as an example and an inspiration for unveiling, despite no official decrees outlawing use of the face veil and \"chadari\" (commonly known as the burqa).\n\nOver a decade later, unveiling has failed to penetrate Afghan society in any meaningful way. There have been modest attempts at prohibiting the veil in [267.Controller.GetVictoryPointName_12769] as there were in [267.Controller.GetVictoryPointName_10737], but this has really only affected Afghan high society. Everywhere else down to the village level has completely disregarded the anti-veil push. In an effort to resurrect the issue, Queen Soraya has initiated a speaking tour aimed at promoting the denunciation of the veil in the other major settlements of Afghanistan. This tour has seriously outraged the Ulema and conservatives across the nation have called on Amanullah to rein in the Queen."
 afghanistan_events.35.a: "The voice of liberation will not be silenced."
 afghanistan_events.35.b: "We should streamline the tour before we burn too many bridges."

 afghanistan_events.36.t: "The Enduring Mojadidi"
 afghanistan_events.36.d: "After his victory in the Civil War, King Amanullah thought he was finally free to reform the nation in his image. Yet, despite the waves of positive reception to his reforms, there stands a legion of naysayers guided by a single man, a rallying point for those who cling fanatically to tradition: Fazl Omar Mojadidi.\n\nMojadidi, like many of his ancestors, is among the most prominent of the country's Ulema, leading his influential family as well as the nation's branch of the Naqshbandi Order. Pious, wise, and incredibly outspoken, Mojadidi and his advocacy for Sharia law reaches across the country, with many seeing him as a champion of Islam in an era where our faith is in crisis. There have always been rumours of connections between Mojadidi and the anti-Amanullah extremists of the Saqqawist movement, especially as both are vocal critics of our reforms, but alas, nothing concrete enough has been found to justify getting rid of him.\n\nFor as long as Afghanistan has been on the path of modernity he has been attempting to drag it back, with him personally to blame for almost all opposition to the Wardak Report amongst the elites a few years prior. In more recent weeks, Mojadidi has continued to make public statements against the government, declaring our programmes both \"atheist\" and \"syndicalist\", while claiming that Amanullah is being misguided by Western fools. Although Amanullah's reign is stronger than ever, we are stuck listening to the so called \"Hazrat Nur al-Mashayikh\" prattle on, though we shall watch him closely, eager to silence the impudent cleric."
 afghanistan_events.36.a: "He'll slip up one day..."

 afghanistan_events.37.t: "The Inevitability of Corruption"
 afghanistan_events.37.d: "Conservative newspapers have begun harping on the malversation of many of our provincial officials, highlighting cases of bribery and in multiple instances the arrant flaunting of wealth in comparison to the usually poor conditions of those they govern. One bejeweled tax collector possesses a vast, manicured estate with a western-style mansion in a region dominated otherwise by pastoral herders. The conservative press and by extension their target audience have for a long time bemoaned and decried the provincial system as being fertile ground for little other than graft. Such bureaucracy to them encourages thiefdom and kleptocracy and it is frequently said that the most honourable men are inevitably doomed to conform to the system of corruption that Amanullah pretends he does not see.\n\nMost of these administrators owe their status to the King, and they know it. Loyalty matters a lot, and part of the reason why the issue hasn't been tackled except in the most outrageous cases is to prevent jeopardising government unity and the creation of more political enemies. But does corruption not undermine the image of Afghanistan that Amanullah has strived so hard to construct? Are we not betraying the people by permitting this to continue? Is the wealth of these officials not extracted from what is rightfully ours?"
 afghanistan_events.37.a: "Subornation is subordination, carry yourselves modestly or else."
 afghanistan_events.37.b: "They do a good job and they're reliable, let them eat cake."

 afghanistan_events.38.t: "Parliamentary Proposal Prepared"
 afghanistan_events.38.d.start: "Bureaucracy has never been described by anyone as fast, but few would be forgiven for being exhausted with how long attempts to institute a National Assembly have been going on for. Now over a decade since discussions first began, we may be at last seeing the light at the end of the tunnel. With issues surrounding the Pashtunistan government no longer a roadblock, and things at least stable enough to institute such changes, an actual finalised proposal has at last been approved by the King.\n\nUnder proposed plans the National Assembly, the Shura-e Milli, "
 afghanistan_events.38.d.end: "Members will serve for three year terms, with a large array of de jure powers laid out for the Assembly. To keep its members in check a second body known as the Senate, the Majlis-i-A'yan, is also set to be established, with 25 members appointed directly by the King. Both will have the right to propose legislature, although only passing with the approval of both, with the King personally resolving any deadlock between the two.\n\nWith Amanullah's approval the groundwork on implementing these plans has already begun, leading to hopes that parliament will be opened by the King not long after his return from Europe. Assuming all goes well, this time next year the King will at last have the parliament he has long hoped to institute."
 afghanistan_events.38.d.pashtunistan: "$afghanistan_events.38.d.start$is to be composed of 135 elected seats on a national level. 111 of these seats are initially set to be distributed across the heartlands, with a further 24 in the Frontier. $afghanistan_events.38.d.end$"
 afghanistan_events.38.d.nopashtunistan: "$afghanistan_events.38.d.start$is to be composed of 111 elected seats on a national level, spread across the provinces by population. $afghanistan_events.38.d.end$"
 afghanistan_events.38.a: "The King shall return to a new era!"

 afghanistan_events.39.t: "The Cotton King of Kunduz Passes On"
 afghanistan_events.39.d: "Afghanistan has lost one of its greatest entrepreneurs today, with the passing of Abdul Aziz Londoni. His mercantile career kicked off in the latter stages of the Weltkrieg, where he made several risky but highly profitable trades with Qarakul skins, kicking off a major industry for Afghanistan and establishing a consistent buyer in London, to which Abdul Aziz earned his namesake from. With Russia's Uzbek cotton markets in bedlam, he pounced on the opportunity and established a lucrative deal which established a highly profitable line of cotton from the Amu Darya to Moscow. Londoni saw the potential of this \"White Gold\", and promptly with the assistance of foreign machinery, partnerships and settlers in the aftermath of the first Saqqawist Insurrection made incredible strides toward clearing the Malaria-infested swamps which made Kunduz an infamous death trap.\n\nThe Afghan Civil War and the resulting stressors of ensuring the cotton industry's sustaining health contributed to a heart attack that Londoni unfortunately did not survive. Though his enterprises have passed on to those who shared his vision from the beginning, Afghanistan has nonetheless lost an economic genius and an industrial pioneer."
 afghanistan_events.39.a: "Indeed, we belong to Allah, and indeed, to Him we will return."

 afghanistan_events.40.t: "Advent of Non-Pashtun Capital"
 afghanistan_events.40.d: "Through the growth of the national bank, we have witnessed the rise of capitalism in almost all reaches of Afghanistan. Commercial enterprise flourishes not just in [267.controller.GetVictoryPointName_10737], [267.controller.GetVictoryPointName_12769], and other important trade cities, but in the regions of Qataghan, [1117.Controller.GetVictoryPointName_5064], [1117.Controller.GetVictoryPointName_2017], and even in the reaches of Nuristan and Maymanah. State revenues are slowly diversifying from their prior chief makeup of livestock taxes and other forms of direct taxation toward indirect taxes and duties on exports.\n\nPashtuns, having formally dominated the economy, have begun to witness their monopoly slowly disintegrate in the face of Uzbek and Tajik enterprise. Their success, among other non-Pashtun businesses, has raised some alarm for the displacement of Pashtun cultural hegemony. Ethnonationalists who aspire to a strong, united Pashtun cultural identity for the whole of Afghanistan clamour for something to be done about the spread of Uzbek and Tajik culture. It has been recommended that the bank's activities be restricted so that it becomes more difficult for these entrepreneurs to obtain loans and investment. While this would unfortunately stymie Afghanistan's economic growth, it would please the nationalists and provide us with more oversight over the bank's activities."
 afghanistan_events.40.a: "Capitalism must be controlled with a steady hand, lest we lose our identity."
 afghanistan_events.40.b: "Good business begets a good economy, good economy begets a good nation."

 afghanistan_events.200.t: "Foundation of the Pashtun Democratic Party"
 afghanistan_events.200.d: "Amid the first national election in Afghan history, many have strenuously put forth candidacies and parties to fill the political and administrative black hole where autocratic monarchism once stood. Emerging from this quagmire of politics is Ghulam Mohiuddin Arti and his new party, the Hezb-e Demokratik Poshton.\n\nKnown in English as the Pashtun Democratic Party, Arti's new party is the culmination of modernist reforms across the Islamic world, yet without the personality cult of Amanullah. Taking inspiration from both Enlightenment-style liberalism and nationalism, as well as Mustafa Kemal Gelibolu's OHF and the Indian AIHRP; the Pashtun Democrats advocate for the modernisation of our economy and the continued progress towards a fair and equal society.\n\nAmongst the constituents of Arti's latest foray into politics are allies of the former King Amanullah, exiled democratic activists from India, the Afghan Intelligentsia, and our steadily growing middle class. While Arti's party has yet to stand on its own legs in an election, it is safe to say that the coalition it has forged operates smoothly, representing a sense of reformed continuity with the Amanite years. With ample sources of funds and a dedicated body of advocates to reach out to voters; regardless of the party, this coalition seems like it is here to stay."
 afghanistan_events.200.a: "Can Amanites succeed without Amanullah?"

 afghanistan_events.201.t: "The Party for Modern Moderates"
 afghanistan_events.201.d: "For every victory progress etches into history, the forces of tradition and reaction adapt and persist in their new environment. Here, the aristocratic and the pious of Afghanistan have found their champion, former Minister of Commerce and diplomat Abdul Hadi Dawi.\n\nDawi was not always a man who counted Ulema and tribal leaders as his allies. Coming from a background in the newspaper business, Dawi was a committed ally of Amanullah, serving as his Minister of Commerce to push for economic and political reforms for the country. Yet, Dawi was also much more hesitant in comparison to his colleagues, believing in a much more gradual approach to modernisation. This disagreement came to a head when Dawi resigned over the more feminist aspects of modernisation, seeing it as a step too far too quickly; and his subsequent political exile when reassigned as a foreign ambassador by the King in the following months.\n\nNow working within a new Afghanistan free from Amanullah's whims, Dawi has taken the opportunity to reflect his views on a national level, founding the Hezb-e Islami Afghanistan, or the Islamic Party of Afghanistan. The Islamic Party frames its steadfast commitment to democracy as a commitment to the people who overwhelmingly are guided by Islamic values, rather than for progress for its own sake. The Islamic Party counts support from groups ranging from the rural peasantry to the Kabuli elite, and from the lowest tribes of the nation all the way up to the ever-present Ulema. Dedicated to rolling back overambitious programmes inspired by feminism and secularisation, while staying faithful to the political and economic liberalisation of the state, it seems that the once zealous opposition to progress have ultimately moderated, accepting many reforms as the norm, and pushing for what they see as a \"middle ground\"."
 afghanistan_events.201.a: "Will such a middle ground be palatable to voters?"

 afghanistan_events.202.t: "The First National Elections"
 afghanistan_events.202.d: "Excitement buzzes in the air, as today marks the first election for the National Assembly since the establishment of our new constitution. It is a historic day, as many believed this would never happen, some even hoping it never would. Yet, in spite of those who doubted the nation, Afghanistan stands proud as another country with a mandate from the people.\n\nSo far the vote seems to be between the Pashtun Democrats and the Islamic party. Both parties have campaigned hard, trying to convince others that their vision for the nation is the best path forward: Ghulam Mohiuddin Arti and the Democrats have promised to push for further liberalisation, while Abdul Hadi Dawi rallies the Muslim vote to ensure that reforms do not trespass against the tenets of Islam. Many still flock to the polls to cast their first ever vote, but we shall soo have ourselves a new government. The question remains, who will lead it?"
 afghanistan_events.202.a: "The Pashtun Democrats secure victory."
 afghanistan_events.202.b: "The Islamic Party wins the vote."

 afghanistan_events.203.t: "Afghanistan Goes to the Polls"
 afghanistan_events.203.d: "It has been three years since our last election, and once again Afghanistan proves to be a nation ready for the torch of democracy. The vote seems to once again be between the liberalisation-oriented Pashtun Democrats, headed by Ghulam Mohiuddin Arti, and the more conservative Islamic Party, led by Abdul Hadi Dawi.\n\nBoth parties continue to campaign hard, arguing that the mandate of their rule must be continued, or, as the insurgents, the current government is not doing enough for the nation and its people. Once again, the election is close, begging the question: who will shepherd the fate of the nation?"
 afghanistan_events.203.a: "The Pashtun Democrats secure victory."
 afghanistan_events.203.b: "The Islamic Party wins the vote."

 afghanistan_events.204.t: "Shifting the Blame"
 afghanistan_events.204.d: "Despite Amanullah's death solving a large deal of our issues, it has left us with new issues to resolve; finding someone to blame for his assassination, and the religious establishment remaining steadfast against any level of reformism. Fortunately enough, with enough clever thinking, these issues can easily cancel each other out.\n\nAfter the arrest and torture of two associates of the Mojadidi family, a full confession has been given, declaring that the late King's murder was orchestrated by Fazl Omar Mojadidi. As the story goes, despite Amanullah's attempts to regain his support, Mojadidi believed the King would simply turn his back on him the second the nation began to stabilise. Men paid by Mohammad Sadiq Mojadidi then infiltrated the royal palace and carried out the deed, aiming to ultimately secure the installation of Hashim Khan as a more palatable monarch.\n\nBoth of these men, alongside other prominent members of the Mojadidi family and non-familial associates, have now been arrested. Execution orders have been given for Mohammad Sadiq and those less prominent, however they have been stayed for Fazl Omar to avoid a repeating the mistakes of the Khost rebellion. Exile is expected for him, at last ridding us of two birds with one stone."
 afghanistan_events.204.a: "Amanullah should have had them all shot years ago."

 afghanistan_events.205.t: "Pacts in Pashtunistan"
 afghanistan_events.205.d: "Although the recent elections proved to be quite competitive in the urban areas of the heartlands, and in some of the rural areas with notable enough turnout, the same cannot be said for the Frontier. Despite both the Democrats and the Islamic Party campaigning in the Frontier, virtually every seat was won instead by local parties, benefitting greatly from years of established presence. The [AFG.GetRulingParty] has been able to form a government in spite of this, however it seems likely there will have to be cooperation with parties on the Frontier to ensure a smooth passage of legislation.\n\nTo that end, discussions are ongoing between the government and the Frontier parties on their exact place within the new all-Afghan democratic system, with the opposition holding similar talks as well. At present, it seems that the AIA is likely to find itself aligned with the Democrats, agreeing with them on many ideological matters and being a vital additional support base for the Democrats. The Islamic Party on the other hand seem to having great success negotiating with the UMNP, with a meeting between Gandapur and Dawi said to have gone extremely well. Whether these agreements result in full mergers, or simply electoral pacts, it seems at the very least that the Frontier is at last fully integrated into the political system."
 afghanistan_events.205.a: "Devolution continues, yet we are closer than ever."

 afghanistan_events.206.t: "A New Age of Azadism"
 afghanistan_events.206.d: "The Afghan civil war saw the destruction of the Azadist Clique, who poorly chose to throw their weight behind Nadir, yet surprisingly their influence still lingers. Although it was primarily a military organisation, quite a few civilians were associated with the clique, and unlike Momand or Daoud their lack of direct treason gave them little reason to go into exile. These civilian associates, still believers in the Azadist ideology, have at last formed together into a new political party, under the leadership of Ghulam Mohammad Farhad.\n\nFarhad, a former government official mostly associated with electrification, is said to have come into contact with the Azadists through work performed at military bases throughout the years. His alleged favouritism for project approvals towards his new friends saw him dismissed from his posts following Amanullah's restoration, and in the months since he has fully shifted his attention towards political organisation.\n\nHis new party, operating under the name of the \"Afghan Social Democratic Party\" is said to be rather at odds with the common ideas such a name would conjure up. Like the Azadists, Pashtun nationalism and modernisation are their two most ardent positions, although with a larger degree of leftist ideas sprinkled in, such as support for trade unions and welfare policies. The party however stands at odds with many democratic values, opposing universal suffrage, and believing that Afghanistan should solely be a Pashtun state ran by Pashtuns for Pashtuns. Although not expected to contest elections yet at a national level, the party is hoping to gain ground locally, with Farhad planning to run in the next Kabuli mayoral election, a bid many commentators are currently expecting him to succeed with."
 afghanistan_events.206.a: "They are neither social, nor democratic, nor an empire...wait that's something else."

 afghanistan_events.207.t: "Friends in High Places"
 afghanistan_events.207.d: "The civil war brought death and destruction, but for the nation's richest it ultimately proved to be just a few months of an enforced holiday. One such man, Abdul Majid Zabuli, has at last returned to Afghanistan, having had holiday homes overseas to retire to during the conflict. Although no stranger to politics, Zabuli stayed unusually quiet during the civil war itself, chalked up to having allies on both sides of the conflict. Now home however, he has begun to reacclimatise himself to the new political realities, meeting today with the Prime Minister for private discussions.\n\nAt this meeting, it is said that Zabuli expressed his full support for the new government, offering large charitable contributions to any remaining reconstruction efforts. Allegedly however, Zabuli's financial offers did not simply stop at these contributions, and the man is said to have offered to directly bankroll the [AFG.GetRulingParty]. Rather than openly discussing the quid pro quo of the situation, it has simply been implied that in return the government should be expected to ensure certain legislation he just so happens to favour is passed in the coming months. That is of course, if the Prime Minister is willing to make such a deal."
 afghanistan_events.207.a: "There is little Zabuli's money can't buy."
 afghanistan_events.207.b: "This kind of backroom dealing cannot end well."

 afghanistan_events.208.t: "The Rising Star of the Exiled Prince"
 afghanistan_events.208.d: "With a large number of the current generation of reformers either dead, exiled, or having abandoned politics all together as a result of the civil war and subsequent purges, many have come to question if anyone from the next will begin to pick up the torch. Within the Democrats it appears at least one firebrand of the next generation has been found, in the form of Shahzada Rehmatullah Khan Durrani, the young exile from Quetta.\n\nEver since Amanullah's assassination, Durrani's profile has steadily been growing, with the young man said to be a favourite of Inayatullah and therefore pushed into prominence. For those who were in the know, this favouritism of a useful ally has come of little surprise, no different than the late Amanullah's favouritism towards Shuja-ud-Daula Ghourbandi, of whose involvement in Habibullah's killing has long been rumoured.\n\nNow part of the Pashtun Democrats, Durrani has quickly risen through the party's ranks, prominently now leading the youth league. His passionate activism for the Democrats combined with his family connections, especially amongst the Sadozai, has many speculating that he is a future prime minister in the making. For now at least however, he seems to be serving effectively in spreading the party's support across the country, and it'll be many years before he is suitable for national leadership, as long as his skeletons stay buried of course."
 afghanistan_events.208.a: "A promising young man, but lets hope the rumours stay as such."

 afghanistan_events.209.t: "Our Economy"
 afghanistan_events.209.d: "Despite the interruptions faced by the civil war, Afghanistan's industry continues to rise, rather than stagnate back into feudal nothingness. Much of this growth has been attributed to major moguls such as Sher Khan Nashir and Abdul Majid Zabuli, who have become the face of national commerce and trade. For some however, rather than representing progress, the increasing influence of these men is instead regarded as a step backwards into despotism, simply devolved to the elites rather than a singular king.\n\nOne of the leading voices when it comes to this criticism has been Representative Ghulam Mohammad Ghobar, an independent affiliate of the Pashtun Democrats. Although once an ally of the Prime Minister and other Democrats, Ghobar declined an offer to join the party on its foundation, having grown disillusioned at the involvement of both foreign and national business magnates in Afghan reformism. Their continued influence into the constitutional era has only further confirmed his apprehensions, and today he has published an article criticising the Democrats known as \"Our Economy\".\n\nIn this article Ghobar takes aim at not only the magnates like Zabuli and Nashir, but also at foreign companies such as Krupp and even Prime Minister Arti for allowing their influence to become so entrenched. According to Ghobar the growth of unfettered capitalism in a previously feudal society has simply allowed renewed oppression of the workers rather than the peasants. His article's primary conclusion states that for Afghan society to prosper, legal protections must be introduced for workers, trade unions must become commonplace, and monopolies must be broken up through legislation and nationalisation. To many his ideas seem one turn away from syndicalism, yet the article is already seeming to have an impact on economic discourse."
 afghanistan_events.209.a: "The man's right on the money, we should be open to his ideas."
 afghanistan_events.209.b: "Men like Zabuli are the future, they must be embraced."

 afghanistan_events.210.t: "Republicanism in a Constitutional Age"
 afghanistan_events.210.d: "The idea of simply a constitutional monarchy has long been regarded as a pipe dream in Afghanistan, and that is just when looking at those in the intelligentsia who had even begun to comprehend such a possibility. The idea of an actual republic was considered even more of an impossibility, discounting the bastardised evolution of despotism upheld by Azadist radicals wishing to be the new Savinkov, especially when the \"enlightened absolutism\" of Amanullah was taking the nation by storm.\n\nYet now, with Amanullah dead and buried, and a constitutional monarchy finally in place, perhaps what was once thought impossible may finally begin to have a chance. Members of the Democrats such as Abdul Rahman Loudin have long harboured republican sentiments, and even the Prime Minister is known to have condemned the institution of monarchy in private before. In recent weeks these members have begun to agitate for their cause, beginning with questioning what purpose the monarchy still serves with its power almost entirely stripped away.\n\nAlthough still appealing to prime minister Arti, it appears blindingly obvious that there is little to gain from proclaiming the end of the monarchy tomorrow, and that it would simply serve to set much of the nation against the government in a time where healing is desperately needed. When the time is right however, perhaps when the monarchy's popularity fades, a republic could be a more viable prospect. Quite a few Democrats however have also begun to prefer the current system, and perhaps instead committing to the status quo would be more beneficial."
 afghanistan_events.210.a: "A republic must remain on the table, but only once there is the will for it."
 afghanistan_events.210.b: "The crown is already defanged, the boat doesn't need to be rocked further."

 afghanistan_events.211.t: "New Day, Same Debate"
 afghanistan_events.211.d: "Little has been more controversial over the past decade than the status of the veil, and more time has perhaps been spent debating and fighting over the issue than any other in recent years. Even since the former queen Soraya first lifted her veil, people in Afghanistan have fought back against this idea spreading to their women. In those days two of the most vocal internal critics of Amanullah's unveiling policy were Abdul Hadi Dawi and Abdul Rahman Loudin, leading to their disillusionment with Amanullah's rule.\n\nAlthough in Dawi's case his opposition to the veil led him down a more conservatively minded path, taking umbrage with other reformist ideas perceived as too radical, Loudin continued his association with the left in spite of this. Even now however, as the Ministry for Women furthers attempts to spread unveiling to rural areas, Loudin continues his crusade against the idea. The past weeks have been filled with internal party debate over the issue, with opponents arguing it will risk further national conflict, while supporters counter this by asking how things could even get worse at this point. Few however expect this to lead to any policy changes, with the government committed to the changes."
 afghanistan_events.211.a: "The worst has already happened, why turn back now?"

 afghanistan_events.250.t: "Officialising the King's Party"
 afghanistan_events.250.d: "With the elections now weeks away, the Party of Independence and Reform is at last fully beginning to assemble, going from a few lines on paper to an actual functioning political party.\n\nCandidates for every constituency have been selected, with the major constituencies providing votes a choice between multiple FET candidates, although a few rural ones simply have a singular approved candidate. Amanullah's most loyal supporters have been given premium constituencies, with the people strongly encouraged to back the correct candidate on the ballot. It seems at last that the King's grand designs are at last falling into place."
 afghanistan_events.250.a: "Who needs any other party?"

 afghanistan_events.251.t: "The First National Elections"
 afghanistan_events.251.d: "Throughout the nation voters have gone to the polls, with election officials reporting to the government how overjoyed the nation's citizens have been at finally being gifted the right to elect Afghanistan's government.\n\nWithin a few hours the official results are expected to be announced, adjusted as needed, with many waiting with bated breath to see at last the fruits of their democratic duty."
 afghanistan_events.251.a: "The Party of Independence and Reform wins!"
 afghanistan_events.251.b: "The King's party wins the vote!"
 afghanistan_events.251.c: "Victory goes to Amanullah's Party!"

 afghanistan_events.252.t: "Afghanistan Goes to the Polls"
 afghanistan_events.252.d: "Once again the Afghan people have been blessed with a right to vote, allowing them to show their support for the candidates the government has selected for them, and get rid of those who have run their course in government.\n\nAlthough unofficial turnout numbers appear to be lower than last time, the official reports have praised the outstanding commitment of the people to democracy, with the votes soon to be fully counted."
 afghanistan_events.252.a: "The King's party wins once again."

 afghanistan_events.253.t: "The King's New Clothes"
 afghanistan_events.253.d: "The suit: perhaps the greatest symbol of Western dominance since the pith hat or field gun. For a decade now the only time you would see the King not wearing one is when he donned an army uniform, with it quickly becoming a great symbol of his rule. In the years prior to the civil war, it was even illegal for a man to wear anything else in the capital, even with enforcement being far from universal. Although certainly not the most unpopular thing Amanullah ever did, many of the nation's tribal leaders have long resented being forced to dress like a German businessman every time a Jirga was summoned, being one of the thousand cuts that brought about his temporary ouster.\n\nIt no doubt came as a shock to many in [AFG.Capital.GetCapitalVictoryPointName] then when the king marched out on the streets this week, dressed more akin to a regular goat herder than the Western man he has long portrayed himself as. Some were allegedly so confused by the incident that rumours begun to swirl that someone else had taken the throne once again, with Amanullah unrecognisable in his new robes. It appears as though the King, determined to win back the tribes, has fully abandoned Western wear, and his previous decrees are seemingly now null and void. The idea of not having to squeeze into an ill fitting dress jacket has certainly been well received by the rural elite, however few are convinced that this sudden change of heart is anything but cynical."
 afghanistan_events.253.a: "At least they're not invisible."

 afghanistan_events.254.t: "Loose Ends and Loose Lips"
 afghanistan_events.254.d: "Although the official story of Habibullah Khan's assassination has always been, and will always be, that an unknown assassin killed the late Emir on orders of Nasrullah Khan, the unofficial narrative is much more malleable. For many years there has been rumours, perhaps credible, that the man who carried out the foul deed was none other than Shuja-ud-Daula Ghourbandi. For many years there has also been even less credible rumours that Amanullah was the one to order the killing, inflamed further by the many promotions Ghourbandi received from the King to cushy positions.\n\nUntil recently, Ghourbandi found himself in one of the highest ranking positions of the Directorate of Intelligence Records, after a long string of policing and security related jobs within government. Unfortunately for Ghourbandi, the Directorate has been a target of Amanullah over recent months, with the King said to blame them for not stopping Purdil or Nadir before they even had a chance to seize the throne. Ghourbandi for once found himself out of a job, and shunned from high society.\n\nLosing his job in such a disgraceful manner has apparently hit the man hard, with many credible reports that he has turned to drink, an addiction so bad he can't even control what is coming out of his mouth anymore. Shockingly in his delusion he seems to have been going around to anyone who will listen, and falsely confessing to having assassinated the late Emir, attributing it partially to personal distain but more importantly partially to an order from Amanullah. Although clearly the false words of a man taking it out on the world, perhaps it is worth sending a few of his successors from the Directorate to make sure he stays silent for good."
 afghanistan_events.254.a: "It was terrible to hear of his suicide...wait or was it a robber?"
 afghanistan_events.254.b: "Who will they believe, a jaded drunk or their king?"

 afghanistan_events.255.t: "Expendable Engineering"
 afghanistan_events.255.d: "With work on [267.Controller.GetVictoryPointName_12769] slowly progressing past the stage of simply putting the pieces back together, and into the stage where creative decisions will have to be made, it has become apparent that a new team of architects will be needed if work is to continue. Most of the previous team is now either dead or refusing to return to Afghanistan to continue work, and for the past few weeks attempts to find replacements have been ongoing. With most of [267.Controller.GetVictoryPointName_12769] being designed by Germans, it is only logical their replacements also be German, and so recruiters have been dispatched to attempt to find enough desperate men in Germany for a new team.\n\nUnsurprisingly it hasn't been too hard to find educated German men willing to be somewhere else other than Europe in these trying times, and so a new team has finally been assembled. Outside of the formalities though, one of these men has been suggested as a replacement for the currently vacant position of chief architect, that being one Franz Ruff. Ruff is said to be from a Bavarian architectural family, and claims to be able to expertly mimic the style of Walter Harten, the original project lead of [267.Controller.GetVictoryPointName_12769]. If desired, he may be a fitting pick to fill the vacancy."
 afghanistan_events.255.a: "Ah good, hopefully he'll last longer than the last one."
 afghanistan_events.255.b: "No, I'm sick of Germans."

 afghanistan_events.256.t: "Replacing Rahmatullah"
 afghanistan_events.256.d.start: "Although he will never show it, especially to the public, the death of Crown Prince Rahmatullah still hits Amanullah to this day. His favourite son, taken from him far too young by bandit savages, labelled by many a failure rather than the great ruler he was destined to be. Unfortunately for the King, a ruler does not have the luxury to mourn forever, and as morbid as it may be he still has other sons to consider."
 afghanistan_events.256.d.reformist: "$afghanistan_events.256.d.start$\n\nWith his wife Queen Soraya Amanullah has fathered four sons, although only one still remains. Rahmatullah's fate is now common knowledge, but many outside of the royal household have slowly forgotten the lives of Saifullah and Hymayatullah, also taken far too young but from disease in their cases. The young Prince Ehsanullah still however lives, brought up alongside half a dozen of sisters, of whom fortunately none have suffered a similar fate to their brothers.\n\nWith Ehsanullah finally getting to the age that Rahmatullah first began to assume royal duties, it appears that it is time for the King to move on, and begin raising his son to be his successor. Not wishing to see the same happen twice, he has ensured that Ehsanullah does not seek a military career, instead seeking to educate him more into the blossoming field of politics. Hoping to continue close relations between the two families, Amanullah has even begun considering his niece Leyla Tarzi as a perfect wife for the prince, with her being the Prime Minister's daughter, a suitable bride for a politics focused prince."
 afghanistan_events.256.d.traditionalist: "$afghanistan_events.256.d.start$\n\nOwing to harem era traditions of favouring the primary wife, only the scions of his relationship with Queen Soraya have been historically considered in line to the throne. Yet despite that, the poor public opinion of the Queen combined with linger instability has led to Amanullah to perhaps reconsider this idea. From his first marriage, when he was barely a man, Amanullah Khan fathered Prince Hedayatullah, losing his wife unfortunately in the process. Not expecting to take the throne, Hedayatullah has instead become a rather well known academic in the study of Pashto literature, staying outside of royal politics.\n\nFor a realm that has begun to shift towards celebrating traditional Pashtun culture, who else could be more fitting of a Crown Prince than one so dedicated to promoting it...and one who has stayed quiet enough to avoid generating unwanted enemies. Although not yet moving to officially recognise Hedayatullah as his heir, Amanullah has at least begun the process of grooming him to the position, hoping to have him fully suitable before breaking the news to the Queen."
 afghanistan_events.256.a: "Maybe he should stay away from any frontlines, just in case."

 afghanistan_events.257.t: "Forming the Nazo Ana Auxiliary"
 afghanistan_events.257.d: "For a land where it has long been taboo for a woman to simply leave her home without a man alongside her, the suggestion that one day women might serve in the armed forces would have been regarded as a joke up until a few weeks ago. In times of war, when the men are sent off to the frontlines to fight and die for the nation, it has long been recognised that not every man can actually be sent. To support the armed forces, thousands of men stay behind, coordinating the things that make the army actually tick, such as supply lines and increasingly now radio communications.\n\nMany have long pondered however: why do these roles have to be carried out by men? After all, why waste more bodies on the backlines when they could be out there fighting for the nation. The solution has become increasingly obvious, that a large number of these roles could instead be handed to women. To that end a new scheme has been launched, with the backing of Amanullah's sister Princess Kubrah, to trial a women's auxiliary force to handle administrative and clerical tasks for the men at the front.\n\nWishing to appeal to nationalist fervour, the auxiliary has been named after Nazo Ana, the great Pashtun poet who famously charged into combat alongside the men to protect her home. The scheme's supporters, especially those within the AHN, have praised it as a fantastic way for women to support themselves and remain active while their men are away from home, believing in time many women will choose to sign up in times of conflict. Once the initial trial period is over they hope to expand the idea even further, perhaps even considering a role for women in the Air Force as well."
 afghanistan_events.257.a: "Let it be known women can serve the nation just as a man can."

 afghanistan_events.300.t: "Arrival of the Brothers"
 afghanistan_events.300.d: "The rather sudden turn of fortune experienced by Hashim has been a surprise for all of the Musahiban brothers, to the point that perhaps it would have been Mahmud or Wali made king if they were the ones closest to the capital at the time of Amanullah's demise. All three of Hashim's living brothers, alongside Momand and his men, have finally arrived back in the capital to meet with the King. Discussions on what to do next have been immediate, with none of those present liking the current situation, especially with Fazl Omar Mojadidi slowly attempting to consolidate power in himself.\n\nIt did not take long for all four brothers to agree that the current alliance with Saqqawist remnants and the dominating position of the Mojadidis must remain a temporary affair, and that royal power must begin to reassert itself. Both Wali and Aziz have pushed to begin immediately reigning back in the Sher Agha and reasserting authority, although Mahmud is said to prefer a more restrained approach until things have further stabilised. If however Hashim truly wishes to be King, rather than the next Shah Alam, he will have to make his move at some stage."
 afghanistan_events.300.a: "The enemy of my enemy quickly stops being my friend..."
 afghanistan_events.300.b: "We are hardly in a position to begin moving against the Mojadidis."

 afghanistan_events.301.t: "The King in Kandahar"
 afghanistan_events.301.d: "Already weary from the civil war, the death of Amanullah was enough of a shock to see many of his fervent supporters either immediately lay down their arms, or flee the country at the earliest opportunity. Some however have remained defiant, especially those who see an opportunity to stake a claim for themselves. To the south of the capital, the late king's brother in law Ali Ahmad Khan has declared himself Amanullah's successor, with the backing of local tribal leaders.\n\nRather than repeating the successes of Amanullah in raising an army against the rightful king, few have heeded Ahmad Khan's calls, with only a token force operating under the pretender's banner. Even fewer stayed and fought alongside him when the royal army arrived to put down his insurrection, quickly fleeing upon realising how doomed this plan was. Unfortunately for their would-be king, rather than perishing as a martyr for the cause, he was simply wounded and later captured by our troops. He now finds himself being dragged back to [267.Controller.GetVictoryPointName_10737], where he will soon be praying to Allah that he had died in Kandahar instead."
 afghanistan_events.301.a: "Hopefully the last of their insolence."

 afghanistan_events.302.t: "The City of Sin"
 afghanistan_events.302.d: "[267.Controller.GetVictoryPointName_12769]: Once the great symbol of Amanullah Khan's reign, a shining jewel of European ideals stamped next to the former capital, now finds itself to be little more than ruins and rubble, perhaps still rather symbolic of the late King's legacy. With the city being seen as almost an idol that represented Amanullah's blasphemy and destruction, it was reduced to its present state when Saqqawist forces captured it. Although Amanullah began efforts to restore the city during his brief restoration, his death unsurprisingly scuppered all remaining plans.\n\nDespite the nation's radicals seeming content to leave [267.Controller.GetVictoryPointName_12769] destroyed due to what it represents, the more levelled headed cannot disagree more. Amongst the Telai brothers, Aziz especially, the idea of just leaving it as such as the nation rebuilds seems completely asinine. Our \"allies\" have objected however to Aziz's plans, demanding that the city remain a testament to Amanullah's folly and blasphemy, and that we must not begin back down the path he once walked."
 afghanistan_events.302.a: "The city is ours to rule, not ruin."
 afghanistan_events.302.b: "It shall stay a ruin for now."

 afghanistan_events.303.t: "The Continuity Cabinet"
 afghanistan_events.303.d: "The combination of both the civil war and the swift Musahiban restoration has virtually eliminated all traces of the previous Amanite administrations. Most ministers from the Amanullah years find themselves now in a ditch, or refugees in the lands of the Turks, with the jury still out on which of them suffered a worse fate. Despite however the old king favouring loyalist cronies for cabinet positions, a few of his ministers surprisingly both owe little loyalty to the man over the state itself, and are actually good at their jobs.\n\nTwo of these men, Ali Muhammad Khan and Faiz Khan Zikeria, have been offered their old jobs back owning to their effective work and non-partisan nature. Their ties to Momand and his Azadist allies have certainly further cemented the King's confidence in their loyalty to the realm. Unsurprisingly however, the Hazrat Nur al-Mashayikh has objected to this idea, believing all those who worked for Amanullah to be tainted. Mojadidi, from his self appointed position of authority, has demanded that these men be removed at once, and be replaced with members of the ulema appointed by himself."
 afghanistan_events.303.a: "We're not in a position to turn down good men."
 afghanistan_events.303.b: "Even the most incompetent mullah will do the job better than these lackeys."

 afghanistan_events.304.t: "Mojadidi's Proclamation"
 afghanistan_events.304.d: "Although solely appointed as Interior Minister one would think that Fazl Omar Mojadidi had crowned himself with the way he has been acting since Hashim's ascension. Over the past few days especially he has reportedly begun giving grand speeches in [267.Controller.GetVictoryPointName_10737], stated to be official government policy.\n\nMany of these policies have however come as a shock to the King and his brothers, who have been informed of them through second hand reports of the Hazrat Nur al-Mashayikh's speech. It seems that unless something is done, the man will just continue to get bolder and bolder..."
 afghanistan_events.304.a: "Who died and made him the king?"

 afghanistan_events.305.t: "The Matter of the Azadists"
 afghanistan_events.305.d: "As one of the most steadfast allies of the Musahiban, the appointment of Mohammad Gul Khan Momand as head of the armed forces has long been planned, even before the death of Nadir. Since Hashim's ascension however, the plan has yet to be executed, owing almost entirely to stiff opposition from Fazl Omar Mojadidi and his supporters. To them the Azadists, who Momand leads, are guilty of the same sins of anti-Islamic westernisation that Amanullah met his end over.\n\nNot only has Mojadidi gone as far as demanding that Momand be blocked from leading the army, he has taken a step further and called for the expulsion of all Azadists from the armed forces, to \"purify\" them. Although perhaps they are right in regards to the Azadists being incompatible with our current direction, it can hardly be worth purging so many competent men from our armed forces, especially those so closely allied to the King."
 afghanistan_events.305.a: "There is no man better for the job than Momand."
 afghanistan_events.305.b: "Hold off on the promotion, but keep the Azadists around."
 afghanistan_events.305.c: "They are no better than Amanullah, get rid of them."

 afghanistan_events.306.t: "Purging of the Syndicalists"
 afghanistan_events.306.d: "When Amanullah Khan first presented his constitution in 1923, it was the Hazrat Nur al-Mashayikh who first openly criticised it as a syndicalist document, decrying it in the middle of the bazaar. Since then he has rallied against so called \"syndicalist liberals\" who aided Amanullah in creating it, regarding them not just as a threat to the nation but to the entire Islamic world. Even after our token response to his calls to expel Amanite ministers, it appears that Mojadidi is not yet satisfied.\n\nEven now, more of the men who once served Amanullah find themselves in our current government or working alongside it, having been regarded as skilled non-partisan actors. The Sher Agha however has come down hard, and called for a total break from the Amanite years, doomsaying about potential syndicalist infiltration if not quickly dealt with. Whether or nor we wish to give in to these further demands is a decision only the King can make."
 afghanistan_events.306.a: "Purge these degenerate westernisers."
 afghanistan_events.306.b: "Those who genuinely aim to improve Afghanistan must be worked with."

 afghanistan_events.307.t: "The Islamic State"
 afghanistan_events.307.d: "The Sher Agha is not the only religious leader in the Islamic world to hold the views that he does, a fortunate or unfortunate factoid depending on your opinions on the man. In neighbouring India, the scholar Abul A'la Maududi has been both a great inspiration and great peer for Mojadidi, with both men regularly communicating with each other, especially on topics of Islamic governance. On the invitation of Mojadidi, Maududi visited Afghanistan earlier this week, a visit agreed upon without the King's personal input.\n\nThe primary topic of discussion between these two religious leaders concerned Maududi's recently developing ideas of an \"Islamic State\", creating what he believes to be a nation truly based on Sharia without the corruptions of modern society. Under his vision Islamic law would be the sole law, where anti-Islamic practices such as usury or ikhtilat are treated as crimes against Allah, rather than being accepted as just the realities of modern life.\n\nUnsurprisingly Mojadidi has greatly approved of such a vision, believing it to be what the Afghan state should actually be reforming towards, rather than the Western and secular vision once upheld by Amanullah. Within the non-Mojadidi led parts of government however, this vision has been torn apart as incompatible with reality, with ministers condemning Maududi's positions on economics especially as borderline illiterate, and a vision we must strive to avoid letting happen."
 afghanistan_events.307.a: "Maududi's grand vision is one we should strive towards."
 afghanistan_events.307.b: "An Indian quack who doesn't even believe in economics isn't worth listening to."

 afghanistan_events.308.t: "The Voice of Truth"
 afghanistan_events.308.d: "Although the Hazrat Nur al-Mashayikh may be the most prominent Mojadidi in the political realm, the rest of his family find themselves doing their own part to shape the government towards their vision. Mohammad Sadiq, alongside Fazl Omar's own son Muhammad Ibrahim Mojadidi, have worked hard for months now to begin production of a new government sanctioned newspaper known as the Neda-e-Haq, the Voice of Truth.\n\nPolitical newspapers are nothing new to Afghanistan, but the Mojadidis seemingly hope that in time their paper will be the sole source of truth throughout the nation, whatever they decide the truth shall actually be. Allowing them such unfettered control is hardly a popular proposition in the palace, with Hashim's brothers wishing to take over the paper instead to ensure it is their version of the truth being distributed by the government. Moving against Fazl Omar's own son will be seen as a direct provocation however, and Hashim has begun to consider whether it may be best to avoid doing so, or to alternatively appoint oversight to the paper to ensure they print the actual truth, even if that comes at the detriment of both parties."
 afghanistan_events.308.a: "The only truth is the King's."
 afghanistan_events.308.b: "It would be unwise to interfere."
 afghanistan_events.308.c: "Ensure they print the unbiased truth."

 afghanistan_events.310.t: "The Cabinet Reshuffle"
 afghanistan_events.310.d: "With his power continuing to slip with each passing month, the great influence Fazl Omar Mojadidi once had over the government now seems like a distant memory. Rather than the silent power behind the throne he has long imagined himself as in his head, the King's constant moves against him and his ideas has slowly eroded away what little power the man actually held.\n\nThe final blow against him has come today, with Shah Wali Khan now set to replace him as Interior Minister. The once great Hazrat Nur al-Mashayikh, now just another mullah, is set to be reappointed as a foreign ambassador, the traditional polite way to exile someone in Afghan society."
 afghanistan_events.310.a: "It'll be nice to finally be rid of him."

 afghanistan_events.311.t: "The King's Power Fades"
 afghanistan_events.311.d: "Even with the best efforts of the Musahiban brothers, it seems that the rule of the Mojadidis is not so easily broken. More and more policies going their way over the recent months have allowed the Sher Agha to completely cement his grip over the government, to the point that further action against him is now perceived as too dangerous to consider.\n\nRather than risk retaliation and potential dethronement for attempting to challenge the power behind the throne, attempts to move against him have simply been shelfed for now. Perhaps one day however, when he makes a mistake or finally leaves this mortal coil, another opportunity may present itself..."
 afghanistan_events.311.a: "The Hazrat Nur al-Mashayikh reigns supreme."

 afghanistan_events.350.t: "The Prodigal Emir"
 afghanistan_events.350.d: "Although many are aware that Amanullah first obtained the Afghan crown through his father's suspicious death, many have slowly forgotten that it did not immediately pass to him. At the insistence of Emir Habibullah's eldest son Inayatullah, the crown instead initially went to the Emir's brother Nasrullah. Within days however the snake Amanullah launched a rebellion against his uncle, forcing Nasrullah's surrender and seizing the crown for himself, promising not to harm Nasrullah in return.\n\nWhat happened next has long been a source of debate, although the commonly accepted theory amongst the nation's elite is that an Ottoman emissary overheard plans to execute Nasrullah and blame him for Habibullah's killing. This emissary reportedly then informed the former Emir, and aided in his escape to the Ottoman Empire, before any soldiers could carry out Amanullah's orders. In absentia Nasrullah was sentenced to death, although no attempts were made to carry out this sentence, with him maintaining a low profile in exile.\n\nNow however, with his usurper having received a taste of his own medicine, Nasrullah has reached out to the new government and simply requested a desire to return from exile to live as a private citizen, hoping to once again see his homeland. Although a rather understandable desire, one to with many hold great sympathy, the potential threat of Amanites reshifting their allegiances to a returned Nasrullah could be too great a risk so soon after the civil war, giving the government plenty of cause to reject his request."
 afghanistan_events.350.a: "There is little harm in him returning."
 afghanistan_events.350.b: "He'll just plot against us, no."

 afghanistan_events.351.t: "The Anti-Yahya Khel Party"
 afghanistan_events.351.d: "The flight of pro-Amanullah intellectuals and writers has unfortunately given rise to an organised opposition group for exiles, known as the Afghan Democratic Party. Led by a disparate coalition of leaders, many of whom actively bicker with each other, this so-called \"party\" has a shambolic platform that loosely resembles progressive republicanism. Much of the party brass does not seem to be ideologically devoted to their cause so much as embittered against the Yahya Khel (synonymous for Musahiban).\n\nThe party has landed itself in Lahore, kept aloft by the local emigre community and with some tacit and hands-off support from [891.owner.GetNameDef]. Amanullah's penchant for personalism has, fortunately for us, left him with no clear political heirs, and thus it is unlikely that this organisation can or will present any sort of threat in the foreseeable future. That our neighbours see fit to entertain their seditious finger-wagging is an issue that will only disturb regional diplomacy, however."
 afghanistan_events.351.a: "Get a chance, losers."

 afghanistan_events.352.t: "A New Coin for a New Dawn"
 afghanistan_events.352.d: "The currency of Afghanistan for the last several years has borne the name of Amanullah Khan. Though no currency has ever featured his likeness (for that would imply the King's image competes with that of Allah's, as many Mullahs believe no human form should be depicted in art) there now exists a dissonance between the name on the money and the name on the throne. Per a firman issued by King [ROOT.GetLeader], a resolute campaign to replace Amanullah's name with [ROOT.GetLeader] on the Afghani over the span of the next two years has begun. The government shall begin exchanging outdated currency with the new, melting down the subdivided puls to offset costs for the government mint.\n\nAlthough this housekeeping is necessary, it is going to be a tedious and diligent affair, given how decentralised the kingdom can be. Once his name has been wiped from the coin, it is believed that people will have an easier time seeing the Seraj era as history and the Telai era as the one they're now living in."
 afghanistan_events.352.a: "We're making big money moves!"

 afghanistan_events.353.t: "The Shinwari Shuffle"
 afghanistan_events.353.d: "The Shinwari Tribe, ever so eager for a chance to rise against the government, have engaged in a campaign of guerilla warfare against our outposts and, most concerningly, against dignitaries from foreign nations. Having previously risen against Amanullah at the end of the 1920s, one would think their enmity to his rule would make them predisposed toward Nadir's much more pragmatic reign, but bafflingly so they've declared their intention to be his restoration to the throne. Even if tribal taxation conflicts were most certainly worse under Amanullah, supposedly our continued collection was the trigger for their activities.\n\nA threat to our consolidation as they already are, we also stand to lose out on our carefully crafted diplomatic alliances with the great powers of the world. We have been warned by the ambassadors from our most prominent benefactors that we must contain their insurgency or face repercussions. The elders of the tribe are lukewarm on the efforts of their tribesmen, making them susceptible to the timeless strategy of bribing them.\n\nThat… or we could just shoot a lot of them. That would work too."
 afghanistan_events.353.a: "Tribal elders; this is Afghanistan. You can always cut a deal!"
 afghanistan_events.353.b: "I've given them enough chances."

 afghanistan_events.354.t: "The Victories of Violence"
 afghanistan_events.354.d: "Our campaign to forcefully repress the Shinwari tribe's guerilla campaign has succeeded! Over the last two weeks, troops led by Momand have ambushed and dispersed them, tracking them back to their hideaways and eliminating all pockets of resistance remaining in their region.\n\nFor good measure, the Shinwari elders have been exiled to Iran, bottlenecking their influence and setting an example to the other tribes on precisely what dividends resistance will pay out for them."
 afghanistan_events.354.a: "Excellent!"

 afghanistan_events.355.t: "The Blunders of Bloodshed"
 afghanistan_events.355.d: "Unfortunately, our military campaign against the Shinwari insurgency has become much more protracted and costly than what we initially envisioned. While steady progress has been made, this is not an opinion shared by foreign dignitaries.\n\nSeveral diplomats have temporarily abdicated on the recommendation of their home office, and our alleged inability to guarantee their safety has called not only our foreign affairs into question but also the legitimacy of our government."
 afghanistan_events.355.a: "We just need time, time and money, and we'll get them off our back."

 afghanistan_events.356.t: "Between Probity and Quid Pro Quo"
 afghanistan_events.356.d.body: "As Nadir's plans to establish \"Conciliation and Progress Committees\" across the nation pass the initial planning phase, Afghanistan takes another step toward a long-awaited future of unity. These committees, which will function as a judicial intermediary body between the Palace and the Tribes, will make our dealings with the tribes vastly more efficient and will better integrate them into the government framework. Additionally, intertribal disputes and tribunals will be handled through these committees.\n\nWe have a number of options available with which we may staff the committees. Firstly, we may adopt preferential treatment for members of the Mangal and Mahsud tribes, who have demonstrated strong loyalty to Nadir. This would chiefly serve to reward them for choosing the right side of history and ensure their allegiance."
 afghanistan_events.356.d.tradnadir: "$afghanistan_events.356.d.body$ Secondly, we can just inject the committees with independent loyalists who possess minimal tribal affiliation, minimising intertribal biases while maximising Nadir's grip on decisions made by the committee."
 afghanistan_events.356.d.reformnadir: "$afghanistan_events.356.d.body$ Secondly, we can promote a sense of democratic responsibility and have the tribes all elect their own representatives onto the committees. This would ease rural Afghanistan into democracy and lay the foundation for a more modern and participatory kingdom."
 afghanistan_events.356.a: "This world is run on favours."
 afghanistan_events.356.b: "Consolidate our influence with loyalists."
 afghanistan_events.356.c: "The tribes ought to have a say in their representatives."

 afghanistan_events.357.t: "A Not-So-Dim Future for the Dhimmi"
 afghanistan_events.357.d: "The Jizya tax, enforced on all non-Islamic Afghan citizens, has finally been repealed by King Nadir. This tax, which had so long served as a tool with which to discriminate against those who did not profess their faith for Allah, severely limited the class mobility of Christians, Jews, Hindus, and even the Zoroastrians. This act has set Afghanistan apart from many other Muslim monarchies, something Nadir has been keen to emphasise and in fact made a show of promoting in a grand conference with several ambassadors. Indeed, this has greatly bolstered Afghanistan's international image, not to mention that several minorities now owe their increased freedoms to the King and thus are counted on to be more loyal than ever before.\n\nNot everyone is happy, especially the Ulema, who are renowned for not being very happy with the government in the vast majority of cases. Accused of selling Afghanistan to Jews and the Christian foreign powers, Nadir's prestige as a defender of Islam appears to have been overshadowed by Amanullah's, who never went quite this far in promoting interfaith egalitarianism."
 afghanistan_events.357.a: "Who cares? Give it a few years and they'll forget about it."

 afghanistan_events.358.t: "All the King's Men"
 afghanistan_events.358.d: "The new legislative makeup, soon to be packed with the King's very own yes-men, fools few but yet provides a reasonable veneer of constitutionalism. The King's faux-commitment to democracy nonetheless, there is observed a burgeoning faction of progressives who, while loyal, make known their dissent to his conservative policies.\n\nThese progressives are made up of former Amanites who were pragmatic enough to lay low during the civil war, disparate liberals opposed to Amanullah's authoritarianism (yet quiet when Nadir is similarly autocratic) and merchants interested in a liberalisation of the market. These progressives are hardly capable of presenting capable opposition and do not register as a threat, but instead manifest as more of a controlled opposition that helps lessen the impression that the legislature is entirely subordinate to the Telai family's whims."
 afghanistan_events.358.a: "The opposition defeats itself merely because it exists, and little else."

 afghanistan_events.359.t: "Fall Guys"
 afghanistan_events.359.d.body: "Though Amanullah's tribal conscription reforms were extremely contentious and a considerable source of unrest for the tribes, we had initially seen the fruits of such a centralised system for the army. As such, the legislature fell in line and the majority voted in favour of retaining it... to the dismay of the tribes.\n\nSeveral tribal elders felt their loyalty to [ROOT.GetLeader] was with the understanding that his reign would bring an end to such a grievous encroachment on tribal autonomy. They've petitioned the King directly, making their anger known, and with such an overwhelming nigh-unanimity a wake-up call has most certainly been had for us."
 afghanistan_events.359.d.nadir: "To protect his reputation amidst the tribes, Nadir made a show of intervening in the legislature and proclaiming his support for an end to Amanite conscription and the development of a brand new system, coordinated with the tribal elders directly. While not technically overruling their decision, it practically did anyway as the legislature held another vote and almost unanimously fell in line with Nadir's proclaimed new policy.\n\nOf course, Nadir is going to claim it was his idea all along, and thus will reinforce his image as a protector of the tribes against the excesses of \"urbanites\" who have little regard for the bedrock of Afghanistan's civilisation."
 afghanistan_events.359.d.zahir: "To protect Zahir and the rest of the Telai branch's reputation, we have directly overruled the legislature and enforced a system more pliable to the tribes. This was met with muted opposition, as most of them know better than to kick up a considerable fuss against our decisions, but there were indeed a few self-destructively liberal-minded types who have taken their criticisms just a hair too far.\n\nA public affair was made of their open censure by other loyal members of the legislature for verbal offences to the throne, and now it would appear as if any attempt to keep Amanullah's conscription system was the work of insidious neo-Amanite infiltrators, instead of King Zahir and his advisors."
 afghanistan_events.359.a: "If the legislature could think for themselves, we'd be in trouble."
 afghanistan_events.359.b: "Nice try, but Liberals never win!"

 afghanistan_events.360.t: "Cleaner Jails for Meaner Males"
 afghanistan_events.360.d: "An inquiry put forth by reformists in Nadir's establishment against the prison system has revealed downright embarrassing and inhumane conditions. Prisoners are fed borderline rotten slop, given slabs of stone to sleep on and guards employ sadistic punishments to keep inmates in line, with security commandant Torah Baz Wazirabadi's brutality being specifically highlighted. Resolving these issues has become a priority, and several reforms have been employed to reduce the mortality rate and hopefully give the incarcerated a chance to exit their sentences with some intention to re-enter society and not track and beat their former tormentors the first opportunity they get.\n\nTo these ends, most of the harsh punishments have been entirely repealed, excluding against the nation's worst enemies, and a new system put in place to promote responsibility among inmates and develop skills they can use when their sentence has concluded. Prisoners are encouraged to sign up for janitorial duties, promoting hygienic conditions and reducing the spread of disease, as well as the construction of libraries and infirmaries to increase the standard of living. Additionally, to improve their performance, a pay increase has been authorised for prison guards and a crackdown on illicit pitfighting and annual auditing will take place to ensure our guardians of the law actually uphold it."
 afghanistan_events.360.a: "Afghan prisoners deserve standards."
 afghanistan_events.360.b: "...But foreign agents don't necessarily count."

 afghanistan_events.361.t: "Brothel Raid in [267.controller.GetVictoryPointName_10737]"
 afghanistan_events.361.d: "As part of our efforts to cleanse the nation of unholy, anti-Islamic debasements, an illicit brothel in one of our greatest cities was raided and all of its occupants arrested. As the proprietors, employees, and patrons are to be subject to humiliation, prison, and in some cases the death penalty, we have hit a sort of snafu. A high-ranking member of the army was one of the patrons arrested, obviously unaware of the operation, and after much haggling on his end was set free and allowed to go home without any immediate punishment.\n\nThough the issue could've been over with there in an ideal world, the local police have of course spread the incident as viciously as they could. Rumours are abound that this man was caught in bed with not one, but two prostitutes, both of whom dressed to look like the wives of Amanullah and Nadir! Whether or not that's true, this is tremendously embarrassing for not only our great army, but our nation as a whole! We can either cover this terrible incident up at all costs and punish whoever we can prove is blabbering about this scandal, or instead fire the ignoble moron who got himself caught in the first place."
 afghanistan_events.361.a: "Let nobody get away with slandering the army apparatus!"
 afghanistan_events.361.b: "...He dares scandalise the Queens? Quarter him!"

 afghanistan_events.362.t: "Unequal Taxation"
 afghanistan_events.362.d: "War is costly, especially civil war, and Afghanistan is no exception to this fact. Paying off tribal Lashkars and mercenaries, the costs of reconstruction and the purchase of arms from traders, legitimate and illegitimate alike, it all adds up. Tribal taxation was one of Amanullah's greatest and most prolonged challenges, and it's no different for [ROOT.GetLeader]. The tribes which supported our effort to rescue the nation from Amanite excesses have received quid pro quo wherever we can afford; indeed, they have been taxed less than under the Amanullah. But those who supported Amanullah have received considerably less favour, in fact, the fief they pay is disproportionately larger than Telai Loyalist tribes.\n\nFrom the get-go, we've received a number of petitions to rectify how unequal this arrangement is, and though we've happily ignored them for this long, the protesting has become aggravating. Many tribes are now refusing taxation until their grievances are heard, and while they've been subsequently coerced against such measures, it's about time we make a statement on the matter. We can either outright deny there's an intentional bias based on loyalties in taxation, or instead frame it as a \"Destruction Tax\" levied against tribes that supported the Amanite counterinsurrection to fund repairs for the devastation that they supported."
 afghanistan_events.362.a: "C'mon, guys, you don't trust the winners to be fair?"
 afghanistan_events.362.b: "It should be expected that they pay for what they've broken!"

 afghanistan_events.363.t: "Rise of the Westernist Bloc"
 afghanistan_events.363.d: "The vast majority of liberals, progressives, and modernists were all run off far away into exile with the rest of the Amanite scoundrels, but farsighted enough to avoid picking sides in the war were able to remain. Nadir has seen fit to make use of the liberals, as with their incorporation into the government comes a healthy public image much appreciable to high-minded foreign diplomats. Of course, some debate around policy is healthy, just so long as these liberals understand that at the end of the day the King makes the final call.\n\nThrough creaking open the floodgates ever-so-slightly, Nadir has allowed the so-called \"Westernist Bloc\" to attain a comfortable minority in the legislature. Ideological uniformity is to be desired among them, however. Federalists who wish to apply the thought of Chinese Warlord Chen Jiongming to Afghanistan's needs, Kemalists who heed the Islamic Modernism of Mustafa Kemal in Anatolia, and many who look to the democratic foundations of the United States as blueprints for Afghanistan's future. Though their contributions are fated to be achingly gradual, who knows how their ideas may contribute to Nadir's vision of the nation in the future?"
 afghanistan_events.363.a: "A rudiment of democracy survives in Afghanistan."

 afghanistan_events.364.t: "Nasrullah Speaks Up"
 afghanistan_events.364.d.reform: "With our acquiescence to his return, Amanullah's exiled uncle, the brief Emir of Afghanistan Nasrullah, has come back to his homeland as a private citizen, settling into a comfortable retirement in a comfortable [267.controller.GetVictoryPointName_10737] residence. Fears that he would serve as a lightning rod for Amanite discontent were quickly put to rest, as the elderly prince quickly and resolutely voiced his loyalty and commitment to the reigning monarch, instead committing himself to his longstanding religious pursuits.\n\nA deeply religious figure, Nasrullah is a recognised hafiz, one who has memorised the entire Qur'an, and he was a longstanding royal ally of conservative religious circles under the late Habibullah. For most of his adult life, Nasrullah spent as much time as he could spare to mingle with Hanafi scholars, and his return from exile has seen him quickly recultivate relationships with the latest generations of religious leaders in the kingdom. Already, he has ingratiated himself as an informal patron of mosques and madrasas, lending a hint of royal tinted legitimacy to various clerics, classrooms, and charities.\n\nIt is from this vantage point that Nasrullah has been tapped by several leading religious figures to voice their concerns and anger regarding Nadir Khan's recent move to dismantle the preeminence of Islamic law. While Nasrullah does not have the king's ear, it is true that his voice is respected by many, even some within Nadir Khan's inner circle. A reserved and soft-spoken figure, Nasrullah has not outright condemned the palace for their actions, but he has privately derided so-called “excesses” in royal policy. There is little point in silencing the old prince, as it would only further inflame religious conservatives. In fact, his gentle protestations, though embarrassing, may serve to vent some of the growing anger in the Ulema."
 afghanistan_events.364.d.trad: "With our acquiescence to his return, Amanullah's exiled uncle, the brief Emir of Afghanistan Nasrullah, has come back to his homeland as a private citizen, settling into a comfortable retirement in a comfortable [267.controller.GetVictoryPointName_10737] residence. Fears that he would serve as a lightning rod for Amanite discontent were quickly put to rest, as the elderly prince quickly and resolutely voiced his loyalty and commitment to the reigning monarch, instead committing himself to his longstanding religious pursuits.\n\nA deeply religious figure, Nasrullah is a recognised hafiz, one who has memorised the entire Qur'an, and he was a longstanding royal ally of conservative religious circles under the late Habibullah. For most of his adult life, Nasrullah spent as much time as he could spare to mingle with Hanafi scholars, and his return from exile has seen him quickly recultivate relationships with the latest generations of religious leaders in the kingdom. Already, he has ingratiated himself as an informal patron of mosques and madrasas, lending a hint of royal tinted legitimacy to various clerics, classrooms, and charities.\n\nWith our recent moves to promote piety in our government and among our people, Nasrullah has grown only more supportive of our rule. He has hosted an informal gathering of the religious establishment in his home to push for increased Ulema support for the monarchy, tasking the assembled clerics with promoting and aiding the roll out of these new initiatives. While he remains personally opposed to our concessions to the tribes and the reversal of Amanullah's conscription efforts, there is no question that Nasrullah is contented to be a dignified supporter of the Telai monarchy. He is an elder uncle of the nation, one of the last remnants of the bygone age of Abdur Rahman."
 afghanistan_events.364.a: "Let the old man gripe."
 afghanistan_events.364.b: "His support is most appreciated!"

 afghanistan_events.365.t: "Unmanacling the Mullahs"
 afghanistan_events.365.d.body: "Abdur Rahman attacked their influence, Habibullah lent them a cautious olive branch, but then Amanullah clashed and beleaguered them. The Ulema desires, after countless decades, to see a monarchy that might yet lift the boot. [ROOT.GetLeader]'s Afghanistan will right the wrongs of the past and grant the Ulema the privileges that they've deserved. This is not so much an ideological move as much as pragmatic; in the wreckage of Amanullah's reign and during the civil war much of Nadir's support came from the religious establishment, for he had long been one of the most moderate voices in Amanullah's circle. As autonomy not heard of in years has been granted to them, the new constitution is diffused with faith, too. The preamble now starts with \"In the name of Allah, the Most Merciful\" and the official religion is reinforced as being the Hanafi Shari'a of Sunni Islam.\n\n"
 afghanistan_events.365.d.reformistnadir: "$afghanistan_events.365.d.body$Though Islam shall play a larger role in the new government, that is not to say Afghanistan has bent to fundamentalism. The new constitution states that \"Shi'a Muslims, Hindus, Jews, and otherwise enjoy protection and shall not be discriminated against on the basis of their faith alone\". These are great signals for the religious minorities, especially the Shi'a Muslims, who usually have to practice Taqiya and cosplay themselves as Sunni Tajiks to avoid discrimination and hold government posts (the reality for a considerable number of civil servants). Nadir has appointed two Shi'as to (albeit symbolic) positions in his cabinet to reinforce his regime's plurality. Though this displeases the Ulema, it would seem most have decided not to raise too much of a fuss, as Nadir has thus far proven to be the best friend they've had from the Barakzai yet."
 afghanistan_events.365.d.tradnadir: "$afghanistan_events.365.d.body$Though Islam shall play a larger role in the new government, that is not to say Afghanistan has bent to fundamentalism. The new constitution states that \"Shi'a Muslims, Hindus, Jews, and otherwise enjoy protection provided they do not violate the ordinary rules of conduct and propriety\", albeit these rules are vague and undefined. Though a nice gesture on paper, in practice this means little to the religious minorities of Afghanistan. Most out and open Shi'a Muslims employed by the government can name daily instances of discrimination, and most yet employ the use of Taqiya to deny that they are Shi'a and instead claim to be Sunni Tajiks. In addition to his family occupying almost his entire appointed cabinet, Nadir has appointed two prominent members of the Ulema to reinforce their privileged position in the renewal of Islam in Afghanistan."
 afghanistan_events.365.d.zahir: "$afghanistan_events.365.d.body$Though Islam shall play a larger role in the new government, that is not to say Afghanistan has bent to fundamentalism. The new constitution states that \"Shi'a Muslims, Hindus, Jews, and otherwise enjoy protection provided they do not violate the ordinary rules of conduct and propriety\", albeit these rules are vague and undefined. Though a nice gesture on paper, in practice this means little to the religious minorities of Afghanistan. Most out and open Shi'a Muslims employed by the government can name daily instances of discrimination, and most yet employ the use of Taqiya to deny that they are Shi'a and instead claim to be Sunni Tajiks. Unfortunately for them, being a Sunni Tajik doesn't seem to quite cut it anymore, and Zahir's cabinet has cracked down on \"Tajik fifth-columnists\" due to their supposed ties to the erstwhile Saqqawist insurrectionists. Now only faithful Sunni Pashtuns occupy the most important government posts, regardless of their qualification. Though this has led to some inefficiencies, one can't deny that Pashtun unity will only bring security to our administration's integrity, especially with the support of the faithful Ulema."
 afghanistan_events.365.a: "One big step toward a spiritual and united Afghanistan."

 afghanistan_events.366.t: "An Amnesty, For Your Hand"
 afghanistan_events.366.d: "There currently exists a strange co-existence of a nominally secular legal system and one based within the principles of Hanafi Shari'a. Consequentially, this means that the inconsistency of sentencing may lend itself to convicted criminals having two options to pick from. Secular judgments often employ standard punishments like jailtime, with criminals often being sent to the unsanitary and suffocating Deh Mazang prison in [267.controller.GetVictoryPointName_10737]. However, if a judgment is passed by a Qazi, the penalty exchanged is far more eye-for-an-eye in nature.\n\nIn a recent example, a petty pickpocket who was caught red-handed in Kandahar was originally sentenced to five years imprisonment. To the free spirit of an Afghan, this is a terrible penance to pay. The thief instead opted to plead for an alternative judgment by a Qazi, who, according to the principles of Hanafi Shari'a, declared that the man should instead have his right hand severed so that he may never reach into the belongings of another ever again. Amanullah-era legislation introduced modern science into the equation, so now instead of the hand being gorily lopped off via axe or sword, surgeons in the capital do a delicate procedure with the use of anesthesia, preventing the wrist from damage and making the experience less traumatic than it used to be. This instance is echoed in most cases where the secular court deploys a multi-year sentence, and even a few cases where the criminal is sentenced to decades for a crime that Shari'a sentences death, they swiftly opt for the latter."
 afghanistan_events.366.a: "How long until we do away with the secular courts?"

 afghanistan_events.367.t: "Blood Feuds, Ancient and Modern"
 afghanistan_events.367.d: "Today, our great nation narrowly avoided a terrible tragedy, as three bullets failed to strike Nadir in his vitals and instead only one struck him in the muscle of the shoulder. This all occurred during a public inspection of the army garrison at Herat, where just as the ceremony began a young man brandishing a pistol barbarically fired upon the King! He was apprehended immediately, and his identity revealed to be Abdul Khaliq Hazara, a child (allegedly) of the executed Amanite Loyalist Ghulam Nabi Charkhi. Obviously seeking revenge for the death of his father (his ties to which are often alleged to be through adoption, rather than through blood) he cited the \"unjust persecution and taxation\" of the Hazara as his motives. Nonetheless, his miserable scheme ended in failure, and he currently resides in a military prison where he is routinely beaten and humiliated.\n\nThough the sentence for such a foul, treasonous attack is almost surely execution, expedited as swift as possible, Nadir does have the option to commute the young man's sentence and send him into exile instead. Educated in a German school in [267.controller.GetVictoryPointName_10737], his family sent him to the Royal Friedrich Wilhelm University in Berlin for higher education after a two year sabbatical to promote Afghanistan's ties with the German Empire. Though he has his whole life ahead of him still, he made the decision to throw it away for the sake of revenge all by himself, and his quartering would only honour that choice."
 afghanistan_events.367.a: "Let us be magnanimous; back to Berlin for him."
 afghanistan_events.367.b: "You reap what you sow."

 afghanistan_events.368.t: "The [GetYear] Constitution"
 afghanistan_events.368.d.body: "With the coronation of the new monarchy comes the need to demonstrate to Afghans and the world at large what to expect of the renewed kingdom. To accomplish this, Nadir has set about the creation of a new constitution, one that will provide a clear vision of his reign to all Afghans and to the world itself. Similar to plans by the former King Amanullah, a bi-cameral parliament, consisting of a Lower and Upper House, is to be established. The Lower House is to be elected for 3-year terms to vote on various bills and approve Firmans issued by the King. The Upper House would function as an appointed body of “far-sighted and experienced notables”, serving as a consultative body that also was responsible for passing bills from the Lower House (a function bypassed if they're in recess). All in all, a constitutional monarchy has taken shape.\n\n"
 afghanistan_events.368.d.reformistnadir: "$afghanistan_events.368.d.body$Though constitutional on paper, in practice it is fairly obvious that Nadir still intends to exercise considerable control over the government. For Afghanistan to stay in one piece as it undergoes metamorphosis into a modern nation-state, a competent and sane leader must carefully lead it by the hand. Nonetheless, his government is staffed largely with civilian personnel, his brothers constituting a minority where otherwise many thought they might come to dominate the ministries. Additionally, clear guarantees of a free press, and all Afghans with citizenship, including women, are considered equal. Though sociologically women will not experience the same emancipation they had under Amanullah and much of the liberation enforced in the urban centres will be drastically scaled back, it is at least not a total loss of their rights."
 afghanistan_events.368.d.tradnadir: "$afghanistan_events.368.d.body$Though constitutional on paper, in practice it is fairly obvious that Nadir still intends to exercise considerable control over the government. For Afghanistan to stay in one piece as it undergoes metamorphosis into a modern nation-state, a competent and sane leader must carefully lead it by the hand. The ministries of government have been packed by his brothers and close family associates, forming an ironclad oligarchy that de facto negates the parliamentarian institutions the constitution has established. The nominal free press guaranteed in Article 23 is prohibited in the same breath by a “so long as it does not offend or insult the King, the Government, or besmirch Allah and his commandments”. Additionally, the equal rights granted to all Afghan citizens conspicuously occludes the mention of women, painting an ominous portrait of what the destiny of their emancipation looks like."
 afghanistan_events.368.a: "A new dawn has begun."

 afghanistan_events.369.t: "Scratching at Old Wounds"
 afghanistan_events.369.d: "The official account of Habibullah Khan's assassination, drafted by Amanullah and his cronies in the months following his ascension to power, is that an unknown assassin killed the late Emir on orders of Nasrullah Khan. With the downfall of Amanullah and the return of Nasrullah, however, efforts to determine the truth of the matter have resurfaced, though without much success. For many years it was rumoured that the late emir was shot by Shuja-ud-Daula Ghourbandi on the orders of Amanullah, and that Nasrullah was merely a convenient scapegoat for the Amanite conspiracy. Other rumours, perhaps more credible, claim that Nasrullah and Amanullah conspired together to assassinate their intransigent liege, only turning against one another in the wake.\n\nThose hoping for some clarity from the mouth of Nasrullah have been left sorely disappointed, as the reserved former exile has spoken little of the event. In private, he has firmly reiterated that he had no part in the assassination of his brother, instead voicing his belief that Amanullah was behind Habibullah's death. However, he has no salacious details to add to the rumour mill, and claims to have no knowledge beyond that which is already widely known.\n\nInstead, he has responded to questions surrounding the death of Habibullah with praise for the newfound peace brought to Afghanistan by the Telai clan, and their ending of the longstanding cycles of bloodshed and civil strife which have dominated the last decade. Whether these are genuinely held beliefs, or merely a calculated attempt to stay in the good graces of those in power, his words have resonated with a populace tired of ceaseless civil war."
 afghanistan_events.369.a: "A pleasant surprise."

 afghanistan_events.370.t: "The New Oligarchy"
 afghanistan_events.370.d: "Much time has passed since Nadir's reign began. Before his choice to save the nation, Afghanistan was wrought with instability. To fix her flaws, tools of reckless imposition were sought instead of tools of precision. Foreign methods of government were imposed to appease imperialist powers, government considerations hardly saw past the urban centre, and resources were drained building the costly vanity project of [267.controller.GetVictoryPointName_12769]. The tribes took up arms, tensions rose with our Pashtun brothers in Peshawar, and the wise Ulema was antagonised at every turn.\n\nNow, instead of one man tearing his nation down with his clouded ambitions, there exists a structure of men at the top shepherding Afghanistan through the storm of the 20th century. The great King Nadir and his brothers have accomplished what his predecessor could never achieve; a stable and strong Afghanistan. No decision needs to be taken alone, for he can rely on the advice and consensus of his family before making any potentially risky choices. One mind is certainly not as strong without several others to back it up, especially if that mind is actually willing to listen. There can be no risk of opportunists if the system is designed to allow only one family to the levers of power, too. Some day, the Crown Prince Mohammad Zahir Khan shall take his fathers place, and Allah willing, his uncles will be there to guide him along the same footsteps as his father."
 afghanistan_events.370.a: "Oligarchies are inevitable; Afghanistan is lucky to have one so wise!"

 afghanistan_events.371.t: "Liberalism Run Amok?"
 afghanistan_events.371.d: "Mahmud's tenure as Prime Minister thus far has overseen a steady maintenance of the liberalisation that Amanullah's reign rather recklessly pursued. So much so that the exiled Amanite Abdul Ahad Wardak, one of the biggest faces of Afghan Westernism, has actually applauded our government for not completely bending to backwards reaction and retaining much of the political freedoms that had been developed up to that point.\n\nThe current Minister of the Treasury, Abdul Majid Zabuli, has become the face of the \"Westernist Bloc\" and the most powerful proponent of continued liberalisation. An associate of Mohammad Daoud Khan and a Pashtun nationalist, he enjoys the privilege of speaking his mind much more openly than his Liberal contemporaries and seems to be making a habit of clashing with the Conservatives in the cabinet, most of whom are members of Nadir's family. Now, he clashes with the man credited with convincing Nadir to preserve parliamentarianism. Zabuli believes that the power of the throne must be scaled back considerably in favour of embracing a truly constitutional democracy. To him, Mahmud and Nadir are unnecessarily delaying Afghanistan's progress when the institutions for it are already cemented in place. Fortunately for him, he's kept much of his complaining behind closed doors, preventing Nadir and Mahmud from heeding Hashim's advice that the man ought to be sacked for his intransigence."
 afghanistan_events.371.a: "Maybe he'll tire himself out faster than our patience will."

 afghanistan_events.372.t: "Modernity's Shepherd"
 afghanistan_events.372.d: "The Westernist Bloc, though ideologically disparate, has found itself uniting more and more under the banner of Abdul Majid Zabuli. Finding himself stonewalled in his direct appeals to Mahmud, he has taken to mobilising the Liberals and is behind the proposition of a new bill dedicated to supporting the \"liberalisation and enforcement of women's rights in rural and tribal Afghanistan\". Though our constitution guarantees the equal and fair treatment of women by the government, we've been wise enough not to interfere in local and societal matters, as we're not stupid enough to repeat the same mistakes that Amanullah had. Ordinarily, our Loyalist deputies would simply strike the bill down, but Zabuli has managed to convert a number of them to his side, perhaps weaponising his wealth and economic connections for bribery. Making matters worse, Zabuli waited for the Upper House to go into recess, meaning all he needs to do is pass the bill through the Lower House to sign it into law and delays efforts for the Upper House to vote and repeal it, which gives him ample time to lobby enough of them to his side to stymie a consensus. As it stands, the bill is very likely to pass the Lower House, which is very troubling.\n\nThe last hope of shooting the bill down is through Nadir putting his foot down with a Firman and overriding the Lower House, even if such an action isn't technically constitutionally sound. We're not beholden to constitutionalism, and even Mahmud has indicated to Nadir that a crackdown is very likely going to be necessary. One must wonder if Zabuli is simply trying to goad us, however. A direct confrontation like this will damage our government's constitutional reputation and potentially incite serious unrest with the reformists that we've come to align with. It might be wiser to negotiate for the bill to be watered down, lest we destabilise our ministries unnecessarily."
 afghanistan_events.372.a: "Politics is a game of give and take, Mahmud will negotiate with him."
 afghanistan_events.372.b: "We can't let them shatter the tribal support we've carefully cultivated!"

 afghanistan_events.373.t: "The Showdown Deepens"
 afghanistan_events.373.d: "Negotiations between Mahmud and Zabuli had initially gone very well. Recognising Mahmud's concerns that his proposed bill would incite unrest amid the tribes, especially since it implicates broad applications of force in ensuring compliance with the law, he has watered his proposition down to the direct criminalisation of violence against women and mandating that such cases be prosecuted through secular courts only. Of course, this was his plan all along, but at least it would have been an acceptable pill for us to swallow.\n\nBut Zabuli has gotten greedy. Believing he negotiates from a place of greater strength than is reality, he now demands that we formally consent to the establishment of a party uniting the Westernist Bloc and for the nominated Upper House to be abolished in favour of a democratically elected unicameral legislature. If we do not assent, he plans to (cue our horror and dismay) resign and voluntarily exile himself. He is of course an experienced economist and a valuable asset to the ministry, but this is an egregious overestimation of his value.\n\nThough many die-hard Liberals may follow his example and go into exile, leaving us with a hollowed government apparatus that hardly satisfies neither the reactionaries nor the reformists, maybe we can subvert him. If we call his bluff and have Nadir pre-emptively issue a Firman criminalising femicide and domestic violence, we could split the bloc and make Zabuli's resignation appear more like a petty grab for power. It will also be a lot simpler to stamp our foot down and crack down on them anyway."
 afghanistan_events.373.a: "Issue the firman and embarrass Zabuli."
 afghanistan_events.373.b: "The Liberals have gone too far anyway, crack down on the lot of them."

 afghanistan_events.374.t: "A Benevolently Guided Democracy"
 afghanistan_events.374.d: "Nadir's Firman appears to have successfully killed the bill. Several Liberals and most of the Loyalists argued that the bill was no longer necessary and that the Firman did a much more successful and pragmatic job of securing better rights for women than taking such a heavy-handed approach with the tribes. This disagreement delayed passage of the bill long enough for the Upper House to exit recess, and despite the bill passing anyway, it was subsequently killed in the Upper House.\n\nCaught with his pants down and having overplayed his hand, Zabuli has quieted himself and seems to be secluding himself in his office. Though it appeared to be that he was on the verge of resignation, Daoud Khan privately consulted with him and convinced him to stay on while he defended the man's zeal to the rest of the cabinet. Though Nadir himself seemed pretty uncertain of keeping Zabuli in his position, none could argue that he was probably still the best man for his post, and so no action was taken against his career."
 afghanistan_events.374.a: "But if he tries it again, it'll be a ticket straight to Iran for him."

 afghanistan_events.375.t: "Troubles in the Chambers"
 afghanistan_events.375.d: "Immediately after the bill's passage, Nadir issued a veto overriding the bill and shooting it down. This has caused a major uproar in the Lower House. Infuriated by the complete disregard of the constitutional bounds the Lower House enjoys, the Westernist Bloc and several so-called Loyalists have walked out, eking out enough of a majority to prevent parliament from being called into session (requiring at least 50% attendance) and paralyzing the civilian government. As this debacle continues to unfold, the Liberals in [267.controller.GetVictoryPointName_10737] have called a protest and are loudly demonstrating in front of the Royal Palace and other government buildings, demanding that Nadir make good on his promises to retain a constitutional democracy.\n\nWho do these fools think they are, abandoning their positions to yammer about on the streets? Outraged and incensed by Zabuli's constant indignation, Mahmud has not only forced Zabuli to resign but has requested the army step in to restore order. If they don't get back to their seats willingly, then they'll lose them, permanently."
 afghanistan_events.375.a: "Democracy must be disciplined with a firm hand."

 afghanistan_events.376.t: "A Firmly Guided Democracy"
 afghanistan_events.376.d: "It is a sight not uncommon in this world. Liberal visionaries with their head in the clouds take their stand against pragmatic and realistic leaders, believing they have the right to throw a tantrum and threaten the livelihood of the state with instability. Ad nauseam, the answer is not unlike what a parent gives a child who screams and cries when he is not given the impossible. No shots were fired, but several arrests were made and the ringleaders of the strikes were summarily beaten and thrown in prison for their disturbance. A third of the Westernist Bloc's membership were far-sighted enough to see this coming, having avoided taking direct part in any strike action and returning back to their position the next week, but now, pending a snap election, a sizable chunk of the Lower House is eerily empty.\n\nZabuli has gone quietly into exile, managing his affairs from overseas and continuing to contribute to the companies he has a share in. Irrevocably embittered, we no longer have to suffer his tiresome antics. Though a shame that the situation panned out as it did, Mahmud has a renewed mandate to control Afghanistan's evolution with sterner disposition than Nadir recommended prior. Democracy is not dead, but perhaps it's better off that we keep a rifle to its head than let idealism endanger the peace we've so carefully reconstructed."
 afghanistan_events.376.a: "Don't we deserve credit for not simply gunning them all down?"

 afghanistan_events.400.t: "Heir of Grief"
 afghanistan_events.400.d: "Mohammad Zahir Khan was coronated as Mohammad Zahir Shah today, in a hastily organised ceremony primarily set up by his family and Mohammad Gul Khan Momand to ensure a swift succession and to prevent the imminent anarchy that had begun to sprout after Nadir's assassination. Various regional leaders, citizens of [267.controller.GetVictoryPointName_10737], and of course the entire Musahiban family were in attendance, however foreign dignitaries were unusually scant for such a seminal diplomatic event. It would appear that the enduring chaos of Afghanistan has shaken the nerves (and confidence in our ability to last) of most of these yellow-bellied ambassadors.\n\nRetaining his post as Prime Minister, Mohammad Hashim Khan is set to take on a domineering role in leading the nation. Despite being in his 20s, Zahir is yet still inexperienced in the nuances of governance, necessitating a sort of semi-regency by his uncles. The young man is in no hurry to take on a forward stance, either; his father's body has hardly been cleaned off the streets yet, and he has a lot of anguish and mourning to shoulder. Though his reign begins in tragedy, Zahir has declared at a speech ghostwritten by Hashim that the following years will see Afghanistan heal from her scars and enter an era of unbeholden unity in the face of those who wish to tear it down."
 afghanistan_events.400.a: "He has a lot of weight on his shoulders, including the hand of his father's ghost."

 afghanistan_events.401.t: "Where We Left Off"
 afghanistan_events.401.d: "The tragedy of Nadir's untimely demise aside, the ascendance of his son to the throne comes with the imperative that it epitomises a repudiation of the chaotic past and the genesis of a stable and ordered future. As such, the [GetYear] Constitution has been authored primarily by the brothers of Nadir, based primarily on his own ideas and wishes, and has been enshrined effective immediately. A bicameral parliament, with an elected Lower House and an appointed Upper House of \"experienced and far-sighted notables\" has been enstated.\n\nDespite the Lower House consisting of elected officials with 3-year terms, the King may dismiss and re-appoint them should they \"offend the integrity of the Government or besmirch Allah and his commandments\". Though the Houses have the power to vote on and reject Firmans issued by the King, the King has the power to override any rejections anyway \"should it be deemed vital to the security of the nation\". Zahir's uncles and other members of the family additionally dominate virtually all government ministries, resulting in an ironclad oligarchy of the Musahiban family.\n\nDetractors, safely outside the jurisdiction of our government, claim we're barely even pretending to establish a constitutional monarchy. For daring to promote distrust and instability in such trying times, especially as we still grieve the loss of Nadir, any subversive exile we've been able to identify has been rewarded with an arrest warrant that guarantees retribution should they dare to step foot in Afghanistan ever again."
 afghanistan_events.401.a: "We will survive… we will flourish."

 afghanistan_events.402.t: "Despair Searching"
 afghanistan_events.402.d: "With Zahir on the throne and Nadir in the afterlife, the government has mobilised and engaged in a rigorous effort to uncover the identity of the black-hearted criminal(s) responsible for the death of the former King. There are already several suspects in custody, all of which are being subject to fierce interrogations, though many are either presumed to be in hiding within Afghanistan's frontiers or have already fled across the border.\n\nThe most promising lead connects the bombing to Hazara groups living near the capital, notoriously loyal allies of Amanullah. For now, movements in their home regions are being heavily monitored, especially amid rising discontent and complaints of \"unjust persecution\", which in reality appear to be attempts at manufacturing a casus belli for a revolt. In any case, it appears almost certain that the investigation will conclude that they're involved in one way or another."
 afghanistan_events.402.a: "All the while, Zahir quietly mourns from within the palace."

 afghanistan_events.403.t: "The Culprit Uncovered!"
 afghanistan_events.403.d: "After a score of vigorous interrogations, several suspects have named Amin Jan Khan, one of Amanullah's brothers, as the principal organiser of the assassination. In addition, all of his co-conspirators are made up of either Hazaras or radical Amanite Loyalists. Supposedly, the man has gone into hiding in Bamyan, deep within the Hazarajat region in Afghanistan's central highlands, where he is organising an uprising among the Hazara people.\n\nTo halt this crisis before it grows any more severe, Mohammad Gul Khan Momand has led an army into Hazarajat, turning over villages in search of Amin Jan and his thugs. Already tender by our heavy-handed authority over the last few weeks, several local strongmen have banded their forces together to rise up against our forces, though they've been crushed with comparative ease.\n\nDespite the bloodshed, it was discovered that Amin Jan had actually fled across the border into India almost immediately after Nadir's death. Once order had properly been restored and no further signs of rebellious activity persisted, Momand finally withdrew from Hazarajat. Though Nadir's assassin remains at large across the border, all of his co-conspirators have been captured and executed, and the mystery of the bombing is now at least formally solved."
 afghanistan_events.403.a: "But we shall never forget the perfidy of the Hazara."

 afghanistan_events.404.t: "Memoirs of the Civil War"
 afghanistan_events.404.d: "Some two years after the devastating Afghan Civil War comes the first autobiographical account published and sold in various bookstores and libraries. Shah Wali Khan spent much of his free time after his obligations to the government and ministries authoring his personal account of the anti-Amanullah putsch, hoping to provide the outside world with an accurate perspective of the late King Nadir's perspicacious decision-making and the difficult position that the Telai branch of the Barakzai family found themselves in.\n\nMuch of the book is spent hero-worshipping and glorifying Nadir as a martyr who died protecting his nation from Amanullah's borderline syndicalist ambitions, blurring the line between Wali Khan simply holding his brother in high regard or rather using his name as a propaganda tool. Much attention is given to accounts of village-burning and atrocities committed by Amanite forces, and the benevolent (and often self-sacrificial) aid given to peasants and civilians injured by the war by Nadir's troops. During the immediate aftermath of Purdil Khan's rebellion, Wali Khan magnanimously pardons a vagabond for looting what remained of Darulamann's museum moments before he was to be shot on the spot by a platoon of troops. There is very little mention of impropriety on the part of Nadir's forces during the war, and what instances there are subsequently describe a crackdown on such injustice and the swift punishment of those responsible.\n\nThe book ends with Zahir's coronation, somberly mourning what could've been under Nadir but optimistically looking forward to a long reign of healing under Zahir. While these memoirs are unlikely to be read by many outside of Afghanistan's urban centres, it will serve as a defining historical account of one of Afghanistan's most tumultuous periods nonetheless."
 afghanistan_events.404.a: "Wiley Wali Khan is a wizardly wordsmith!"

 afghanistan_events.405.t: "Jahan Khan, The Restored Nawab"
 afghanistan_events.405.d: "Though Pashtunistan remains cautiously cooperative with the new government in [AFG.Capital.GetCapitalVictoryPointName], the region can not be said to be wholly scrupulous toward our government. Amanullah's chief loyalist in the region, Nawab Alamzeb Khan of Dir, has long been anxious of his standing with the new King despite mutual reassurances of peace and respect having already been exchanged. Alamzeb has overseen a major expansion to Dir's security forces, citing increased banditry, but privately fashioning the Princely State into a fortress in the event that we decide to haunt him for his Amanite past.\n\nHis paranoia has become his downfall, however. His recruitment drive inadvertently reaped a trove of fifth-columnists loyal to his brother, the exiled Jahan Khan. In the middle of the night, a 150-strong militia of men stormed Alamzeb's royal residence and forced him to abdicate under threat of death. The next morning, his brother arrived at the palace and was offered back his throne, ending over a decade of Alamzeb's reign over the realm. Not without a heart, Jahan Khan refused to execute his brother and instead banished him into permanent exile.\n\nThis shakeup is entirely in our favour. Jahan Khan has already telegraphed his full loyalty to our government, and mutual plans are being drawn up for investment into Dir's public services. With Alamzeb gone, our biggest uncertainty in Pashtunistan has been completely patched up."
 afghanistan_events.405.a: "It's always nice when a problem fixes itself for us."

 afghanistan_events.406.t: "The Afghan Cultural Exposition"
 afghanistan_events.406.d: "One of Afghanistan's greatest treasures, Pashtun culture is rich, vibrant, artisanal and severely underappreciated on the global stage. As part of our mission to establish Afghanistan as a Pashtun nation, Zahir has sponsored marshal Momand's Pashto Literature Society and provided generous seed capital for a travelling fair, hitherto known as \"The Afghan Cultural Exposition\". Every other year, this fair shall travel to a foreign country, typically European, to showcase Pashtun textiles, cuisine, and traditions.\n\nAttendees will learn firsthand about the code of \"Pashtunwali\", the bedrock of a Pashtun man's hospitality, honour, sense of justice and nobility. Concession stands will offer servings of classic Pashtun foods, usually of lamb, including Kabuli Pulao, Chapli Kebab, Afghan Halva and more. Each day of the festival, running for about a week, will cap off with an Attan dance. All in all, it is believed that this shall promote our culture abroad and manifest as a boon for investment, though some worry that this may attract a level of tourism that will agitate Afghans who are naturally wary of foreigners coming to visit our country."
 afghanistan_events.406.a: "What is important is that the world knows Afghanistan is a Pashtun realm!"

 afghanistan_events.407.t: "Family Knows Best"
 afghanistan_events.407.d: "Before, there was Amanullah, the man behind the chessboard who could control and place his pieces as needed, and nobody could influence his choices without him expressly permitting them to do so. An absolute mastery of control, indeed, is that not how a King should be able to rule?\n\nApparently not, according to the family of Zahir Shah.\n\nHis relatives and uncles have run roughshod across the government, conveniently with the help of Amanullah's autocratic institutions which they have reverse-engineered for their own use. Instead of a King with a vision for his people, there now exists an oligarchy whose vision extends to maintaining the status quo, oppressing minorities, and hardly anything more hopeful. Zahir Shah struggles to bring change without it being watered down to an unrecognisable state, or intervene in matters that the Uncles see fit to handle themselves. All he can do for now is bide his time, be patient, and slowly push the envelope until he is appropriately respected in his own right. Afghanistan, over the last several decades, has been traumatised with hatred, conflict, and destruction; Zahir Shah intends to heal his people, and his intentions will not be quieted for long."
 afghanistan_events.407.a: "One day he'll assert himself, and his uncles will simply have to bow their heads."

 afghanistan_events.450.t: "The Provisional Government"
 afghanistan_events.450.d: "Whether pushed into his actions by those around him, his fears of further chaos erupting over the throne, or perhaps reasons known only by him; Momand has announced the dissolution of the monarchy in favour of a republic. Army troops, led by Azadist officers, have now taken control of most of the nation's major cities on the marshal's orders, officially there on peace keeping operations.\n\nAs part of his proclamation, marshal Momand has announced that he will serve as the nation's provisional president, until a proper constituent assembly can officialise his leadership. His protégé and royal family member Mohammad Daoud Khan has also been announced to serve as interim Prime Minister, tasked personally with preparing the nation for its transition into a republic. Little has been heard from the other Musahiban members however, despite efforts by the now president to reach out to them."
 afghanistan_events.450.a: "Only now can the nation heal."

 afghanistan_events.451.t: "Brotherly Betrayal"
 afghanistan_events.451.d: "It seems the reason for the silence by Zahir and his uncles to Momand's coup has finally been discovered, with it now blatantly obvious that they fled the country upon hearing news of troop gatherings in the capital. Although there is no world where Momand would have allowed harm to come to them, and wished to see them take part in the new republican government alongside him, it seems they lacked faith in their so-called brother to guarantee their safety. Their exact location is currently unknown to the president, and it appears that they hope to keep it that way for as long as they can.\n\nThe news appeared to hit the marshal extremely hard, with him delegating full duties to Daoud for an entire day, not leaving his office in the Arg even for food. Although this morning Momand has finally emerged, and continued to carry out the duties needed of him at this vital time, it appears a great sadness still hangs over him when thinking of his now former family. The little consolation the president has received has come from Daoud and his brother Naim Khan, telling him that their slain uncle Nadir would have appreciated the sacrifices the marshal has had to make for the nation."
 afghanistan_events.451.a: "This will always weigh on Momand's heart."

 afghanistan_events.452.t: "Fate of the Frontier"
 afghanistan_events.452.d.traditionalist: "Despite fears of unrest against the republic's declaration, especially by Amanite loyalists hoping to take advantage of the chaos, the army has not faced any notable resistance in asserting the marshal's will...at least in the heartlands. In the Frontier however, the story is very different, owing to the region still being a hotbed of Amanullah's loyalists.\n\nTribal chiefs, urban leaders, and even the vassal princes have frustrated efforts to assert control over the region, hoping to bring down the republic. With the lack of resistance elsewhere however, we have many men ready to be deployed to Pashtunistan, perfect for punishing their insolence."
 afghanistan_events.452.d.reformist: "One of the greatest holes in our national security manifests itself as the autonomy of Pashtunistan. When tensions bubbled and brought [442.Controller.GetVictoryPointName_12717] to the brink, Amanullah made several concessions and continued to tolerate the existence of their autonomous government. Ghaffar Khan and Khan Sahib are powerful and immensely respected across Pashtunistan, and it is for that reason that they have the potential to take a path of intransigence and pose a destabilising threat to our government.\n\nThough they are reasonable men, and a peaceful accord may be possible with the notoriously pacifistic Ghaffar Khan, who's to say such pacifism is no less than a Machiavellian smokescreen? Pre-emptively sucker-punching them before they can rally against us may be our best bet at minimising the chance of a catastrophic revolt."
 afghanistan_events.452.a: "A show of force should bring them to heel."
 afghanistan_events.452.b: "The Khans are reasonable, let us talk to them."
 afghanistan_events.452.c: "Send in the troops, the Frontier will fold."

 afghanistan_events.453.t: "Pashtunistan Pacified"
 afghanistan_events.453.d: "Our pacification campaign over Pashtunistan has been a rousing success! The presence of our troops has shown the Princely States and other tribal leaders that despite the hectic situation surrounding [AFG.Capital.GetCapitalVictoryPointName] over the past several months, our might is not to be trifled with.\n\nAn agreement has nonetheless been made with the Princes to reassure them of our intention to sustain their realms, as hopefully by looming the shadow of the stick we may still see a future where only the carrot may be needed."
 afghanistan_events.453.a: "The whole nation is now ours to rule."

 afghanistan_events.454.t: "[442.Controller.GetVictoryPointName_12717] Government Agrees to Negotiations"
 afghanistan_events.454.d: "Rather than shedding the blood of our fellow Pashtuns, an invitation was sent to the Frontier's government, inviting representatives to discuss their place in the new republic. Although clearly hesitant to support what they appear to view as an authoritarian regime, those who have arrived in [AFG.Capital.GetCapitalVictoryPointName] have been open enough to working with the Azadist government. Unsurprisingly however, they have not simply accepted the marshal's rule out of the goodness of their hearts, nor simply accepting that the nation will benefit the most if they just fall in line without asking for anything in return.\n\nThey have demanded that the Frontier's full autonomy continues for at least a year, with negotiations then open for its full integration into the republic's administration. They have also taken umbrage at Azadist plans to institute a party state, drawing a line in the sand regarding the continuation of the democratic process in at least the Frontier itself, and a say in government by [442.Controller.GetVictoryPointName_12717]'s representatives. A lofty list of demands to be sure, but perhaps ones worth accepting to at last stabilise the nation."
 afghanistan_events.454.a: "Agree to their terms, we all stand to benefit."
 afghanistan_events.454.b: "We share power with no one, send in the troops!"

 afghanistan_events.455.t: "The Failed Gambit"
 afghanistan_events.455.d: "What was thought as a simple show of force attack into the Frontier to make the Khans fall in line has quickly proved to be the Azadist's undoing. Upon arriving in [442.Controller.GetVictoryPointName_12717] and being given the orders to begin arresting members of the government, and putting them down with force if needed, a mass mutiny began to occur by the lower ranks against their commanders. Demanding that no more Pashtun blood be spilled by their brothers after the violence of the civil war, they threw down their arms and stood with Ghaffar Khan. The few willing to carry out the orders were quickly subdued by the defectors and members of the Frontier Defence Forces.\n\nNews of this mutiny quickly spread to the capital, alongside news that the Frontier Defence Forces had begun a march towards the heartlands to defend the Frontier. Almost all they encountered along the way similarly refused to fight, letting these insurrectionists into [AFG.Capital.GetCapitalVictoryPointName]. A final holdout by Azadist loyalists was the most notable battle, but soon they laid dead, although not alongside their leaders who had already fled into exile. The capital is now in the hands of the FDF, led by Abdur Rahim Popalzai."
 afghanistan_events.455.a: "Even Kerensky's government lasted longer..."

 afghanistan_events.456.t: "Those Left Standing"
 afghanistan_events.456.d: "Leadership of Afghanistan has been nothing short of a game of musical chairs over the last few months. Amanullah, then Nadir, then Momand, and now Popalzai is the man in the high chair tasked with successfully keeping it away from the reactionaries now that men with greater ideals have earned their shot at uplifting the nation. It is very important that we act as fast as we can, for schemers such as the Mojadidi family and the exiled royals eye [AFG.Capital.GetCapitalVictoryPointName] like predators waiting for their prey to fall asleep.\n\nGhaffar Khan and Khan Sahib are the most well known men on our side of the equation, and perhaps the most stabilising choice to form a proper government with. Handing them the reins of power shall still place Afghanistan in the capable leadership of men whose vision of Afghanistan is not entirely alien or far off from Popalzai's own dreams. Alternatively however, if we had a foreign benefactor to support us, perhaps Popalzai could finally see the chance to transform Afghanistan into a socialist republic, loyal to Allah and to the principles of Islam, and untainted and untethered by the crooked whims of reactionary Mullahs."
 afghanistan_events.456.a: "The Khans are the only legitimate power left in Afghanistan."
 afghanistan_events.456.b: "Perhaps [AFG_potential_socialist_overlord.GetNameDef] would help set up a socialist state."

 afghanistan_events.457.t: "An Appeal by Afghan Socialists"
 afghanistan_events.457.d: "An interesting situation previously thought impossible has occurred in Afghanistan. The seemingly never-ending chaos they have been experiencing may perhaps finally be at an end, with socialist militants led by Abdur Rahim Popalzai being the latest force to take control of [AFG.Capital.GetCapitalVictoryPointName]. Although supposedly loyal to the moderate regional government in Afghanistan's Frontier region, Popalzai has reached out to our government rather than handing power over to his allies.\n\nIn his appeal, the man known as the \"Marxist Maulana\" has requested our aid in establishing a socialist government, following his party's brand of Islamic Socialism. In order to undertake such a monumental effort in such a backwards nation, he needs plenty of support, and being acutely aware of this he has approached us with urgent requests for aid and support to sustain and entrench his regime. This is a rather excellent opportunity to extend and deepen our influence in the region, but it is also a question of whether or not Afghanistan may be more practical as a neutral buffer state against the other powers on their border."
 afghanistan_events.457.a: "Send them the support they need."
 afghanistan_events.457.b: "Its not worth the effort, they won't last a week regardless."

 afghanistan_events.458.t: "[FROM.GetNameDefCap] Agrees to Aid Us"
 afghanistan_events.458.d: "As we hoped, [FROM.GetNameDef] has accepted our pleas and is already sending over guarantees, troops, and other forms of support to buffer our government against any challengers to our rule. Though for the time being we will be wholly reliant on them for our survival, under their auspices the reactionary Mojadidis, Ulema, and the rest of the Barakzai family will have an agonising time trying to challenge our authority.\n\nThough it seems that he expected us to offer him leadership of the government, Ghaffar Khan has refrained from challenging this turn of events and has instead tendered us a pledge of support. As reactionaries fume from the shadows, the sun shines brightly upon our path forward!"
 afghanistan_events.458.a: "The Red Tide reaches Afghanistan!"

 afghanistan_events.459.t: "[FROM.GetNameDefCap] Refuses to Aid Us"
 afghanistan_events.459.d: "Tragically, [FROM.GetNameDef] doesn't see the value in helping us set up a socialist government in Afghanistan and seeing to the liberation of Muslim workers and peasants from capitalist tyranny. Alas, without the proper support, there's no chance we'd last longer than the previous rulers to inherit [AFG.Capital.GetCapitalVictoryPointName] after the fall of Amanullah.\n\nBeing as Ghaffar Khan already seems to expect us to hand over the reins of power, and he is certainly a more widely appealing and popular leader than Popalzai is, the Marxist Maulana has begun making preparations for an orderly transfer of power."
 afghanistan_events.459.a: "Let us turn power over to the Khans then."

 afghanistan_events.460.t: "Founding the People's Party"
 afghanistan_events.460.d: "It seems that at last the marshal has enforced his grip over all of Afghanistan, with his PM having worked over the past weeks to lay out the foundations for the new Azadist government.\n\nThe time for rule through military might alone is quickly coming to an end, and as such plans to reform the Azadist powerbase into a more civilian focused political party have been put into place. Rather than simply ruling with the army's iron fist, the nation shall be governed by the People's Party, who shall truly represent the will of every Pashtun, whether at home or languishing under foreign occupation."
 afghanistan_events.460.a: "A proper party for the Pashtun people."

 afghanistan_events.461.t: "The Party for Modern Moderates"
 afghanistan_events.461.d.body: "The establishment of the republic has brought forth the need for political parties to represent the people, and for those who found themselves in agreement with Amanullah's policies but jaded on his excesses, the party established today is likely to be up their alley. Abdul Hadi Dawi, once an ally of Amanullah who found himself sidelined after the latter's deposition, has spent the past month staging a grand return to politics, and at last his plans have finally been announced with him set to lead the Hezb-e Islami Afghanistan, the Islamic Party of Afghanistan.\n\n"
 afghanistan_events.461.d.pashtunistan: "$afghanistan_events.461.d.body$To found this new party, Dawi has reached out to the United Muslims Nationalist Party, who have for years struggled to find a foothold in the frontier but whose policies could easily appeal to voters in the heartlands. As part of an agreement between Dawi and Aurangzeb Khan Gandapur, the UMNP is set to be reformed on the national level into the Islamic Party, while still maintaining the UMNP name for local frontier politics. It is seemingly hoped by the UMNP's leadership that with Dawi as leader the party will finally find a base in the heartlands, and through that the party can finally assert itself on an all-Afghan basis, but only time will tell if this strategy will succeed."
 afghanistan_events.461.d.notpashtunistan: "$afghanistan_events.461.d.body$While still committed to modernising the nation as he was under Amanullah's rule, Dawi has long been critical of some of the most controversial elements of the former King's reforms. Mostly significantly, he was one of the most outspoken voices again the \"excesses\" of Afghanistan's feminist movement over the past decade, with the new party promising to bring Islamic values back to Afghanistan on these kinds of issues, an appealing prospect for many of the capital's intellectuals."
 afghanistan_events.461.a: "Will such a middle ground be palatable to the people?"

 afghanistan_events.462.t: "The Liberal Enlightenment"
 afghanistan_events.462.d: "Although the rule of Nadir may have been short, it left a lasting impact on the nation's liberal movement, with many of its former champions now imprisoned, exiled, or dead in some instances such as with Taj Muhammad Paghmani. The ideas of liberalism seem hard however to quash completely, and it appears a new generation of liberals have begun to emerge to fill the void. A new group, officially acting as a party but being more akin to a loose liberal coalition, has now been founded under the name of the Tehrik-i-Naujawanan Baidar, the Movement of Enlightened Youth.\n\nTracing their origin to the more nationalist-minded tinge of the Young Afghans, the party's membership is comprised of many liberal academics known to focus on Pashtun culture. Its two primary leaders, Abdul Hai Habibi and Abdul Rauf Benawa, both espouse a version of liberalism that is said to be incompatible with the conservative or leftist leanings of other parties, but heavily nationalist in nature. Whether or not they will find any success however will likely come down to how well this message translates outside of academic circles."
 afghanistan_events.462.a: "A party for sensible people, will they actually find any?"

 afghanistan_events.500.t: "Investigating the Regicide"
 afghanistan_events.500.d: "Despite having personally been the one to declare a republic, it would be hard to describe Momand as a die-hard republican, with no one yet to hear him openly condemn the previous monarchy despite many of his underlings willing doing so at every opportunity. The man's loyalty to Nadir, even after his death, is almost certainly the cause for this deference, and the order given by him earlier today has only gone further to confirm this theory. Despite regicide often being praised in a republic, Momand has ordered a full investigation into Nadir's death, wishing to put to death his killer for committing treason against the nation.\n\nEven amongst those who can actually be described as die-hard republicans there seems to be little opposition to this investigation, with few wishing to openly oppose the President on an issue so close to him. One way or another, a killer will be found for Momand, and perhaps if his staffers do a good enough job it might even be the correct one."
 afghanistan_events.500.a: "Momand owes it to Nadir to punish whoever did this."

 afghanistan_events.501.t: "Chasing the Leads"
 afghanistan_events.501.d: "It may be early days with the regicide investigation, but that has not stopped multiple leads already emerging. The most promising lead has unsurprisingly been one tied to Amanite loyalists, with evidence leading to Hazara tribesmen tied to Amanullah's half Hazara brother Amin Jan. Further, less substantiated leads however, have pointed to those closer to home, perhaps too close for comfort.\n\nEven if Amin Jan was behind the assassination, the only realistic way he could have gotten explosives onto the slain king's car would be if he had a man on the inside. This would naturally point to senior officers, many of whom still serve closely with the President, yet not closely enough to be above reproach. Those within the royal guard however would also have such close access, especially those in the personal service of the royals, including the men that once guarded the Prime Minister when he was just a prince.\n\nAlthough it would pay to be diligent and investigate all of these leads, it could easily give rise to factionalism if certain unfortunate things were discovered about party members, and could even lead to such even if they weren't. It may perhaps be easier to simply look into the Amanites, although thoroughness may be needed to finally bring relief to the grieving nation, or at least the grieving President."
 afghanistan_events.501.a: "Follow the lead on the Amanites."
 afghanistan_events.501.b: "Someone in the army must have been involved."
 afghanistan_events.501.c: "No one must be above suspicion, even Daoud."

 afghanistan_events.502.t: "Hazara Tribesmen Implicated in the Plot"
 afghanistan_events.502.d: "With the president authorising investigators to look specifically into Amanite links amongst the Hazara, enough evidence has now been found to finally narrow down the search.\n\nVillagers living just outside Maidan Shar have reported three Hazara men, all in their early 20s, as having frequently met with a man matching Amin Jan's description. The Directorate of Intelligence Records now has the names and addresses of all three men, ready to dispatch soldiers to arrest and question them as soon as the order is given."
 afghanistan_events.502.a: "Bring them in for \"questioning\"."

 afghanistan_events.503.t: "Amanullah's Revenge"
 afghanistan_events.503.d: "Despite the arrest of the tribesmen not going as smoothly as hoped, with one of the men unfortunately killed in the apprehension attempt before he could be questioned, two of them were still brought back to the Arg's prison in enough of a shape to still communicate. A few hours alone with warden Sarajadin Gardizi and his men, experts in extracting a confession from even the most steadfast of men, was all it took for the two to finally crack.\n\nWe now have in writing a confession that Amin Jan was behind the assassination of Nadir, with hopes that his death would be the opportunity needed to restore his brother to the throne. His accomplices, whose execution is scheduled for the morning, were tasked with contacting a relative they had within the Royal Guard, and providing him with a bomb to sneak into the King's car. This man has too been arrested, soon to face a similar fate, and although some may doubt confessions given through torture the president finds little reason to doubt the narrative as presented."
 afghanistan_events.503.a: "A light punishment for their crime."

 afghanistan_events.504.t: "Azadist Officers Implicated"
 afghanistan_events.504.d: "Although still under the belief that the Amanites were likely behind the assassination, the President could not shake the feeling that perhaps they were assisted by someone closer to home. Upon the insistence of the Prime Minister, an investigation of the armed forces has been conducted, primarily focused on those who were operating in the capital on the day of the king's assassination. Little was found at first, before one of Daoud's men stumbled across peculiar irregularities in the records for who was where that day.\n\nAccording to one set of documents, two officers close to the president were supposed to be leading exercises on the eastern edge of the capital, yet other documents appear to confirm their unexpected presence in the royal palace instead. The PM, believing this to be potential proof of a coverup and perhaps a deeper conspiracy, has pushed Momand to authorise their arrest regardless of their position, so that they can at least be questioned at a minimum. Whether such potentially flimsy evidence is worth such drastic action however is what now must be decided."
 afghanistan_events.504.a: "If they are guilty, they must be brought to justice."
 afghanistan_events.504.b: "This evidence is flimsy, look into the Amanite lead."

 afghanistan_events.505.t: "Authorising the Purge"
 afghanistan_events.505.d: "After deep and intensive questioning, the officers brought in have confessed to the existence of a long term republican conspiracy that culminated in Nadir's murder. According to their confessions Azadist officers close to Momand have for years planned to seize power and institute a republic, yet Nadir's takeover complicated matters. Knowing that Momand would never move against Nadir, they orchestrated his assassination, finally bringing about their vision.\n\nWith how deep the rot is, some of these men being the president's closest and oldest allies, the Prime Minister has requested authorisation to conduct a largescale purge of all those implicated in the conspiracy. To replace them, he has given a list of names to be promoted to their positions, coincidentally many of those personally loyal to him. Although Momand is doubtful all these men truly are guilty, he has given Daoud authorisation, hoping that a wide enough net will eliminate all the true perpetrators."
 afghanistan_events.505.a: "Can no one truly be trusted?"

 afghanistan_events.506.t: "Guard Alleges Daoud's Involvement"
 afghanistan_events.506.d: "The idea of a member of the Royal Guard being involved in the late king's killing is one that made sense to many, but there are hundreds of men who were actively operating on that day, with no way to know how to narrow it down. That is however until the name of a particular guardsman was handed to members of the Directorate of Intelligence Records by an army officer who recalls suspicious actions by the man on the day of the regicide.\n\nAfter confirming that the man was indeed present on the day, and that the guardsman would have possibly been in a position to carry out the foul deed, authorisation was given to bring him to the Arg's prison. A few hours alone with warden Sarajadin Gardizi and his men, experts in extracting a confession from even the most steadfast of men, was all it took for the accused to finally crack.\n\nIt has said that the guard has confessed to everything, even a few things that he likely had no way of being involved in, but has more importantly given a written confession that he killed Nadir on Daoud Khan's orders. He claims that Daoud knew he had no way to take power as long as Nadir and Hashim stood in his way, and that by killing Nadir he would create a large enough opening to insert himself in, with Daoud promising the guardsman a major position in return. Although there is little else to back this claim, it is the best evidence we currently have, and perhaps we may need to have a word with the Prime Minister..."
 afghanistan_events.506.a: "He can't have...investigate this now."
 afghanistan_events.506.b: "Torture will make people confess the sky's red, look back into the Amanites."

 afghanistan_events.507.t: "The Case of the Disappearing Prime Minister"
 afghanistan_events.507.d: "There are two places in the universe that as far as humanity knows are completely devoid of life: The first being the heavens above, and the second now apparently being the Prime Minister's residence. Those dispatched to find Daoud, after he failed to respond to the Marshal's summons, have found nothing but the lingering evidence of a quick departure. This clearly happened under the cover of darkness, or the man has somehow acquired the loyalty of everyone in the immediate area, as no one questioned even reported hearing any unusual noises, let alone seeing the Prime Minister flee.\n\nWhatever the case, news of the guardsman's confession must have clearly gotten to Daoud before it got to the president, and he must have elected to flee rather than face any questioning. Whether or not the Prime Minister is truly guilty of the crime he is accused of seems irrelevant at this point, as it is obvious he at least believed that exile would be preferrable to attempting to defend himself."
 afghanistan_events.507.a: "Only a guilty man runs, we'll find him one day."

 afghanistan_events.508.t: "Replacing Daoud"
 afghanistan_events.508.d.pashtunistan: "$afghanistan_events.508.d.notpashtunistan$\n\nA third alternative of course could always be to reach over to the Frontier, and appoint one of the Khan brothers as Prime Minister, as despite their differences with the Azadists they are likely to prove useful in furthering the President's Pashtun focused goals."
 afghanistan_events.508.d.notpashtunistan: "Despite little yet being proven, to all involved the Prime Minister's sudden disappearance amidst the ongoing investigation has left little doubt about his guilt. He has been dismissed from his post in absentia, and a warrant has been issued for his arrest, although it seems likely he is potentially multiple countries away by now. The position of Prime Minister cannot realistically go vacant for long though, and while the hunt for Daoud is still ongoing a replacement will have to be chosen.\n\nChief among the list of names for a new prime minister are bank president Abdul Majid Zabuli, currently part of the People's Party, and Abdul Hadi Dawi, leader of the minor Islamic Party. Zabuli seems the obvious choice to many, as an existing member of the party and one with deep ties and deep pockets, however those are not always positives. Zabuli was part of Daoud's inner circle, and his appointment may simply see us here again soon enough. Dawi on the other hand, as an outsider to the Azadists, is much less likely to have unsavoury factionalist ties, and the man has long proven he can handle important roles."
 afghanistan_events.508.a: "Reach out to the AIA."
 afghanistan_events.508.b: "Dawi would be a competent PM."
 afghanistan_events.508.c: "Zabuli can be trusted with the job."

 afghanistan_events.510.t: "Officialising a New Constitution"
 afghanistan_events.510.d: "With the issue of Nadir's death resolved, and the republic stable enough to not be dislodged by its enemies at a moment's notice, it is at last time to officialise a new constitution. Until now the nation had been operating on a mix of the Amanite constitution and martial law, but there is only so long such a temporary situation can persist.\n\nMembers of the People's Party, alongside non-affiliated figures considered major enough to have a say, are now set to gather in [AFG.Capital.GetCapitalVictoryPointName] to draft up the republic's first constitution, and legitimise Azadist rule."
 afghanistan_events.510.a: "Prepare the Assembly."

 afghanistan_events.511.t: "The Status of Elections"
 afghanistan_events.511.d.start: "Most of the mundane issues in the constitution have been quickly resolved without much dispute, with few having any qualms about matters such as the officialisation of the position of president and prime minister. The first major point of contention has however come about when it comes to the status of elections, and how well the nation should tolerate minor political parties that serve as the token opposition."
 afghanistan_events.511.d.end: "Amongst most of the People's Party, even allowing a powerless position within the legislature is seen as an unneeded concession. They argue that an inch of power is all it will take to corrupt the opposition into attempting to enforce their will on the party and the nation, and they must be curtailed for the country's sake. A smaller but still influential section of the party believe the opposite, countering that by allowing the opposition a token outlet through parliament, they will be too placated to oppose the government in other ways, preemptively preventing organised unrest."
 afghanistan_events.511.d.pashtunistan: "$afghanistan_events.511.d.start$\n\nAs per our agreements with the parties of the Frontier, which there is not enough political will yet to go against, an exception will be constitutionally protected for them to continue handling local elections as they see fit. On a national level however, we must decide whether we will tolerate parties like the Islamic Party and Enlightened Youth actually contesting elections in a token fashion, or if a complete constitutional ban on non-approved candidates will be enacted.\n\n$afghanistan_events.511.d.end$"
 afghanistan_events.511.d.notpashtunistan: "$afghanistan_events.511.d.start$\n\nThrough discussions with the leaders of the smaller parties, the government has been convinced to allow their continued existence on a local government level, although requiring the candidates to officially register as independents on the ballot. On a national level however, we must decide whether we will tolerate parties like the Islamic Party and Enlightened Youth actually contesting elections in a token fashion, or if a complete constitutional ban on non-approved candidates will be enacted.\n\n$afghanistan_events.511.d.end$"
 afghanistan_events.511.a: "Only People's Party candidates may run at a national level."
 afghanistan_events.511.b: "Allow a token opposition, for now..."

 afghanistan_events.512.t: "Governance of the Realm"
 afghanistan_events.512.d.pashtunistan: "$afghanistan_events.512.d.start$\n\nAlthough we have agreed to the Frontier's autonomy already, the idea of a hopefully temporary period of greater provincial autonomy elsewhere is now the question. $afghanistan_events.512.d.end$"
 afghanistan_events.512.d.start: "The greatest weakness of every prior Afghan state has not been their positions on the most disputed issues, like religion against secularism or women's rights; it has been their inability for those with power to enforce their positions onto the rest of the nation. It hardly mattered when King Amanullah decreed that women should lose their veils and men should wear suits, if 20 minutes outside of [AFG.Capital.GetCapitalVictoryPointName] the locals decided that they shouldn't. A strong central government, actually able to institute its authority, is agreed upon by the entire party as a vital thing to bring about."
 afghanistan_events.512.d.end: "Centralisation has never been popular, as the greed of the uncontrolled masses pushes them to empower themselves at the nation's detriment. Through a slower move to a unitary nature we can hopefully get the peasants to surrender their power to us without a fight. There is no guarantee however that this will not just become the new status quo, and it may be worth the risk to move immediately to unitary centralisation, and put down any who resist if needed."
 afghanistan_events.512.d.notpashtunistan: "$afghanistan_events.512.d.start$\n\nWhether we bring this about immediately however, or whether we for now allow a hopefully temporary period of greater provincial autonomy is the question. $afghanistan_events.512.d.end$"
 afghanistan_events.512.a: "Officialise the Frontier's autonomy for now, but centralise the heartlands."
 afghanistan_events.512.b: "The state shall be unitary."
 afghanistan_events.512.c: "Significant provincial autonomy is the best way forward."

 afghanistan_events.513.t: "The Place of Women"
 afghanistan_events.513.d.start: "The issue of women's rights is undoubtedly a controversial one, if the past decade or two of civil unrest and conflict stemming from it did not already make that obvious. Even within the People's Party there are views ranging from seeing women's rights as vital for national liberation, and those who view them as the decadent corruption of western liberalism that seeks to destroy not only Pashtuns but every Islamic influenced people. Even before the constitution's drafting began, the government had to adopt a provisional position on the issue, to which it still sticks now.\n\n"
 afghanistan_events.513.d.rights: "$afghanistan_events.513.d.start$Therefore as per our prior proclamations, the constitution will seek to establish the full equality of women in modern society, continuing on from the Amanite years and bringing us on par with the other great powers of the modern world. This is no doubt going to ruffle a few feathers, yet the President and his party have little to fear from a few angry mullahs, especially old men like the Sher Agha who are already one bad day away from dying of advanced age anyway."
 afghanistan_events.513.d.norights: "$afghanistan_events.513.d.start$Therefore as per our prior proclamations, the constitution will not grant women any further rights than those already given to them, and in a few places limit some of the excesses of the Amanite years. Although there is no plans to constitutionally reinstitute purdah or ikhtilat like the most zealous of mullahs might wish for, and we of course will tolerate the continued role of the women's wing of the People's Party, sacrifices have to be made for stability. Unofficially we will continue to encourage a regression back to the status quo of yesteryear, where women cover themselves in public and primarily seclude themselves in their homes, at least until it is politically opportune to change course."
 afghanistan_events.513.a: "Women shall be given the same rights we give men."
 afghanistan_events.513.b: "Give them some basic rights, but nothing too extreme."

 afghanistan_events.514.t: "The Balance of Power"
 afghanistan_events.514.d: "Since taking control of the nation, factionalism within the People's Party has unfortunately been rife. Those loyal to Momand, those loyal to Daoud, and those who do not define themselves by their loyalty to either have spent much of the early life of the Republic attempting to claw their way to the top of the totem pole.\n\nIt seems however that after enough infighting, the party has settled into a stable enough status quo, with the current balance of power now written into the official powers granted to each of the major offices."
 afghanistan_events.514.a: "The President's shall be the ultimate authority."
 afghanistan_events.514.b: "Officialise the Prime Minister's dominance."
 afghanistan_events.514.c: "Formalise the balance between the PM and President."
 afghanistan_events.514.e: "Allow the Assembly some role in governance."

 afghanistan_events.515.t: "The National Language"
 afghanistan_events.515.d: "The [AFG.GetAdjective] nation is home to many languages, with Turkic languages spoking in much of the north, Hindustani dialects spoken in the east, and even some minor Nuristani tongues. The true Afghans however have always spoken one of two languages, Persian and Pashto, with the former being the lingua franca and popular amongst the elites, but Pashto being the native tongue of its peoples.\n\nThe President himself, despite being raised as a Persian speaker, has long pushed for its complete replacement with Pashto, singlehandedly spearheading a national revival for it. Alongside his Pashto Literature Society he has spent almost a decade attempting to reeducate the nation's elites into speaking Pashto instead of Persian, having personally taught large chunks of the language to the former Crown Prince Zahir. If it was up solely to him, there would be only one choice on the national language, however he is not immune to influence by other party members.\n\nAlthough few would openly admit it to his face, Momand's \"revived\" version of Pashto is quite at odds with what the common people actually recognise, and will likely instil great confusion if used as the sole national language. Even those in agreement on the institution of Pashto have pushed the Marshal to consider at least also recognising and using Persian as a second official language, until the people have time to get used to modern Pashto."
 afghanistan_events.515.a: "Recognise both Pashto and Persian."
 afghanistan_events.515.b: "Solely recognise Pashto."

 afghanistan_events.516.t: "Signing of the Constitution"
 afghanistan_events.516.d: "The arduous process of drafting the new constitution is finally at an end, with the remaining mundane issues hashed out without requiring much input from the President or Prime Minister. A finished document has been presented to the President to officially institute as the law of the land, and as per the constitution elections are now scheduled to be held in six weeks time, giving the People's Party a more legitimate mandate to rule from.\n\nCelebrations have begun throughout the nation's urban centres, led by party officials, praising the rebirth of the [ROOT.GetAdjective] nation!"
 afghanistan_events.516.a: "The Republican State shall last a thousand years!"

 afghanistan_events.517.t: "The First National Elections"
 afghanistan_events.517.d: "Six weeks have passed since the announcement of elections, and at last the [ROOT.GetAdjective] people can finally decide for themselves which of the chosen candidates shall carry out their will.\n\nThe Marshal and his Prime Minister wait in anticipation to see exactly how the legislature under them will be filled out, and what the Party may have to adjust for it in future."
 afghanistan_events.517.a: "The people have chosen their candidates."
 afghanistan_events.517.b: "Allow the opposition a few seats."

 afghanistan_events.518.t: "Afghanistan Goes to the Polls"
 afghanistan_events.518.d: "Four years have passed since the last elections reaffirmed the Marshal as the man most capable of seeing to the future of [ROOT.GetNameDef].\n\nAs election season enters its twilight and voters prepare to undertake their civic duty, the People's Party have taken it upon themselves to oversee the elections so that we may guarantee the smooth execution of democracy furthermore. While undoubtedly the President, and Prime Minister [AFG.GetSecondInCommand], will be respectively re-elected in a landslide, the exact composition of the new legislature is still somewhat in the air."
 afghanistan_events.518.a: "The people have chosen their candidates."
 afghanistan_events.518.b: "Allow the opposition a few seats."

 afghanistan_events.519.t: "When We Forgot Zion"
 afghanistan_events.519.d: "All peoples have their origin story, from fantastical tales of mythical kings to more grounded stories of foreign migrations, and surprisingly some of them actually end up being true. For centuries the Pashtun people have been led to believe origin myths involving both of these types of tales. The child of Israel known as Afghan, son of the prophet Irmiya, and descendant of the king Talut, has always been seen as our own mythical founding king. Amongst the tribes of the Frontier especially the second type of myth can be found, where it is said that Afghan was joined by the Tribe of Joseph, to whom the Yusufzai claim to be the continuation of.\n\nFor the past few decades however, this myth has finally begun to collapse, a change the Azadists are proud to have played a part in. Owing to the groundbreaking works of European philologists like Max Müller and Gustaf Kossinn, who inspired the late great Mahmud Tarzi, the Pashtun people finally became aware of the Aryan race and their place within it. Rather than being scions of a foreign land, we at last discovered that the Pashtuns were fathers of the Aryan race, a race proud to have spawned great empires and cultures.\n\nThe idea of ensuring that the nation's peoples finally know this new truth behind their ancestors has been a priority of the most ardent Azadists ever since taking power. With the Marshal's direct approval, it has become official state doctrine, even taught as national history to children of all ages. At the university level new courses studying the great Aryan texts of the Avesta and the Veda through a Pashto lens have similarly been introduced. Some may attempt to falsely dispute the truth of our origins, but the Pashtuns can at last be confident that they are one of the few who truly know where they came from."
 afghanistan_events.519.a: "Pashtuns have never been anything but Aryan."

 afghanistan_events.520.t: "The Future of Agriculture"
 afghanistan_events.520.d: "No matter how rich and powerful a nation gets, ensuring that its people remain fed has to always be the highest of priorities. Although there is little fear of famine in the immediate future, the death and destruction we are beginning to see across the globe has left many concerned that perhaps it would be best if Afghanistan can feed itself fully without having to rely on any imports.\n\nA team directed by the Prime Minister to look into how we can improve the nation's agriculture has identified the valleys around the Helmand and Arghandab rivers as a perfect location for a mass expansion of grain production. Compared to the rest of the nation, this area is much more fertile and workable terrain wise for largescale farms, with the rivers being perfect for use in irrigation. Plans from the Amanullah years drafted by Japanese specialist Mitsuo Ozaki also reached a strikingly similar conclusion, giving the team further confidence in the plan.\n\nIn order to carry out these plans however, significant resources will need to be dedicated to the project. Workers will have to come from somewhere, with local ones almost certainly the cheaper option, but limiting the amount of men we can devote to other industrial projects. Hiring them from abroad is certainly possible, although it will put a notable dent in the funding for other projects. It may simply be worth scrapping the idea like Amanullah did rather than eat this cost, but we may come to regret not investing in the future if we do."
 afghanistan_events.520.a: "Approve work in the region."
 afghanistan_events.520.b: "This plan must be the government's priority."
 afghanistan_events.520.c: "It is a total waste of resources, shut it down."

 afghanistan_events.521.t: "Aftermath of the National Agriculture Plan"
 afghanistan_events.521.d: "Three years after they were first put to the task, the Helmand Valley Agricultural Department has finally begun to have something to show for their efforts. According to the official report put onto the President's desk, grain production in the region is up 139% already, with cotton up another 77%. Almost all the projects are said to be ahead of schedule in the report, except for the one Momand had already discovered had begun to fall behind. All in all, the report presents a fantastic picture for [AFG.GetAdjective] agriculture and national food security.\n\nTo no one's surprise, the actual results are much more modest in nature, although still decent progress. Men sent by the President to actually present a less official but true report give numbers around a quarter of what the Department claims, and that multiple major projects are still well behind schedule, with some not having even been started. Still, progress is progress, and there is little reason to not celebrate that fact, even if the numbers have been slightly doctored."
 afghanistan_events.521.a: "A vital step for the nation's growth."

 afghanistan_events.522.t: "A Nation of Literature"
 afghanistan_events.522.d: "In addition to being head of the nation's armed forces, President of the Republic, and a family man, Momand has found plenty of time for cultural pursuits. Alongside other major Pashto literaturists like Abdul Rauf Benawa and Sadiqullah Rikhtin he has dedicated much of his time to the Pashto Literature Society, serving for many years as its president and other years as its de facto leader.\n\nFinally having ran out of time to dedicate to everything, Momand has decided to at last step down from all direct positions within the society. Not wishing to fully abandon a role in it however, he has moved to see the society moved officially under government control, acting as a cultural arm of the republic. What this means in practice is the continued control of Momand over the highest levels of the society, but less day to day involvement. The membership will be happy however to note a significant increase in funding, now supported directly by the government rather than generous patrons. Perhaps this spells a bright future for Pashtun culture."
 afghanistan_events.522.a: "No culture is superior to that of the Pashtuns."

 afghanistan_events.523.t: "Settler Scuffle in Puli Khumri"
 afghanistan_events.523.d: "Since the days of Rahman Khan, colonisation of the northernmost regions of Afghanistan has been a major priority, finally allowing the Pashtun people control over this untamed wilderness, and defend the northern border from any Russian aggression. Despite great pushback by the local Turkic people, including by Kalakani and his Saqqawists, efforts have significantly continued to the present day. President Momand, a diehard believer in the colonial cause, has recently been personally involved in the foundation of multiple new Pashtun towns around the settlement of Puli Khumri.\n\nUnfortunately, even with the complete destruction of the Saqqawists and many of their followers, it seems that there is simply a new generation of Tajiks in the region ready to stop our projects. The local population still believes that the land belongs to them, and are willing to fight to take it back from the settlers. No one has yet been killed, but angry mobs of Tajik locals have physically attacked settlers over the past few days, and vandalised recently put up buildings. If this project is to continue, we may need to consider sending in the army to protect our settlers from these attacks."
 afghanistan_events.523.a: "Their land is rightfully Pashtun, back the settlers."
 afghanistan_events.523.b: "Leave them alone, do we really need another Tajik revolt?"

 afghanistan_events.524.t: "Unrest Escalates in Turkestan"
 afghanistan_events.524.d: "Despite the deployment of a small number of troops to Turkestan, it seems that the locals have not faltered in their boldness. While troops were patrolling elsewhere, Tajik raiders attacked one of the settlements to the east of Puli Khumri, torching multiple buildings and kidnapping two young Pashtun women. Demands conveyed to the nearby garrison after the raid have at least confirmed that they have not harmed the women, but threatened that they will not be returned unless all Pashtun settlement in the immediate area comes to an end.\n\nAs unfortunate as the news is, this is far from the first time we have heard such a story arise from settlement attempts in Turkestan, and it will certainly not be the last. Historically, the response to such demands has almost always been the same, send in the army to put down these rebels and attempt to bring back who we can. After years of violence however, and the legacy of the Saqqawist uprising still hanging over us, perhaps for once it may be worth standing down."
 afghanistan_events.524.a: "Ousting foreign occupiers is what the army is for."
 afghanistan_events.524.b: "Tolerate their demands and withdraw."

 afghanistan_events.525.t: "The Battle of Puli Khumri"
 afghanistan_events.525.d: "As was the expectation ever since we sent the army north, violence has broken out in Puli Khumri. For the past few weeks the much larger garrison has been patrolling every Pashtun settlement in the region, waiting for the opportunity to strike back against the locals.\n\nAn attempted raid by tribesmen, who incorrectly believed one of the settlements to be undefended, left dozens dead, with most of those falling on the Tajik side. Punitive expeditions were then launched against the local villages these men came from, with their defenders now laying in the dirt.\n\nNo sign of any of the captives was found, but it is hard to say if local troops were even looking. Unrest however now swelters through the rest of Turkestan, with the fear we hoped to strike into the local peoples turning instead to anger against the Republican State."
 afghanistan_events.525.a: "At least their land is now vacant for the taking..."

 afghanistan_events.526.t: "The Girls of [267.Controller.GetVictoryPointName_10737]"
 afghanistan_events.526.d: "Rather than simply issue empty proclamations it expects others to follow, the Republican State has made sure its officers and party members lead by example, and nowhere is this more true than that of women's rights. For the past few months an official decree has been issued from the president, informing officers that their wives must be present alongside them at national celebrations, such as those for independence day. So far this appears to have been stuck to, with no real opposition, but the realisation that many of our officers seem to have suddenly married beautiful young Kabuli women has raised a few eyebrows.\n\nAn investigation into this matter has rather shockingly concluded that these women are not actually married to these officers, barring one or two exceptions, but instead they have simply paid girls from [267.Controller.GetVictoryPointName_10737] to appear alongside them in public. One officer who was coaxed into confessing admitted he did so due to not wishing to subject his wife to what he views as un-Islamic practices, and that it was better to hire one of the \"already sinful\" women of [267.Controller.GetVictoryPointName_10737] rather than defy the president.\n\nThese allegations of insubordination have sent shockwaves through high command, who have been outraged over the lengths the men will go to avoid stepping into the 20th century. It has been suggested that those who can be reliably proven to be defying the order be made an example of, with hopes that the rest fall in line and bring their actual wives the next time there is a celebration. On the other hand, some staffers have said that the lack of defiance by the officers is a good thing, and that we should just look the other way rather than risk them actually beginning to defy us. After all, as far as the public is concerned, they are seeing high ranking men standing side by side with women in public, the goal we hoped to achieve."
 afghanistan_events.526.a: "As long as they look like they're complying, they're complying."
 afghanistan_events.526.b: "Discipline any officer found to have hired these women."

 afghanistan_events.527.t: "An Unlikely Endorsement"
 afghanistan_events.527.d: "The Azadists may be many things, but never have they been described as friends of the Islamic establishment...until today. Despite Fazl Omar Mojadidi losing the government position he was promised under Nadir after the Republic's declaration, and initially decrying the Azadists as crypto syndicalists in response, he has begun to change his tune. In fact the man has actually gone so far as to backtrack on his previous statements, and has praised the recent move to roll back the Amanite era stances on women's rights.\n\nBehind the scenes however, this endorsement has not exactly been too unexpected, and a more straightforward reason may actually be behind it happening. To further ensure the ulema's loyalty, it is expected that over the next few months a tidy sum will slowly be distributed to major mosques and religious institutions throughout the nation. Mojadidi's headquarters in Shor Bazaar has already received a significant \"donation\", with promises of more over time. As far as the public is concerned though, the President is simply the defender of Islamic values that Mojadidi paints him as, and that is why all Muslims should support the republic."
 afghanistan_events.527.a: "It really is fantastic what money can achieve."

 afghanistan_events.528.t: "The National Club"
 afghanistan_events.528.d: "Daoud's loyalists may now dominate the government, but not every one of his allies is made equal. Within his inner circle, known by some as the National Club, there are two men alongside Daoud at the top of the ladder; those being Foreign Minister Faiz Mohammad Khan Zikeria and Finance Minister Abdul Majid Zabuli. Now that Daoud himself has for all intents and purposes moved himself up another rung alongside the President, he will almost certainly need one of these two men to begin filling in many of his old duties instead.\n\nThe first choice, Zikeria, is one of the many continuity candidates who no matter the government seems to just worm his way into office. He first served as an envoy under Amanullah to the at the time recently restored White government in Russia, slowly being promoted through the Foreign Office until eventually getting a cabinet position as Education Minister. The final years of Amanullah's reign saw him however shuffled back to foreign affairs, meeting frequently with both Russian and German leadership. Even now he serves as the Republican State's Foreign Minister, and is perhaps one of the most capable negotiators in the republic.\n\nZabuli on the other hand almost needs no introduction at this point, being perhaps the single individual most vital to the Afghan economy. His banks and his capital have been vital to the running of the Afghan state for over a decade, yet he has been an important ally for many of those years for both Daoud and the Azadists as a whole. If there is something that can not be accomplished by Zabuli's money or connections, it isn't worth accomplishing, making him perhaps the perfect choice instead for the role."
 afghanistan_events.528.a: "Any man who could negotiate with Savinkov and Schleicher has proven himself."
 afghanistan_events.528.b: "Zabuli's business connections make him indispensable."

 afghanistan_events.529.t: "Rethinking Azadism"
 afghanistan_events.529.d: "When one finds a revolutionary movement, one also finds a large number of its adherents who spend more time focused on irrelevant theories and minor issues than practical matters, often times encouraged into further delusion by those around them. Many of the President's now purged allies could be classified as such men, with many spending much of their time bandying about crackpot ideas of how Afghanistan is the homeland of the Aryan race and how that means the Pashtuns are the progenitors of all nearby culture.\n\nFor years the delusions of these men were not only entertained, but even promoted by those who now make up the People's Party, believing somehow that these theories were vital to the Azadist movement. Under the Prime Minister's reign these theories are now rejected, not needing some lofty claims of grand ancestry to justify themselves. The Pashtun people are superior because of who they are, not because of who their forefathers are, and time must be spent ensuring that continues to be the case, not theorising about the past to claim it with words."
 afghanistan_events.529.a: "Pashtuns have never been anything but Pashtun."

 afghanistan_events.530.t: "Two Sides of the Same Coin"
 afghanistan_events.530.d: "Despite many regarding the agreement reached with the AIA as necessary for finally bringing order back to the nation, it has not exactly been popular on either side of the aisle. On the AIA's side there has been much chagrin over alleged \"authoritarianism\" exhibited by the Azadists, with AIA members believing they have no real interest in advancing the cause of the nation, and are instead solely interested in their own advancement. On the government's side, those close to Daoud Khan especially have pushed back against the AIA in private meetings, believing that they are just dead weight, and that continued cooperation will hold back the Azadist cause.\n\nTo the president however, Ghaffar Khan and his men represent a genuine, if flawed, approach to building the Pashtun nation. In order to maintain fair relations, Momand arrived in [442.Controller.GetVictoryPointName_12717] yesterday morning, aiming to meet personally with the great Bacha Khan. Although few know what has been said behind the closed doors, reporting from both sides has painted the interaction as very positive. Rumours are abound of greater AIA involvement in ongoing programs to bolster Pashtun identity and culture, and a guarantee of the continuation of prior agreements."
 afghanistan_events.530.a: "We may be at odds on many issues, but the nation comes first."

 afghanistan_events.531.t: "The Daoud-Habibi Pact"
 afghanistan_events.531.d: "Daoud Khan is a man with friends in many places, including many he perhaps shouldn't, but many above the board individuals as well. One of these allies is Abdul Hai Habibi, leader of the minor Movement of Enlightened Youth, of whom has been connected for many years with the Azadists due to his nationalist views. Rather than joining the People's Party, he opted to band together with his fellow liberal academics to form his current party, yet it appears that he may not exactly be happy being outside the ruling zeitgeist.\n\nAfter a collection of meetings with the Prime Minister, both Habibi and the party's other leading figure Abdul Rauf Benawa have agreed to begin the process of merging the Enlightened Youth fully into the People's Party. Seeing little point in continuing as a distinct party, it appears they would rather prefer to exist as an internal grouping within the Party, potentially giving them an entry into government positions they wouldn't have in the opposition.\n\nThere has been some pushback to this proposed merger however, with anti-Daoud Azadists requesting that the President block it going ahead. Although Benawa is friendly with the President, many of these liberals will likely just find themselves falling into Daoud's camp, further strengthening his position. For those who believe the current power balance is vital, allowing the balance to tip like this is expected to only lead to disaster, even if it does boost the party in the short term."
 afghanistan_events.531.a: "Merge them into the People's Party."
 afghanistan_events.531.b: "It'd be unwise to pack the party with Daoud's allies."

 afghanistan_events.532.t: "The Other Prince"
 afghanistan_events.532.d: "With Zahir and his uncles gone, and Daoud Khan's profile so overpowering, one might forget that he is not the only royal still in the country, let alone the government. Mohammad Naim Khan, Daoud's brother, is the only other member of the former dynasty who remained in Afghanistan when the republic was declared. Rather than flee with his father Aziz, he chose to stay alongside Daoud, and was rewarded handsomely through being made Minister of Commerce under Zabuli's Finance department.\n\nUnlike his brother who went into a military role, Naim was educated by his father in the realm of foreign politics, alongside receiving significant tutelage by his uncle Hashim. During the civil war he served Marshal Momand by handling many logistical matters for him, earning the future President's favour. This focus on logistics made him a fitting candidate for Minister of Commerce, with both roles having rather similar skillsets in the grand scheme of things.\n\nEven overshadowed by his brother, the Prince has actually begun to gain a name for himself over recent months, with people finally beginning to wonder if they should have been paying attention to him earlier. Putting the skills from his father to use, Naim's department has recently overseen a deal reached for multiple foreign-owned factories to be established in [AFG.Capital.GetCapitalVictoryPointName], locally producing major pieces of industrial equipment we will need for continued economic growth. Although still early days in a land where one moment could see the downfall of anyone, perhaps it is worth paying attention to Naim, especially if the Prime Minister's star finally one day fades out."
 afghanistan_events.532.a: "A protégé of Momand, Zabuli, and Hashim is a powerful combination."

 afghanistan_events.533.t: "The Buzz About Buzkashi"
 afghanistan_events.533.d: "Buzkashi is a rough and unregulated sport practiced mainly by Uzbek and Tajik communities in northern Afghanistan. With its roots firmly in a long lineage of Central Asian horseback carcass games, Buzkashi events see hundreds of riders compete against one another to determine which man can secure a prepared goat or calf carcass in a massive scrum of horsemen, and then break free of his pursuers. These events were opportunities for local khans and notables to flaunt their wealth, gathering gifts for victors and displaying the quality of their finest horses. Additionally, it was an opportunity for talented riders to show their prowess, and many a fine competitor has made a name for themselves as a minor celebrity on the back of particularly daring feats.\n\nMohammed Daoud Khan has taken a personal interest in these spectacles, and has endeavored to bring this odd northern institution to [267.controller.GetVictoryPointName_10737]. He claims that such a unique, martial, and visually impressive tradition would serve as the perfect foundation for a sport which is solely and uniquely Afghan. Having collected some of the leading riders of the north in [267.controller.GetVictoryPointName_10737], he has devised new rules to transform this festival / mock battle into a proper athletic event, adding such concepts as a bounded arena, teams, a scoring area, a fixed number of competitors, and a referee.\n\nTime will only tell if this new experiment will bear fruit, but regardless one must marvel at the audacity of his attempts. Once a sport designed specifically to display the power of local warlords, Daoud hopes to turn Buzkashi into the first “national” sport of the republic."
 afghanistan_events.533.a: "Play...erm...ball?"

 afghanistan_events.550.t: "The First National Elections"
 afghanistan_events.550.d: "With the government satisfied that Afghanistan is finally ready at a national level to embrace democracy, the nation's first real national elections have at last been held over the past few days.\n\nThe AIA are unsurprisingly the favourite to win, having spearheaded the whole process, yet one cannot rule out a potential unexpected rural turnout giving the Islamic Party the edge they need to win, or even urbanites opposed to certain AIA policies allowing the Enlightened Youth a path to victory."
 afghanistan_events.550.a: "The AIA have won over the people."
 afghanistan_events.550.b: "The Islamic Party wins the vote."
 afghanistan_events.550.c: "The Enlightened Youth secure victory."

 afghanistan_events.551.t: "Afghanistan Goes to the Polls"
 afghanistan_events.551.d: "Three years have passed, and [AFG.GetLeader]'s current term is coming to an end. Afghanistan must once again go to the polls, a message urged by all three major parties in Afghanistan's political landscape.\n\nWhile the AIA still enjoy broad popularity, the Islamic Party actively cultivate rural voter participation, and the Enlightened Youth grow ever more influential the more Afghanistan's urban centres expand. As the ballots count, many eagerly await to see what the results hold for Afghanistan's future."
 afghanistan_events.551.a: "The AIA have won over the people."
 afghanistan_events.551.b: "The Islamic Party wins the vote."
 afghanistan_events.551.c: "The Enlightened Youth secure victory."

 afghanistan_events.552.t: "The Amanite Restoration?"
 afghanistan_events.552.d: "Afghanistan may now be a republic, but it is a status forced upon the country by men now halfway across the world. Many within both the opposition and the government iself find themselves tepid on republicanism, seeing it as just a vestige of the Azadist coup. Yet despite there being a nostalgia for a return to the days of the kingdom, they do not desire a return to the days of Nadir or his siblings, but the ousted Amanullah Khan.\n\nFor months now there has been an active debate in government over whether or not attempts should be made to at least contact Amanullah to discuss a constitutional restoration. Those in favour wish for a return to the golden decade, seeing the former King as a vital figurehead for national stability. Those opposed believe that there is no world in which Amanullah does not attempt to bend the nation back into his vision, and will never accept a role with powers no greater than a rubber stamp. To the latter group's dismay however, it appears that the pro-Amanullah side has at last won out, with emissaries sent to discuss the matter with the former King\n\nRather than being a simple return to a rosier age, it appears that perhaps the naysayers were right. Discussions with Amanullah have gone nowhere, as he is steadfast in refusing to accept any offer that does not see a full return of power to him. Even those who attempted to reach out to Amanullah's more constitutionally minded brother have found no success, with Inayatullah refusing to take the throne, and there being little support for any king but Amanullah. With neither side willing to budge, it seems any restoration is dead in the water for now. "
 afghanistan_events.552.a: "He is obsessed with modernity yet unfortunately stuck in the past."

 afghanistan_events.553.t: "Reorganisation of the Defence Forces"
 afghanistan_events.553.d: "Our defence forces are in serious disarray from top to bottom. The aftermath of our race to the capital and the establishment of a republic threw the traditionally oligarchic and nepotistic army into tribalistic fragmentations. Though not all of the old military brass has forsaken us, are we wise to trust them still? These men may still be hung up on the days of the Padishahs and Emirs, who may see our idealistic and pacifist government not as providential, but as potential prey. One of the most pre-eminent military leaders of Pashtunistan, Abdur Rahim Popalzai who almost took up arms during the crisis with Amanullah's government over a year ago, has emerged as a top candidate to oversee a vast reorganisation of the army.\n\nPromoting him to Field Marshal will ensure we have a loyal man commanding our armed forces, one who is very unlikely to engage in underhanded scheming against our government so long as we are faithful to Allah and benevolent to the people. Despite his capability, he is not a formal military leader and has little to no formal training in martial leadership. For this reason, we may still consider retaining the leadership of professional, career-minded army men."
 afghanistan_events.553.a: "Popalzai has proved himself capable and loyal, promote him."
 afghanistan_events.553.b: "It would be better to defer to the professionals."

 afghanistan_events.554.t: "The Khan of the Sikhs"
 afghanistan_events.554.d: "When looked at as a whole, many would regard Afghanistan as simply a Muslim nation, with the overwhelming majority of the population being adherents to Sunni doctrine, and Shiites being the next largest group after that. This rather reductionist view eliminates the hundreds of thousands living amongst us, primarily the Ahl al-Kitāb and followers of Dharmic faiths, tracing their ancestry in many cases back thousands of years.\n\nFor quite a large amount of our people however, the idea of Afghanistan being a nation of just Muslims is not an oversimplification, it is an ambition. Men like the Prime Minister Khan Sahib, who has strived all his life for interfaith tolerance, are seen by such people as traitors rather than inspirations. As leader of the Frontier, local Muslims decried him as having betrayed the faith for overseeing legal decisions considered too pro-Sikh, and for allowing his daughter to marry a Sikh man.\n\nWhat was once limited to the Frontier however has begun to spread to the heartlands, amplified significantly by a certain Mullah from Shor Bazaar. With Mojadidi's funding, anti-AIA propaganda has begun to refer to the PM as \"Abdul Kafir\", meaning \"slave of the unbelievers\", as a vicious parody of his name.  Although we know the man cannot be reasoned with, those around Jabbar Khan have encouraged him to perhaps take a step back from interfaith issues, hoping to avoid this idea of him being too pro-Sikh catching on further. They argue that it would be better to have a stronger public image now, and quietly aid other faith adherents, than risk painting the entire government as anti-Islamic in nature."
 afghanistan_events.554.a: "Sectarianism is a plague we must cure."
 afghanistan_events.554.b: "We can't afford the perception of favouritism."

 afghanistan_events.555.t: "The All-Afghan Poetry Summit"
 afghanistan_events.555.d: "The goal of the reformation of Afghan society does not simply limit itself to uncorrupting the states politics or combating poor cultural practices, it also necessitates treating its culture as something to be proud of and promote. For years the AIA have spearheaded the promotion of traditional Pashtun culture, elevating it from shared traditions in villages to the grandest of stages in our great cities.\n\nThe latest attempt by the government to promote national culture has come in the form of a grand poetry summit in [AFG.Capital.GetCapitalVictoryPointName], inviting Pashto artists from across the entire nation to show the best the country has to offer, especially to the many foreign guests the government has brought in for it. A wide array of poetry recitals, grand musical numbers, and fantastic plays have truly amazed those lucky enough to visit. The highlight to many has been a rendition of Akbar Khan Akbar's great play \"The Three Orphans\", reimagined away from its Frontier setting to highlight those left behind by the recent civil war. The grand success has already led to plans being created to continue this festival annually, with even some Uzbek and Hindko speakers hoping to host smaller ones of their own in future."
 afghanistan_events.555.a: "The joys of Pashtun culture."

 afghanistan_events.556.t: "The War of Ghalla Dher"
 afghanistan_events.556.d: "To the ears of a suffering person, the only statement worse than \"help will never come\" is perhaps \"help will gradually come\", as at least the first assures them that they are on their own. The government's recent announcement of a slow legal reduction in the powers and excesses of feudal lords has therefore not exactly been received as well by the peasants as many initially hoped. Those who have long suffered under local tyrants have struggled to see future liberation as liberation at all, and have simply been incentivised to take matters into their own hands, and rapidly accelerate the death of feudalism.\n\nIn the town of Ghalla Dher, where the Nawab and his family have long ruled in cruel excess, the peasants have at last had enough. Led by socialist dissidents who remain at odds with the AIA's reformism, these peasants marched upon the Nawab's estate, hoping to inflict harm upon him and his family. Two of the lord's guards were brutally beaten, and the estate torched to the ground, although the man and his family were able to escape unharmed.\n\nViolence like this has long been the anthesis of the AIA's movement, and vigilante violence of any kind is unsuitable for a civilised society. News of what is quickly becoming known as the \"War of Ghalla Dher\" has led to worried calls to crack down on these angry mobs before it further escalates, coming especially from other landlords who fear they are next. Those who sympathise with the plight of the peasants however recommend we simply allow local authorities to handle it, and simply refuse to give any statements on the issue so we do not alienate either side."
 afghanistan_events.556.a: "We won't endorse it, but we won't condemn it."
 afghanistan_events.556.b: "Violence solves nothing, arrest these vigilantes."

 afghanistan_events.557.t: "The Uplifting of the Labourer"
 afghanistan_events.557.d: "\"Out of my way, you son of an ass\" is by all accounts a more commonly heard phrase by the poorest of [AFG.Capital.GetCapitalVictoryPointName] than \"Thank you\". Rather than seeing the lowest of us as simply doing what they can to get by, men and women no different than themselves, people regard the lowest workers as parasites who wouldn't be poor if they didn't deserve to be. Street sweepers, water carriers, and weavers especially play a vital role in Pashtun society, yet are looked down upon as failures who view their jobs as suitable only for women, children, and foreigners.\n\nEven before becoming president, Bacha Khan has fought to break this stigma, and show people that there is no job that is beneath even the most powerful of men. His activism in the Frontier has seen the weaving profession go from one of shame to one of national pride, with the creation and donning of traditional garments being used to celebrate being Pashtun. Even the lowest street sweeper, because of the work of the AIA, no longer fears being physically abused in [442.Controller.GetVictoryPointName_12717] by his supposed betters, with them taught now to respect the vital role he plays.\n\nIn the heartlands however, this cultural revolution has yet to penetrate the hearts of its people, with many still stuck in their old ways. Hoping to change that however, Ghaffar Khan has today hosted an event in the capital, where along with prominent AIA members and streetsweepers he has cleaned [AFG.Capital.GetCapitalVictoryPointName]'s roads. Crowds gathered around, marvelled by the most powerful man in the nation seemingly debasing himself so, yet his conviction and inspirational speeches to them quickly won them over to his ideas. Changing this stigma will not happen overnight, yet the President has now done the hard part of getting the first dominos to begin to fall."
 afghanistan_events.557.a: "No man should look down on another, no matter his profession."

 afghanistan_events.558.t: "Overturning the Fee of Maliks"
 afghanistan_events.558.d: "With the events of Ghalla Dher still fresh in everyone's memories, it is apparent more immediate action against feudal excess is required in the short term. To that end a specific highly unpopular practice has been zeroed in on, that being the Da Malak Toray, or the Fee of the Malik. This practice, primarily found in the Frontier but with variants elsewhere in Afghanistan, involves tribal leaders placing a tax on marriage. In the Frontier specifically, this practice had historically become standardised at a fee of sixty rupees to allow any marriage to go ahead, with them charging the equivalent of even more now in Afghanis.\n\nAs of today however, with the signing of a new law by the President, all monetary restrictions upon marriage by third parties have been completely outlawed throughout the entire nation. The bill, spearheaded by Jamna Das Talwar, with input by Khan Sahib, has already begun to win back the government any good will it may have lost from perceived slowness. Although the feudal lords may grumble, having a little less money to wipe away their tears than before, the common people now rejoice about the ban."
 afghanistan_events.558.a: "Backwards practices like these just hold the Pashtuns back."

 afghanistan_events.559.t: "Heartland Tribes Protest Women's March"
 afghanistan_events.559.d: "Like the ousted king Amanullah before them, women's rights have always been fundamental to the AIA's vision for the Afghan nation. To Ghaffar Khan and his followers, the advancement of women is vital to the advancement of society as a whole. Although having broken down most of the resistance to this in the Frontier, excluding amongst certain UMNP voters, the tribes and establishment of the heartlands still view women's rights as antithetical to Islam and Pashtunwali.\n\nHoping to counter that, the party's women's league, led by Qanita Bibi Ziauddin, has been holding marches throughout the heartlands. They have campaigned in countless villages, hoping to promote women's causes to the locals, especially when it comes to education. Many men have also joined them in their efforts, with Communications Minister Mian Jaffar Shah being the most notable amongst them.\n\nUnfortunately much like Amanullah experienced before them, these marches have been highly controversial. Opponents to women's rights have gone so far as to threaten violence against the men in attendance, with Pashtun taboos of violence against women seemingly stopping these threats escalating into reality. The government's response has however been uniform in condemning these threats and backing the marches, with both the President and Prime Minister offering their full support to Ziauddin and Shah, and encouraging further marches to go ahead."
 afghanistan_events.559.a: "Your children have no rights over you except education, even your daughters."

 afghanistan_events.560.t: "Melmastya Misgivings"
 afghanistan_events.560.d: "Although a fundamental part of Pashtun culture and Pashtunwali, the AIA have spent many years dismantling the code of Melmastya. Like the idea of Xenia in Greece or those upheld by the Kanun in Albania, Pashtuns who adhere to Melmastya must show hospitality to all guests, a code firmly followed across Afghan society. Despite this idea being rather noble in nature, the AIA regard the practice to have become corrupted in modern times, focusing more on lavish displays to show off wealth rather than actually caring for guests. Ghaffar Khan's opposition to this wasteful extravagance has led to his personal refusal to accept gifts offered under Melmastya, and the imposition of a code for other party members to bring their own food while travelling instead of relying on meals from strangers.\n\nUnsurprisingly the government's recent move to crack down upon waste and extravagance in Afghan society has led to a coordinated push to limit the excesses of Melmastya and reframe it back to its humble roots. Also rather unsurprisingly, this push has not been welcomed with open arms by those who quite enjoy pomp and lavishness, and those who view these as fundamental to Pashtun culture. Most notably a dispute has arisen in recent days in Sangin, with the local government refusing to allow a planned feast for the wedding of a tribal leader's son, telling the Malik to give it instead to the needy.\n\nThe groom's family have now escalated the issue all the way to [AFG.Capital.GetCapitalVictoryPointName], hoping that the central government overrules the local \"unjust\" decision. The local administration's action is clearly an unpopular one, and we could easily ingrain ourselves with the tribes of the heartlands by reversing it. Allowing one exception however could easily be a slippery slope leading to tribesmen across the country demanding their own, and the risk of eroding cultural reform that would bring may be more harmful in the long term."
 afghanistan_events.560.a: "A little restraint won't kill you."
 afghanistan_events.560.b: "Perhaps we can overlook a celebration or two..."

 afghanistan_events.561.t: "The Ills of Politics"
 afghanistan_events.561.d: "Ghaffar Khan may now be the face of Afghan politics, yet there are few men who despise what politics truly means more than himself. Rather than selflessly devoting themselves to the betterment of society, many within the AIA would rather bicker amongst themselves about who is superior, or attempt to tear down their compatriots to rise through the ranks.\n\nWhile the President has so far simply been able to ignore and look above this infighting, leaving Khan Sahib to handle the more rank and file parts of politics, it seems that the current growing rift within the AIA may require more direct intervention. Those on the party's left such as Ajmal Khattak have been openly pushing for the AIA to fully adopt an anti-capitalist agenda, believing socialism to be the only path to a brighter future. Many around Jabbar Khan, although not the man himself, have slowly begun to openly adopt anti-socialist rhetoric in response, and going as far as to express fears of syndicalist infiltration of the party.\n\nAlthough the President does sympathise with the party's socialists, having long worked with open syndicalists, it seems that the party as a whole is beginning to move against them. Failure to crack down upon this factionalism now will almost certainly lead to the growth of this anti-socialist rhetoric, and a few words from Bacha Khan would almost certainly get them to stop to focus on more important issues. Wading into factionalism like this is unlikely to end well, and perhaps it may be easiest to just let Jabbar Khan continue to handle matters."
 afghanistan_events.561.a: "Factionalism is for fools, the president is right to stay out of it."
 afghanistan_events.561.b: "Perhaps a few words are needed to keep the party on course."

 afghanistan_events.562.t: "Expansion of the Youth Council"
 afghanistan_events.562.d: "The nation's youth will always be its future, and the Khan brothers make no secret that they aren't getting any younger. The party's Youth Council, the Zalmi Jirga, has been cultivated for years under them in the Frontier, with even their own children being proud members. As the party spread its wings throughout the rest of the heartlands, so too does the Youth Council, however the issue of leadership of the regional branches has quickly become a thorny one.\n\nMian Akbar Shah, as one of the former leaders of the organisation, has naturally been seen as the man to turn to in order to find local leaders. He has presented the Prime Minister with a full list of potential names, almost entirely composed of his close allies. Shah and his friends make no secret of their socialist beliefs, a fact that those on the party's right have become growingly unnerved towards. Fearing the indoctrination of the youth into syndicalist values, party members have pushed for the President's son Abdul Wali Khan and his allies to take over instead, hoping he will be a much more moderate and respected choice."
 afghanistan_events.562.a: "Akbar's men are still the most suited to lead it."
 afghanistan_events.562.b: "It will be a good opportunity for Wali Khan to prove himself."

 afghanistan_events.563.t: "The Shirts of Syndicalism"
 afghanistan_events.563.d: "Although we had hoped that Fazl Omar Mojadidi had ran out of steam after his last stunt, when he attempted to slander the good name of Khan Sahib, the man has more longevity than expected. With sectarianism out of the way, he has naturally moved onto attempting to claim the government is secretly syndicalist in nature, continuing his long running red scare rhetoric he has stuck to for over a decade.\n\nIt has quickly become obvious however that he has simply ran out of ideas, as rather than pointing out the role of prominent socialists like Akbar Shah in the administration, he has instead focused on...our shirts. As has been standard for many years now, our men wear red uniforms, with no deeper meaning other than the colour being good to hide the dirt that builds up from constant field work. To men like Mojadidi, this colour is clear proof of our syndicalist nature, openly mocking the Afghan people right under their noses. Few have taken his claims seriously, however his loyalists have eaten up this absurd claim, ready and willing to hear whatever he invents next."
 afghanistan_events.563.a: "Let the old man yell at the clouds."

 afghanistan_events.600.t: "A Friendly Face"
 afghanistan_events.600.d: "Even with the nation exhausted and battered, the idea of extremist militants from the Frontier seizing control of the capital is unlikely to be palatable to large swathes of the population. An immediate propaganda campaign to legitimise the new government has unsurprisingly been made the top priority, and over the past week quite a few efforts have already been made on that front. The biggest has been meetings with the Kabuli intellectual class, hoping to lean on their more milquetoast image and heartlands origin to frame the government as simply an evolution of the reformism of yesteryear.\n\nGhulam Mohammad Ghobar, a leftist moderate from the capital, has especially been a target of negotiations, with many within the Frontier Socialist Party seeing him as the perfect moderate face for the government to utilise. Following meetings with Popalzai, Ghobar has actually agreed to take the position as the Republic's ceremonial president, believing that he must do his duty to bring stability back to the nation.\n\nThese meetings have also led to an agreement to reorganise the Frontier Socialist Party into a new nation wide organisation, using a more patriotic name suggested by Ghobar of the Fatherland Party. Popalzai will unsurprisingly serve as the party's chairman, running the nation from a less public facing position, hopefully creating a much more acceptable image to the masses of the heartlands."
 afghanistan_events.600.a: "A good public image is always vital."

 afghanistan_events.601.t: "The Son of Swabi"
 afghanistan_events.601.d: "For decades the Frontier has given rise to Afghan socialists; Chairman Popalzai is hardly the first, although perhaps there is one man that title can actually be bestowed upon. The failure to secure the Frontier for Afghanistan in 1919 saw a young Pashtun fighter flee his home of Swabi, ending up in the tumultuous quagmire of Central Asia. It was here he found himself drawn to the Bolsheviks, fighting once again for a doomed cause, yet this time he refused to be driven out.\n\nFor more than a decade this man, Nisar Muhammad Yousafzai, has continued the good fight in Central Asia, fighting for both socialism and for the cause of the Tajiks, setting aside any notion of Pashtuns simply being their enemy instead of their brothers. Now however with the birth of a socialist Afghanistan, Yousafzai is at last able to return home. After meeting with the Chairman he has offered his continued military service to the new government, wishing to help ensure that the flame of socialism continues to burn bright from the heartlands to the Frontier."
 afghanistan_events.601.a: "Welcome home brother."

 afghanistan_events.602.t: "Ghaffar Khan's Resignation"
 afghanistan_events.602.d: "The government's hardline stance on ideological purity has sent shockwaves through the AIA, who have now been locked out of government, with the party's leadership being reformist rather than revolutionary. After days of heated debate within the AIA however, combined with mounting internal unrest by the party's socialists, it seems a breaking point has been reached. Both Ghaffar Khan and Jabbar Khan have tendered their resignations, with high ranking party member and committed socialist Mian Akbar Shah selected as the party's new sole leader.\n\nIn contrast to Ghaffar Khan's pacifism, Shah has long refused to turn the other cheek, and has been frequently involved in revolutionary activity as a member of the AIA. With him now as leader the AIA is expected to take a sharp turn towards socialism, taking significant influence from Shah's close Indian ally Subhas Chandra Bose, and as such the AIA's exclusion from governance is likely to be swiftly lifted in the coming days."
 afghanistan_events.602.a: "Pacifism gives way to reality."

 afghanistan_events.603.t: "[ROOT.overlord.GetNonIdeologyName] Objects to the United Front"
 afghanistan_events.603.d: "With the AIA controlling the Frontier and being perceived as significantly more legitimate than the Fatherland Party, it seemed obvious to both the Chairman and the President that they should be included in government in some fashion, despite their non-socialist positions. Our great [ROOT.overlord.GetAdjective] benefactor has strongly disagreed however, believing that ideological purity is needed to avoid liberals and reformists coopting the government and regressing it back towards capitalism.\n\nAlthough they have stopped short of overruling the ongoing negotiations, not wishing to give the perception of being in complete control of our national policy, it would perhaps be wise to listen to their demands."
 afghanistan_events.603.a: "We're not going to let someone else tell us how to run our own country."
 afghanistan_events.603.b: "We asked for their help, we'd be fools not to listen."

 afghanistan_events.604.t: "The First Meeting of the United Front"
 afghanistan_events.604.d: "Following the recent agreement with the AIA, an official meeting has been held between their leadership and Fatherland Party representatives today in [AFG.Capital.GetCapitalVictoryPointName]. Although contentious issues such as elections were argued over for hours to little result, quite a few key things have finally been hashed out and agreed to. Central to the ongoing good will between parties, it has been seen fit to allow the continued operations of the regional government in the Frontier, with both sides agreeing however to its legal subordination to the central one. Despite the wishes of many hardliners within the Fatherland Party, the AIA's argument against outlawing all non-governing parties also won out, allowing a hypothetical opposition to form if the people choose to start one.\n\nOn the topic of cabinet positions, the results were unsurprisingly mixed. Although the appointment of Ghaffar Khan as Justice Minister proved uncontroversial, with both sides believing him to be the best man to institute a fair legal system, few other positions went through so smoothly. A lengthy debate over the position of Finance minister ended in socialist AIA member Mian Akbar Shah being selected as a compromise candidate, but the installation of those close to the chairman in many other positions hardly went over well.\n\nWith still a few cabinet positions unfilled after the meeting, president Ghobar has recommended to Popalzai that he consider giving out at least a few more positions out to those not perceived as loyalists. Rather than simply giving them to the AIA, he has proposed the names of a few independent leftist figures who could be chosen, with Abdul Rahman Loudin being most prominent amongst them. Although the call is the Chairman's, Ghobar was installed to help stabilise a controversial government, and accepting his advice is bound to appease at least some of those against it."
 afghanistan_events.604.a: "Loyal socialists should always be prioritised in government."
 afghanistan_events.604.b: "Too many yesmen will lead to stagnation, a balanced cabinet is a good thing."

 afghanistan_events.605.t: "Mojadidi Denounces the Government"
 afghanistan_events.605.d: "Ever since the first uprising in Russia, the Islamic establishment in Afghanistan have been in a permanent red scare, believing that any level of reform is a gateway to Bolshevism. Even when Amanullah Khan published his original constitution, Fazl Omar Mojadidi took a copy out to the bazaar and ripped it up, decrying it as a syndicalist document written by French atheists. To say that an actual socialist government taking power is anything but the worst nightmare of men like Mojadidi would be almost as far from the truth as calling Amanullah Khan a syndicalist.\n\nAlthough it seems unlikely that the Sher Agha will be able to instigate any kind of uprising against the government like he did to Amanullah, with the nation very much bled dry by civil war, he has called for all \"true Muslims\" to refuse any level of cooperation with the government. To paint the Chairman, a Maulana in his own right, as some kind of godless atheist would be laughable to any sensible person, and yet there are enough senseless people to make these calls a genuine threat that we must find a way to counter."
 afghanistan_events.605.a: "Men like Mojadidi would even decry the Prophet if he got in their way."

 afghanistan_events.606.t: "The Maulana and the Mojadidis"
 afghanistan_events.606.d: "Forlorn hopes that the Mojadidis wouldn't attract much support and simply give up after a week or two have clearly not come to pass. Rural and religious leaders across the nation have begun to heed the Sher Agha's calls for non-cooperation with the government, deeply limiting our ability to assert control over Afghanistan. It is obvious that something will need to be done about this turbulent mullah, but exactly what is now the question.\n\nIt may be rather tempting to consider just shooting him and being done with it, as surely Amanullah Khan must have frequently fantasised about, yet that would almost certainly provoke further unrest. Openly reaching out to him and his allies to show that the government is fundamentally socialist in nature, and in no way at odds with Islam is certainly an option, if we believe he is actually open to reason. Alternatively going on a grand propaganda offensive to reach the people before Mojadidi does could work well, as long as they believe us over him."
 afghanistan_events.606.a: "Try to negotiate with them, maybe they will see reason."
 afghanistan_events.606.b: "These men can't be reasoned with, go on the offensive."

 afghanistan_events.607.t: "The Olive Branch Snapped"
 afghanistan_events.607.d: "Any hopes that perhaps the Hazrat Nur al-Mashayikh was a man who could see reason have been completely dashed at this point. Two weeks of negotiators sent to meet with him, or at least any representative of the family, have been met with complete failure.\n\nThe single time that any government official even managed to see the man in person led to him completely ignoring them, and walking back into the building he just came out of. To make matters even worse, it appears that the Mojadidis have begun to relocate operations out of Shor Bazaar, moving instead to a family owned estate in Ghazni to the south. There is obviously no reasoning with these zealots, and a new strategy will have to be thought up for dealing with them."
 afghanistan_events.607.a: "Their lust for power blinds them."

 afghanistan_events.608.t: "Servants of the Criterion"
 afghanistan_events.608.d: "News from Ghazni has been somewhat sparse since the Mojadidis moved down to it, almost certainly an intentional strategy from them. It is because of this that the government only became fully aware of their latest move a few hours before it went into operation, with the Mojadidis forming a new organisation known as the Khuddamul Furqan, the Servants of the Criterion. Led by the sons of Fazl Omar, this organisation seems to have been created with the express purpose of coordinating anti-socialist resistance throughout Afghanistan, furthering their goal of bringing down the government.\n\nAlthough we do not know yet what the organisation plans to actually do, just the vague goals, there has already been worrying signs. Men tied to the Sher Agha have begun arriving in a number of major urban centres across the nation, and in [267.Controller.GetVictoryPointName_10737] men have been seen coming and going at all hours out of their previous main headquarters in Shor Bazaar. Orders have already been given for the Directorate of Intelligence Records to assemble a team specifically dedicated to monitoring the Servants, hoping to find any justification to openly move against them."
 afghanistan_events.608.a: "Monitor them closely, they're up to something."

 afghanistan_events.609.t: "The Ghazni Rebellion"
 afghanistan_events.609.d: "Good and bad news has come out of Ghazni today, as the campaign of the Sher Agha against us has at last reached its crescendo. An attempted grand uprising coordinated by the Servants across the nation has been dismantled and crushed due to the fantastic work of our intelligence officers, who became aware of the plan a few days before it went into action. The men sent by the Mojadidis to take control of urban centres outside of Ghazni were dealt with swiftly before they could execute their foul treason, although the stranglehold they had over Ghazni meant that the insurrection still went ahead there.\n\nRather than a grand takeover of the city, what ultimately happened was a large crowd of angry men marching upon the city's garrison, armed with whatever equipment they could muster. Expecting the soldiers to simply defect to their \"righteous\" cause, they were seemingly shocked when the men stood their ground instead. Continued failure clearly led to rage, as reports have indicated that one of the Servants eventually instigated an attack of some kind on the troops, prompting a firefight between them. Attacking professional soldiers with rifles from a century ago shockingly went poorly, leading to a mass slaughter of the rebels."
 afghanistan_events.609.a: "They have overplayed their hand for the final time."

 afghanistan_events.610.t: "The Flight of Fazl"
 afghanistan_events.610.d: "Although some members of the Mojadidi family lay amongst the dead in Ghazni, it seems the Sher Agha himself escaped such a fate. It is currently not know if he was personally at the fight with the garrison, or simply heard about the failure, but either way it appears that the man and his immediate family quickly fled not long after it begun.\n\nThose few members of the Mojadidi family who were not smart enough to follow his lead have now been arrested, with their headquarters in Shor Bazaar and Ghazni both raided by the Republican Army. We may have hoped to have Mojadidi's head on a pike as an example, but we can at least rejoice that their rebellion is finally at an end."
 afghanistan_events.610.a: "Hopefully that's the last we'll see of them."

 afghanistan_events.611.t: "Faith of the Common Man"
 afghanistan_events.611.d: "With attempts to negotiate with Fazl Omar Mojadidi being quickly discarded as fundamentally flawed, the propaganda campaign idea quickly became the favoured option of dealing with his petulance. Rather than simply allowing them to control the narrative, the Chairman has moved to paint the Republic as indisputably Islamic in nature. Leaning on his position as a well respected Islamic scholar, and joined by many of his compatriots in the field, he has begun hosting daily speeches in [AFG.Capital.GetCapitalVictoryPointName] to hammer home this argument.\n\nQuoting directly from both the Quran and the sahih hadiths, such as those against riba and in favour of equal distribution, Popalzai repeatedly laid out to the common people of the capital exactly how socialism and Islam are simply one and the same. Going further, and appealing to nationalist sentiment, he made the argument that his ideology is home grown, with great Afghan men like Jamal al-Din al-Afghani advocating for Islamic socialism as far back as the previous century.\n\nThe initial reactions to these speeches, as well as announcements by the government of increased funding for religious institutions and the construction of new mosques has been extremely positive. Even some of the ulema, who once echoed Mojadidi's attacks against the government, have begun to sing a different tune, especially in regards to the increased funding. Only time shall tell however if we have won the propaganda battle, or if Fazl Omar still has tricks up his sleeves."
 afghanistan_events.611.a: "Those who reject revolution reject Islam."

 afghanistan_events.612.t: "The Holy Light Dims"
 afghanistan_events.612.d: "Weeks and weeks have gone by, and one would be forgiven for thinking that the so-called Hazrat Nur al-Mashayikh, the \"Holy Light of the Ulema\", had simply accepted the Chairman's rule without a fight. In reality the man has actually spent much of this time even more voraciously attacking the government, to an audience that dwindles with every passing day. Claims that the government stands against Islam seem hard to make stick when the Quran is pushed as the central guiding text of its rule, and further claims that it plans to destroy the nation's religious community ring hollow when many now worship together in mosques funded directly by the government.\n\nAlthough it seems that until his dying day he will continue to protest against us, hopefully for now we can just keep ignoring him, with the idea he was once considered a threat almost laughable."
 afghanistan_events.612.a: "Men who abuse the faith always falter."

 afghanistan_events.613.t: "Treason Continues to Fester"
 afghanistan_events.613.d: "Hopes that we could simply forget about Fazl Omar Mojadidi and his family of dissidents keep being dashed as the man seems desperate to get the government's attention, going to further and further extreme lengths to attract eyes upon their protests. The latest stunt, involving an attempt to march into the Arg and denounce the Chairman to his face, was quickly halted by security forces in the capital. The idea that even in his diminished position the Sher Agha could still prove to be a threat is one being reconsidered, much as how a dying dog can still lash out and bite those who are not careful.\n\nWith his influence depleted, and his recent stunt being entirely possible to reframe as an act of insurrection with enough of a propaganda push; it has been recommended that we order not only his arrest but that of his entire direct family, women and children included. Such an action would of course be drastic, and unlikely to be popular amongst those who once held him in high regard, but it will at least last rid us of this pest. Continuing to ignore him may simply be easier though, as even if he tries such a stunt again, security forces may simply show him to an early grave for us instead."
 afghanistan_events.613.a: "For as long as they're free they're a threat, arrest them all."
 afghanistan_events.613.b: "They pose no threat anymore, leave them be."

 afghanistan_events.614.t: "The Kisan Conference"
 afghanistan_events.614.d: "Afghanistan is far from the industrial titans that Britain and France were when they had their own revolutions, yet it is still a nation home to at least some members of the proletariat class, with said labourers no strangers to capitalist exploitation. In the Frontier a budding trade union movement began as early as the days of British rule, and now with government backing it has grown quite substantially in both membership and influence.\n\nWishing to spread the unionism of the Frontier to the rest of Afghanistan, trade unionist and syndicalist activist Muhammad Younus Qureshi has today held a grand labour conference in [AFG.Capital.GetCapitalVictoryPointName], hoping to build an all-Afghan movement. Rather than simply limiting the conference to the urban worker, all members of the \"kisan\" class were invited to attend, including any man or woman who labours for a living, not just the typical image of the proletariat. While we may still be far from an All-Indian Trade Union Congress like that of our Indian neighbours, and perhaps decades from anything resembling European syndicalism, any movement that advances the cause of the workers is one deserving of the Party's support. "
 afghanistan_events.614.a: "Perhaps European Syndicalism is Afghanistan's future?"

 afghanistan_events.615.t: "Integration of the Babbar Akali Party"
 afghanistan_events.615.d: "The final years of the British Raj saw agitation from all members of society, with the Sikhs experiencing their own political evolution with the Gurdwara Reform Movement, more commonly known simply as the Akali Movement. Although it began with Gurdwara reform, Sikh politics quickly escalated into joining the non-violent resistance against British rule, but many found themselves at odds with turning the other cheek. A splinter group known as the Babbar Akali Movement quickly broke away under the leadership of Kishan Singh Gargajj and Mota Singh, who helped orchestrate a campaign of violence against Britain both in the Frontier and Punjab.\n\nBy the start of the Indian Civil War, the movement was almost entirely crushed, especially with the death of Gargajj at the hands of the British. However after a daring prison break of captured members, most of the remaining revolutionaries fled into the Frontier, which soon fell into Afghan control. Since that day these exiles have been held in high regard by the Frontier's Sikh population, and in the years since have operated a socialist adjacent party known as the Babbar Akali Party under Singh's continued leadership.\n\nAlthough Sikh-Muslim relations have long been strained in the Frontier, Chairman Popalzai has always treated Singh's party as allies, and they have frequently offered their support in return. As a result, negotiations have been ongoing since the foundation of the Hezb-e Watan as to their place within it, and at last an agreement has been reached for their full merger into the party, representing the nation's Sikhs on a national level. It is hoped that in time the wounds of the past can finally be moved past, and all Afghans regardless of religion can unite under the red banner."
 afghanistan_events.615.a: "We find unity in socialism."

 afghanistan_events.616.t: "Our Brothers Across the Border"
 afghanistan_events.616.d.start: "For a region that has suffered so long under foreign oppression, it has hardly been a surprise that both India and Afghanistan have at last freed themselves from not only the imperialist powers but from their lingering capitalist venom. Before the unification of Afghanistan, the Frontier Socialist Party's members fought alongside Indian revolutionaries like the great Bhagat Singh and Chandra Azad, and so even after the Frontier's takeover by the Afghans ties between Indian and Afghan socialists continued to be fostered.\n\nWishing to further cement ties between us, and congratulate Chairman Popalzai on successfully liberating the Afghan people from the tyranny and chaos brought about by the monarchy, [HND.GetAdjective] representatives have arrived in [AFG.Capital.GetCapitalVictoryPointName] to meet with him."
 afghanistan_events.616.d.radsoc: "$afghanistan_events.616.d.start$ This delegation has been personally led by Yusuf Meherally Merchant, the recently appointed ambassador to Afghanistan.\n\nMeherally, a fellow socialist and Muslim, has found much in common with the Chairman from discussions together, with both proud of their history standing up for the lowest of the working classes. Through conversations with the Chairman, he has expressed India's full support for our government, and hopes that the friendship between us continues to grow in perpetuity."
 afghanistan_events.616.d.syndicalist: "$afghanistan_events.616.d.start$ This delegation has been personally led by V. K. Krishna Menon, India's current Foreign Minister, and a close ally of [HND.GetLeader].\n\nAlthough some members of the delegation came across as rather cold, with one arrogantly describing Afghan music as simply Indian in nature, Menon himself remained completely cordial throughout; notably greatly enjoying the home grown sarda melons offered to him. Through conversations with the Chairman, he has expressed India's full support for our government, and hopes that the friendship between us continues to grow in perpetuity."
 afghanistan_events.616.d.totalist: "$afghanistan_events.616.d.start$ Shockingly at the head of this delegation is none other than [HND.GetLeader]'s brother, Sarat Chandra Bose. A close confidant of his brother, both Sarat and Subhas are said to have many allies within both the Fatherland Party and the AIA, Mian Akbar Shah being perhaps the most notable.\n\nIn his meetings with Chairman Popalzai, Sarat wished to convey a direct message from his brother, hoping that Afghanistan will commit itself to the full liberation of the Eastern people from the tyranny of the West. United under the banner of anti imperialism, India's full support for our government was also expressed, hoping to continue to foster unity between our peoples."
 afghanistan_events.616.a: "[HND.GetLeader] sets a great example for us all."

 afghanistan_events.617.t: "Laxness Leads to Liberalism"
 afghanistan_events.617.d: "In an unsurprising turn of events, it has not taken long for dissidents to take advantage of our concession to allow political parties to form. In the past few weeks two new parties have slowly organised to represent both the liberals and conservatives in the country who stand against socialism. The liberals, calling themselves the Tehrik-i-Naujawanan Baidar (Movement of Enlightened Youth), are primarily composed of many Kabuli academics who have read enough capitalist literature to be fully convinced by their claims. The party is led by Abdul Hai Habibi, who although initially supportive of the republic's establishment has come to frequently criticise our government, but not yet enough to justify any crackdown.\n\nOn the other side of the spectrum, many of the anti-socialists from the Amanullah years have found themselves organising around Abdul Hadi Dawi, now leading the Hezb-e Islami Afghanistan (Islamic Party of Afghanistan). Despite being regarded by many as an Amanite, the final years of Amanullah's reign saw a break between the two, with Dawi's stance turning further towards conservatism. Now even the right wing opponents of the former king find themselves behind Dawi, potentially hoping to one day bring down the socialist republic if given the opportunity."
 afghanistan_events.617.a: "As long as they know their place, dissent can be tolerated."

 afghanistan_events.618.t: "Nationalisation of Foreign Factories"
 afghanistan_events.618.d: "Before the civil war, when the nation was still led by Amanullah Khan, foreign corporations were invited to make Afghanistan their second home.\n\nAlthough many have since fled, scared off by both the civil war and socialist takeover, a significant number of factories still remain under effective foreign control. It is time however to at last transfer them over to their true owners, the Afghan people, and expel the last remnants of foreign capital in the nation."
 afghanistan_events.618.a: "As long as they know their place, dissent can be tolerated."

 afghanistan_events.1000.t: "Future of the Qaumi Militias"
 afghanistan_events.1000.d: "For centuries warfare in Afghanistan has involved the reliance upon tribal leaders providing men to fight for the King, known as the qaumi method, with most other countries in the world having similar past experiences. In every other modern nation however, this idea of decentralised levy recruitment has been discarded to the dustbin of history, a relic of a bygone age like knights or chivalry.\n\nRather than living in this enlightened modern age however, the [GetRoyalOrRepublicanCap] Army is still very much reliant on troops gathered through this system, rather than being able to solely conscript new recruits when needed. Even with the introduction of conscription, the role of tribal elders in deciding who actually goes to serve in the army has not been entirely replaced, only minimised.\n\nFor years there has been calls for a move to a nufus method of conscription, where the role of tribal leaders in recruitment is completely eliminated. Likewise for years pushback has seen plans for this shelved over and over, with fears of unrest if the tribal leaders have any more power stripped from them. As per the Wardak Report however, if the [GetRoyalOrRepublicanCap] Army is to truly reform, we must finally bite the bullet and accept any backlash against it."
 afghanistan_events.1000.a: "Begin their phasing out, and the move towards a Nufus system."
 afghanistan_events.1000.b: "The Quami method must be maintained."

 afghanistan_events.1001.t: "The Fundamental Role of Knowledge"
 afghanistan_events.1001.d: "While it is difficult to change the minds of those advanced in age, with many arguing it to be an effective impossibility to get an elder to even reconsider firmly held beliefs, the malleability of children has long been recognised. Even those still fresh into their adulthood can easily have their mind warped by a good teacher. For any ruler who wishes to ensure a population aligned with their values, educating the next generation into them is one of the most vital actions they can take.\n\nAlthough education has historically been rather decentralised in Afghanistan, the move towards more state ran schools and the expansion of the Education Ministry has given rise to the concept of there actually being national curriculums for schools to follow. Those amongst us who recognise the power of such uniform teaching have unsurprisingly begun pushing the Ministry to adopt teachings that align with their values.\n\nThose more in favour of a traditionalist viewpoint have demanded that education prioritises the focus on Islamic teachings above all else, with everything ultimately feeding back to the Quran and the hadiths. Others meanwhile speak of the fantastic schools in [TUR.GetNameDef], whose more secular minded education has produced excellent results we should attempt to emulate."
 afghanistan_events.1001.a: "Education should always be foremost a tool to understand the Quran."
 afghanistan_events.1001.b: "If secular education's good enough for the Caliph, it's good enough for us."

 afghanistan_events.1002.t: "The Azadist Incubator"
 afghanistan_events.1002.d: "Following Amanullah's and the military's recent investments in the modernisation of the airforce, we have seen a considerable uptick in young and new cadets enlisting for the branch. Unlike the army, the airforce is reputedly much more merit-based; officers and sergeants who owe their rank to their tribal and familial ties are not nearly as present.\n\nIt is, indeed, a fine sight that nepotism seems to have failed to properly infect the airforce, but this comes with its own consequences. Many of these cadets resent the state of affairs in the army, and as such can be counted as reliable supporters of the Azadist Clique. While modern elements of war like bombers and fighter planes are doubtlessly virtuous for both our defensive capabilities and our power projection over regionalist tribes, some of the King's conservative advisors are highly wary of the strength of factionalism within the military."
 afghanistan_events.1002.a: "For a modern army, cliqueism is a small price to pay."

 afghanistan_events.2000.t: "Return of the Reds"
 afghanistan_events.2000.d: "What was initially expected to just be another bout of unrest in Russia has shockingly led to a surprising turn of events; Moscow has fallen once again to the Reds, and it is said that the armed forces are begrudgingly accepting their takeover. The return of Bolshevism, or whatever they are calling themselves now, has quickly incited panic in the capital, with countless believing that we must take a stand immediately to prevent revolution spreading to Afghanistan.\n\nFor those more levelled headed however, the idea of completely cutting Afghanistan off from Russia is seen as absurd, simply harming the nation and actually inciting Russia to take hostile action against us. While Afghanistan is unlikely to find as strong of support from a Red Moscow, perhaps they will still be willing to work with us, standing side by side against the imperialist west."
 afghanistan_events.2000.a: "We cannot tolerate these extremists influencing us."
 afghanistan_events.2000.b: "Now lets not get hasty, perhaps we can still work with the Reds."

 afghanistan_events.2001.t: "The Collapsing Caliphate"
 afghanistan_events.2001.d: "Disastrous news has been received from [773.Controller.GetVictoryPointName_9833], as our friends in the Ottoman Empire have officially surrendered to the Cairo Pact upstarts.\n\nAlthough many within Afghanistan hold sympathy for the cause of the Arabs, the Ottoman defeat will no doubt evaporate their presence in Afghanistan, wasting so much of our effort curating it."
 afghanistan_events.2001.a: "Can we really be surprised the sick man finally croaked?"

 afghanistan_pashtunistan_events.1.t: "Tax Dispute in Timergara"
 afghanistan_pashtunistan_events.1.d: "While attempting to collect fiscal levies from a tribe in Timergara, a mob of angry peasants descended upon our officials and began aggressively harassing them. Under the pretenses of having already paid taxes to [442.Controller.GetVictoryPointName_12717], the locals feel that paying additional taxes to [267.Controller.GetVictoryPointName_12769] is tantamount to extortion. Even though taxes should be paid to us, and not the petty regionalists in Pashtunistan, the mob was unconvinced by legality and instead drove our tax collectors out of Timergara.\n\nUpon receiving the news, Amanullah has reportedly become beside himself with fury. His official edict is for the tax collectors to wait out the tensions and then return again, for the King will not tolerate dissent from a handful of upstarts."
 afghanistan_pashtunistan_events.1.a: "Send armed guards with them next time, that'll show these uppity peasants."

 afghanistan_pashtunistan_events.2.t: "Timergara Tax Collectors Shot Dead"
 afghanistan_pashtunistan_events.2.d: "Having at last returned to Timergara for another attempt at taxing the locals-- this time with a cadre of armed guards-- the collectors were met with the very thing they feared and were threatened with when they were driven out the first time. Seeing the armed guards as a provocation by the government, the tribesmen took up arms and after a brief and rapidly escalating standoff, fired upon our officials and slaughtered all but one of the collectors, who managed to escape (but with two newly annointed windows in his abdomen and arm).\n\nThe armed guards were a mercy; now it is time to get mean. Amanullah has formally ordered a detachment of the Royal Army to quash this ungrateful uprising and show them that in return for defying Amanullah, penalties will be exchanged."
 afghanistan_pashtunistan_events.2.a: "Show these rebels what happens to those who oppose their king!"

 afghanistan_pashtunistan_events.3.t: "Pashtunistan Government Defends the Tribesmen"
 afghanistan_pashtunistan_events.3.d: "As our troops descended upon the Frontier, the Pashtunistan Government has simultaneously cobbled together and ordered a detachment of irregulars to occupy a key pass. A messenger from their ranks issued a formal communication to our detachment's commander, Ali Ahmad Khan, which proclaimed [442.Controller.GetVictoryPointName_12717]'s defence of the tribesmen of TImergara and the denunciation of Amanullah's \"unjustifiable and tyrannical\" attempt at punishment.\n\nIn light of the situation, the commander of our forces has withdrawn to a secure vantage point and he has decided to wait for further orders from [267.Controller.GetVictoryPointName_12769].This marks the most brazen defiance against our rule by Pashtunistan to date, and Amanullah has called an emergency meeting with his ministers and the army's high command to discuss the government's next move."
 afghanistan_pashtunistan_events.3.a: "Who do the Khans think they are?"

 afghanistan_pashtunistan_events.4.t: "Wardak Advocates Seeking a Peaceful Solution"
 afghanistan_pashtunistan_events.4.d: "While the emergency meeting may have begun with the King repeatedly demanding the full force of the Royal Army be sent to crush the \"[442.Controller.GetVictoryPointName_12717] Revolt\" and put all survivors in front of a firing squad, both Nadir and Wardak have taken a hard stance against him. Despite both men reaching their positions through entirely different lines of reasoning, they are in agreement that escalation has only made things worse so far. On top of it all, almost every tribe in the region supports [442.Controller.GetVictoryPointName_12717], including what appear to be a number of regicidal Indian-backed revolutionaries, meaning that military action will no doubt result in a bloody civil war.\n\nWardak has instead proposed that a diplomatic solution be attempted, with Wardak himself being sent to negotiate with the local government to find a resolution that benefits both parties. Alternatively if all else fails, he has also offered a fallback approach of at least winning over the local rulers first through an assortment of privileges and bribes so they turn a blind eye when the time comes.\n\nWhile after enough debate the king finally acquiesced to Wardak's proposal, he has warned him that if an agreement isn't reached quickly, he will take matters into his own hands no matter how hard anyone objects, and his head will be joining those that will roll if it comes to that."
 afghanistan_pashtunistan_events.4.a: "Open negotiations with the Khans, it's our best option"
 afghanistan_pashtunistan_events.4.b: "We won't negotiate with these upstarts, send envoys to the tribal leaders"

 afghanistan_pashtunistan_events.5.t: "Wardak Meets with the Khans"
 afghanistan_pashtunistan_events.5.d: "Having departed as soon as he could, Wardak has arrived in [442.Controller.GetVictoryPointName_12717] to open negotiations with the local government to resolve the crisis peacefully. Attended by both Khan Sahib and Bacha Khan, alongside other local leaders, the meeting initially began very coldly, with the Khans placing the blame for this incident firmly on [267.Controller.GetVictoryPointName_12769]'s repeated escalation. Quickly however they made note of their appreciation that the King had clearly seen wisdom, having sent his representative to speak rather than fight, and are seemingly open to the idea that the King always had the best intentions in mind.\n\nAfter a lengthy discussion they ultimately agreed to the terms present by Wardak to officialise their position within the state and clearly delineate who has authority over what, but have presented a list of their own demands to be fulfilled before any such agreement can be finalised, so that they can be safe in the knowledge that the King's words do not ring hollow."
 afghanistan_pashtunistan_events.5.a: "A lengthy list of demands, but if it'll bring peace..."

 afghanistan_pashtunistan_events.6.t: "Wardak Meets with Local Leaders"
 afghanistan_pashtunistan_events.6.d: "Travelling throughout the Pashtun borderlands and meeting with everyone from local chiefs all the way up to the Badshah of Swat, Wardak has heard from these local power brokers what they would need to turn a blind eye if Amanullah made a move against the government in [442.Controller.GetVictoryPointName_12717]. While some have made clear that nothing will make them betray the Khans, enough have been willing to negotiate for the right price for this scheme to work.\n\nThe rulers of Swat, Chitral, and Dir have notably been open to the idea, with the three being the strongest rulers in the region, although with such power all three have made no illusions that they will only back the move if the downfall of the [442.Controller.GetVictoryPointName_12717] government sees their own power grow in its place. With enough people willing to be on board, it seems that the palm greasing stage of negotiations is next on the agenda."
 afghanistan_pashtunistan_events.6.a: "Just a few handfuls of gold and some titles, and no one should stand against the King."

 afghanistan_pashtunistan_events.7.t: "The King Waits For No One"
 afghanistan_pashtunistan_events.7.d: "Having grown impatient over Wardak's lack of progress, the King has finally decided to recall him back to [267.Controller.GetVictoryPointName_12769]. Instead the order has been given to Nadir, despite his protests, to crush the government in Pashtunistan by force.\n\nSoldiers are to be sent into [442.Controller.GetVictoryPointName_12717] over the next few days, arresting as many members of the government as possible, and ensuring, once and for all, that the King's authority is cemented and properly understood throughout the region."
 afghanistan_pashtunistan_events.7.a: "If you want something done right..."

 afghanistan_pashtunistan_events.8.t: "The Death of the Doctor"
 afghanistan_pashtunistan_events.8.d: "Meeting little resistance on their way into [442.Controller.GetVictoryPointName_12717], Royal Army soldiers quickly found themselves outside the main building used by the regional government, greeted there by both Bacha Khan and his brother Dr Khan Sahib alongside a crowd of supporters, many of whom were armed. The two men passionately made their case to the soldiers, saying that although they would not violently resist against the King's attempts to dissolve the government, they will refuse to comply with any demands given to them in a peaceful manner.\n\nThis obstinacy would ultimately lead to a fatal mistake by one of the soldiers, who attempted to arrest Khan Sahib, leading to a scuffle breaking out as those in the crowd tried to stop him. No one can truly agree who fired the first shot, but a bloodbath soon followed, with dozens on both sides dead, the good doctor finding himself amongst the casualties.\n\nDespite Ghaffar Khan's immediate calls for peace, it seems that for many this has been the final straw, and there are reports of attacks on soldiers throughout the region, not simply in [442.Controller.GetVictoryPointName_12717]. There is even now talks of an army being assembled, led by the so called \"Marxist Maulana\" Abdur Rahim Popalzai, whose ties to the Indian government in Calcutta make foreign intervention in favour of these rebels a distinct possibility. We can do little now but brace for impact and hope to survive the inevitable chaos."
 afghanistan_pashtunistan_events.8.a: "This can't be good..."

 afghanistan_pashtunistan_events.9.t: "Pashtunistan Revolts!"
 afghanistan_pashtunistan_events.9.d: "The worst has come to pass, an unfortunate inevitability after such a slaughter. Rebels loyal to Ghaffar Khan and his late brother have risen up all across the frontier, declaring their allegiance to the [442.Controller.GetVictoryPointName_12717] government and calling for full independence from [267.Controller.GetVictoryPointName_12769]. While Ghaffar Khan himself has refrained from endorsing this violent rebellion, even he at this point has not actively attempted to stop them, having seemingly isolated himself in mourning.\n\nPopalzai has instead taken the reins of the rebellion, with those from all walks of life operating under his banner, including a large contingent of men from Waziristan and the soldiers of some of the local princely states. The rebels, now calling themselves the army of \"Pathanistan\", are seemingly unlikely to stop until they have secured both revenge and freedom, or have died trying. We must hope that it is the latter."
 afghanistan_pashtunistan_events.9.a: "Men, to Arms!"

 afghanistan_pashtunistan_events.10.t: "Failure on the Frontier"
 afghanistan_pashtunistan_events.10.d: "Despite our best efforts, our campaign against the rebel Army of Pathanistan has resulted in a stalled frontline, disorganised and gradually mutinous troops, and several attritioning battalions surrounded by those who see them as hostile invaders. Unable to entertain Amanullah's bloody quest for vengeance and control, Nadir Khan, in conjunction with a major portion of the army brass, has requested the withdrawal of all Royal Army forces from the Pashtunistan region and the prompt cessation of hostilities.\n\nDespite Amanullah's insistence that with just a few more weeks the rebels will fall, continued opposition by the army's leadership has ominously revealed that if he does not acquiesce to their \"recommendation on the matter\" it just may be the straw that turns the Royal Army against him. In the end, the crestfallen King sees no choice but to order a ceasefire and what will amount, defacto, to the legal secession of Pathanistan from the Afghan realm."
 afghanistan_pashtunistan_events.10.a: "A shattering defeat..."

 afghanistan_pashtunistan_events.11.t: "Rebellion Crushed"
 afghanistan_pashtunistan_events.11.d: "At long last, the insubordinate revolt of the pathetic \"Army of Pathanistan\" has been crushed under the righteous strength of our great army! Due to the scale of the revolt and the sustained loyalty of our commanders, Amanullah has arranged for a grand reward ceremony to fashion his victorious generals with shiny new medals to commemorate the victory. As [267.controller.GetVictoryPointName_12769] celebrates, the last embers in Peshawar smolder. Renegades still roam the mountain passes, fighting on in the name of a futile cause in their refusal to admit defeat. With reconstruction and the establishment of centralised control over Pashtunistan in the months to come, their stubbornness will only provide them with the reward of a death sentence."
 afghanistan_pashtunistan_events.11.a: "They'll fall back in line soon enough."

 afghanistan_pashtunistan_events.12.t: "Agreement Reached with the Khans"
 afghanistan_pashtunistan_events.12.d: "Weeks and weeks of non-stop negotiations between minister Wardak and the leadership of the AIA has not been for naught. Finally hashing out the last few details, a finalised agreement has been produced that is somehow actually agreeable to Wardak, Ghaffar Khan, and Amanullah Khan. The government in [442.Controller.GetVictoryPointName_12717] is set now to finally be officially recognised, with an exact defined legal status and position within the Afghan state.\n\nAlthough there has been some grumbling about the extent of autonomy the region has been promised, few can deny that it is better than the potential alternatives had an agreement not been reached..."
 afghanistan_pashtunistan_events.12.a: "Better than it ending in bloodshed."

 afghanistan_pashtunistan_events.13.t: "Dissolving the [442.Controller.GetVictoryPointName_12717] Government"
 afghanistan_pashtunistan_events.13.d: "With their powerbase destroyed, and [AFG.Capital.GetCapitalVictoryPointName]'s tendrils slowly beginning to stretch through every town and city of the Frontier, few could deny that the the writing was finally on the wall for the [442.Controller.GetVictoryPointName_12717] Government. An official decree, issued by King Amanullah, has put into place limits about how local regions may choose to govern themselves, worded in such a way to not directly name [442.Controller.GetVictoryPointName_12717] but only outlaw it and any copycats.\n\nRather than attempt to dispute this dissolution, it appears that Ghaffar Khan and Khan Sahib have simply resigned themselves to their fate, accepting the King's undisputed rule over the entirety of Pashtunistan."
 afghanistan_pashtunistan_events.13.a: "The King reigns supreme."

 afghanistan_pashtunistan_events.14.t: "Pathanistan Goes SocDem"
 afghanistan_pashtunistan_events.14.d: "If you see this, please make a bug report."
 afghanistan_pashtunistan_events.14.a: "Yay"

 afghanistan_pashtunistan_events.15.t: "Mines and Marauders"
 afghanistan_pashtunistan_events.15.d: "Now adding fuel to the fire of tensions betwixt [267.Controller.GetVictoryPointName_12769] and [442.Controller.GetVictoryPointName_12717] is a devastating raid coordinated by a large gang of bandits on the precious emerald mines in the Pathan mining town of Swat. Within the timeframe of just an hour, they disarmed the guards of the mines (and executed anyone who objected) and secured a massive booty of gemstones, depriving the mine of serious profits and the miners of their security.\n\n[442.Controller.GetVictoryPointName_12717], thus far, is struggling to bring the bandits to justice. This is ironically a failure of immense self-satisfaction to Amanullah, who pushed for the mines to be directly secured by the army in 1934. His proposal was indignantly refused by local leaders, citing it to be unprecedented oversight and an egregious violation of their expected autonomy. In light of their embarrassment, the King is now tempted to send down a formal commission to catch the bandits ourselves. If successful, it would send a pretty clear message to the frontier that [442.Controller.GetVictoryPointName_12717] is incapable of protecting them like [267.Controller.GetVictoryPointName_12769] is."
 afghanistan_pashtunistan_events.15.a: "[267.Controller.GetVictoryPointName_12769] will do what [442.Controller.GetVictoryPointName_12717] can't."
 afghanistan_pashtunistan_events.15.b: "They don't deserve our help."

 afghanistan_pashtunistan_events.16.t: "A Dead End"
 afghanistan_pashtunistan_events.16.d: "With barely any leads to show for their efforts after over a month and a half of investigating, the commission assigned to deliver the bandit conspirators responsible for the recent raid in Swat appears to be capable of uncovering only their own incompetence. Now, the crown jewel of their efforts is to be the murder of one of their investigators in a back alley behind a bazaar in [442.Controller.GetVictoryPointName_12717]. Not a single one of them can explain what lead he was chasing nor did any of them know he was there in the first place, as he evidently failed to communicate his whereabouts to any of them. Rumourmills run abuzz, popularising the theory that the murder is a conspiracy that connects directly to Khan Sahib himself, who was greatly displeased with Amanullah's overreach.\n\nThe investigators that remain make empty promises of resolving the murder and claim they're on the verge of a breakthrough. Despite their vows, both [267.Controller.GetVictoryPointName_12769] and [442.Controller.GetVictoryPointName_12717] know there is but one solvent truth in this case; the dead-end alleyway he died in is a metaphor for the entire commission."
 afghanistan_pashtunistan_events.16.a: "I asked you to solve mysteries, not create more!"

 afghanistan_pashtunistan_events.17.t: "Beating Back the Bandits"
 afghanistan_pashtunistan_events.17.d: "Today is a glorious day for Amanullah, as his investigative commission has successfully sleuthed the identity and whereabouts of most of the bandit conspirators responsible for the recent raid in Swat. Indeed, one of their posse was found ignominiously flaunting his wealth by purchasing fanciful textiles at a market in [442.Controller.GetVictoryPointName_12717] by bartering with his share of the stolen emeralds, shortly thereafter being tracked and interrogated until he gave up his fellow criminals and led the commission to their safehouse. Most of the stolen jewels have been repossessed, and despite their attempts at resisting arrest the bandits were efficiently neutralised.\n\nAmanullah has stridently launched a propaganda campaign, highlighting the government's success at restoring justice and order and subsequently humiliating [442.Controller.GetVictoryPointName_12717]'s lackluster efforts at maintaining the stability of the frontier. As the people celebrate Amanullah as the guardian of order, Bacha Khan loses his room to bargain."
 afghanistan_pashtunistan_events.17.a: "Let it be known the King protects all of his subjects."
 afghanistan_pashtunistan_events.17.b: "And let it be known [442.Controller.GetVictoryPointName_12717] can't alone."

 afghanistan_pashtunistan_events.18.t: "The Voice of Frontier Muslims"
 afghanistan_pashtunistan_events.18.d: "Frustrating our efforts to resolve the crisis on the frontier are the incendiary local publications based out of [442.Controller.GetVictoryPointName_12717]. The \"Voice of the Frontier Muslims\", a newspaper owned by leader of the local United Muslims Nationalist Party, Aurangzeb Khan Gandapur, has taken to denouncing Amanullah as an autocratic tyrant whose concerns lie more with the imperialist centralisation of his realm than improving the freedom of Muslims under his reign. A supporter of reformers in the neighbouring [RAJ.GetName], he has so boldly taken to claim that the people of \"Pathanistan\" would likely be better off reincorporated into a federalised India than under the oppressive jackboot of [267.Controller.GetVictoryPointName_12769].\n\nAlthough Gandapur may lead the second largest party in the Frontier, his actual influence is far surpassed by other local leaders. Still, such bold and treasonous statements are completely intolerable, especially as they echo through the mountains of Afghanistan and reach the ears of our other subjects and undermine the King's image as the Liberator of the Muslim People."
 afghanistan_pashtunistan_events.18.a: "Stop the presses at once!"
 afghanistan_pashtunistan_events.18.b: "He's hardly even relevant in his own city, ignore him."

 afghanistan_pashtunistan_events.19.t: "The Faqir of Ipi Rouses Suspicion"
 afghanistan_pashtunistan_events.19.d: "Wardak's efforts to achieve an accord with Bacha Khan have, thus far, not yet produced a conclusive result. Making matters worse, our informants have reported that the Faqir of Ipi has ventured out of Waziristan and arrived in [442.Controller.GetVictoryPointName_12717] for a clandestine meeting with Bacha Khan and Khan Sahib. Ever since the conquest of the frontier by Afghanistan, the Faqir has dutifully served the Afghan state, believing fully in the unity of the Pashtun peoples.\n\nIt seems now however that rather than simply serve the King, he is negotiating with other representatives of the Pathan people, seldom an alternative conclusion can be drawn aside from his intention to declare for and support any uprising or armed resistance from the frontier against our rule. This is a seriously crafty man and perhaps the most capable organiser of guerrilla resistance in the entire frontier. However, every man has a price. Perhaps we would be wise to outbid [442.Controller.GetVictoryPointName_12717], even if it risks showing our hand too early."
 afghanistan_pashtunistan_events.19.a: "Funnel him some funds, perhaps it'll make him stay out of this."
 afghanistan_pashtunistan_events.19.b: "One man is hardly going to change things."

 afghanistan_pashtunistan_events.20.t: "The Faqir Agrees"
 afghanistan_pashtunistan_events.20.d: "After some hesitation and conferring with close confidantes on his end, the Faqir has accepted our gift of goodwill and has vowed to remain neutral in the event of any escalated conflict on the Frontier, refusing in advance to take up arms against any of his Muslim brothers in the Frontier and planning to use the gold for the betterment of his village.\n\nFurthermore, he revealed the nature and proceedings of his rendezvous in [442.Controller.GetVictoryPointName_12717]. Supposedly, Bacha Khan and Khan Sahib do not desire any sort of armed conflict and are trying with all of their resources to reach an accord \"fair and favourable\" to the Frontier. The Faqir had offered himself and his men to defend, in the event of a violent conflict, the freedom and the integrity of the Frontier's people, asking for no payment upfront, although he claims Bacha Khan refused his request completely."
 afghanistan_pashtunistan_events.20.a: "It is hard to find a man who can't be bribed."

 afghanistan_pashtunistan_events.21.t: "Outrage in Ipi"
 afghanistan_pashtunistan_events.21.d: "Our delegation, furnished with some sacks of gold, have been turned around and driven out of Waziristan by the Faqir. He has denied our insinuation that he was tempted to rise against Afghanistan in the event of a rebellion, but revealingly claimed that it is overtures like these that reveal Barakzai rule to be no less different than that of the British. While no physical harm came to our people, they were threatened with violence in the event that they had not immediately decided to make a hasty getaway from his territory.\n\nRumours are now abound, perhaps no doubt sourced from him and his clan, that Amanullah Khan plans to subjugate the Pathan frontier and sell it back to the British Commonwealth for great riches and an alliance, returning them to harsh tribal policies and rule by an Indian elite, the very same that thousands of tribesmen died fighting against. This propaganda has begun to spread throughout the mountains like a torrential and seditious billow of wind, undermining negotiations as shepherds, farmers, and tribesmen now envisage Amanullah as the incarnation of the devil."
 afghanistan_pashtunistan_events.21.a: "Traitors, the whole lot of them!"

 afghanistan_pashtunistan_events.22.t: "Alamzeb's Gratitude"
 afghanistan_pashtunistan_events.22.d: "Credited to our support in developing Dir's security forces and the special exemption of conscription we have promised them, Alamzeb Khan of Dir has sent a delegation claiming that he has assembled a massive army that is ready to exact vengeance on any and all forces who use the situation as a pretense for rebellion.\n\nWhile it's unlikely that the Dir Militia possesses any considerable strength, it is still comforting to know that we have at least one guaranteed ally in the region."
 afghanistan_pashtunistan_events.22.a: "Pashtun pals in Princely places."

 afghanistan_pashtunistan_events.23.t: "Dir's Last Stand!"
 afghanistan_pashtunistan_events.23.d: "As the Army of Pathanistan rises against the Royal Army, the Princely State of Dir has formally declared war against the rebel forces and has begun incursions into Chitral and Swat, whom it additionally accused of plotting to conquer Dir and divide its realm between the two of them.\n\nPersonally leading his forces, Alamzeb has obviously made the right choice in denouncing Popalzai's band of marauders!"
 afghanistan_pashtunistan_events.23.a: "Rise, to Afghanistan's Banner!"

 afghanistan_pashtunistan_events.24.t: "Spoils of War Debacle"
 afghanistan_pashtunistan_events.24.d: "As fighting between us and the insurgent Pathan rebellion goes on, the soldiers of our army have taken to looting and the effectuation of other atrocities on the villages they have re-occupied. Regarded merely as spoils of war that they earn as a reward for their prowess and victory in battle, it yet still causes tremendous damage to property and quality of life on the local level and is very rapidly establishing the image of the Royal Army, and most importantly the King himself, as barbarians of corruption and thievery.\n\nShould this continue on as it has, once we conclude our pacification of the Frontier we will re-inherit a ravaged land, full of people who carry little more than hate for us in their hearts in the absence of their farmland and precious possessions. Problematically so, Amanullah's military advisors caution that if we forbid such acts as terrorism and treason, many of our soldiers may desert their posts, with some choosing to join the rebels if they choose to offer a better deal."
 afghanistan_pashtunistan_events.24.a: "Forbid this chicanery, are they not devastating what are rightfully our own villages!?"
 afghanistan_pashtunistan_events.24.b: "We can't risk shaking the loyalty of the army at a time like this..."

 afghanistan_pashtunistan_events.25.t: "Desertions, Disruptions, and Traitors!"
 afghanistan_pashtunistan_events.25.d: "It would seem that our attempts to inculcate the humane treatment of the Frontier villages has come at the cost of the loyalty of our more morally bankrupt soldiers.\n\nWhile many have simply decided to desert their posts and return home without the prospect of acquiring their ill-gotten gains, some have reportedly taken lucrative offers promulgated by enemy tribal militias to join their ranks with the promise of wealth and opportunities to loot with them instead."
 afghanistan_pashtunistan_events.25.a: "We don't want those vagabonds and we don't need them either!"

 afghanistan_pashtunistan_events.26.t: "The Devastation of Pashtunistan"
 afghanistan_pashtunistan_events.26.d: "Now that the rebellion is finally over and the last pockets of resistance are soon to be stomped out, it has become readily apparent the scale of the destruction that our troops have wrought upon the people of the Frontier. Farms lay devastated, burnt, and trampled, merchants deprived of their earned wealth and utterly bankrupt, villages are devastated and their inhabitants are now absolutely terrified of our army. Many who have been forced to the depths of poverty now turn to banditry, if only to provide and make up for what their tribes and families lost, contributing to and perpetuating a sense of criminal anarchy along the roads connecting the villages and even within many settlements themselves.\n\nThis indeed is the legacy and image of our pacification campaign. The cost of reconstruction notwithstanding, to reintegrate them into the Afghan realm will be more difficult than previously imagined. Oaths of vengeance sworn against our soldiers by tribesmen who were deprived of their loved ones and pride will follow them, even as many return home far away from the sites of their misgivings."
 afghanistan_pashtunistan_events.26.a: "Nobody ever told them that war was gonna be fair..."

 afghanistan_pashtunistan_events.27.t: "Formation of the Frontier Defence Force"
 afghanistan_pashtunistan_events.27.d: "With an agreement now reached and things beginning to calm on the Frontier, the government in [442.GetVictoryPointName_12717] has begun to use its new official responsibilities to reorganise local militias into a proper regional army, with the goal of protecting Pashtunistan in the event of any foreign conflict. Rather controversially the army is set to be led by Abdur Rahim Popalzai, the so called \"Marxist Maulana\", a local leader of socialist militants who is said to be linked to revolutionaries in Calcutta.\n\nDespite the expectation that such links would be immediately disqualifying, Popalzai has apparently been chosen in large part due to them, with AIA deputy Mian Akbar Shah pushing heavily for him. The man, as reports have stated, is apparently very popular with the everyday Pashtun due to his advocacy for the nation's poorest, with the militiamen under his command mostly comprised of streetsweepers and other lowly men who show fervent loyalty to Popalzai in return.\n\nReports have also made clear that the current line from his allies in Calcutta is to fervently support Bacha Khan's government, and therefore by extension the King's as well, believing it to be the most amenable to continued stability in the region. Although they certainly have ulterior motives, as long as this Maulana does the job well, there'll almost certainly be an opportunity to get rid of him for a more tolerable leader down the line if he begins to cause trouble."
 afghanistan_pashtunistan_events.27.a: "As long as they stay loyal and useful..."

 afghanistan_pashtunistan_events.28.t: "Rebellious Tribes Disrupt Our Backline!"
 afghanistan_pashtunistan_events.28.d: "We have been hit by a devastating betrayal! The Mangal Tribe, located around Khost which is very close to our frontline with the Army of Pathanistan has risen up and attacked our troops from behind!\n\nThough they were dispersed and several units have been sent to pacify their territory, serious damage was done to our supply lines and we have been forced to divide our forces between the Mangal portion of the Loya Paktia region and our subjugation efforts in Peshawar."
 afghanistan_pashtunistan_events.28.a: "How DARE they!? Bring the hammer down on them all!"

 afghanistan_pashtunistan_events.50.t: "Pathanistan Proposes Unification"
 afghanistan_pashtunistan_events.50.d: "In the chaos of the first stage of the Indian Civil War the perfidious Afghans used the war as an opportunity to declare one of their own, marching troops in alongside local rebels to seize control of most of the North-West Frontier Province and the local princely states. They claimed that this was done to unite their people, yet while we were busy putting our own nation back together their supposed unified one collapsed into its own civil war.\n\nThe Frontier, now calling itself Pathanistan, ended up fighting for independence after Afghan tyranny, despite few in the fledging state wishing for this outcome. With Afghan reunification seen as untenable, they have instead reached out to our government and have requested reunification with India instead. In exchange for peacefully submitting to our rule, they simply request that their existing government be allowed a continued level of autonomy, hoping to maintain the status quo they previously enjoyed for many years."
 afghanistan_pashtunistan_events.50.a: "We agree to their demands, let them rejoin us."
 afghanistan_pashtunistan_events.50.b: "We reject their demands for autonomy, bring them back by force!"

 afghanistan_pashtunistan_events.100.t: "Revolt in the Afghan Frontier"
 afghanistan_pashtunistan_events.100.d: "Since its conquest of the formerly British North-West Frontier Province over a decade ago, Afghanistan's grip over the region has been said to be lacklustre at best, with the Frontier being almost entirely self-governing. Until recent months however, few in the Frontier appear to have opposed this status quo, and common sentiment appeared to be in favour of Afghan unity.\n\nA massacre carried out by Afghan troops following growing disputes between [AFG.Capital.GetCapitalVictoryPointName] and [442.Controller.GetVictoryPointName_12717] has rapidly changed public sentiment towards the Afghan state. Militant supporters of the regional government, led by Indian backed revolutionaries, have responded to the massacre by rising up against [AFG.Capital.GetCapitalVictoryPointName], and have proclaimed the independence of \"Pathanistan\" from it."
 afghanistan_pashtunistan_events.100.a: "Serves the buggers right."
 afghanistan_pashtunistan_events.100.b: "Stability has never been Afghanistan's greatest trait has it?"

 afghanistan_civil_war_events.1.t: "Amanullah Declares Plans for a European Tour"
 afghanistan_civil_war_events.1.d: "In a private meeting, Amanullah gathered his advisors and family members and announced to them that he planned on going on a whistle stop tour across Continental Europe, a months long endeavour to meet with monarchs and statesmen. While this plan did resemble a lavish vacation, in truth the purpose of the tour was deeply important to the King's initiatives: Afghanistan's modernisation was well underway, and it was time for the King to show the world the progress he was making with his domain. Starting in Berlin, Amanullah would present himself as a twentieth-century monarch, a modern ruler for a modern nation, deserving of a status equal to European nobility.\n\nTo those present, the rest of the announcement perhaps revealed a secondary motive to the tour, with Amanullah declaring that the Crown Prince would serve as regent in his absence. Although still young, Rahmatullah will hopefully one day succeed his father, and as such spending a few weeks as regent may help prepare him for the realities ahead. Although some present expressed concern, the further declaration that the cabinet would also be allowed to overstep their positions as needed to aid the prince was enough to smooth things over."
 afghanistan_civil_war_events.1.a: "I'm sure things will be fine."

 afghanistan_civil_war_events.2.t: "King Finalises Plans with Advisors"
 afghanistan_civil_war_events.2.d: "After a considerable amount of time planning stops and reassuring advisors, King Amanullah's tour was ready. The news made its way through papers, villagers abuzz with gossip, even climbing the mountains into the ears of isolated tribes: A Christmastime journey across Europe, a decade since their last!\n\nThe King is to begin the trip with a visit to [773.Controller.GetVictoryPointName_9833], before departing via a ship to [137.Controller.GetVictoryPointName_3686], where he will then take a train to the Ukrainian capital of [202.Controller.GetVictoryPointName_525] to meet [UKR.GetLeader]. Then onwards, to [10.Controller.GetVictoryPointName_3544] and [POL.GetLeader]. Amanullah will then head west, to [64.Controller.GetVictoryPointName_6521], where he will have an audience with the Kaiser, the high point of the tour. After a few weeks touring the German states, he plans to end his trip quickly passing through the major European capitals that are not plagued by war or syndicalism, before at last flying back home.\n\nThe travel plans are published as fliers to be distributed amongst the people, showcasing where their glorious King will share with the world his pride for the new Afghanistan."
 afghanistan_civil_war_events.2.a: "Don't forget to pack enough hats!"

 afghanistan_civil_war_events.3.t: "Amanullah Departs"
 afghanistan_civil_war_events.3.d: "In the early hours of the morning, accompanied by his family, a cohort of servants, and the eager press, King Amanullah of Afghanistan began his journey west for Europe. His tour was to begin at once, for the world cannot be made to wait any longer for the new Afghanistan and her modernising monarch.\n\nIn his stead, the King has left his son, Crown Prince Rahmatullah, as the regent of Afghanistan. This choice proved controversial, with arguments persisting up until the King's departure about Rahmatullah's leadership capabilities. The King was more than reassuring of his son's potential to rule, presenting the regency as an opportunity for the Crown Prince to obtain experience in governance prior to his ascendance to the throne.\n\nNevertheless, advisors worried that such an inexperienced regent would be the perfect opportunity for forces outside of [267.Controller.GetVictoryPointName_12769] to take advantage of and undo Amanullah's hard work. Many in fact have attempted to push for the King's brother, Inayatullah Khan, to rule as regent instead, although he has personally denied their requests.\n\nRegardless, the die had been cast and Afghanistan has Rahmatullah to lead them while the King was away representing the Afghan people in Europe. Hopefully, Rahmatullah will have calm skies ahead, and the King will not need to prematurely return."
 afghanistan_civil_war_events.3.a: "The Crown Prince will safeguard the realm."

 afghanistan_civil_war_events.4.t: "Unrest in the North"
 afghanistan_civil_war_events.4.d: "The King has only been gone for a few days, and already the Crown Prince's authority is being tested. Reports are coming from [1118.Controller.GetVictoryPointName_12314] of bandits moving about in the hills and mountains and attacking passers-by. Normally, this means very little: banditry is commonplace in the more rural parts of the country. The problem with these raids is that they seem much more coordinated around the schedules of our military patrols. The bandits are making concentrated efforts in stealing equipment and cutting off the logistics of our northern garrisons.\n\nThe most troubling news comes from a returning patrol, stating that these were no ordinary bandits: they carried stolen Russian equipment. This report coincides with sightings of campfires near our border with Central Asia. There can be no mistake: someone is planning something big."
 afghanistan_civil_war_events.4.a: "Vermin always acts brave when you have your back turned."

 afghanistan_civil_war_events.5.t: "A Warm Welcome in [64.Controller.GetVictoryPointName_6521]"
 afghanistan_civil_war_events.5.d: "Wonderful news from Europe: the King has arrived in [64.Controller.GetVictoryPointName_6521] to an incredibly warm welcome. The King was greeted at the train station by a mixture of curious ongoers, minor nobility, and the ever-eager press, wanting to capture the arrival of the foreign king from the East. King Amanullah made his way to the Royal Palace of [64.Controller.GetVictoryPointName_6521], where he was formally reintroduced to Kaiser Willhelm II, and his Reichskanzler. The men were reported to be in good spirits when in each other's company, especially as King Amanullah is a notable Germanophile. Discussions on art, modernity, and cultural practices were earnestly recorded by reporters, complimenting the visit with an endless stream of photos.\n\nAfter meeting with the Kaiser, King Amanullah was escorted around [64.Controller.GetVictoryPointName_6521] on a tour of the vast city. Amanullah was very impressed with the city, remarking how much of the inspiration for [267.Controller.GetVictoryPointName_12769] came directly from [64.Controller.GetVictoryPointName_6521]. The King was particularly a fan of many of the newer buildings on display, taking particular interest in the Pergamon Museum and the White City, stating how different they were from the more Neoclassical buildings of his capital. After a day of building tours, meetings with statesmen and a delicious meal, the King retired to his hotel room, ready to continue his tour the next day."
 afghanistan_civil_war_events.5.a: "Those new buildings give wonderous inspiration for Herat..."

 afghanistan_civil_war_events.6.t: "Bandits Muster in the North"
 afghanistan_civil_war_events.6.d: "Reports from near the border confirm our worries have come true: the bandits are much more organised than initially thought, and they have begun a mobilisation effort towards the heartlands of Afghanistan. Many more are coming in to support this new army, either from local Tajik tribes and villages, or from the Turkic peoples on the other side of the border. Judging from the new recruits and local religious developments, this bandit army is likely made up of religious fanatics.\n\nWhat's more concerning is the uncertainty of the information coming in about this army: numbers range from a couple thousand to tens of thousands, with the reports differing wildly in detail, and growing increasingly rare. The last report we received seemed to have been penned in a hurry: it says that the patrols had been made by the bandits, and a small force had been dispatched towards their direction. This was included with a description of the bandits' banner: red, black and white, the Saqqawist standard. There was even talk that at the head of this new army was Purdil Khan, the uncle and successor of the late Saqqawist emir, Habibullah Kalakani. Regardless, it has been confirmed: they are coming."
 afghanistan_civil_war_events.6.a: "This is starting to get serious."

 afghanistan_civil_war_events.7.t: "[1118.Controller.GetVictoryPointName_12314] Taken by Saqqawists"
 afghanistan_civil_war_events.7.d: "It has been several days since we have heard from our northern border. After frantic requests for status, followed by silent prayers, we finally have an update to our bandit problem.\n\n[1118.Controller.GetVictoryPointName_12314] has fallen.\n\nSupposedly, the bandits marched directly towards the city, supported by stolen Russian artillery pieces. The city garrison tried to fight back, but the shelling and the lack of moral resulted in the city's quick capitulation. Even more humiliating is the number of deserters and turncoats from our army units: it seems that not a single soldier in [1118.Controller.GetVictoryPointName_12314] has a backbone.\n\nUpon hearing the news, the Crown Prince gave the order to mobilise the army, deciding to personally lead his troops to victory. This decision was immediately opposed by his advisors, recommending that Nadir be recalled from [415.Controller.GetVictoryPointName_4893] to lead the army instead. Wanting to prove his leadership, the Crown Prince refused, and has set out to meet the Saqqawists and end them once and for all."
 afghanistan_civil_war_events.7.a: "The Warrior Prince shall save the nation!"

 afghanistan_civil_war_events.8.t: "Disaster in Baghlan"
 afghanistan_civil_war_events.8.d: "A report from our forces near Baghlan: the Crown Prince is dead.\n\nReports claimed that the Saqqawist forces were located in Baghlan, and were immeasurably outnumbered and disorganised compared to the Crown Prince's army. The highly confident Crown Prince set motion his plans: they were to smash apart the small bandit army and rout them all the way to the border to be slaughtered, and bring home the tattered Saqqawist banner in time for a celebration. It would be easy. The Royal Army quickly made their way to Baghlan, where they encountered a small force of Saqqawists, who were promptly approached in an offensive. They were easily overwhelmed, and quickly retreated away from Baghlan, pursued by our determined but exhausted soldiers, directly led by the Crown Prince.\n\nThe reports received were immediately proved false when the Crown Prince and his army ran right into the rest of Purdil Khan's forces, surrounding the Royal Army. The exhausted and demoralised Afghan soldiers were quickly beset upon by the Saqqawists, many being captured, running away, or being slaughtered. As for the Crown Prince, he was immediately blown to bits by an artillery shell before he was able to give any orders. At this point, the Saqqawists are on their way to [267.Controller.GetVictoryPointName_12769], surely to burn the city to the ground."
 afghanistan_civil_war_events.8.a: "Someone save us from these savages!"

 afghanistan_civil_war_events.9.t: "The Sack of [267.Controller.GetVictoryPointName_12769]"
 afghanistan_civil_war_events.9.d: "The more religious parts of Afghan society had always loathed [267.Controller.GetVictoryPointName_12769]: It represented Western degeneracy and disgusting excess, a monument to sin itself, and was begging to be wiped off the map. For the Saqqawists, this was their opportunity to do so, as their offensive took them right to the capital. The earlier attempt to stop the rebels drained [267.Controller.GetVictoryPointName_12769]'s local garrisons, leaving the city practically unguarded. What little resistance the Saqqawists did encounter was easily defeated, and before long, the city was theirs.\n\nWhat the Saqqawists did next could only be described as apocalyptic, the complete desolation of [267.Controller.GetVictoryPointName_12769] at their fanatic hands. After capturing the city, the rebels began a campaign of looting and rampage, stealing valuables and demolishing buildings. Revenue offices, the National Museum, even the Royal Palace itself: precious items that could be ransomed or auctioned were ripped from their rightful place. If it couldn't be stolen, it was destroyed, brought down with ropes and blasted with artillery, a show of righteous force against the sickening vanity of the King.\n\nThe people of [267.Controller.GetVictoryPointName_12769] quickly found themselves at the mercy of a violent band of barbarians, subject to enslavement and gruesome end. The rebels paid considerable attention to slaughtering any foreigners they could find: after all, it was the foreigners that plunged Afghanistan into ruin in the first place. One such unlucky soul was the Chief Architect of [267.Controller.GetVictoryPointName_12769], Albert Speer, who was found crushed underneath the ruins of the National Assembly after the rebel forces used the building for target practice.\n\nBy the time they had marched on, not a single square foot of [267.Controller.GetVictoryPointName_12769] was left untouched by the fanatics. Amidst the smouldering ruins of the once proud capital city flew the Saqqawist banner of red, black, and white, a symbol of what was to come for any who dared to stand against the righteous forces of Purdil Khan, and any who sought to defile Afghanistan with modern decadence."
 afghanistan_civil_war_events.9.a: "Years of effort, burnt away in one night..."

 afghanistan_civil_war_events.10.t: "Nadir Reorganises in the West"
 afghanistan_civil_war_events.10.d: "After the death of the Crown Prince and the destruction of the capital, the future of King Amanullah's Afghanistan was uncertain. Who knew what the next moves of Purdil Khan would be? Morale was at an all time low. Now, we have been given good news: Nadir is planning a counterattack.\n\nMarshal Mohammad Nadir Khan was spared the carnage of [267.Controller.GetVictoryPointName_12769], having been sent to [415.Controller.GetVictoryPointName_4893] on official Army business. Now, with the chain of command falling to him, he has begun to mobilise forces to meet the Saqqawists. Nadir is a much more thoughtful tactician, and will likely wait for confirmation of reports before making any decisions. For now, he is calling for conscripted men, recruiting tribal forces, and drilling the garrison at [415.Controller.GetVictoryPointName_4893] to prepare for an attack."
 afghanistan_civil_war_events.10.a: "Nadir is our last hope."

 afghanistan_civil_war_events.11.t: "News Reaches Amanullah"
 afghanistan_civil_war_events.11.d: "Thanks to the distance between Europe and Afghanistan, King Amanullah has been blissfully unaware of the catastrophe back home, until now. A telegram made its way to the King's hotel room in Frankfurt, informing the King of the situation.\n\nHotel staff reported the sounds of smashing furniture and wailing coming from the room, followed by the King and his entourage checking out the same day. What was left behind was a suite that was utterly destroyed, seemingly in a fit of rage. The King is on his way back to Afghanistan, determined to prevent his country from spiralling further into chaos."
 afghanistan_civil_war_events.11.a: "They did what to my city? And to my son?!"

 afghanistan_civil_war_events.12.t: "The March to [267.Controller.GetVictoryPointName_10737]"
 afghanistan_civil_war_events.12.d: "Nadir has completed preparations for his army, and has set off to [267.Controller.GetVictoryPointName_10737], in a gamble to turn the tides against the Saqqawists. The urgency of this battle is understood by all. Reports from across the countryside have been out of a nightmare: Saqqawists burning fields, sacking villages, and destroying newly constructed roads, train stations and factories. It is clear that Purdil Khan's fate for Afghanistan will be a return to a state of living centuries old, where his bandits are the only source of power in the country.\n\nNadir is totally aware of what needs to be done to save the country. The only fate these marauders deserve is at the end of a bayonet, and every soldier knows this. Our forces also have begun developing a sense of pride, eager to stand by Nadir and save the country. They understand the truth: only Mohammad Nadir Khan can save the country from certain doom. Let us pray that they make it in time."
 afghanistan_civil_war_events.12.a: "The occupying scum will be given no quarter."

 afghanistan_civil_war_events.13.t: "The Nation Reclaimed"
 afghanistan_civil_war_events.13.d: "Victory! With the Saqqawists dead or routed, [267.Controller.GetVictoryPointName_10737] has been secured, and the bandit occupation has at last ended.\n\nNadir and his forces arrived at the city to find that the Saqqawists had taken up defensive positions, but were prepared for a much smaller attacking force. Nadir ordered an artillery barrage on the city, leading to immense casualties for the defenders. The Saqqawists, far too accustomed to guerilla attacks to defend the city properly, quickly abandoned their defences. The city was open. The resulting conflict was a bloodbath for Purdil Khan and his bandits. Many found themselves overwhelmed by the better trained and equipped forces of Nadir, and were gunned down attempting to flee. Purdil Khan himself tried to escape in a Rolls Royce that was part of the King's car collection, only to be riddled with bullet holes by a machine gun.\n\nThough the city is secure, there is still much work to be done. Several towns and cities, including [1118.Controller.GetVictoryPointName_12314], are still under Saqqawist control. However, with Purdil Khan's death and the shattering of his main force, we can expect little resistance from these bandits, and can safely say this conflict will be over in a matter of days."
 afghanistan_civil_war_events.13.a: "I want their \"Emir's\" head on a pike by morning."

 afghanistan_civil_war_events.14.t: "Nadir Takes the Crown"
 afghanistan_civil_war_events.14.d: "A power void has formed in Afghanistan. The King's absence and the death of his son has left the throne of the nation absent: no one leads the nation, now that the Saqqawists have been defeated.\n\nNo one, officially, that is.\n\nTo many within the nation, it is clear that the leader they need has been here all along. A man who stood against the fanatics, when the King was dining luxuriously in Europe. A man who has the strategic mind and experience to lead the military, unlike the headstrong Crown Prince. A man whose family was once exiled from Afghanistan for fear of their claim to the throne. Mohammad Nadir Khan must lead the nation as its King.\n\nNadir himself was unconvinced. How could he betray Amanullah after defeating his enemies? Besides, he had no experience ruling a country. Luckily, Fazl Omar Mojadidi, in his wisdom, put forth several points: it was Nadir who saved and protected the nation, not Amanullah. In fact, Amanullah's reckless modernisation was what prompted the rebels in the first place. Afghanistan needed a sensible ruler to guide the nation without eschewing stability. Convinced by Mojadidi's reasoning, Nadir was promptly crowned as king of Afghanistan, and set out to prepare his forces for yet another civil war."
 afghanistan_civil_war_events.14.a: "Amanullah won't be happy to hear this..."

 afghanistan_civil_war_events.15.t: "A Carriage of Curses"
 afghanistan_civil_war_events.15.d: "The train ride back to Afghanistan was already tense, thanks to King Amanullah's disposition. Losing the nation and his son had taken a toll on the King, and he was found to be more irritable than ever, desperate to be home as soon as possible. Unfortunately for him, a telegraph was delivered to his carriage. News from home: his Minister of War, Mohammad Nadir Khan, had taken it upon himself to be crowned as King in Amanullah's absence.\n\nThe King's outburst could be heard from the adjacent train carriages, and it was not a pleasant ordeal. The smashing of fine china, furious stomping, and the raving of an indignant madman made its way across the train. Amanullah's rage was indecipherable to the average ear, as not many on the train could speak Persian. For the King's entourage, his words were clear: a cacophony of profane words, strings of vicious insults mounted upon the name of Nadir, and threats of death and suffering in the most barbaric of ways.\n\nTo say Amanullah took the news poorly would be an understatement."
 afghanistan_civil_war_events.15.a: "I doubt this will end with calm discussion."

 afghanistan_civil_war_events.16.t: "The Afghan Civil War"
 afghanistan_civil_war_events.16.d: "After an exhausting journey from Europe, King Amanullah has finally arrived in his homeland, although one in which many now refuse to recognise that title in. Nadir was far too popular for his own good, a characteristic Amanullah mistakenly overlooked in hindsight. However, not all was lost: many within the nation see his vision of a modern Afghanistan, with others outraged at the audacity of Nadir to shirk the authority of the Royal Family, meaning Amanullah has plenty of support to take back his throne.\n\nWith neither man seemingly willing to stand down the nation is stuck at a crossroad: shall the nation move forward into the twentieth century with Amanullah, or will it rest its laurels on the popular and competent Mohammad Nadir Khan? Regardless of who sits upon the throne, one thing is certain: more blood must be spilled, before Afghanistan can truly be at peace."
 afghanistan_civil_war_events.16.a: "Amanullah is the true king."
 afghanistan_civil_war_events.16.b: "Nadir is the only man who can save Afghanistan."

 afghanistan_civil_war_events.20.t: "Intervention in the Afghan Civil War"
 afghanistan_civil_war_events.20.d.amanullah: "Of all the places in the world we expected to hear from, Afghanistan was the last. Tucked away in the mountains of South Asia, the little nation has recently been a subject of our investments. Thanks to the modernisation efforts of the King, our companies have expanded into a new market, with growing demands for more modern goods. However, as nice as it is to benefit from new opportunities, Afghanistan has its drawbacks: civil unrest, religious fanaticism, and a geography far too ripe for long term insurgencies. Such drawbacks have finally borne fruit: the Kingdom finds itself in the midst of a civil war.\n\nThe message in question comes from King Amanullah who, while touring Europe, was whisked away by this war. He says that in his absence forces opposing his westernisation efforts have installed a rival on the throne, and he'd appreciate any help he receives. Rather than simply expecting us to help out of the goodness of our hearts, Amanullah's message mentions how his efforts to modernise Afghanistan have resulted in us receiving high valued investment opportunities, and that support would mean even more benefits and privileges within the Afghan economy.\n\nHis continued rule of Afghanistan is likely to be to our benefit, with more room for profit that would help our domestic economy, particularly after the last few turbulent years. Having the nation's king in our pocket is also bound to be useful, and may perhaps see Afghanistan fully drawn into our sphere of influence. At the same time however, world tensions are on the rise, and perhaps the resources we'd gamble away giving them to the Afghans would be better served elsewhere."
 afghanistan_civil_war_events.20.d.nadir: "Of all the places in the world we expected to hear from, Afghanistan was the last. Tucked away in the mountains of South Asia, the little nation has recently been a subject of our investments. Thanks to the modernisation efforts of the King, our companies have expanded into a new market, with growing demands for more modern goods. However, as nice as it is to benefit from new opportunities, Afghanistan has its drawbacks: civil unrest, religious fanaticism, and a geography far too ripe for long term insurgencies. Such drawbacks have finally borne fruit: the Kingdom finds itself in the midst of a civil war.\n\nInterestingly, the message from Afghanistan comes not from the nation's widely recognised king, but instead Mohammad Nadir Khan, who our files currently record as simply the Minister of War. Mohammad Nadir, now taking the surname Shah, claims to have been crowned by the people while Amanullah Khan was away in Europe, following Nadir's recapture of the capital from rebel forces. With Amanullah back in Afghanistan and waging war to reclaim his throne, Nadir has humbly requested our support against him, a request interwoven with obvious undertones of expected quid pro quo.\n\nFor the past few years, [?AFG.AFG_amanullah_backer.GetNameDef] has had the previous king's ear, and Nadir winning this war will if nothing else deprive them of a potential ally, and perhaps gain us control of Afghanistan instead. At the same time however, world tensions are on the rise, and perhaps the resources we'd gamble away giving them to the Afghans would be better served elsewhere."
 afghanistan_civil_war_events.20.a: "Send them military aid."
 afghanistan_civil_war_events.20.b: "Spare some financial support."
 afghanistan_civil_war_events.20.c: "Who cares about Afghanistan?"

 afghanistan_civil_war_events.21.t: "[FROM.GetNameDefCap] Sends us Support"
 afghanistan_civil_war_events.21.d: "Great news! Our friends in [FROM.GetNameDef] have convinced their government to send aid to our efforts in the civil war.\n\nWhile this may mean them cashing in a favour down the line, for now we can rest easy knowing we have extra resources to fight our enemies."
 afghanistan_civil_war_events.21.a: "We won't forget this."

 afghanistan_civil_war_events.22.t: "[FROM.GetNameDefCap] Refuses to Aid Us"
 afghanistan_civil_war_events.22.d: "We just received a letter from [FROM.GetNameDef]: while they personally support our cause, geopolitical factors prevent them from sending actual resources.\n\nIt is likely that [FROM.GetNameDef] has determined this conflict to be inconsequential to them, despite their business interests in our country. A shame."
 afghanistan_civil_war_events.22.a: "Damn them, we can do this without their help!"

 afghanistan_civil_war_events.24.t: "[FROM.GetNameDefCap] Supports Our Enemy"
 afghanistan_civil_war_events.24.d: "We have received intel that [FROM.GetNameDef] has chosen to aid our rivals in this conflict, clearly hoping to secure an ally in the event that they win.\n\nIt is obvious they think our opponents will be much more susceptible to their economic strength than we are. We will not forget this insult against us."
 afghanistan_civil_war_events.24.a: "We certainly won't forget this..."

 afghanistan_civil_war_events.25.t: "The Afghans Request Further Aid"
 afghanistan_civil_war_events.25.d: "A new missive has been received from Afghanistan, with our loyal allies requesting even more aid, declaring a little bit more help is all they need to at last quash their enemies.\n\nAlthough Afghanistan is quickly becoming quite a bottomless pit, it may be prudent to still hear out their request, in hopes that their claims of being near victory actually hold some weight."
 afghanistan_civil_war_events.25.a: "We can spare a little more military aid."
 afghanistan_civil_war_events.25.b: "Send some more financial aid."
 afghanistan_civil_war_events.25.c: "Do they think we're just made of money?"

 afghanistan_civil_war_events.26.t: "[FROM.GetNameDefCap] Sends Further Support"
 afghanistan_civil_war_events.26.d: "It seems that luck is on our side, as [FROM.GetNameDef] has agreed to our request for further assistance.\n\nWhile these concessions may return to haunt us in the future, we cannot worry about that while this war continues. For now, we are grateful for their help."
 afghanistan_civil_war_events.26.a: "Just a little more and we'll win this war."

 afghanistan_civil_war_events.27.t: "[FROM.GetNameDefCap] Refuses to Send Further Support"
 afghanistan_civil_war_events.27.d: "It seems that [FROM.GetNameDef]'s generosity has its limits, as they have rejected our request for further resources.\n\nWhile this is certainly a disappointing development, we shall see what we can do with what we already have, though this puts us in a more difficult position in the war."
 afghanistan_civil_war_events.27.a: "They can't just spare a little more?"

 afghanistan_civil_war_events.30.t: "[afghanistan_civil_war_events_30_title]"
 afghanistan_civil_war_events.30.t.bost: "The Battle for Bost"
 afghanistan_civil_war_events.30.t.kajran: "Nadir's Forces Attack in Kajran"
 afghanistan_civil_war_events.30.t.gizab: "Skirmishes in Gizab"
 afghanistan_civil_war_events.30.t.chisht: "Contesting Chisht"
 afghanistan_civil_war_events.30.t.maiwand: "The Road to [1117.Controller.GetVictoryPointName_5064]"
 afghanistan_civil_war_events.30.t.sharak: "The Crossroads of Sharak"
 afghanistan_civil_war_events.30.t.khost: "The Siege of Khost"
 afghanistan_civil_war_events.30.d.bost: "The City of Bost has seen exceptionally brutal fighting over the last week, as both our forces and Nadir's are hungry and desperate to establish full control over the three thousand year old fortress and the Ghaznavid-era Lashkari Bazar. We have successfully managed to thunder Nadir with an entourage of heavy artillery, but this has come at the cost of a dire munition shortage that has not gone unnoticed by our battered adversaries.\n\nAs the supply line struggles to deliver more shells, Nadir's troops have reinforced and are capitalising on our lack of heavy cover fire by aggressively pushing our lines. Half of Bost has now fallen to Nadir's forces, but so long as we can hold out, our artillery should very well be capable of devastating these units for good."
 afghanistan_civil_war_events.30.d.kajran: "Though Kajran itself is held by Nadir, we've secured a highly advantageous position in the region by capturing several villages and outposts surrounding the settlement. As we prepare to storm Kajran and eliminate Nadir's presence here once and for all, a counterattack has caught us by surprise and our forward outposts were overrun embarrassingly swiftly.\n\nThankfully, our other positions have caught wind of the counterattack and are now preparing to meet the enemy on the battlefield, but the losses we've sustained cast a long shadow over this endeavour."
 afghanistan_civil_war_events.30.d.gizab: "In the valleys around Gizab in Central Afghanistan, warfare has perpetuated itself between troops of both sides. One of many key positions in the effort to secure the heart of the Kingdom, we have exchanged several losses and victories alike with Nadir's forces. This has been great for preventing Nadir from properly entrenching, but not optimal as it simultaneously means we are barely able to maintain our footing in the region as well. The mountains and passes provide for ample retreats and devastating artillery positions, and unfortunately Nadir has made much more lucrative use than us.\n\nIf we commit more troops to the area, we may stand a chance at finally capturing the region, elsewise our local commanders feel that we're just throwing lives away to become fertilizer for the soil and some recommend giving the area up in favour of more hopeful gains."
 afghanistan_civil_war_events.30.d.chisht: "Along the northern bank of the Hari River, east of [415.Controller.GetVictoryPointName_4893], lies the town of Chisht. As part of our campaign to achieve full superiority in Western Afghanistan, we are aggressively contesting Nadir's control over the area.\n\nArtillery fire has damaged one of the historic Gumbads of the Ghurid Dynasty, and several caravans previously going in and out of the city have been hurriedly abandoned, providing ample yet flimsy cover for our men. Nadirite resilience tests our resolve, but should we break his back before he breaks ours, the conquest of Chisht will be a major victory for our war effort!"
 afghanistan_civil_war_events.30.d.maiwand: "\"History does not repeat, but it does rhyme\". Such a saying rings true today, because just as Mohammad Ayub Khan came to blows with the British at Maiwand in 1880 during his campaign to retake [1117.Controller.GetVictoryPointName_5064], Nadir follows in his footsteps in pursuit of the same mission.\n\nDisregarding the fact that we'd be the dastardly British in this analogy, it is imperative that we do not capitulate our grip on the south, and so we have met the Nadirites at Maiwand. Facing numerical superiority, we are struggling to contest the city and sustaining serious losses. Nadir's forces do appear to be buckling, but locking horns in our state may still not guarantee our victory..."
 afghanistan_civil_war_events.30.d.sharak: "Located between two major road arteries, Sharak has witnessed almost constant skirmishing over the past week. Though we have had the upper hand in the area for some time, which has allowed us to pounce on any and all opportunities to rout Nadir's snakes out of Western-Central Afghanistan, a massive Nadirite contingent from the capital has taken us by surprise and forced a strategic retreat.\n\nWith our effective control over local highways severely diminished, a final assault on Sharak appears imminent. Though our forces have little time and little resources with which to lick their wounds, Sharak's relative infrastructural isolation and poor road connections might just salvage our defence."
 afghanistan_civil_war_events.30.d.khost: "In an effort to dislodge our control of the Khyber Pass, Nadir's forces have launched a massive siege on Khost! One of our most resilient strongholds, Nadir's traitorous generals have compensated with numbers and firepower, brutally shelling the interior of the city and dealing heavy damage to civilian housing.\n\nAs a calamitous sense of panic swells in the hearts of Khost's Loyalist subjects, we are hard-pressed to put an end to the siege and sustain our control. If we can't rebuke their siege, it will surely come at quite a \"Khost\"..."
 afghanistan_civil_war_events.30.a: "Fight to the last."
 afghanistan_civil_war_events.30.b: "We must retreat for now."
 afghanistan_civil_war_events.30.c: "Send reinforcements to hold them back!"

 afghanistan_civil_war_events.31.t: "[415.Controller.GetVictoryPointName_4893] Falls to Amanullah's Forces"
 afghanistan_civil_war_events.31.d: "Despite holding to the last man, our forces in [415.Controller.GetVictoryPointName_4893] have been forced to surrender to Amanite forces. For days, artillery and mortar fire pounded the city and distressed our military organisation, weakening the garrison enough for the enemy to execute a pincer that captured the city with minimal losses for them, and devastating casualties for us.\n\nWith this loss, Amanullah has now asserted himself in Western Afghanistan and evicted us away from the border with [PER.GetNameDef]."
 afghanistan_civil_war_events.31.a: "This is just a temporary setback."

 afghanistan_civil_war_events.32.t: "[afghanistan_civil_war_events_32_title]"
 afghanistan_civil_war_events.32.t.waras: "Fighting Outside Waras"
 afghanistan_civil_war_events.32.t.ghazni: "Loyalists Attack in Ghazni"
 afghanistan_civil_war_events.32.t.basawul: "Battle for the Pass"
 afghanistan_civil_war_events.32.t.kajran: "Amanullah's Forces Attack in Kajran"
 afghanistan_civil_war_events.32.t.bamyan: "The Battle For Bamyan"
 afghanistan_civil_war_events.32.t.baghlan: "Skirmishes Around Baghlan"
 afghanistan_civil_war_events.32.t.zaranj: "Amanites Advance on Zaranj"
 afghanistan_civil_war_events.32.d.waras: "Violence has broken out near Waras on the road to [267.Controller.GetVictoryPointName_10737], threatening our supremacy in the region.\n\nThough the enemy battalions are almost disproportionately numerous compared to ours, ceding the road and by extension Waras would seriously impact our power projection and likely delay us from supplying a number of our garrisons, not to mention giving the enemy a path straight to the heart of [267.Controller.GetVictoryPointName_10737] would prove to be an existential risk for us."
 afghanistan_civil_war_events.32.d.ghazni: "It would appear the latest grisly scene to come of the civil war has commenced in Ghazni, as Loyalist Amanites have risen up and are attempting to assert complete control over the city! The former seat of the Ghaznavid Empire, retaining control is not only symbolically important but also crucial as it lies just south of [267.Controller.GetVictoryPointName_10737] and will surely enable Amanullah to greatly threaten our position there.\n\nUnfortunately, as urban warfare sporadically broke out across the city, we were forced to hole up in the Ghazni Citadel. Encircled and already suffering attrition, forces were sent to relieve them and dislodge Loyalist control over the city from the north, but the enemy has already entrenched and is giving us hell in return..."
 afghanistan_civil_war_events.32.d.basawul: "Amanite forces have struck the town of Basawul! A vital chokepoint near the Khyber Pass, Basawul is key to preventing Amanullah from asserting control in Eastern Afghanistan and connecting his forces with Pashtunistan.\n\nOur defence was rigorous, and we managed to inflict enough losses to force a retreat, but it would appear that they have obtained swift reinforcements. Indeed, the battle weakened us too, and it seems the enemy banks on our weakness being enough to break us..."
 afghanistan_civil_war_events.32.d.kajran: "Kajran, in Central Afghanistan, has been a strategic location crucial to sustaining Nadir's capability of holding [267.controller.GetVictoryPointName_10737] and Darulamann. Of course, Loyalist forces treasure the thought of taking it from our hands for that precise reason, and an army of them are marching toward the settlement.\n\nMany outposts were toppled, and though our men are prepared to repel the Amanite Loyalists to their dying breath, one wonders if they have enough men to resist the invasion."
 afghanistan_civil_war_events.32.d.bamyan: "Little else can be heard from the \"Valley of Gods\" aside from the percussion of gunpowder, thunder, and bodies falling limp upon the earth. Amanullah has launched a massive assault on the settlement of Bamyan in an effort to expand his grip in central Afghanistan. Our valiant forces have met them as they've come upon us, and the extent and scale of fighting has outmatched the expectations of both sides in the conflict.\n\nDespite efforts to avoid the site, an artillery shell struck the ground infront of the \"Buddhas of Bamyan\" and damaged the knee of the ancient Western Buddha, causing a major upset among the area's small Buddhist community. Before we destroy our great landmarks further, we must make every effort to end the fighting once and for all!"
 afghanistan_civil_war_events.32.d.baghlan: "The city of Baghlan in the north of Afghanistan has been a hotspot over the last week, with skirmishing only becoming more and more frequent. Amanite troops have taken to storming through the area's sugar beet fields to launch assaults on our outer city garrisons, and have even taken to halting and turning around any caravan attempting to enter or leave the city.\n\nReinforcements from around Qataghan have attempted to disrupt Amanullah's forces, but so far they've proven too quick and too fierce. The few carriers who've managed to slip in and out of Baghlan tell us that if Amanullah's forces aren't repelled soon, the city will capitulate and the garrison forced into a dangerous escape..."
 afghanistan_civil_war_events.32.d.zaranj: "Our southwestern flank has been threatened, as Amanite forces are launching an assault on the town of Zaranj next to the Iranian border! Marching up along the primary southern road, they launched a surprise attack on a makeshift outpost, preventing our scouts from quickly fleeing back to the main town to warn the garrison.\n\nNow, with ill time to prepare, our men are scrambling to prepare our mortar defenses, but it's unlikely they'll mount a defense for too long before their troops enter the town and all-out urban warfare commences..."
 afghanistan_civil_war_events.32.a: "Fight to the last."
 afghanistan_civil_war_events.32.b: "We must retreat for now."
 afghanistan_civil_war_events.32.c: "Send reinforcements to hold them back!"

 afghanistan_civil_war_events.35.t: "Pashtunistan Declares Its Neutrality"
 afghanistan_civil_war_events.35.d: "Though the rest of Afghanistan is embroiled in a chaos of side-picking and declarations of fealty, the autonomous region of Pashtunistan has decided to remain impartial. Local powerbrokers have come together to issue a proclamation to both sides, stating that they will only take arms to defend Pashtunistan and warning against any military incursion in the region.\n\nPeshawar has, consequentially, seen an influx of draft-dodgers who cower away from the battlefield. Though it would be better if they cast their dice with us (as they should), both us and our adversary are happy to leave them be in order to better concentrate our forces across a smaller chessboard."
 afghanistan_civil_war_events.35.a: "Better neutral than against us I suppose."

 afghanistan_civil_war_events.36.t: "Pashtunistan Declares For Amanullah"
 afghanistan_civil_war_events.36.d: "Local tribal leaders and princes in the Pashtunistan autonomous region have formally declared their fealty to Amanullah Khan, and have begun mobilising their forces toward Nadir's strongholds to give Amanite forces a boost to their efforts. The Faqir of Ipi himself could be seen riding out on horseback and personally leading his troops, while the princely state of Swat has begun to finance local mercenaries to assemble a fighting force capable of repelling Nadir's forces from Pashtunistan and cutting him off from the entire frontier."
 afghanistan_civil_war_events.36.a: "Just more bodies to the slaughter..."
 afghanistan_civil_war_events.36.b: "They recognise the true king!"

 afghanistan_civil_war_events.40.t: "The Amanite Restoration"
 afghanistan_civil_war_events.40.d: "After weeks of further and further gains by Amanite forces, Nadir and his men were finally driven back to [267.Controller.GetVictoryPointName_10737], cut off entirely from forces led by his many brothers across the rest of the nation. Despite attempts to save their brother from the siege, nothing could stop the Amanite soldiers, and after a few hours of fighting the city was retaken by Amanullah Khan. Nadir's fate was unknown at first, although after enough searching his body was identified amongst the fallen, an undignified end for a supposed king.\n\nAlthough Amanullah has defeated his rival and reclaimed the throne, he has yet to truly retake Afghanistan. Many still oppose his rule, and will never accept the king back unless he tosses Westernisation aside, and punishes those who clearly misled Amanullah into taking part in it. The King must now decide if appeasement of the nation's traditionalists is the best path to restoring power, or whether eliminating them entirely now that he has the upper hand is the better call."
 afghanistan_civil_war_events.40.a: "No one shall stop Amanullah's vision now!"
 afghanistan_civil_war_events.40.b: "It is clear that the reformers must go."

 afghanistan_civil_war_events.41.t: "Amanullah Driven From Afghanistan"
 afghanistan_civil_war_events.41.d: "It appears that the civil war will at last end the way it begun: With Amanullah Khan rapidly leaving Afghanistan. Suffering repeated defeats and quickly running out of steam, the former king has allegedly fled across the border, with many of his forces shattered by this news.\n\nThe last stand of his primary forces, in his temporary capital of [117.Controller.GetVictoryPointName_2017], has been completely crushed, with his brother-in-law Ali Ahmad Khan killed as he led the troops. Nadir stands now as the undisputed king, although it is too early for him to rest as his enemies still lurk in the shadows."
 afghanistan_civil_war_events.41.a: "The nation stands behind its new king."

 afghanistan_civil_war_events.45.t: "Unrest Continues to Stir"
 afghanistan_civil_war_events.45.d: "It appears that news of the death of the false king Nadir and the reclamation of the capital must have not yet begun to spread, or that Afghanistan is filled with the perpetually stupid. Rather than throw down their arms in recognition of the true king's might, rebel forces still continue to fester throughout the nation, both Saqqawist and Musahiban remnants alike.\n\nAlthough it is likely that they will be easily defeated by the Royal Army, perhaps Amanullah's rule may not yet be as secured as he believes..."
 afghanistan_civil_war_events.45.a: "They'll remember their place soon enough."

 afghanistan_civil_war_events.46.t: "The Anti-Amanullah Alliance"
 afghanistan_civil_war_events.46.d: "War makes for strange bedfellows, and there is only so far that the phase \"The enemy of my enemy is my friend\" can be applied before it begins to get absurd. Remnants of Nadir's army, led now by his brother Mohammad Hashim Khan, have agreed now to a formal alliance with what is left of the Saqqawist army, despite being enemies mere months ago. Joining this unholy alliance are many members of the Mojadidi family, including Fazl Omar Mojadidi himself, seemingly driven into their arms by the death warrant signed for him by King Amanullah.\n\nAlthough battered, the uniting of the rebel forces into one unified front against the King has certainly amplified the threat they pose, but they will simply be crushed just like the rest."
 afghanistan_civil_war_events.46.a: "We'll make sure they share a grave."

 afghanistan_civil_war_events.47.t: "Assembling the King's Party"
 afghanistan_civil_war_events.47.d: "Even with his enemies continuing to fester, the King has seen little reason to be deterred from continuing his grand ambitions now that he has returned to the throne. Despite returning to less than favourable circumstances compared to what he expected, Amanullah has seen fit to continue full steam ahead with his previously finalised plans for a national parliament. In preparation, he has finally also revived plans from just before the first Saqqawist rebellion to institute his own personal political party, who are expected to be the only legally recognised entity in the legislature.\n\nOperating under the name of the Ferqa-i-Esteqlal wa Tajaddod, the Party of Independence and Reform, the party has technically existed on paper for a decade now, but quickly forgotten about by most as the golden decade came to an end. Simply continuing where he left off, Amanullah has chosen Abdul Tawab Khan Tarzi, the King's brother-in-law who fought for him during the civil war, to serve as the party's leader. With his role as Prime Minister already effectively confirmed, Amanullah has simply elected to appoint him to the role early, replacing many of the duties previously carried out by Wardak, who is instead set to be appointed head of the Senate upon its inauguration."
 afghanistan_civil_war_events.47.a: "At last, the King is free to rule."

 afghanistan_civil_war_events.48.t: "Continued Fighting in Surobi"
 afghanistan_civil_war_events.48.d: "News from the town of Surobi to the east of [AFG.Capital.GetCapitalVictoryPointName] has been rather concerning, even amongst those still confident in the King's victory against the rebels. A recent battle outside the town, expected to be a simple slaughter for the Royal Army, quickly devolved into quite an equal bloodbath as a large number of local peasants rallied for the rebel cause.\n\nApparently motivated by continued opposition to the King's reforms, and viewing Hashim Khan as a more fair and legitimate King, these peasants are not alone, with similar incidents slowly becoming more and more common. Even in [AFG.Capital.GetCapitalVictoryPointName], the peasants have begun to whisper their displeasure against Amanullah, and their hopes that his restoration will be short lived."
 afghanistan_civil_war_events.48.a: "They'll give up soon enough..."

 afghanistan_civil_war_events.49.t: "Storming of the Palace"
 afghanistan_civil_war_events.49.d: "For the fourth time since Purdil Khan marched south, [267.Controller.GetVictoryPointName_10737] has fallen, yet for once not to an army, but to its own people. The continued attempts by Amanullah to enforce his unpopular reformist schemes upon them from a weaker and weaker position has finally proven to be his terminal undoing. What started as protests escalated into anger, and from there into full blown riots, lashing out at any symbols of the regime. The order for troops to fire upon the protestors, an order disobeyed by almost all of those it was given to, proved to be the last straw.\n\nRoyal guards stood by and watched as peasants descended upon [267.Controller.GetVictoryPointName_12769], where the King has been staying in spite of the significant damage inflicted upon it by the Saqqawists. As the angry mob rushed through the hallways, they came upon Amanullah Khan's failed escape attempt, quickly tearing the man limb from limb in a rather literal fashion according to some retellings.\n\nNews of Amanullah's lynching by his now former subjects spread quick and far, with both Fazl Omar Mojadidi and Hashim Khan arriving on the scene within hours. Supported both by the mob, and by the Sher Agha, Hashim Khan was proclaimed the nation's true king, heir to his brother's short lived legacy. Whether or not he actually will be King, or if a powerful man like Mojadidi will rule from behind the throne, is something only time can tell."
 afghanistan_civil_war_events.49.a: "Doom was always his destiny."

 afghanistan_civil_war_events.50.t: "A Meeting with Hazrat Nur al-Mashayikh"
 afghanistan_civil_war_events.50.d: "There was a time where not a day went by without the King wondering how better his reign would be if he simply had Fazl Omar Mojadidi executed and weathered the subsequent storm. Even now meeting the man face to face has simply reinforced these fantasies, however Amanullah has long recognised how important the man's sway is. Deferringly referring to him as his honorific name of Hazrat Nur al-Mashayikh, a title he only has thanks to Amanullah, the King directly requested Mojadidi's endorsement for his restored reign.\n\nOffering to begin rolling back the most unpopular of his reforms, and being willing to recognise the vital role of the ulema, Amanullah was finally able to convince the Sher Agha to back his rule. Both men are clearly under no illusion about how the other feels about them, yet they are forced to recognise that working together is simply the only path forward to the benefit of both parties. Mojadidi, fulfilling his side of the bargain, has called for remaining rebels to stand down and back the King, finally bringing the civil war to an end."
 afghanistan_civil_war_events.50.a: "No one has done more for the ulema than Amanullah!"

 afghanistan_civil_war_events.51.t: "Reformers Denounce the New Direction"
 afghanistan_civil_war_events.51.d: "To say that the news of the Mojadidi deal was not well received by Amanullah's former allies is certainly an understatement, especially after they began to learn what the King was willing to concede to achieve it. The countless reformers who once backed the King's rule can only regard his commitment to begin uprooting the progress they made as open and foul betrayal.\n\nMajor figures including Abdul Hadi Dawi and Ghulam Mohiuddin Arti have not minced their words in their condemnation of the King's actions, with hopes that he may finally see reason when not surrounded by yesmen."
 afghanistan_civil_war_events.51.a: "Who asked?"

 afghanistan_civil_war_events.52.t: "Wardak's Resignation"
 afghanistan_civil_war_events.52.d: "In order to truly convince the people of Amanullah's commitment to being a traditional king, it is blatantly obvious that the reformers must go, and an explanation for the King's previous reforms must be invented. Killing two birds with one stone, it has become simply government policy to blame any unpopular policies of the past decade on those around the King, who simply corrupted his divine and perfect vision into bastardised ideas that harmed the nation.\n\nWardak, who has become the face of Amanullah's reforms for many people, has not been blind to what that will mean for him. He has tendered his resignation as Interior Minister, believing his position to be no longer tenable. With rumours abound that things are to soon escalate into arresting and scapegoating reformers for previous government policy,  many expect Wardak to leave the country before any such purge against him can take place. In his stead as interior minister, general Habibullah Khan Abawi has been given the position, who is expected to simply carry out Amanullah's will without question."
 afghanistan_civil_war_events.52.a: "He has served his purpose."

 afghanistan_civil_war_events.53.t: "The Backrooms of [267.Controller.GetVictoryPointName_10737]"
 afghanistan_civil_war_events.53.d: "Rather than simply accepting their fate, rumours are abound that the nation's reformers are beginning to conspire against the King, hoping to save their own necks from being purged. Whispers in the capital talk about shadowy meetings in chillim bars in [267.Controller.GetVictoryPointName_10737], allegedly involving many of the King's former reformist allies that fear they are next on the chopping block. The figure most associated with these meetings however appears to be a relative outsider to the King's former circle, with that figure being the young Shahzada Rehmatullah Khan Durrani.\n\nDurrani, hailing originally from [445.Controller.GetVictoryPointName_5105], was driven from the city alongside his family during the Fourth Anglo-Afghan War, with his family reestablishing themselves in [267.Controller.GetVictoryPointName_10737]. Despite his youth, his position as head of his family combined with his outsider status has ironically granted him a large degree of political power and trust in the current climate. While Amanullah's former allies cannot be certain that another will not sell them out to the king, Durrani being outside the court's politics has soothed these fears.\n\nWhat is claimed about these meetings, gathered through a mixture of overheard conversations and loose lipped participants, is that a plot is brewing to assassinate Amanullah and bring about a constitutional monarchy under his brother Inayatullah. While few actually believe these rumours to be anything more than paranoia, Inayatullah being spotted coming out of one of these bars certainly has raised a few eyebrows."
 afghanistan_civil_war_events.53.a: "I'm sure it is little more than gossip."

 afghanistan_civil_war_events.54.t: "A Constitutional Conspiracy"
 afghanistan_civil_war_events.54.d: "Last night many throughout the palace were shocked to hear the sounds of gunshots echo throughout the halls. The guards, rushing to the scene, quickly found the King lying dead on the floor. Despite a search of the immediate area, there was no assassin in sight, nor a trail to follow to find one. The guards, one of whom who has coincidentally said to have \"inherited a large sum from a deceased family member\", may or may not have taken their time to arrive at the scene, and may have also overlooked a shadowy figure leaving in the distance.\n\nAwoken by soldiers, Inayatullah Khan was informed of his brother's death, and rushed to the palace as Amanullah's heir apparent. Although formal recognition of his succession will take time, the king to be quickly began fitting into his new role, ordering the army to immediately ensure order throughout the capital and the wider nation. It is expected that the new king will grant amnesty to those jailed by Amanullah, and attempt to restore the nation's faith in the crown, although only time will tell."
 afghanistan_civil_war_events.54.a: "Let us hope the truth stays buried, just like Amanullah..."

 afghanistan_civil_war_events.55.t: "The Family Business"
 afghanistan_civil_war_events.55.d: "At long last, the Dastard of [267.controller.GetVictoryPointName_12769] has been wrested far, far away from Afghanistan. Now that the King of the past is gone, it's time to look forward to the King of the future. Putting the pieces back together is set to be a severe undertaking, and one that Nadir will need plenty of support to accomplish. To this end, he has appointed his brothers to several cabinet positions as an \"interim\" measure.\n\nMohammad Hashim Khan shall fill the post of Prime Minister, with Fazl Omar Mojadidi serving as Justice Minister in an attempt to appease the conservatives and Ulema and assure their support. Lastly, to replace Nadir as the Chief of Army, Mohammad Gul Khan Momand shall fill the post. A man greatly respected by Nadir's family and considered to be their sixth brother, even if not by blood, the weight of his promotion exemplifies the trust we have in him to maintain order."
 afghanistan_civil_war_events.55.a: "One man cannot rule alone, and Nadir is fortunate not to have to."

 afghanistan_civil_war_events.56.t: "Amanite Holdouts in Ghorband"
 afghanistan_civil_war_events.56.d: "Though the coward fled back to Germany with his tail between his legs, not all Amanites have lost hope. A number of loyalists who can't seem to comprehend their idol is a goat-hearted candy-ass still operate out of Ghorband, which is roughly two hours north of [267.controller.GetVictoryPointName_10737] if you're especially quick.\n\nMembers of the army doing a routine patrol were ambushed, and although the Amanite ruffians were outnumbered and beaten back, the continued challenge to our authority and prolonged bloodshed does us no favours. Momand has arranged for a heightened military presence in the region and has directed the airforce to assist in these efforts to nip this problem in the bud as soon as possible."
 afghanistan_civil_war_events.56.a: "Ironic, a man so hated by the faithful still has his zealots."

 afghanistan_civil_war_events.57.t: "Debate Amongst the Brothers"
 afghanistan_civil_war_events.57.d: "Nadir's family is united in their unconditional support for him, but sometimes they are not so united in their opinions. With the advent of a new King entirely dissociated from the previous thronebearer comes the expectation of a new constitution. Foreign diplomats, Afghan citizens, and the urban intelligentsia all await the restoration of constitutional order with bated breath. The problem is that everybody has varying opinions on what we keep from the Amanite Constitution and what we choose to toss into the bonfire. Keenly eyeing us are the Mojadidis, who expect a wholehearted repeal of several of Amanullah's \"Syndicalist machinations\" including the abolition of Purdah and the increased rights granted to women in general. Of course, progress is progress. What message does it send to our foreign backers if we wipe years of Westernisation clean?\n\nHashim Khan is firmly in support of appeasing the conservatives as much as possible and turning the clock back on Amanullah's reforms. The opinions of European heretics don't matter if it means we're rejecting the religious and cultural reality of Afghanistan, especially if it pits the Mullahs against us! But on the other hand, Shah Mahmud Khan insists that taking the safe way out by throwing most of it away would be terrible for the nation. It's too late to change what's been done, and while we can get rid of some of Amanullah's most eccentric reforms, we must appraise everything by its individual merits even if the Mojadidis might loathe swallowing such a pill."
 afghanistan_civil_war_events.57.a: "Hashim is right, best not to rock the boat."
 afghanistan_civil_war_events.57.b: "It is too late to put the genie fully back into the bottle."

 afghanistan_civil_war_events.58.t: "Purging the Realm"
 afghanistan_civil_war_events.58.d: "Not all of Amanullah's allies took to arms for him. Many Liberals, modernisers, and wealthy administrators ducked for cover and simply waited for the dust to settle just in case their preferred victor didn't pull through. Even then, there's still a vast assortment of tribes, the Hazara most of all, who didn't just vanish with the dissipation of his forces. We can no longer afford to overlook their continued coexistence with our regime when so many of them are inherently and diametrically opposed to our reign and our values.\n\nA vast purge has commenced across Afghanistan, targeting Amanullah's most powerful allies and several tribal chieftains who are still capable of causing trouble for our reign of peace. Such measures have not been easy, and the Hazara have proven especially troublesome, but nonetheless we've rounded up most potential fifth-columnists with only a few stragglers still hiding out in various villages and mountains."
 afghanistan_civil_war_events.58.a: "An unpopular but needed action."

 afghanistan_civil_war_events.59.t: "The Nadir of Nadir"
 afghanistan_civil_war_events.59.d: "Words can not describe the depth of the tragedy that has just taken place. After a successful inspection of the Army at the barracks in [267.controller.GetVictoryPointName_10737], King Nadir in a motorcade was travelling back across the city, when just seven minutes into the trip an explosion thundered from beneath his vehicle and promptly eviscerated the car.\n\nThere was no chance of survival. Nadir was blown to pieces on impact and his remains charred once the subsequent fire that enveloped his vehicle dispersed (His driver was similarly not so fortunate but still in one piece). As news spreads like wildfire and chaos seems poised to retake Afghanistan into her clutches, the Chief of Army Mohammad Gul Khan Momand has hurried to restore order by marching the army into the palace and installing himself as regent until the dust has settled. May Allah have mercy on his soul."
 afghanistan_civil_war_events.59.a: "How could this have happened?"

 afghanistan_civil_war_events.60.t: "Momand's Dilemma"
 afghanistan_civil_war_events.60.d: "Naturally, Nadir's successor should be his son, Prince Mohammad Zahir Khan, and it is expected by most (especially Nadir's brothers) that Momand make arrangements for his formal accession to the throne as soon as possible. What most people do not seem to understand is that this is not such a cut and dry matter. Momand is the respected and informal leader of the Azadist Clique, being the highest ranking member of the group and even prior to his promotion to Chief of Army the most influential. Though they've been loyal to the throne, most of the Azadists have a poor view of the throne as an institution and their modernist philosophies have led them to wonder if Republicanism would be a healthier fit for Afghanistan's future. Daoud Khan, a nephew of Nadir's and perhaps the second most notable Azadist behind Momand, shares these views, and has spent considerable efforts behind closed doors trying to convince Momand to make a break with the throne and declare a republic. Hashim Khan and Shah Wali Khan have additionally been urging him to set up a formal crowning ceremony as soon as possible, growing more impatient by the day.\n\nHe has only held executive power for three days, and already the stress feels like its taken years off of his life. No matter what Momand chooses to do, he will ultimately betray one of his two families. Hours of contemplation of the direction of the nation up to this point have ultimately led him to make a conclusion, if at least to put an end to the limbo before predatory forces from without decide to prey upon it. The choice that he makes is for the good of Afghanistan, his own hesitation notwithstanding."
 afghanistan_civil_war_events.60.a: "The crown has only brought chaos, it is time to abolish it."
 afghanistan_civil_war_events.60.b: "Zahir's uncles will ensure the son shines where the father faltered!"

 afghanistan_civil_war_events.61.t: "Unrest Peters Out"
 afghanistan_civil_war_events.61.d: "TThe eventual defeat of the remaining rebels was to Amanullah a question of when, not if. An answer to that question has finally been received now, with Mohammad Hashim Khan said to have fled across the border and given up on his failed crusade against the King.\n\nWith none left to stand in his way, Amanullah Khan will reshape the nation in his image, and shall strive to bring about a second golden decade even greater than his first!"
 afghanistan_civil_war_events.61.a: "Amanullah reigns supreme!"

 afghanistan_civil_war_events.62.t: "Conspiracy Rumours Begin to End"
 afghanistan_civil_war_events.62.d: "Rumour are a funny thing, as they seem to be more often completely baseless than actually true. The alleged whispers of some grand conspiracy against Amanullah have clearly proven to be unfounded, as nothing further has developed on this front. Even those who bandied around the rumours, believing in their heart of hearts the truthfulness of the claims, have simply moved on.\n\nIt seems ultimately that even if they were true, no one still stands in a position to oppose Amanullah, who now indisputably rules Afghanistan again, this time with a fist of iron."
 afghanistan_civil_war_events.62.a: "Amanullah reigns supreme!"

 afghanistan_civil_war_events.63.t: "Amanullah Loyalism Dies Down"
 afghanistan_civil_war_events.63.d: "After months of lingering unrest and stubborn pockets of Amanite resistance, the last of the rebels seem to have laid down their arms. Though we can undoubtedly expect more isolated incidents as the years go by, at this point we have so firmly entrenched that anything dislodging us seems far outside the realm of possibility.\n\nLife among the tribes has gone back to normal, buildings are rebuilt in [267.controller.GetVictoryPointName_10737] and the other cities, the markets are full of wares and Amanullah is but a memory. At long last, all of Afghanistan recognises the true King!"
 afghanistan_civil_war_events.63.a: "Nadir reigns supreme!"

 afghanistan_civil_war_events.64.t: "Wardak's Return"
 afghanistan_civil_war_events.64.d: "Following his resignation, Wardak seemingly completely disappeared, chalked up by many to fears that his neck would be next on the block once Amanullah would begin to scapegoat him. Over the past few days however, the man has suddenly reappeared in the capital, having clearly heard the news of Amanullah's passing and the new king's opposition to continuing his purges. Arranging a meeting with Inayatullah, Wardak has offered to temporarily return to his old position, hoping to help put the nation back together in the wake of the recent chaos. Although he clearly does not intend to remain in government long term, stating directly to the King his desire to leave politics entirely, he is expected to be appointed back as Interior Minister until a new government can be assembled."
 afghanistan_civil_war_events.64.a: "One last act of patriotism before a deserved retirement."

 afghanistan_civil_war_events.65.t: "Rumble with the Ghilzai"
 afghanistan_civil_war_events.65.d: "Since the recent civil war, [267.controller.GetVictoryPointName_10737] has been struggling to get back on its feet. Her hardy, enterprising inhabitants and diligent efforts by the government have assisted greatly in this endeavour. What most certainly did not provide any assistance was a raid by some 100-300 Ghilzai warriors spearheaded by Said al-Kailani, a relative of Amanullah's. Those who did not profess their enduring loyalty to the former king were subsequently robbed if they were lucky, and killed if they were the other 80%. Our forces repelled them, but a decisive victory was simply not in the cards and their forces dispersed southward into the mountains.\n\nThose familiar with al-Kailani believe he can be bought; others believe he's already bought himself a ticket straight to a shallow grave. Our precise approach is left up to our leader, [ROOT.GetLeader]."
 afghanistan_civil_war_events.65.a: "Let's talk bags of gold."
 afghanistan_civil_war_events.65.b: "Kill the bastards."

 afghanistan_civil_war_events.66.t: "Battle of the Tomb"
 afghanistan_civil_war_events.66.d: "The brothers Charkhi had known this would come sooner or later. Ghulam Nabi Khan and Ghulam Jailani Khan had holed up in their eponymous stronghold, the village of Charkh, hoping that the local protection they enjoyed would buy enough time for Nabi Khan to contact Nadir and negotiate peace, or even an amnesty for Amanullah himself. Their fear that Nadir had made up his mind was validated upon receipt of a 100 soldier-strong Lashkar marching into the village to shockingly minimal defence. Their loyal tribesmen had been unceremoniously bought off and evacuated themselves elsewhere an hour prior to their executors' arrival.\n\nWith what few loyalists they had, they holed up at the tomb of their great ancestor, the Maulana Yaqoub Charkhi, and put up a valiant resistance. Hundreds of bullets flew at the tombs that day, and over the course of a long, futile hour, they finally ran out of ammunition and were forced to surrender, where they were summarily executed under the pretext of having reached for a pistol upon being apprehended. Whether or not their final moments transpired just as the Lashkar's commander reported, the men who participated in the Battle of the Tomb received a generous spoil straight from the abandoned coffers of Amanullah Khan."
 afghanistan_civil_war_events.66.a: "So ends the tale of Amanullah's closest eunuchs."

 afghanistan_civil_war_events.67.t: "Replacing the Musahiban"
 afghanistan_civil_war_events.67.d: "Although the Musahiban family and their lapdogs may be nothing more now than traitors or corpses, we cannot overlook how understaffed our officer corp is now with them gone. Nadir's betrayal and death especially has even left our army without an official leader, although multiple men have been unofficially fulfilling Nadir's old duties since the early days of the civil war.\n\nIn an effort to begin fully rebuilding the armed forces, it has been suggested that we choose one of these men to officially take over and begin restoring order."
 afghanistan_civil_war_events.67.a: "Darwazi is the best man for the job."
 afghanistan_civil_war_events.67.b: "Charkhi's experience will be vital in rebuilding the forces."
 afghanistan_civil_war_events.67.c: "Defer the decision for now."

 afghanistan_civil_war_events.100.t: "Afghanistan Collapses into Civil War"
 afghanistan_civil_war_events.100.d: "In recent weeks reports coming out of the Kingdom of Afghanistan have talked of largescale revolt against the reforms of their King Amanullah Khan, while the King was away visiting nations in the German sphere. These rumours have now been confirmed, with news that the rebellion has been put down by Minister of War Mohammad Nadir Khan, alongside further reports that the man has seized the throne for himself in the aftermath.\n\nThe past few days have seen Amanullah Khan's return to his now disputed realm, raising an army in an attempt to retake the throne from his former minister, who now styles himself Nadir Shah. Mass fighting in the mountain nation seems inevitable, as these two men and their loyalists vie for the kingdom's crown."
 afghanistan_civil_war_events.100.a: "It was bound to happen eventually."

 afghanistan_civil_war_events.101.t: "Amanullah Khan Restores Order in Afghanistan." #Reformist
 afghanistan_civil_war_events.101.body: "After months of brutal civil war in Afghanistan, originating from Nadir Shah's attempted seizure of the throne, King Amanullah Khan has seemingly restored his grip over the nation. The failed usurper was killed during the capital's reclamation by Amanite forces, and continued insurrection by remaining rebels has at last come to an end."
 afghanistan_civil_war_events.101.d: "$afghanistan_civil_war_events.101.body$\n\nWith his grip on the nation restored, Amanullah Khan has elected to go even further with the reforms that led to his initial ousting, confident that no one stands left to stop him. Policies already announced by the government include a mass expansion of women's rights, further economic self sufficiency, and even national elections of royal approved candidates."
 afghanistan_civil_war_events.101.a: "The Afghans should be proud to have him\nas king."
 afghanistan_civil_war_events.101.b: "Lets hope he's wrong about having no more enemies..."
 afghanistan_civil_war_events.101.c: "An enlightened despot is still a despot."

 afghanistan_civil_war_events.102.t: "Amanullah Khan Restores Order in Afghanistan." #Traditionalist
 afghanistan_civil_war_events.102.d: "$afghanistan_civil_war_events.101.body$\n\nAs part of efforts to restore his grip over the nation, Amanullah Khan has elected to reverse course on the reforms that led to his initial ousting. Significant rollbacks have been announced and already carried out regarding women's rights, government centralisation, and secularisation. Many of the King's former allies now find themselves sidelined or imprisoned, taking the fall for these former policies."
 afghanistan_civil_war_events.102.a: "Perhaps tradition is for the best."
 afghanistan_civil_war_events.102.b: "The worthless opportunist will get what's coming to him one day."
 afghanistan_civil_war_events.102.c: "Autocrats will always abandon their principles before they abandon their power."

 afghanistan_civil_war_events.103.t: "Amanullah Khan Killed in Peasant Uprising"
 afghanistan_civil_war_events.103.d: "After months of brutal civil war in Afghanistan, the nation's King Amanullah Khan managed to return to power after defeating the usurper Nadir Shah. Despite continued largescale opposition to his reforms, the restored Amanullah chose to press on with them after his restoration, which has proven now to be a fatal mistake.\n\nThe past few weeks have seen greater and greater unrest mounting throughout Afghanistan against his return, including in the capital. Orders to the army to disperse the angry mob were ignored, culminating in them descending upon the royal palace, killing the king as he attempted to escape. It is said that Nadir's brother Hashim arrived in [AFG.Capital.GetCapitalVictoryPointName] not long after, and was proclaimed their new king by those present."
 afghanistan_civil_war_events.103.a: "For their sake lets hope the new king can reign in the mob."
 afghanistan_civil_war_events.103.b: "A good step to return to Islamic values."

 afghanistan_civil_war_events.104.t: "Amanullah Khan Assassinated"
 afghanistan_civil_war_events.104.d: "After months of brutal civil war in Afghanistan, the nation's King Amanullah Khan managed to return to power after defeating the usurper Nadir Shah. Rather than continuing on with his unpopular reforms, the restored King elected instead to begin rolling them back, and blaming his former allies for their implementation.\n\nIt seems though that this reversal may now be at an end, with Amanullah having been assassinated by unknown assailants, and his brother Inayatullah succeeding him as king. Some have connected this killing to rumours of a conspiracy by Amanullah's former sidelined allies, yet no concrete evidence of this has so far emerged. Whatever the case, the outcome appears to favour the reformists, with the King already announcing the resumption of past reforms."
 afghanistan_civil_war_events.104.a: "Who could possibly be behind this I wonder?"

 afghanistan_civil_war_events.105.t: "Nadir Shah Consolidates Power in Afghanistan"
 afghanistan_civil_war_events.105.d: "After months of brutal civil war Mohammad Nadir Shah, whose usurpation of the throne instigated the war, has at last consolidated his grip on power. While the former king Amanullah Khan fled the country weeks ago following the defeat of his direct forces, his loyalists continued the fight without him, although they seem to have at last been crushed by the new king.\n\nWith his enemies defeated, Nadir Shah has already begun reshaping Afghanistan towards his vision, and eliminating many of the remnants of the Amanite years. Unlike the former King, many expect this transformation to occur at a very gradual pace, with restraint said to have been Nadir's guiding motto even as Minister of War."
 afghanistan_civil_war_events.105.a: "A strong leader is what their nation needs right now."
 afghanistan_civil_war_events.105.b: "I hope the worthless upstart gets what's coming to him."
 afghanistan_civil_war_events.105.c: "Afghanistan is like watching musical chairs\nfor tyrants."

 afghanistan_civil_war_events.106.t: "Nadir Shah Assassinated"
 afghanistan_civil_war_events.106.body: "King Mohammad Nadir Shah, who usurpation of the throne led to months of brutal civil war in Afghanistan, has been assassinated by assailants unknown. According to reports, while travelling in a car through the nation's capital an explosion suddenly rang out, killing the king and others alongside him in an instant."
 afghanistan_civil_war_events.106.d: "$afghanistan_civil_war_events.106.body$\n\nIn the aftermath Minister of War Mohammad Gul Khan Momand quickly moved to restore order in the capital, and has helped facilitate a swift installation of Nadir's son Zahir Shah as the new king. Although still fearing unrest, it appears as though Momand and the new king's uncles are expected to be able to maintain order together in spite of the sudden chaos that has arisen."
 afghanistan_civil_war_events.106.a: "At some point they're going to run out of new kings..."

 afghanistan_civil_war_events.107.t: "Republic Declared in Afghanistan by Army Officers"
 afghanistan_civil_war_events.107.d: "$afghanistan_civil_war_events.106.body$\n\nIn the aftermath Minister of War Mohammad Gul Khan Momand quickly moved to restore order in the capital, taking control alongside his so-called \"Azadist\" office clique. Rather than hand the crown to Nadir's son Zahir, a republic has been declared, with Momand as its president. These officers are expected now to lead a nationalist-minded republic, and accelerate national reforms further than even those carried out by former king Amanullah Khan."
 afghanistan_civil_war_events.107.a: "We wish the new president luck in his endeavours."
 afghanistan_civil_war_events.107.b: "Is the lack of a crown on their despot really progress?"

 afghanistan_civil_war_events.108.t: "Regional Government Restores Order in Afghanistan"
 afghanistan_civil_war_events.108.d: "$afghanistan_civil_war_events.106.body$\n\nA failed attempt to seize power by army officers who declared a republic quickly gave way to chaos as an order to forcefully take over the regional government in [442.Controller.GetVictoryPointName_12717] led to mass mutinies. The officers responsible for the coup reportedly soon fled, leaving the regional government as the last legitimate authority in Afghanistan. Ghaffar Khan, one of the government's leaders, has now been sworn in as president, with the nation turning to him to restore order."
 afghanistan_civil_war_events.108.a: "Our support of Ghaffar Khan has at last\npaid off."
 afghanistan_civil_war_events.108.b: "Perhaps democracy may finally come\nto the Afghans."
 afghanistan_civil_war_events.108.c: "I give them five minutes before they\ncollapse again."
 afghanistan_civil_war_events.108.e: "It hopefully won't be long until the socialists around him take over."

 afghanistan_civil_war_events.109.t: "[AFG.overlord.GetAdjective] Intervention in Afghanistan"
 afghanistan_civil_war_events.109.d: "$afghanistan_civil_war_events.106.body$\n\nA failed attempt to seize power by army officers who declared a republic quickly gave way to chaos as an order to forcefully take over the regional government in [442.Controller.GetVictoryPointName_12717] led to mass mutinies. With help from [AFG.overlord.GetAdjective] troops, militants loyal to Frontier Socialist Party leader Abdur Rahim Popalzai have taken control of the nation. A new socialist government is now being established, securing [AFG.overlord.GetNameDef]'s influence in the region."
 afghanistan_civil_war_events.109.a: "Proof socialism can flourish no matter the nation."
 afghanistan_civil_war_events.109.b: "Lets hope this intervention ends up being\ntheir grave."

 afghanistan_foreign_policy_events.1.t: "Afghanistan Requests Recognition of Imperial Ambitions"
 afghanistan_foreign_policy_events.1.d: "Amidst the flurry of telegraphs and letters regarding crucial issues both national and international, occasionally there is one that stands out amongst the rest. We have just received a letter from the government in Afghanistan: they are requesting that we formally recognise them as an empire.\n\nOur relationship with Afghanistan has always been friendly, even amidst the civil wars, changes in leadership, and the potential for our business ventures to be disrupted. Apparently, the recently elected Afghan government has chosen to initiate modernisation programmes even more ambitious than prior ones, and part of their process is international recognition of their status as an empire, hoping to be seen as an equal to the other great modern empires of the world.\n\nDoing so would cost us nothing, aside from potential mockery by those who still see Afghanistan as an irrelevant backwater. What should our course of action be?"
 afghanistan_foreign_policy_events.1.a: "We see no issue recognising their claim."
 afghanistan_foreign_policy_events.1.b: "Afghanistan? An empire? Really?"

 afghanistan_foreign_policy_events.2.t: "[FROM.GetNameDefCap] Agrees to Recognise Us"
 afghanistan_foreign_policy_events.2.d: "Great news: [FROM.GetNameDef] has agreed to recognise our claim to be an empire. We have sent them a letter expressing our sincere gratitude for their support, and look forward to continued positive relations.\n\nRecognition of our status as an empire from [FROM.GetNameDef] puts us one step closer to full international acknowledgement of our imperial status!"
 afghanistan_foreign_policy_events.2.a: "Fantastic!"

 afghanistan_foreign_policy_events.3.t: "[FROM.GetNameDefCap] Refuses to Recognise Us"
 afghanistan_foreign_policy_events.3.d: "Unfortunately, [FROM.GetNameDef] has refused to recognise our claim to be an empire. We are unsure of their reasoning: perhaps it is our size, or perhaps it is bias against our nation.\n\nRegardless, this setback will not deter us from achieving the status that we deserve. Maybe another country will see that our request is reasonable, maybe even one of more prestige than [FROM.GetNameDef]."
 afghanistan_foreign_policy_events.3.a: "Damn them!"

 afghanistan_foreign_policy_events.5.t: "Reaching Out to India"
 afghanistan_foreign_policy_events.5.d: "The Fourth Anglo-Afghan War reunited us with our Pashtun kinsmen in India, but it was never officially resolved with a treaty. This is due in part to the civil war that was raging in India at the time of the conflict. Now, India has been reunited, and has a singular, recognised government. We have an opportunity here to finally settle the war and officially propose an armistice and treaty. Our diplomats have suggested a number of options for what to offer India in exchange for their formal recognition of our borders.\n\nThe most prominent suggestion is the offering of a formal alliance between Afghanistan and India, perhaps simply defensive in native. Both of our countries are somewhat isolated on the world stage due to our locations in Asia, and our country's stability and experienced military would be a lucrative offer for the fledgling Indian government, looking for both friends and benefactors in diplomacy.\n\nA second alternative would be to put together an economic agreement, ceding India significant economic control over formerly Indian businesses in the Frontier. Although hardly beneficial to us, it will almost certainly invalidate any potential revanchism towards us by them, as they would have little reason to blow up their own investments while allowing us to maintain our neutrality."
 afghanistan_foreign_policy_events.5.a: "Prepare to offer them an alliance."
 afghanistan_foreign_policy_events.5.b: "Offer an economic agreement in exchange for border recognition."
 afghanistan_foreign_policy_events.5.c: "Approach them about a defensive cooperation agreement."

 afghanistan_foreign_policy_events.6.t: "The Afghan Offer"
 afghanistan_foreign_policy_events.6.d.body: "The Fourth Anglo-Afghan War is regarded by many as a stain on the nation, when the perfidious Afghans attacked India at its weakest and clawed territory away from it. Although we have long mused the day that we could return the favour and march past the Khyber, the recent appointment of an Indophilic government has led to questions of whether or not the hatchet should at last be buried. Clearly having the same idea, a telegram has been received today from [AFG.Capital.GetCapitalVictoryPointName] hoping to formally end hostilities, and recognise the existing de facto border as the legal boundary between us.\n\n"
 afghanistan_foreign_policy_events.6.d.alliance: "$afghanistan_foreign_policy_events.6.d.body$Not simply demanding it of us, the Afghans have declared their willingness to enter into a military alliance with our nation, arguing it is only fair that they compensate us by aiding in maintaining Indian order at home and abroad. Their offer is rather tempting, and perhaps their past transgressions can be forgiven in exchange for it." #military alliance
 afghanistan_foreign_policy_events.6.d.eco: "$afghanistan_foreign_policy_events.6.d.body$Not simply demanding it of us, the Afghans have declared their willingness to enter into a mutual defensive alliance with our nation, arguing it is only fair that they compensate us by aiding in maintaining order in the face of aggression towards either party, from both internal and external threats. Their offer is rather tempting, and perhaps their past transgressions can be forgiven in exchange for it" #economic agreement
 afghanistan_foreign_policy_events.6.d.defensive: "$afghanistan_foreign_policy_events.6.d.body$Their offer is rather tempting, and perhaps their past transgressions can be forgiven in exchange for it." #defensive cooperation
 afghanistan_foreign_policy_events.6.a: "Agree to their alliance offer."
 afghanistan_foreign_policy_events.6.b: "Accept their offer, our claim isn't worth pursuing."
 afghanistan_foreign_policy_events.6.c: "Pressure them into an alliance."
 afghanistan_foreign_policy_events.6.e: "They have no right to make any demands to us."

 afghanistan_foreign_policy_events.7.t: "[FROM.GetNameDefCap] Agrees"
 afghanistan_foreign_policy_events.7.d: "Great news! [FROM.GetNameDef] has agreed to our offer, and has dropped their claim in exchange for us fulfilling our end of the bargain.\n\nThis is truly a joyful day for our nation. We look forward to a long and prosperous friendship, and can continue the Loy Afghanistan project in peace!"
 afghanistan_foreign_policy_events.7.a: "Let us put the past behind us."

 afghanistan_foreign_policy_events.8.t: "India Refuses to Negotiate"
 afghanistan_foreign_policy_events.8.d: "Despite our very reasonable offer, [FROM.GetNameDef] has turned us down, and have refused to agree to any further negotiations.\n\nThis is a disappointing development indeed: we will continue to pursue a beneficial relationship in the future, but this setback disappoints us greatly."
 afghanistan_foreign_policy_events.8.a: "Ah, a shame."

 afghanistan_foreign_policy_events.9.t: "India Demands an Alliance"
 afghanistan_foreign_policy_events.9.d: "Interestingly, [FROM.GetNameDef] has rejected our offer, and instead has issued a counteroffer: they want a fully operational and equitable alliance between our two countries.\n\nWhile this was not what we set forth in our offer, they still wish to forgo any claims to our frontier, so long as our two countries formally work together militarily and diplomatically. Should we accept?"
 afghanistan_foreign_policy_events.9.a: "Fine..."
 afghanistan_foreign_policy_events.9.b: "We cannot agree, let them know."

 afghanistan_foreign_policy_events.10.t: "Afghanistan Agrees"
 afghanistan_foreign_policy_events.10.d: "Great news! Afghanistan has agreed to our counter offer, and is now formalising their alliance with us.\n\nLet our two countries stand strong against any who wish to threaten our sovereignty."
 afghanistan_foreign_policy_events.10.a: "Excellent."

 afghanistan_foreign_policy_events.11.t: "Afghanistan Refuses"
 afghanistan_foreign_policy_events.11.d: "Unfortunately, Afghanistan has turned down our counter offer of an alliance, bringing an end to our negotiations. It is a shame, as it was they who took our territory and then approached us to settle the matter.\n\nNonetheless, it is their loss, and we will continue to pursue alliances elsewhere."
 afghanistan_foreign_policy_events.11.a: "These talks are over."

 afghanistan_foreign_policy_events.12.t: "Afghanistan Requests Transfer of [410.GetName]"
 afghanistan_foreign_policy_events.12.d: "Following our defeat of the perfidious [PER.GetAdjective]s our authority has extended across their entire land, including to the border region of [410.GetName], homeland of many of the Balochs.\n\nOur allies in Afghanistan, seeing the Balochs as their kinsmen, have issued a request that we punish the [PER.GetAdjective] further by transferring the region to them, \"reunifying\" their people together."
 afghanistan_foreign_policy_events.12.a: "We won't turn down a chance to further punish the [PER.GetAdjective]."
 afghanistan_foreign_policy_events.12.b: "It would be better if it remains with [PER.GetName]."

 afghanistan_foreign_policy_events.13.t: "[FROM.GetNameDefCap] Agrees to Transfer [410.GetName]"
 afghanistan_foreign_policy_events.13.d: "Seeing our request as reasonable, the [FROM.GetAdjective] government has agreed to transfer [410.GetName] to us.\n\nThe [PER.GetAdjective] regime is unlikely to be happy, but as the saying goes, \"Vae Victis\"."
 afghanistan_foreign_policy_events.13.a: "Fantastic."

 afghanistan_foreign_policy_events.14.t: "[FROM.GetNameDefCap] Refuses to Transfer [410.GetName]"
 afghanistan_foreign_policy_events.14.d: "Seemingly on the grounds of not wishing to upset their loyalists in [PER.GetNameDef], the [FROM.GetAdjective] government has refused our reasonable request for [410.GetName]."
 afghanistan_foreign_policy_events.14.a: "How dare they!"

 afghanistan_foreign_policy_events.15.t: "Our Baloch Brothers"
 afghanistan_foreign_policy_events.15.d: "It has long been disputed where the Balochs truly belong, with many of them being quick to tell you that they are a distinct people with their own culture and language, but many Pashtuns quick to describe them as simply a large variant of Pashtun instead, while others would describe Pashtuns and Balochs as closely interlinked brothers. Regardless of where they stand, members of all three groups cannot deny that there is a grand desire by both Pashtuns and Balochs to live together in one united homeland, a desire we have at last fulfilled with our liberation of the region.\n\nOne such man from the land of the Balochs who has long desired this unity is Abdul Samad Khan Achakzai, a local activist in [445.controller.GetVictoryPointName_5105]. Since our acquisition of the city his promotion of our nationalist cause has been vital for ensuring the integration of the local people, with his activism proving both popular and effective. Recognised for his talents, there are those in government who believe the man should be further promoted, further aiding us in integrating all of our Baloch territories into the nation."
 afghanistan_foreign_policy_events.15.a: "Bring him to [267.controller.GetVictoryPointName_10737], he'll be useful."
 afghanistan_foreign_policy_events.15.b: "Give the man a role in managing the region instead."

 afghanistan_foreign_policy_events.16.t: "The Struggle in Sind"
 afghanistan_foreign_policy_events.16.d: "Rather than justifying our conquest of Sind with grand claims of a united nation, or its liberation from oppressive overlords, we have not been shy that we simply desire the region as a vital sea link to the outside world. The primarily Sindhi population of the region, massively discontent about their occupation by a foreign power, have not taken this annexation laying down. Major protests have already erupted in the city of [443.controller.GetVictoryPointName_3456], hoping to disrupt shipping access and get us to abandon the region.\n\nMany of those protesting have particularly highlighted the idea that their annexation could mean their conscription to fight for the state, vowing to oppose any draft attempts with force. Proposals have therefore been crafted up to exempt the region from any and all forms of conscription, limiting recruitment to being solely voluntary. Although the region's large population could benefit our army greatly, perhaps it is worth the cost of not having to worry about suddenly losing access to our newly acquired ports."
 afghanistan_foreign_policy_events.16.a: "Exempt the region from conscription."
 afghanistan_foreign_policy_events.16.b: "They're our subjects now, and they have to get used to it."

 afghanistan_foreign_policy_events.17.t: "New Land, New Khans"
 afghanistan_foreign_policy_events.17.d: "In contrast to the more urban and supposedly \"civilised\" parts of Baluchistan in the north, where the British ruled directly for decades, the south and west of Baluchistan still finds itself under the authority of local princely states. These rulers, having agreed to both British rule and accession to their failed Dominion, are hardly popular amongst the anti-colonialist minded in Afghanistan. Many regard them as little more than British lapdogs, who should have their lands confiscated and redistributed to those who don't collaborate with their slavemasters.\n\nLocally however, these rulers still hold significant sway, with the Khan of Kalat especially having many die hard loyalists who are likely to cause headaches in the event of his deposition. Allowing them to continue in their roles, as was done with the Frontier's princely states, could be vital in ensuring a smooth integration into the nation, if we can stomach working with them any further."
 afghanistan_foreign_policy_events.17.a: "Go cry to your British masters, the land is ours."
 afghanistan_foreign_policy_events.17.b: "Tolerate their authority, as long as it does not clash with our own."

 afghanistan_foreign_policy_events.18.t: "Honouring the Shah of Baluchistan"
 afghanistan_foreign_policy_events.18.d: "For decades prior to our annexation of the [410.GetName] region, it could hardly be said to be part of the [PER.GetAdjective] state, being more a self-governing region they falsely claimed to project authority over. Unlike most lands where its people pay tribute or taxes to their owner, the local Balochs were instead paid by the [PER.GetAdjective] state to remain loyal to them, a pathetic position for a supposedly great state to be in. Failure to maintain this payment saw the region simply refuse to recognise their continued authority over it, instead treating their ruler Dost Mohammad Khan Baloch as the Shah of Baluchistan.\n\nUnfortunately for this Shah, it was not long until the [PER.GetAdjective] finally began to restore order, and subsequently began to treat Baluchistan not as the independent state it was but as a rebelling province. They conquered and subjugated the land by force, killing the Shah in the process. For local nationalists Dost Mohammad is a hero to be emulated, who stood up against [PER.GetAdjective] rule for his people's freedom. Coopting his legacy, as the liberators of the Balochs, could certainly ingratiate us with the local population. With our recent history however, perhaps it may be best instead not to promote tribal insurgents as heroes to follow, as we certainly don't need any more of those..."
 afghanistan_foreign_policy_events.18.a: "We honour all those who fight for freedom."
 afghanistan_foreign_policy_events.18.b: "It'd be unwise to promote tribal insurgents like him."

### Pathing events ###
 afghanistan_events.9000.t: "AI path choosing"
 afghanistan_events.9000.d: "This is how the AI chooses which ruler wins the Afghan Civil War"
 afghanistan_events.9000.a: "Amanullah Khan"  # 55%
 afghanistan_events.9000.b: "Nadir Shah"  # 45%

