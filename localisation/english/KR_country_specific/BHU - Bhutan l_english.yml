 bhutan_tree: "Bhutan Focus Tree"

### Country Names ###
 BHU: "Bhutan"
 BHU_ADJ: "Bhutanese"
 BHU_DEF: "Bhutan"

 BHU_DRUK_authoritarian_democrat: "Druk Empire"
 BHU_DRUK_authoritarian_democrat_DEF: "the Druk Empire"
 BHU_DRUK_paternal_autocrat: "Druk Empire"
 BHU_DRUK_paternal_autocrat_DEF: "the Druk Empire"
 BHU_DRUK_national_populist: "Druk Empire"
 BHU_DRUK_national_populist_DEF: "the Druk Empire"

### Ideas ###

    ### Starting / Shared Ideas

 BHU_sikkim_protests: "Protests in Sikkim"
 BHU_sikkim_protests_desc: "The situation in the Sikkimese capital of Gangtok is worrisome to say the least. A city divided between three peoples, the growing hatred between the Lepcha and Bhutia peasants and our fellow Nepalese may soon spiral into open violence."
 BHU_bloodied_by_bhutan: "Bloodied by Bhutan"
 BHU_bloodied_by_bhutan_desc: "Our recent defeat at the hand of Sikkimese rebels and their Bhutanese allies has left our government reeling and discouraged. It will likely be a while before we once again strike out abroad."
 BHU_spirit_of_the_lotus_throne: "Spirit of the Lotus Throne"
 BHU_spirit_of_the_lotus_throne_desc: "The loyal people of Sikkim have rallied around their valiant Chogyal, despite years of occupation, and have risen to liberate their homeland. The Lotus Throne will be reclaimed, no matter how hard this reclamation will be!"

 BHU_peace_in_our_time: "Peace in our Time"
 BHU_peace_in_our_time_desc: "Ever since Ugyen Wangchuck united the penlops under his iron fist more than three decades ago, the once squabbling lands of the mountain kingdom have been wrangled into sleepy peace. With so little happening this far up in the Himalayas, most have stopped bothering to worry over military matters."
 BHU_monastic_control: "Monastic Control"
 BHU_monastic_control_desc: "Much of Bhutan is comprised of semi-independent monastic fiefdoms, making them one of the most powerful forces in the kingdom."
 BHU_monastic_whispers: "Whispers Among the Monks"
 BHU_monastic_whispers_desc: "Zhabdrung Thuktrul Jigme Dorji, the reincarnation of our nation’s founder and the spiritual leader of the realm, acts as a magnet for dissent, drawing the support of monastic and temporal leaders opposed to our rule. For years, we have let him linger like an open sore, yet even now we lack the resources and control to deal with this growing cabal."
 BHU_split_zhungdratshang: "Divided Zhung Dratshang"
 BHU_split_zhungdratshang_desc: "The departure of senior members of the Zhung Dratshang to Cheri Monastery betrays how deep we have allowed the divisions in the clergy to grow. The rise of the Zhabdrung Jigme Dorji has given monks opposed to Sonam Topgye Dorji and his reforms a figure to rally around, allowing them to form an informal anti-royalist bloc."
 BHU_Yung_Monk_Revolt: "The Young Monk Revolt"
 BHU_Yung_Monk_Revolt_desc: "The violence at Tango and Gangtey has set the nation ablaze. Across the realm, the younger generation of monks haven risen in revolt against the crown, furious at the long attempted royal monastic reforms and the stubborn inaction of their elders. Arming themselves as warriors, they have made clear their intentions to force concessions to the monasteries at the point of a sword."
 BHU_Zhabdrung_Revolt: "The Zhabdrung's Revolt"
 BHU_Zhabdrung_Revolt_desc: "The Zhabdrung Thuktrul Jigme Dorji has begun openly opposing the rule of King Jigme, gathering support in a bid to restore the rule of the Zhabdrung Reincarnations."
 BHU_Zhabdrung_Aftermath: "Aftermath of the Revolt"
 BHU_Zhabdrung_Aftermath_desc: "The Battle of Cheri Monastery has left the nation reeling. Without the presence of a strong central authority, banditry is rampant and local rulers disregard their dues."
 BHU_Zhabdrung_Aftermath2: "Lingering Banditry"
 BHU_Zhabdrung_Aftermath2_desc: "The deep scars left by the Battle of Cheri Monastery continue to plague Bhutan. While the nation has begun to stabilise, corruption and banditry still run rampant."
 BHU_repaired_irrigation: "Repaired Irrigation"
 BHU_repaired_irrigation_desc: "Irrigation is the lifeblood of our kingdom, and its neglect is indicative of our greatest failings. Before we do anything else, we should repair this crumbling infrastructure, if only to not have to hear hundreds of weekly complaints regarding its poor state."
 BHU_tax_collectors: "Reasserted Taxation Rights"
 BHU_tax_collectors_desc: "For years the villages under direct royal control have wriggled out from under our authority, seeing our generosity as weakness and squeezing our graciousness for all that it’s worth. No more! Once again the lowliest of peasants will have to respect the greatest of kings."
 BHU_eyes_on_the_duars: "Eyes on the Duars"
 BHU_eyes_on_the_duars_desc: "The vast reaches of the Duars, verdant floodplains stretching from Kalimpong to Udalguri, are both the site of our greatest defeat and the potential site of our undoing. Should the Indians mass forces on the border to intervene into our civil strife, we must know about it!"
 BHU_forcing_renovations: "Renovating Defences"
 BHU_forcing_renovations_desc: "The expansion of defensive buildings is as vitally important as it is prohibitively expensive. In the face of recent developments, however, the balance between these evenly weighed factors has been temporarily shifted, giving us the necessary justification for repairs and renovations which should have happened decades ago."
 BHU_neighbours_reassured: "Our Neighbours Calmed"
 BHU_neighbours_reassured_desc: "Rumours of unrest can sometimes be as dangerous as the unrest itself. Should our neighbours learn of the degree of danger the realm is in, it would be devastating to our trade and our security. We will simply reassure them that everything is fine – that always seems to work!"
 BHU_regulars_drilled: "Rigorous Training Exercises"
 BHU_regulars_drilled_desc: "A blade is only ever as sharp as the man wielding it. Though blades are less and less important to the execution of warfare, the principle remains true. Our soldiers must be well drilled to survive the enemies they will soon face, within and without."
 BHU_village_defenders: "Village Defense Groups"
 BHU_village_defenders_desc: "When strife strikes at Bhutan, hundreds turn to banditry to survive, forcing hundreds more to form ad hoc militias...to survive. Organising these loose bands of militias will do much to prevent the latter from drifting towards the former, as vigilante justice and greed seize the hearts of simple farmers."
 BHU_villages_drained: "Our Villages Drained"
 BHU_villages_drained_desc: "The use of extraordinary labor demands have left many villages shorthanded. Though they can limp along, we must allow these hamlets to rejuvenate before we once again attempt to leverage them for labour!"

 BHU_treaty_of_phuentscholing: "Treaty of Phuentscholing"
 BHU_treaty_of_phuentscholing_desc: "The Treaty of Phuentscholing largely serves as a gateway into the wider world for Bhutan. The political concessions made with India has provided Bhutan with a small monetary stipend and the ability to trade through their southern border."
 BHU_slackened_indian_trade: "Slackened Indian Trade"
 BHU_slackened_indian_trade_desc: "With the fall of the agreements made between Sonam Topgye Dorji and the Indians, trade between Bhutan and the subcontinent has slackened. Few wish to brave the risks of commerce without guarantees."
 BHU_restored_indian_trade: "Indian Trade Restored"
 BHU_restored_indian_trade_desc: "Political concessions made with unified India has provided Bhutan with the ability to trade through their southern border, connecting them with the wider world and helping to strengthen the Bhutanese government."
 BHU_newfound_belligerence: "Newfound Belligerence"
 BHU_newfound_belligerence_desc: "For too long the rulers of Bhutan have been content to see our borders slowly eroded by foreign encroachment, hiding like children in the mountains. No longer! We will show the world our strength."
 BHU_military_funding_priority: "Military Funding Priority"
 BHU_military_funding_priority_desc: "The military is the foundation of Tshering Penjor’s regime, and they have demanded special treatment in the face of his recent focus on economic affairs. Until they are placated, the king will have to devote his attention to matters of war."

    ### Reform Ideas

 BHU_hermit_kingdom: "The Hermit Kingdom"
 BHU_hermit_kingdom_desc: "Bhutan is a political time capsule, with a backwards society straight out of medieval times. Serfs labour throughout the year to collect enough food to survive, and little industry exists outside of the cottage workshops of wealthy lords and small tradeposts. The armed forces of the kingdom rely on the banners of penlops, who gather together bands of warriors from their domains. There is a place in the Himalayas where time has stood still, and Bhutan has been left behind by the world at large."
 BHU_hermit_kingdom_reformed: "The Civilised Hermit"
 BHU_hermit_kingdom_reformed_desc: "Bhutan has come a long way in a short time, surprising all at the breakneck pace the nation has taken towards reforming. Even still, its society struggles to accept the radical pace of change, the army still occasionally relies on the bow and arrow, the economy remains wholly agrarian, and the changes in the capital struggle to permeate into the countryside. Such setbacks are to be expected, as discouraging as they are. The future is bright for Bhutan, and one day it will rise to the ranks of modernity in earnest!"

 BHU_drukpa_renaissance: "Drukpa Renaissance"
 BHU_drukpa_renaissance_desc: "Unimaginable victory after unimaginable victory has brought us here, to rule as the undisputed masters of the Himalayas!"
 BHU_outward_court: "An Outward Court"
 BHU_aristocratic_court: "An Aristocratic Court"
 BHU_monastic_court: "An Enlightened Court"
 BHU_balanced_court: "A Balanced Court"
 BHU_expand_to_the_territories: "Expand to the Territories"
 BHU_focus_on_our_core_cadres: "Focus on our Core Cadres"
 BHU_keep_an_eye_to_the_future: "Keep an Eye to the Future"
 BHU_drukpa_renaissance_jw_finisher: "The Thunder Dragon Ascendant"
 BHU_drukpa_renaissance_jw_finisher_desc: " Unimaginable victory after unimaginable victory has brought us here, to rule as the undisputed masters of the Himalayas! The first great Wangchuck, the Black Ruler Jigme Namgyal, united the tribes of the feuding east and west to forge a new unified realm nearly a century ago. Now, his grandson will unite the whole of the Himalayas in his honour. However this new empire of the clouds lives on, there is no doubt that the Wangchuck clan, and their valiant and humble King Jigme, have made their marks in the history books."
 BHU_drukpa_renaissance_st_finisher: "A Bright Future for the Himalayas"
 BHU_drukpa_renaissance_st_finisher_desc: " Unimaginable victory after unimaginable victory has brought us here, to rule as the undisputed masters of the Himalayas! We will lead the region into a bright future, blending tradition with modernity to create a culture and regime which is unique to the roof of the world. For decades the Wangchuck clan have trod the middle ground between the dangers of stubborn inaction and dangerous radicalism, forging a tempered path forward. Today we carry this mission forward to the whole of the Himalayas, introducing the glory of reform from the destitute villages of Uttarakhand to the grand temples of Lhasa!"
 BHU_drukpa_renaissance_tp_finisher: "The Gift of Magnanimity and Stability"
 BHU_drukpa_renaissance_tp_finisher_desc: " Unimaginable victory after unimaginable victory has brought us here, to rule as the undisputed masters of the Himalayas! Modern technology, modern ideology, and modern allegiances have destroyed the tranquility of the old Himalayan plateau, bringing death and conflict where there was once peace. The iron fist of Tshering Penjor has restored what once was lost, bringing the stability of unity to the far corners of Nepal and Tibet. Now every peasant can look to their Dragon King for guidance and justice, and every revolutionary can quake at the might of our armies!"
 BHU_drukpa_renaissance_z_finisher: "Cultivating an Enlightened Realm"
 BHU_drukpa_renaissance_z_finisher_desc: " Unimaginable victory after unimaginable victory has brought us here, to rule as the undisputed masters of the Himalayas! The squabbling kingdoms of monks and Rajas have poisoned the hearts of man, turning them away from the truth of enlightenment. By wiping the slate clean, we can once again strive for a realm unburdened with petty conflicts, devoted to ancient wisdom once lost. At the head of this new realm is its young father, the tireless Zhabdrung Jigme Dorji, who will stop at nothing to see the dreams of Ngawang Namgyal realised!"
 BHU_growing_pains: "Growing Pains"
 BHU_growing_pains_desc: "The rapid expansion of our realm has left our administration overstretched and dangerously close to unraveling under the weight of growing unrest. Until we can grow to meet the challenges of our new conquests, we will be fighting an uphill battle to integrate these new territories."

 BHU_integrating_foreign_armies: "Integrating Defeated Warriors"
 BHU_xenophobic_fervor: "Xenophobic Fervor"
 BHU_new_faces_new_ideas: "New Faces, New Ideas"

 BHU_feudal_1: "Abysmal Central Authority"
 BHU_feudal_1_desc: "Our nation is ruled over by a patchwork of uncontrolled Penlops and smaller lordlings, far more interested in furthering their own personal interests than those of the state. The weakness of the king has been exploited by the monasteries and feudal lords who bicker and fight over the scraps of our kingdom. Without the presence of a central authority, anarchy reigns in Bhutan."
 BHU_feudal_2: "Feeble Central Authority"
 BHU_feudal_2_desc: "Our nation is ruled over by a patchwork of autonomous Penlops and smaller lordlings, far more interested in furthering their own personal interests than those of the state. The vast majority of the nation is managed by monasteries and feudal lords with no connection to the whims of the central government and it is near impossible to action government policy or manage the realm."
 BHU_feudal_3: "Weak Central Authority"
 BHU_feudal_3_desc: "Our nation is governed by a patchwork of autonomous Penlops and smaller lordlings, far more interested in furthering their own personal interests than those of the state. The majority of the nation is managed by monasteries and feudal lords, with very little connection to the whims of the central government, and it is increasingly difficult to action government policy or manage the realm."
 BHU_feudal_4: "Precarious Central Authority"
 BHU_feudal_4_desc: "Our nation is governed by a patchwork of Penlops and smaller lordlings, who divide their time between furthering their personal interests and those of the state. Much of the nation is managed by monasteries and feudal lords and our government is forced to cooperate with them to action government policy and manage the realm."
 BHU_feudal_5: "Moderate Central Authority"
 BHU_feudal_5_desc: "Our nation is administered by a patchwork of loyal Penlops and smaller lordlings, who help to further the interests of the state. Much of the nation is managed by monasteries and feudal lords, who diligently cooperate with the central authority to action government policy and manage the realm."
 BHU_feudal_6: "Strong Central Authority"
 BHU_feudal_6_desc: "Our nation is administered by a patchwork of loyal Penlops and smaller lordlings, who help to further the interests of the state. Much of the nation is managed by monasteries and feudal lords, who diligently action government policy and manage the realm."
 BHU_feudal_7: "Absolute Central Authority"
 BHU_feudal_7_desc: "Our nation is administered by a patchwork of loyal Penlops and smaller lordlings, who help to further the interests of the state. Much of the nation is managed by monasteries and feudal lords, who diligently action government policy and manage the realm."

 BHU_economy_extensive: "Extensive Economic Investments"
 BHU_economy_extensive_desc: "By investing our resources into the industry of our nation, we are better able to match the industrial power of our more developed neighbours. However, even with our extensive investments, we still lag behind the industrial might of a modern nation."
 BHU_economy_adequate: "Adequate Economic Investments"
 BHU_economy_adequate_desc: "By investing some of our resources into the industry of our nation, we are better able to match the industrial power of our more developed neighbours. However, even with our moderate investments, we still lag far behind the industrial might of a modern nation."
 BHU_economy_moderate: "Moderate Economic Investments"
 BHU_economy_moderate_desc: "By investing some of our resources into the industry of our nation, we are better able to match the industrial power of our more developed neighbours. However, even with our moderate investments, we still lag far behind the industrial might of a modern nation."
 BHU_economy_meagre: "Meagre Economic Investments"
 BHU_economy_meagre_desc: "By investing some of our resources into the industry of our nation, we are better able to match the industrial power of our more developed neighbours. However, even with our meagre investments, we still lag far behind the industrial might of a modern nation."
 BHU_economy_minus_1: "Reduced Economic Investments"
 BHU_economy_minus_1_desc: "We have reduced our investment into developing industry and commerce, freeing up funds for other projects."
 BHU_economy_minus_2: "Greatly Reduced Economic Investments"
 BHU_economy_minus_2_desc: "We have reduced our investment into developing industry and commerce, freeing up funds for other projects."

 BHU_military_extensive: "Extensive Military Investments"
 BHU_military_extensive_desc: "By investing our resources into the military of our nation, we are better able to match the might of our more developed neighbours. However, even with our extensive investments, we still lag behind the military might of a modern nation."
 BHU_military_adequate: "Adequate Military Investments"
 BHU_military_adequate_desc: "By investing some of our resources into the military of our nation, we are better able to match the might of our more developed neighbours. However, even with our moderate investments, we still lag far behind the military might of a modern nation."
 BHU_military_moderate: "Moderate Military Investments"
 BHU_military_moderate_desc: "By investing some of our resources into the military of our nation, we are better able to match the might of our more developed neighbours. However, even with our moderate investments, we still lag far behind the military might of a modern nation."
 BHU_military_meagre: "Meagre Military Investments"
 BHU_military_meagre_desc: "By investing some of our resources into the military of our nation, we are better able to match the might of our more developed neighbours. However, even with our meagre investments, we still lag far behind the military might of a modern nation."
 BHU_military_minus_1: "Reduced Military Investments"
 BHU_military_minus_1_desc: "We have reduced our investment into developing the armed forces, freeing up funds for other projects."
 BHU_military_minus_2: "Greatly Reduced Military Investments"
 BHU_military_minus_2_desc: "We have reduced our investment into developing the armed forces, freeing up funds for other projects."

    ### Economic Ideas

 BHU_building_self_sufficiency: "Building Self Sufficiency"
 BHU_building_self_sufficiency_desc: "It is hard to become truly self-sufficient in the modern age, as new and expansive technologies threaten the old way of life. We must catch up to our neighbours, by building our own capabilities as a nation."
 BHU_dreams_of_modernity: "Dreams of Modernity"
 BHU_dreams_of_modernity_desc: "The modern age will not catch up to Bhutan too quickly, as much as many of the old elders worry. But in the minds of the younger generations, dreams of a new age flutter about. What will the future hold for our little mountain realm?"
 BHU_new_building_tech: "New Building Techniques"
 BHU_new_building_tech_desc: "While the old ways of the ancient lamas are tried and proven, and continue to serve as inspiration for our finest builders, we must also look to the future, and accept the new concepts and ideas pouring in from the outside world."
 BHU_building_chukha_hydroelectric: "Building Chukha Hydroelectric"
 BHU_building_chukha_hydroelectric_desc: "Chukha Hydroelectric is the pinnacle of our economic development projects, promising to bring electric power to Bhutan, launching the nation into a new electric future. Of course, if the project ever finishes, that is."
 BHU_importing_coins: "Importing Coins"
 BHU_importing_coins_desc: "The first step to building our own currency is bringing in foreign coinage, to give us the weight to compete in neighbouring markets. While this is a costly expense, it will all prove worthwhile once we are able to hold our own in the markets."
 BHU_nascent_market_economy_1: "Nascent Market Economy"
 BHU_nascent_market_economy_1_desc: "The transition from the traditional economy of barter has been slow, with only a few figures adjacent to the government engaging with concepts like currency. Even still, the beginnings of a new economy can be seen in these corners."
 BHU_nascent_market_economy_2: "Budding Market Economy"
 BHU_nascent_market_economy_2_desc: "In some of the larger towns and markets, merchants have begun to keep tallies of monetary wealth, exchanging notes marking loans and tabs. They are the torchbearers of a new capitalist economy in Bhutan!"
 BHU_nascent_market_economy_3: "Emergent Market Economy"
 BHU_nascent_market_economy_3_desc: "A new system of exchange has risen from the sleepy market towns of our realm, transforming the economic landscape of our realm. Merchants trade in complex figures and sums, and rudimentary banking families give enterprising individuals and communities the ability to pursue their goals in manners never before thought possible!"
 BHU_expanded_government_offices: "Expanded Government Offices"
 BHU_expanded_government_offices_desc: "The new Palace of Happiness has given us the opportunity to house several new courtly offices, allowing us to expand the bureaucracy without losing royal oversight over the growing forces of organization and administration."
 BHU_newarnomics: "Newar-nomics"
 BHU_newarnomics_desc: "The Newar trading families are famed for their extensive Himalayan network of caravansaries and emporiums, as well as their patronage for the oppressed Buddhists of Nepal. Their support will jumpstart our economic recovery."
 BHU_passports: "Diplomatic Initiative"
 BHU_passports_desc: "While the “Foreign Ministry” is nothing more than a couple of enterprising men in a dark backroom in Punakha, there is no doubt that they are zealously committed to bringing Bhutan into the modern diplomatic world. Their projects may be economically impractical and sometimes foolish, but they are trying, and that is what matters!"
 BHU_dead_bandits: "Peace in the Hinterlands"
 BHU_dead_bandits_desc: "It is a rare thing for the wholesale slaughter of half-a-hundred men to increase the relative peacefulness of a region. When the men were like these men, however, it is possible. By destroying three bandit camps in western Bhutan, we have granted hundreds of villagers solace from years of abuse."
 BHU_direct_rule_from_punakha: "Squeezing the Lhotshampa"
 BHU_direct_rule_from_punakha_desc: "For years, the Lhotshampa were able to keep their heads down by kowtowing to absentee Dorji masters. Without Sonam Topgye Dorji and his ilk to hide their numbers and their wealth, however, they can be properly accounted for and taxed. Their blood, sweat, and tears will feed our newly reborn realm!"

    ### Military Ideas

 BHU_what_officers: "Feudal Military Practices"
 BHU_what_officers_desc: "The very concept of a military officer, in the modern sense of the word, is foreign to the armies of Bhutan. Instead, the armed forces are split among the mostly untrained feudal lords, who select trusted subordinates on the basis of their loyalty rather than their talent."
 BHU_modernising_the_military: "Modernising the Military"
 BHU_modernising_the_military_desc: "While we have seen some success in applying new, western theories of hierarchy and organisation to our military forces, we still have miles to go. "
 BHU_specialists_and_auxiliaries: "Specialists and Auxiliaries"
 BHU_specialists_and_auxiliaries_desc: "No army survives with nothing more than the rank-and-file grunt. If we want to have any hope of surviving against foreign arms, we will have to equip and train our finest warriors in more advanced techniques, tactics, and technologies!"
 BHU_cherish_our_rifles: "Cherish our Equipment"
 BHU_cherish_our_rifles_desc: "Each machine gun and mortar is a precious treasure. With no proper local production infrastructure, replacing these advanced weapons is nothing short of impossible. We will have to take great measures to cherish every cannon we have, lest we lose them foolhardily."
 BHU_military_reforms_complete: "New Dragon Regiments"
 BHU_military_reforms_complete_desc: "At the core of our military are the Dragon Regiments, trained and disciplined soldiers that could go toe to toe with any modern fighting force! Though they are few in number, they are an inspiration to all the fighting men of Bhutan, and will serve as the nucleus around which our whole military can grow and evolve."
 BHU_village_musters: "Village Levies"
 BHU_village_musters_desc: "It is a hard thing to convince the young and able men of a village to put down their ploughs and hoes and to take up the rifle and the bow. Yet when the alternative is death at the hands of the enemy, would it not be better to die in fierce battle than cowering in the quiet fields of the valleys?"
 BHU_the_raven_crown: "The Raven Crown"
 BHU_the_raven_crown_desc: "The Raven Crown is a symbol of the power and prestige of the Druk Gyalpo, and it is imperative that it sits upon the head of its rightful owner."
 BHU_mountain_fortress: "Mountain Fortress"
 BHU_mountain_fortress_desc: "Bhutan’s greatest warriors are made of dirt and stone, massive pillars of earth which mark her surface. The massive mountains of the Himalayas force those wishing to move against our nation to pick their points of entry carefully, and give us ample opportunity to prepare for their arrival. We will use our terrain to crush enemies far greater than us! In a mountain pass, each brave defender can fight like twenty men!"

    ### Political Ideas

 BHU_royal_resistance: "Royalist Resistance"
 BHU_royal_resistance_desc: "Wangchuck remnants, disloyal governors, and spurned democrats continue to plague the realm, undercutting our authority and disrespecting our new regime. Should we let these forces fester, they will only dig in deeper."
 BHU_rural_relief: "Rural Relief Efforts"
 BHU_rural_relief_desc: "Our attempts to ease the burden on the countryside has already produced fruit, as the downtrodden peasantry have begun delegating their time and wealth, once near universally claim by tax collectors, to important regional pursuits."
 BHU_lifting_the_boot: "Lifting the Boot"
 BHU_lifting_the_boot_desc: "For generations, the peasantry of Bhutan have been saddled with more and more taxes and obligations, all while their farms grow smaller and opportunities fewer and farther between. With our new tax reforms, we have given these unfortunate souls a chance to breath."
 BHU_assembly_successful: "Fruits of the Assembly"
 BHU_assembly_successful_desc: "Sonam Topgye's proposed advisory assembly has proven itself to be a success with the first delivery of recommendations to the king. While the body is still largely powerless, it has led to newfound confidence in the responsiveness of the royal government, and has empowered figures otherwise invisible. Hopefully it will not serve to embolden detractors, as many more conservative members of court warned against."
 BHU_feudal_order: "Feudalism Entrenched"
 BHU_feudal_order_desc: "Bhutan is built on a vast array of formalised duties and relationships, with each subject afforded a specific role and place in the kingdom, from the lowliest serf to the King himself. It is this system that holds our realm together, an perfect arrangement which should be both supported and celebrated!"
 BHU_sweeping_monastic_privileges: "Sweeping Monastic Privileges"
 BHU_sweeping_monastic_privileges_desc: "Though the members of the monastic council pretend that they are driven only by high-minded notions of duty and loyalty, the truth is that a greased palm or two is worth a lot more than ancient oaths or dutiful principles."
 BHU_traditionalist_shackles: "Traditionalist Shackles"
 BHU_traditionalist_shackles_desc: "Though Sonam Topgye is the most powerful man in Bhutan, his control over the political apparatus of the kingdom is limited by his reliance on the old court bureaucracy of the former king. Until he can build his own base of power, his attempts to reform the country will be opposed at every turn."
 BHU_reasserting_stability: "Reasserting Stability"
 BHU_reasserting_stability_desc: "Though the Zhabdrung has been defeated, the damage to the legitimacy of the monarchy is far from repaired. We will need to reforge the coalitions which carried the Wangchuck clan into power if we wish to once again rule over the realm."
 BHU_web_of_oaths: "The Web of Oaths"
 BHU_web_of_oaths_desc: "The foundation of our kingdom is the web of interpersonal relationships between liege and loyal retainer, bound by layers after layer of ancient feudal oath. It is this web which underpins the coalition around the Wangchuck clan, and it is only through these oaths that we will survive."
 BHU_royal_outriders: "Royal Outriders"
 BHU_royal_outriders_desc: "The King’s cavalry is the closest thing that Bhutan has had to a standing army for decades, a well-trained force of knights devoted to the Wangchuck crown. Though the military situation is changing, they can still serve a vital role as the King’s eyes and ears!"
 BHU_reconciliation_campaign: "Reconciliation Campaign"
 BHU_reconciliation_campaign_desc: "Our arrogance is what nearly brought us low, and it is only through humility and empathy that we can pick up the pieces of Bhutan and hope to put the nation back together again. Concessions will have to be made to our opponents, but in the end a lighter touch will forge a stronger kingdom."
 BHU_retribution_campaign: "Retribution Campaign"
 BHU_retribution_campaign_desc: "The Wangchuck monarchy was threatened only because weak men allowed it to be. For too long, our leaders have been fearful of upsetting the careful balance of Bhutan, and have thus allowed dissent to fester. We will show them that peace is best found at the end of the sword!"
 BHU_reformist_project: "The Reformist Project"
 BHU_reformist_project_desc: "The reform movement in Bhutan spearheaded by Gongzim Sonam Topgye Dorji is aimed at creating limited administrative and economic reform in the kingdom to centralise the state out of the hands of the most stubborn nobility, while granting concessions to a growing class of peasant elites."
 BHU_buddhist_edu: "The Wisdom of the Dharma"
 BHU_buddhist_edu_desc: "It is foolish to spit in the face of the cosmic order of righteousness, as the old Wangchuck regime so often did. They gave lip service to the teachings of the Buddha and his students, while living leaves entirely divorced from his truths. We will bring the righteous path back to the administration of Bhutan!"
 BHU_monastic_primacy: "Monastic Primacy"
 BHU_monastic_primacy_desc: "A vast web of semi-independent monastic fiefdoms serve as the true foundation of power in Bhutan, a force which has been ignored for centuries in favor of petty nobles and scheming court sycophants. We will once again bring the wise and devoted out of the shadows of oppression and into the light!"
 BHU_monastic_tax_reforms: "An End to Tax Harvesting"
 BHU_monastic_tax_reforms_desc: "The practice of tax harvesting is a barbaric practice entrenched by the noble warlords, keen on crushing the spirits of the peasantry under the weight of endless duties and fees. A stop to this practice, though unpopular, is simply the right thing to do."

### Focuses ###
 bhu_rise_of_thunder_dragon: "Rise of the Thunder Dragon"
 bhu_rise_of_thunder_dragon_desc: "The sacred order of the Druk realm shall not merely endure, it will instead flourish! The lotus throne remains firm, the Dharma thrives, the Druk realm remains independent, and order has not been overturned. The Thunder Dragon has awoken, and stands now as the great defenders of the mountains! Those who once wished to lay siege to our homes must now reckon with the power of our realm and the conviction of our people!"
 bhu_lhasa_road: "Expand the Chumbi Valley Roads"
 bhu_lhasa_road_desc: "The primary arteries of trade between Bhutan and the greater Tibetan plateau run from Paro and Haa, through the Chumbi Valley and up to Lhasa. With our newfound commitments to governing Tibet, we must expand these rough trails into a proper road."
 bhu_sponsor_monastic_exchange: "Sponsor Monastic Exchanges"
 bhu_sponsor_monastic_exchange_desc: "There are great thinkers throughout our realm, but without a concerted effort they will remain in their homelands, staying on as the wisest men in ignorant hamlets. By bringing the best and the brightest to Bhutan, we will be able to concentrate their intelligence, and promote cooperation."
 bhu_bring_bhutan_to_every_village: "Bring Bhutan to Every Village"
 bhu_bring_bhutan_to_every_village_desc: "For the peasants scraping together a life in the tiny villages of Nepal and Tibet, our victories have changed nothing. In fact, many may not even know who now rules and protects them. We must show them our generosity and ability, so that every village has a well or granary depicting the great dragon."
 bhu_expel_foreign_parasites: "Expel Foreign Parasites"
 bhu_expel_foreign_parasites_desc: "The Tibetans and Nepalese have given much to foreign experts, allowing a number of them to carve out petty fiefdoms in their great courts. These upjumped colonists have long overstayed their welcome, sucking away the wealth and independence of their hosts. We will cast them out, and look instead to the best and brightest among our trusted courtiers to bring a new age of prosperity and stability to the realm!"
 bhu_airing_out_the_court: "Airing Out the Court"
 bhu_airing_out_the_court_desc: "It does not take long for an inner circle to develop in the halls of power, and oftentimes these insiders will stop at nothing to retain their privileged positions. Our newfound conquests have afforded us a multitude of fresh faces, experts, teachers, and skilled statesmen. We should bring these learned figures to the capital, where we can make use of them!"
 bhu_break_out_the_big_guns: "Break Out the Big Guns"
 bhu_break_out_the_big_guns_desc: "Cannons have been used sparingly in combat in the Himalayas for centuries, though their cost and complexity have prevented anything close to widespread adoption. With our new wealth and power, however, the time may be right to bring them into regular use among our forces."
 bhu_hone_the_knife_tip: "Hone the Knife Tip"
 bhu_hone_the_knife_tip_desc: "It was Bhutan’s bravest warriors who conquered the Himalayas, and it will be the brave sons of Bhutan who will go on to defend these lands. We cannot rely on undisciplined and untrustworthy conscripts to maintain our victory, but instead we must sharpen the edge of our finest soldiers. So long as the feared Dragon Guard stands ready to guard our borders, or to put down insurrection, we will be safe."
 bhu_integrate_the_conquered: "Integrate the Conquered"
 bhu_integrate_the_conquered_desc: "Without newfound allies and collaborators, we cannot hope to hold onto the lands that we have conquered. Retaining and integrating the militias raised by our former enemies is unpopular and potentially dangerous. It may give local notables the legitimacy to undermine our attempts to integrate new lands. However, we cannot simply pretend these lands can be wrangled without new lords and governors - we have little choice should we wish to retain our conquest."

 bhu_expand_irrigation: "Expand Valley Irrigation"
 bhu_expand_irrigation_desc: "Each year, the roughshod irrigation ditches which crosshatch the many valley farms that feed our kingdom degrade and fall into disrepair. Many communities lack the manpower to properly maintain these vital sources of water, meaning that additional labour must be thrown together by feudal lords to bring them back to life."
 bhu_enforce_trongsa_law: "Enforce Trongsa Law"
 bhu_enforce_trongsa_law_desc: "Bhutan is a patchwork of local customs and laws, often loosely regulated to the primary benefit of the petty lords who act as lawmakers and judges in equal measure. In the King’s own personal fief, many villages and communities have slipped away from the traditional norms of Trongsa, the ancestral seat of the Wangchuck clan. We should resolve this."
 bhu_deal_with_unsanctioned_taxation: "Deal with Unsanctioned Taxation"
 bhu_deal_with_unsanctioned_taxation_desc: "The lines between the domain of one leader and another are blurry in Bhutan, meaning that one peasant may have two or more figures demanding a portion of their harvest, leaving them with nothing. These alternative lieges, leeches sucking away the blood of the royal subjects, must be dealt with, with force if necessary."
 bhu_investigate_dissenter_monks: "Investigate Dissenter Monks"
 bhu_investigate_dissenter_monks_desc: "The recent rise of the Zhabdrung Jigme Dorji has led to the slow but steady decline of monastic homogeneity, as the young and restless turn away from their elders and towards this new voice. These dissenting voices must be examined and handled, lest their rot spread more broadly within the most foundational institution of Bhutan."
 bhu_raising_a_host: "Raising the Royal Host"
 bhu_raising_a_host_desc: "Raising an army in Bhutan is not an easy or simple process. There are no timetables of mobilisation, no lists of reserves, and no standing army to draw upon. Instead, there are complex feudal relationships and unsteady lines of communication to rely upon, meaning that calling for a Royal Host is an exercise in futility, measured in months, not weeks."
 bhu_secure_the_borders: "Secure the Borders"
 bhu_secure_the_borders_desc: "When our eyes turn inward to conflicts within the borders of the mountain kingdom, our neighbours may take notice. At the best of times, the lines between our kingdom and her neighbours are blurry and poorly guarded. In these dire times, some thought may be well served towards securing the borders, if only to ensure our stability."
 bhu_repair_ta_dzong: "Secure our Dzongs"
 bhu_repair_ta_dzong_desc: "The Dzong fortresses are the beating hearts of our communities, but years of peace and poor maintenance have left their heartbeat irregular and faint. Our present enemy will likely be aware of all the blindspots, weaknesses, and gaps which mar these forts, and significant work will be needed to return them to the bulwarks they once were."
 bhu_reorganise_the_royal_guard: "Reorganise the Royal Guard"
 bhu_reorganise_the_royal_guard_desc: "While Bhutan has no standing army, the King has traditionally been protected by a small cadre of hardened warriors. While the civil war which brought King Ugyen into power had sharpened his guards into a genuine fighting force, more recently the guards have become much more ceremonial. We must reverse this trend."
 bhu_reassure_our_neighbours: "Reassure our Neighbours"
 bhu_reassure_our_neighbours_desc: "Trade is the life blood of any nation, even one as isolated as Bhutan. Instability typically gives pause to the wandering merchants of India and Tibet, and their absence only brings about more instability, as communities go without the foreign staples they have come to rely upon. By convincing our neighbours that their traders will be protected, we can avoid this."
 bhu_drill_our_regulars: "Drill our Regulars"
 bhu_drill_our_regulars_desc: "The March on Cheri has brought a great number of warriors together, and given many men the chance to prove themselves in pitched battle. Those who proved themselves particularly capable and brave should be remembered and recruited, so that they can properly train and learn as professional warriors."
 bhu_organise_village_defense: "Organise Village Defenses"
 bhu_organise_village_defense_desc: "Times of instability typically breed bandits, who prey on isolated villages with impunity. By banding small clusters of regional villages together under unified defenses with collective militias, they may stand a much better chance at resisting the highland wolfpacks, regardless of the absence of their lord and his warriors."
 bhu_end_revolution: "Cinders of the Revolt"
 bhu_end_revolution_desc: "A season of violence has bled our nation dry and left it a smoldering wreck. Yet these fires of revolution have cleansed Bhutan of the rot of stagnation, leaving a blank canvas for us to work with. We must sweep away the cinders to seize upon this opportunity to tackle the problems endemic to our nation, reforming the dysfunctional systems which have long plagued Bhutan into our vision of a perfect government."

 bhu_deal_with_banditry: "Deal with Banditry"
 bhu_deal_with_banditry_desc: "While open conflict has subsided in Bhutan, bandits continue to plague villages and communities across the realm, entrenching themselves into valley passes and the highlands. Local village militias will not be able to deal with these animals on their own, especially considering that many of their best lie buried at Cheri. We will have to smoke out these monsters ourselves."
 bhu_reconcile_with_the_monks: "Reconcile with the Monks"
 bhu_reconcile_with_the_monks_desc: "Monastic revolters served as the foundation of the Zhabdrung’s supporters, and their rejection of the traditional relationship between the king and the Je Khenpo has left the Zhung Dratshang reeling. We must forge a new compact with those who remained loyal to the crown."
 bhu_unify_the_royal_cause: "Unify the Royal Cause"
 bhu_unify_the_royal_cause_desc: "Much of the damage done by the Zhabdrung was only possible due to the weakness of the royal coalition, which was left divided by decades of infighting. We must pull the traditionalists and reformers back together if we wish to maintain our grip on the nation."
 bhu_weave_the_web_of_oaths: "Weave the Web of Oaths"
 bhu_weave_the_web_of_oaths_desc: "The foundation of our nation is not law, but rather the web of interpersonal relationships which, when woven together, holds our society together. The recent conflict has opened fresh wounds among those we consider our vassals and allies, and now is as good a time as any to revive their ancient oaths to the crown."

 bhu_the_tightened_fist: "The Tightened Fist"
 bhu_the_tightened_fist_desc: "The near dissolution of the Bhutanese monarchy at the hands of an upjumped bandit monk has left our court reeling. Yet there is a clear answer to the questions it has left us: we have grown too soft in our years of peace, allowing too much dissent to grow throughout our society without response. We must clamp down, before a new revolutionary rises."
 bhu_entrench_the_feudal_compact: "Entrench the Feudal Compact"
 bhu_entrench_the_feudal_compact_desc: "Long has our nation relied on the blood, sweat, and tears of our landless serfs. While some are keen to upturn this traditional source of labour, their haste only reflects their naivety. It is clear that serfs are the bedrock of our society, and that we should entrench, clarify, and codify the feudal foundation of Bhutan."
 bhu_perserve_the_social_order: "Preserve the Social Order"
 bhu_perserve_the_social_order_desc: "Our new regime cannot hope to rely on the goodwill of those who once opposed us. When the Zhabdrung rose up against his king, he was joined by thousands who wished to destroy the feudal order which holds our kingdom together. The rules which serve as the bedrock of our society must be enforced, lest they once again get ideas."
 bhu_curtail_wayward_penlops: "Curtail Wayward Penlops"
 bhu_curtail_wayward_penlops_desc: "Many Penlops came out in support of our rivals during the recent struggle for the throne. Purging those who are disloyal may weaken our government in the short term, but no great Dzong was built upon a rotten structure. While most will eventually be forgiven for their mistakes, some must be reminded of the true price of treason."
 bhu_militant_court: "The Militant Court"
 bhu_militant_court_desc: "The Traditionalist faction in court has long called itself the sword and shield of Bhutan. With the blessing of the military elite underpinning this faction, the Druk Gyalpo can now stand as the undisputed wielder of that sword and shield, fostering a court of seasoned military advisors to guide the crown."
 bhu_create_military_school: "Fear Not the Future"
 bhu_create_military_school_desc: "Many believe that the traditionalists are backwards yokels who fear the new technologies of the outside world, but this notion could not be further from the truth. Regardless of our aversion to foreign domination, we will hire educators from abroad to teach new military and technological advances to the next generation of Bhutanese minds."
 bhu_gather_the_royal_riders: "Gather the Royal Riders"
 bhu_gather_the_royal_riders_desc: "The king cannot rely upon his personal guards to protect his person and simultaneously act as his primary military agents across the kingdom. A new cadre of elite mounted warriors, pulled from the most prestigious and loyal noble houses of the kingdom, will act as the royal fist, ensuring that the king’s will is felt in every corner of Bhutan."

 bhu_the_open_palm: "The Open Palm"
 bhu_the_open_palm_desc: "The sudden rise of the Zhabdrung as a champion of the people of Bhutan has proved the danger of the court’s cowardly isolation from the miserable feudal reality of their realm. We must move quickly to provide limited but genuine reform to our society, lest we once again lose our grip on the nation at the hands of another upstart."
 bhu_providing_rural_relief: "Providing Rural Relief"
 bhu_providing_rural_relief_desc: "The notion of government intervention into the villages of Bhutan is next to unheard of. In fact, the average villager is likely to have little idea of who rules over them, aside from their local Gewog elders and perhaps their nearest Penlop lord. Certain projects led by the central government could help the rural masses, reminding the peasants of who actually leads them."
 bhu_alleviate_tsatong_appropriations: "Alleviate Tsatong Appropriations"
 bhu_alleviate_tsatong_appropriations_desc: "The people of our kingdom suffer under the thumb of various overlapping taxes, leaving them with next to nothing to survive on. Few are more hated than the Tsatong Tax, which hits peasant families while they are most vulnerable. Putting a pause on the Tsatong while we look for viable alternatives would certainly ingratiate us to our subjects."
 bhu_codify_customary_law: "Codify Customary Law"
 bhu_codify_customary_law_desc: "One of the main issues befalling our subjects is the confusion regarding their privileges and responsibilities under the various customary legal schemes throughout the kingdom, an issue which many lords take advantage of for personal gain. We must clarify and codify the law."
 bhu_new_civil_service: "The Beginnings of a Civil Service"
 bhu_new_civil_service_desc: "Civil servants are the life-blood of any great kingdom, bringing the rule of the king to the far corners of their realm. In Bhutan, however, the government’s will is brought about by an army of scheming and corrupt courtiers. We must build a new cadre of bureaucrats around a core of loyal and energetic men, devoted to Bhutan."
 bhu_national_assembly: "Call for a National Assembly"
 bhu_national_assembly_desc: "For generations, the people of Bhutan have had few means to issue complaints to their betters. Without any methods of managing these issues and grievances, many of the village gewogs turned to the Zhabdrung in hopes of a better future. We must listen to the people of our kingdom, by forming an advisory council which can properly inform the king of more local struggles."
 bhu_punakha_academy: " Open the First Lobdra School"
 bhu_punakha_academy_desc: "Traditionally, Bhutanese education was the realm of tutors and the Buddhist Shedra schools. By creating a new secular house of learning in Punakha, the Rigney Lobdra, we will provide for a new generation of leaders and administrators. We will need to look outside the bounds of our realm to learn the educational techniques of the modern world, combining them with the traditions of our kingdom."

 bhu_eliminate_the_royals: "Eliminate the Remnant Royals"
 bhu_eliminate_the_royals_desc: "We do not wish to merely rule over Bhutan as the successors of the weak and cowardly Wangchuck Clan. We will purge this legacy of failure, starting with the greedy Reformists, who sold our country to the Indians for a paltry price. Enemies and traitors lurk in every Dzong and monastery, and Bhutan will not be truly free until they are all silenced."
 bhu_bind_intransigent_elders: "Bind Intransigent Elders"
 bhu_bind_intransigent_elders_desc: "There are multitudes of monks who supported the old monarchical Wangchuck regime, but whose goals and beliefs broadly align with our own. Misguided by their elderly stubbornness, these fossils turned their backs on the Zhabdrung when he needed them most. Even still, they deserve to see the realisation of the Zhabdrung’s glorious restoration, and their wisdom may prove useful in the coming years."
 bhu_deal_with_opportunists: "Deal with the Opportunists"
 bhu_deal_with_opportunists_desc: "We came to power on a vast wave of discontent, binding together thousands from all walks of life who felt abandoned by the Wangchuck kings. Of course, some of those ostracised by the old regime were little more than bandits, who have since used the momentum of our victory to carve out tiny fiefdoms, terrorising villages as “loyal representatives” of the Zhabdrung. They will need to be stopped."
 bhu_reel_in_the_radicals: "Reel in the Radicals"
 bhu_reel_in_the_radicals_desc: "The foundation for support for the Zhabdrung’s rise to power were the masses of younger monks who chafed against the impotence of the weak elders. These radical figures have called for revolutionary change, seeking to return Bhutan to a golden age of legend. Such proposals would undercut the Zhabdrung’s own plans. These radicals must be constrained, before they seize control of our new movement!"
 bhu_where_faith_governs: "Where Faith Governs"
 bhu_where_faith_governs_desc: "The peoples of Bhutan are Buddhist first, and Bhutanese second. This devotion towards both the Drukpa Kagyu and Nyingma Lineages of Buddhism is the foundation of our culture and heritage. It is natural, then, that faith should be the guiding principle of our government, with the tenets of the Zhabdrung guiding our government at the Nyingma rituals enriching our people."
 bhu_exalt_buddhist_canon: "Exalt Buddhist Canon"
 bhu_exalt_buddhist_canon_desc: "The 108-volume Kangyur and 225-volume Tengyur make up the basis of the Tibetan Buddhist Canon. The Zhabdrung has proclaimed his intention to sponsor the creation of spectacular calligraphic editions of the two foundational works, for the prestige of our government and the betterment of Buddhists across Bhutan."
 bhu_reform_tsa_yig: "Reform the Tsa Yig"
 bhu_reform_tsa_yig_desc: "The Tsa Yig legal code is rooted in hundreds of years of theological reassessment and refinement, carried out by generations of wise monastic leaders. The present reincarnation of the Zhabdrung Rinpoche will join them in further reforming and codifying the Tsa Yig, to reflect the unique challenges of the modern day, as well as the unique strength of the present Zhabdrung incarnation."
 bhu_confirm_clerical_authority: "Confirm Clerical Authority"
 bhu_confirm_clerical_authority_desc: "The lines between spiritual and temporal power have grown increasingly blurry following the rise of the Zhabdrung and the restoration of a powerless Druk Desi regent. While ancient tradition grants sweeping powers to the Zhabdrung, certain privileges granted to the regent and Penlops by weaker past incarnations must again be wrestled away from these corrupt hands."
 bhu_fund_monastic_schools: "Fund New Shedra Colleges"
 bhu_fund_monastic_schools_desc: "Shedra monastic schools have traditionally driven higher learning across Bhutan, with most of the nation’s finest minds having been honed in these halls of wisdom. While the misguided push for new secular schools, we know that they are nothing more than pale imitations of the traditional Shedra colleges, which enrich students both spiritually and educationally."
 bhu_welfare_through_the_monasteries: "Welfare through the Monasteries"
 bhu_welfare_through_the_monasteries_desc: "Monasteries have long served as the centres of local communities, providing key services to surrounding villages. Beyond their role as focal points of local life, monasteries have also traditionally provided aid to their neighbours in times of need. These monasteries are well equipped to act as the arbiters of welfare, and should be supported in this role."
 bhu_the_diarchy_rejuvenated: "The Diarchy Rejuvenated"
 bhu_the_diarchy_rejuvenated_desc: "Ngawang Namgyal, the first Zhabdrung incarnation, crafted the Diarchy purposefully, delegating powers to the Je Khenpo and Druk Desi to stabilise the realm following his death. He did not foresee that these agents of his will would attempt to poison his creation by clawing away at the central, unifying figure of the Zhabdrung. Finally, we have restored the Diarchy as he envisioned it!"

 bhu_standardise_weights_and_measures: "Standardise Weights and Measures"
 bhu_standardise_weights_and_measures_desc: "Establishing uniform standards of weight and measure is an essential foundation for modern administration. While each community clutches their traditional means and methods of measuring, this heterogeneity only serves to create confusion and arrest cross-community trade and cooperation. Presenting universally accepted methods of weighing and measuring goods will simplify trade, taxation, and administration."
 bhu_stamp_our_own_coins: "Promote Currency Usage"
 bhu_stamp_our_own_coins_desc: "For hundreds of years, what little coinage is used in Bhutan has come from abroad, either in the form of silver Qing wen or Tibetan srangs, or Indian rupees. While we lack the local supply of precious metals to form the basis for a genuine currency, we can mint a limited number of our own silver coins, the ngultrum, controlled entirely by our own mint, to supplement foreign coinage."
 bhu_dzongs_for_a_new_age: "Dzongs for a New Age"
 bhu_dzongs_for_a_new_age_desc: "Dzong fortress often serve as the heart of a community, as the seat of local leaders, the center of local commerce, and the shelter against disasters both natural and man made. It has been quite some time since new dzongs have been built, or existing dzongs refurbished, leaving many communities without these vital hubs."
 bhu_fortify_key_passes: "Fortify Key Passes"
 bhu_fortify_key_passes_desc: "Our mountain realm is connected to the outside world by a number of small mountain passes in the north and south of the nation. These passes are the gateway between our lands and the outside world, and if we wish to regulate our borders, take control of our trade, and defend our homes, we will need to protect these passes with a system of modern fortifications."
 bhu_build_new_workshops: "Build New Workshops"
 bhu_build_new_workshops_desc: "The small cottage workshops dotting villages and towns are the backbone of Bhutan’s meager industrial development. These tiny workshops, typically run by a single family, cannot meet the needs of the nation indefinitely. New projects, far larger in scope, may help to bring the nation into the era of the industrial revolution."
 bhu_exploit_our_natural_resources: "Exploit the Bounty of the Mountains"
 bhu_exploit_our_natural_resources_desc: "Traditionally, those seeking sources of metal in Bhutan have carved out small adits with hand tools, to little success. That is not to say that there are not bountiful resources, ready for the harvest! Certain veins of valuable mineral resources may be properly exploited with more determined and organised mining attempts, sponsored by the central government."
 bhu_hew_the_forests: "Hew the Lowland Forests"
 bhu_hew_the_forests_desc: "Most of Bhutan is covered by forests, with a vast diversity of trees ranging from the lowland hardwoods and the alpine evergreens. Wood is the primary source of building materials and fuels, and the development of our wood harvesting industry will serve as the bedrock for future economic development."
 bhu_introduce_crop_rotation: "Introduce Crop Rotation"
 bhu_introduce_crop_rotation_desc: "The farmers of Bhutan typically take advantage of cultivation shifting, leaving significant swathes of arable land fallow on each given year so that it can recover. By introducing a number of hardier crops which can actively rejuvenate soil through fallow years, we can better use the land available to us."
 bhu_introduce_new_building_techniques: "Introduce New Building Techniques"
 bhu_introduce_new_building_techniques_desc: "When a large building project is undertaken in our land, the builders typically look to the past for inspiration, attempting to replicate the lamaseries of famed ancient incarnations. While not forgetting this tradition, we must also learn to look forward, into the future, for our inspiration. New techniques and designs are available to us, and we shall build with them!"
 bhu_lay_down_lateral_road: "Lay Down the Lateral Road"
 bhu_lay_down_lateral_road_desc: "The vast majority of roads and paths across Bhutan stretch from north to south, allowing for the transfer of people and goods between Tibet and India, but doing nothing to connect the communities of our nation. A new road connecting the major population centers of the country will be expensive and difficult, but vital to our future."
 bhu_revitalise_trade_routes: "Revitalise Trade Routes"
 bhu_revitalise_trade_routes_desc: "Whether or not we are particularly happy with the nations which surround Bhutan, many resources we have come to rely on must come from foreign lands, often travelling thousands of miles before arriving at our doorstep. We must develop new merchant contacts in neighbouring nations, while reasserting our balance of trade through new exports."
 bhu_smuggle_foreign_arms: "Smuggle Foreign Arms"
 bhu_smuggle_foreign_arms_desc: "While it is not a pretty business to smuggle rifles, the survival of our nation depends upon our ability to obtain modern weaponry. There are a number of shady characters in India and China who are more than willing to “lose” a few rifles entrusted into their care, for the right price of course."
 bhu_import_foreign_machinery: "Import Foreign Machinery"
 bhu_import_foreign_machinery_desc: "While most tasks can be solved by the widespread system of corvee labour which keeps our nation running, our new dreams of industrial expansion require new metal machines of construction and transport. There is little use for automobiles and roadsters in a nation with no true roads, but purchasing vehicles today may lead to great advances in the future."
 bhu_monopolise_salt_imports: "Monopolise Salt Imports"
 bhu_monopolise_salt_imports_desc: "Salt is one of our nation’s key imports, as there are next to no local sources to harvest. By asserting central governmental control over the import of this resource, we can regulate the increasing foreign control over our newborn economy and also secure a lucrative source of revenue."
 bhu_harnessing_the_dragon: "Dare to Harness the Dragon"
 bhu_harnessing_the_dragon_desc: "Bhutan is a vast expanse of divine lands, untamed by man for as long as he has walked through her valleys, swum through her rivers, and climbed over her mountains. We are currently far from able to take advantage of the significant natural resources found in our realm, but the future fast approaches! We will march victoriously into the twentieth century!"

 bhu_bowstring_to_gunshot: "Bowstring to Gun Barrel"
 bhu_bowstring_to_gunshot_desc: "For centuries, the great bowmen of Bhutan formed the core of any lord’s army, and the snap and twang of loosed arrows was the sound of warfare. Today, the crack of muskets and rifles have become the new harbingers of death. If we wish to survive, we will have to move on from our legacy as a nation of archers, to embrace the harsh realities of modern war."
 bhu_next_generation_leaders: "The Next Generation of Leaders"
 bhu_next_generation_leaders_desc: "For too long, we have remained stalwart in the belief that our natural mountainous barriers will protect us from the horrors of modern war. But such stagnant thinking can no longer be tolerated. We need a new generation of fresh young minds to again think of how best to protect Bhutan from the external threats we face."
 bhu_noble_officers: "Draw on Noble Officers"
 bhu_noble_officers_desc: "The nobility of Bhutan is an eclectic mix of petty feudal lords and sage abbots, many with lineages stretching into the medieval age. From these ancient lines, certain families have proven their worth as martial masters, their prowess hammered into a fine edge by centuries of invasion, conflict, and civil war. It is the scions of these clans and households that we should draw our next generation of leaders."
 bhu_meritocratic_approach: "A More Meritocratic Approach"
 bhu_meritocratic_approach_desc: "While the noble families of Bhutan have generated many of its best minds and bravest hearts, the civil strife of the last year has shown that men from across the societal spectrum can rise to the occasion. We should elevate some of the figures who availed themselves at times of crisis, regardless of their birth."
 bhu_study_distant_doctrines: "Study Distant Doctrines"
 bhu_study_distant_doctrines_desc: "The adoption of new weaponry must be accompanied by the adoption of new tactics. The relatively close-quarters fighting of archers and spearmen cannot be matched to the new, rifle wielding, foundation of our army. We should look to the tactics practiced by other nations during the last wars to help make sense of these changes."
 bhu_establish_muster_rolls: "Establish Muster Rolls"
 bhu_establish_muster_rolls_desc: "Traditionally nobles would draw upon each family to volunteer one able-bodied man to serve as a soldier during times of crisis. We will modify this system, calling on families to volunteer one son to join the ranks of our reserves. These men will serve as the bulk of our new modern army."
 bhu_marshalling_our_men: "Marshalling our Men"
 bhu_marshalling_our_men_desc: "The gathering and mobilisation of our manpower is a taxing endeavour, one which stretches our administrative and logistical capabilities to their limits. Yet our nation cannot be protected without protectors, and it may be worth expending political and economic capital to place more rifles in more hands."
 bhu_lessons_in_logistics: "Lessons in Logistics"
 bhu_lessons_in_logistics_desc: "An army marches on its stomach, and in a feudal army such as ours that means that the larders local to our military movements will be invariably raided. Supply chains are a difficult matter to organise, but simple efforts to supply soldiers with staple rations can help them to fight better, longer, and with less damage to the local peasantry."
 bhu_dust_off_stockpiles: "Maintaining the Stockpiles"
 bhu_dust_off_stockpiles_desc: "Many regional lords treasure the rifles that they have, dutifully maintaining weapons which are decades, or even centuries, old. We must broadly apply these principles, developed over generations, which have been so effective in keeping these guns in working order. Every new rifle must be treated as an invaluable prize, carefully mended and maintained."
 bhu_arms_by_necessity: "Arms by Necessity"
 bhu_arms_by_necessity_desc: "Few wish to be considered a looter, and no nation wants to hold the reputation as a realm of scavengers. Yet the need for modern weapons is great, and there is no better opportunity to gather new gear than from the corpse of a fallen foe. Our armies should be joined by resourceful tinkerers, who can repurpose the weapons of our enemies for our benefit."
 bhu_equipping_specialised_units: "Equipping Modern Cadres"
 bhu_equipping_specialised_units_desc: "What little modern equipment that makes it into Bhutan is spread thin, greedily squirreled away by individuals as prized possessions. By giving select groups of elite warriors access to more substantial stocks of modern equipment, we can use them as specialists to support our more ragtag regulars."
 bhu_recruit_mountain_guides: "Recruit Mountain Guides"
 bhu_recruit_mountain_guides_desc: "There are some among us for whom the great peaks are home, who know the treacherous passes and hidden valleys like old friends. These men hold vital information, and would make for excellent guides for our armies, passing both their knowledge of our home and their mountaineering expertise along to their comrades in arms."
 bhu_lords_of_the_passes: "Lords of the Passes"
 bhu_lords_of_the_passes_desc: "Bhutan is our home, and we know her well. Each narrow mule trail is the site of a potential ambush, each hidden vale is an encampment denied to our enemies. We will chart out the borderlands, finding advantageous grounds to harass invaders and chokepoints we can best defend."
 bhu_use_every_advantage: "Use Every Advantage"
 bhu_use_every_advantage_desc: "We will need to rely on the grit and determination of our soldiers to make up for our more material deficiencies, leveraging reconnaissance to fight in favorable conditions and defensible terrain. Recruiting seasoned scouts to screen our forces will greatly help us to level the playing field."
 bhu_a_force_apart: "A New Force Apart"
 bhu_a_force_apart_desc: "During the visit of British expeditionary forces at the turn of the century, we looked to their professional soldiers with awe and envy. Today, our elite core carry themselves with discipline and skill that would put those prancing peacocks to shame."

