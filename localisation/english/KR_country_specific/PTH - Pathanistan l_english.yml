### Ideas ###

 PTH_development_of_islamic_socialism: "Developing Islamic Socialism"
 PTH_development_of_islamic_socialism_desc: "Popalzai has begun implementing a wide variety of socialist reforms aimed at modernising the nascent republic and establishing a successful Islamic Socialist government. It will be a difficult process, and so it might take some time for his policies to come to fruition."
 PTH_model_of_islamic_socialism_idea: "Model of Islamic Socialism"
 PTH_model_of_islamic_socialism_idea_desc: "Popalzai's policies have catapulted Pathanistan from a feudal backwater into a role model for Islamic Socialists worldwide!"
 PTH_state_controlled_media: "State-Controlled Media"
 PTH_state_controlled_media_desc: "Naujawan Sarfarosh, the personal publication of Abdur Rahim Popalzai, has become the only legal news source across the entirety of Pathanistan. This has made it incredibly difficult for those with differing political views to propagate their beliefs, giving the government a monopoly on the truth."
 PTH_building_the_islamic_progressive_ideal: "Building the Islamic Progressive Ideal"
 PTH_building_the_islamic_progressive_ideal_desc: "Abdul Ghaffar Khan's vision of a progressive nation-state built on Islamic ideals is not a simple undertaking. In spite of the challenges present, the effort is being put in to fulfil his vision."
 PTH_beacon_of_islamic_progressivism: "Beacon of Islamic Progressivism"
 PTH_beacon_of_islamic_progressivism_desc: "Pathanistan's success story is resonating from Central Asia to the Sahara, inspiring progressive Islamic philosophers and politicians alike!"
 PTH_surge_of_pathan_nationalism: "Surge of Pathan Nationalism"
 PTH_surge_of_pathan_nationalism_desc: "Despite its existential challenges, the efforts of [FROM.GetLeader] have ushered in a new age of nationalism for the nascent Republic of Pathanistan."
 PTH_a_new_national_party_1: "A New National Party"
 PTH_a_new_national_party_1_desc: "Despite playing second fiddle to the political machines of the Marxist Maulana and Bacha Khan for a significant period of time, the United Muslims Nationalist Party has found itself in a leading role at last. [FROM.GetLeader] is making strides in expanding the party and earning the trust and loyalty of the many people of Pathanistan."
 PTH_a_new_national_party_2: "Dawn of the Party State"
 PTH_a_new_national_party_2_desc: "[FROM.GetLeader]'s ambitious party bureaucracy expansion project has paid off. The United Muslims Nationalist Party has become the pre-eminent political force in Pathanistan, credibly challenged by few others."
 PTH_tribal_autonomy: "Tribal Autonomies"
 PTH_tribal_autonomy_desc: "Pathanistan is host to a hodgepodge of tribes and even some princes who have maintained their realms since the days of the British Raj. To maintain the stability of the realm, the government has given them autonomy in managing their internal affairs."
 PTH_loy_waziristan_idea: "Loy Waziristan"
 PTH_loy_waziristan_idea_desc: "Pathanistan finds itself under the rule of the Faqir of Ipi, tribal chief from the Torikhel branch of the Utmanzai Wazir tribe. While he claims to represent all Pathan people, many feel that his ascendance is not so much a victory for the Pathan people as it is for Waziristan itself."
 PTH_puppet_pathan_jirga: "Puppet Pathan Jirga"
 PTH_puppet_pathan_jirga_desc: "Pathanistan's formal legislative system is entirely controlled by the Pathan Jirga, a tribal council which in practice is entirely loyal to the Faqir of Ipi."
 PTH_self_sufficiency: "Self-Sufficiency"
 PTH_self_sufficiency_desc: "Lacking significant resources of its own, and having little way to access them from the outside world, the people of Pathanistan have begun to get very creative when it comes to resource usage, fostering a greatly improved sense of self-sufficiency."
 PTH_swat_gemstone_trade: "Swat Gemstone Trade"
 PTH_swat_gemstone_trade_desc: "The northern region of Swat is host to a rich gemstone mining industry, one which accounts for most of Pathanistan's exports and external revenue."
 PTH_pathan_army_1: "The Army of Pathanistan"
 PTH_pathan_army_1_desc: "The army of Pathanistan, perhaps smaller in size than neighbouring militaries, is still fierce and highly disciplined. Those seeking to violate the sovereignty of Pathanistan will find themselves tussling with a force determined to defend its right to exist!"
 PTH_insurrectionary_movement: "Insurrectionary Movement"
 PTH_insurrectionary_movement_desc: "The people of the Frontier thought that breaking free of Britain and unifying with Afghanistan would free them from oppression by faraway governments, yet it seems they were mistaken. Angry tribesmen, Indian-backed militants, and army defectors all now flock together under the red, black, and white banner of the Pathan state. They now stand ready to fight for their homeland's freedom, yet disdain having to spill the blood of their fellow Pashtuns to do so."
 PTH_afghan_deserters: "Afghan Deserters"
 PTH_afghan_deserters_desc: "Due to dissatisfaction in the ranks of the Afghan Army, several Afghan troops have deserted and are instead fighting under our banner where they will be supervised less strictly (and in some cases paid better)."
 PTH_neither_afghan_nor_indian: "Neither Afghan nor Indian"
 PTH_neither_afghan_nor_indian_desc: "Lacking international recognition, and considered simply as a rebel occupied province by both of its neighbours, trading with the outside world is virtually impossible for Pathanistan. Although they stand at odds with those who claim their lands, perhaps in time a compromise must be made with at least one of them to ensure that Pathan rule over their homeland is preserved in some form."
 PTH_confused_national_ambitions: "Confused National Ambitions"
 PTH_confused_national_ambitions_desc: "The idea of an independent Pathan state is considered by those fighting for it as an issue forced upon them, rather than one they have actively wished for. Most believe themselves to be intrinsically linked with their fellow Pashtuns across the Khyber Pass, yet government tyranny has forcefully separated them once more. Others believe integrating into a composite India would guarantee regional safety, although many within this group struggle to see any Indian government agreeing to and actually upholding a deal along these lines. Perhaps in time a position will at last be agreed upon, or perhaps a strong hand will come along to force the issue for them..."

 PTH_blockade_tt: "§tSo long as our only reliable vein of trade is by land, we are powerless against a blockade from both India and Afghanistan!§!"

 PTH_haji_sahab: "Haji Sahab"

