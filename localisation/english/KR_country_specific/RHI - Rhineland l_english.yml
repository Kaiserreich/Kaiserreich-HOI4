### Characters ###
 RHI_georg_kunz: "George Kunz"
 RHI_georg_kunz_leader_desc: "§YBorn:§! §L1888, in the Palatinate, Kingdom of Bavaria, German Empire§!\n§YBackground:§! §LAn obscure Palatinate labour leader and separatist, Georg Kunz co-founded the Rhenish Workers' Party along with Franz Josef Heinz in Speyer in around March 1930. A fringe socialist group, it gained some notoriety during the Ruhrkamf when German intelligence exaggerated their threat to discredit the broader unrest. In practice, it boasted at most a few thousand members - with limited activity even among those members. Nevertheless, when socialist occupation forces sought to split off the Rhineland into an independent republic and more prominent groups turned down offers to lead the new state in disgust, Kunz was ultimately handed the job despite the belief by some that he is too unpopular and possibly too moderate in policy.§!"

 RHI_josef_smeets: "Josef Smeets"
 RHI_josef_smeets_leader_desc: "§YBorn:§! §LSeptember 29th, 1893, in Aachen, Rhine Province, Kingdom of Prussia, German Empire§!\n§YBackground:§! §LFranz Joseph Hubert Smeets was a dentist's apprentice before the Great War, and during the conflict served as an orderly for the Red Cross. He joined the SPD in Cologne but quickly switched to the USPD instead - becoming its local party secretary. He became an editor for the socialist adjacent Der Ventilator, becoming the face of the paper because its financiers and authors wanted to remain anonymous.\n\nFalling out of favor with the USPD, after recent military disasters, Smeets and his friends left the party to form the Rhineland League to clamour for a an autonomous Rhenist Republic that would serve as a state for socialist workers. With the surrender of Germany imminent, they were renamed the Rhenist Republican People's Party and began publishing \"Rheinische Republik\" - calling for a \"free Rhineland\" that would be a fully independent buffer state between Prussian dominated Germany and France. He provocatively declared \"we protest against the fact that the income from the Rhineland is squandered in Berlin on a life of indulgence. We are not Prussians and do not want to be.\"\n\nThis attitude brought tremendous condemnation from most Germans, but piqued the interest of occupying authorities who have made the grave decision to create a separate Rhenish state. With few more legitimate options available, Smeets was selected to helm the new government.§!"

 RHI_josef_friedrich_matthes: "Josef Friedrich Matthes"
 RHI_josef_friedrich_matthes_leader_desc: "§YBorn:§! §LFebruary 10th, 1886, in Würzburg, Lower Franconia, Kingdom of Bavaria, German Empire§!\n§YBackground:§! §LBorn to a theater secretary, Josef Friedrich Matthes attended gymnasium for two years but did not graduate. He spent his career as an editor for various local liberal newspapers and also spent a year abroad in Switzerland, France, and Belgium where he started a family. He helped establish progressive youth associations in different Aschaffenburg and Passau, locking horns with local Mayors - boasting that his work helped force one (Mayor Otto Wippermann of Oberhausen) to resign. He also wrote in favor of a nationalist war aims policy during the Great War.\n\nA minor figure in the region, achieving some fame/notoriety for his writing and investigative journalism (including uncovering some corruption scandals) - he participated in liberal and SPD politics but never fit in well with either for long thanks in part due to his combative nature. When foreign occupation forces arrived, he jumped at the chance to found a \"Rhenish Independence League\". With more prominent politicians in the Rhineland refusing to participate in the separatist project pushed by foreign occupiers, Matthes was ultimately selected for the role.§!"

 RHI_hans_adam_dorten: "Hans Adam Dorten"
 RHI_hans_adam_dorten_leader_desc: "§YBorn:§! §LFebruary 10th, 1880, in Bonn, Rhine Province, Kingdom of Prussia, German Empire§!\n§YBackground:§! §LBorn to a wealthy porcelain manufacturing company owner, Hans Adam Dorten studied law - graduating in 1907 from Leipzig University. He worked briefly at a prosecutor's office and later at a district court before he was conscripted in 1914 to fight in the Great War. he served in the 54th \"Commando\" Corps as a junior officer and won an Iron Cross.\n\nAfter the war he married a wealthy wife and engaged in politics, with a strict anti-socialist stance and vague policies beyond that. It seems he began to dabble in regionalist policies - suspicious of \"Protestant\" Prussia. A political dilettante, his wealth and connections allowed him to maintain ties with various local politicians including Konrad Adenauer but he mostly remained on the fringe as a minor lawyer and jurist.\n\nHe achieved a brief uptick in fame prosecuting socialists in the Ruhrkampf, but would've faced historical obscurity if it was not for Germany's defeat in its wars. Amid instability and occupation, he founded the \"Rhenish Peoples' Union\" with to pursue independence from Germany. Despite the hesitation by some foreign authorities, he was ultimately granted his wish and made the new leader of a free Rhineland.§!"

### National Spirits ###
 RHI_rhenish_reparations: "Rhenish Reparations"
 RHI_rhenish_reparations_desc: "As part of their post war demands, the [ROOT.overlord.GetAdjective] government has commandeered the majority of industry within the Rhineland in order to provide reparations to the victorious side. Most men fit to work are expected to be in the factories, with only a token amount permitted to handle policing and act as local defence forces."

