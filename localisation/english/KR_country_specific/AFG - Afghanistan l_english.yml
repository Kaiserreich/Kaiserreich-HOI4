 AFG_abdul_rauf_benawa: "Abdul Rauf Benawa"
 AFG_abdul_rauf_benawa_sic_desc: "§YBorn:§! §LAugust 23rd, 1913, in Kandahar, Kandahar Vilayet, Emirate of Afghanistan§!"
 AFG_fazl_omar_mojadidi: "Fazl Omar Mojadidi"
 AFG_fazl_omar_mojadidi_sic_desc: "§YBorn:§! §Lin Kabul, Kabul Vilayet, Emirate of Afghanistan§!\n§YBackground:§! §LKnown by a great number of titles, the Sher Agha (Lion Lord), Hazrat Nur al-Mashayik (Holy Light of the Ulema), and the Mullah of Shor Bazaar (his organisation's headquarters); Fazl Omar Mojadidi is perhaps one of the most powerful non-royals in Afghanistan. As leader of Afghanistan's Naqshbandi Order, and widely recognised as the de facto leader of the Islamic establishment, he has frequently involved himself in politics, even prior to his accension to his current positions. While his brother was still leader, he proudly campaigned alongside Amanullah Khan to lead war against Britain, yet began to sour on the King as his reformist agenda quickly came to blows with the ulema's power.\n\nAfter his brother's death in 1925, leading to Fazl Omar replacing him as head of the family, it did not take long for plotting to begin. Although nothing was ever proven, many believe that Mojadidi had a hand in inciting the Khost rebellion, yet unlike other religious leaders he escaped unscathed from the subsequent crackdown. Eventually forced by mounting pressure by the King to leave Kabul in 1928, the subsequent Saqqawist uprising rather quickly allowed him to claw back his previous authority. Once more, although rumours persist of his role in the uprising, the King lacked evidence to act further against Mojadidi.\n\nEver since that day, he has been a constant thorn in the sides of both Amanullah and the reformist movement as a whole. Any proposes even bordering on liberal in nature are swiftly denounced by Mojadidi as syndicalist perversion, with many of his followers echoing his cries. Although his position for now remains unassailable, Amanullah Khan has long been patiently waiting for Mojadidi to make a large enough slipup to finally silence him for good.§!"

 AFG_abdul_rahman_mahmoodi: "Abdul Rahman Mahmoodi"
 AFG_abdul_rahman_mahmoodi_advisor_desc: "§YBorn:§! §L1909, in Kabul, Kabul Vilayet, Emirate of Afghanistan§!\n§YBackground:§! §LAbdul Rahman Mahmoodi's life has been defined by struggle. Born in a slum in Kabul, his family were former landowners who had lost their estate when they were exiled to Kashmir by Abdur Rahman Khan. Mahmoodi would pull himself into medicinal school, but the school's closure forced him to switch his academic studies to the Rushdia School, all while his mother passed away and his father struggled to maintain his job amid poverty and chronic illness. To help pay for the cost of care for his younger children, his father married Mahmoodi off to financially obligate her family to their well-being.\n\nStudying at Kabul University for a medical degree, he tentatively involved himself in politics. Eventually falling in with the heavily marginalised socialist organisations existent in Afghanistan, he has notably become a supporter of the organisation of workers in the textile Shirkats of Kandahar and Qataghan.§!"
 AFG_berthold_albert_speer: "Berthold Albert Speer"
 AFG_berthold_albert_speer_advisor_desc: "§YBorn:§! §LMarch 19th, 1905, in Mannheim, Mannheim District, Grand Duchy of Baden, German Empire§!\n§YBackground:§! §LAs an architectural graduate of the Technical College of Munich seeking work befitting such status, Berthold Albert Speer was the exact kind of man Amanullah Khan had been seeking to work on Darulaman. Arriving in Kabul a few years after Walter Harten's team began work, this young up-and-comer seemed to know exactly what to say to win the King's favour.\n\nConstantly impressing Amanullah with new ideas and building designs exactly as the King envisioned them, it is no surprise that Speer found himself made Harten's replacement upon the latter's retirement back to Germany. He has ever since been the King's chief architect, and primary lead on continued work on the capital. Although beginning to get homesick, having spent so many years away from Germany, Speer cannot imagine at this point leaving Darulaman behind, regarding the city as his magnum opus.§!"
