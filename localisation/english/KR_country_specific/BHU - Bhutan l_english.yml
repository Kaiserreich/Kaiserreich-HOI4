### Decisions ###
 BHU_reforms_decision_category: "Reforming Bhutan"
 BHU_reforms_decision_category_desc: "Bhutan lags far behind most of the nations of the world, with an army made up of barely trained and equipped peasant levies and a pre-industrial economy revolving around subsistence farming and craft workshops. To survive in the modern world, Bhutan will have to reform its feudal structures into something more stable and robust. To do this, Bhutan must deal with three different areas of reform:\nThe first is £legitimacy  §3Central Authority§! ([?BHU_feudal_unity|Y0]). This value represents the amount of control the central government of Bhutan is able to exert on the various Penlops, monastic orders, and isolated villages of the kingdom. Raising the authority of the government is key to gaining the resources necessary to enact reforms to the nation.\nThe second is £industry_texticon  §GEconomic Development§! ([?BHU_econ_dev|Y0]). This value represents the investments made by the government into the industrial workshops of the country. The more the government invests into the economy, however, the more these investments cost daily political power. In a desperate attempt to raise revenue, one can also lower the amount of investment into the economy, freeing up capital for other projects.\nThe third is £manpower_texticon  §RMilitary Investment§! ([?BHU_mil_invest|Y0]). This value represents the investments made by the government into arming and training the central army of the country. The more the government invests into the military, however, the more this army costs daily political power. In a desperate attempt to raise revenue, one can also lower the amount of investment into the military, freeing up capital for other projects.\nEach of these values can be £increase_texticon  raised or £decrease_texticon  lowered by a number of different events, focuses, and decisions. Be wise with your investments! A smart ruler knows to centralise the state before they begin to spend frivolously, and to invest in the army before jumping into a conflict.\n\n"

 BHU_feudal_timer: "Fading Control"
 BHU_feudal_timer_desc: "Bhutan is divided between various factions and forces, each vying for their own goals and ambitions. If left unattended, these forces would slowly tear the kingdom apart."
 BHU_deal_with_royalist_governors: "Deal with Royalist Governors"
 BHU_deal_with_royalist_governors_desc: "Some of the feudal governors remain stalwartly loyal to the memory of the Wangchuck monarchy, despite their outward oaths to the Zhabdrung. A few suspect courtiers, if properly motivated, would likely give us the information required to remove these worrisome old lords."
 BHU_undercut_popular_wangchuck_support: "Undercut Popular Wangchuck Support"
 BHU_undercut_popular_wangchuck_support_desc: "Despite their considerable failings, the old Wangchuck kings are remembered fondly by many small villages and hamlets, who often turned to the Druk Gyalpo for help against particularly tyrannical local lords. Eliminating the most vocal of those memorialising the old monarchy should send sufficient message to the rest."
 BHU_Increase_King_Authority: "Centralise Royal Authority"
 BHU_Increase_King_Authority_desc: "The power of the Wangchuck dynasty is built on their legitimacy, forged by generations of commanding rulers, who bent the noble and monasteries to their will. We should uphold this legacy, and likewise bend this generation of nobles and monasteries."
 BHU_Decrease_King_Authority: "Increase Penlop Privileges"
 BHU_Decrease_King_Authority_desc: "Until Ugyen Wangchuck (quite violently) united the feuding Penlops and Dzongpons, Bhutan was little more than a loose collection of petty tyrants, each nipping at each other over petty grievances. Perhaps it’s time to go back!"
 BHU_Increase_Mon_Authority: "Enforce Monastic Primacy"
 BHU_Increase_Mon_Authority_desc: "For more than a century, the secular leadership of Bhutan have scoffed at the monasteries ancient prerogatives over the rule and maintenance of the state. Let us give them a reminder of the Zhabdrung’s rulings, with force if necessary!"
 BHU_Decrease_Mon_Authority: "Promote Secular Bureaucrats"
 BHU_Decrease_Mon_Authority_desc: "Frankly, it is dreadfully difficult and dull to administer a nation. Sometimes it feels wasteful to ignore the cadres of bureaucrats from the old regime, even with the whispered rumours of dissent and plots. Who cares if their disloyal, so long as they are offering to do the job!"
 BHU_Increase_Econ_Development: "Fund Regional Development"
 BHU_Increase_Econ_Development_desc: "It is easy for the money of the central government to flow to the villages surrounding the capital. There, leadership can walk among their projects, inspecting them and ensuring that money actually went somewhere. The tricky part is bringing this notion of accountability to the provinces."
 BHU_Decrease_Econ_Development: "Ignore Local Corruption"
 BHU_Decrease_Econ_Development_desc: "It is pure folly to attempt to locate where every silver coin went, especially when an order from [BHU.GetLeader], and the accompanying funds, passes through a dozen hands before implementation. Each of those hands is working hard, and they deserve some compensation."
 BHU_Increase_Military_Investment: "Equip Specialised Units"
 BHU_Increase_Military_Investment_desc: "In the Bhutanese military, a specialized unit is a man who knows how to fire a rifle. A true specialist is a man who knows how to fire a machine gun. Should any men in Bhutan learn to aim a mortar, some conventions of naming may have to change."
 BHU_Decrease_Military_Investment: "Entrench Nepotistic Leaders"
 BHU_Decrease_Military_Investment_desc: "The notion of nepotism is confusing to the noble commanders of Bhutan. Why give a name to the way of the world? Of course, the progeny of great men should be given positions of power!"

 BHU_army_decision_category: "Defending the Himalayas"
 BHU_army_decision_category_desc: "Bhutan is the entryway into the Himalayas, a bulwark against the ever-increasing encroachment of the Nepalese and Indians. However, our army is notoriously poorly trained and equipped, destitute farmhands equipped with a patchwork assortment of obsolete and ancient weapon, led by officers selected for their noble blood, rather than their merit. Change will be needed if we hope to defend our homes from the foreign threat."
 BHU_organise_sikkim_buddhists: "Organize Sikkim Buddhists"
 BHU_organise_sikkim_buddhists_desc: "The Bhutia and Lepcha are united by their shared spiritual heritage. Red Hat monasteries, such as Rumtek and Bhutia Busty, serve as communal centers of resistance against the unrelenting tide of Nepalese Hindu aggression. By unifying the monasteries under the single political movement for Buddhist liberation, we can leverage their resources and influence!"
 BHU_parade_sikkim_exiles: "Parade Sikkim Exiles"
 BHU_parade_sikkim_exiles_desc: "Following the occupation of Sikkim by Nepal, western Bhutan has become the home of many of the small kingdom’s former rulers, administrators, and guardians. These figures have been stalwart in their support for Sikkimese liberation, and they have pledged to rise to lead any insurrection against Nepal. They must have the opportunity to display their patriotism and commitment to the Sikkimese cause publicly!"
 BHU_arm_bhutia_clans: "Arm Bhutia Clans"
 BHU_arm_bhutia_clans_desc: "Fiercely independent and violently insular, the Bhutia clans are the beating heart of Sikkimese society. Old rivalries and hierarchies have been forced aside by the domination of the Nepalese, however, and today every clan knows that they must either band together or acquiesce to their oppressors. We must only give them the tools to resist!"
 BHU_marshal_tibetan_adventurers: "Marshal Tibetan Adventurers"
 BHU_marshal_tibetan_adventurers_desc: "Recent sectarian conflict between the factions in Tibet has left more than a few soldiers branded as traitors, rebels, or bandits. While the vast majority of these men will simply melt into the countryside, more than a few recognize that there is opportunity available for hardened warriors on the borderlands of the Himalayas."
 BHU_promote_zamadar_chencho: "Promote Zamadar Chencho"
 BHU_promote_zamadar_chencho_desc: "Zamadar Chencho is trusted by most as a neutral and relatively apolitical military officer. It is for this reason, alongside his diligence and relative intelligence, that he is a promising candidate to serve as a quartermaster for our growing military."
 BHU_outsiders_and_outcasts: "Recruit Outsiders and Outcasts"
 BHU_outsiders_and_outcasts_desc: "Traditionally, those who are excluded from village life for past transgressions are not included in muster rolls, as these figures are neither respected nor trusted. While promoting these men will be unpopular, we cannot simply ignore this source of manpower because they are disliked!"
 BHU_son_from_every_family: "Demand a Son from Every Family"
 BHU_son_from_every_family_desc: "In times of crisis, the leaders of Bhutan called on each family to train one of their sons as a warrior. While this is seen as fairly extreme, and our ability to enforce this policy is limited, it will garner additional recruits."

 BHU_economy_decision_category: "Developing Bhutan"
 BHU_economy_decision_category_desc: "Bhutan is a nation trapped in time, but that does not mean we should not strive to achieve a degree of economic self-sufficiency and modernity. The proposals some of our most idealistic councilors may seem entirely unfeasible now, but much can happen in a decade, given enough grit and determination.\n\nWe currently have £anq_credibility [?BHU_corvee_cadre_amount] §YCorvee Cadre(s)§!.\n\n£decision_icon_small §HDecisions§! to §HDevelop Bhutan§! require both resources and manpower to complete. Bhutan relies on corvee labour, meaning that each £decision_icon_small §HDecision§! requires a £anq_credibility §YCorvee Cadre§! to complete. £anq_credibility §YCorvee Cadres§! are replenished after completion of each economic £decision_icon_small §HDecision§!.\n\n"
 BHU_sword_to_plowshares: "Beat Swords into Ploughshares"
 BHU_sword_to_plowshares_desc: "The notion of a citizen soldier is a given in Bhutan, where most soldiers are called up from their farms during times of struggle. While the formation of a standing army is still limited in scope, these men can be used to help develop our nation, while they are not busy defending it."
 CP_30_manpower_500: "£command_power §H30§! £manpower_texticon  §H500§!"
 CP_30_manpower_500_blocked: "£command_power §R30§! £manpower_texticon  §R500§!"
 CP_30_manpower_500_tooltip: "It costs $CP_30_manpower_500_blocked$ to take the decision"
 BHU_compel_labour: "Compel Additional Corvee Labourers"
 BHU_compel_labour_desc: "Corvee privileges are fundamentally important to the maintenance of our regime, making up the majority of the labour pool available for us to take advantage of. By stretching the limitations of our corvee prerogatives beyond their traditional scope, we can take advantage of new sources of peasant labour."
 BHU_open_the_marketplaces: "Open the Marketplaces"
 BHU_open_the_marketplaces_desc: "There are few, if any, marketplaces in Bhutan. Most business is conducted informally person to person, though village centers do often take on the role as a meeting place between barterers. Opening a few designated marketplaces in major population centers, with certain protections granted to merchants by the state, may promote trade."
 BHU_circulate_foreign_coinage: "Circulate Foreign Coinage"
 BHU_circulate_foreign_coinage_desc: "With incredibly limited domestic currency, more sophisticated merchants and tradesmen rely on foreign coins to handle complex transactions outside of the traditional barter economy. Pulling currency through increased trade with the outside world can help to promote additional formal transactions."
 BHU_local_iron_development: "Local Iron Development"
 BHU_local_iron_development_desc: "The countryside of Bhutan is dotted with small local iron mines, often taking advantage of specific veins of iron ore. Certain richer deposits of iron are underutilised, and determined mining efforts may result in greater, nationally significant, returns."
 BHU_dagana_sarpang_coal_mines: "Expand Dagana and Sarpang Coal Mining"
 BHU_dagana_sarpang_coal_mines_desc: "Coal resources in Bhutan are relatively scarce, meaning that coal cannot be relied upon to fuel further economic development. However, there are some sources of coal in Dagana and Sarpang which, if properly developed, may allow for more widespread use."
 BHU_dholpani_bhurkhola_tungsten_mines: "Expand Dholpani and Bhurkhola Tungsten Mining"
 BHU_dholpani_bhurkhola_tungsten_mines_desc: "Among the myriad minerals which can be found in the mountainsides of Bhutan, copper and tungsten are some of the most worthwhile for export focused exploitation. Tungsten deposits in Dholpani and Bhurkhola are sizable enough to warrant increased development."
 BHU_lateral_road_start: "From Phuentsholing to Punakha"
 BHU_lateral_road_start_desc: "Starting in the Duar foothills, the first section of the Lateral Road will build on existent merchant paths which push from Assam into central Bhutan. Connecting Phuentscholing, and thus, India, to the major political centers of Punakha and Talo provide for a good starting point for the broader Lateral Road project."
 BHU_lateral_road_east: "Connect Paro to the Lateral Road"
 BHU_lateral_road_east_desc: "As the second largest center of population and economic development in Bhutan, Paro, lying to the west of Punakha, will be connected to the Lateral Road, replacing the piecemeal trails and pathways which have long linked it to central Bhutan."
 BHU_lateral_road_west: "Extend the Lateral Road to Jakar"
 BHU_lateral_road_west_desc: "Located in the eastern province of Bumthang, the small town of Jakar marks the end of the Lateral Road’s western push. While additional extensions may be attempted in the future, Jakar’s central location makes it a good endpoint for our current attempts to unite the nation."
 BHU_import_machine_tools: "Import Machine Tools"
 BHU_import_machine_tools_desc: "No factory can function without modern machine tools, developed through advanced methods of metallurgy and precise construction. Unfortunately, we will need to import these tools if we could ever hope to make our own machine tools in the future."
 BHU_steal_blueprints: "Procure Modern Blueprints"
 BHU_steal_blueprints_desc: "Several advances in industrial techniques and models have been discovered in foreign lands, advances which are outside of the reach of our own master craftsmen. To study these new developments, we will either need to buy or otherwise “procure” these modern designs."
 BHU_build_water_mills: "Build New Water Mills"
 BHU_build_water_mills_desc: "The issue of power is one which plagues Bhutan, as there are few domestic sources of power, aside, of course, from its plentiful and powerful waterways. Building new water mills will allow us to harness this power as the foundation of new economic developments."
 BHU_renovate_punakha: "Renovating the Capital"
 BHU_renovate_punakha_desc: "Punakha Dzong is the heart of our kingdom, but over decades of neglect the palace has fallen into a state of disrepair. Significant renovations will be needed to bring it back to its former glory."

 BHU_smuggling_decision_category: "Smuggling Operations"
 BHU_china_smuggling_decision: "Leverage Chinese Warlord Connections"
 BHU_china_smuggling_decision_desc: "There are many characters of dubious moral backbone among the rogue’s gallery of petty Chinese warlords. Weapon smuggling is a key source of personal monetary gain for those with command of soldiers, and supplies delivered from centers of power and foreign benefactors are quickly funneled into the waiting hands of a veritable army of gunrunners and crooked merchants. These men would be more than happy to deliver us weaponry, at a price."
 BHU_china_smuggling_bribe: "Forge Closer Ties with our Chinese Contacts"
 BHU_china_smuggling_bribe_desc: "Even consummate professionals have preferences, and it is no secret that our Chinese contacts would rather be hawking their wares in the busy marketplaces of Hong Kong, as opposed to the arduous roads of Tibet and Bhutan. Perhaps we can soften their distaste for our homeland with the right words and the right bribes."
 BHU_china_smuggling_strengthen: "Strengthen the Northern Smuggling Route"
 BHU_china_smuggling_strengthen_desc: "Our smuggling contacts in China must trek hundreds of miles to reach our borders, often harried by bandits and local lordlings. Making inroads with those who rule the route they travel may help to ease their hardships."
 BHU_india_smuggling_decision: "Tap Friendly Indian Gunrunners"
 BHU_india_smuggling_decision_desc: "The recent conflict on the Indian subcontinent has rapidly elevated minor bureaucratic and military figures to newfound power and prominence, alongside a monumental influx of new arms and materiel. Certain figures have managed to tap into these recent changes to create a new and lucrative trade of illicit armaments."
 BHU_india_smuggling_bribe: "Forge Closer Ties with our Indian Contacts"
 BHU_india_smuggling_bribe_desc: "Smugglers are wary folks by nature, and they broadly view us as backward bumpkins to be taken advantage of, rather than as equal partners. Perhaps we could change this perception with the right words and the right bribes."
 BHU_india_smuggling_strengthen: "Strengthen the Southern Smuggling Route"
 BHU_india_smuggling_strengthen_desc: "While our smuggling operations in India are neither admitted nor tolerated by our counterparts to the south, a few well placed bribes and foreign connections may help to grease the wheels."

 BHU_attack_tibet: "Revenge of the Red Hats"
 BHU_attack_tibet_desc: "The Yellow Hat sect, which dominates the Tibetan realm, is the youngest of the four major schools of Tibetan Buddhism. Even still, they look down upon our native Red Hat sects with derision and fear. We will show them the error of their ways, on the battlefield."
 BHU_attack_nepal: "Confront the Gorkhas"
 BHU_attack_nepal_desc: "Nepal has long harboured exiles and dissidents from Bhutan, giving them a base to stir up trouble in our realm. The reason for their support is clear - they covet our lands. We must move to cleanse these lands from this dangerous regime."
 BHU_sikkim_preparation_timer: "Preparing for Conflict in Sikkim"
 BHU_sikkim_preparation_timer_desc: "The situation in Sikkim is deteriorating fairly quickly, as sectarian violence escalates. The native Bhutia and Lepcha peoples have been horrifically subjugated by the Nepalese invaders for far too long, they yearn to cast off the oppressor’s boot!"
 BHU_sikkim_war_timer: "The Fight for Sikkim"
 BHU_sikkim_war_timer_desc: "The fighting in Sikkim is highly unpopular for the regime in Nepal, and if we can maintain control of the area for long enough, they will likely be forced to the negotiating table."
 BHU_Integrate_Nepal: "Integrate Sikkim"
 BHU_Integrate_Nepal_desc: "While much of Sikkim is populated by the Nepalese, migrants to the region in recent years, the native Bhutia and Lepcha peoples are brothers to us Bhutanese. As liberators of these noble peoples from years of Nepalese oppression, it will be easy to bring this ancient kingdom into our fold."

 BHU_country_namechange_decision: "Proclaim the Thunder Dragon Empire"
 BHU_country_namechange_decision_desc: "With victory after victory against our neighbours, we have cemented ourselves as the preeminent power in the Himalayas. Leveraging our connections within the administrative backbone of the old Tibetan regime, we shall forge a new Buddhist Empire in the mountains, one which will carry forward the legacy of the great Namgyal Ngawang!"

### Parties ###

 BHU_totalist_party: "DNC"
 BHU_totalist_party_long: "Druk National Congress (Maximists)\n§LA club of noble exiles, socialists, and Indian agents, the Druk National Congress is a collection of misfits. Founded in Calcutta following a crackdown against radical Gewog leaders, the Congress has done very little since its creation. However, the rise of Subhas Chandra Bose has brought about increased Indian investment into the DNC, intending to use this collection of dissidents to destabilise Bhutan. The Maximist faction is intensely devoted to Bose and prioritises destruction of reactionary elements in the country and loyalty to the Republic.§!\n"
 BHU_syndicalist_party: "DNC"
 BHU_syndicalist_party_long: "Druk National Congress (Internationalists)\n§LA club of noble exiles, socialists, and Indian agents, the Druk National Congress is a collection of misfits. Founded in Calcutta following a crackdown against radical Gewog leaders, the Congress has done very little since its creation. However, the rise of Subhas Chandra Bose has brought about increased Indian investment into the DNC, intending to use this collection of dissidents to destabilise Bhutan. The Internationalist faction is made up of those members who travelled to France and Britain to petition for aid. They are most interested in connecting Bhutan with the outside world.§!\n"
 BHU_radical_socialist_party: "DNC"
 BHU_radical_socialist_party_long: "Druk National Congress (Revolutionaries)\n§LA club of noble exiles, socialists, and Indian agents, the Druk National Congress is a collection of misfits. Founded in Calcutta following a crackdown against radical Gewog leaders, the Congress has done very little since its creation. However, the rise of Subhas Chandra Bose has brought about increased Indian investment into the DNC, intending to use this collection of dissidents to destabilise Bhutan. The Revolutionary faction is the strongest within the party, and advocates for the end of serfdom and the creation of a new socialist republic in the Himalayas.§!\n"
 BHU_social_democrat_party: "BSC"
 BHU_social_democrat_party_long: "Bhutan State Congress\n§LFounded by a handful of Lhotshampa intellectuals, the Bhutan State Congress is a movement attempting to create a Lhotshampa political awakening in the southern regions of Bhutan. They have not found much success in their endeavours, with the oppressed Nepalese minority remaining sceptical of these political idealists, and the ruling authorities quick to stamp out dissent.§!\n"
 BHU_social_liberal_party: "Jai Gorkha"
 BHU_social_liberal_party_long: "Jai Gorkha\n§LFounded in the Indian states bordering southern Bhutan, Jai Gorkha is an underground political movement that aims to create a new state for the Nepalese, called Gorkhaland. This group has found many in Bhutan's Nepalese Lhotshampa community who are interested in this state-building project, and it has become the leading voice for this oppressed minority.§!\n"
 BHU_market_liberal_party: "Radicals"
 BHU_market_liberal_party_long: "Druk Gyalpo (Radicals)\n§LThe Radicals are a small group of court officials who are committed to bringing more democratic reform to Bhutan. While they share goals with the Reformist faction in court, they believe that the reforms offered by said faction are too limited and often chafe against Sonam Topgye Dorji's dominant position in that faction. With little support among any of the reigning powers in Bhutan, there is little chance that they will be able to act as anything more than a vocal opposition.§!\n"
 BHU_social_conservative_party: "Zhung Dratshang"
 BHU_social_conservative_party_long: "Zhung Dratshang (Loyalists)\n§LThe Zhung Dratshang is a council of monks from across the country, united in the goal of furthering monastic interests. They are led by the five learned masters, the Lopens, each an expert in a different theological field, and their leader the Je Khenpo. Having ruled over the country in the days before the central monarchy, even in the years following the body has long served to advise the rulers of Bhutan, promoting stability and traditional Buddhism.§!\n"
 BHU_authoritarian_democrat_party: "Reformists"
 BHU_authoritarian_democrat_party_long: "Druk Gyalpo (Reformists)\n§LThe Reformists are a collection of nobles and court officials who advocate for a series of reforms meant to modernise the Kingdom of Bhutan. While fiercely loyal to the power of the king, they hope to devolve some powers from the aristocracy to the Gewog village elders, while retaining the power of the central monarchy. Their base of power is centred around the king's Gongzim minister, Sonam Topgye Dorji. Through his influence, they have become the second most powerful faction in the country, with the king slowly subscribing to this more reform-minded approach to ruling.§!\n"
 BHU_paternal_autocrat_party: "Traditionalists"
 BHU_paternal_autocrat_party_long: "Druk Gyalpo (Traditionalists)\n§LThe Traditionalists are a broad collection of Penlops, minor nobles, officials and military leaders loyal to the King and devoted to the maintenance of the status quo. They are supportive of the reigning Druk Gyalpo but seek primarily to expand the power of the Penlops at the expense of the central authorities. The Traditionalists are strictly opposed to the reforms proposed by Sonam Topgye Dorji and his clique of court loyalists, seeing them as a direct affront to feudalism in Bhutan.§!\n"
 BHU_national_populist_party: "Monastic Dissenters"
 BHU_national_populist_party_long: "Zhung Dratshang (Dissenters)\n§LThe Zhung Dratshang is a council of monks from across the country, united in the goal of furthering monastic interests. They are led by the five learned masters, the Lopens, each an expert in a different theological field, and their leader the Je Khenpo. The recent rise of the Zhabdrung Rinpoche Jigme Dorji has led many of the younger monks of the council to turn their backs on the peace promised by the reigning Druk Gyalpo. They instead seek to reassert the traditional prerogatives of the monks and their supreme Lama.§!\n"

### Created Parties ###

 BHU_revolting_natpop_party: "Zhabrung's Conspiracy"
 BHU_revolting_natpop_party_long: "Zhung Dratshang (Dissenters)\n§LGathering behind the rising star of the young Zhabdrung Rinpoche, the Young Monk Movement is a collection of monks who have chafed under the rule of the Druk Gyalpo and their lackeys in the upper echelons of the Zhung Dratshang. These more radical monks have been joined by snubbed courtiers and political outcasts from across Bhutan, forming a growing army of the angry and dispossessed, all clamoring for the overthrow of the monarchy.§!\n"
 BHU_zhabdrungs_natpop_party: "Monastic Radicals"
 BHU_zhabdrungs_natpop_party_long: "Zhung Dratshang (Radicals)\n§LWhile the Zhabdrung Rinpoche has been the official leader of Bhutan for the last three hundred years, they have had no real power since the days of Bhutan's founder, Zhabdrung Ngawang Namgyal. The most recent incarnation of the ancient lama has spent years cultivating support among those who felt abandoned by the short-lived monarchy. Disappointed with the Zhabdrung’s acceptance and integration of the old religious elite, the most radical members of this vast and unwieldy coalition have banded together to force more extreme change, seeking to fully revolutionize Bhutanese society.§!\n"
 BHU_zhabdrungs_pataut_party: "Zhabdrung Loyalists"
 BHU_zhabdrungs_pataut_party_long: "Zhung Dratshang (Loyalists)\n§LWhile the Zhabdrung Rinpoche has been the official leader of Bhutan for the last three hundred years, they have had no real power since the days of Bhutan's founder, Zhabdrung Ngawang Namgyal. The most recent incarnation of the ancient lama has spent years cultivating support among those who felt abandoned by the short-lived monarchy. In doing so he created a broad coalition of conservative monks and impoverished villagers, snubbed courtiers and political outcasts. It is at the head of this unwieldy alliance that Zhabdrung Jigme Dorji rules Bhutan, and he will have to make sure the house of cards he built for twenty years does not fall out from under him.§!\n"
 BHU_zhabdrungs_authdems_party: "Royalist Remnants"
 BHU_zhabdrungs_authdems_party_long: "Druk Gyalpo (Remnants)\n§LWith the death of King Jigme and the Thunder Dragon monarchy, the remnants of the late king’s supporters have coalesced around the old favourites of the former Gongzim minster Sonam Topgye. With Sonam Topgye and the “rightful” heir hiding in exile, these bureaucrats and minor lords plot for the day when they can rise up in support of the young Wangchuck prince, making them a dangerous fifth-column if ignored. In the absence of any unifying figure, however, this clandestine resistance is disorganised and listless.§!\n"
 BHU_zhabdrungs_soccons_party: "Zhung Dratshang"
 BHU_zhabdrungs_soccons_party_long: "Zhung Dratshang (Old Guard)\n§LFollowing the victory of the Zhabdrung Rinpoche, the Lopen masters and Je Khenpo have been left in the political wilderness. Distrusted by their monastic colleagues for their longstanding support for the monarchy, but granted significant de-jure power in the traditional monastic hierarchy, these old men have been largely ignored, frozen out of a political process which increasingly revolves around the Zhabdrung’s inner circle.§!\n"
 BHU_zhabdrungs_marlibs_party: "Democratic Resistance"
 BHU_zhabdrungs_marlibs_party_long: "Druk Gyalpo (Resistance)\n§LAmong the Zhabdrung’s initial supporters were some idealists, who believed that his ascension would bring about a new, more democratic, Bhutan. When the death of King Jigme and the rise of Zhabdrung Jigme Dorji brought no such reform, these radicals turned against their new liege, instead seeking to bring about the return of the young Wangchuck prince. With next to no support and with little political capital, these bureaucrats are little threat the Zhabdrung’s regime, but if left undealt with, they may grow into a force worth trampling out.§!\n"
 BHU_remnant_natpop_party: "Remnant Dissenters"
 BHU_remnant_natpop_party_long: "Zhung Dratshang (Dissenters)\n§LWith the death of the Zhabdrung, the monastic dissenters have been left largely rudderless, unable to find a new figure to unite behind. While politically declawed, these monks have not simply disappeared. They continue to chafe against the perceived slights levelled against them by the monarchy and the Je Khenpo, agitating for the resumption of certain ancient privileges enjoyed by the monasteries and the reassertion of the Zhung Dratshang as a leading political force in the kingdom.§!\n"

 BHU_nep_party_change_tooltip: "§OGorkhaland Nationalists§! and the §SBhutan State Congress§! will merge with Nepali nationalists to form a new, dangerous political movement.\n"
 BHU_nepali_national_congress_party: "Nepali National Congress"
 BHU_nepali_national_congress_party_long: "Nepali National Congress\n§LModelled after the Indian Nationalist movement and built on the foundations of the anti-Rana Nepal Praja Parishad intellectual party, the Nepali National Congress has quickly become the leading voice of the resistance to our rule in Nepal. They are ideologically incoherent but united by their hatred of Bhutanese rule and continued aristocratic excesses.§!\n"
 BHU_tib_party_change_tooltip: "The §oBhutan§! §rNational§! §oCongress§! will be subsumed by the remnants of Tibetan leftism, while the §mradicals§! in our realm will join with foreign dissidents to forge a new opposition party.\n"
 BHU_sacred_union_party: "Sacred Union Party"
 BHU_sacred_union_party_long: "Sacred Union Party\n§LThe insanity of the Sacred Union movement has alienated all but the most radical monks and peasants in Tibet. Even still, the wild rise of the Bhutanese state has led to a new chapter for this movement, who have made a name as prominent opponents of the overreaches of this new colonial government.§!\n"
 BHU_tibet_improvement_party: "Tibet Improvement Party"
 BHU_tibet_improvement_party_long: "Tibet Improvement Party\n§LInspired by Chinese social and nationalist thought, the Tibet Improvement Party seeks to bring the new empire of the Himalayas into the twentieth century, by the bayonet point if needed. Guided by the Three Principles of the People, these revolutionaries chafe under yet another monarchical dictatorship.§!\n"
 BHU_young_drukpa_party: "Young Drukpa Party"
 BHU_young_drukpa_party_long: "Young Drukpa Party\n§LThe champions of a new future of enlightened aristocratic rule in the Himalayas, the Young Drupkas have drawn their support from fringe members of the Bhutanese civil service, forward looking aristocrats of Tibet, and those unsettled by the new Bhutanese status quo.§!\n"

