### Characters
 NGF_minna_fasshauer: "Minna Faßhauer"
 NGF_minna_fasshauer_leader_desc: "§YBorn:§! §LOctober 10th, 1875, in Bleckendorf, Province of Saxony, Kingdom of Prussia, German Empire§!\n§YBackground:§! §LBorn Minna Nikolai to a humble family of labourers, her father died when she was only three and she was forced to work part time even as a child - a formative experience that helped inform her of the \"causes of widespread misery\" and also fight for female equality. She also taught herself how to read and write as an adult. In the process she encountered socialist publications and also met her husband, Johannes Georg Faßhauer. Despite her humble origins, she played a major role in the local fight to allow women to participate in politics - taking it nationally after joining the SPD in 1903.\n\nThe party split during the Great War, and she grew disenchanted with the \"Burgfrieden\" policy of the SPD and trade unions, instead aligning with Rosa Luxemburg and Karl Liebknecht' s anti-war and socialist rhetoric. She joined the Brunswick Spartacus League in 1916 and participated in strikes in 1917.\n\nShe joined the Socialist Party of Germany (SP) after the war and was an active participant in their local activities - particularly in Braunschweig. She is said to be a member of the \"Red Fighters\" group (GRK) led by Karl Schröder, a major component of the SP's actionist left wing. A frequent target of government surveillance and harassment, she nevertheless persisted and aided in the reorganisation of the left after the most recent war. As a result, she was tapped to lead the provisional government established by socialist powers occupying the region.§!"

 NGF_gustav_noske: "Gustav Noske"
 NGF_gustav_noske_leader_desc: "§YBorn:§! §LJuly 9th, 1868, in Brandenburg an der Havel, Province of Brandenburg, Kingdom of Prussia, North German Confederation§!\n§YBackground:§! §LBorn to a weaver from Russian Poland, Gustav Noske was a basket maker as a youth who experienced the harsh conditions in Saxony, Hesse, the Netherlands and other cities he worked in as a journeyman. This pushed him to become a journalist and at 17 he helped found a local basket makers' association that soon later merged into the German Woodworkers' Union. He helped lead a strike in the factory he worked at, joining the SPD a few years later in 1884. He also became editor of the Brandenburg Newspaper and later Königsberg People's Tribune.\n\nHis work gained him a following, and he was elected to the Reichstag in 1906 at age 37, representing the Chemnitz constituency. A specialist in colonial and military affairs (Despite his lack of military experience), where frictions emerged over his tacit endorsement of German colonial and defense policies. This may have helped him advance however, when his rebuttal against War Minister Karl Von Einem's attacks on the SPD gained him attention (and condemnation from the left wing). Sitting on the right of the SPD, his influence within the party gradually declined and he continued to clash with his peers. The end of the most recent war has brought the elderly Noske out of his de facto exile, serving at the helm of a north german government.§!"

 NGF_heinrich_langwost: "Heinrich Langwost"
 NGF_heinrich_langwost_leader_desc: "§YBorn:§! §LApril 15th, 1874, in Pattensen, Province Hanover, Kingdom of Prussia, German Empire§!\n§YBackground:§! §LBorn to a wheelwright, Langwost was educated by private tutors and became a newspaper editor as well as an employee for a wool scouring and combing company in Hanover. In 1903 he became a figure of the German-Hanoverian Party (DHP), popularly known as the Guelphs. Considered more democratic than his peers, he first ran for Reichstag in 1912 but lost. He also served in the Great War.\n\nAfter the war's conclusion, he won an election to the Reichstag in 1919 as an independent. He was expelled by the DHP in 1925 but later re-instated. Later he also served on the Hanover City Council. Outside of politics, his contributions to literature included \"Under a Yellow and White Banner\" and many pieces with Guelph and Germanic themes. Langwost founded and led the Greater German Order \"Henry the Lion\" which advocated for self-determination of Lower Saxony on a democratic and progressive basis. With few alternatives available, occupation authorities were able to convince him to helm the new government in northern Germany.§!"

 NGF_ernst_august_von_braunschweig: "Ernst August von Braunschweig"
 NGF_ernst_august_von_braunschweig_leader_desc: "§YBorn:§! §LNovember 17th, 1887, in Penzing, Vienna, Archduchy of Austria below the Enns, Austria-Hungary§!\n§YBackground:§! §LThe youngest child of the former Crown Prince of Hanover Ernst August, the younger Ernst August entered a complicated dynastic situation. His great-grandfather King Ernst August inherited the Kingdom of Hanover because salic law prevented Queen Victoria of the United Kingdom from doing so, but his grandfather George V was deposed after the Austro-Prussian War when Prussia annexed the Kingdom. His father, then Crown Prince, refused to renounce the throne and consequently when the reigning duke of Brunswick died Chancellor Otto von Bismark successfully blocked him from ascending. Brunswick was ruled by a series of regents for the next few decades.\n\nIn 1912, Ernst August's elder brother was killed in a car accident and while representing his family to Emperor Wilhelm II he met and fell in love with Princess Victoria Louise. They married in 1913 in a grand ceremony attended by many European sovereigns, the last major gathering before the outbreak of the Great War. His father also formally renounced his claims to the Duchy of Brunswick in favor of him, allowing him to ascend to the Dukedom.\n\nDuring the Great War he served as a cavalry commander. Afterwards he remained largely aloof from politics though is said to consort with conservative and sometimes reactionary figures in private. A former British prince, he and his wife have sought to mend ties between Germany and the United Kingdom though this came to little fruition before the British Revolution.§!"

