 BHU_druk_forbal_flag: "We have chosen to undermine the traditional power brokers of our court."
 BHU_druk_foctech_flag: "We have focused our energies towards equipping and training our army."
 BHU_druk_exp_flag: "We have focused our energies towards expanding our recruitment to the territories."

